model_list:
  - model_name: gemini-flash
    litellm_params:
      model: vertex_ai/gemini-1.5-flash
      vertex_project: ${VERTEX_PROJECT_1}
      vertex_location: ${VERTEX_LOCATION_1}
      temperature: 0.4
  - model_name: gemini-flash-alt
    litellm_params:
      model: vertex_ai/gemini-1.5-flash
      vertex_project: ${VERTEX_PROJECT_2}
      vertex_location: ${VERTEX_LOCATION_2}
      temperature: 0.4
  - model_name: claude-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-latest
  - model_name: gpt-4o-mini
    litellm_params:
      model: openai/gpt-4o-mini
  - model_name: ollama-qwen
    litellm_params:
      model: ollama/qwen2.5-coder:latest

routing:
  - match: { tags: ["bulk"] }
    route: { model_name: gemini-flash }
  - match: { tags: ["code_intent"] }
    route: { model_name: claude-sonnet }
  - match: { tags: ["offline"] }
    route: { model_name: ollama-qwen }

general_settings:
  master_key: ${LITELLM_MASTER_KEY:-nyra-dev}
  enable_openai_compatible_endpoints: true
