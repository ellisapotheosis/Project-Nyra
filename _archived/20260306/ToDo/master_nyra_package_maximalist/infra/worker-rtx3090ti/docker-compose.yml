version: "3.9"

name: nyra-worker-rtx3090ti

services:
  redis:
    image: redis:7-alpine
    container_name: nyra-3090-redis
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"

  lmcache:
    build: .
    image: nyra-worker-rtx3090ti:latest
    container_name: nyra-3090-lmcache
    restart: unless-stopped
    depends_on:
      - redis
    command: [
      "bash", "-c",
      "python -m lmcache.server --port ${LM_CACHE_PORT:-9000} --remote_url redis://redis:6379 --chunk_size ${LMCACHE_CHUNK_SIZE:-256}"
    ]
    ports:
      - "${LM_CACHE_PORT:-9000}:9000"
    environment:
      LM_CACHE_PORT: ${LM_CACHE_PORT:-9000}
      LMCACHE_CHUNK_SIZE: ${LMCACHE_CHUNK_SIZE:-256}
    volumes:
      - lmcache_data:/root/.cache/lmcache

  vllm:
    build: .
    image: nyra-worker-rtx3090ti:latest
    container_name: nyra-3090-vllm
    restart: unless-stopped
    runtime: nvidia
    environment:
      MODEL_NAME: ${MODEL_NAME}
      VLLM_PORT: ${VLLM_PORT:-8000}
      GPU_MEMORY_UTIL: ${GPU_MEMORY_UTIL:-0.88}
      MAX_MODEL_LEN: ${MAX_MODEL_LEN:-16384}
      TP_SIZE: ${TP_SIZE:-1}
    command: ["/workspace/start_vllm.sh"]
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - models:/workspace/models
      - hf_cache:/root/.cache/huggingface
    depends_on:
      - lmcache
    shm_size: 12g
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: nyra-3090-dcgm
    restart: unless-stopped
    ports:
      - "9400:9400"
    environment:
      DCGM_EXPORTER_LISTEN: ":9400"
      DCGM_EXPORTER_KUBERNETES: "false"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: ["gpu"]

volumes:
  redis_data:
  lmcache_data:
  models:
  hf_cache: