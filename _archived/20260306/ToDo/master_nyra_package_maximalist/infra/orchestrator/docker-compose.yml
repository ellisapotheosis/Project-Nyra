name: nyra-orchestrator

x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}

volumes:
  # Core
  postgres_data: {}
  redis_data: {}
  mongo_data: {}

  # Observability
  grafana_data: {}
  prometheus_data: {}
  loki_data: {}

  # Workflows
  n8n_data: {}
  activepieces_data: {}

  # Knowledge / memory
  falkordb_data: {}
  letta_pgdata: {}

  # CRM
  twenty_server_local_data: {}
  twenty_docker_data: {}
  twenty_postgres_data: {}

  # Admin / secrets
  pgadmin_data: {}
  infisical_db_data: {}
  infisical_redis_data: {}

  # Claude-flow / ruvector
  ruvector_pg_data: {}
  claude_flow_data: {}
  claude_flow_agentdb: {}
  claude_flow_neural: {}

services:
  # -------------------------------------------------------------------------
  # Core data layer
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-America/New_York}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - "sh"
      - "-lc"
      - "redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory ${REDIS_MAX_MEMORY:-2gb} --maxmemory-policy allkeys-lru"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  mongo:
    image: mongo:7
    container_name: nyra-mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # Optional pgAdmin GUI for Postgres (enable with: --profile admin)
  pgadmin:
    image: dpage/pgadmin4:9.8
    container_name: nyra-pgadmin
    profiles: ["admin"]
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # Gateway layer: Nexus (MCP + LLM router) + LiteLLM (model gateway)
  # -------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nyra-litellm
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      # LiteLLM reads most routing from the YAML config.
      LITELLM_CONFIG_FILE: /app/config.yaml
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      # Optional: persist usage metrics to Postgres.
      DATABASE_URL: ${LITELLM_DATABASE_URL:-}
      # Forwarded provider keys (optional — can also be injected via Infisical)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  nexus:
    build:
      context: ./nexus
      dockerfile: Dockerfile
    image: nyra-nexus:local
    container_name: nyra-nexus
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    ports:
      - "${NEXUS_PORT:-8000}:8000"
    environment:
      # Keys for direct cloud-provider routing (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      # Auth
      NEXUS_JWT_SECRET: ${NEXUS_JWT_SECRET:-dev-jwt-secret}
      NEXUS_ADMIN_TOKEN: ${NEXUS_ADMIN_TOKEN:-dev-admin-token}
      # Tokens for MCP servers (optional)
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      ACTIVEPIECES_API_KEY: ${ACTIVEPIECES_API_KEY:-}
      # Redis caching backend for Nexus
      NEXUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      # LiteLLM upstream (used as a “local” provider)
      LITELLM_BASE_URL: http://litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ./nexus/nexus.toml:/etc/nexus.toml:ro
      - ./nexus/intelligent-routing-config.json:/etc/nyra/intelligent-routing-config.json:ro
      # Allow Docker-based MCP servers (n8n MCP, github MCP, etc.)
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: project workspace mounted for filesystem tools
      - ${NEXUS_PROJECTS_DIR:-../..}:/projects:rw
    healthcheck:
      test: ["CMD", "sh", "-lc", "wget -qO- http://localhost:8000/health | grep -qi ok"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # Workflow / automation
  # -------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_PORT: "5678"
      N8N_HOST: ${N8N_HOST:-orchestrator.trex-fiordland.ts.net}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://${N8N_HOST:-orchestrator.trex-fiordland.ts.net}:5678/}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nyra}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/opt/nyra/n8n-workflows:rw
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    environment:
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?set ACTIVEPIECES_ENCRYPTION_KEY}
      AP_ENVIRONMENT: "prod"
    ports:
      - "${ACTIVEPIECES_PORT:-8082}:80"
    volumes:
      - activepieces_data:/root/.activepieces
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # Knowledge graph + memory manager (FalkorDB + Graphiti MCP + Letta)
  # -------------------------------------------------------------------------
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    ports:
      - "${FALKORDB_PORT:-6379}:6379"
      - "${FALKORDB_UI_PORT:-3006}:3000"
    volumes:
      - falkordb_data:/data
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  graphiti-mcp:
    image: falkordb/graphiti-knowledge-graph-mcp:latest
    container_name: nyra-graphiti-mcp
    depends_on:
      - falkordb
    ports:
      - "${GRAPHITI_MCP_PORT:-8005}:8000"
    environment:
      DATABASE_TYPE: falkordb
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      MODEL_NAME: ${GRAPHITI_MODEL_NAME:-gpt-4o-mini}
      GRAPHITI_TELEMETRY_ENABLED: "false"
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  letta:
    image: letta/letta:latest
    container_name: nyra-letta
    ports:
      - "${LETTA_PORT:-8283}:8283"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      # Optional: point Letta at Nexus/LiteLLM instead of OpenAI.
      # OPENAI_BASE_URL: http://nexus:8000/llm/v1
    volumes:
      - letta_pgdata:/var/lib/postgresql/data
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # CRM: Twenty (server + db). MCP server is provided as a separate container.
  # -------------------------------------------------------------------------
  twenty-db:
    image: postgres:16-alpine
    container_name: nyra-twenty-postgres
    environment:
      POSTGRES_USER: ${TWENTY_PG_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD:?set TWENTY_PG_PASSWORD}
      POSTGRES_DB: ${TWENTY_PG_DB:-default}
    volumes:
      - twenty_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_PG_USER:-twenty} -d ${TWENTY_PG_DB:-default}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  twenty:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    container_name: nyra-twenty
    depends_on:
      twenty-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${TWENTY_PORT:-3004}:3000"
    volumes:
      - twenty_server_local_data:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: "postgres://${TWENTY_PG_USER:-twenty}:${TWENTY_PG_PASSWORD}@twenty-db:5432/${TWENTY_PG_DB:-default}"
      SERVER_URL: ${TWENTY_SERVER_URL:-http://orchestrator.trex-fiordland.ts.net:${TWENTY_PORT:-3004}}
      REDIS_URL: "redis://:${REDIS_PASSWORD}@redis:6379"
      STORAGE_TYPE: ${TWENTY_STORAGE_TYPE:-local}
      STORAGE_LOCAL_PATH: ${TWENTY_STORAGE_LOCAL_PATH:-/app/docker-data}
      APP_SECRET: ${TWENTY_APP_SECRET:?set TWENTY_APP_SECRET}
      DISABLE_DB_MIGRATIONS: ${TWENTY_DISABLE_DB_MIGRATIONS:-}
      DISABLE_CRON_JOBS_REGISTRATION: ${TWENTY_DISABLE_CRON_JOBS_REGISTRATION:-}
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # Twenty CRM MCP server is a stdio MCP server.
  # Build the image in ./mcp/twenty-crm-mcp-server, then let Nexus run it as a
  # Docker-based MCP server (via /var/run/docker.sock).

  # -------------------------------------------------------------------------
  # Observability
  # -------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nyra-cadvisor
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # Optional / advanced stacks (profiles)
  # -------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    profiles: ["edge"]
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR:?set CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR}
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # -------------------------------------------------------------------------
  # Secrets management (Infisical) — optional profile
  # Infisical's docs recommend running with Postgres + Redis as dependencies.
  # Enable with: `docker compose --profile secrets up -d` or `make up-all`.
  # -------------------------------------------------------------------------
  infisical-db:
    image: postgres:16-alpine
    container_name: nyra-infisical-db
    profiles: ["secrets"]
    environment:
      POSTGRES_USER: ${INFISICAL_DB_USER:-infisical}
      POSTGRES_PASSWORD: ${INFISICAL_DB_PASSWORD:?set INFISICAL_DB_PASSWORD}
      POSTGRES_DB: ${INFISICAL_DB_NAME:-infisical}
    volumes:
      - infisical_db_data:/var/lib/postgresql/data
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  infisical-redis:
    image: redis:7-alpine
    container_name: nyra-infisical-redis
    profiles: ["secrets"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - infisical_redis_data:/data
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    profiles: ["secrets"]
    depends_on:
      - infisical-db
      - infisical-redis
    ports:
      - "${INFISICAL_PORT:-8085}:8080"
    # Infisical has a lot of required env vars (encryption/auth/db/redis/site...)
    # We keep them in a separate env file to avoid polluting the main .env.
    env_file:
      - ./secrets/infisical.env
    environment:
      DB_CONNECTION_URI: postgres://${INFISICAL_DB_USER:-infisical}:${INFISICAL_DB_PASSWORD}@infisical-db:5432/${INFISICAL_DB_NAME:-infisical}
      REDIS_URL: redis://infisical-redis:6379
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  ruvector-postgres:
    image: ruvnet/ruvector-postgres:latest
    container_name: nyra-ruvector-postgres
    profiles: ["claude-flow", "vector"]
    environment:
      POSTGRES_USER: ${RUVECTOR_POSTGRES_USER:-claude}
      POSTGRES_PASSWORD: ${RUVECTOR_POSTGRES_PASSWORD:?set RUVECTOR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUVECTOR_POSTGRES_DB:-claude_flow}
    ports:
      - "${RUVECTOR_POSTGRES_PORT:-5436}:5432"
    volumes:
      - ruvector_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUVECTOR_POSTGRES_USER:-claude} -d ${RUVECTOR_POSTGRES_DB:-claude_flow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  claude-flow-dev:
    image: node:20-bullseye
    container_name: nyra-claude-flow-dev
    profiles: ["claude-flow"]
    working_dir: /workspace
    depends_on:
      redis:
        condition: service_healthy
      ruvector-postgres:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      # Feature flags
      CLAUDE_FLOW_ENABLED: "true"
      CLAUDE_FLOW_HOOKS_ENABLED: "true"
      CLAUDE_FLOW_MEMORY_PERSISTENCE: "true"
      # Memory
      CLAUDE_FLOW_DATA_DIR: /data/claude-flow
      AGENTDB_PATH: /data/agentdb/claude-flow.db
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # RuVector DB
      POSTGRES_HOST: ruvector-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${RUVECTOR_POSTGRES_USER:-claude}
      POSTGRES_PASSWORD: ${RUVECTOR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUVECTOR_POSTGRES_DB:-claude_flow}
      # Provider keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    ports:
      - "${CLAUDE_FLOW_PORT:-3000}:3000"
    volumes:
      - ../../:/workspace:rw
      - claude_flow_data:/data/claude-flow
      - claude_flow_agentdb:/data/agentdb
      - claude_flow_neural:/data/neural
    command: >
      bash -lc "
      set -e;
      apt-get update -qq && apt-get install -y -qq git curl jq python3 python3-pip build-essential sqlite3 ca-certificates && rm -rf /var/lib/apt/lists/*;
      npm install -g pnpm@latest typescript@latest ts-node@latest \
        claude-flow@alpha flow-nexus@latest ruv-swarm@latest \
        agentdb@latest agentic-flow@latest \
        ruvector@latest @ruvector/sona@latest @ruvector/postgres-cli@latest || true;
      pip3 install --no-cache-dir anthropic openai sentence-transformers numpy scipy || true;
      cd /workspace;
      if [ -f package.json ]; then npm install --legacy-peer-deps || true; fi;
      if [ ! -f .claude-flow/settings.json ]; then npx @claude-flow/cli@latest init --non-interactive --defaults || true; fi;
      npx @claude-flow/cli@latest memory init --force || true;
      npx claude-flow@alpha start --daemon --port ${CLAUDE_FLOW_PORT:-3000} || true;
      tail -f /dev/null
      "
    networks: [nyra-network]
    restart: unless-stopped
    logging: *default_logging

  # NOTE: Archon OS is included as a profile because it expects source code
  # at specific paths in your repo. Enable with: `--profile archon`.
  # See compose/docker-compose.archon.yml.

  # NOTE: Gitea and Claude-flow dashboard are available as overlays.
  # See compose/ directory.
