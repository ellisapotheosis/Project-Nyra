# LiteLLM routing config (orchestrator)
#
# This routes OpenAI-compatible traffic from LiteLLM to your workers over Tailscale.
# Workers:
#   - 100.64.0.11 (worker-rtx5090)   vLLM+LMCache
#   - 100.64.0.13 (worker-rtx3090ti) vLLM+LMCache
#   - 100.64.0.12 (worker-rtx3060)   Ollama

model_list:
  # -----------------------------
  # RTX5090 (vLLM) — default “reasoning” workhorse
  # -----------------------------
  - model_name: local/deepseek-r1-qwen32b
    litellm_params:
      model: openai/local/deepseek-r1-qwen32b
      api_base: http://100.64.0.11:8000/v1
      api_key: sk-no-key-needed

  # -----------------------------
  # RTX3090Ti (vLLM)
  # -----------------------------
  - model_name: local/deepseek-r1-qwen14b
    litellm_params:
      model: openai/local/deepseek-r1-qwen14b
      api_base: http://100.64.0.13:8000/v1
      api_key: sk-no-key-needed

  # -----------------------------
  # RTX3060 (Ollama)
  # -----------------------------
  - model_name: local/ollama-llama3
    litellm_params:
      model: ollama/llama3
      api_base: http://100.64.0.12:11434

  # -----------------------------
  # Embeddings (pick one)
  # -----------------------------
  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://100.64.0.12:11434


# Global behavior
general_settings:
  max_retries: 2
  timeout: 180

  # Enable LiteLLM's caching (in-memory). For distributed caching, point Nexus to Redis.
  cache: true

router_settings:
  # Basic failover across providers for a model group.
  routing_strategy: simple-shuffle
  enable_pre_call_checks: true
