# Docker Compose overlay (merge into your existing compose)
# Goal: Replace vanilla postgres with RuVector-Postgres + init DBs.
services:
  postgres:
    image: ruvnet/ruvector-postgres:latest
    container_name: postgres
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/docker/init/00-create-dbs.sql:/docker-entrypoint-initdb.d/00-create-dbs.sql:ro
    restart: unless-stopped
