# ============================================================================
# Claude Flow Event Server
# ============================================================================
# WebSocket event streaming for Live Operations Dashboard
#
# Features:
#   - Real-time agent lifecycle events (spawn, status, complete)
#   - Task progress and completion streaming
#   - Memory operations monitoring (store, retrieve, search)
#   - System performance metrics broadcasting
#   - Swarm coordination event tracking
#   - Error and warning notifications
#
# Dependencies: None (standalone service)
# Usage:
#   docker compose -f docker-compose.event-server.yml up -d
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Claude Flow Event Server - WebSocket streaming for live operations
  # ==========================================================================
  claude-flow-event-server:
    build:
      context: ../../services/claude-flow-event-server
      dockerfile: Dockerfile
    container_name: claude-flow-event-server
    restart: unless-stopped
    ports:
      - "${EVENT_SERVER_WS_PORT:-3004}:3004"    # WebSocket port
      - "${EVENT_SERVER_HTTP_PORT:-3005}:3005"  # HTTP endpoint (port+1)
    environment:
      # Server Configuration
      - EVENT_SERVER_PORT=3004
      - EVENT_SERVER_HOST=0.0.0.0
      - EVENT_SERVER_MAX_CONNECTIONS=${EVENT_SERVER_MAX_CONNECTIONS:-100}
      - EVENT_SERVER_REPLAY_BUFFER=${EVENT_SERVER_REPLAY_BUFFER:-1000}
      - EVENT_SERVER_HEARTBEAT=${EVENT_SERVER_HEARTBEAT:-30000}

      # Logging
      - NODE_ENV=${NODE_ENV:-development}
      - DEBUG=${DEBUG:-false}
    networks:
      - nyra-network
    labels:
      - "nyra.service.name=claude-flow-event-server"
      - "nyra.service.type=event-streaming"
      - "nyra.service.tier=operations"
      - "nyra.websocket.enabled=true"
      - "nyra.websocket.port=3004"
      - "nyra.http.enabled=true"
      - "nyra.http.port=3005"
      - "nyra.http.endpoint=/event"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3005/event"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
