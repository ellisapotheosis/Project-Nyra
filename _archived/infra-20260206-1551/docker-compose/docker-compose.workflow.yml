# ============================================================================
# Project Nyra - Workflow Automation Services
# ============================================================================
# Workflow automation and integration platforms
# Includes: n8n, Dify, Activepieces
#
# Dependencies: base, databases
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.databases.yml -f docker-compose.workflow.yml up -d
# ============================================================================

version: '3.8'

volumes:
  n8n_data:
    name: nyra_n8n_data
    driver: local
  dify_storage:
    name: nyra_dify_storage
    driver: local

services:
  # ==========================================================================
  # n8n - Workflow automation platform
  # ==========================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    restart: unless-stopped
    ports:
      - "${N8N_PORT:-5678}:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=${N8N_WEBHOOK_URL:-http://localhost:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-America/New_York}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-admin}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-admin}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change_me_encryption_key}
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB:-n8n}
      - DB_POSTGRESDB_USER=${POSTGRES_USER:-nyra_user}
      - DB_POSTGRESDB_PASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ==========================================================================
  # Dify - AI application platform
  # ==========================================================================
  dify-api:
    image: langgenius/dify-api:latest
    container_name: nyra-dify-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    environment:
      - MODE=api
      - SECRET_KEY=${DIFY_SECRET_KEY:-change_me_secret_key}
      - ENCRYPTION_KEY=${DIFY_ENCRYPTION_KEY:-change_me_encryption_key}
      - DB_USERNAME=${POSTGRES_USER:-nyra_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DIFY_DB:-dify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_pass}
      - REDIS_DB=0
      - REDIS_USE_SSL=false
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_secure_key}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
      - LOG_LEVEL=${DIFY_LOG_LEVEL:-INFO}
    volumes:
      - dify_storage:/app/storage
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=dify"
      - "com.nyra.component=api"
      - "com.nyra.category=application"
      - "com.nyra.api.enabled=true"
      - "com.nyra.api.port=5001"
      - "com.nyra.api.path=/v1"
      - "com.nyra.health.endpoint=/health"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  dify-worker:
    image: langgenius/dify-api:latest
    container_name: nyra-dify-worker
    restart: unless-stopped
    environment:
      - MODE=worker
      - SECRET_KEY=${DIFY_SECRET_KEY:-change_me_secret_key}
      - ENCRYPTION_KEY=${DIFY_ENCRYPTION_KEY:-change_me_encryption_key}
      - DB_USERNAME=${POSTGRES_USER:-nyra_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_DATABASE=${DIFY_DB:-dify}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_pass}
      - REDIS_DB=0
      - REDIS_USE_SSL=false
      - VECTOR_STORE=qdrant
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY:-qdrant_secure_key}
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/storage
      - LOG_LEVEL=${DIFY_LOG_LEVEL:-INFO}
    volumes:
      - dify_storage:/app/storage
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    labels:
      - "com.nyra.service=dify"
      - "com.nyra.component=worker"
      - "com.nyra.category=application"
      - "com.nyra.type=background-worker"
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  dify-web:
    image: langgenius/dify-web:latest
    container_name: nyra-dify-web
    restart: unless-stopped
    ports:
      - "${DIFY_WEB_PORT:-3001}:3000"
    environment:
      - CONSOLE_API_URL=http://dify-api:5001
      - APP_API_URL=http://dify-api:5001
      - NEXT_PUBLIC_API_URL=http://dify-api:5001
      - NEXT_PUBLIC_CONSOLE_URL=http://localhost:3001
    networks:
      - nyra-network
    depends_on:
      - dify-api
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=dify"
      - "com.nyra.component=web"
      - "com.nyra.category=application"
      - "com.nyra.type=frontend"
      - "com.nyra.ui.port=3000"
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # Activepieces - Low-code automation for message delivery
  # ==========================================================================
  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    restart: unless-stopped
    ports:
      - "${ACTIVEPIECES_PORT:-3002}:80"
    environment:
      - AP_API_KEY=${ACTIVEPIECES_API_KEY:-change_me_api_key}
      - AP_ENCRYPTION_KEY=${AP_ENCRYPTION_KEY:-change_me_encryption_key}
      - AP_JWT_SECRET=${AP_JWT_SECRET:-change_me_jwt_secret}
      - AP_ENVIRONMENT=prod
      - AP_FRONTEND_URL=${AP_FRONTEND_URL:-http://localhost:3002}
      - AP_POSTGRES_HOST=postgres
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_DATABASE=${ACTIVEPIECES_DB:-activepieces}
      - AP_POSTGRES_USERNAME=${POSTGRES_USER:-nyra_user}
      - AP_POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
      - AP_REDIS_HOST=redis
      - AP_REDIS_PORT=6379
      - AP_REDIS_PASSWORD=${REDIS_PASSWORD:-redis_secure_pass}
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
