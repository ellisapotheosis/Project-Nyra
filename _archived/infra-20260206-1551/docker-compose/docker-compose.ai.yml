# ============================================================================
# Project Nyra - AI Services
# ============================================================================
# AI and LLM infrastructure services
# Includes: Nexus Router, Letta, Mem0, Open-WebUI
#
# Dependencies: base, databases
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.databases.yml -f docker-compose.ai.yml up -d
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Nexus Router - Unified LLM gateway
  # ==========================================================================
  nexus:
    image: ghcr.io/grafbase/nexus:latest
    container_name: nyra-nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-6000}:3000"
    volumes:
      - ../configs/nexus/nexus-minimal.toml:/etc/nexus.toml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEXUS_JWT_SECRET=${NEXUS_JWT_SECRET}
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    labels:
      - "com.nyra.service=nexus-router"
      - "com.nyra.category=ai-gateway"
      - "com.nyra.mcp.enabled=true"
