global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'claude-flow'
    static_configs:
      - targets: ['claude-flow:9090']

  - job_name: 'archon'
    static_configs:
      - targets: ['archon:9091']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
