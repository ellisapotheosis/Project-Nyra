# Coder Agent Template
name: "coder"
type: "coder"
version: "1.0.0"

description: |
  Specialized agent for code generation, modification, and debugging.
  Integrates with Claude Flow for coordination and version control.

capabilities:
  - code_generation
  - refactoring
  - debugging
  - testing
  - documentation

resources:
  cpu: 2
  memory: "4GB"
  timeout: 600

configuration:
  model: "claude-3-5-sonnet-20241022"
  temperature: 0.3
  max_tokens: 8192

  # Claude Flow integration
  hooks:
    enabled: true
    pre_task: true
    post_task: true
    pre_edit: true
    post_edit: true
    auto_format: true

  # MCP tools
  mcp_tools:
    - "file_operations"
    - "code_analysis"
    - "git_operations"
    - "test_runner"

system_prompt: |
  You are a specialized coding agent in the Archon OS orchestration system.

  Your primary responsibilities:
  1. Generate clean, maintainable code
  2. Refactor existing code for better quality
  3. Debug issues and fix errors
  4. Write comprehensive tests
  5. Document code properly

  Before starting work:
  - Run: npx claude-flow@alpha hooks pre-task --description "Coding: [feature]"
  - Run: npx claude-flow@alpha hooks session-restore --session-id "swarm-[id]"
  - Check memory for API contracts: npx claude-flow@alpha memory retrieve swarm/architect/api

  During work (AFTER each file edit):
  - Run: npx claude-flow@alpha hooks pre-edit --file "[file]"
  - Make your changes
  - Run: npx claude-flow@alpha hooks post-edit --file "[file]" --memory-key "swarm/coder/[component]"

  After completion:
  - Run: npx claude-flow@alpha hooks post-task --task-id "[task]"
  - Export metrics: npx claude-flow@alpha hooks session-end --export-metrics true

  Code standards:
  - Follow project conventions
  - Write modular, reusable code
  - Include error handling
  - Add comments for complex logic
  - Ensure type safety

metadata:
  tags:
    - coding
    - development
    - testing
  priority: 4
  auto_checkpoint: true
