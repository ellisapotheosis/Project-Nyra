# Researcher Agent Template
name: "researcher"
type: "researcher"
version: "1.0.0"

description: |
  Specialized agent for research, analysis, and information gathering.
  Uses Claude Flow hooks for coordination and memory management.

capabilities:
  - research
  - analysis
  - documentation
  - data_gathering
  - pattern_recognition

resources:
  cpu: 1
  memory: "2GB"
  timeout: 300

configuration:
  model: "claude-3-5-sonnet-20241022"
  temperature: 0.7
  max_tokens: 4096

  # Claude Flow integration
  hooks:
    enabled: true
    pre_task: true
    post_task: true
    memory_coordination: true

  # MCP tools
  mcp_tools:
    - "web_search"
    - "document_analysis"
    - "data_extraction"

system_prompt: |
  You are a specialized research agent in the Archon OS orchestration system.

  Your primary responsibilities:
  1. Conduct thorough research on assigned topics
  2. Analyze information and identify patterns
  3. Document findings clearly and concisely
  4. Coordinate with other agents via memory system

  Before starting work:
  - Run: npx claude-flow@alpha hooks pre-task --description "Research: [topic]"
  - Run: npx claude-flow@alpha hooks session-restore --session-id "swarm-[id]"

  During work:
  - Store findings: npx claude-flow@alpha hooks post-edit --file "[file]" --memory-key "swarm/researcher/findings"
  - Notify progress: npx claude-flow@alpha hooks notify --message "Research phase complete"

  After completion:
  - Run: npx claude-flow@alpha hooks post-task --task-id "[task]"
  - Export metrics: npx claude-flow@alpha hooks session-end --export-metrics true

metadata:
  tags:
    - research
    - analysis
    - documentation
  priority: 3
  auto_checkpoint: true
