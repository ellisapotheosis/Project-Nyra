# Archon OS Configuration
version: "1.0.0"

# Core Settings
core:
  name: "Archon OS"
  version: "1.0.0"
  environment: "${ARCHON_ENV:-production}"
  debug: ${ARCHON_DEBUG:-false}
  log_level: "${ARCHON_LOG_LEVEL:-info}"
  timezone: "UTC"

# API Server Configuration
api:
  host: "0.0.0.0"
  port: 8092
  workers: ${WORKER_PROCESSES:-4}
  worker_connections: ${WORKER_CONNECTIONS:-1000}
  graceful_timeout: ${GRACEFUL_TIMEOUT:-30}
  keepalive: 65
  max_requests: 10000
  max_requests_jitter: 1000
  cors:
    enabled: true
    origins:
      - "*"
    methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
      - "PATCH"
    headers:
      - "Content-Type"
      - "Authorization"
      - "X-API-Key"

# Database Configuration
database:
  url: "${DATABASE_URL}"
  pool_size: ${DATABASE_POOL_SIZE:-20}
  max_overflow: ${DATABASE_MAX_OVERFLOW:-40}
  pool_timeout: 30
  pool_recycle: 3600
  echo: false
  future: true

# Redis Configuration
redis:
  url: "${REDIS_URL}"
  max_connections: ${REDIS_MAX_CONNECTIONS:-50}
  socket_timeout: 5
  socket_connect_timeout: 5
  retry_on_timeout: true
  health_check_interval: 30

# Message Queue Configuration
queue:
  backend: "rabbitmq"
  url: "${RABBITMQ_URL}"
  exchange: "${RABBITMQ_EXCHANGE:-archon-exchange}"
  exchange_type: "topic"
  queue: "${RABBITMQ_QUEUE:-archon-tasks}"
  routing_key: "archon.tasks"
  prefetch_count: 10
  ack_late: true
  task_acks_late: true
  worker_prefetch_multiplier: 4

# LiteLLM Integration
litellm:
  enabled: true
  proxy_url: "${LITELLM_PROXY_URL}"
  api_key: "${LITELLM_API_KEY}"
  timeout: 120
  max_retries: 3
  models:
    default: "claude-3-5-sonnet-20241022"
    fast: "claude-3-5-haiku-20241022"
    smart: "claude-3-opus-20240229"
  fallback:
    - "gpt-4-turbo-preview"
    - "gpt-3.5-turbo"

# Claude API Configuration (Fallback)
claude:
  api_key: "${ANTHROPIC_API_KEY}"
  model: "claude-3-5-sonnet-20241022"
  max_tokens: 4096
  temperature: 0.7
  timeout: 120

# MCP (Model Context Protocol) Configuration
mcp:
  enabled: ${MCP_ENABLED:-true}
  server:
    url: "${MCP_SERVER_URL}"
    transport: "${MCP_TRANSPORT:-sse}"
    timeout: 30
    retry_attempts: 3
    retry_delay: 1
  servers:
    - name: "archon-core"
      command: "python"
      args: ["-m", "src.mcp.server"]
      env:
        ARCHON_MCP_ENABLED: "true"
    - name: "claude-flow"
      command: "npx"
      args: ["claude-flow@alpha", "mcp", "start"]
      env:
        CLAUDE_FLOW_HOOKS: "true"
  tools:
    enabled: true
    namespace: "archon"
    prefix: "archon_"

# Claude Flow Integration
claude_flow:
  enabled: ${CLAUDE_FLOW_ENABLED:-true}
  hooks:
    enabled: ${CLAUDE_FLOW_HOOKS:-true}
    pre_task: true
    post_task: true
    pre_edit: true
    post_edit: true
    session_restore: true
    session_end: true
  memory:
    enabled: ${CLAUDE_FLOW_MEMORY_ENABLED:-true}
    backend: "redis"
    ttl: 86400  # 24 hours
    max_size: 10000
  coordination:
    enabled: true
    mode: "adaptive"
    topology: "${SWARM_TOPOLOGY:-mesh}"

# Agent Configuration
agents:
  max_agents: ${MAX_AGENTS:-50}
  default_timeout: ${AGENT_TIMEOUT:-300}
  max_retries: ${AGENT_MAX_RETRIES:-3}
  retry_delay: 5
  checkpoint_interval: ${AGENT_CHECKPOINT_INTERVAL:-60}

  # Agent Types
  types:
    - name: "researcher"
      description: "Research and analysis agent"
      capabilities: ["research", "analysis", "documentation"]
      resources:
        cpu: 1
        memory: "2GB"

    - name: "coder"
      description: "Code generation and modification agent"
      capabilities: ["code_generation", "refactoring", "debugging"]
      resources:
        cpu: 2
        memory: "4GB"

    - name: "reviewer"
      description: "Code review and quality assurance agent"
      capabilities: ["code_review", "testing", "security_audit"]
      resources:
        cpu: 1
        memory: "2GB"

    - name: "architect"
      description: "System design and architecture agent"
      capabilities: ["system_design", "architecture", "planning"]
      resources:
        cpu: 2
        memory: "4GB"

    - name: "coordinator"
      description: "Multi-agent coordination and orchestration"
      capabilities: ["coordination", "task_distribution", "monitoring"]
      resources:
        cpu: 1
        memory: "2GB"

    - name: "optimizer"
      description: "Performance optimization and analysis"
      capabilities: ["optimization", "profiling", "benchmarking"]
      resources:
        cpu: 2
        memory: "4GB"

# Swarm Configuration
swarm:
  topology: "${SWARM_TOPOLOGY:-mesh}"
  topologies:
    mesh:
      max_connections: 10
      discovery: "automatic"
    hierarchical:
      max_depth: 3
      branching_factor: 5
    ring:
      buffer_size: 1000
    star:
      coordinator: "adaptive"

  coordination:
    mode: "${SWARM_COORDINATION_MODE:-adaptive}"
    max_concurrent_tasks: ${SWARM_MAX_CONCURRENT_TASKS:-10}
    task_distribution: "round_robin"
    load_balancing: true

  consensus:
    enabled: true
    algorithm: "raft"
    quorum_size: 3
    election_timeout: 5
    heartbeat_interval: 1

# Task Management
tasks:
  queue_size: 10000
  priority_levels: 5
  default_priority: 3
  retry_policy:
    max_retries: 3
    retry_delay: 5
    exponential_backoff: true
    max_delay: 60
  timeout:
    default: 300
    min: 10
    max: 3600

# Memory and State Management
memory:
  backend: "redis"
  ttl: 86400
  max_size: 10000
  persistence:
    enabled: true
    interval: 300
    path: "/opt/archon/data/checkpoints"

  cache:
    enabled: true
    size: 1000
    ttl: 3600
    eviction_policy: "lru"

# Security Configuration
security:
  authentication:
    enabled: ${ENABLE_AUTH:-true}
    type: "jwt"
    jwt:
      secret: "${JWT_SECRET}"
      algorithm: "HS256"
      expiration: ${JWT_EXPIRATION:-3600}

  api_keys:
    enabled: true
    header: "X-API-Key"

  rate_limiting:
    enabled: true
    requests_per_minute: 100
    burst: 20

# Monitoring and Observability
monitoring:
  prometheus:
    enabled: ${PROMETHEUS_ENABLED:-true}
    port: 8093
    path: "/metrics"

  health_checks:
    enabled: true
    interval: 30
    timeout: 10

  logging:
    level: "${ARCHON_LOG_LEVEL:-info}"
    format: "json"
    output: "stdout"
    file:
      enabled: true
      path: "/opt/archon/data/logs/archon.log"
      max_size: "100MB"
      max_files: 10

  tracing:
    enabled: ${TRACING_ENABLED:-false}
    backend: "jaeger"
    sample_rate: 0.1

# Performance Tuning
performance:
  async:
    enabled: true
    pool_size: 100

  caching:
    enabled: true
    backend: "redis"
    ttl: 3600

  connection_pooling:
    database: 20
    redis: 50
    http: 100

# Feature Flags
features:
  agent_checkpointing: true
  distributed_execution: true
  auto_scaling: true
  neural_coordination: true
  adaptive_topology: true
  self_healing: true
  multi_model_support: true
