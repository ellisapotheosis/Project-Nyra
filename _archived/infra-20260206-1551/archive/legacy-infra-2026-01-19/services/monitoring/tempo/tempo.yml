# Tempo Configuration
# Distributed tracing backend

server:
  http_listen_port: 3200
  log_level: info

# Distributor configuration
distributor:
  receivers:
    jaeger:
      protocols:
        thrift_http:
          endpoint: 0.0.0.0:14268
        grpc:
          endpoint: 0.0.0.0:14250
        thrift_binary:
          endpoint: 0.0.0.0:6832
        thrift_compact:
          endpoint: 0.0.0.0:6831
    zipkin:
      endpoint: 0.0.0.0:9411
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318
        grpc:
          endpoint: 0.0.0.0:4317
    opencensus:
      endpoint: 0.0.0.0:55678

# Ingester configuration
ingester:
  max_block_duration: 5m
  max_block_bytes: 1000000
  complete_block_timeout: 1m
  trace_idle_period: 10s
  flush_check_period: 10s
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    tokens_file_path: /var/tempo/tokens.json

# Compactor configuration
compactor:
  compaction:
    block_retention: 336h  # 14 days
    compacted_block_retention: 1h
    compaction_window: 1h
    max_block_bytes: 100000000000  # 100GB
    max_compaction_objects: 1000000
  ring:
    kvstore:
      store: inmemory

# Storage configuration
storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
    pool:
      max_workers: 100
      queue_depth: 10000

# Query frontend configuration
query_frontend:
  search:
    duration_slo: 5s
    throughput_bytes_slo: 1.073741824e+09  # 1GB
  trace_by_id:
    duration_slo: 5s
    query_shards: 50
  max_retries: 3

# Querier configuration
querier:
  frontend_worker:
    frontend_address: localhost:9095
    parallelism: 10
  max_concurrent_queries: 20
  search:
    external_endpoints:
      - http://prometheus:9090
    external_hedge_requests_at: 8s
    external_hedge_requests_up_to: 2

# Metrics generator (optional - generates metrics from traces)
metrics_generator:
  registry:
    external_labels:
      source: tempo
      cluster: nyra-production
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
        headers:
          X-Scope-OrgID: anonymous
  processor:
    service_graphs:
      dimensions:
        - http.method
        - http.target
        - http.status_code
      histogram_buckets:
        - 0.1
        - 0.2
        - 0.4
        - 0.8
        - 1.6
        - 3.2
        - 6.4
        - 12.8
    span_metrics:
      dimensions:
        - http.method
        - http.target
        - http.status_code
        - service.version
      histogram_buckets:
        - 0.002
        - 0.004
        - 0.008
        - 0.016
        - 0.032
        - 0.064
        - 0.128
        - 0.256
        - 0.512
        - 1.024
        - 2.048
        - 4.096
        - 8.192
        - 16.384

# Memberlist configuration (for multi-instance deployments)
memberlist:
  abort_if_cluster_join_fails: false
  bind_port: 7946
  join_members:
    - localhost:7946

# Overrides configuration
overrides:
  defaults:
    metrics_generator:
      processors: [service-graphs, span-metrics]
      max_active_series: 10000
      collection_interval: 15s
    ingestion:
      rate_strategy: local
      rate_limit_bytes: 5000000  # 5MB/s
      burst_size_bytes: 10000000  # 10MB
      max_traces_per_user: 10000
    forwarders:
      - "jaeger-agent:6831"
  per_tenant_override_config: /etc/tempo/overrides.yaml

# Usage report (optional)
usage_report:
  reporting_enabled: false
