# MCP Server Alert Rules
# Alerts for Model Context Protocol servers and integrations

groups:
  - name: mcp_server_alerts
    interval: 30s
    rules:
      # ==========================================
      # MCP SERVER AVAILABILITY
      # ==========================================

      - alert: MCPServerDown
        expr: up{job="mcp-servers"} == 0
        for: 2m
        labels:
          severity: critical
          category: application
          component: mcp-server
        annotations:
          summary: "MCP Server {{ $labels.server }} is down"
          description: "MCP server {{ $labels.server }} is not responding"
          action: "Check MCP server service immediately"
          dashboard: "http://grafana:3000/d/mcp-servers"

      - alert: MCPServerHighErrorRate
        expr: sum(rate(mcp_errors_total[5m])) by (server) / sum(rate(mcp_requests_total[5m])) by (server) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High error rate on MCP server {{ $labels.server }}"
          description: "Error rate: {{ $value | humanizePercentage }} (threshold: 5%)"
          dashboard: "http://grafana:3000/d/mcp-servers"

      - alert: MCPServerCriticalErrorRate
        expr: sum(rate(mcp_errors_total[5m])) by (server) / sum(rate(mcp_requests_total[5m])) by (server) > 0.20
        for: 2m
        labels:
          severity: critical
          category: application
          component: mcp-server
        annotations:
          summary: "CRITICAL: MCP server {{ $labels.server }} error rate"
          description: "Error rate: {{ $value | humanizePercentage }}"
          action: "Investigate MCP server immediately"

      - alert: MCPServerHighLatency
        expr: histogram_quantile(0.95, sum(rate(mcp_request_duration_bucket[5m])) by (server, le)) > 2
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High latency on MCP server {{ $labels.server }}"
          description: "P95 latency: {{ $value | humanizeDuration }}"
          dashboard: "http://grafana:3000/d/mcp-servers"

      # ==========================================
      # MCP CONNECTIONS
      # ==========================================

      - alert: MCPConnectionPoolExhausted
        expr: mcp_active_connections / mcp_max_connections > 0.90
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "MCP connection pool near limit on {{ $labels.server }}"
          description: "{{ $value | humanizePercentage }} of max connections in use"
          dashboard: "http://grafana:3000/d/mcp-servers"

      - alert: MCPConnectionPoolFull
        expr: mcp_active_connections / mcp_max_connections >= 1
        for: 2m
        labels:
          severity: critical
          category: application
          component: mcp-server
        annotations:
          summary: "MCP connection pool full on {{ $labels.server }}"
          description: "All connections in use - new requests will fail"
          action: "Increase connection pool size or investigate connection leaks"

      - alert: MCPConnectionFailures
        expr: rate(mcp_connection_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High connection failure rate on {{ $labels.server }}"
          description: "Connection failures: {{ $value }}/sec"

      - alert: MCPStaleConnections
        expr: mcp_stale_connections > 50
        for: 10m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "Stale connections on {{ $labels.server }}"
          description: "Stale connection count: {{ $value }}"

      # ==========================================
      # MCP SPECIFIC INTEGRATIONS
      # ==========================================

      - alert: FlowNexusMCPUnresponsive
        expr: up{job="mcp-servers",server="flow-nexus"} == 0
        for: 2m
        labels:
          severity: critical
          category: application
          component: flow-nexus
        annotations:
          summary: "Flow Nexus MCP server is down"
          description: "Flow Nexus integration unavailable"
          action: "Check Flow Nexus service and connectivity"

      - alert: RuvSwarmMCPUnresponsive
        expr: up{job="mcp-servers",server="ruv-swarm"} == 0
        for: 2m
        labels:
          severity: critical
          category: application
          component: ruv-swarm
        annotations:
          summary: "Ruv Swarm MCP server is down"
          description: "Ruv Swarm integration unavailable"
          action: "Check Ruv Swarm service and connectivity"

      - alert: LettaMCPUnresponsive
        expr: up{job="mcp-servers",server="letta"} == 0
        for: 2m
        labels:
          severity: critical
          category: application
          component: letta
        annotations:
          summary: "Letta MCP server is down"
          description: "Letta memory management unavailable"
          action: "Check Letta service and connectivity"

      # ==========================================
      # MCP PROTOCOL ISSUES
      # ==========================================

      - alert: MCPProtocolErrors
        expr: rate(mcp_protocol_errors_total[5m]) > 1
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-protocol
        annotations:
          summary: "MCP protocol errors on {{ $labels.server }}"
          description: "Protocol error rate: {{ $value }}/sec"
          dashboard: "http://grafana:3000/d/mcp-servers"

      - alert: MCPTimeouts
        expr: rate(mcp_timeout_errors_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High timeout rate on {{ $labels.server }}"
          description: "Timeout rate: {{ $value }}/sec"

      - alert: MCPRateLimitHit
        expr: rate(mcp_rate_limit_exceeded_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "Rate limit frequently hit on {{ $labels.server }}"
          description: "Rate limit hits: {{ $value }}/sec"

      # ==========================================
      # MCP RESOURCE USAGE
      # ==========================================

      - alert: MCPHighMemoryUsage
        expr: mcp_memory_usage_bytes / mcp_memory_limit_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High memory usage on {{ $labels.server }}"
          description: "Memory usage: {{ $value | humanizePercentage }}"

      - alert: MCPHighGoroutines
        expr: mcp_goroutines_count > 10000
        for: 10m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "High goroutine count on {{ $labels.server }}"
          description: "Goroutines: {{ $value }} - possible goroutine leak"

      - alert: MCPMessageQueueBacklog
        expr: mcp_message_queue_depth > 1000
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-server
        annotations:
          summary: "Message queue backlog on {{ $labels.server }}"
          description: "Queue depth: {{ $value }} messages"

      # ==========================================
      # MCP TOOL EXECUTION
      # ==========================================

      - alert: MCPToolExecutionFailures
        expr: rate(mcp_tool_execution_failures_total[5m]) > 5
        for: 5m
        labels:
          severity: warning
          category: application
          component: mcp-tools
        annotations:
          summary: "High tool execution failure rate"
          description: "Tool failures: {{ $value }}/sec on {{ $labels.server }}"

      - alert: MCPSlowToolExecution
        expr: histogram_quantile(0.95, sum(rate(mcp_tool_execution_duration_bucket[5m])) by (server, tool, le)) > 10
        for: 10m
        labels:
          severity: warning
          category: application
          component: mcp-tools
        annotations:
          summary: "Slow tool execution on {{ $labels.server }}"
          description: "P95 execution time for {{ $labels.tool }}: {{ $value | humanizeDuration }}"

      # ==========================================
      # MCP CACHE PERFORMANCE
      # ==========================================

      - alert: MCPLowCacheHitRate
        expr: rate(mcp_cache_hits_total[5m]) / (rate(mcp_cache_hits_total[5m]) + rate(mcp_cache_misses_total[5m])) < 0.70
        for: 15m
        labels:
          severity: warning
          category: application
          component: mcp-cache
        annotations:
          summary: "Low cache hit rate on {{ $labels.server }}"
          description: "Cache hit rate: {{ $value | humanizePercentage }} (threshold: 70%)"
