version: '3.9'

name: nyra-metatool

networks:
  nyra:
    external: true

volumes:
  metamcp_pg_data: {}

services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    container_name: nyra-metamcp
    restart: unless-stopped
    env_file:
      - ./env/merged.env
      - ../../.env.master.example
    environment:
      - APP_URL=${APP_URL:-http://localhost:12008}
    ports:
      - '12008:12008'
    networks: [nyra]
    depends_on:
      - metamcp-postgres

  metamcp-postgres:
    image: postgres:16
    container_name: nyra-metamcp-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${METAMCP_POSTGRES_PASSWORD:-postgres}
    volumes:
      - metamcp_pg_data:/var/lib/postgresql/data
    networks: [nyra]
