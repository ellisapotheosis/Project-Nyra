# ============================================================================
# Infisical Agent Configuration - Project Nyra Phase 3
# ============================================================================
# This configures the Infisical agent to automatically render secrets from
# Infisical into local .env files for Docker Compose to consume.
#
# The agent runs as a background service and re-renders secrets at intervals,
# ensuring your local environment stays in sync with Infisical.
# ============================================================================

# Infisical Project Configuration
infisical:
  # Address of Infisical instance (use cloud or self-hosted)
  address: https://app.infisical.com

  # Authentication using Machine Identity (Universal Auth)
  auth:
    type: universal-auth
    credentials:
      # Client ID and Secret are read from files for security
      # Create these files first:
      #   New-Item -ItemType Directory -Force ./secrets
      #   Set-Content -Path ./secrets/infisical-client-id -Value "your_client_id"
      #   Set-Content -Path ./secrets/infisical-client-secret -Value "your_secret"
      client-id-path: ./secrets/infisical-client-id
      client-secret-path: ./secrets/infisical-client-secret

# Sinks define where and how secrets are rendered
sinks:
  # Orchestration Stack Environment File
  - type: file
    config:
      # Output path for rendered secrets
      path: ../../.env.orchestration.rendered

      # Go template that defines how secrets are rendered
      template-path: ./templates/orchestration.env.tmpl

      # How often to re-render secrets (in seconds)
      # 60 = every minute (good for development)
      # 300 = every 5 minutes (good for production)
      interval: 60

  # MCP Servers Environment File
  - type: file
    config:
      path: ../../.env.mcp.rendered
      template-path: ./templates/mcp.env.tmpl
      interval: 60

  # UI Services Environment File
  - type: file
    config:
      path: ../../.env.ui.rendered
      template-path: ./templates/ui.env.tmpl
      interval: 60

  # Master Environment File (all services combined)
  - type: file
    config:
      path: ../../.env.rendered
      template-path: ./templates/master.env.tmpl
      interval: 60

# Exit configuration
exit:
  # What to do on agent exit
  # "file" = write secrets one last time before exiting
  # "none" = don't write anything on exit
  mode: file

  # Optionally clear rendered files on exit (security feature)
  # Set to true for high-security environments
  clear-outputs: false
