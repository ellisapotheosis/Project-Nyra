# Cloudflare Tunnel Configuration for Worker-3060
# Documentation: https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/install-and-setup/tunnel-guide/

# Tunnel Credentials (managed by Infisical)
tunnel: worker-3060
credentials-file: /root/.cloudflared/worker-3060.json

# Ingress Rules - Map public URLs to internal services
ingress:
  # Ollama API - Primary LLM endpoint
  - hostname: ollama-worker-3060.yourdomain.com
    service: http://localhost:11434
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false
      http2Origin: true

  # ONNX Runtime - GPU inference
  - hostname: onnx-worker-3060.yourdomain.com
    service: http://localhost:8001
    originRequest:
      connectTimeout: 10s

  # Embedding Service
  - hostname: embeddings-worker-3060.yourdomain.com
    service: http://localhost:8080
    originRequest:
      connectTimeout: 15s

  # Health Monitor & Metrics
  - hostname: health-worker-3060.yourdomain.com
    service: http://localhost:9090
    originRequest:
      connectTimeout: 5s

  # Prometheus Metrics
  - hostname: metrics-worker-3060.yourdomain.com
    service: http://localhost:9090
    originRequest:
      connectTimeout: 5s

  # Redis (via HTTP proxy - optional)
  # - hostname: redis-worker-3060.yourdomain.com
  #   service: tcp://localhost:6379

  # Catch-all rule (required)
  - service: http_status:404

# Origin Configuration
originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  noHappyEyeballs: false
  keepAliveConnections: 10
  keepAliveTimeout: 90s
  httpHostHeader: ""
  originServerName: ""
  caPool: ""
  noTLSVerify: false
  disableChunkedEncoding: false
  bastionMode: false
  proxyAddress: ""
  proxyPort: 0
  proxyType: ""
  http2Origin: true

# Tunnel Configuration
metrics: localhost:2000
metrics-update-freq: 30s

# Logging
loglevel: info
transport-loglevel: warn

# Protocol
protocol: quic

# Autoupdate
autoupdate-freq: 24h

# Grace period for shutdown
grace-period: 30s

# Retry configuration
retries: 5

# Load Balancing (if using multiple tunnels)
lb-pool: worker-3060-pool

# Edge IP Version
edge-ip-version: auto

