# Notes
# ============================================================================
#
# 1. Setup:
#    cloudflared tunnel create worker-3060
#    cloudflared tunnel route dns worker-3060 ollama-worker-3060.yourdomain.com
#    cloudflared tunnel route dns worker-3060 onnx-worker-3060.yourdomain.com
#    cloudflared tunnel route dns worker-3060 embeddings-worker-3060.yourdomain.com
#    cloudflared tunnel route dns worker-3060 health-worker-3060.yourdomain.com
#
# 2. Run:
#    cloudflared tunnel run worker-3060
#
# 3. Install as Windows Service:
#    cloudflared service install
#    cloudflared --config C:\Path\To\cloudflared-config.yml service install
#
# 4. Credentials:
#    Stored in Infisical under /worker-3060/CLOUDFLARED_TUNNEL_TOKEN
#
# 5. Monitoring:
#    Tunnel health: https://dash.cloudflare.com/
#    Metrics endpoint: http://localhost:2000/metrics
#
# 6. Security:
#    - All traffic encrypted via Cloudflare Tunnel
#    - No inbound firewall rules needed
#    - Zero Trust access control via Cloudflare Access
#
# 7. Performance:
#    - QUIC protocol for improved latency
#    - HTTP/2 origin connections
#    - 10 persistent keepalive connections
