# Nyra Orchestrator PC (UH680) - Unified stack entrypoint
# This compose file is the single entrypoint for the orchestrator PC.
# It pulls in the base, databases, AI, orchestrator, and MCP server stacks.

version: '3.8'

include:
  - ../docker-compose/docker-compose.base.yml
  - ../docker-compose/docker-compose.databases.yml
  - ../docker-compose/docker-compose.ai.yml
  - ../docker-compose/docker-compose.orchestrator.yml
  - ../docker-compose/docker-compose.mcp-servers.yml

