# Project Nyra - PC2 GPU Worker 1
# Services: Ollama, Ruvector Leader, Letta, Mem0, Dify

version: '3.9'

networks:
  nyra:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16

volumes:
  ollama_data:
  ruvector_data:
  letta_postgres_data:
  mem0_data:
  dify_postgres_data:
  dify_redis_data:

services:
  # ============================================================================
  # OLLAMA - Local LLM Inference
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: nyra-ollama-pc2
    hostname: ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
    networks:
      nyra:
        ipv4_address: 172.29.0.10
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # RUVECTOR - Distributed Vector Database (Leader Node)
  # ============================================================================
  ruvector:
    image: ruvnet/ruvector:latest
    container_name: nyra-ruvector-leader-pc2
    hostname: ruvector-leader
    restart: unless-stopped
    ports:
      - "6370:6370"  # Raft consensus + API
      - "6371:6371"  # gRPC
      - "6372:6372"  # Metrics
    volumes:
      - ruvector_data:/data
      - ./configs/ruvector/ruvector.yaml:/etc/ruvector/config.yaml:ro
    environment:
      - RUVECTOR_NODE_ID=leader
      - RUVECTOR_NODE_IP=10.0.0.2
      - RUVECTOR_CLUSTER_ID=nyra-cluster
      - RUVECTOR_RAFT_PORT=6370
      - RUVECTOR_PEERS=10.0.0.3:6370,10.0.0.4:6370
      - RUVECTOR_LEADER=true
      - RUVECTOR_GNN_ENABLED=true
      - RUVECTOR_HNSW_ENABLED=true
      - RUVECTOR_HNSW_M=16
      - RUVECTOR_HNSW_EF_CONSTRUCTION=200
      - RUVECTOR_QUANTIZATION=scalar
      - RUVECTOR_LOG_LEVEL=info
    networks:
      nyra:
        ipv4_address: 172.29.0.20
    deploy:
      resources:
        limits:
          memory: 16G
        reservations:
          memory: 8G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6370/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # LETTA - PostgreSQL Database for Memory
  # ============================================================================
  letta_postgres:
    image: ankane/pgvector:latest
    container_name: nyra-letta-postgres-pc2
    hostname: letta-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - letta_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=letta
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${LETTA_POSTGRES_PASSWORD:-letta_secure_password}
    networks:
      nyra:
        ipv4_address: 172.29.0.30
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # LETTA - Agent Memory System
  # ============================================================================
  letta:
    image: ghcr.io/letta-ai/letta:latest
    container_name: nyra-letta-pc2
    hostname: letta
    restart: unless-stopped
    ports:
      - "8283:8283"
    volumes:
      - ./configs/letta:/root/.letta:ro
    environment:
      - LETTA_PG_URI=postgresql://letta:${LETTA_POSTGRES_PASSWORD:-letta_secure_password}@letta_postgres:5432/letta
      - LETTA_SERVER_PORT=8283
      - LETTA_SERVER_HOST=0.0.0.0
      - LETTA_CORS_ORIGINS=*
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.29.0.31
    depends_on:
      letta_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MEM0 REST API - Universal Memory
  # ============================================================================
  mem0:
    build:
      context: ../services/mem0-rest
      dockerfile: Dockerfile
    container_name: nyra-mem0-pc2
    hostname: mem0
    restart: unless-stopped
    ports:
      - "4321:4321"
    volumes:
      - mem0_data:/app/data
      - ../services/mem0-rest:/app:ro
    environment:
      - MEM0_API_PORT=4321
      - MEM0_DB_PATH=/app/data/mem0.db
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MEM0_VECTOR_STORE=ruvector
      - RUVECTOR_URL=http://ruvector:6370
    networks:
      nyra:
        ipv4_address: 172.29.0.40
    depends_on:
      - ruvector
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # DIFY - PostgreSQL Database
  # ============================================================================
  dify_postgres:
    image: postgres:15-alpine
    container_name: nyra-dify-postgres-pc2
    hostname: dify-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - dify_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=dify
      - POSTGRES_USER=dify
      - POSTGRES_PASSWORD=${DIFY_POSTGRES_PASSWORD:-dify_secure_password}
    networks:
      nyra:
        ipv4_address: 172.29.0.50
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # DIFY - Redis Cache
  # ============================================================================
  dify_redis:
    image: redis:7-alpine
    container_name: nyra-dify-redis-pc2
    hostname: dify-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - dify_redis_data:/data
    command: redis-server --appendonly yes
    networks:
      nyra:
        ipv4_address: 172.29.0.51
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # DIFY - API Backend
  # ============================================================================
  dify_api:
    image: langgenius/dify-api:latest
    container_name: nyra-dify-api-pc2
    hostname: dify-api
    restart: unless-stopped
    ports:
      - "5001:5001"
    volumes:
      - ./configs/dify:/app/api/configs:ro
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-dify-secret-key-change-me}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_POSTGRES_PASSWORD:-dify_secure_password}
      - DB_HOST=dify_postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify_redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://dify_redis:6379/1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_BASE=https://openrouter.ai/api/v1
      - OPENAI_API_KEY=${OPENROUTER_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.29.0.52
    depends_on:
      dify_postgres:
        condition: service_healthy
      dify_redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # DIFY - Worker
  # ============================================================================
  dify_worker:
    image: langgenius/dify-api:latest
    container_name: nyra-dify-worker-pc2
    hostname: dify-worker
    restart: unless-stopped
    environment:
      - MODE=worker
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY:-dify-secret-key-change-me}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_POSTGRES_PASSWORD:-dify_secure_password}
      - DB_HOST=dify_postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=dify_redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - CELERY_BROKER_URL=redis://dify_redis:6379/1
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.29.0.53
    depends_on:
      - dify_api

  # ============================================================================
  # DIFY - Web UI
  # ============================================================================
  dify_web:
    image: langgenius/dify-web:latest
    container_name: nyra-dify-web-pc2
    hostname: dify-web
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - CONSOLE_API_URL=http://dify_api:5001
      - APP_API_URL=http://dify_api:5001
    networks:
      nyra:
        ipv4_address: 172.29.0.54
    depends_on:
      - dify_api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: nyra-node-exporter-pc2
    hostname: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      nyra:
        ipv4_address: 172.29.0.100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NVIDIA GPU EXPORTER - GPU Metrics
  # ============================================================================
  gpu_exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:latest
    container_name: nyra-gpu-exporter-pc2
    hostname: gpu-exporter
    restart: unless-stopped
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      nyra:
        ipv4_address: 172.29.0.101
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9835/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
