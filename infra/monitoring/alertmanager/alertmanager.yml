# AlertManager Configuration
# Alert routing, grouping, and notification management

global:
  # Global settings
  resolve_timeout: 5m
  smtp_from: 'alerts@example.com'
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_auth_username: 'alerts@example.com'
  smtp_auth_password: 'your-app-password'
  smtp_require_tls: true

  # Slack webhook
  slack_api_url: 'https://hooks.slack.com/services/YOUR/WEBHOOK/URL'

  # PagerDuty
  pagerduty_url: 'https://events.pagerduty.com/v2/enqueue'

# Templates for notifications
templates:
  - '/etc/alertmanager/templates/*.tmpl'

# Alert routing tree
route:
  # Root route with default receiver
  receiver: 'default'
  group_by: ['alertname', 'cluster', 'service']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 12h

  # Child routes for specific alert types
  routes:
    # Critical alerts go to PagerDuty and Slack
    - match:
        severity: critical
      receiver: 'pagerduty-critical'
      continue: true
      group_wait: 0s
      repeat_interval: 5m

    - match:
        severity: critical
      receiver: 'slack-critical'
      continue: false

    # Warning alerts go to Slack only
    - match:
        severity: warning
      receiver: 'slack-warnings'
      repeat_interval: 3h

    # Database alerts
    - match:
        category: database
      receiver: 'slack-database'
      group_by: ['alertname', 'database']
      repeat_interval: 1h

    # Application alerts
    - match:
        category: application
      receiver: 'slack-application'
      routes:
        # API errors need immediate attention
        - match:
            component: api
            severity: critical
          receiver: 'pagerduty-critical'
          continue: true

        # Performance warnings
        - match:
            component: api
            severity: warning
          receiver: 'slack-performance'

    # System/infrastructure alerts
    - match:
        category: system
      receiver: 'slack-infrastructure'
      group_by: ['alertname', 'instance']

    # Container/Kubernetes alerts
    - match:
        category: kubernetes
      receiver: 'slack-kubernetes'
      group_by: ['alertname', 'namespace', 'pod']

    - match:
        category: container
      receiver: 'slack-kubernetes'

    # Business metrics alerts
    - match:
        category: business
      receiver: 'slack-business'
      repeat_interval: 6h

    # Development/staging environment (no pages, Slack only)
    - match:
        environment: staging
      receiver: 'slack-staging'
      repeat_interval: 6h

    - match:
        environment: development
      receiver: 'slack-dev'
      repeat_interval: 24h

# Inhibition rules - suppress alerts based on other alerts
inhibit_rules:
  # Suppress warning alerts when critical alerts are firing
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']

  # Suppress downstream alerts when service is down
  - source_match:
      alertname: 'ServiceDown'
    target_match_re:
      alertname: '(HighAPILatency|HighAPIErrorRate|DatabaseConnectionPoolExhausted)'
    equal: ['service']

  # Suppress container alerts when node is down
  - source_match:
      alertname: 'KubernetesNodeNotReady'
    target_match_re:
      alertname: '(ContainerHighCPU|ContainerHighMemory|PodCrashLooping)'
    equal: ['node']

  # Suppress application errors when database is down
  - source_match:
      alertname: 'DatabaseDown'
    target_match_re:
      alertname: '(HighAPIErrorRate|SlowDatabaseQueries)'
    equal: ['database']

# Receiver definitions
receivers:
  # Default receiver (catch-all)
  - name: 'default'
    email_configs:
      - to: 'ops-team@example.com'
        send_resolved: true
        headers:
          Subject: '{{ .GroupLabels.alertname }} - {{ .GroupLabels.cluster }}'

  # PagerDuty for critical alerts
  - name: 'pagerduty-critical'
    pagerduty_configs:
      - service_key: 'YOUR_PAGERDUTY_SERVICE_KEY'
        severity: '{{ if eq .CommonLabels.severity "critical" }}critical{{ else }}error{{ end }}'
        description: '{{ .CommonAnnotations.summary }}'
        details:
          firing: '{{ .Alerts.Firing | len }}'
          resolved: '{{ .Alerts.Resolved | len }}'
          details: '{{ .CommonAnnotations.description }}'
          dashboard: '{{ .CommonAnnotations.dashboard }}'
        send_resolved: true

  # Slack channels
  - name: 'slack-critical'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/CRITICAL/WEBHOOK'
        channel: '#alerts-critical'
        send_resolved: true
        icon_emoji: ':fire:'
        title: '{{ .GroupLabels.alertname }}'
        text: |
          {{ range .Alerts }}
          *Alert:* {{ .Annotations.summary }}
          *Description:* {{ .Annotations.description }}
          *Severity:* {{ .Labels.severity }}
          *Details:*
            • Service: {{ .Labels.service }}
            • Instance: {{ .Labels.instance }}
            • Dashboard: {{ .Annotations.dashboard }}
          {{ end }}
        actions:
          - type: button
            text: 'View Dashboard'
            url: '{{ (index .Alerts 0).Annotations.dashboard }}'
          - type: button
            text: 'Silence Alert'
            url: '{{ .ExternalURL }}/#/silences/new'

  - name: 'slack-warnings'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/WARNINGS/WEBHOOK'
        channel: '#alerts-warnings'
        send_resolved: true
        icon_emoji: ':warning:'
        title: '{{ .GroupLabels.alertname }}'
        text: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'slack-database'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/DATABASE/WEBHOOK'
        channel: '#alerts-database'
        send_resolved: true
        icon_emoji: ':database:'
        title: 'Database Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-application'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/APPLICATION/WEBHOOK'
        channel: '#alerts-application'
        send_resolved: true
        icon_emoji: ':computer:'
        title: 'Application Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-performance'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/PERFORMANCE/WEBHOOK'
        channel: '#alerts-performance'
        send_resolved: true
        icon_emoji: ':chart_with_downwards_trend:'
        title: 'Performance Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-infrastructure'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/INFRA/WEBHOOK'
        channel: '#alerts-infrastructure'
        send_resolved: true
        icon_emoji: ':cloud:'
        title: 'Infrastructure Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-kubernetes'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/K8S/WEBHOOK'
        channel: '#alerts-kubernetes'
        send_resolved: true
        icon_emoji: ':kubernetes:'
        title: 'Kubernetes Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-business'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/BUSINESS/WEBHOOK'
        channel: '#alerts-business'
        send_resolved: true
        icon_emoji: ':moneybag:'
        title: 'Business Metrics Alert: {{ .GroupLabels.alertname }}'

  - name: 'slack-staging'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/STAGING/WEBHOOK'
        channel: '#alerts-staging'
        send_resolved: true
        icon_emoji: ':test_tube:'
        title: '[STAGING] {{ .GroupLabels.alertname }}'

  - name: 'slack-dev'
    slack_configs:
      - api_url: 'https://hooks.slack.com/services/YOUR/DEV/WEBHOOK'
        channel: '#alerts-dev'
        send_resolved: true
        icon_emoji: ':construction:'
        title: '[DEV] {{ .GroupLabels.alertname }}'

# Time-based routing (optional)
time_intervals:
  - name: 'business-hours'
    time_intervals:
      - times:
          - start_time: '09:00'
            end_time: '17:00'
        weekdays: ['monday:friday']

  - name: 'off-hours'
    time_intervals:
      - times:
          - start_time: '17:00'
            end_time: '09:00'
        weekdays: ['monday:friday']
      - weekdays: ['saturday', 'sunday']
