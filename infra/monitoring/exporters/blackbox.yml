# Blackbox Exporter Configuration
# Endpoint probing for HTTP, TCP, ICMP, DNS

modules:
  # HTTP 2xx check
  http_2xx:
    prober: http
    timeout: 5s
    http:
      valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
      valid_status_codes: []  # Defaults to 2xx
      method: GET
      headers:
        Accept-Language: en-US
      no_follow_redirects: false
      fail_if_ssl: false
      fail_if_not_ssl: false
      preferred_ip_protocol: "ip4"

  # HTTP POST check
  http_post_2xx:
    prober: http
    timeout: 5s
    http:
      method: POST
      headers:
        Content-Type: application/json
      body: '{}'

  # HTTP with basic auth
  http_2xx_auth:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      basic_auth:
        username: "admin"
        password: "password"

  # HTTP check expecting specific content
  http_2xx_with_content:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      fail_if_not_matches_regexp:
        - "healthy"
        - "ok"

  # HTTPS check with SSL verification
  https_2xx:
    prober: http
    timeout: 5s
    http:
      valid_status_codes: []
      method: GET
      tls_config:
        insecure_skip_verify: false
      preferred_ip_protocol: "ip4"

  # TCP connection check
  tcp_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  # TCP with TLS
  tcp_tls:
    prober: tcp
    timeout: 5s
    tcp:
      tls: true
      tls_config:
        insecure_skip_verify: false

  # ICMP ping
  icmp:
    prober: icmp
    timeout: 5s
    icmp:
      preferred_ip_protocol: "ip4"

  # DNS lookup
  dns_udp:
    prober: dns
    timeout: 5s
    dns:
      transport_protocol: "udp"
      preferred_ip_protocol: "ip4"
      query_name: "example.com"
      query_type: "A"

  # PostgreSQL check
  postgres_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  # Redis check
  redis_connect:
    prober: tcp
    timeout: 5s
    tcp:
      preferred_ip_protocol: "ip4"

  # gRPC health check
  grpc_health:
    prober: grpc
    timeout: 5s
    grpc:
      tls: false
      preferred_ip_protocol: "ip4"
