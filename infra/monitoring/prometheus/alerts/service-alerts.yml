groups:
  - name: service_alerts
    interval: 30s
    rules:
      # Critical service down
      - alert: ServiceDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.service }} on {{ $labels.instance }} has been down for more than 1 minute."

      # Business services
      - alert: QuoteEngineDown
        expr: up{job="quote-engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Quote Engine is down"
          description: "Quote Engine service is unavailable. Quotes cannot be generated."

      - alert: CampaignEngineDown
        expr: up{job="campaign-engine"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Campaign Engine is down"
          description: "Campaign Engine service is unavailable. Campaigns cannot be executed."

      - alert: OrchestratorDown
        expr: up{job="orchestrator"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Orchestrator is down"
          description: "Orchestrator service is unavailable. Workflow orchestration is offline."

      # Ruvector cluster
      - alert: RuvectorLeaderDown
        expr: up{job="ruvector-leader"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ruvector Leader is down"
          description: "Ruvector Leader node is unavailable. Cluster may be in read-only mode."

      - alert: RuvectorClusterUnhealthy
        expr: count(up{service="ruvector"} == 0) >= 2
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Ruvector Cluster unhealthy"
          description: "Multiple Ruvector nodes are down. Cluster consensus may be lost."

      # High CPU usage
      - alert: HighCPUUsage
        expr: 100 - (avg by(instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High CPU usage on {{ $labels.instance }}"
          description: "CPU usage is above 80% for 5 minutes on {{ $labels.instance }}."

      # High memory usage
      - alert: HighMemoryUsage
        expr: (node_memory_MemTotal_bytes - node_memory_MemAvailable_bytes) / node_memory_MemTotal_bytes * 100 > 85
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High memory usage on {{ $labels.instance }}"
          description: "Memory usage is above 85% for 5 minutes on {{ $labels.instance }}."

      # Disk space
      - alert: LowDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 15
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Low disk space on {{ $labels.instance }}"
          description: "Disk space is below 15% on {{ $labels.instance }}."

      - alert: CriticalDiskSpace
        expr: (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"}) * 100 < 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Critical disk space on {{ $labels.instance }}"
          description: "Disk space is below 5% on {{ $labels.instance }}. Immediate action required."

      # Campaign metrics
      - alert: HighCampaignFailureRate
        expr: rate(campaign_messages_sent{status="failed"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High campaign failure rate"
          description: "Campaign message failure rate is above 10% for 5 minutes."

      - alert: ComplianceBlockRate
        expr: rate(compliance_checks_total{classification="blocked"}[5m]) > 0.5
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "High compliance block rate"
          description: "Compliance check block rate is above 50% for 5 minutes. Review consent records."
