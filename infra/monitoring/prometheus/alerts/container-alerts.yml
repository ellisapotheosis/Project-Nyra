# Container and Infrastructure Alert Rules
# Docker, Kubernetes, Container alerts

groups:
  - name: container_alerts
    interval: 30s
    rules:
      # ==========================================
      # CONTAINER RESOURCE USAGE
      # ==========================================

      - alert: ContainerHighCPU
        expr: sum(rate(container_cpu_usage_seconds_total{container!=""}[5m])) by (pod, container) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: container
          component: cpu
        annotations:
          summary: "High CPU usage in container {{ $labels.container }}"
          description: "CPU usage: {{ $value | humanizePercentage }} in pod {{ $labels.pod }}"
          dashboard: "http://grafana:3000/d/containers-overview"

      - alert: ContainerHighMemory
        expr: sum(container_memory_usage_bytes{container!=""}) by (pod, container) / sum(container_spec_memory_limit_bytes{container!=""}) by (pod, container) * 100 > 80
        for: 5m
        labels:
          severity: warning
          category: container
          component: memory
        annotations:
          summary: "High memory usage in container {{ $labels.container }}"
          description: "Memory usage: {{ $value | humanizePercentage }} in pod {{ $labels.pod }}"

      - alert: ContainerMemoryNearLimit
        expr: sum(container_memory_usage_bytes{container!=""}) by (pod, container) / sum(container_spec_memory_limit_bytes{container!=""}) by (pod, container) * 100 > 95
        for: 2m
        labels:
          severity: critical
          category: container
          component: memory
        annotations:
          summary: "Container {{ $labels.container }} near memory limit"
          description: "Memory usage: {{ $value | humanizePercentage }} - risk of OOM kill"
          action: "Increase memory limit or investigate memory leak"

      # ==========================================
      # CONTAINER HEALTH
      # ==========================================

      - alert: ContainerRestarting
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: container
          component: health
        annotations:
          summary: "Container {{ $labels.container }} restarting frequently"
          description: "Container has restarted {{ $value }} times in last 15 minutes"
          action: "Check container logs for errors"

      - alert: ContainerOOMKilled
        expr: kube_pod_container_status_last_terminated_reason{reason="OOMKilled"} == 1
        for: 1m
        labels:
          severity: critical
          category: container
          component: memory
        annotations:
          summary: "Container {{ $labels.container }} was OOM killed"
          description: "Container killed due to out of memory in pod {{ $labels.pod }}"
          action: "Increase memory limit or fix memory leak"

      - alert: PodCrashLooping
        expr: rate(kube_pod_container_status_restarts_total[15m]) > 0.5
        for: 5m
        labels:
          severity: critical
          category: container
          component: health
        annotations:
          summary: "Pod {{ $labels.pod }} in crash loop"
          description: "Pod is crash looping - {{ $value }} restarts/15min"
          action: "Check pod logs immediately"

      - alert: ContainerNotReady
        expr: kube_pod_container_status_ready == 0
        for: 5m
        labels:
          severity: warning
          category: container
          component: health
        annotations:
          summary: "Container {{ $labels.container }} not ready"
          description: "Container in pod {{ $labels.pod }} is not ready"

      # ==========================================
      # CONTAINER NETWORK
      # ==========================================

      - alert: HighContainerNetworkTransmit
        expr: rate(container_network_transmit_bytes_total[5m]) > 50000000
        for: 5m
        labels:
          severity: warning
          category: container
          component: network
        annotations:
          summary: "High network transmit in {{ $labels.pod }}"
          description: "Transmit rate: {{ $value | humanize }}B/s"

      - alert: HighContainerNetworkReceive
        expr: rate(container_network_receive_bytes_total[5m]) > 50000000
        for: 5m
        labels:
          severity: warning
          category: container
          component: network
        annotations:
          summary: "High network receive in {{ $labels.pod }}"
          description: "Receive rate: {{ $value | humanize }}B/s"

      # ==========================================
      # KUBERNETES CLUSTER
      # ==========================================

      - alert: KubernetesNodeNotReady
        expr: kube_node_status_condition{condition="Ready",status="true"} == 0
        for: 5m
        labels:
          severity: critical
          category: kubernetes
          component: node
        annotations:
          summary: "Kubernetes node {{ $labels.node }} not ready"
          description: "Node has been not ready for more than 5 minutes"
          action: "Check node status immediately"

      - alert: KubernetesNodeMemoryPressure
        expr: kube_node_status_condition{condition="MemoryPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          category: kubernetes
          component: node
        annotations:
          summary: "Memory pressure on node {{ $labels.node }}"
          description: "Node is under memory pressure"

      - alert: KubernetesNodeDiskPressure
        expr: kube_node_status_condition{condition="DiskPressure",status="true"} == 1
        for: 5m
        labels:
          severity: warning
          category: kubernetes
          component: node
        annotations:
          summary: "Disk pressure on node {{ $labels.node }}"
          description: "Node is under disk pressure"

      - alert: KubernetesPodNotScheduled
        expr: kube_pod_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: scheduling
        annotations:
          summary: "Pod {{ $labels.pod }} not scheduled"
          description: "Pod has been pending for more than 10 minutes"

      # ==========================================
      # DEPLOYMENTS
      # ==========================================

      - alert: DeploymentReplicasMismatch
        expr: kube_deployment_spec_replicas != kube_deployment_status_replicas_available
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: deployment
        annotations:
          summary: "Deployment {{ $labels.deployment }} replicas mismatch"
          description: "Desired replicas != available replicas"

      - alert: DeploymentGenerationMismatch
        expr: kube_deployment_status_observed_generation != kube_deployment_metadata_generation
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: deployment
        annotations:
          summary: "Deployment {{ $labels.deployment }} generation mismatch"
          description: "Deployment rollout may be stuck"

      # ==========================================
      # STATEFULSETS
      # ==========================================

      - alert: StatefulSetReplicasMismatch
        expr: kube_statefulset_status_replicas_ready != kube_statefulset_status_replicas
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: statefulset
        annotations:
          summary: "StatefulSet {{ $labels.statefulset }} replicas not ready"
          description: "Not all replicas are ready"

      - alert: StatefulSetGenerationMismatch
        expr: kube_statefulset_status_observed_generation != kube_statefulset_metadata_generation
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: statefulset
        annotations:
          summary: "StatefulSet {{ $labels.statefulset }} generation mismatch"
          description: "StatefulSet rollout may be stuck"

      # ==========================================
      # PERSISTENT VOLUMES
      # ==========================================

      - alert: PersistentVolumeClaimPending
        expr: kube_persistentvolumeclaim_status_phase{phase="Pending"} == 1
        for: 10m
        labels:
          severity: warning
          category: kubernetes
          component: storage
        annotations:
          summary: "PVC {{ $labels.persistentvolumeclaim }} pending"
          description: "PVC has been pending for more than 10 minutes"

      - alert: PersistentVolumeSpaceLow
        expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes * 100 < 20
        for: 5m
        labels:
          severity: warning
          category: kubernetes
          component: storage
        annotations:
          summary: "Low space on PV {{ $labels.persistentvolumeclaim }}"
          description: "Only {{ $value | humanizePercentage }} space remaining"

      # ==========================================
      # DOCKER DAEMON
      # ==========================================

      - alert: DockerContainersHigh
        expr: count(container_last_seen) > 100
        for: 5m
        labels:
          severity: warning
          category: docker
          component: daemon
        annotations:
          summary: "High number of Docker containers"
          description: "{{ $value }} containers running"

      - alert: DockerImagePullErrors
        expr: rate(engine_daemon_container_actions_seconds_count{action="pull"}[5m]) - rate(engine_daemon_container_actions_seconds_sum{action="pull"}[5m]) > 0.1
        for: 5m
        labels:
          severity: warning
          category: docker
          component: images
        annotations:
          summary: "Docker image pull errors detected"
          description: "Error rate: {{ $value }}"
