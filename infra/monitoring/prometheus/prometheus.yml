global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nyra-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules from files
rule_files:
  - "alerts/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'
          tier: 'monitoring'

  # Grafana monitoring
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
          tier: 'monitoring'

  # Node Exporter - System Metrics
  # PC1 - Orchestrator
  - job_name: 'node-exporter-pc1'
    static_configs:
      - targets: ['10.0.0.1:9100']
        labels:
          instance: 'pc1-orchestrator'
          pc: 'pc1'
          role: 'orchestrator'

  # PC2 - GPU Worker 1
  - job_name: 'node-exporter-pc2'
    static_configs:
      - targets: ['10.0.0.2:9100']
        labels:
          instance: 'pc2-gpu-worker-1'
          pc: 'pc2'
          role: 'gpu-worker'

  # PC3 - GPU Worker 2
  - job_name: 'node-exporter-pc3'
    static_configs:
      - targets: ['10.0.0.3:9100']
        labels:
          instance: 'pc3-gpu-worker-2'
          pc: 'pc3'
          role: 'gpu-worker'

  # PC4 - GPU Worker 3
  - job_name: 'node-exporter-pc4'
    static_configs:
      - targets: ['10.0.0.4:9100']
        labels:
          instance: 'pc4-gpu-worker-3'
          pc: 'pc4'
          role: 'gpu-worker'

  # Business Services (PC4)
  - job_name: 'quote-engine'
    static_configs:
      - targets: ['quote-engine:8001']
        labels:
          service: 'quote-engine'
          tier: 'business'
          pc: 'pc4'
    metrics_path: '/metrics'

  - job_name: 'campaign-engine'
    static_configs:
      - targets: ['campaign-engine:8002']
        labels:
          service: 'campaign-engine'
          tier: 'business'
          pc: 'pc4'
    metrics_path: '/metrics'

  - job_name: 'orchestrator'
    static_configs:
      - targets: ['orchestrator:8010']
        labels:
          service: 'orchestrator'
          tier: 'business'
          pc: 'pc4'
    metrics_path: '/metrics'

  # Ruvector Cluster (PC2, PC3, PC4)
  - job_name: 'ruvector-leader'
    static_configs:
      - targets: ['10.0.0.2:6370']
        labels:
          service: 'ruvector'
          role: 'leader'
          tier: 'database'
          pc: 'pc2'

  - job_name: 'ruvector-follower-1'
    static_configs:
      - targets: ['10.0.0.3:6370']
        labels:
          service: 'ruvector'
          role: 'follower'
          tier: 'database'
          pc: 'pc3'

  - job_name: 'ruvector-follower-2'
    static_configs:
      - targets: ['10.0.0.4:6370']
        labels:
          service: 'ruvector'
          role: 'follower'
          tier: 'database'
          pc: 'pc4'

  # Pushgateway for batch jobs
  - job_name: 'pushgateway'
    static_configs:
      - targets: ['pushgateway:9091']
        labels:
          service: 'pushgateway'
          tier: 'monitoring'
    honor_labels: true
