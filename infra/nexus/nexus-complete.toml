# ==========================================
# NEXUS ROUTER - COMPLETE CONFIGURATION
# ==========================================
# Feature-maxed configuration with:
# - Unified LLM API (OpenAI-compatible endpoint)
# - Fuzzy Tool Search (built-in)
# - Multiple MCP server aggregation
# - Local + Cloud provider routing
# - Redis caching
# - Advanced monitoring
# ==========================================

# ==========================================
# 1. SERVER CONFIGURATION
# ==========================================
[server]
# Listen on all interfaces for Docker access
address = "0.0.0.0:8000"

# Enable request logging
log_level = "info"

# Maximum request body size (10MB)
max_body_size = 10485760

# Request timeout (2 minutes)
timeout = 120

# ==========================================
# 2. UNIFIED LLM API
# ==========================================
# Provides OpenAI-compatible endpoint at /llm/v1
# Point ANY client (Cursor, Claude Desktop, Continue) here
[llm]
enabled = true
path = "/llm/v1"

# Default model if not specified
default_model = "claude-sonnet-4-5"

# --- OpenAI Provider ---
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
base_url = "https://api.openai.com/v1"
models = [
  "gpt-4o",
  "gpt-4-turbo",
  "gpt-4",
  "gpt-3.5-turbo"
]

# --- Anthropic Provider ---
[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"
base_url = "https://api.anthropic.com/v1"
models = [
  "claude-sonnet-4-5",
  "claude-opus-4",
  "claude-3-5-sonnet-20241022",
  "claude-3-haiku-20240307"
]

# --- Google Gemini Provider ---
# Nexus normalizes Google's API to OpenAI format
[llm.providers.google]
type = "google"
api_key = "{{ env.GOOGLE_API_KEY }}"
models = [
  "gemini-2.0-flash-exp",
  "gemini-1.5-pro",
  "gemini-1.5-flash"
]

# --- OpenRouter Provider (Unified Access) ---
[llm.providers.openrouter]
type = "openai" # OpenRouter is OpenAI-compatible
api_key = "{{ env.OPENROUTER_API_KEY }}"
base_url = "https://openrouter.ai/api/v1"
models = [
  "deepseek/deepseek-r1",
  "anthropic/claude-3.5-sonnet",
  "google/gemini-pro-1.5",
  "meta-llama/llama-3.1-405b-instruct"
]

# ==========================================
# 3. INTELLIGENT ROUTING
# ==========================================
[routing]
# Strategy: cost-optimized | latency-optimized | quality-optimized
strategy = "{{ env.MODEL_ROUTING_STRATEGY }}"

# Prefer local GPU workers when available
prefer_local = true

# Fallback to cloud if local unavailable
fallback_cloud = true

# Cost threshold (USD per 1K tokens)
cost_threshold = 0.10

# ==========================================
# 4. LOCAL GPU WORKERS
# ==========================================
# Nexus will route to these first (cost savings)

[[workers]]
url = "{{ env.WORKER_5090_URL }}"
models = ["deepseek-r1:236b-q4_K_M", "qwen2.5:72b-instruct-q8_0"]
primary_use = "reasoning"
max_concurrent = 4
timeout = 180000
vram = 48

[[workers]]
url = "{{ env.WORKER_3090_URL }}"
models = ["llama3.1:70b-instruct-q4_K_M", "mistral-large:123b-instruct-2407-q4_K_M"]
primary_use = "analysis"
max_concurrent = 6
timeout = 120000
vram = 24

[[workers]]
url = "{{ env.WORKER_3060_URL }}"
models = ["codellama:34b-instruct-q8_0", "qwen2.5:32b-instruct-q8_0"]
primary_use = "coding"
max_concurrent = 8
timeout = 90000
vram = 12

# ==========================================
# 5. REDIS CACHING
# ==========================================
[cache]
enabled = true
type = "redis"
url = "{{ env.NEXUS_REDIS_URL }}"

# Cache TTL (1 hour)
ttl = 3600

# Cache key prefix
prefix = "nexus:"

# Enable request deduplication
deduplicate = true

# ==========================================
# 6. MCP SERVER AGGREGATION
# ==========================================
# Smart Tool Search is ENABLED automatically
# Nexus provides a "search" tool for fuzzy finding
[mcp]
enabled = true
path = "/mcp"

# Enable fuzzy tool search (built-in)
fuzzy_search = true
search_threshold = 0.6

# --- A. Filesystem (Read/Write Files) ---
[mcp.servers.filesystem]
type = "stdio"
cmd = ["npx", "-y", "@modelcontextprotocol/server-filesystem"]
args = ["/projects"]
enabled = true
description = "File system access for reading and writing project files"

# --- B. Desktop Commander (Advanced System Control) ---
# Gives AI terminal access, diff editing, system control
[mcp.servers.desktop_commander]
type = "docker"
image = "ghcr.io/wonderwhy-er/desktop-commander:latest"
volumes = [
  "/var/run/docker.sock:/var/run/docker.sock", # Docker socket access
  "/projects:/projects"                         # Project files
]
enabled = true
description = "Advanced system control with terminal and diff editing"

# --- C. GitHub (Remote API) ---
# Issues, PRs, repo management
[mcp.servers.github]
type = "docker"
image = "ghcr.io/github/github-mcp-server:latest"
env = {
  GITHUB_PERSONAL_ACCESS_TOKEN = "{{ env.GITHUB_TOKEN }}"
}
enabled = true
description = "GitHub API for issues, pull requests, and repositories"

# --- D. Git (Local CLI) ---
# Local commits, diffs, history
[mcp.servers.git]
type = "stdio"
cmd = ["npx", "-y", "mcp-server-git"]
enabled = true
description = "Git version control for local repository operations"

# --- E. VS Code Remote ---
# Connects to VS Code instance
[mcp.servers.vscode]
type = "stdio"
cmd = ["npx", "-y", "vsc-remote", "stdio"]
enabled = false # Enable if you want VS Code integration
description = "VS Code editor integration"

# --- F. Graphiti (Knowledge Graph) ---
[mcp.servers.graphiti]
type = "sse"
url = "http://graphiti-mcp:8000"
enabled = true
description = "Temporal knowledge graph with relationship tracking"

# --- G. Qdrant (Vector Search) ---
[mcp.servers.qdrant]
type = "http"
url = "http://qdrant-mcp:8066"
enabled = true
description = "Vector database for semantic search"

# --- H. Context7 (Code Documentation) ---
[mcp.servers.context7]
type = "stdio"
url = "http://context7-mcp:8080"
enabled = true
description = "Code documentation and examples"

# --- I. Exa (Web & Code Search) ---
[mcp.servers.exa]
type = "stdio"
url = "http://exa-mcp:8080"
enabled = true
description = "Web search and code search capabilities"

# --- J. Supabase (Database Operations) ---
[mcp.servers.supabase]
type = "stdio"
url = "http://supabase-mcp:8080"
enabled = true
description = "Database operations via Supabase"

# --- K. TwentyCRM (CRM Operations) ---
[mcp.servers.twentycrm]
type = "stdio"
url = "http://twentycrm-mcp:8082"
enabled = true
description = "CRM operations for customer management"

# --- L. Dify (AI Application Proxy) ---
[mcp.servers.dify]
type = "stdio"
url = "http://dify-mcp:8083"
enabled = true
description = "Dify AI application workflow proxy"

# --- M. Serena (Semantic Code Retrieval) ---
[mcp.servers.serena]
type = "stdio"
url = "http://serena-mcp:8084"
enabled = true
description = "Semantic code search and retrieval"

# --- N. Gemini Assistant (Cost-Efficient Inference) ---
[mcp.servers.gemini-assistant]
type = "stdio"
url = "http://gemini-mcp:8085"
enabled = true
description = "Cost-efficient inference with Gemini"

# --- O. Composio (80+ Integrations) ---
[mcp.servers.composio]
type = "stdio"
url = "http://composio-mcp:8086"
enabled = true
description = "80+ third-party service integrations"

# ==========================================
# 7. RATE LIMITING
# ==========================================
[rate_limit]
enabled = true

# Global rate limit (all clients)
[rate_limit.global]
requests = 1000
window = 60 # seconds

# Per-IP rate limit
[rate_limit.per_ip]
requests = 100
window = 60

# Per-server rate limit (MCP servers)
[rate_limit.per_server]
requests = 50
window = 60

# Per-tool rate limit (individual tools)
[rate_limit.per_tool]
requests = 20
window = 60

# ==========================================
# 8. SECURITY & AUTHENTICATION
# ==========================================
[security]
# JWT-based authentication
jwt_secret = "{{ env.NEXUS_JWT_SECRET }}"
admin_token = "{{ env.NEXUS_ADMIN_TOKEN }}"

# OAuth2 configuration (optional)
[security.oauth2]
enabled = false
jwks_url = ""
expected_issuer = ""
expected_audience = ""

# ==========================================
# 9. OBSERVABILITY
# ==========================================
[observability]
enabled = true

# Prometheus metrics endpoint
[observability.metrics]
enabled = true
path = "/metrics"
port = 9090

# OpenTelemetry tracing
[observability.tracing]
enabled = true
endpoint = "http://localhost:4318"
service_name = "nexus-router"

# Logging configuration
[observability.logging]
level = "info"
format = "json"
output = "stdout"

# WebSocket metrics streaming
[observability.websocket]
enabled = true
path = "/ws/metrics"
update_interval = 1000 # milliseconds

# ==========================================
# 10. CORS CONFIGURATION
# ==========================================
[cors]
enabled = true
origins = [
  "http://localhost:3005", # Nexus Dashboard
  "http://localhost:3000", # Local dev
  "https://yourdomain.com" # Production
]
methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
headers = ["Content-Type", "Authorization", "X-Requested-With"]
credentials = true

# ==========================================
# 11. HEALTH CHECKS
# ==========================================
[health]
enabled = true
path = "/health"

# Check MCP server health
check_mcp_servers = true

# Check LLM provider health
check_llm_providers = true

# Check Redis health
check_redis = true

# ==========================================
# 12. ADVANCED FEATURES
# ==========================================

# Request deduplication (via Redis)
[deduplication]
enabled = true
ttl = 300 # 5 minutes

# Response compression
[compression]
enabled = true
level = 6
min_size = 1024 # bytes

# Request/Response transformation
[transform]
enabled = true

# Strip sensitive headers
strip_headers = [
  "Authorization",
  "X-API-Key",
  "Cookie"
]

# Add custom headers
add_headers = {
  "X-Powered-By" = "Nexus-Router",
  "X-Version" = "1.0.0"
}
