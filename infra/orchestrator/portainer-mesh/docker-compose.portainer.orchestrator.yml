version: "3.8"

services:
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: nyra-portainer
    restart: unless-stopped
    command:
      - --http-enabled
      - --admin-password=$${PORTAINER_ADMIN_PASSWORD}
      - --logo
      - https://raw.githubusercontent.com/portainer/portainer/develop/app/assets/images/logos/portainer-logo.svg
    ports:
      - "${PORTAINER_PORT:-9443}:9443"
      - "${PORTAINER_HTTP_PORT:-9000}:9000"
      - "${PORTAINER_AGENT_PORT:-9001}:9001"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - "nyra.service=portainer"
      - "nyra.role=orchestrator"

  portainer-edge-agent-local:
    image: portainer/agent:2.27.9
    container_name: nyra-portainer-edge-local
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent-local
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    labels:
      - "nyra.service=portainer-agent"
      - "nyra.role=orchestrator"

volumes:
  portainer_data:
    name: nyra-portainer-data
