# Infisical Agent Configuration - Claude Flow
# Real-time secret injection for Claude Flow MCP service
# Documentation: https://infisical.com/docs/agent/overview

# Infisical Server Connection
infisical:
  address: "https://app.infisical.com"

# Authentication Method: Universal Auth (Machine Identity)
auth:
  type: "universal-auth"
  config:
    client_id_env_name: "INFISICAL_UNIVERSAL_AUTH_CLIENT_ID"
    client_secret_env_name: "INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET"

# Secret Sinks - Where to write secrets
sinks:
  - type: "file"
    config:
      path: "/secrets/claude-flow.env"
      format: "env"  # KEY=value format

# Secret Templates - Dynamic secret rendering
templates:
  - source-path: "/config/template.env"
    destination-path: "/secrets/claude-flow.env"
    config:
      polling-interval: 60  # Check for changes every 60 seconds
      project-id-env-name: "INFISICAL_PROJECT_ID"
      environment-env-name: "INFISICAL_ENV"
      secret-path: "/claude-flow"

# Secrets to fetch
secrets:
  - secret-path: "/claude-flow"
    environment: "${INFISICAL_ENV}"
    recursive: true

# Refresh interval (seconds)
refresh-interval: 60

# Logging
log:
  level: "info"
  format: "json"
