# Project Nyra - Nexus Router Configuration
# Generated: 2026-01-25
# Purpose: Unified MCP aggregation and smart LLM routing
# Reference: https://nexusrouter.com | https://github.com/grafbase/nexus

################################################################################
# Server Configuration
################################################################################
[server]
# Listen address for Nexus Router
listen_address = "0.0.0.0:6000"

# Client IP detection (for rate limiting behind proxies/Cloudflare)
[server.client_ip]
x_real_ip = true
x_forwarded_for_trusted_hops = 1

# Rate Limiting Configuration
[server.rate_limits]
enabled = true

# Storage backend for rate limiting
[server.rate_limits.storage]
type = "redis"  # Use redis for distributed rate limiting across 4 PCs
redis_url = "redis://redis:6379"
# Fallback to memory if Redis unavailable
# type = "memory"

# Global rate limit (all requests)
[server.rate_limits.global]
limit = 10000
interval = "60s"

# Per-IP rate limit
[server.rate_limits.per_ip]
limit = 1000
interval = "60s"

# Per-user rate limit (OAuth2)
[server.rate_limits.per_user]
limit = 5000
interval = "60s"

################################################################################
# LLM Provider Configuration - Smart Routing
################################################################################
[llm]
enabled = true

# OpenAI-compatible endpoint (for Claude Code, Open WebUI, etc.)
[llm.protocols.openai]
enabled = true
path = "/llm/openai"

# Native Anthropic protocol
[llm.protocols.anthropic]
enabled = true
path = "/llm/anthropic"

################################################################################
# Provider: OpenAI (for specific use cases)
################################################################################
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
forward_token = true

# Models
[llm.providers.openai.models.gpt-4o]
# Rename for smart routing
rename = "openai-flagship"

[llm.providers.openai.models.gpt-4o-mini]
rename = "openai-fast"

[llm.providers.openai.models.gpt-4-turbo]
rename = "openai-turbo"

[llm.providers.openai.models.gpt-3-5-turbo]
rename = "openai-cheap"

# Rate limits per user for OpenAI
[llm.providers.openai.models.gpt-4o.rate_limits.per_user]
input_token_limit = 100000
interval = "60s"

################################################################################
# Provider: Anthropic (PRIMARY - Claude 3.5 Sonnet)
################################################################################
[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"

# Primary model: Claude 3.5 Sonnet (latest)
[llm.providers.anthropic.models.claude-3-5-sonnet-20241022]
rename = "claude-sonnet"  # Default smart choice

# Haiku for fast/cheap tasks
[llm.providers.anthropic.models.claude-3-5-haiku-20241022]
rename = "claude-fast"

# Opus for complex reasoning (when available)
[llm.providers.anthropic.models.claude-3-opus-20240229]
rename = "claude-opus"

# Rate limits for Anthropic
[llm.providers.anthropic.models.claude-3-5-sonnet-20241022.rate_limits.per_user]
input_token_limit = 200000  # Higher limit for primary model
interval = "60s"

[llm.providers.anthropic.models.claude-3-5-haiku-20241022.rate_limits.per_user]
input_token_limit = 500000  # Generous limit for cheap model
interval = "60s"

################################################################################
# Provider: Google Gemini (for cost-effective operations)
################################################################################
[llm.providers.google]
type = "google"
api_key = "{{ env.GOOGLE_API_KEY }}"

# Gemini 2.0 Flash - fast and cheap
[llm.providers.google.models.gemini-2-0-flash-exp]
rename = "gemini-flash"  # For cheap/fast work

# Gemini 1.5 Pro - balanced
[llm.providers.google.models.gemini-1-5-pro-002]
rename = "gemini-pro"

# Gemini 1.5 Flash
[llm.providers.google.models.gemini-1-5-flash-002]
rename = "gemini-cheap"

# Rate limits for Gemini (generous - it's cheap)
[llm.providers.google.models.gemini-2-0-flash-exp.rate_limits.per_user]
input_token_limit = 1000000
interval = "60s"

################################################################################
# Provider: AWS Bedrock (optional - for enterprise scenarios)
################################################################################
[llm.providers.bedrock]
type = "bedrock"
region = "{{ env.AWS_REGION }}"
# Uses AWS credentials from environment

# Claude via Bedrock (fallback)
[llm.providers.bedrock.models.anthropic-claude-3-5-sonnet-20241022-v2-0]
rename = "bedrock-claude-sonnet"

################################################################################
# MCP Configuration - Tool Aggregation
################################################################################
[mcp]
enabled = true
path = "/mcp"

################################################################################
# MCP Servers - Infrastructure Tools (Always Available)
################################################################################

# Filesystem Access (Multiple roots)
[mcp.servers.filesystem-nyra]
cmd = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "C:/Dev/Projects/Repos/Project-Nyra"]
description = "Project Nyra repository filesystem access"

[mcp.servers.filesystem-bootstrap]
cmd = ["npx", "-y", "@modelcontextprotocol/server-filesystem", "C:/Dev/NYRA-AIO-Bootstrap"]
description = "Bootstrap package filesystem access"

# Git Operations
[mcp.servers.git-nyra]
protocol = "docker"
url = "http://git-mcp:8054"
description = "Git operations for Project Nyra"

# GitHub Integration
[mcp.servers.github]
cmd = ["npx", "-y", "@modelcontextprotocol/server-github"]
env.GITHUB_TOKEN = "{{ env.GITHUB_TOKEN }}"
description = "GitHub API operations"

################################################################################
# MCP Servers - Docker & Infrastructure Management
################################################################################

[mcp.servers.docker]
protocol = "docker"
url = "http://docker-mcp:8052"
description = "Docker container and image management"

[mcp.servers.dockerhub]
protocol = "docker"
url = "http://dockerhub-mcp:8053"
description = "Docker Hub repository operations"

################################################################################
# MCP Servers - Secrets & Security
################################################################################

[mcp.servers.infisical]
protocol = "docker"
url = "http://infisical-mcp:8055"
description = "Infisical secrets management (PRIMARY)"
env.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID = "{{ env.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}"
env.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET = "{{ env.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}"

[mcp.servers.bitwarden]
protocol = "docker"
url = "http://bitwarden-mcp:8050"
description = "Bitwarden personal secrets management"
env.BWS_ACCESS_TOKEN = "{{ env.BWS_ACCESS_TOKEN }}"

################################################################################
# MCP Servers - Memory & Knowledge
################################################################################

[mcp.servers.graphiti]
cmd = ["npx", "-y", "@graphiti/mcp-server"]
env.FALKORDB_URL = "redis://falkordb:6379"
env.FALKORDB_PASSWORD = "{{ env.FALKORDB_PASSWORD }}"
description = "Graphiti temporal knowledge graph backed by FalkorDB"

################################################################################
# MCP Servers - AI Orchestration
################################################################################

[mcp.servers.claude-flow]
cmd = ["cmd", "/c", "npx", "@claude-flow/cli@latest", "mcp", "start"]
env.CLAUDE_FLOW_MODE = "v3"
env.CLAUDE_FLOW_HOOKS_ENABLED = "true"
env.CLAUDE_FLOW_TOPOLOGY = "hierarchical-mesh"
env.CLAUDE_FLOW_MAX_AGENTS = "15"
env.CLAUDE_FLOW_MEMORY_BACKEND = "hybrid"
description = "Claude Flow v3 multi-agent orchestration"

[mcp.servers.archon]
protocol = "sse"
url = "http://archon-mcp:8051/sse"
description = "Archon OS orchestration platform"

################################################################################
# MCP Servers - Development Tools
################################################################################

[mcp.servers.sequential-thinking]
protocol = "docker"
url = "http://sequential-thinking-mcp:8056"
description = "Advanced multi-step reasoning"

[mcp.servers.codanna]
cmd = ["codanna", "mcp", "serve"]
description = "Codanna symbol graph and code analysis"

[mcp.servers.serena]
cmd = ["uvx", "--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server"]
description = "Serena LSP-powered semantic retrieval"

################################################################################
# MCP Servers - Search & Research
################################################################################

[mcp.servers.tavily]
cmd = ["npx", "-y", "mcp-remote", "https://mcp.tavily.com/mcp/?tavilyApiKey={{ env.TAVILY_API_KEY }}"]
description = "Tavily AI-powered web search"

[mcp.servers.perplexity]
cmd = ["npx", "-y", "@perplexity/mcp-server"]
env.PERPLEXITY_API_KEY = "{{ env.PERPLEXITY_API_KEY }}"
description = "Perplexity deep research"

[mcp.servers.firecrawl]
cmd = ["npx", "-y", "@firecrawl/mcp-server"]
env.FIRECRAWL_API_KEY = "{{ env.FIRECRAWL_API_KEY }}"
description = "Firecrawl web scraping"

################################################################################
# MCP Servers - Integrations (Optional)
################################################################################

[mcp.servers.notion]
cmd = ["npx", "-y", "@notionhq/mcp-server"]
env.NOTION_TOKEN = "{{ env.NOTION_TOKEN }}"
description = "Notion workspace integration"

[mcp.servers.twenty]
protocol = "sse"
url = "http://twenty:3000/mcp/sse"
description = "TwentyCRM app integration"

[mcp.servers.twentycrm-mcp]
protocol = "sse"
url = "http://twentycrm-mcp:8082"
description = "TwentyCRM MCP server for CRM operations"

[mcp.servers.composio]
protocol = "sse"
url = "http://composio-mcp:8086"
description = "Composio MCP for third-party integrations"

[mcp.servers.activepieces]
protocol = "sse"
url = "http://activepieces-mcp:8087"
description = "Activepieces MCP for workflow automation"

[mcp.servers.n8n]
protocol = "sse"
url = "http://n8n-mcp:8088"
description = "n8n MCP server for workflow orchestration"

################################################################################
# Fuzzy Tool Search Configuration
################################################################################
[mcp.tool_search]
enabled = true
# Context-aware fuzzy matching across all MCP servers
fuzzy_match_threshold = 0.7
max_results = 20

################################################################################
# Telemetry & Observability
################################################################################
[telemetry]
enabled = true

# Metrics export
[telemetry.metrics.exporters.otlp]
enabled = true
endpoint = "http://tempo:4317"  # Or Prometheus endpoint
protocol = "grpc"

# Traces export (OpenTelemetry)
[telemetry.traces.exporters.otlp]
enabled = true
endpoint = "http://tempo:4317"
protocol = "grpc"

# Logs export
[telemetry.logs.exporters.otlp]
enabled = false  # Enable if needed
# endpoint = "http://loki:4317"
# protocol = "grpc"

################################################################################
# Security Configuration
################################################################################

# CORS Configuration
[security.cors]
enabled = true
allowed_origins = [
    "http://localhost:3000",
    "http://localhost:3737",  # Archon UI
    "http://localhost:8080",  # Open WebUI
    "https://nyra.ratehunter.net",
    "https://ratehunter.net"
]
allowed_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allowed_headers = ["*"]
max_age = 3600

# CSRF Protection
[security.csrf]
enabled = true

# TLS/HTTPS (disable for local dev, enable for production)
[security.tls]
enabled = false
# cert_path = "/etc/nexus/certs/cert.pem"
# key_path = "/etc/nexus/certs/key.pem"

# OAuth2 Configuration (optional)
# [security.oauth2]
# enabled = false
# jwks_url = "https://your-auth-provider/.well-known/jwks.json"

################################################################################
# Role-Based Access Control (RBAC)
################################################################################

# Define user groups
[rbac.groups.admin]
users = ["{{ env.ADMIN_EMAIL }}"]

[rbac.groups.developers]
users = ["{{ env.DEV_TEAM_EMAILS }}"]

[rbac.groups.agents]
users = ["system:claude-flow", "system:archon"]

# Grant permissions to groups
[rbac.permissions.admin]
groups = ["admin"]
mcp_servers = ["*"]  # Full access

[rbac.permissions.developers]
groups = ["developers"]
mcp_servers = [
    "filesystem-*",
    "git-*",
    "github",
    "docker",
    "dockerhub",
    "codanna",
    "serena",
    "sequential-thinking"
]

[rbac.permissions.agents]
groups = ["agents"]
mcp_servers = [
    "infisical",
    "graphiti",
    "claude-flow",
    "archon"
]

################################################################################
# Performance & Optimization
################################################################################

# Connection pooling for HTTP MCP servers
[performance.connection_pool]
max_connections_per_server = 10
idle_timeout = "30s"
connect_timeout = "10s"

# Caching configuration
[performance.cache]
enabled = true
ttl = "300s"  # 5 minutes
max_entries = 10000

################################################################################
# Smart Routing Rules (Context-Aware)
################################################################################

# Route cheap/simple tasks to Gemini
[[routing.rules]]
name = "cheap-tasks"
condition.token_count_max = 4000
condition.complexity = "low"
target_models = ["google/gemini-flash", "google/gemini-cheap"]
weight = 1.0

# Route medium complexity to Claude Haiku
[[routing.rules]]
name = "medium-tasks"
condition.token_count_max = 20000
condition.complexity = "medium"
target_models = ["anthropic/claude-fast"]
weight = 1.0

# Route complex/coding tasks to Claude Sonnet (PRIMARY)
[[routing.rules]]
name = "complex-tasks"
condition.token_count_min = 20000
condition.complexity = "high"
target_models = ["anthropic/claude-sonnet"]
weight = 1.0

# Fallback to Sonnet for everything else
[[routing.rules]]
name = "default"
target_models = ["anthropic/claude-sonnet"]
weight = 0.5

################################################################################
# Tool Namespacing & Organization
################################################################################

# Automatic namespacing: tools are prefixed with server name
# Examples:
#   - github__search_code
#   - filesystem-nyra__read_file
#   - qdrant__vector_search
#   - infisical__get_secret

################################################################################
# Health Checks
################################################################################
[health]
enabled = true
check_mcp_servers = true
check_llm_providers = true
check_interval = "30s"

################################################################################
# Logging
################################################################################
[logging]
level = "info"  # debug | info | warn | error
format = "json"  # json | text
output = "stdout"

# Log specific components
[logging.components]
mcp = "info"
llm = "info"
rate_limits = "warn"
security = "warn"
telemetry = "info"

################################################################################
# Notes
################################################################################

# Smart Routing Strategy:
# 1. Cheap/simple → Gemini Flash (cost optimization)
# 2. Medium complexity → Claude Haiku (balanced)
# 3. Complex/coding → Claude Sonnet 3.5 (primary workhorse)
# 4. Very complex → Claude Opus (when available)
#
# Fuzzy Tool Find:
# - Enabled by default
# - Uses semantic matching across all MCP servers
# - Returns top 20 most relevant tools
#
# MCP Server Categories:
# 1. Infrastructure: filesystem, git, github, docker
# 2. Secrets: infisical (primary), bitwarden (secondary)
# 3. Memory: graphiti (FalkorDB)
# 4. Orchestration: claude-flow, archon
# 5. Development: codanna, serena, sequential-thinking
# 6. Research: tavily, perplexity, firecrawl
# 7. Integrations: notion, twenty
#
# Multi-PC Architecture:
# - Orchestrator PC: Runs Nexus Router + all MCP servers
# - Worker PCs (3x): Connect to Nexus via Cloudflare Tunnel
# - Redis backend: Distributed rate limiting across cluster
# - Health checks: Monitor all 4 PCs
#
# Security:
# - RBAC enabled for granular access control
# - Rate limiting prevents abuse
# - CORS configured for web UIs
# - OAuth2 ready for production
# - TLS disabled for local dev (enable for production)
