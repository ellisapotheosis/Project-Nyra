##############################################################################
# Project Nyra — Grafbase Nexus v3.0
# THE single entrypoint: MCP tool aggregation + LLM proxy + fuzzy discovery
#
# Topology:
#   Claude Code / agents
#       └─► Nexus :6000 (orchestrator)
#               ├─► LiteLLM :4000 → GPU workers (primary, ~80% traffic)
#               │       ├─► worker-5090 (reasoning, 32GB VRAM)
#               │       ├─► worker-3090 (analysis, 24GB VRAM)
#               │       └─► worker-3060 (coding, 12GB VRAM)
#               ├─► Anthropic API (fallback, Claude 4 family)
#               ├─► OpenAI API (fallback, GPT-4o / GPT-5)
#               ├─► OpenRouter (last-resort, 200+ models)
#               └─► MCP servers
#                       ├─ orchestrator-local (same Docker network)
#                       │       └─► docker-mcp-toolkit :8811
#                       └─ oracle VPS via Tailscale (100.64.0.3)
#                               ├─► archon-os :3737
#                               ├─► openmemory-mcp :8765
#                               ├─► infisical-mcp :8766
#                               ├─► n8n :5678
#                               ├─► twenty-crm :3000
#                               └─► mem0-rest :5000
##############################################################################

# ── SERVER ───────────────────────────────────────────────────────────────────

[server]
listen_address = "0.0.0.0:3000"

[server.health]
enabled = true
path = "/health"

[server.cors]
enabled = true
allow_origins = ["*"]
allow_headers = ["authorization", "content-type", "x-api-key", "x-request-id"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

# ── LLM PROXY ─────────────────────────────────────────────────────────────────
# Exposes OpenAI-compatible (/v1) and Anthropic-compatible (/anthropic) endpoints.
# Routing priority: litellm (GPU workers) → anthropic → openai → openrouter
# ─────────────────────────────────────────────────────────────────────────────

[llm]
enabled = true

[llm.protocols.openai]
enabled = true
path = "/v1"

[llm.protocols.anthropic]
enabled = true
path = "/anthropic"

# PRIMARY: LiteLLM proxy — intelligent routing to GPU workers
# LiteLLM handles load balancing, failover, and model aliasing for local inference.
# wildcard "*" means Nexus forwards any model name to LiteLLM for resolution.
[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_MASTER_KEY }}"
base_url = "http://litellm:4000/v1"
forward_token = false

[llm.providers.litellm.models."*"]

# LLM TIER REFERENCE (for LiteLLM config / routing decisions):
#   economy  → claude-haiku, gpt-4o-mini, gemini-flash  (~$0.0002/1K, ~500ms)
#   standard → claude-sonnet, gpt-4o, gemini-pro        (~$0.003/1K,  ~2s)
#   premium  → claude-opus, o3, deepseek-r1             (~$0.015/1K,  ~5s)
#   local    → GPU workers via LiteLLM                  ($0,          ~1-5s)

# FALLBACK 1: Anthropic direct — Claude 4 family (latest as of Aug 2025)
[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"

[llm.providers.anthropic.models."claude-opus-4-7"]
[llm.providers.anthropic.models."claude-sonnet-4-6"]
[llm.providers.anthropic.models."claude-haiku-4-5-20251001"]
# Legacy Claude 3.5 retained for backward compatibility
[llm.providers.anthropic.models."claude-3-5-sonnet-20241022"]
[llm.providers.anthropic.models."claude-3-5-haiku-20241022"]

# FALLBACK 2: OpenAI direct
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
forward_token = true

[llm.providers.openai.models."gpt-4o"]
[llm.providers.openai.models."gpt-4o-mini"]
[llm.providers.openai.models."gpt-5"]
[llm.providers.openai.models."o3"]
[llm.providers.openai.models."o4-mini"]

# FALLBACK 3: OpenRouter — 200+ models, used when local + cloud APIs unavailable
# Good for: deepseek-r1 (reasoning), Gemini (cheap/fast), Llama (open weights)
[llm.providers.openrouter]
type = "openai"
api_key = "{{ env.OPENROUTER_API_KEY }}"
base_url = "https://openrouter.ai/api/v1"
forward_token = false

[llm.providers.openrouter.models."deepseek/deepseek-r1"]
[llm.providers.openrouter.models."meta-llama/llama-3.1-405b-instruct"]
[llm.providers.openrouter.models."google/gemini-2.0-flash-exp"]
[llm.providers.openrouter.models."google/gemini-pro-1.5"]
[llm.providers.openrouter.models."mistralai/mistral-large-2411"]
[llm.providers.openrouter.models."anthropic/claude-3.5-sonnet"]

# ── MCP AGGREGATION ───────────────────────────────────────────────────────────
# All tool calls route through Nexus /mcp — agents never talk to servers directly.
# Nexus discovers tools from each server and exposes them via unified fuzzy search.
# ─────────────────────────────────────────────────────────────────────────────

[mcp]
enabled = true
path = "/mcp"

# ── Orchestrator-local MCP servers (same Docker network = no Tailscale hop) ──

# Docker MCP Toolkit: container mgmt + filesystem via Docker socket
# Gives agents the ability to run docker commands, read/write host files.
[mcp.servers.docker-toolkit]
url = "http://nyra-docker-toolkit:8811"

# ── Oracle VPS MCP servers (100.64.0.3 via Tailscale mesh, always-on) ────────

# Archon OS: AI agent orchestration framework (spawns sub-agents, manages tasks)
[mcp.servers.archon]
url = "http://100.64.0.3:3737/mcp/sse"

# OpenMemory MCP: self-hosted mem0 memory server with Qdrant vector backend
# MCP SSE endpoint format: /mcp/{client_name}/sse/{user_id}
[mcp.servers.openmemory]
url = "http://100.64.0.3:8765/mcp/nexus/sse/nyra"

# Infisical MCP: secrets read/write via @infisical/mcp (supergateway stdio→SSE bridge)
# Gives agents the ability to fetch and update secrets from Infisical projects.
[mcp.servers.infisical]
url = "http://100.64.0.3:8766/sse"

# n8n: workflow execution, trigger automation pipelines, inspect executions
[mcp.servers.n8n]
url = "http://100.64.0.3:5678/mcp"

# TwentyCRM: borrower/lead/deal management (open-source CRM)
[mcp.servers.twenty]
url = "http://100.64.0.3:3000/mcp"

# Mem0 REST API: conversational memory REST interface (search/store/delete memories)
[mcp.servers.mem0]
url = "http://100.64.0.3:5000"

# Letta (MemGPT): Memory management, classification, and autonomous eviction
[mcp.servers.letta]
url = "http://100.64.0.3:8283/mcp"

# memOS: Hierarchical and tensor-based long-term memory
[mcp.servers.memos]
url = "http://100.64.0.3:8085/mcp"

# ── External / cloud MCP servers ──────────────────────────────────────────────

# Mempalace: external graph memory service (URL injected at runtime via env)
# Set MEMPALACE_URL in orchestrator env to activate; leave unset to skip.
[mcp.servers.mempalace]
url = "{{ env.MEMPALACE_URL }}"

# ── TOOL DISCOVERY & FUZZY SEARCH ────────────────────────────────────────────
# Nexus indexes all tools from all MCP servers and serves them via unified search.
# Agents query /mcp/tools?q=<term> to discover tools across the entire stack.
# Hybrid ranking = TF-IDF relevance + recency + usage frequency signals.
# ─────────────────────────────────────────────────────────────────────────────

[tool_search]
enabled = true
fuzzy_match = true
max_results = 50
ranking_strategy = "hybrid"

# ── RATE LIMITING ─────────────────────────────────────────────────────────────

[rate_limits]
enabled = true

[rate_limits.backend]
type = "redis"
url = "redis://redis:6379"

# ── RESPONSE CACHE ────────────────────────────────────────────────────────────
# Deduplicates identical LLM + tool calls within TTL window.
# Significant cost savings for high-frequency borrower scoring and doc-classification.

[cache]
enabled = true
type = "redis"
url = "redis://redis:6379"
ttl = 900
prefix = "nexus:"
