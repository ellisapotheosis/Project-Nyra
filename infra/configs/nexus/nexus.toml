##############################################################################
# Project Nyra — Nexus Router (single entrypoint / proxy aggregator)
##############################################################################

[server]
listen_address = "0.0.0.0:4000"

[server.health]
enabled = true
path = "/health"

[server.cors]
enabled = true
allow_origins = ["*"]
allow_headers = ["authorization", "content-type", "x-api-key"]
allow_methods = ["GET", "POST", "OPTIONS"]

# -----------------------------------------------------------------------------
# LLM Proxying (use Nexus as the single LLM+MCP entrypoint)
# -----------------------------------------------------------------------------
[llm]
enabled = true

# OpenAI-compatible endpoint (used by many apps)
[llm.protocols.openai]
enabled = true
path = "/v1"

# Anthropic-compatible endpoint (for Claude Code / Anthropic SDK clients)
[llm.protocols.anthropic]
enabled = true
path = "/anthropic"

# Primary local gateway: LiteLLM -> workers (vLLM + Ollama)
[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_MASTER_KEY }}"
base_url = "http://litellm:4000/v1"
forward_token = false

[llm.providers.litellm.models."*"]

# Optional direct cloud providers (kept as explicit fallbacks)
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
forward_token = true
[llm.providers.openai.models."gpt-4o-mini"]
[llm.providers.openai.models."gpt-4o"]

[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"
[llm.providers.anthropic.models."claude-3-5-sonnet-20241022"]
[llm.providers.anthropic.models."claude-3-5-haiku-20241022"]

# -----------------------------------------------------------------------------
# MCP Aggregation (everything funnels through Nexus /mcp)
# -----------------------------------------------------------------------------
[mcp]
enabled = true
path = "/mcp"

# Remote/self-hosted MCP servers (HTTP/SSE)
[mcp.servers.archon]
url = "http://archon:3000/mcp/sse"

[mcp.servers.n8n]
url = "http://n8n:5678/mcp"

[mcp.servers.twenty]
url = "http://twentycrm:3000/mcp"

# Docker-launched MCP servers (via docker socket) for local tool access
[mcp.servers.github]
type = "docker"
image = "ghcr.io/modelcontextprotocol/servers/github:latest"
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "{{ env.GITHUB_TOKEN }}" }

[mcp.servers.filesystem]
type = "docker"
image = "ghcr.io/modelcontextprotocol/servers/filesystem:latest"
args = ["/projects"]
volumes = ["/projects:/projects"]

[mcp.servers.git]
type = "docker"
image = "ghcr.io/modelcontextprotocol/servers/git:latest"
volumes = ["/projects:/projects"]

# Fuzzy tool search / discovery (Nexus built-in)
[tool_search]
enabled = true
fuzzy_match = true
max_results = 50
ranking_strategy = "hybrid"

# Rate limits and cache (use Redis)
[rate_limits]
enabled = true

[rate_limits.backend]
type = "redis"
url = "redis://redis:6379"

[cache]
enabled = true
type = "redis"
url = "redis://redis:6379"
ttl = 900
prefix = "nexus:"
