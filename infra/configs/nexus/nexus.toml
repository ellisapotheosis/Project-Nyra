[server]
host = "0.0.0.0"
port = 7000
metrics_port = 9091

[mcp]
enabled = true
aggregator_port = 8080

[providers.litellm]
type = "openai_compatible"
base_url = "http://litellm:4000"
api_key_env = "LITELLM_MASTER_KEY"
models = ["*"]

[logging]
level = "info"
format = "json"

[metrics]
enabled = true
prometheus_endpoint = "/metrics"
