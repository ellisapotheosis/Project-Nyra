##############################################################################
# Project Nyra — Grafbase Nexus v3.0
# THE single entrypoint: MCP tool aggregation + LLM proxy + fuzzy discovery
#
# Topology:
#   Claude Code / agents
#       └─► Nexus :6000 (orchestrator)
#               ├─► LiteLLM :4000 → GPU workers (primary, ~80% traffic)
#               │       ├─► worker-5090 (reasoning, 32GB VRAM)
#               │       ├─► worker-3090 (analysis, 24GB VRAM)
#               │       └─► worker-3060 (utility, 12GB VRAM)
#               ├─► Anthropic API (fallback, Claude 4 family)
#               ├─► OpenAI API (fallback, GPT-4o / GPT-5)
#               ├─► OpenRouter (last-resort, 200+ models)
#               └─► MCP servers
#                       ├─ orchestrator-local (same Docker network)
#                       │       └─► docker-mcp-toolkit :8811
#                       └─ oracle VPS via Tailscale (100.64.0.31)
#                               ├─► openmemory-mcp :8765
#                               ├─► infisical-mcp :8766
#                               ├─► n8n :5678
#                               ├─► twenty-crm :3000
#                               ├─► mem0-rest :5000
#                               ├─► mem-os :8085
#                               └─► letta :8283
##############################################################################

# ── SERVER ───────────────────────────────────────────────────────────────────

[server]
listen_address = "0.0.0.0:3000"

[server.health]
enabled = true
path = "/health"

[server.cors]
enabled = true
allow_origins = ["*"]
allow_headers = ["authorization", "content-type", "x-api-key", "x-request-id"]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]

# ── LLM PROXY ─────────────────────────────────────────────────────────────────
# Exposes OpenAI-compatible (/v1) and Anthropic-compatible (/anthropic) endpoints.
# Routing priority: litellm (GPU workers) → anthropic → openai → openrouter
# ─────────────────────────────────────────────────────────────────────────────

[llm]
enabled = true

[llm.protocols.openai]
enabled = true
path = "/v1"

[llm.protocols.anthropic]
enabled = true
path = "/anthropic"

# PRIMARY: LiteLLM proxy — intelligent routing to GPU workers (5090, 3090ti)
[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_MASTER_KEY }}"
base_url = "http://litellm:4000/v1"
forward_token = false

[llm.providers.litellm.models."*"]

# UTILITY: worker-rtx3060 (laptop) — dedicated to embeddings, extraction, and background tasks
[llm.providers.utility-3060]
type = "openai"
api_key = "dummy"
base_url = "http://worker-rtx3060.trex-fiordland.ts.net:11434/v1"
forward_token = false

[llm.providers.utility-3060.models."nomic-embed-text"]
[llm.providers.utility-3060.models."all-minilm:l6-v2"]
[llm.providers.utility-3060.models."llama3.2:3b"]
[llm.providers.utility-3060.models."phi3:mini"]
[llm.providers.utility-3060.models."mistral:7b-v0.3"]

# LLM TIER REFERENCE (for LiteLLM config / routing decisions):
#   economy  → claude-haiku, gpt-4o-mini, gemini-flash  (~$0.0002/1K, ~500ms)
#   standard → claude-sonnet, gpt-4o, gemini-pro        (~$0.003/1K,  ~2s)
#   premium  → claude-opus, o3, deepseek-r1             (~$0.015/1K,  ~5s)
#   local    → GPU workers via LiteLLM                  ($0,          ~1-5s)

# FALLBACK 1: Anthropic direct
[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"
enabled = true

[llm.providers.anthropic.models."claude-3-5-sonnet-20241022"]
[llm.providers.anthropic.models."claude-3-5-haiku-20241022"]

# ── MCP AGGREGATION ───────────────────────────────────────────────────────────
# All tool calls route through Nexus /mcp — agents never talk to servers directly.
# Nexus discovers tools from each server and exposes them via unified fuzzy search.
# ─────────────────────────────────────────────────────────────────────────────

[mcp]
enabled = true
path = "/mcp"

# ── Orchestrator-local MCP servers ──

# Docker MCP Toolkit: container mgmt + filesystem via Docker socket
[mcp.servers.docker-toolkit]
url = "http://nyra-docker-toolkit:8811"

# ── Oracle VPS MCP servers (100.64.0.31 via Tailscale mesh, always-on) ───────

# OpenMemory MCP: self-hosted mem0 memory server with Qdrant vector backend
[mcp.servers.openmemory]
url = "http://100.64.0.31:8765/mcp/nexus/sse/nyra"

# Infisical MCP: secrets read/write via @infisical/mcp
[mcp.servers.infisical]
url = "http://100.64.0.31:8766/sse"

# n8n: workflow execution
[mcp.servers.n8n]
url = "http://100.64.0.31:5678/mcp"

# TwentyCRM: borrower/lead/deal management
[mcp.servers.twenty]
url = "http://100.64.0.31:3000/mcp"

# Mem0 REST API: conversational memory
[mcp.servers.mem0]
url = "http://100.64.0.31:5000/sse"

# memOS: Hierarchical and tensor-based long-term memory
[mcp.servers.memos]
url = "http://100.64.0.31:8085/mcp"

# Letta (MemGPT): Memory management and autonomous context orchestration
[mcp.servers.letta]
url = "http://100.64.0.31:8283/mcp"

# Claudemem: Cross-session persistent observation memory (Orchestrator)
[mcp.servers.claudemem]
url = "http://orchestrator.trex-fiordland.ts.net:37700/mcp"

# ── External / cloud MCP servers ──────────────────────────────────────────────

# Mempalace: memory palace graph-based indexing
[mcp.servers.mempalace]
url = "http://100.64.0.31:8002/sse"

# ── TOOL DISCOVERY & FUZZY SEARCH ────────────────────────────────────────────

[tool_search]
enabled = true
fuzzy_match = true
max_results = 50
ranking_strategy = "hybrid"

# ── RATE LIMITING ─────────────────────────────────────────────────────────────

[rate_limits]
enabled = true

[rate_limits.backend]
type = "redis"
url = "redis://redis:6379"

# ── RESPONSE CACHE ────────────────────────────────────────────────────────────

[cache]
enabled = true
type = "redis"
url = "redis://redis:6379"
ttl = 900
prefix = "nexus:"
