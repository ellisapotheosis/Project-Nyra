  # ── Tunnels & DNS ─────────────────────────────────────────────────────────
  - title: Tunnels & DNS
    icon: mdi:tunnel
    path: tunnels-dns
    cards:
      - type: markdown
        title: Cloudflare Tunnel Status
        content: |
          Check tunnel health at: [status.projectnyra.com](https://status.projectnyra.com)

          **Orchestrator tunnel** serves:
          - Control plane: admin, chat, campaigns, quotes, status, ha
          - Worker UIs: nerve-*/claw-*/picoclaw-* (via Tailscale)
          - Oracle proxies: litellm, nexus, letta, crm-ui (via Tailscale)

          **Oracle tunnel** serves:
          - App: app, api, hooks, crm, n8n, grafana, openwebui, openlit
          - Storage: gitea, activepieces, paperclip, clawteam
          - Status: uptime, public-status, oracle

          **ratehunter.net** → Cloudflare Pages (not a tunnel)

      - type: url
        name: Cloudflare Zero Trust Dashboard
        url: https://dash.cloudflare.com
        icon: mdi:cloud-lock
