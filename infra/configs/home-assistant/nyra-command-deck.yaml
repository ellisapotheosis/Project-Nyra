# Nyra Command Deck — Home Assistant Lovelace Dashboard
#
# Deploy via: HA UI → Settings → Dashboards → Add Dashboard → YAML mode
# Or place in config/ui_lovelace.yaml (manual mode) and reload.
#
# Sensitive portals (Portainer, Prometheus, Grafana) use url cards that
# open in a new tab rather than iframes to avoid X-Frame-Options blocks.

title: Nyra Command Deck
