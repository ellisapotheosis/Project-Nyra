# Gitea Actions Runner Configuration
# Project Nyra CI/CD Infrastructure

log:
  level: info

runner:
  file: .runner
  capacity: 4
  envs:
    DOCKER_HOST: unix:///var/run/docker.sock
    CLAUDE_FLOW_CI: "true"
    NYRA_CI: "true"
  timeout: 3h
  shutdown_timeout: 3m
  insecure: false
  fetch_timeout: 5s
  fetch_interval: 2s
  labels:
    - "ubuntu-latest:docker://node:20"
    - "ubuntu-22.04:docker://ubuntu:22.04"
    - "self-hosted:host"
    - "claude-flow:docker://nyra/claude-flow:dev"

cache:
  enabled: true
  dir: /data/cache
  host:
    enabled: true
    workdir_parent: /data/workdir

container:
  network: nyra-network
  privileged: false
  options: --cpus 2 --memory 4g
  workdir_parent: /data/workdir
  valid_volumes:
    - /var/run/docker.sock:/var/run/docker.sock
    - /data/cache:/data/cache
  docker_host: unix:///var/run/docker.sock
  force_pull: false

host:
  workdir_parent: /data/workdir
