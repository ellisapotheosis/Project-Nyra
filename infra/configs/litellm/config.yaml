litellm_settings:
  set_verbose: false
  success_callback:
    - opentelemetry
  failure_callback:
    - opentelemetry
  cache: true
  cache_params:
    type: redis-semantic
    host: "100.64.0.6"
    port: 6379
    similarity_threshold: 0.8
    redis_semantic_cache_embedding_model: "local/embeddings"
    ttl: 3600

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: "postgresql://nyra:SA%21rMsdctQ2ThIzC5sZL%21l%26%250%40R7if3E@postgres:5432/shared-db"
  otel_exporter_otlp_endpoint: "http://oracle-vps-openlit:4318"
