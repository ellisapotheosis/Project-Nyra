# Project Nyra primary LiteLLM gateway.
# Mounted by infra/hosts/oracle-vps/docker-compose.yml.
# Keep this catalog deliberately small: Qwen3.8 local inference, the required
# embedding model, OpenRouter free routes, and OmniRoute free routing only.

model_list:
  # RTX 5090: Qwen3.8-27B Q4_K_M through llama.cpp.
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/Qwen3.8-27B
      # Oracle reaches the always-on 5090 over its private Tailscale/DNS name.
      # The public projectnyra hostname is not resolvable from the Oracle
      # container network and would turn this into a DNS timeout.
      api_base: http://worker-rtx5090:8000/v1
      api_key: "not-needed"
      timeout: 300
      stream_timeout: 420

  # RTX 3090 Ti: same Qwen3.8-27B Q4 deployment when that worker is online.
  - model_name: local/qwen3.8-27b-3090ti
    litellm_params:
      model: openai/Qwen3.8-27B
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 300
      stream_timeout: 420

  # RTX 3060: small Qwen utility route. The embedding model is retained for
  # the canonical Mem0/Qdrant memory path and is not a chat model.
  - model_name: local/qwen3-4b-3060
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://worker-rtx3060.projectnyra.com:11434
      timeout: 120
      max_tokens: 4096

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://worker-rtx3060.projectnyra.com:11434
      timeout: 120

  # OmniRoute aliases. OmniRoute owns provider selection and is configured as
  # the free route; do not add subscription/paid aliases here.
  - model_name: omniroute/free
    litellm_params:
      model: openai/auto
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300

  - model_name: omniroute/free-fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 120

  - model_name: omniroute/free-coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 240

  # OpenRouter models selected from the currently advertised :free catalog.
  - model_name: openrouter/free-gemma
    litellm_params:
      model: openrouter/google/gemma-4-26b-a4b-it:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/free-nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/free-minimax
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - {
        "local/qwen3.8-27b":
          [
            "local/qwen3.8-27b-3090ti",
            "omniroute/free",
            "openrouter/free-gemma",
          ],
      }
    - {
        "local/qwen3.8-27b-3090ti":
          ["local/qwen3.8-27b", "omniroute/free", "openrouter/free-gemma"],
      }
    - {
        "local/qwen3-4b-3060":
          ["omniroute/free-fast", "openrouter/free-nemotron"],
      }
    - { "omniroute/free": ["omniroute/free-fast", "openrouter/free-gemma"] }
    - {
        "omniroute/free-fast":
          ["openrouter/free-nemotron", "local/qwen3-4b-3060"],
      }
    - {
        "omniroute/free-coding": ["local/qwen3.8-27b", "openrouter/free-gemma"],
      }

litellm_settings:
  set_verbose: false
  drop_params: true
  request_timeout: 420
  mcp_aliases:
    cloudflare: cloudflare
    cloudflare_api: cloudflare_api
    cloudflare_docs: cloudflare_docs
    cloudflare_bindings: cloudflare_bindings
    cloudflare_builds: cloudflare_builds
    cloudflare_observability: cloudflare_observability
    cloudflare_ai_gateway: cloudflare_ai_gateway

mcp_servers:
  cloudflare:
    url: "https://mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
  cloudflare_api:
    url: "https://mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
  cloudflare_docs:
    url: "https://docs.mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
  cloudflare_bindings:
    url: "https://bindings.mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
  cloudflare_builds:
    url: "https://builds.mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
  cloudflare_observability:
    url: "https://observability.mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
  cloudflare_ai_gateway:
    url: "https://ai-gateway.mcp.cloudflare.com/mcp"
    transport: "http"
    allow_all_keys: true

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
