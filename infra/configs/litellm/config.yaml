# =============================================================================
# Project-Nyra — canonical LiteLLM control plane
# =============================================================================
# Host:    oracle-vps (100.64.0.3, aarch64)
# Image:   ghcr.io/berriai/litellm@sha256:a53a7d3ffebede1925bd3ee8a21e4a7b9b63e2e68ec883af136edcccb6eeb82c  (v1.99.1)
# Mounted: read-only at /app/config.yaml by the root compose `oracle` profile.
#
# LiteLLM is the ONLY Nyra model gateway and the ONLY MCP aggregation layer.
# Agents receive logical aliases and scoped virtual keys. They do not know about
# individual vLLM hosts, OmniRoute, OpenRouter or provider fallback order.
#
# Every field below was validated against the pinned v1.99.1 image. Fields that
# do not exist in v1.99.1 are documented in docs/refactor/LITELLM_ENDPOINTS.md
# and are deliberately absent here.
# =============================================================================

model_list:
  # ---------------------------------------------------------------------------
  # Local GPU inference — highest priority tier.
  # Reached over Tailnet IPs. Never over public projectnyra.com hostnames.
  # `--served-model-name` on each vLLM deployment is a Nyra naming contract:
  #   worker-rtx5090   -> nyra-primary
  #   worker-rtx3090ti -> nyra-secondary
  # ---------------------------------------------------------------------------
  - model_name: nyra-general
    litellm_params:
      model: openai/nyra-primary
      api_base: http://100.64.0.11:8000/v1
      api_key: "local-no-auth"
      timeout: 300
      stream_timeout: 420
    model_info:
      nyra_tier: local-gpu
      nyra_host: worker-rtx5090

  - model_name: nyra-general
    litellm_params:
      model: openai/nyra-secondary
      api_base: http://100.64.0.13:8000/v1
      api_key: "local-no-auth"
      timeout: 300
      stream_timeout: 420
    model_info:
      nyra_tier: local-gpu
      nyra_host: worker-rtx3090ti

  - model_name: nyra-reasoning
    litellm_params:
      model: openai/nyra-primary
      api_base: http://100.64.0.11:8000/v1
      api_key: "local-no-auth"
      timeout: 420
      stream_timeout: 600
    model_info:
      nyra_tier: local-gpu
      nyra_host: worker-rtx5090

  - model_name: nyra-coding
    litellm_params:
      model: openai/nyra-primary
      api_base: http://100.64.0.11:8000/v1
      api_key: "local-no-auth"
      timeout: 300
      stream_timeout: 420
    model_info:
      nyra_tier: local-gpu
      nyra_host: worker-rtx5090

  # ---------------------------------------------------------------------------
  # Embedding lane — orchestrator CPU (llama.cpp), NOT a GPU worker.
  #
  # The embedder is a dedicated CPU-side llama.cpp service. The model family
  # and dimension count are invariant, so the
  # existing Qdrant collections and MEM0_EMBEDDING_DIMS=768 remain valid and
  # nothing is re-embedded.
  #
  # Equivalence was MEASURED, not assumed. Same prompt through the
  # llama.cpp service and its reference artifact
  # nomic-embed-text-v1.5.f16.gguf:
  #   dims 768 vs 768, both L2-normalised, cosine similarity 0.999999581,
  #   max elementwise delta 9.9e-05 (float rounding).
  # llama.cpp /v1/models reports n_embd=768, n_params=136727040, ftype=F16 —
  # the same nomic-embed-text-v1.5 artifact.
  #
  # Why it moved off the GPU: embedding is memory-bandwidth-bound on a 137M
  # model and does not need VRAM. Hosting it on orchestrator returns the
  # resident-embedder allowance to vLLM on both 24 GB workers and removes the
  # 5090 vLLM runtime from the critical path of semantic tool filtering.
  # ---------------------------------------------------------------------------
  - model_name: nyra-embedding
    litellm_params:
      model: openai/nomic-embed-text
      api_base: http://100.64.0.10:8081/v1
      api_key: "local-no-auth"
      timeout: 120
    model_info:
      nyra_tier: local-cpu
      nyra_host: orchestrator
      mode: embedding
      output_vector_size: 768

  - model_name: nyra-memory
    litellm_params:
      model: openai/nyra-primary
      api_base: http://100.64.0.11:8000/v1
      api_key: os.environ/LITELLM_MASTER_KEY
      timeout: 420
      stream_timeout: 600
    model_info:
      nyra_tier: local-gpu
      nyra_host: worker-rtx5090
      nyra_workload: memory-extraction-fallback

  # ---------------------------------------------------------------------------
  # OmniRoute — second tier. OmniRoute owns its own provider pool and
  # credential logic internally. It sits BEHIND LiteLLM and is never the front
  # door. Bound Tailnet-only on Oracle; port 20128 is never published publicly.
  # ---------------------------------------------------------------------------
  - model_name: omniroute-free
    litellm_params:
      model: openai/auto/best-free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300
    model_info:
      nyra_tier: omniroute

  - model_name: omniroute-fast
    litellm_params:
      model: openai/auto/best-free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 120
    model_info:
      nyra_tier: omniroute

  - model_name: omniroute-coding
    litellm_params:
      model: openai/auto/coding:free
      api_base: http://omniroute:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 240
    model_info:
      nyra_tier: omniroute

  # ---------------------------------------------------------------------------
  # OpenRouter — third tier. Model ids below were re-verified against the LIVE
  # https://openrouter.ai/api/v1/models catalog during this migration; all three
  # are still present in the current 18-entry `:free` catalog.
  # ---------------------------------------------------------------------------
  - model_name: openrouter-nemotron
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120
    model_info:
      nyra_tier: openrouter

  - model_name: openrouter-minimax
    litellm_params:
      model: openrouter/minimax/minimax-m3:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 180
    model_info:
      nyra_tier: openrouter

  # No paid provider routes are declared. OPENAI_API_KEY / ANTHROPIC_API_KEY
  # deployments are intentionally absent: declaring a provider that is not
  # budget-authorized creates a meaningless blank dependency and a credential
  # the gateway does not need to hold.

# =============================================================================
# Router — local GPU -> OmniRoute -> OpenRouter. Paid routes are not in the
# chain because none are enabled.
# =============================================================================
router_settings:
  routing_strategy: usage-based-routing-v2
  num_retries: 2
  retry_after: 2
  allowed_fails: 2
  cooldown_time: 30
  fallbacks:
    - { "nyra-general": ["omniroute-free", "openrouter-nemotron"] }
    - { "nyra-reasoning": ["omniroute-free", "openrouter-minimax"] }
    - { "nyra-coding": ["omniroute-coding", "openrouter-minimax"] }
    - { "nyra-fast": ["omniroute-fast", "openrouter-nemotron"] }
    - { "nyra-memory": ["nyra-general", "omniroute-fast"] }
    - { "omniroute-free": ["openrouter-nemotron"] }
    - { "omniroute-fast": ["openrouter-nemotron"] }
    - { "omniroute-coding": ["openrouter-minimax"] }

# =============================================================================
# MCP registry — DIRECT registrations only.
#
# There is deliberately NO nexus_router entry, and no entry pointing back at the
# Cloudflare MCP Server Portal that fronts this proxy. Registering that portal
# here would create a control-plane cycle:
#   Portal -> LiteLLM -> Portal.
# The Cloudflare entries below are Cloudflare's OWN product MCP endpoints, which
# are not the Nyra portal.
#
# `allow_all_keys` is FALSE everywhere. Access is granted only through
# mcp_access_groups, which are in turn granted per virtual key.
# =============================================================================
mcp_servers:
  # --- Mortgage / CRM domain --------------------------------------------------
  # Address verified live during migration: `oracle-vps-twenty-mcp` answers
  # `initialize` on http://100.64.0.3:8400/mcp with protocolVersion 2025-06-18
  # and serverInfo {"name":"twenty-mcp-server","version":"1.0.0"}.
  #
  # KNOWN UPSTREAM DEFECT (pre-existing, not introduced by this migration):
  # the server issues an `mcp-session-id` on initialize but then rejects
  # `notifications/initialized` with HTTP 400 and never leaves the
  # uninitialized state, so `tools/list` returns
  # {"code":-32000,"message":"Bad Request: Server not initialized"}.
  # LiteLLM logs `Error listing tools from nyra_crm` and degrades gracefully.
  # The registration is correct and is kept; the upstream handshake bug is a
  # blocker for the mortgage acceptance tests and is tracked in
  # docs/refactor/NYRA_REFACTOR_VALIDATION.md.
  nyra_crm:
    transport: "http"
    url: "http://twenty-mcp:8400/mcp"
    description: >-
      TwentyCRM mortgage pipeline. Read and mutate mortgage leads, contacts,
      pipeline stages and loan metadata. Contains borrower PII.
    mcp_access_groups: ["nyra-mortgage"]
    allow_all_keys: false
    available_on_public_internet: false

  # --- Tailnet operations -----------------------------------------------------
  # Harvested from the LIVE Grafbase Nexus config (`[mcp.servers.tailscale]`),
  # which is the gateway that `mcp-gateway.projectnyra.com` actually reaches
  # today. The listener was verified live: POST /mcp returns 200 to `initialize`
  # and `ss -lntp` shows a node process on the Oracle host.
  #
  # BLOCKED ON A HOST REBIND. The process binds `127.0.0.1:3399` only, so no
  # container can reach it. The legacy Nexus entry used a bare `127.0.0.1` URL
  # that resolved to the Nexus container's OWN loopback and therefore could
  # never have worked either - this server has been silently dead behind the
  # portal. `host.docker.internal:host-gateway` was tested and also fails,
  # because the target is loopback-bound.
  #
  # The URL below is the correct Tailnet address per the "internal traffic uses
  # 100.64.0.0/10" rule. Rebind the process to 100.64.0.3:3399 to activate it;
  # the exact command is in docs/refactor/NYRA_REFACTOR_FINAL_REPORT.md.
  #
  # The auth token is read from the environment. The live Nexus config had it
  # hard-coded as a plaintext literal on the host; that is corrected here, and
  # the token must be rotated.
  nyra_tailscale:
    transport: "http"
    url: "http://100.64.0.3:3399/mcp"
    description: >-
      Tailscale tailnet administration. Inspect and modify devices, ACLs, DNS
      and auth keys for the trex-fiordland tailnet. Mutating and
      infrastructure-wide. Administrators only.
    auth_type: "bearer_token"
    auth_value: os.environ/TAILSCALE_MCP_AUTH_TOKEN
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false
    available_on_public_internet: false

  # --- Cloudflare estate ------------------------------------------------------
  # Unauthenticated documentation server: safe for the developer group.
  cloudflare_docs:
    transport: "http"
    url: "https://docs.mcp.cloudflare.com/mcp"
    description: >-
      Read-only Cloudflare product documentation search. No account access, no
      credentials, no mutation. Use when answering questions about Cloudflare
      product behaviour or configuration syntax.
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  # Token-bearing Cloudflare servers. These drive real account mutation, so they
  # are nyra-admin ONLY. Pre-migration these were all `allow_all_keys: true`,
  # meaning every key in the fleet could administer the Cloudflare zone.
  cloudflare_api:
    transport: "http"
    url: "https://mcp.cloudflare.com/mcp"
    description: >-
      Cloudflare account administration. Reads and mutates zone, DNS, Access and
      tunnel configuration. Destructive and account-wide. Administrators only.
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false

  cloudflare_bindings:
    transport: "http"
    url: "https://bindings.mcp.cloudflare.com/mcp"
    description: >-
      Cloudflare Workers bindings administration — KV, R2, D1, Durable Object
      and queue bindings. Mutating. Administrators only.
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false

  cloudflare_builds:
    transport: "http"
    url: "https://builds.mcp.cloudflare.com/mcp"
    description: >-
      Cloudflare Workers build and deployment history. Inspect and trigger
      builds. Administrators only.
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false

  cloudflare_observability:
    transport: "http"
    url: "https://observability.mcp.cloudflare.com/mcp"
    description: >-
      Cloudflare logs, analytics and Workers observability queries. Read-only
      telemetry over the Cloudflare account.
    auth_type: "bearer_token"
    auth_value: os.environ/CLOUDFLARE_API_TOKEN
    mcp_access_groups: ["nyra-admin", "nyra-observability"]
    allow_all_keys: false

  cloudflare_ai_gateway:
    transport: "http"
    url: "https://ai-gateway.mcp.cloudflare.com/mcp"
    description: >-
      Cloudflare AI Gateway configuration and request-log inspection.
      Administrators only.
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false

  # --- Local stdio MCP servers ----------------------------------------------
  # These commands are run and supervised by LiteLLM itself. There is no
  # Supergateway process and no direct host-published MCP listener. Every
  # client reaches them only through LiteLLM's authenticated /mcp endpoint.
  nyra_infisical:
    transport: "stdio"
    # LiteLLM's container environment includes an empty INFISICAL_TOKEN.  The
    # MCP package validates presence as non-empty even when universal-auth is
    # selected, so remove only that inherited empty variable in the child.
    command: "env"
    args: ["-u", "INFISICAL_TOKEN", "npx", "-y", "@infisical/mcp"]
    env:
      INFISICAL_AUTH_METHOD: "universal-auth"
      INFISICAL_HOST_URL: "https://app.infisical.com"
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: os.environ/INFISICAL_UNIVERSAL_AUTH_CLIENT_ID
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: os.environ/INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
    description: "Infisical secret-management MCP, restricted to administrators."
    mcp_access_groups: ["nyra-admin"]
    allow_all_keys: false

  nyra_git:
    transport: "stdio"
    command: "uvx"
    args: ["mcp-server-git", "--repository", "/workspace"]
    description: "Read-only Project Nyra repository inspection."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_magicui:
    transport: "stdio"
    command: "npx"
    args: ["-y", "@magicuidesign/mcp@latest"]
    description: "Magic UI component discovery for Project Nyra."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_shadcn:
    transport: "stdio"
    command: "npx"
    args: ["-y", "shadcn@latest", "mcp"]
    description: "shadcn registry and component discovery."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_sequential_thinking:
    transport: "stdio"
    command: "npx"
    args: ["-y", "@modelcontextprotocol/server-sequential-thinking"]
    description: "Structured private reasoning workspace."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_firecrawl:
    transport: "stdio"
    command: "npx"
    args: ["-y", "firecrawl-mcp"]
    env:
      FIRECRAWL_API_KEY: os.environ/FIRECRAWL_API_KEY
      FIRECRAWL_API_URL: os.environ/FIRECRAWL_API_URL
    description: "Firecrawl web extraction and search."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_tavily:
    transport: "stdio"
    command: "npx"
    args: ["-y", "tavily-mcp@latest"]
    env:
      TAVILY_API_KEY: os.environ/TAVILY_API_KEY
    description: "Tavily web search."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_gitingest:
    transport: "stdio"
    command: "uvx"
    args: ["gitingestmcp@latest"]
    env:
      GITHUB_TOKEN: os.environ/GITHUB_TOKEN
    description: "Git repository ingestion, restricted to developers."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_codebase_index:
    transport: "stdio"
    command: "uvx"
    args: ["--from", "mcp-codebase-index[mcp]", "mcp-codebase-index"]
    env:
      PROJECT_ROOT: "/workspace"
    description: "Project Nyra codebase search and index tools."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_playwright:
    transport: "stdio"
    command: "npx"
    args:
      [
        "-y",
        "@playwright/mcp@latest",
        "--browser",
        "chromium",
        "--headless",
        "--no-sandbox",
      ]
    description: "Private headless browser automation."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_next_devtools:
    transport: "stdio"
    command: "npx"
    args: ["-y", "next-devtools-mcp@latest"]
    env:
      NEXT_DEVTOOLS_WORKSPACE: "/workspace"
    description: "Next.js development diagnostics for mounted workspaces."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  nyra_wcgw:
    transport: "stdio"
    command: "uvx"
    args: ["--from", "wcgw@latest", "wcgw_mcp"]
    env:
      WCGW_WORKSPACE: "/workspace"
    description: "Workspace shell and code tools; developer access only."
    mcp_access_groups: ["nyra-dev"]
    allow_all_keys: false

  # --- Memory MCP servers ---------------------------------------------------
  # These are native SSE MCP listeners. FalkorDB, Qdrant and Redis remain
  # private data stores and are intentionally not exposed as MCP servers.
  nyra_letta_memory:
    transport: "sse"
    url: "http://oracle-vps-memory-letta-mcp:6507/sse"
    description: "Letta memory orchestration and agent-memory management."
    mcp_access_groups: ["nyra-memory", "nyra-admin"]
    allow_all_keys: false

  nyra_memos_memory:
    transport: "sse"
    url: "http://oracle-vps-memory-memos-mcp:8085/sse"
    description: "MemoryTensor/MemOS memory management MCP."
    mcp_access_groups: ["nyra-memory", "nyra-admin"]
    allow_all_keys: false

# NOTE — servers deliberately NOT registered yet, and why. These are tracked in
# docs/refactor/NYRA_REFACTOR_VALIDATION.md, not silently dropped:
#   * OpenMemory and Mem0 REST — the live OpenMemory service exposes REST/OpenAPI
#     at :8765 but no native MCP route; Mem0 is a REST backend, not an MCP
#     server. They remain private behind the memory services above.
#   * gitingest (:8777), playwright (:8771), next-devtools (:8774) — probed at
#     /mcp, /sse and /; all returned 404. Their real transport/path is unknown
#     and is not guessed here.
#   * sequential-thinking — no live listener found on oracle-vps.
#   * Nexus's legacy github/git/docker/infisical MCP defaults — their listeners
#     (:8813/:8812/:8811/:8815) are not running on any reachable host.
#   * bitwarden, gemini — intentionally removed. See the capability matrix.

litellm_settings:
  set_verbose: false
  drop_params: true
  request_timeout: 420

  # Gateway/control cache on the Oracle litellm-redis instance. This is NOT the
  # LMCache KV backend, which is a separate Redis on worker-rtx5090.
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    ttl: 3600
    namespace: "litellm.control"

  # ---------------------------------------------------------------------------
  # Default permissions for newly generated keys.
  #
  # In v1.99.1, `mcp_tool_search_enabled` exists ONLY as a field of
  # ObjectPermissionDict (litellm/types/object_permission.py). There is no
  # top-level litellm_settings flag and no LITELLM_MCP_TOOL_SEARCH_ENABLED env
  # var. Verified by grepping the pinned image.
  #
  # The default grant is deliberately the MINIMUM useful surface: Tool Search on,
  # but only the developer access group and only the free/local model aliases.
  # Mortgage, admin and Cloudflare-mutating servers are never granted by default;
  # those keys are created explicitly with their own object_permission.
  # ---------------------------------------------------------------------------
  default_key_generate_params:
    object_permission:
      mcp_tool_search_enabled: true
      mcp_access_groups:
        - nyra-dev
      models:
        - nyra-general
        - nyra-fast
        - nyra-coding

  # ---------------------------------------------------------------------------
  # MCP semantic tool filter.
  #
  # Canonical v1.99.1 block name — confirmed present in the pinned image's own
  # proxy_config.yaml and implemented at
  # litellm/proxy/hooks/mcp_semantic_filter/hook.py.
  # `enable_semantic_tool_filtering` does not exist in v1.99.1 and is not used.
  #
  # Shipped DISABLED on purpose — but the REASON changed.
  #
  # It is no longer blocked on rebinding either worker's vLLM listener.
  # That dependency is gone: `nyra-embedding` now resolves to the orchestrator
  # llama.cpp service, which binds 100.64.0.10:8081 (Tailnet) by construction in
  # the root compose `orchestrator` profile. The remaining blocker is simply
  # that the profile has not been deployed yet, so the origin does not answer.
  # Enabling a semantic filter against an origin that does not answer would
  # break every MCP-bearing completion.
  #
  # Flip `enabled` to true ONLY after this returns a 200 with a 768-length vector
  # from the Oracle host:
  #   curl -sS http://100.64.0.3:4000/v1/embeddings \
  #     -H "Authorization: Bearer $NYRA_LITELLM_DEV_KEY" \
  #     -H 'Content-Type: application/json' \
  #     -d '{"model":"nyra-embedding","input":"mortgage lead lookup"}'
  # ---------------------------------------------------------------------------
  mcp_semantic_tool_filter:
    enabled: false
    embedding_model: "nyra-embedding"
    top_k: 5
    similarity_threshold: 0.30

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL
  store_model_in_db: false
