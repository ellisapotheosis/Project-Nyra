model_list:
  - model_name: local/gemma-4
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.trex-fiordland.ts.net:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: local/qwen-coder-32b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.trex-fiordland.ts.net:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: local/qwen2.5-4b
    litellm_params:
      model: ollama/qwen2.5:4b
      api_base: http://worker-rtx3060.trex-fiordland.ts.net:11434

  - model_name: local/llama3.2-3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://worker-rtx3060.trex-fiordland.ts.net:11434

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://worker-rtx3060.trex-fiordland.ts.net:11434

  - model_name: local/vybestack-jefe
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.trex-fiordland.ts.net:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: local/vybestack-coder
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.trex-fiordland.ts.net:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: subscription/codex
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://host.docker.internal:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

  - model_name: subscription/gemini
    litellm_params:
      model: openai/llxprt-gemini
      api_base: http://host.docker.internal:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

  - model_name: subscription/claude
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://host.docker.internal:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

litellm_settings:
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
