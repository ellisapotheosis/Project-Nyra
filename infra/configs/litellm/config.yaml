litellm_settings:
  set_verbose: false
  num_retries: 2
  request_timeout: 180
  fallbacks:
    - local/gemma-4:
        - openrouter/deepseek-r1-free
        - openrouter/deepseek-v3-free
        - openrouter/llama-3-3-70b-free
        - openrouter/free
    - local/vybestack-jefe:
        - openrouter/deepseek-r1-free
        - openrouter/nemotron-4-340b
        - openrouter/llama-3-3-70b-free
        - openrouter/free
    - local/vybestack-coder:
        - openrouter/deepseek-v3-free
        - openrouter/llama-3-70b-free
        - openrouter/llama-3-8b-free
        - openrouter/free
    - local/qwen-coder-32b:
        - openrouter/deepseek-v3-free
        - openrouter/llama-3-70b-free
        - openrouter/llama-3-8b-free
        - openrouter/free
    - local/qwen2.5-4b:
        - openrouter/phi-3-medium-128k-free
        - openrouter/llama-3-8b-free
        - openrouter/free
    - local/llama3.2-3b:
        - openrouter/llama-3-8b-free
        - openrouter/free

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
