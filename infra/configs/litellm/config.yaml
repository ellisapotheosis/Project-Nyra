model_list:
  # RTX 5090 - vLLM + LMCache (Large Models / Personal Assistant)
  - model_name: local/gemma-4
    litellm_params:
      model: openai/google/gemma-2-27b-it
      api_base: http://100.64.0.10:8000/v1
      api_key: "not-needed"
  - model_name: local/vybestack-jefe
    litellm_params:
      model: openai/google/gemma-2-27b-it
      api_base: http://100.64.0.10:8000/v1
      api_key: "not-needed"

  # RTX 3090 Ti - vLLM + LMCache (Medium Models / Coding)
  - model_name: local/qwen3.5-35b-a3b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://100.64.0.12:8000/v1
      api_key: "not-needed"
  - model_name: local/vybestack-coder
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://100.64.0.12:8000/v1
      api_key: "not-needed"

  # RTX 3060 - Ollama (Small Models / Embeddings)
  - model_name: local/qwen2.5-4b
    litellm_params:
      model: ollama/qwen2.5:4b
      api_base: http://100.64.0.11:11434
  - model_name: local/glm4-9b
    litellm_params:
      model: ollama/glm4:9b-chat
      api_base: http://100.64.0.11:11434
  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://100.64.0.11:11434

  # Cloud Providers
  - model_name: openrouter/auto
    litellm_params:
      model: openrouter/auto
      api_key: os.environ/OPENROUTER_API_KEY
      api_base: https://openrouter.ai/api/v1

litellm_settings:
  cache: true
  set_verbose: false

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
