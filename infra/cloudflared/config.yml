# Cloudflared ingress template (no credentials)
# Use with: docker compose -f infra/compose/docker-compose.cloudflared.yml up -d

tunnel: ${CF_TUNNEL_NAME}
credentials-file: /etc/cloudflared/credentials.json

ingress:
  - hostname: mcp.${NYRA_DOMAIN_ROOT}
    service: http://nexus-router:7000
  - hostname: api.${NYRA_DOMAIN_ROOT}
    service: http://litellm:4000
  - hostname: n8n.${NYRA_DOMAIN_ROOT}
    service: http://n8n:5678
  - hostname: chat.${NYRA_DOMAIN_ROOT}
    service: http://moltbot-web:3030
  - hostname: grafana.${NYRA_DOMAIN_ROOT}
    service: http://grafana:3000
  - service: http_status:404
