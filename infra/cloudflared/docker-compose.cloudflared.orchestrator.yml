name: nyra-cloudflared-orchestrator

services:
  cloudflared-orchestrator:
    image: cloudflare/cloudflared:2026.4.1
    container_name: nyra-cloudflared-orchestrator
    command: tunnel --config /etc/cloudflared/config.yml run
    restart: unless-stopped
    env_file:
      - ./.env.cloudflared
    volumes:
      - ./config.orchestrator.yml:/etc/cloudflared/config.yml:ro
      - ./credentials:/etc/cloudflared/credentials:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - nyra

networks:
  nyra:
    external: true
