# Environment-specific configurations for Koyeb deployments
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-configs
data:
  production.env: |
    NODE_ENV=production
    LOG_LEVEL=info
    CORS_ORIGIN=https://nyra.com,https://*.nyra.com
    RATE_LIMIT_ENABLED=true
    CACHE_ENABLED=true
    METRICS_ENABLED=true
    FEATURE_FLAGS_ENABLED=true
  staging.env: |
    NODE_ENV=staging
    LOG_LEVEL=debug
    CORS_ORIGIN=https://staging.nyra.com
    RATE_LIMIT_ENABLED=true
    CACHE_ENABLED=true
    METRICS_ENABLED=true
    FEATURE_FLAGS_ENABLED=true
  development.env: |
    NODE_ENV=development
    LOG_LEVEL=debug
    CORS_ORIGIN=*
    RATE_LIMIT_ENABLED=false
    CACHE_ENABLED=false
    METRICS_ENABLED=false
    FEATURE_FLAGS_ENABLED=true