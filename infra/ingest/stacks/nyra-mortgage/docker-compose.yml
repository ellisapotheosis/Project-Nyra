services:
  # ---------- Edge / routing ----------
  nexus:
    image: ghcr.io/grafbase/nexus:latest
    container_name: nyra-nexus
    ports:
      - '4001:4001'
    volumes:
      - ./configs/nexus/nexus.toml:/etc/nexus.toml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - WORKER_3060_URL=${WORKER_3060_URL:-http://worker-rtx3060.trex-fiordland.ts.net:11434}
      - WORKER_3090_URL=${WORKER_3090_URL:-http://worker-rtx3090ti.trex-fiordland.ts.net:8001}
      - WORKER_5090_URL=${WORKER_5090_URL:-http://worker-rtx5090.trex-fiordland.ts.net:8000}
    labels:
      nyra.service.name: 'nexus-grafbase'
      nyra.service.type: 'api'
      nyra.service.category: 'routing'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '4001'
      nyra.api.protocol: 'graphql'
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:4001/health']
      interval: 20s
      timeout: 5s
      retries: 10
    depends_on:
      - litellm
    networks: [nyra]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-litellm
    expose:
      - '4000'
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml:ro
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LLXPERT_CODER_BASE_URL=${LLXPERT_CODER_BASE_URL}
      - LLXPERT_CODER_API_KEY=${LLXPERT_CODER_API_KEY:-dummy}
    labels:
      nyra.service.name: 'litellm'
      nyra.service.type: 'api'
      nyra.service.category: 'proxy'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '4000'
      nyra.api.protocol: 'openai-compatible'
    networks: [nyra]

  # ---------- CRM ----------
  twenty:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty
    ports:
      - '3000:3000'
    depends_on:
      - twenty_postgres
    environment:
      - SERVER_URL=${TWENTY_SERVER_URL}
      - ENCRYPTION_SECRET=${TWENTY_ENCRYPTION_SECRET}
      - JWT_SECRET=${TWENTY_JWT_SECRET}
      - PASSWORD_SALT=${TWENTY_PASSWORD_SALT}
      - PGHOST=twenty_postgres
      - PGPORT=5432
      - PGUSER=twenty
      - PGPASSWORD=twenty
      - PGDATABASE=twenty
    labels:
      nyra.service.name: 'twenty-crm'
      nyra.service.type: 'api'
      nyra.service.category: 'crm'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '3000'
      nyra.api.protocol: 'rest'
    networks: [nyra]

  twenty_postgres:
    image: postgres:16
    container_name: nyra-twenty-postgres
    environment:
      - POSTGRES_USER=twenty
      - POSTGRES_PASSWORD=twenty
      - POSTGRES_DB=twenty
    volumes:
      - twenty_pg:/var/lib/postgresql/data
    labels:
      nyra.service.name: 'twenty-postgres'
      nyra.service.type: 'database'
      nyra.service.category: 'relational'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'false'
    networks: [nyra]

  # ---------- Agent state manager ----------
  letta_postgres:
    image: postgres:16
    container_name: nyra-letta-postgres
    environment:
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=letta
      - POSTGRES_DB=letta
    volumes:
      - letta_pg:/var/lib/postgresql/data
    labels:
      nyra.service.name: 'letta-postgres'
      nyra.service.type: 'database'
      nyra.service.category: 'relational'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'false'
    networks: [nyra]

  letta:
    image: ghcr.io/letta-ai/letta:latest
    container_name: nyra-letta
    ports:
      - '8283:8283'
    depends_on:
      - letta_postgres
    environment:
      - DATABASE_URL=postgresql://letta:letta@letta_postgres:5432/letta
      - OPENAI_BASE_URL=http://nexus:4001/v1
      - OPENAI_API_KEY=dummy
    labels:
      nyra.service.name: 'letta'
      nyra.service.type: 'api'
      nyra.service.category: 'agent-memory'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '8283'
      nyra.api.protocol: 'rest'
    networks: [nyra]

  # ---------- Nyra Orchestrator ----------
  nyra_orchestrator:
    build:
      context: ./services/nyra-orchestrator
      dockerfile: Dockerfile
    container_name: nyra-orchestrator
    ports:
      - '8010:8010'
    environment:
      - NYRA_POLICY_MODE=${NYRA_POLICY_MODE:-strict}
      - NYRA_ALLOWED_CHANNELS=${NYRA_ALLOWED_CHANNELS:-sms,email,webchat}
      - NYRA_ESCALATION_EMAIL=${NYRA_ESCALATION_EMAIL:-ops@example.com}
      - TWENTY_BASE_URL=http://twenty:3000
      - NEXUS_BASE_URL=http://nexus:4001
      - LETTA_BASE_URL=http://letta:8283
    labels:
      nyra.service.name: 'orchestrator'
      nyra.service.type: 'api'
      nyra.service.category: 'orchestration'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '8010'
      nyra.api.protocol: 'rest'
    depends_on:
      - litellm
      - twenty
      - letta
    networks: [nyra]

  # ---------- Observability ----------
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    ports:
      - '9090:9090'
    volumes:
      - ./configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    labels:
      nyra.service.name: 'prometheus'
      nyra.service.type: 'monitoring'
      nyra.service.category: 'metrics'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '9090'
      nyra.api.protocol: 'http'
    networks: [nyra]

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    ports:
      - '3100:3100'
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ./configs/observability/loki.yml:/etc/loki/config.yml:ro
    labels:
      nyra.service.name: 'loki'
      nyra.service.type: 'monitoring'
      nyra.service.category: 'logs'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '3100'
      nyra.api.protocol: 'http'
    networks: [nyra]

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    ports:
      - '3005:3000'
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./configs/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    labels:
      nyra.service.name: 'grafana'
      nyra.service.type: 'monitoring'
      nyra.service.category: 'dashboard'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '3000'
      nyra.api.protocol: 'http'
    networks: [nyra]

  # ---------- Optional UI ----------
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-openwebui
    ports:
      - '8080:8080'
    environment:
      - OPENAI_API_BASE_URL=http://nexus:4001/v1
      - OPENAI_API_BASE_URLS=http://nexus:4001/v1
      - OPENAI_API_KEY=${OPENWEBUI_OPENAI_API_KEY:-dummy}
      - WEBUI_AUTH=True
      - NEXUS_MCP_URL=http://nexus:4001/mcp/sse
      - ARCHON_UI_URL=http://nyra-archon-os:3000
      - ENABLE_OLLAMA_API=false
    volumes:
      - openwebui_data:/app/backend/data
      - ./configs/openwebui/functions:/app/backend/data/functions:ro
    labels:
      nyra.service.name: 'openwebui'
      nyra.service.type: 'api'
      nyra.service.category: 'ui'
      nyra.mcp.enabled: 'false'
      nyra.api.enabled: 'true'
      nyra.api.port: '8080'
      nyra.api.protocol: 'http'
    depends_on:
      - nexus
    networks: [nyra]

networks:
  nyra: {}

volumes:
  twenty_pg: {}
  letta_pg: {}
  grafana_data: {}
  openwebui_data: {}
