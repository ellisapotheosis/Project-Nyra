# Project Nyra – Minimal Nexus Router configuration
#
# This TOML file configures Grafbase/Nexus to listen on port 6000 and
# authenticate requests with a JWT secret.  MCP servers and LLM providers
# can be defined here or via the intelligent routing JSON.  See
# `configs/nexus/intelligent-routing-config.json` for a more advanced example.

[server]
host = "0.0.0.0"
port = 6000

[auth]
enabled = true
jwt_secret = "{{ env.NEXUS_JWT_SECRET }}"
jwt_algorithm = "HS256"

[mcp]
enabled = true
discover_local = true

[[mcp.servers]]
name = "filesystem"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "/workspace"]

[[mcp.servers]]
name = "memory"
command = "npx"
args = ["-y", "@modelcontextprotocol/server-memory"]

[cors]
allow_origins = ["*"]
allow_methods = ["GET", "POST", "OPTIONS"]
allow_headers = ["Authorization", "Content-Type"]