version: "3.9"

# Project Nyra — Oracle One-VM Stack (Always Free-friendly)
# Target: VM.Standard.A1.Flex @ 4 OCPU / 24 GB RAM (fits Always Free monthly bucket if run 24/7)
#
# Profiles:
# - graph_falkordb: use FalkorDB (Redis module) as graph backend
# - graph_neo4j: use Neo4j as graph backend
# - cloudflared: optional tunnel agent container (often better on host)
#
# Start (example):
#   docker compose -f compose/docker-compose.oracle.onevm.yml --profile graph_falkordb up -d

services:
  postgres:
    image: postgres:16
    container_name: nyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra]

  redis:
    image: redis:7
    container_name: nyra-redis
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes","--save","900","1","--loglevel","warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra]

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    profiles: ["graph_falkordb"]
    volumes:
      - falkordb_data:/data
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra]

  neo4j:
    image: neo4j:5
    container_name: nyra-neo4j
    restart: unless-stopped
    profiles: ["graph_neo4j"]
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/${NEO4J_PASSWORD}}
      NEO4J_server_memory_pagecache_size: ${NEO4J_PAGECACHE:-2G}
      NEO4J_server_memory_heap_initial__size: ${NEO4J_HEAP_INITIAL:-1G}
      NEO4J_server_memory_heap_max__size: ${NEO4J_HEAP_MAX:-2G}
    volumes:
      - neo4j_data:/data
    networks: [nyra]

  letta:
    image: letta/letta:latest
    container_name: nyra-letta
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      GRAPH_BACKEND: ${GRAPH_BACKEND:-falkordb}
      GRAPH_REDIS_URL: ${GRAPH_REDIS_URL:-redis://falkordb:6379}
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      letta_AUTH_ENABLED: ${letta_AUTH_ENABLED:-false}
      letta_HTTP_PORT: ${letta_HTTP_PORT:-7474}
    ports:
      - "${letta_HTTP_PORT:-7474}:7474"
    networks: [nyra]

  ruvector:
    image: ruvnet/ruvector:latest
    container_name: nyra-ruvector
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${RUVECTOR_DATABASE_URL}
      RUVECTOR_PORT: ${RUVECTOR_PORT:-8000}
    ports:
      - "${RUVECTOR_PORT:-8000}:8000"
    networks: [nyra]

  twenty:
    image: twentyhq/twenty:latest
    container_name: nyra-twenty
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      APP_URL: ${TWENTY_APP_URL}
      DATABASE_URL: ${TWENTY_DATABASE_URL}
      REDIS_URL: ${TWENTY_REDIS_URL:-redis://redis:6379}
      TWENTY_ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
      TWENTY_JWT_SECRET: ${TWENTY_JWT_SECRET}
    ports:
      - "${TWENTY_PORT:-3000}:3000"
    networks: [nyra]

  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${N8N_WEBHOOK_URL}
      GENERIC_TIMEZONE: ${N8N_TIMEZONE:-America/Los_Angeles}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${N8N_DB_NAME:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_DIAGNOSTICS_ENABLED: "false"
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
    networks: [nyra]

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AP_POSTGRES_HOST: postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_DATABASE: ${AP_DB_NAME:-activepieces}
      AP_POSTGRES_USERNAME: ${POSTGRES_USER:-nyra}
      AP_POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      AP_REDIS_HOST: redis
      AP_REDIS_PORT: 6379
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL}
    ports:
      - "${AP_PORT:-8080}:80"
    networks: [nyra]

  moltbot:
    image: moltbot/moltbot:latest
    container_name: nyra-moltbot
    restart: unless-stopped
    environment:
      CLAWDBOT_GATEWAY_TOKEN: ${CLAWDBOT_GATEWAY_TOKEN}
    ports:
      - "${MOLTBOT_PORT:-18789}:18789"
      - "${MOLTBOT_CONTROL_PORT:-18790}:18790"
    volumes:
      - clawdbot_config:/home/node/.clawdbot
      - clawdbot_workspace:/home/node/clawd
    networks: [nyra]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    restart: unless-stopped
    profiles: ["cloudflared"]
    command: ["tunnel","--no-autoupdate","run","--token","${CLOUDFLARED_TUNNEL_TOKEN}"]
    networks: [nyra]

networks:
  nyra:

volumes:
  postgres_data:
  redis_data:
  falkordb_data:
  neo4j_data:
  n8n_data:
  clawdbot_config:
  clawdbot_workspace:
