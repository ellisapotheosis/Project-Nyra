# Project Nyra - Oracle Cloud Deployment
# Optimized for Oracle Cloud Always Free Tier
# VM.Standard.A1.Flex (4 OCPU / 24GB RAM)
# Based on: nyra-oracle-onevm-stack

version: '3.9'

services:
  # ============================================================
  # Core Data Layer (Oracle Cloud Optimized)
  # ============================================================

  postgres:
    image: postgres:16
    container_name: nyra-postgres-oracle
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../cloud/oracle-onevm/compose/init/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  redis:
    image: redis:7-alpine
    container_name: nyra-redis-oracle
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--save", "900", "1", "--loglevel", "warning"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================
  # Graph Database (Choose Profile)
  # ============================================================

  # Profile: graph_falkordb
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    profiles: ["graph_falkordb"]
    ports:
      - "6379:6379"
    volumes:
      - falkor_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '0.5'

  # Profile: graph_neo4j
  neo4j:
    image: neo4j:5
    container_name: nyra-neo4j
    restart: unless-stopped
    profiles: ["graph_neo4j"]
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-neo4j123}
      NEO4J_PLUGINS: '["apoc"]'
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j123}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: '1.0'

  # ============================================================
  # Core Nyra Services (Memory Optimized)
  # ============================================================

  nexus-router:
    build:
      context: ../../src/services/nexus-router
      dockerfile: Dockerfile
    container_name: nyra-nexus-oracle
    restart: unless-stopped
    ports:
      - "6000:6000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - REDIS_URL=redis://redis:6379
      - LOG_LEVEL=INFO
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: '1.0'

  quote-engine:
    build:
      context: ../../src/services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-quote-oracle
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - REDIS_URL=redis://redis:6379
      - NEXUS_URL=http://nexus-router:6000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  ratehunter-web:
    build:
      context: ../../src/apps/ratehunter-web
      dockerfile: Dockerfile
    container_name: nyra-web-oracle
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8001
    depends_on:
      - quote-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: '0.5'

  # ============================================================
  # Optional Cloudflare Tunnel
  # ============================================================

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    restart: unless-stopped
    profiles: ["cloudflared"]
    command: tunnel --no-autoupdate run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: '0.2'

# ============================================================
# Networks and Volumes
# ============================================================

networks:
  nyra-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  falkor_data:
    driver: local
  neo4j_data:
    driver: local

# ============================================================
# DEPLOYMENT COMMANDS
# ============================================================

# Start with FalkorDB:
# docker-compose -f infra/compose/docker-compose.oracle-cloud.yml --profile graph_falkordb up -d

# Start with Neo4j:
# docker-compose -f infra/compose/docker-compose.oracle-cloud.yml --profile graph_neo4j up -d

# Add Cloudflare Tunnel:
# docker-compose -f infra/compose/docker-compose.oracle-cloud.yml --profile graph_falkordb --profile cloudflared up -d