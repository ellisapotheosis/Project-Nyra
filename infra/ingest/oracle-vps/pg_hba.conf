# PostgreSQL Client Authentication Configuration
# Controls which hosts are allowed to connect to PostgreSQL databases
#
# Format:
# TYPE  DATABASE        USER            ADDRESS                 METHOD
#
# Types:
#   local     - Unix domain socket connections
#   host      - TCP/IP connections (encrypted or not)
#   hostssl   - TCP/IP connections with SSL
#   hostnossl - TCP/IP connections without SSL
#
# Methods:
#   trust     - Allow connection unconditionally
#   reject    - Reject connection unconditionally
#   md5       - Password authentication (MD5 hash)
#   scram-sha-256 - Password authentication (SCRAM-SHA-256, more secure)
#   peer      - Use OS username
# -----------------------------------------------------------------------------

# LOCAL CONNECTIONS
# Allow local connections without password for postgres user (Docker only)
local   all             postgres                                peer

# Require password for all other local connections
local   all             all                                     scram-sha-256

# HOST CONNECTIONS - INTERNAL DOCKER NETWORK
# Allow connections from Docker network with password authentication
host    all             all             172.16.0.0/12           scram-sha-256
host    all             all             10.0.0.0/8              scram-sha-256
host    all             all             192.168.0.0/16          scram-sha-256

# HOST CONNECTIONS - LOCALHOST
# Allow connections from localhost (for development and debugging)
host    all             all             127.0.0.1/32            scram-sha-256
host    all             all             ::1/128                 scram-sha-256

# REPLICATION CONNECTIONS
# Uncomment these lines if you set up replication
# local   replication     all                                     peer
# host    replication     all             172.16.0.0/12           scram-sha-256

# REJECT ALL OTHER CONNECTIONS
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject

# SECURITY NOTES
# 1. This configuration allows connections only from private network ranges
# 2. All connections require password authentication (scram-sha-256)
# 3. For production, consider using SSL/TLS (hostssl instead of host)
# 4. Review and adjust network ranges based on your infrastructure
# 5. Never expose PostgreSQL directly to the internet