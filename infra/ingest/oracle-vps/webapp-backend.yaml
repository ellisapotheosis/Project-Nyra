# Oracle VPS Deployment Configuration for Nyra Webapp Backend
# API endpoints, authentication, and mortgage calculation services
apiVersion: v1
kind: Service
metadata:
  name: nyra-webapp-backend
  labels:
    app: nyra-backend
    tier: api
    environment: production
spec:
  type: web
  ports:
    - port: 8000
      protocol: http
      name: api
  deployment:
    build:
      type: git
      git:
        repository: "https://github.com/your-org/project-nyra"
        branch: "main"
        workDir: "services/webapp-backend"
      builder: dockerfile
      dockerfile: ./Dockerfile
      buildArgs:
        - NODE_ENV=production
    runtime:
      command: ["npm", "start"]
      workingDir: /app
    resources:
      cpu: "0.5"
      memory: "512Mi"
      disk: "2Gi"
    scaling:
      min: 1
      max: 1
      type: fixed
    healthCheck:
      httpGet:
        path: /api/health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5
    env:
      - name: NODE_ENV
        value: "production"
      - name: PORT
        value: "8000"
      - name: API_VERSION
        value: "v1"
      - name: LOG_LEVEL
        value: "info"
      - name: CORS_ORIGIN
        value: "https://nyra.com,https://*.nyra.com"
      - name: CORS_CREDENTIALS
        value: "true"
      - name: DATABASE_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: DATABASE_URL
      - name: DATABASE_POOL_MIN
        value: "2"
      - name: DATABASE_POOL_MAX
        value: "10"
      - name: REDIS_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: REDIS_URL
      - name: REDIS_PREFIX
        value: "nyra:"
      - name: JWT_SECRET
        valueFrom:
          secret:
            name: infisical-secrets
            key: JWT_SECRET
      - name: JWT_EXPIRY
        value: "24h"
      - name: REFRESH_TOKEN_EXPIRY
        value: "7d"
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: ANTHROPIC_API_KEY
      - name: OPENAI_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: OPENAI_API_KEY
      - name: SENDGRID_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: SENDGRID_API_KEY
      - name: TWILIO_ACCOUNT_SID
        valueFrom:
          secret:
            name: infisical-secrets
            key: TWILIO_ACCOUNT_SID
      - name: TWILIO_AUTH_TOKEN
        valueFrom:
          secret:
            name: infisical-secrets
            key: TWILIO_AUTH_TOKEN
      - name: N8N_WEBHOOK_URL
        value: "https://n8n.nyra.oracle-vps.ratehunter.net/webhook"
      - name: N8N_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_API_KEY
      - name: RATE_API_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: MORTGAGE_RATE_API_URL
      - name: RATE_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: MORTGAGE_RATE_API_KEY
      - name: RATE_CACHE_TTL
        value: "3600"
      - name: SENTRY_DSN
        valueFrom:
          secret:
            name: infisical-secrets
            key: SENTRY_DSN
      - name: SENTRY_ENVIRONMENT
        value: "production"
      - name: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"
      - name: FEATURE_LEAD_CAPTURE
        value: "true"
      - name: FEATURE_RATE_ALERTS
        value: "true"
      - name: FEATURE_AI_CHAT
        value: "true"
    volumes:
      - name: logs
        mountPath: /app/logs
        size: "1Gi"
      - name: uploads
        mountPath: /app/uploads
        size: "1Gi"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 0
  networking:
    domains:
      - name: api.nyra.oracle-vps.ratehunter.net
        type: custom
      - name: backend.nyra.com
        type: custom
        primary: true
    tls:
      enabled: true
      provider: letsencrypt
      minVersion: "1.2"
    rateLimit:
      enabled: true
      requestsPerMinute: 100
      burst: 20
  regions:
    - was
  autoSleep:
    enabled: false
