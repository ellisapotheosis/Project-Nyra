# Infisical Secret Template for Koyeb Deployments
# This manifest defines a Koyeb Secret populated from Infisical.  Use the
# Infisical CLI to export secrets and inject into Koyeb via the Koyeb CLI.
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: nyra-production
  annotations:
    infisical.com/sync-enabled: "true"
    infisical.com/project-id: "${INFISICAL_PROJECT_ID}"
    infisical.com/environment: "production"
    infisical.com/secret-path: "/koyeb"
type: Opaque
data:
  # Database Configuration
  DATABASE_URL: "${INFISICAL_DATABASE_URL}"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"
  # n8n Database
  N8N_DB_TYPE: "postgresdb"
  N8N_DB_HOST: "${INFISICAL_N8N_DB_HOST}"
  N8N_DB_PORT: "${INFISICAL_N8N_DB_PORT}"
  N8N_DB_DATABASE: "${INFISICAL_N8N_DB_DATABASE}"
  N8N_DB_USER: "${INFISICAL_N8N_DB_USER}"
  N8N_DB_PASSWORD: "${INFISICAL_N8N_DB_PASSWORD}"
  # n8n Security
  N8N_ENCRYPTION_KEY: "${INFISICAL_N8N_ENCRYPTION_KEY}"
  N8N_JWT_SECRET: "${INFISICAL_N8N_JWT_SECRET}"
  N8N_API_KEY: "${INFISICAL_N8N_API_KEY}"
  # Redis Cache
  REDIS_URL: "${INFISICAL_REDIS_URL}"
  REDIS_PASSWORD: "${INFISICAL_REDIS_PASSWORD}"
  # Authentication & Security
  JWT_SECRET: "${INFISICAL_JWT_SECRET}"
  JWT_EXPIRY: "24h"
  REFRESH_TOKEN_SECRET: "${INFISICAL_REFRESH_TOKEN_SECRET}"
  REFRESH_TOKEN_EXPIRY: "7d"
  SESSION_SECRET: "${INFISICAL_SESSION_SECRET}"
  # AI Service API Keys
  ANTHROPIC_API_KEY: "${INFISICAL_ANTHROPIC_API_KEY}"
  OPENAI_API_KEY: "${INFISICAL_OPENAI_API_KEY}"
  # Communication Services
  SENDGRID_API_KEY: "${INFISICAL_SENDGRID_API_KEY}"
  SENDGRID_FROM_EMAIL: "noreply@nyra.com"
  TWILIO_ACCOUNT_SID: "${INFISICAL_TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${INFISICAL_TWILIO_AUTH_TOKEN}"
  TWILIO_PHONE_NUMBER: "${INFISICAL_TWILIO_PHONE_NUMBER}"
  # Mortgage Rate API
  MORTGAGE_RATE_API_URL: "${INFISICAL_MORTGAGE_RATE_API_URL}"
  MORTGAGE_RATE_API_KEY: "${INFISICAL_MORTGAGE_RATE_API_KEY}"
  # CRM Integration
  HUBSPOT_API_KEY: "${INFISICAL_HUBSPOT_API_KEY}"
  HUBSPOT_PORTAL_ID: "${INFISICAL_HUBSPOT_PORTAL_ID}"
  # Monitoring & Observability
  SENTRY_DSN: "${INFISICAL_SENTRY_DSN}"
  SENTRY_AUTH_TOKEN: "${INFISICAL_SENTRY_AUTH_TOKEN}"
  DATADOG_API_KEY: "${INFISICAL_DATADOG_API_KEY}"
  # Cloud Storage
  AWS_ACCESS_KEY_ID: "${INFISICAL_AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${INFISICAL_AWS_SECRET_ACCESS_KEY}"
  AWS_S3_BUCKET: "${INFISICAL_AWS_S3_BUCKET}"
  AWS_REGION: "us-east-1"