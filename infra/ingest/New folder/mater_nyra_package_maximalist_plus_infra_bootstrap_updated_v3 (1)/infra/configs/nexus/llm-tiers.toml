# Example LLM tier definitions for Nexus Router.
# Define cost and latency tiers for your local and cloud models.  See
# `intelligent-routing-config.json` for usage.

[[tiers]]
name = "economy"
models = ["claude-haiku", "gemini-flash"]
cost = 0.0002
latency = "~500ms"

[[tiers]]
name = "standard"
models = ["claude-sonnet", "gemini-pro"]
cost = 0.003
latency = "~2s"

[[tiers]]
name = "premium"
models = ["claude-opus"]
cost = 0.015
latency = "~5s"
