# LiteLLM configuration for Project Nyra
# - Provides a single OpenAI-compatible endpoint on :4000
# - Routes requests to cloud providers and your GPU worker nodes
#
# Docs: https://docs.litellm.ai/ (you have web disabled; keep this as reference)
#
# IMPORTANT:
# - This file uses environment variables for endpoints + keys.
# - Put keys into Infisical and inject them into the litellm container.

general_settings:
  drop_params: true
  set_verbose: false
  # Optional: enable Redis for caching if you want
  # redis_host: redis
  # redis_port: 6379

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  timeout: 60

model_list:
  # -------------------------
  # Cloud models (optional)
  # -------------------------
  - model_name: anthropic/sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: ${ANTHROPIC_API_KEY}

  - model_name: openrouter/sonnet
    litellm_params:
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: ${OPENROUTER_API_KEY}

  - model_name: openai/fast
    litellm_params:
      model: openai/gpt-4.1-mini
      api_key: ${OPENAI_API_KEY}

  - model_name: gemini/fast
    litellm_params:
      model: gemini/gemini-1.5-flash
      api_key: ${GEMINI_API_KEY}

  # -------------------------
  # Local GPU Workers (OpenAI-compatible /v1)
  # You can run vLLM, LM Studio, TGI, or any OpenAI-compatible server.
  # Set WORKER_*_OPENAI_BASE_URL to the worker's /v1 base (e.g. http://192.168.1.101:8000/v1)
  # -------------------------
  - model_name: local/rtx3060-default
    litellm_params:
      model: openai/local-rtx3060
      api_base: ${WORKER_RTX3060_OPENAI_BASE_URL}
      api_key: ${LITELLM_LOCAL_API_KEY:-local}

  - model_name: local/rtx3090ti-default
    litellm_params:
      model: openai/local-rtx3090ti
      api_base: ${WORKER_RTX3090TI_OPENAI_BASE_URL}
      api_key: ${LITELLM_LOCAL_API_KEY:-local}

  - model_name: local/rtx5090-default
    litellm_params:
      model: openai/local-rtx5090
      api_base: ${WORKER_RTX5090_OPENAI_BASE_URL}
      api_key: ${LITELLM_LOCAL_API_KEY:-local}

  # -------------------------
  # Local GPU Workers (Ollama)
  # If you prefer Ollama, set WORKER_*_OLLAMA_URL to http://<worker>:11434
  # and reference ollama/<model> names.
  # -------------------------
  - model_name: ollama/rtx3060-llama3
    litellm_params:
      model: ollama/llama3.1:8b
      api_base: ${WORKER_RTX3060_OLLAMA_URL}

  - model_name: ollama/rtx3090ti-qwen
    litellm_params:
      model: ollama/qwen2.5:32b
      api_base: ${WORKER_RTX3090TI_OLLAMA_URL}

  - model_name: ollama/rtx5090-reasoner
    litellm_params:
      model: ollama/llama3.1:70b
      api_base: ${WORKER_RTX5090_OLLAMA_URL}

# Optional: define model groups (aliases) for convenience
# so clients can call "local/reasoning" and LiteLLM selects the right target.
# If you want strict routing, keep it simple and call the model_name directly.
