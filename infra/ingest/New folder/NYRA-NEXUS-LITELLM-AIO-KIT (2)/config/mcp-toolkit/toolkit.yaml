# Docker MCP Toolkit Gateway (single MCP entrypoint)
# This file is a conceptual config for a toolkit gateway container.
# If you use Docker Desktop MCP Toolkit directly, configure it there and set:
#   DOCKER_MCP_TOOLKIT_URL=http://host.docker.internal:<port>/mcp
#
# If you run a gateway container (this compose includes `docker-mcp-toolkit`),
# implement it to expose one MCP endpoint that multiplexes internal toolkit MCP servers.

server:
  port: 8082
  base_path: /mcp

filesystem:
  enabled: true
  # Roots inside the container that map to host mounts (see docker-compose volumes)
  roots:
    - /host/nyra
    - /host/extra
  read_only: false

docker:
  enabled: true
  docker_socket: /var/run/docker.sock
  # If you want docker hub mcp or docker toolkit mcp, expose them here.
  enable_docker_hub: true
  enable_docker_compose: true

misc:
  enable_http: true
  enable_time: true
  enable_math: true
