version: "3.9"
name: nyra-worker-vllm

services:
  vllm:
    image: vllm/vllm-openai:latest
    restart: unless-stopped
    environment:
      # Set MODEL to something that fits your GPU VRAM
      MODEL: ${VLLM_MODEL:-meta-llama/Meta-Llama-3.1-8B-Instruct}
      # Optional performance flags
      # VLLM_ATTENTION_BACKEND: flashinfer
    ports:
      - "8000:8000"
    # GPU requires NVIDIA container toolkit:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - capabilities: [gpu]

# Use this worker with LiteLLM by setting:
#   WORKER_RTX3060_OPENAI_BASE_URL=http://<worker-ip>:8000/v1
