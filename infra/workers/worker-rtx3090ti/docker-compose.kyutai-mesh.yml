# worker-rtx3090ti: streaming speech decode and conversational LLM bridge.

name: nyra-voice-mesh-rtx3090ti

x-gpu: &gpu
  runtime: nvidia
  ipc: host
  shm_size: 4gb
  restart: unless-stopped
  environment:
    NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
    NVIDIA_DRIVER_CAPABILITIES: compute,utility
    CUDA_DEVICE_ORDER: PCI_BUS_ID

services:
  kyutai-stt-stream:
    <<: *gpu
    image: ${NYRA_KYUTAI_STT_IMAGE:-nyra/kyutai-stt-stream:local}
    container_name: nyra-kyutai-stt-3090ti
    network_mode: host
    environment:
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-0}
      NODE_NAME: worker-rtx3090ti
      BIND_ADDR: ${RTX3090TI_LAN_IP:?set RTX3090TI_LAN_IP}
      WS_PORT: "18200"
      METRICS_PORT: "18290"
      MODEL_DIR: /models/kyutai
      CACHE_DIR: /cache
      PRECISION: ${STT_PRECISION:-fp16}
      AUDIO_SAMPLE_RATE: "24000"
      AUDIO_FRAME_MS: "10"
      PARTIAL_HYPOTHESIS_MS: "80"
      FINAL_STABILITY_MS: "220"
      SESSION_COORDINATOR_URL: http://${RTX5090_LAN_IP:?set RTX5090_LAN_IP}:18400
      LLM_BRIDGE_URL: http://${RTX3090TI_LAN_IP:?set RTX3090TI_LAN_IP}:18250
    volumes:
      - ${UNMUTE_MODEL_VOLUME:-/srv/nyra/models/kyutai}:/models/kyutai:ro
      - ${UNMUTE_CACHE_VOLUME:-/srv/nyra/cache/kyutai}:/cache

  voice-llm-bridge:
    image: ${NYRA_VOICE_LLM_BRIDGE_IMAGE:-nyra/voice-llm-bridge:local}
    container_name: nyra-voice-llm-bridge-3090ti
    network_mode: host
    restart: unless-stopped
    environment:
      NODE_NAME: worker-rtx3090ti
      BIND_ADDR: ${RTX3090TI_LAN_IP:?set RTX3090TI_LAN_IP}
      HTTP_PORT: "18250"
      ASSISTANT_GATEWAY_URL: ${ASSISTANT_GATEWAY_URL:-http://orchestrator.lan:3400}
      LITELLM_BASE_URL: ${LITELLM_BASE_URL:-http://orchestrator.lan:4000/v1}
      LITELLM_API_KEY: ${LITELLM_API_KEY:?set LITELLM_API_KEY}
      MEMORY_BASE_URL: ${MEMORY_BASE_URL:-http://oracle-vps.lan:5000}
      RESPONSE_TARGET_WS: ws://${RTX5090_LAN_IP:?set RTX5090_LAN_IP}:18300/stream
      MAX_TURN_BUDGET_MS: "650"
      PARTIAL_RESPONSE_ENABLED: "true"
      COMPOSIO_MCP_URL: ${COMPOSIO_MCP_URL:?set COMPOSIO_MCP_URL}
      COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:?set COMPOSIO_API_KEY}
