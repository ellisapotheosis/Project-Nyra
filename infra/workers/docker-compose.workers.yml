version: "3.9"

services:
  # ============================================================================
  # GPU INFERENCE SERVICES
  # ============================================================================

  vllm:
    image: vllm/vllm-openai:latest
    container_name: nyra-vllm-${WORKER_NAME}
    ports:
      - "8000:8000"
    environment:
      CUDA_DEVICE_ORDER: "PCI_BUS_ID"
      CUDA_VISIBLE_DEVICES: "0"
      VLLM_ATTENTION_BACKEND: "flashinfer"
      VLLM_ENABLE_PREFIX_CACHING: "true"
    volumes:
      - ${MODEL_CACHE_DIR}:/models
      - /mnt/models:/models-shared:ro
    working_dir: /app
    command:
      - --model=/models/${MODEL_NAME}
      - --dtype=${MODEL_DTYPE}
      - --gpu-memory-utilization=${GPU_MEMORY_UTIL}
      - --max-model-len=${MAX_MODEL_LEN}
      - --enable-prefix-caching
      - --prefix-cache-size-tokens=4096
      - --port=8000
      - --host=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - worker-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - default
      - vllm

  ollama:
    image: ollama/ollama:latest
    container_name: nyra-ollama-${WORKER_NAME}
    ports:
      - "11434:11434"
    environment:
      OLLAMA_NUM_GPU: 1
      OLLAMA_MAX_LOADED_MODELS: 2
    volumes:
      - ollama_data:/root/.ollama
      - /mnt/ollama:/root/.ollama-shared:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - worker-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - ollama

  # ============================================================================
  # HEALTH & MONITORING
  # ============================================================================

  health-checker:
    image: curlimages/curl:latest
    container_name: nyra-health-checker-${WORKER_NAME}
    environment:
      CHECK_INTERVAL: "60"
      WORKER_NAME: "${WORKER_NAME}"
    entrypoint: |
      /bin/sh -c '
      while true; do
        if [ "$(echo $WORKER_NAME)" = "rtx-3060" ]; then
          curl -f http://ollama:11434/api/tags || echo "Ollama health check failed"
        else
          curl -f http://vllm:8000/health || echo "vLLM health check failed"
        fi
        sleep 60
      done
      '
    depends_on:
      - vllm
    networks:
      - worker-net
    restart: unless-stopped
    profiles:
      - debug

  # ============================================================================
  # VOLUMES & NETWORKS
  # ============================================================================

volumes:
  ollama_data:

networks:
  worker-net:
    driver: bridge
