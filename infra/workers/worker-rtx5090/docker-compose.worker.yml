services:
  # Workers default to localhost-only port binds (safer on LAN).
  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
  redis:
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
  mongo:
    ports:
      - "127.0.0.1:${MONGO_PORT:-27017}:27017"
  n8n:
    ports:
      - "127.0.0.1:${N8N_PORT:-5678}:5678"
  grafana:
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3003}:3000"
  prometheus:
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
  loki:
    ports:
      - "127.0.0.1:${LOKI_PORT:-3100}:3100"
  cadvisor:
    ports:
      - "127.0.0.1:${CADVISOR_PORT:-8081}:8080"
  cloudflared:
    # Workers should not run the tunnel by default
    profiles: ["_disabled"]
