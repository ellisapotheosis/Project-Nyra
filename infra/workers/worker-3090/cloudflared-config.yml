# ============================================================================
# Cloudflared Tunnel Configuration for Worker-3090
# ============================================================================
# Provides secure external access to Ollama API without exposing ports
# Documentation: https://developers.cloudflare.com/cloudflare-one/connections/connect-apps/

tunnel: worker-3090-tunnel
credentials-file: /etc/cloudflared/credentials.json

# ============================================================================
# Ingress Rules
# ============================================================================
ingress:
  # Ollama API endpoint
  - hostname: worker-3090.your-domain.com
    service: http://localhost:11434
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveTimeout: 90s
      keepAliveConnections: 100

  # Prometheus metrics endpoint
  - hostname: worker-3090-metrics.your-domain.com
    service: http://localhost:9100
    originRequest:
      noTLSVerify: true

  # NVIDIA GPU metrics endpoint
  - hostname: worker-3090-gpu.your-domain.com
    service: http://localhost:9835
    originRequest:
      noTLSVerify: true

  # Health check endpoint
  - hostname: worker-3090-health.your-domain.com
    path: /health
    service: http://localhost:11434/api/tags
    originRequest:
      noTLSVerify: false

  # Catch-all rule (must be last)
  - service: http_status:404

# ============================================================================
# Logging
# ============================================================================
loglevel: info
logfile: /var/log/cloudflared/cloudflared.log

# ============================================================================
# Protocol Configuration
# ============================================================================
protocol: quic
transport-loglevel: warn

# ============================================================================
# Metrics
# ============================================================================
metrics: 0.0.0.0:9126

# ============================================================================
# Retries
# ============================================================================
retries: 5

# ============================================================================
# Origin Configuration
# ============================================================================
originRequest:
  # Connection settings
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  noHappyEyeballs: false
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  httpHostHeader: worker-3090.your-domain.com
  originServerName: worker-3090

  # TLS settings
  noTLSVerify: false
  disableChunkedEncoding: false

  # Proxy settings
  proxyAddress: ""
  proxyPort: 0
  proxyType: ""

# ============================================================================
# Setup Instructions
# ============================================================================
# 1. Create tunnel:
#    cloudflared tunnel create worker-3090-tunnel
#
# 2. Save credentials to: C:\Users\YourUser\.cloudflared\credentials.json
#
# 3. Configure DNS records in Cloudflare dashboard:
#    - worker-3090.your-domain.com -> CNAME to <tunnel-id>.cfargotunnel.com
#    - worker-3090-metrics.your-domain.com -> CNAME to <tunnel-id>.cfargotunnel.com
#    - worker-3090-gpu.your-domain.com -> CNAME to <tunnel-id>.cfargotunnel.com
#    - worker-3090-health.your-domain.com -> CNAME to <tunnel-id>.cfargotunnel.com
#
# 4. Route tunnel:
#    cloudflared tunnel route dns worker-3090-tunnel worker-3090.your-domain.com
#
# 5. Run tunnel:
#    cloudflared tunnel run worker-3090-tunnel
#
# 6. Or install as service:
#    cloudflared service install
#    cloudflared service start

# ============================================================================
# Security Notes
# ============================================================================
# - All traffic is encrypted via Cloudflare Tunnel
# - No inbound firewall rules required
# - Tunnel credentials are stored in credentials.json
# - Access can be restricted via Cloudflare Access policies
# - Consider enabling Cloudflare Access for production deployments

# ============================================================================
# Production Considerations
# ============================================================================
# 1. Enable Cloudflare Access for authentication
# 2. Configure rate limiting in Cloudflare dashboard
# 3. Set up WAF rules to protect against attacks
# 4. Enable DDoS protection
# 5. Configure custom SSL certificates
# 6. Set up monitoring and alerting
# 7. Use Cloudflare Zero Trust for team access
