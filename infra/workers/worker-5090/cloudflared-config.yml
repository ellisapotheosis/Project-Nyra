# Cloudflared Tunnel Configuration for Worker RTX 5090
# Exposes Ollama and LiteLLM APIs via Cloudflare Tunnel
# Usage: cloudflared tunnel run --config cloudflared-config.yml worker-5090

# Tunnel name (must be created first: cloudflared tunnel create worker-5090)
tunnel: worker-5090

# Credentials file (generated during tunnel creation)
credentials-file: C:\Users\YOUR_USERNAME\.cloudflared\YOUR_TUNNEL_ID.json

# Ingress rules
ingress:
  # Ollama API
  - hostname: worker-5090.ratehunter.net
    service: http://localhost:11434
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      tlsTimeout: 30s
      tcpKeepAlive: 30s
      keepAliveConnections: 10
      keepAliveTimeout: 90s
      httpHostHeader: worker-5090.ratehunter.net

  # LiteLLM Proxy (OpenAI-compatible API)
  - hostname: litellm-5090.ratehunter.net
    service: http://localhost:4000
    originRequest:
      noTLSVerify: false
      connectTimeout: 30s
      tlsTimeout: 30s
      tcpKeepAlive: 30s

  # Model Manager API
  - hostname: models-5090.ratehunter.net
    service: http://localhost:8080
    originRequest:
      noTLSVerify: false
      connectTimeout: 15s

  # Performance Metrics (Prometheus)
  - hostname: metrics-5090.ratehunter.net
    service: http://localhost:9090
    originRequest:
      noTLSVerify: false
      connectTimeout: 15s

  # Health Check API
  - hostname: health-5090.ratehunter.net
    service: http://localhost:8081
    originRequest:
      noTLSVerify: false
      connectTimeout: 10s

  # Catch-all rule (404)
  - service: http_status:404

# Logging
loglevel: info
logfile: C:\ProgramData\cloudflared\worker-5090.log

# Metrics server
metrics: localhost:9091

# Protocol settings
protocol: quic

# Autoupdate settings
autoupdate-freq: 24h

# No TLS verify for local services
no-tls-verify: false
