# LiteLLM Configuration for Worker RTX 5090
# Provides OpenAI-compatible API for Ollama models

model_list:
  # DeepSeek-R1 236B - Primary reasoning model
  - model_name: deepseek-r1-236b
    litellm_params:
      model: ollama/deepseek-r1:236b-instruct-q4_K_M
      api_base: http://ollama:11434
      stream: true
      temperature: 0.7
      max_tokens: 4096
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      tags:
        - complex_reasoning
        - mortgage_calculations
        - compliance_analysis

  # Qwen 2.5 72B - Secondary reasoning model
  - model_name: qwen-2.5-72b
    litellm_params:
      model: ollama/qwen2.5:72b-instruct-q5_K_M
      api_base: http://ollama:11434
      stream: true
      temperature: 0.7
      max_tokens: 4096
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      tags:
        - general_reasoning
        - document_analysis
        - loan_logic

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  database_url: ${LITELLM_DATABASE_URL}

  # Worker identification
  worker_id: worker-5090
  worker_role: primary_reasoning

  # Logging
  json_logs: true
  log_raw_request_response: false

litellm_settings:
  # Drop unsupported parameters
  drop_params: true

  # Callbacks for monitoring
  success_callback: ["prometheus", "langfuse"]
  failure_callback: ["prometheus"]

  # Caching (optional)
  cache: false
  cache_params:
    type: redis
    host: redis
    port: 6379

  # Rate limiting
  rpm: 60
  tpm: 100000

  # Timeout settings
  request_timeout: 300

  # Retry settings
  num_retries: 2
  timeout: 600

router_settings:
  # Load balancing strategy
  routing_strategy: usage-based-routing

  # Model aliases
  model_group_alias:
    reasoning: deepseek-r1-236b
    general: qwen-2.5-72b

  # Fallback models
  fallback_models:
    deepseek-r1-236b: ["qwen-2.5-72b"]

  # Allowed failures before fallback
  allowed_fails: 1

  # Cooldown before retry
  cooldown_time: 30

# Prometheus metrics
environment_variables:
  PROMETHEUS_PORT: "9091"
  PROMETHEUS_ENDPOINT: "/metrics"
