name: nyra-dev-stack

networks:
  dev-stack:
    name: nyra-dev-stack
    driver: bridge

volumes:
  redis_data: {}
  ruvector_data: {}

services:
  redis:
    image: redis:7-alpine
    container_name: nyra-dev-redis
    profiles: ["core", "orchestrator", "all"]
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    networks: [dev-stack]

  ruvector-postgres:
    image: ruvnet/ruvector-postgres:latest
    container_name: nyra-dev-ruvector-postgres
    profiles: ["core", "orchestrator", "all"]
    environment:
      POSTGRES_DB: ${RUVECTOR_POSTGRES_DB:-claude_flow}
      POSTGRES_USER: ${RUVECTOR_POSTGRES_USER:-claude}
      POSTGRES_PASSWORD: ${RUVECTOR_POSTGRES_PASSWORD:-claude-flow-secure}
    ports:
      - "${RUVECTOR_POSTGRES_PORT:-5436}:5432"
    volumes:
      - ruvector_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUVECTOR_POSTGRES_USER:-claude} -d ${RUVECTOR_POSTGRES_DB:-claude_flow}"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [dev-stack]
