# ==============================================================================
# Project Nyra - Master Infrastructure Orchestration
# ==============================================================================
# Consolidated master compose file using modular includes
#
# Architecture: Modular, layered infrastructure with proper dependency ordering
# Generated: 2026-01-18
#
# Quick Start:
#   docker compose up -d                    # Start all services
#   docker compose up -d --profile core     # Core services only
#   docker compose up -d --profile ai       # AI stack
#   docker compose up -d --profile full     # Everything
#
# Selective Start:
#   docker compose up -d postgres redis     # Just databases
#   docker compose up -d nexus litellm      # AI gateway
#   docker compose up -d nyra_orchestrator  # Orchestrator + deps
#
# Environment:
#   Copy .env.example to .env and customize
#
# Override:
#   Local development overrides in docker-compose.override.yml
# ==============================================================================

version: '3.9'

# ==============================================================================
# MODULAR SERVICE INCLUDES (Dependency-Ordered)
# ==============================================================================
# Services are included in dependency order:
# 1. Base (postgres, redis) - Foundation layer
# 2. Databases (specialized stores) - Data layer
# 3. AI Services - Intelligence layer
# 4. CRM - Business layer
# 5. Workflow - Automation layer
# 6. Observability - Monitoring layer
# 7. Orchestrator - Coordination layer
# 8. Business Services - Application layer

include:
  # Layer 1: Core Foundation (databases first)
  - path: ./docker-compose/docker-compose.base.yml
    env_file: .env

  # Layer 2: Specialized Databases
  - path: ./docker-compose/docker-compose.databases.yml
    env_file: .env

  # Layer 2.5: MCP Servers (depend on databases)
  - path: ./docker-compose/docker-compose.mcp-servers.yml
    env_file: .env

  # Layer 3: AI & Intelligence Services
  - path: ./docker-compose/docker-compose.ai.yml
    env_file: .env

  # Layer 4: CRM & Customer Management
  - path: ./docker-compose/docker-compose.crm.yml
    env_file: .env

  # Layer 5: Workflow Automation
  - path: ./docker-compose/docker-compose.workflow.yml
    env_file: .env

  # Layer 6: Observability & Monitoring (depends on services)
  - path: ./docker-compose/docker-compose.observability.yml
    env_file: .env

  # Layer 7: Orchestration (depends on all core services)
  - path: ./docker-compose/docker-compose.orchestrator.yml
    env_file: .env

  # Layer 8: Business Logic Services (top layer)
  - path: ./docker-compose/docker-compose.business.yml
    env_file: .env

# ==============================================================================
# GLOBAL NETWORKS
# ==============================================================================
# Shared across all included compose files

networks:
  nyra-network:
    name: nyra-network
    external: true

  databases:
    name: nyra-databases
    driver: bridge
    internal: true
    labels:
      - "com.nyra.network=databases"
      - "com.nyra.purpose=database-isolation"

  monitoring:
    name: nyra-monitoring
    driver: bridge
    labels:
      - "com.nyra.network=monitoring"
      - "com.nyra.purpose=observability"

# ==============================================================================
# GLOBAL VOLUMES
# ==============================================================================
# Persistent data storage across all services

volumes:
  # Core Database Volumes
  nyra_postgres_data:
    name: nyra_postgres_data
    driver: local
    labels:
      - "com.nyra.volume=database"
      - "com.nyra.service=postgres"
      - "com.nyra.backup=critical"

  nyra_redis_data:
    name: nyra_redis_data
    driver: local
    labels:
      - "com.nyra.volume=cache"
      - "com.nyra.service=redis"

  # Specialized Databases
  nyra_falkordb_data:
    name: nyra_falkordb_data
    driver: local
    labels:
      - "com.nyra.volume=database"
      - "com.nyra.service=falkordb"
      - "com.nyra.type=graph"

  nyra_qdrant_data:
    name: nyra_qdrant_data
    driver: local
    labels:
      - "com.nyra.volume=database"
      - "com.nyra.service=qdrant"
      - "com.nyra.type=vector"

  # AI Service Volumes
  nyra_litellm_data:
    name: nyra_litellm_data
    driver: local
    labels:
      - "com.nyra.volume=ai"
      - "com.nyra.service=litellm"

  nyra_letta_data:
    name: nyra_letta_data
    driver: local
    labels:
      - "com.nyra.volume=ai"
      - "com.nyra.service=letta"
      - "com.nyra.backup=important"

  nyra_mem0_data:
    name: nyra_mem0_data
    driver: local
    labels:
      - "com.nyra.volume=ai"
      - "com.nyra.service=mem0"

  # Workflow Volumes
  nyra_n8n_data:
    name: nyra_n8n_data
    driver: local
    labels:
      - "com.nyra.volume=workflow"
      - "com.nyra.service=n8n"

  nyra_dify_data:
    name: nyra_dify_data
    driver: local
    labels:
      - "com.nyra.volume=workflow"
      - "com.nyra.service=dify"

  nyra_activepieces_data:
    name: nyra_activepieces_data
    driver: local
    labels:
      - "com.nyra.volume=workflow"
      - "com.nyra.service=activepieces"

  # Observability Volumes
  nyra_prometheus_data:
    name: nyra_prometheus_data
    driver: local
    labels:
      - "com.nyra.volume=monitoring"
      - "com.nyra.service=prometheus"
      - "com.nyra.backup=important"

  nyra_grafana_data:
    name: nyra_grafana_data
    driver: local
    labels:
      - "com.nyra.volume=monitoring"
      - "com.nyra.service=grafana"

  nyra_loki_data:
    name: nyra_loki_data
    driver: local
    labels:
      - "com.nyra.volume=monitoring"
      - "com.nyra.service=loki"

  # CRM Volumes
  nyra_twentycrm_data:
    name: nyra_twentycrm_data
    driver: local
    labels:
      - "com.nyra.volume=crm"
      - "com.nyra.service=twentycrm"
      - "com.nyra.backup=critical"

# ==============================================================================
# DEPLOYMENT PROFILES
# ==============================================================================
# Use profiles to control which services start
#
# Examples:
#   docker compose --profile core up -d       # Core only
#   docker compose --profile ai up -d         # AI services
#   docker compose --profile full up -d       # Everything
#
# Services without profiles always start (default behavior)
# ==============================================================================

# Note: Profile assignments are defined in individual compose files
# Core services (postgres, redis) have no profile (always start)
# AI services have 'ai' profile
# Monitoring services have 'monitoring' profile
# Business services have 'business' profile

# ==============================================================================
# HEALTH CHECK CONFIGURATION
# ==============================================================================
# All critical services include health checks:
#
# - postgres: pg_isready check every 10s
# - redis: redis-cli ping every 10s
# - nexus: HTTP health endpoint every 30s
# - litellm: HTTP health endpoint every 30s
# - letta: HTTP health endpoint every 30s
# - nyra_orchestrator: HTTP health endpoint every 30s
# - prometheus: HTTP health endpoint every 30s
# - grafana: HTTP health endpoint every 30s
#
# Health checks ensure:
# 1. Proper startup ordering via depends_on with condition: service_healthy
# 2. Automatic container restart on failure
# 3. Load balancer integration readiness
# 4. Rolling update compatibility
# ==============================================================================

# ==============================================================================
# DEPENDENCY GRAPH
# ==============================================================================
#
# Level 1 (Foundation):
#   postgres ────────────────────┐
#   redis ───────────────────────┤
#                                │
# Level 2 (Data Layer):          │
#   falkordb ────────────────────┤
#   qdrant ──────────────────────┤
#                                │
# Level 3 (AI Gateway):          │
#   litellm ─────────────────────┤
#   nexus ───────────────────────┤
#                                │
# Level 4 (AI Services):         │
#   letta ───────────────────────┤
#   mem0 ────────────────────────┤
#   openmemory_mcp ──────────────┤
#   openwebui ───────────────────┤
#                                │
# Level 5 (Business Apps):       │
#   twentycrm ───────────────────┤
#   n8n ─────────────────────────┤
#   dify-api ────────────────────┤
#   activepieces ────────────────┤
#                                │
# Level 6 (Monitoring):          │
#   prometheus ──────────────────┤
#   grafana ─────────────────────┤
#   loki ────────────────────────┤
#   alertmanager ────────────────┤
#                                │
# Level 7 (Orchestration):       │
#   nyra_orchestrator ───────────┤ (depends on all above)
#                                │
# Level 8 (Business Logic):      │
#   quote-engine ────────────────┤
#   campaign-engine ─────────────┤
#   quote-api ───────────────────┘
#
# ==============================================================================

# ==============================================================================
# RESOURCE ALLOCATION SUMMARY
# ==============================================================================
#
# Total Resource Requirements (default limits):
# - CPU: ~20 cores (limit), ~8 cores (reservation)
# - Memory: ~40GB (limit), ~16GB (reservation)
#
# Per-Service Breakdown:
# - postgres: 4GB RAM, 2 CPU
# - redis: 2GB RAM, 1 CPU
# - litellm: 2GB RAM, 1 CPU
# - letta: 2GB RAM, 1 CPU
# - nexus: 2GB RAM, 1 CPU
# - nyra_orchestrator: 4GB RAM, 2 CPU
# - prometheus: 4GB RAM, 2 CPU
# - grafana: 2GB RAM, 1 CPU
# - (see individual compose files for complete details)
#
# Recommended Minimum Hardware:
# - Development: 16GB RAM, 8 cores
# - Production: 64GB RAM, 16 cores
# ==============================================================================

# ==============================================================================
# SECURITY NOTES
# ==============================================================================
#
# 1. Environment Variables:
#    - NEVER commit .env to version control
#    - Use strong passwords for all services
#    - Rotate secrets regularly
#
# 2. Network Isolation:
#    - Database network is internal (no external access)
#    - Only necessary ports exposed to host
#    - Services communicate via internal networks
#
# 3. Volume Security:
#    - All volumes use named volumes (not bind mounts in production)
#    - Backup critical volumes regularly
#    - Encrypt volumes at rest in production
#
# 4. Service Hardening:
#    - Health checks detect compromised containers
#    - Resource limits prevent DoS
#    - Non-root users in containers (where supported)
#
# 5. Secret Management:
#    - Consider using Docker secrets or Infisical
#    - API keys should be in .env, not hardcoded
#    - Use read-only mounts for config files
#
# ==============================================================================

# ==============================================================================
# MAINTENANCE & OPERATIONS
# ==============================================================================
#
# Start Services:
#   docker compose up -d
#
# Stop Services:
#   docker compose down
#
# View Logs:
#   docker compose logs -f [service_name]
#
# Check Status:
#   docker compose ps
#
# Restart Service:
#   docker compose restart [service_name]
#
# Update Images:
#   docker compose pull
#   docker compose up -d --force-recreate
#
# Backup Volumes:
#   docker run --rm -v nyra_postgres_data:/data -v $(pwd):/backup \
#     alpine tar czf /backup/postgres.tar.gz /data
#
# Monitor Resources:
#   docker stats
#
# Health Checks:
#   docker compose ps  # Shows health status
#
# ==============================================================================

# ==============================================================================
# TROUBLESHOOTING
# ==============================================================================
#
# Services won't start:
# 1. Check logs: docker compose logs -f [service_name]
# 2. Verify .env file exists and has required variables
# 3. Check port conflicts: netstat -an | grep [port]
# 4. Verify dependencies are healthy: docker compose ps
#
# Database connection issues:
# 1. Ensure postgres is healthy: docker compose ps postgres
# 2. Check connection string in service logs
# 3. Test manually: docker exec nyra-postgres psql -U nyra_user -c "SELECT 1"
#
# Performance issues:
# 1. Check resource usage: docker stats
# 2. Review resource limits in compose files
# 3. Increase Docker memory allocation
# 4. Scale horizontally (add workers)
#
# Network issues:
# 1. Verify network exists: docker network ls | grep nyra
# 2. Check service network membership: docker network inspect nyra-network
# 3. Test connectivity: docker exec [service] ping [other_service]
#
# ==============================================================================

# ==============================================================================
# MIGRATION FROM OLD COMPOSE FILES
# ==============================================================================
#
# Old single-file compose (infra/docker-compose.yml) has been replaced
# with this modular architecture. To migrate:
#
# 1. Review your current .env configuration
# 2. Stop old stack: docker compose down
# 3. Backup volumes (see backup commands above)
# 4. Start new stack: docker compose up -d
# 5. Verify all services: docker compose ps
# 6. Check logs for any errors: docker compose logs -f
#
# Old compose file archived as: docker-compose.yml.old
#
