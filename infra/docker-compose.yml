name: nyra

x-logging: &default_logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  nyra:
    name: nyra
    driver: bridge

volumes:
  postgres_data: {}
  redis_data: {}
  mongo_data: {}
  n8n_data: {}
  activepieces_data: {}
  grafana_data: {}
  prometheus_data: {}
  loki_data: {}
  ruvector_data: {}
  twenty_pg: {}
  infisical_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres
    profiles: ['core', 'all']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      [
        'postgres',
        '-c',
        'config_file=/etc/postgresql/postgresql.conf',
        '-c',
        'hba_file=/etc/postgresql/pg_hba.conf',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    profiles: ['core', 'all']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      [
        'sh',
        '-lc',
        "redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory ${REDIS_MAX_MEMORY:-2gb} --maxmemory-policy allkeys-lru",
      ]
    ports: ['${REDIS_PORT:-6379}:6379']
    volumes: ['redis_data:/data']
    healthcheck:
      test: ['CMD-SHELL', "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  mongo:
    image: mongo:7
    container_name: nyra-mongo
    profiles: ['core', 'all']
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    ports: ['${MONGO_PORT:-27017}:27017']
    volumes: ['mongo_data:/data/db']
    healthcheck:
      test: ['CMD-SHELL', "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-litellm
    profiles: ['gateway', 'orchestrator', 'all']
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}}
    ports: ['${LITELLM_PORT:-4000}:4000']
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  nexus-router:
    build:
      context: ..
      dockerfile: infra/docker/nexus-router/Dockerfile
    container_name: nyra-nexus-router
    profiles: ['gateway', 'orchestrator', 'all']
    environment:
      NEXUS_ROUTER_PORT: ${NEXUS_ROUTER_PORT:-7000}
      NEXUS_MCP_PORT: ${NEXUS_MCP_PORT:-8080}
      NEXUS_METRICS_PORT: ${NEXUS_METRICS_PORT:-9091}
      NEXUS_URL: ${NEXUS_URL:-http://localhost:7000}
      NEXUS_CONFIG_PATH: /app/nexus.toml
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LITELLM_BASE_URL: http://litellm:4000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    ports:
      - '${NEXUS_ROUTER_PORT:-7000}:7000'
      - '${NEXUS_MCP_PORT:-8080}:8080'
      - '${NEXUS_METRICS_PORT:-9091}:9091'
    volumes:
      - ./configs/nexus/nexus.toml:/app/nexus.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7000/health']
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  nyra-mcp:
    build:
      context: ..
      dockerfile: infra/mcp/nyra_mcp/Dockerfile
    container_name: nyra-mcp
    profiles: ['mcp', 'orchestrator', 'all']
    environment:
      PORT: ${NYRA_MCP_PORT:-3333}
      NYRA_HTTP_ALLOWLIST: ${NYRA_HTTP_ALLOWLIST:-http://nexus-router:8080,http://n8n:5678,http://activepieces:80,http://twentycrm:3000}
    ports:
      - '${NYRA_MCP_PORT:-3333}:8081'
    healthcheck:
      test: ['CMD', 'wget', '-q', '-O', '-', 'http://localhost:8081/health']
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  n8n:
    build:
      context: ..
      dockerfile: infra/docker/n8n/Dockerfile
      args:
        N8N_TWENTY_NODES_GIT: ${N8N_TWENTY_NODES_GIT:-}
        N8N_EXTRA_PACKAGES: ${N8N_EXTRA_PACKAGES:-}
    container_name: nyra-n8n
    profiles: ['workflow', 'orchestrator', 'oracle', 'all']
    depends_on:
      postgres:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
    environment:
      N8N_PORT: '5678'
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:${N8N_PORT:-5678}/}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: '5432'
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nyra}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
      N8N_EDITOR_BASE_URL: ${N8N_EDITOR_BASE_URL:-http://localhost:${N8N_PORT:-5678}}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme}
      NEXUS_BASE_URL: http://nexus-router:7000
      NEXUS_MCP_URL: http://nexus-router:8080
      TWENTYCRM_BASE_URL: http://twentycrm:3000
    ports: ['${N8N_PORT:-5678}:5678']
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/opt/nyra/n8n-workflows:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    profiles: ['workflow', 'orchestrator', 'oracle', 'all']
    depends_on:
      nexus-router:
        condition: service_healthy
    environment:
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?set ACTIVEPIECES_ENCRYPTION_KEY}
      AP_ENVIRONMENT: ${ACTIVEPIECES_ENV:-prod}
      AP_WEBHOOK_TIMEOUT_SECONDS: ${ACTIVEPIECES_WEBHOOK_TIMEOUT_SECONDS:-30}
      NEXUS_BASE_URL: http://nexus-router:7000
    ports: ['${ACTIVEPIECES_PORT:-8082}:80']
    volumes: ['activepieces_data:/root/.activepieces']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  twenty-postgres:
    image: postgres:16
    container_name: nyra-twenty-postgres
    profiles: ['crm', 'orchestrator', 'oracle', 'all']
    environment:
      POSTGRES_USER: ${TWENTY_POSTGRES_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_POSTGRES_PASSWORD:-twenty}
      POSTGRES_DB: ${TWENTY_POSTGRES_DB:-twenty}
    volumes: ['twenty_pg:/var/lib/postgresql/data']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  twentycrm:
    image: twentycrm/twenty:latest
    container_name: nyra-twentycrm
    profiles: ['crm', 'orchestrator', 'oracle', 'all']
    depends_on:
      - twenty-postgres
      - nexus-router
    environment:
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:${TWENTYCRM_PORT:-3000}}
      ENCRYPTION_SECRET: ${TWENTY_ENCRYPTION_SECRET:?set TWENTY_ENCRYPTION_SECRET}
      JWT_SECRET: ${TWENTY_JWT_SECRET:?set TWENTY_JWT_SECRET}
      PASSWORD_SALT: ${TWENTY_PASSWORD_SALT:?set TWENTY_PASSWORD_SALT}
      PGHOST: twenty-postgres
      PGPORT: '5432'
      PGUSER: ${TWENTY_POSTGRES_USER:-twenty}
      PGPASSWORD: ${TWENTY_POSTGRES_PASSWORD:-twenty}
      PGDATABASE: ${TWENTY_POSTGRES_DB:-twenty}
      NEXUS_BASE_URL: http://nexus-router:7000
    ports: ['${TWENTYCRM_PORT:-3000}:3000']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  twentycrm-mcp:
    image: ${TWENTYCRM_MCP_IMAGE:-ghcr.io/jezweb/twenty-crm-mcp:latest}
    container_name: nyra-twentycrm-mcp
    profiles: ['crm', 'orchestrator', 'oracle', 'all']
    depends_on:
      - twentycrm
      - nexus-router
    environment:
      PORT: ${TWENTYCRM_MCP_PORT:-8182}
      TWENTYCRM_URL: http://twentycrm:3000
      TWENTYCRM_TOKEN: ${TWENTYCRM_API_KEY:-}
      NEXUS_MCP_PROXY_URL: http://nexus-router:8080
    ports: ['${TWENTYCRM_MCP_PORT:-8182}:8082']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  claude-flow:
    build:
      context: ../services/claude-flow
      dockerfile: Dockerfile
    container_name: nyra-claude-flow
    profiles: ['dev', 'all']
    depends_on:
      redis:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      CLAUDE_FLOW_MODE: server
      CLAUDE_FLOW_PORT: '8080'
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MCP_SERVER_URL: http://nexus-router:8080
      NEXUS_BASE_URL: http://nexus-router:7000
    ports: ['${CLAUDE_FLOW_PORT:-8085}:8080']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-os:
    build:
      context: ../services/archon-os
      dockerfile: docker/Dockerfile.archon-os
    container_name: nyra-archon-os
    profiles: ['archon', 'all']
    depends_on:
      nexus-router:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      ARCHON_ENV: ${ARCHON_ENV:-development}
      NEXUS_BASE_URL: http://nexus-router:7000
      NEXUS_MCP_URL: http://nexus-router:8080
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports: ['${ARCHON_OS_PORT:-9001}:9001']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  moltbot-web:
    image: ${MOLTBOT_WEB_IMAGE:-ghcr.io/openclaw/moltbot-web:latest}
    container_name: nyra-moltbot-web
    profiles: ['apps', 'oracle', 'all']
    depends_on:
      nexus-router:
        condition: service_healthy
    environment:
      PORT: ${MOLTBOT_WEB_PORT:-3030}
      OPENAI_BASE_URL: http://nexus-router:7000/v1
      MCP_BASE_URL: http://nexus-router:8080
      TWENTYCRM_BASE_URL: http://twentycrm:3000
    ports: ['${MOLTBOT_WEB_PORT:-3030}:3030']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-openwebui
    profiles: ['apps', 'oracle', 'all']
    depends_on:
      nexus-router:
        condition: service_healthy
    environment:
      OPENAI_API_BASE_URL: http://nexus-router:7000/v1
      OPENAI_API_KEY: ${NEXUS_ADMIN_TOKEN:-dummy}
    ports: ['${OPENWEBUI_PORT:-8088}:8080']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    profiles: ['observability', 'oracle', 'all']
    command: ['--config.file=/etc/prometheus/prometheus.yml', '--storage.tsdb.path=/prometheus']
    ports: ['${PROMETHEUS_PORT:-9090}:9090']
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    profiles: ['observability', 'oracle', 'all']
    command: ['-config.file=/etc/loki/loki.yml']
    ports: ['${LOKI_PORT:-3100}:3100']
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    profiles: ['observability', 'oracle', 'all']
    depends_on: [prometheus, loki]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports: ['${GRAFANA_PORT:-3003}:3000']
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    profiles: ['edge', 'all']
    command: ['tunnel', 'run']
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR:?set CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR}
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    profiles: ['secrets', 'oracle', 'all']
    environment:
      NODE_ENV: production
      DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-${ACTIVEPIECES_ENCRYPTION_KEY:-change-me-32-chars-minimum}}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-${TWENTY_JWT_SECRET:-change-me-32-chars-minimum}}
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:${INFISICAL_PORT:-8086}}
    ports:
      - '${INFISICAL_PORT:-8086}:8080'
    volumes:
      - infisical_data:/var/lib/infisical
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  docker-mcp-toolkit:
    image: ${DOCKER_MCP_IMAGE:-docker/mcp-toolkit:latest}
    container_name: nyra-docker-mcp-toolkit
    profiles: ['mcp', 'devtools', 'all']
    ports:
      - '${DOCKER_MCP_PORT:-8811}:8811'
    environment:
      MCP_HTTP_PORT: 8811
      NEXUS_MCP_PROXY_URL: http://nexus-router:8080
    depends_on:
      nexus-router:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  git-mcp:
    image: ${GIT_MCP_IMAGE:-ghcr.io/modelcontextprotocol/servers/git:latest}
    container_name: nyra-git-mcp
    profiles: ['mcp', 'devtools', 'all']
    command: ['--transport', 'streamable-http', '--port', '8812']
    ports:
      - '${GIT_MCP_PORT:-8812}:8812'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  github-mcp:
    image: ${GITHUB_MCP_IMAGE:-ghcr.io/github/github-mcp-server:latest}
    container_name: nyra-github-mcp
    profiles: ['mcp', 'devtools', 'all']
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      PORT: '8813'
    ports:
      - '${GITHUB_MCP_PORT:-8813}:8813'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  bitwarden-mcp:
    image: ${BITWARDEN_MCP_IMAGE:-ghcr.io/modelcontextprotocol/servers/bitwarden:latest}
    container_name: nyra-bitwarden-mcp
    profiles: ['mcp', 'secrets', 'all']
    command: ['--transport', 'streamable-http', '--port', '8814']
    ports:
      - '${BITWARDEN_MCP_PORT:-8814}:8814'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  infisical-mcp:
    image: ${INFISICAL_MCP_IMAGE:-ghcr.io/modelcontextprotocol/servers/infisical:latest}
    container_name: nyra-infisical-mcp
    profiles: ['mcp', 'secrets', 'all']
    command: ['--transport', 'streamable-http', '--port', '8815']
    environment:
      INFISICAL_URL: ${INFISICAL_SITE_URL:-http://infisical:8080}
      INFISICAL_TOKEN: ${INFISICAL_MCP_TOKEN:-}
    ports:
      - '${INFISICAL_MCP_PORT:-8815}:8815'
    depends_on:
      - infisical
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  agentdb:
    image: postgres:16-alpine
    container_name: nyra-agentdb
    profiles: ['apps', 'all']
    environment:
      POSTGRES_DB: ${AGENTDB_DB:-agentdb}
      POSTGRES_USER: ${AGENTDB_USER:-agentdb}
      POSTGRES_PASSWORD: ${AGENTDB_PASSWORD:-agentdb-change-me}
    ports:
      - '${AGENTDB_PORT:-5440}:5432'
    volumes:
      - ./data/agentdb:/var/lib/postgresql/data
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  agentic-flow:
    image: ${AGENTIC_FLOW_IMAGE:-ghcr.io/ruvnet/agentic-flow:latest}
    container_name: nyra-agentic-flow
    profiles: ['apps', 'all']
    environment:
      AGENTDB_URL: postgresql://${AGENTDB_USER:-agentdb}:${AGENTDB_PASSWORD:-agentdb-change-me}@agentdb:5432/${AGENTDB_DB:-agentdb}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      NEXUS_BASE_URL: http://nexus-router:7000
      LITELLM_BASE_URL: http://litellm:4000
    ports:
      - '${AGENTIC_FLOW_PORT:-8095}:8095'
    depends_on:
      - agentdb
      - redis
      - nexus-router
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nyra-cadvisor
    profiles: ['observability', 'all']
    ports:
      - '${CADVISOR_PORT:-8081}:8080'
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  ruvector-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyra-ruvector-pgadmin
    profiles: ['vector', 'debug', 'all']
    environment:
      PGADMIN_DEFAULT_EMAIL: ${RUVECTOR_PGADMIN_EMAIL:-admin@nyra.local}
      PGADMIN_DEFAULT_PASSWORD: ${RUVECTOR_PGADMIN_PASSWORD:-changeme}
    ports:
      - '${RUVECTOR_PGADMIN_PORT:-5050}:80'
    depends_on:
      - ruvector-postgres
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  # Worker lanes (intended to run on worker hosts using profile selection)
  worker-3060-ollama:
    image: ollama/ollama:latest
    container_name: nyra-worker-3060-ollama
    profiles: ['worker-3060']
    ports: ['${WORKER_3060_OLLAMA_PORT:-11434}:11434']
    volumes:
      - ${WORKER_3060_OLLAMA_DATA:-./data/worker-3060-ollama}:/root/.ollama
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  worker-3090ti-vllm:
    image: vllm/vllm-openai:latest
    container_name: nyra-worker-3090ti-vllm
    profiles: ['worker-3090ti']
    command:
      [
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--model',
        '${WORKER_3090TI_MODEL:-meta-llama/Llama-3.1-8B-Instruct}',
      ]
    ports: ['${WORKER_3090TI_VLLM_PORT:-8000}:8000']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  worker-5090-vllm:
    image: vllm/vllm-openai:latest
    container_name: nyra-worker-5090-vllm
    profiles: ['worker-5090']
    command:
      [
        '--host',
        '0.0.0.0',
        '--port',
        '8000',
        '--model',
        '${WORKER_5090_MODEL:-Qwen/Qwen2.5-72B-Instruct-AWQ}',
      ]
    ports: ['${WORKER_5090_VLLM_PORT:-8001}:8000']
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  ruvector-postgres:
    image: ruvnet/ruvector-postgres:latest
    container_name: ruvector-postgres
    profiles: ['vector', 'all']
    environment:
      POSTGRES_USER: ${RUVECTOR_POSTGRES_USER:-claude}
      POSTGRES_PASSWORD: ${RUVECTOR_POSTGRES_PASSWORD:?set RUVECTOR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUVECTOR_POSTGRES_DB:-claude_flow}
    ports: ['${RUVECTOR_POSTGRES_PORT:-5436}:5432']
    volumes:
      - ruvector_data:/var/lib/postgresql/data
      - ./ruvector/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${RUVECTOR_POSTGRES_USER:-claude} -d ${RUVECTOR_POSTGRES_DB:-claude_flow}',
        ]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging
