version: '3.8'

# This override limits the services running on the orchestrator node.  Each service
# uses the `extends` keyword to import its definition from the base compose
# file(s).  Adjust service names to match your actual Docker Compose files.
services:
  nexus-router:
    extends:
      file: ../infra/docker-compose.yml
      service: nexus-router
  orchestrator:
    extends:
      file: ../infra/docker-compose.yml
      service: orchestrator
  auth-service:
    extends:
      file: ../infra/docker-compose.yml
      service: auth-service
  security-service:
    extends:
      file: ../infra/docker-compose.yml
      service: security-service
  grafana:
    extends:
      file: ../infra/docker-compose.monitoring.yml
      service: grafana
  prometheus:
    extends:
      file: ../infra/docker-compose.monitoring.yml
      service: prometheus
  n8n:
    extends:
      file: ../infra/docker-compose.automation.yml
      service: n8n
  activepieces:
    extends:
      file: ../infra/docker-compose.automation.yml
      service: activepieces
  claude-flow-event-server:
    extends:
      file: ../infra/docker-compose.claude-flow.yml
      service: claude-flow-event-server
  claude-flow-dashboard:
    extends:
      file: ../infra/docker-compose.claude-flow.yml
      service: claude-flow-dashboard
