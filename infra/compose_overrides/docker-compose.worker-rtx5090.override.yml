version: '3.8'

# Worker RTX 5090 override: run vLLM for large models and the microservices hosted
# on this machine.  Adjust service names to match your compose files.
services:
  vllm-5090:
    extends:
      file: ../infra/docker-compose.gpu-5090.yml
      service: vllm-5090
  lead-api:
    extends:
      file: ../infra/docker-compose.yml
      service: lead-api
  quote-api:
    extends:
      file: ../infra/docker-compose.yml
      service: quote-api
  rate-api:
    extends:
      file: ../infra/docker-compose.yml
      service: rate-comparison-api
  document-api:
    extends:
      file: ../infra/docker-compose.yml
      service: document-api
  campaign-engine:
    extends:
      file: ../infra/docker-compose.yml
      service: campaign-engine
