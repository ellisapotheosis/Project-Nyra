not_tunneled:
  - postgres (supabase-db, infisical-postgres) — Tailscale TCP svc only
  - twenty-db — internal to oracle-vps
  - redis-cache — internal to oracle-vps
  - falkordb — Tailscale TCP svc:falkordb only (mem0 graph backend)
  - qdrant — Tailscale svc:qdrant only (mem0 vector backend)
  - loki — Tailscale svc:loki-oracle only
  - worker-vllm (vLLM on 3090ti/5090) — Tailscale svc:vllm-* only
  - worker-ollama (Ollama on 3060) — Tailscale svc:ollama-3060 only
  - worker-litellm (LiteLLM on workers) — Tailscale svc:litellm-3060/3090ti/5090 only
  - worker-redis (KV cache on 3090ti/5090) — Tailscale internal only
  - worker-nerve-api (Nerve on workers) — exposed via cloudflared nerve-*.projectnyra.com
  - openlit-clickhouse-native — Tailscale svc:openlit-clickhouse-native only
  - openlit-otlp-grpc/http — Tailscale TCP svc only
  - docker-socket — never exposed
  - llxprt-bridge — Tailscale svc:llxprt-bridge only

dns_records:
  txt:
    - name: "@"
      content: "cloudflare_dashboard_sso=12e9e7340d465d8521325dfe104254ca"
      notes: Required for Cloudflare dashboard SSO verification.
