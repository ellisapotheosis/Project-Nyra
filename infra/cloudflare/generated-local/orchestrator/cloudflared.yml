# Generated backup/export for the orchestrator Cloudflare Tunnel.
# Runtime preference: API/dashboard-managed tunnel with ORCHESTRATOR_TUNNEL_TOKEN.

tunnel: ${ORCHESTRATOR_TUNNEL_ID}
credentials-file: /etc/cloudflared/${ORCHESTRATOR_TUNNEL_ID}.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  - hostname: links.ratehunter.net
    service: http://100.64.0.2:3007
  - hostname: linkwarden.ratehunter.net
    service: http://100.64.0.2:3007
  - hostname: openclaw-gateway.ratehunter.net
    service: http://nyra-openclaw-gateway:8001
  - service: http_status:404
