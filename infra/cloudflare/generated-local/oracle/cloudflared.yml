# Generated backup/export for the Oracle VPS Cloudflare Tunnel.
# Runtime preference: API/dashboard-managed tunnel with ORACLE_TUNNEL_TOKEN.
# ratehunter.net and www.ratehunter.net are Cloudflare Pages, not tunnel routes.

tunnel: ${ORACLE_TUNNEL_ID}
credentials-file: /etc/cloudflared/${ORACLE_TUNNEL_ID}.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  - hostname: nyra.ratehunter.net
    service: http://webapp:3001
  - hostname: api.ratehunter.net
    service: http://supabase-kong:8000
  - hostname: hooks.ratehunter.net
    service: http://n8n:5678
  - hostname: twenty.ratehunter.net
    service: http://twenty:3000
  - hostname: crm.ratehunter.net
    service: http://twenty:3000
  - hostname: n8n.ratehunter.net
    service: http://n8n:5678
  - hostname: gitea.ratehunter.net
    service: http://gitea:3000
  - hostname: activepieces.ratehunter.net
    service: http://activepieces:80
  - hostname: grafana.ratehunter.net
    service: http://grafana:3000
  - hostname: prometheus.ratehunter.net
    service: http://prometheus:9090
  - hostname: cadvisor.ratehunter.net
    service: http://cadvisor:8080
  - hostname: openwebui.ratehunter.net
    service: http://openwebui:8080
  - hostname: nexus.ratehunter.net
    service: http://nexus-ui:3016
  - hostname: nexus-router.ratehunter.net
    service: http://nexus:3000
  - hostname: litellm.ratehunter.net
    service: http://litellm:4000
  - hostname: paperclip.ratehunter.net
    service: http://paperclip:3100
  - hostname: clawteam.ratehunter.net
    service: http://clawteam:8080
  - hostname: portainer-oracle.ratehunter.net
    service: https://portainer:9443
    originRequest:
      noTLSVerify: true
  - hostname: git-ssh.ratehunter.net
    service: ssh://gitea:2222
  - service: http_status:404
