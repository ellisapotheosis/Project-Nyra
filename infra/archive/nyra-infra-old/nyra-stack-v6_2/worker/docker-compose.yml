version: "3.9"

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment: ["OLLAMA_KEEP_ALIVE=5m"]
    volumes: ["ollama_data:/root/.ollama"]
    ports: ["11434:11434"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:11434/api/tags"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    profiles: ["llm"]

  caddy:
    image: caddy:2-alpine
    container_name: worker-portal
    restart: unless-stopped
    ports: ["8080:8080"]
    volumes: ["./Caddyfile:/etc/caddy/Caddyfile:ro"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    profiles: ["ui"]

volumes:
  ollama_data:
