

include:
  - ../compose/compose.memory.yml
  - ../compose/compose.ui.yml
  - ../compose/compose.mcp.yml
  - ../compose/compose.orchestration.yml

services:
  # This file orchestrates the profiles.
  # Services are defined in the included files.
  # To run all services: docker-compose --profile all up
  # To run specific profiles: docker-compose --profile memory --profile ui up
  placeholder:
    image: busybox
    command: ["echo", "This is a placeholder service to ensure the file is valid if no profiles are selected."]
    profiles: ["none"] # This profile will never be activated by default

networks:
  nyra-net:
    driver: bridge

volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  owui_data: {}
  metamcp_data: {}
  n8n_data: {}
  flowise_data: {}
  mcp_logs: {}
