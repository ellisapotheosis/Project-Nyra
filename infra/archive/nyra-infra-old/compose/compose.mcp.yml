version: "3.9"
services:
  metamcp:
    # EITHER build from your local gateway (preferred if you have it):
    # build:
    #   context: ../../mcp-ecosystem/MetaMCP
    #   dockerfile: Dockerfile
    # OR use a prebuilt image if your gateway publishes one:
    image: ghcr.io/modelcontextprotocol/metamcp-gateway:latest
    container_name: metamcp
    restart: unless-stopped
    env_file:
      - ../.env
    env_file:
      - ../.env
    ports:
      - "12008:12008"
    env_file:`r`n      -     
    environment:
      APP_URL: \
      API_ACCESS_TOKEN: \
      LOG_LEVEL: \
    networks:
      - nyra-network

networks:
  nyra-network:
    external: true

  - ..\.env


