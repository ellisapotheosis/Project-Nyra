version: '3.8'

services:
  # Bitwarden Password Manager
  bitwarden:
    image: vaultwarden/server:latest
    container_name: nyra-bitwarden
    ports:
      - "8081:80"
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=true
      - ADMIN_TOKEN=${BITWARDEN_ADMIN_TOKEN}
    volumes:
      - bitwarden-data:/data
    networks:
      - nyra-network
    restart: unless-stopped

  # Infisical Secrets Management
  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    ports:
      - "8080:8080"
    environment:
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      - JWT_SECRET=${JWT_SECRET}
      - SITE_URL=http://localhost:8080
    volumes:
      - infisical-data:/app/data
    depends_on:
      - postgres
    networks:
      - nyra-network
    restart: unless-stopped

  # PostgreSQL Database (shared by Infisical and MetaMCP)
  postgres:
    image: postgres:15-alpine
    container_name: nyra-postgres
    environment:
      - POSTGRES_DB=nyra
      - POSTGRES_USER=nyra
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_MULTIPLE_DATABASES=infisical,metamcp
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyra"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  bitwarden-data:
  infisical-data:
  postgres-data:

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
