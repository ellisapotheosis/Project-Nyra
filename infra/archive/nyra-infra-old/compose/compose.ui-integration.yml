version: '3.8'
services:
  archon-ui:
    image: archon/ui:latest
    ports:
      - "8080:8080"
    volumes:
      - ./nyra-mcp/integrations/archon-extensions:/extensions
    networks:
      - nyra-network

  open-webui:
    image: open-webui/core:latest
    ports:
      - "3000:3000"
    volumes:
      - ./nyra-mcp/integrations/owui-plugins:/plugins
      - ./nyra-mcp/integrations/archon-extensions:/archon-extensions
    networks:
      - nyra-network

  metamcp-proxy:
    image: metamcp/proxy:latest
    ports:
      - "12008:12008"
    volumes:
      - ./nyra-mcp/channels:/config
    depends_on:
      - archon-ui
      - open-webui
    networks:
      - nyra-network

networks:
  nyra_network:
    driver: bridge