
services:
  postgres:
    image: postgres:16
    container_name: nyra-postgres
    env_file:
      - ../.env
    env_file:
      - ../.env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPER_PASSWORD:-supersecret}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ../postgres/init:/docker-entrypoint-initdb.d:ro
    profiles: ["memory","core"]
    networks:
      - nyra-net

  redis:
    image: redis:7
    profiles: ["memory"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "redisdata:/data" ]
    ports: [ "6379:6379" ]
    networks:
      - nyra-net

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["memory"]
    restart: unless-stopped
    ports: [ "6333:6333", "6334:6334" ]
    volumes: [ "qdrantdata:/qdrant/storage" ]
    networks:
      - nyra-net

