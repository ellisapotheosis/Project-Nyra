version: '3.8'

networks:
  nyra-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  nexus-data:
  letta-data:
  mem0-data:
  agentdb-data:
  ruvector-data:
  infisical-data:
  redis-orchestrator-data:

services:
  # LLM Gateway - Routes to Anthropic, OpenRouter, Gemini
  nexus-router:
    image: ghcr.io/ruv-inc/nexus-router:latest
    container_name: nexus-router
    ports:
      - "6000:6000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - DEFAULT_PROVIDER=anthropic
      - FALLBACK_PROVIDERS=openrouter,google
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - nexus-data:/app/data
    networks:
      - nyra-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Letta (MemGPT) - Stateful conversation memory
  letta:
    image: letta/letta:latest
    container_name: letta
    ports:
      - "8283:8283"
    environment:
      - LETTA_LLM_ENDPOINT=http://nexus-router:6000
      - LETTA_EMBEDDING_ENDPOINT=http://nexus-router:6000
      - LETTA_PG_DB=letta
      - LETTA_PG_USER=letta
      - LETTA_PG_PASSWORD=${LETTA_PG_PASSWORD}
      - LETTA_PG_HOST=postgres-letta
      - LETTA_PG_PORT=5432
    volumes:
      - letta-data:/app/data
    networks:
      - nyra-net
    depends_on:
      - nexus-router
      - postgres-letta
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-letta:
    image: pgvector/pgvector:pg16
    container_name: postgres-letta
    environment:
      - POSTGRES_DB=letta
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${LETTA_PG_PASSWORD}
    volumes:
      - letta-data:/var/lib/postgresql/data
    networks:
      - nyra-net
    restart: unless-stopped

  # Mem0 - Universal memory layer
  mem0:
    image: mem0ai/mem0:latest
    container_name: mem0
    ports:
      - "4321:4321"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_API_KEY=${QDRANT_API_KEY}
      - MEM0_LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - mem0-data:/app/data
    networks:
      - nyra-net
    depends_on:
      - qdrant
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4321/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant - Vector database for Mem0
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - mem0-data:/qdrant/storage
    networks:
      - nyra-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Claude Flow - Orchestrator
  claude-flow:
    image: ghcr.io/ruv-inc/claude-flow:alpha
    container_name: claude-flow
    ports:
      - "3010:3010"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_FLOW_MODE=orchestrator
      - AGENTDB_URL=http://agentdb:8080
      - REASONINGBANK_ENABLED=true
      - SWARM_MAX_AGENTS=31
      - SWARM_TOPOLOGY=hierarchical
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - agentdb-data:/app/data
    networks:
      - nyra-net
    depends_on:
      - nexus-router
      - agentdb
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AgentDB - HNSW vector database
  agentdb:
    image: ghcr.io/ruv-inc/agentdb:latest
    container_name: agentdb
    ports:
      - "8080:8080"
    environment:
      - AGENTDB_HNSW_M=16
      - AGENTDB_HNSW_EF_CONSTRUCTION=200
      - AGENTDB_QUANTIZATION=scalar
      - AGENTDB_CACHE_SIZE=256
    volumes:
      - agentdb-data:/app/data
    networks:
      - nyra-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RuVector - Memory optimization
  ruvector:
    image: ghcr.io/ruv-inc/ruvector:latest
    container_name: ruvector
    ports:
      - "8888:8888"
    environment:
      - RUVECTOR_SONA_ENABLED=true
      - RUVECTOR_MOE_ENABLED=true
      - RUVECTOR_FLASH_ATTENTION=true
      - RUVECTOR_EWC_ENABLED=true
    volumes:
      - ruvector-data:/app/data
    networks:
      - nyra-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infisical - Secrets management
  infisical:
    image: infisical/infisical:latest
    container_name: infisical
    ports:
      - "8080:8080"
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - JWT_SECRET=${INFISICAL_JWT_SECRET}
      - MONGO_URL=mongodb://infisical-mongo:27017/infisical
    volumes:
      - infisical-data:/app/data
    networks:
      - nyra-net
    depends_on:
      - infisical-mongo
    restart: unless-stopped

  infisical-mongo:
    image: mongo:7
    container_name: infisical-mongo
    volumes:
      - infisical-data:/data/db
    networks:
      - nyra-net
    restart: unless-stopped

  # Redis - Caching and message broker
  redis:
    image: redis:7-alpine
    container_name: redis-orchestrator
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-orchestrator-data:/data
    networks:
      - nyra-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
