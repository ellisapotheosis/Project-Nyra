# ============================================================================
# Project Nyra - Development Overrides
# Usage: docker-compose -f docker-compose.yml -f docker-compose.dev.yml up
# ============================================================================

version: '3.9'

services:
  # ============================================================================
  # Development Overrides
  # ============================================================================

  claude-flow:
    build:
      target: dependencies  # Stop at dependencies stage for faster rebuilds
    environment:
      NODE_ENV: development
      CLAUDE_FLOW_LOG_LEVEL: debug
      CLAUDE_FLOW_HOT_RELOAD: "true"
    volumes:
      # Mount source for hot reload
      - ../../submodules/claude-flow/src:/app/src:ro
      - ../../.claude-flow:/app/.claude-flow
    command: pnpm run dev
    ports:
      - "3000:3000"
      - "9229:9229"  # Node debugger

  archon:
    build:
      target: dependencies
    environment:
      PYTHON_ENV: development
      ARCHON_LOG_LEVEL: DEBUG
      ARCHON_RELOAD: "true"
    volumes:
      # Mount source for hot reload
      - ../../tools/archon-os/archon:/app/archon:ro
      - ../../.archon:/app/.archon
    command: uvicorn archon.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "8000:8000"
      - "5678:5678"  # Python debugger (debugpy)

  postgres:
    environment:
      POSTGRES_HOST_AUTH_METHOD: trust  # Dev only - no password required
    ports:
      - "5432:5432"  # Expose to host for direct access

  redis:
    command: redis-server --requirepass dev-only-password
    ports:
      - "6379:6379"  # Expose to host

  mongo:
    ports:
      - "27017:27017"  # Expose to host

  graphiti-mcp:
    environment:
      LOG_LEVEL: debug
    volumes:
      # Mount for development
      - ../../mcp-servers/graphiti:/app:ro

  mem0-mcp:
    environment:
      LOG_LEVEL: debug
    volumes:
      # Mount for development
      - ../../mcp-servers/mem0:/app:ro

  gitea:
    environment:
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__DISABLE_SSH: "false"
      GITEA__log__LEVEL: Debug

  n8n:
    environment:
      N8N_LOG_LEVEL: debug
      N8N_DIAGNOSTICS_ENABLED: "false"  # Disable telemetry in dev
    volumes:
      # Mount custom nodes for development
      - ../../n8n/custom-nodes:/home/node/.n8n/custom:ro

# ============================================================================
# Development Tools
# ============================================================================

  # Adminer - Database Management UI
  adminer:
    image: adminer:latest
    container_name: nyra-adminer-dev
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
      ADMINER_DESIGN: dracula
    networks:
      - nyra-network

  # Redis Commander - Redis Management UI
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: nyra-redis-commander-dev
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      REDIS_HOSTS: local:redis:6379:0:dev-only-password
    networks:
      - nyra-network

  # Mailhog - Email Testing
  mailhog:
    image: mailhog/mailhog:latest
    container_name: nyra-mailhog-dev
    restart: unless-stopped
    ports:
      - "8025:8025"  # Web UI
      - "1025:1025"  # SMTP
    networks:
      - nyra-network

networks:
  nyra-network:
    # Use existing network from main compose

volumes:
  # Use existing volumes from main compose
  postgres_data:
  redis_data:
  mongo_data:
  claude_flow_data:
  archon_data:
