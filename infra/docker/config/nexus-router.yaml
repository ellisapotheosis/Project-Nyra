# ==============================================================================
# Nexus Router - Centralized MCP Proxy Aggregator & LLM Routing Hub
# ==============================================================================
# Architecture: Local-first LLM routing with GPU workers, cloud fallback
# Features: MCP aggregation, load balancing, rate limiting, health monitoring
# ==============================================================================

# HTTP Server Configuration
http:
  port: 6000
  host: 0.0.0.0
  timeout: 30s
  read_timeout: 30s
  write_timeout: 30s
  idle_timeout: 120s

# gRPC Server Configuration
grpc:
  enabled: true
  port: 8000
  host: 0.0.0.0

# Authentication & Authorization
auth:
  jwt_secret: ${NEXUS_JWT_SECRET}
  admin_token: ${NEXUS_ADMIN_TOKEN}
  enable_api_keys: true

# ==============================================================================
# LLM ROUTING - LOCAL-FIRST WITH CLOUD FALLBACK
# ==============================================================================
# Priority 1: Local GPU workers (80%+ traffic target)
# Priority 2: OpenRouter DeepSeek-R1 (overflow)
# Priority 3: Anthropic Claude Sonnet 4 (critical compliance tasks)
# ==============================================================================

llm:
  enabled: true
  default_provider: worker-5090
  fallback_enabled: true
  load_balancing: least_connection

  # LLM Provider Routing with Priority
  providers:
    # ========================================================================
    # PRIORITY 1: LOCAL GPU WORKERS (Ollama)
    # ========================================================================

    - name: worker-5090
      type: openai_compatible
      priority: 1
      base_url: http://worker-5090.tail-net.ts.net:11434/v1
      max_concurrent: 3
      timeout: 120s
      models:
        - deepseek-r1:236b
        - qwen2.5:72b
        - deepseek-coder:33b
      health_check:
        enabled: true
        endpoint: /api/tags
        interval: 30s
        timeout: 10s
      tags:
        - local
        - gpu
        - high-capacity
        - reasoning

    - name: worker-3090
      type: openai_compatible
      priority: 1
      base_url: http://worker-3090.tail-net.ts.net:11434/v1
      max_concurrent: 2
      timeout: 120s
      models:
        - llama3.1:70b
        - mistral-large:123b
        - mixtral:8x7b
      health_check:
        enabled: true
        endpoint: /api/tags
        interval: 30s
        timeout: 10s
      tags:
        - local
        - gpu
        - medium-capacity
        - general-purpose

    - name: worker-3060
      type: openai_compatible
      priority: 1
      base_url: http://worker-3060.tail-net.ts.net:11434/v1
      max_concurrent: 2
      timeout: 120s
      models:
        - codellama:34b
        - qwen2:32b
        - gemma2:27b
        - phi3:14b
      health_check:
        enabled: true
        endpoint: /api/tags
        interval: 30s
        timeout: 10s
      tags:
        - local
        - gpu
        - low-capacity
        - embeddings
        - documents

    # ========================================================================
    # PRIORITY 2: CLOUD FALLBACK - OPENROUTER
    # ========================================================================

    - name: openrouter
      type: openai_compatible
      priority: 2
      base_url: https://openrouter.ai/api/v1
      api_key: ${OPENROUTER_API_KEY}
      max_concurrent: 5
      timeout: 60s
      fallback: true
      models:
        - deepseek/deepseek-r1
        - anthropic/claude-3.5-sonnet
        - meta-llama/llama-3.1-405b
      health_check:
        enabled: true
        endpoint: /api/v1/models
        interval: 60s
      tags:
        - cloud
        - fallback
        - cost-optimized

    # ========================================================================
    # PRIORITY 3: ANTHROPIC DIRECT (Critical Compliance)
    # ========================================================================

    - name: anthropic
      type: anthropic
      priority: 3
      api_key: ${ANTHROPIC_API_KEY}
      max_concurrent: 3
      timeout: 60s
      models:
        - claude-sonnet-4-5-20250929
        - claude-opus-4-5-20251101
      tags:
        - cloud
        - compliance
        - critical

    # ========================================================================
    # PRIORITY 4: GOOGLE GEMINI (Experimental)
    # ========================================================================

    - name: google
      type: google
      priority: 4
      api_key: ${GOOGLE_API_KEY}
      max_concurrent: 2
      timeout: 60s
      models:
        - gemini-2.0-flash-exp
        - gemini-1.5-pro
      tags:
        - cloud
        - experimental

  # Load Balancing Strategy
  load_balancing:
    strategy: least_connection
    health_check_interval: 30s
    failure_threshold: 3
    recovery_threshold: 2
    circuit_breaker:
      enabled: true
      failure_threshold: 5
      timeout: 60s
      half_open_requests: 3

  # Routing Rules
  routing:
    - rule: model_preference
      models:
        - deepseek-r1:236b
        - deepseek/deepseek-r1
      providers:
        - worker-5090
        - openrouter

    - rule: task_type
      task: compliance
      providers:
        - anthropic

    - rule: task_type
      task: embeddings
      providers:
        - worker-3060
        - worker-3090

    - rule: task_type
      task: code_generation
      providers:
        - worker-5090
        - worker-3060

# ==============================================================================
# MCP SERVER AGGREGATION
# ==============================================================================
# Centralized MCP server discovery and proxy for all AI/ML services
# ==============================================================================

mcp:
  enabled: true
  discovery:
    enabled: true
    interval: 60s

  # All MCP Servers
  servers:
    # Claude Flow - Multi-Agent Orchestration
    - name: claude-flow
      url: http://claude-flow:3010
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - orchestration
        - agents
        - swarm

    # Letta - Stateful Conversation Memory
    - name: letta
      url: http://letta:8283
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - memory
        - conversation
        - stateful

    # Graphiti - Temporal Knowledge Graphs
    - name: graphiti
      url: http://graphiti_mcp:9100
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - graph
        - knowledge
        - temporal

    # RuVector - Fast Vector Search
    - name: ruvector
      url: http://ruvector:8888
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - vector
        - search
        - hnsw

    # Mem0 - Universal Memory Layer
    - name: mem0
      url: http://mem0_mcp:8081
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - memory
        - personalization
        - profiles

    # Qdrant - Vector Database
    - name: qdrant
      url: http://qdrant:6333
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - vector
        - database
        - similarity

    # Serena - Orchestration Engine
    - name: serena
      url: http://serena:8086
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - orchestration
        - workflow

    # Gemini Assistant - Google AI Integration
    - name: gemini-assistant
      url: http://gemini-assistant:8085
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - assistant
        - google
        - ai

    # OpenMemory - Shared Collaborative Memory
    - name: openmemory
      url: http://openmemory-mcp:8080
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - memory
        - collaborative
        - shared

    # AgentDB - HNSW Vector Database
    - name: agentdb
      url: http://agentdb:5433
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - database
        - vector
        - agents

    # Agent Booster - Performance Optimization
    - name: agent-booster
      url: http://agent-booster:3010
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - optimization
        - performance
        - cache

    # Epic SDK - Extended Capabilities
    - name: epic-sdk
      url: http://epic-sdk:3011
      health_check:
        enabled: true
        endpoint: /health
        interval: 30s
      tags:
        - sdk
        - extended
        - capabilities

# ==============================================================================
# HEALTH MONITORING & OBSERVABILITY
# ==============================================================================

health:
  enabled: true
  endpoint: /health

  # Health Check Configuration
  checks:
    - name: llm_providers
      type: http
      interval: 30s
      timeout: 10s

    - name: mcp_servers
      type: http
      interval: 30s
      timeout: 10s

    - name: redis_cache
      type: tcp
      target: redis:6379
      interval: 10s
      timeout: 5s

    - name: postgres_logs
      type: tcp
      target: postgres:5432
      interval: 10s
      timeout: 5s

  # Redis for health state storage
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
    db: 1
    pool_size: 10

# ==============================================================================
# RATE LIMITING
# ==============================================================================

rate_limit:
  enabled: true
  default_limit: 5000
  window: 60s

  # Per-endpoint limits
  endpoints:
    - path: /v1/chat/completions
      limit: 5000
      window: 60s

    - path: /mcp/*
      limit: 10000
      window: 60s

    - path: /health
      limit: 100
      window: 10s

  # Per-provider limits
  providers:
    - name: worker-5090
      limit: 180
      window: 60s

    - name: worker-3090
      limit: 120
      window: 60s

    - name: worker-3060
      limit: 120
      window: 60s

    - name: openrouter
      limit: 300
      window: 60s

    - name: anthropic
      limit: 100
      window: 60s

  # Storage backend
  storage:
    type: redis
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}
      db: 2

# ==============================================================================
# LOGGING & AUDIT
# ==============================================================================

logging:
  level: ${LOG_LEVEL:-info}
  format: json

  # Request logging
  requests:
    enabled: true
    headers: true
    body: false
    response: false

  # Audit logging
  audit:
    enabled: true
    destination: postgres
    postgres:
      host: postgres
      port: 5432
      database: nyra
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      table: audit_logs
      batch_size: 100
      flush_interval: 10s

  # Structured logging destinations
  destinations:
    - type: stdout
      level: info

    - type: file
      path: /var/log/nexus/access.log
      level: info
      rotation:
        max_size: 100MB
        max_age: 7d
        max_backups: 10

    - type: postgres
      level: warn
      connection: ${DATABASE_URL}

# ==============================================================================
# METRICS & PROMETHEUS
# ==============================================================================

metrics:
  enabled: true
  endpoint: /metrics

  # Prometheus configuration
  prometheus:
    enabled: true
    port: 6000
    path: /metrics
    namespace: nexus
    subsystem: router

  # Custom metrics
  custom:
    - name: llm_request_duration
      type: histogram
      help: "LLM request duration in seconds"
      buckets: [0.1, 0.5, 1, 2, 5, 10, 30, 60]

    - name: llm_requests_total
      type: counter
      help: "Total LLM requests by provider and model"
      labels: [provider, model, status]

    - name: mcp_tool_calls_total
      type: counter
      help: "Total MCP tool calls by server and tool"
      labels: [server, tool, status]

    - name: active_connections
      type: gauge
      help: "Number of active connections"
      labels: [type]

    - name: queue_depth
      type: gauge
      help: "Request queue depth by provider"
      labels: [provider]

# ==============================================================================
# CACHING
# ==============================================================================

cache:
  enabled: true
  backend: redis

  # Redis cache configuration
  redis:
    host: redis
    port: 6379
    password: ${REDIS_PASSWORD}
    db: 0
    pool_size: 20
    max_retries: 3
    retry_delay: 1s

  # Cache policies
  policies:
    - name: llm_responses
      ttl: 3600s
      max_size: 1000
      key_pattern: "llm:*"

    - name: mcp_results
      ttl: 300s
      max_size: 5000
      key_pattern: "mcp:*"

    - name: embeddings
      ttl: 86400s
      max_size: 10000
      key_pattern: "embed:*"

# ==============================================================================
# POLICIES & ACCESS CONTROL
# ==============================================================================

policies:
  - name: borrower_minimal_tools
    description: "Restricted access for borrower-facing applications"
    allow_tools:
      - graphiti.*
      - mem0.*
      - letta.*
      - openmemory.*
    deny_tools:
      - filesystem.*
      - github.*
      - dockerhub.*
    allow_providers:
      - worker-3060
      - worker-3090
      - openrouter
    deny_providers:
      - anthropic  # Too expensive for general use

  - name: internal_ops_full_tools
    description: "Full access for internal operations"
    allow_tools:
      - "*"
    allow_providers:
      - "*"

  - name: compliance_critical
    description: "Compliance-focused with audit trail"
    allow_tools:
      - graphiti.*
      - letta.*
      - mem0.*
    allow_providers:
      - anthropic  # High-quality for compliance
      - worker-5090  # DeepSeek-R1 for reasoning
    audit:
      enabled: true
      level: detailed

# ==============================================================================
# ADVANCED CONFIGURATION
# ==============================================================================

# Retry Configuration
retry:
  enabled: true
  max_attempts: 3
  backoff: exponential
  initial_delay: 1s
  max_delay: 30s

# Timeout Configuration
timeouts:
  request: 120s
  connection: 10s
  idle: 300s
  shutdown: 30s

# Circuit Breaker
circuit_breaker:
  enabled: true
  failure_threshold: 5
  success_threshold: 2
  timeout: 60s
  half_open_requests: 3

# OpenAI-Compatible Endpoint
openai_compatible:
  enabled: true
  endpoint: /v1/chat/completions
  model_mapping:
    gpt-4: deepseek-r1:236b
    gpt-3.5-turbo: llama3.1:70b
    text-embedding-ada-002: nomic-embed-text

# CORS Configuration
cors:
  enabled: true
  allowed_origins:
    - http://localhost:3000
    - http://localhost:3001
    - http://localhost:5678
    - http://twenty:3000
    - http://dify:8000
  allowed_methods:
    - GET
    - POST
    - PUT
    - DELETE
    - OPTIONS
  allowed_headers:
    - Content-Type
    - Authorization
    - X-API-Key
  expose_headers:
    - X-Request-ID
    - X-Rate-Limit-Remaining
  max_age: 3600

# Development/Debug
debug:
  enabled: ${DEBUG:-false}
  pprof: false
  trace: false
