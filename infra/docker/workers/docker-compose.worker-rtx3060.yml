# Docker Compose - Worker Node RTX 3060 (PC2)
# Specialization: Code generation, CRM, workflow automation

services:
  # Ollama - LLM Inference
  ollama:
    image: ollama/ollama:latest
    container_name: nyra-worker-rtx3060-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/app/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2
      - OLLAMA_NUM_PARALLEL=4
    volumes:
      - ollama-models-rtx3060:/app/models
    networks:
      - nyra-worker-rtx3060
      - nyra-core
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # LiteLLM Proxy - Model Gateway
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-worker-rtx3060-litellm
    restart: unless-stopped
    ports:
      - "4001:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - ../configs/litellm-worker-rtx3060.yaml:/app/config.yaml:ro
      - litellm-data:/app/data
    networks:
      - nyra-worker-rtx3060
      - nyra-core
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Manager - Automatic Model Loading
  model-manager:
    image: nyra/model-manager:latest
    container_name: nyra-worker-rtx3060-model-manager
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - WORKER_ID=worker-rtx3060
      - GPU_TYPE=rtx_3060
      - VRAM_GB=6
      - OLLAMA_API_BASE=http://ollama:11434
      - SPECIALIZATION=code
    volumes:
      - ../configs/worker-rtx3060-config.yaml:/app/config.yaml:ro
      - ollama-models-rtx3060:/app/models
      - manager-data:/app/data
    networks:
      - nyra-worker-rtx3060
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Performance Monitor - GPU Metrics
  perf-monitor:
    image: nyra/worker-perf-monitor:latest
    container_name: nyra-worker-rtx3060-perf
    restart: unless-stopped
    ports:
      - "9001:9090"
    environment:
      - WORKER_ID=worker-rtx3060
      - GPU_MONITORING=true
      - PROMETHEUS_PUSH_GATEWAY=http://prometheus:9091
    volumes:
      - ../configs/worker-rtx3060-config.yaml:/app/config.yaml:ro
      - monitor-data:/app/data
    networks:
      - nyra-worker-rtx3060
      - nyra-orchestrator
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache - Local Caching
  redis-worker:
    image: redis:7-alpine
    container_name: nyra-worker-rtx3060-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    networks:
      - nyra-worker-rtx3060
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Health Check Service
  health-check:
    image: nyra/health-check:latest
    container_name: nyra-worker-rtx3060-health
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - WORKER_ID=worker-rtx3060
      - CHECK_INTERVAL=30
      - ORCHESTRATOR_URL=http://archgw-router:8080
    volumes:
      - ../configs/worker-rtx3060-config.yaml:/app/config.yaml:ro
    networks:
      - nyra-worker-rtx3060
      - nyra-orchestrator
    depends_on:
      - ollama
      - litellm-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 3

networks:
  nyra-worker-rtx3060:
    name: nyra-worker-rtx3060
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16
  nyra-core:
    external: true
  nyra-orchestrator:
    external: true

volumes:
  ollama-models-rtx3060:
    driver: local
  litellm-data:
    driver: local
  manager-data:
    driver: local
  monitor-data:
    driver: local
  redis-data:
    driver: local
