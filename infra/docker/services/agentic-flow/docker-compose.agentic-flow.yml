# ============================================================================
# Agentic-Flow Alpha - Docker Compose Configuration
# ============================================================================
# Core orchestration primitives for claude-flow integration
# Eliminates 10,000+ duplicate lines by using agentic-flow as base (ADR-001)
#
# Usage with Infisical:
#   infisical run --projectId="pbcskpxyqtysbxjvecfo" \
#     --env="dev" --path="/shared" -- docker compose -f docker-compose.agentic-flow.yml up
# ============================================================================

version: '3.8'

networks:
  nyra-network:
    external: true

services:
  # Agentic-Flow Alpha - Core orchestration engine
  agentic-flow:
    build:
      context: .
      dockerfile: Dockerfile
    image: nyra/agentic-flow:alpha
    container_name: nyra-agentic-flow
    restart: unless-stopped
    environment:
      # Core Configuration
      NODE_ENV: ${NODE_ENV:-production}
      PORT: ${AGENTIC_FLOW_PORT:-8080}
      MCP_PORT: ${AGENTIC_FLOW_MCP_PORT:-8081}

      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgresql:5432/${POSTGRES_DB}
      AGENTDB_PATH: /app/data/agentdb/agentic.db

      # Redis Configuration (Database 3 - isolated from other services)
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      REDIS_CACHE_TTL: ${AGENTIC_FLOW_CACHE_TTL:-3600}

      # AgentDB Configuration
      AGENTDB_ENABLED: true
      AGENTDB_QUANTIZATION: ${AGENTDB_QUANTIZATION:-binary}
      AGENTDB_CACHE_SIZE: ${AGENTDB_CACHE_SIZE:-2000}
      AGENTDB_HNSW_M: ${AGENTDB_HNSW_M:-16}
      AGENTDB_HNSW_EF: ${AGENTDB_HNSW_EF:-100}

      # Learning & Intelligence
      AGENTDB_LEARNING: true
      AGENTDB_REASONING: true
      ENABLE_REASONINGBANK: true
      ENABLE_NEURAL_OPTIMIZATION: true

      # QUIC Synchronization (Multi-node)
      AGENTDB_QUIC_SYNC: ${AGENTDB_QUIC_SYNC:-true}
      AGENTDB_QUIC_PORT: ${AGENTDB_QUIC_PORT:-4433}
      AGENTDB_QUIC_PEERS: ${AGENTDB_QUIC_PEERS:-}

      # LLM Provider Configuration
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}

      # Nexus Router Integration
      NEXUS_ROUTER_URL: ${NEXUS_ROUTER_URL:-http://nexus-router:${NEXUS_ROUTER_PORT:-7000}}

      # Claude Flow Integration
      CLAUDE_FLOW_URL: ${CLAUDE_FLOW_URL:-http://claude-flow:${CLAUDE_FLOW_PORT:-3001}}
      CLAUDE_FLOW_INTEGRATION: true

      # Agent Configuration
      AGENT_CONFIG_PATH: /app/data/agent-configs
      MAX_CONCURRENT_AGENTS: ${MAX_CONCURRENT_AGENTS:-35}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-300000}

      # Performance Tuning
      ENABLE_CACHING: true
      ENABLE_COMPRESSION: true
      ENABLE_BATCH_PROCESSING: true
      WORKER_THREADS: ${WORKER_THREADS:-4}

      # Monitoring & Telemetry
      ENABLE_TELEMETRY: ${AGENTIC_FLOW_TELEMETRY:-true}
      PROMETHEUS_ENABLED: true
      PROMETHEUS_PORT: ${AGENTIC_FLOW_PROMETHEUS_PORT:-9091}

      # Logging
      LOG_LEVEL: ${AGENTIC_FLOW_LOG_LEVEL:-info}
      LOG_FORMAT: json
      LOG_PATH: /app/data/logs

      # Security
      ENABLE_AUTH: ${AGENTIC_FLOW_AUTH:-true}
      JWT_SECRET: ${AGENTIC_FLOW_JWT_SECRET}
      API_KEY: ${AGENTIC_FLOW_API_KEY}

    volumes:
      # AgentDB persistence
      - agentic_flow_agentdb:/app/data/agentdb

      # Memory persistence
      - agentic_flow_memory:/app/data/memory

      # Agent configurations (shared with claude-flow)
      - ../../.claude-flow/agents:/app/data/agent-configs:ro

      # Logs
      - agentic_flow_logs:/app/data/logs

      # Cache
      - agentic_flow_cache:/app/data/cache

      # Docker socket (for agent spawning)
      - /var/run/docker.sock:/var/run/docker.sock

    ports:
      - "${AGENTIC_FLOW_PORT:-8080}:8080"
      - "${AGENTIC_FLOW_MCP_PORT:-8081}:8081"
      - "${AGENTIC_FLOW_PROMETHEUS_PORT:-9091}:9091"

    networks:
      - nyra-network

    depends_on:
      postgresql:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 4G
        reservations:
          cpus: '2.0'
          memory: 2G

    labels:
      - "com.nyra.service=agentic-flow"
      - "com.nyra.component=orchestration"
      - "com.nyra.version=alpha"

volumes:
  agentic_flow_agentdb:
    name: nyra_agentic_flow_agentdb
    driver: local
  agentic_flow_memory:
    name: nyra_agentic_flow_memory
    driver: local
  agentic_flow_logs:
    name: nyra_agentic_flow_logs
    driver: local
  agentic_flow_cache:
    name: nyra_agentic_flow_cache
    driver: local
