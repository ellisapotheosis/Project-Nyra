# Agent Booster - Tier 1 Model Routing
# Pattern-based code transforms without LLM (<1ms, $0 cost)

services:
  agent-booster:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyra-agent-booster
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - LOG_LEVEL=info
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - nyra-core
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.nyra.service=agent-booster"
      - "com.nyra.tier=1"
      - "com.nyra.routing=pattern-matching"

networks:
  nyra-core:
    external: true
  nyra-orchestrator:
    external: true
