# Docker Compose - Orchestrator Node (PC1)
# Central coordination, routing, monitoring, and management services

services:
  # ArchGW Router - Intelligent Request Routing
  archgw-router:
    image: nyra/archgw-router:latest
    container_name: nyra-archgw-router
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - ORCHESTRATOR_MODE=true
      - WORKER_DISCOVERY=true
      - HEALTH_CHECK_INTERVAL=30
      - ROUTING_STRATEGY=intelligent
    volumes:
      - ../configs/orchestrator-config.yaml:/app/config.yaml:ro
      - router-data:/app/data
    networks:
      - nyra-orchestrator
      - nyra-core
      - nyra-mcp
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Observability Stack - Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    volumes:
      - ../configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    networks:
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Grafana - Monitoring Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource,prometheus
      - GF_SERVER_ROOT_URL=http://${LAN_IP}:3005
    volumes:
      - ../configs/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ../configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks:
      - nyra-orchestrator
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Loki - Log Aggregation
  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/config.yml
    volumes:
      - ../configs/loki.yml:/etc/loki/config.yml:ro
      - loki-data:/loki
    networks:
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Alertmanager - Alert Management
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nyra-alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    volumes:
      - ../configs/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager-data:/alertmanager
    networks:
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Wake-on-LAN Service - Worker Management
  wake-on-lan:
    image: nyra/wake-on-lan:latest
    container_name: nyra-wol
    restart: unless-stopped
    network_mode: host
    environment:
      - WOL_CONFIG_PATH=/app/config.yaml
      - LOG_LEVEL=INFO
    volumes:
      - ../configs/orchestrator-config.yaml:/app/config.yaml:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 60s
      timeout: 10s
      retries: 3

  # Performance Monitor & Auto-scaler
  perf-monitor:
    image: nyra/performance-monitor:latest
    container_name: nyra-perf-monitor
    restart: unless-stopped
    ports:
      - "8090:8090"
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - REDIS_URL=redis://redis:6379
      - AUTO_SCALING_ENABLED=true
    volumes:
      - ../configs/orchestrator-config.yaml:/app/config.yaml:ro
      - monitor-data:/app/data
    networks:
      - nyra-orchestrator
      - nyra-core
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Cache Manager
  model-cache:
    image: nyra/model-cache:latest
    container_name: nyra-model-cache
    restart: unless-stopped
    ports:
      - "8091:8091"
    environment:
      - CACHE_SIZE_GB=10
      - REDIS_URL=redis://redis:6379
      - CLEANUP_INTERVAL=3600
    volumes:
      - model-cache-data:/app/cache
      - ../configs/orchestrator-config.yaml:/app/config.yaml:ro
    networks:
      - nyra-orchestrator
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8091/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflared Tunnel - External Access
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared-orchestrator
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    volumes:
      - ../configs/cloudflared-orchestrator.yaml:/etc/cloudflared/config.yaml:ro
    command: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run", "nyra-orchestrator-tunnel"]
    networks:
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "nyra-orchestrator-tunnel"]
      interval: 60s
      timeout: 30s
      retries: 3

networks:
  nyra-orchestrator:
    name: nyra-orchestrator
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  nyra-core:
    external: true
  nyra-mcp:
    external: true

volumes:
  router-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local
  loki-data:
    driver: local
  alertmanager-data:
    driver: local
  monitor-data:
    driver: local
  model-cache-data:
    driver: local
