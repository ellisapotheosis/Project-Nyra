version: '3.9'

networks:
  nyra-network:
    driver: bridge
  observability:
    driver: bridge
  databases:
    driver: bridge

volumes:
  letta_postgres_data:
  twenty_postgres_data:
  dify_postgres_data:
  neo4j_data:
  neo4j_logs:
  redis_data:
  mem0_data:
  prometheus_data:
  grafana_data:
  loki_data:
  n8n_data:

services:
  # ============================================================================
  # INFRASTRUCTURE LAYER - Gateway & Routing
  # ============================================================================

  nexus:
    image: grafbase/nexus:latest
    container_name: nyra-nexus
    ports:
      - "6000:6000"
    volumes:
      - ../../configs/nexus/nexus.toml:/app/config/nexus.toml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: nyra-litellm
    ports:
      - "4000:4000"
    volumes:
      - ../../configs/litellm/config.yaml:/app/config.yaml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      - nyra-network
    depends_on:
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nyra-network
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # DATABASE LAYER - PostgreSQL Instances
  # ============================================================================

  letta_postgres:
    image: ankane/pgvector:latest
    container_name: nyra-letta-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${LETTA_POSTGRES_PASSWORD}
      - POSTGRES_DB=letta
    volumes:
      - letta_postgres_data:/var/lib/postgresql/data
    networks:
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U letta"]
      interval: 10s
      timeout: 5s
      retries: 5

  twenty_postgres:
    image: postgres:15-alpine
    container_name: nyra-twenty-postgres
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=twenty
      - POSTGRES_PASSWORD=${TWENTY_POSTGRES_PASSWORD}
      - POSTGRES_DB=twenty
    volumes:
      - twenty_postgres_data:/var/lib/postgresql/data
    networks:
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty"]
      interval: 10s
      timeout: 5s
      retries: 5

  dify_postgres:
    image: postgres:15-alpine
    container_name: nyra-dify-postgres
    ports:
      - "5434:5432"
    environment:
      - POSTGRES_USER=dify
      - POSTGRES_PASSWORD=${DIFY_POSTGRES_PASSWORD}
      - POSTGRES_DB=dify
    volumes:
      - dify_postgres_data:/var/lib/postgresql/data
    networks:
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # GRAPH DATABASES
  # ============================================================================

  neo4j:
    image: neo4j:5-community
    container_name: nyra-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_memory_heap_max__size=2G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    ports:
      - "6380:6379"
    volumes:
      - redis_data:/data
    networks:
      - databases
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # MEMORY SERVICES
  # ============================================================================

  letta:
    image: letta/letta:latest
    container_name: nyra-letta
    ports:
      - "8283:8283"
    environment:
      - LETTA_POSTGRES_HOST=letta_postgres
      - LETTA_POSTGRES_PORT=5432
      - LETTA_POSTGRES_USER=letta
      - LETTA_POSTGRES_PASSWORD=${LETTA_POSTGRES_PASSWORD}
      - LETTA_POSTGRES_DB=letta
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - nyra-network
      - databases
    depends_on:
      letta_postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mem0:
    build:
      context: ../../services/mem0-rest
      dockerfile: Dockerfile
    container_name: nyra-mem0
    ports:
      - "4321:4321"
    volumes:
      - mem0_data:/data
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:4321/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # BUSINESS SERVICES
  # ============================================================================

  quote_engine:
    build:
      context: ../../services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-quote-engine
    ports:
      - "8001:8001"
    environment:
      - NEXUS_URL=http://nexus:6000
      - LITELLM_URL=http://litellm:4000
      - MEM0_URL=http://mem0:4321
    networks:
      - nyra-network
    depends_on:
      - nexus
      - mem0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  campaign_engine:
    build:
      context: ../../services/campaign-engine
      dockerfile: Dockerfile
    container_name: nyra-campaign-engine
    ports:
      - "8002:8002"
    environment:
      - NEXUS_URL=http://nexus:6000
      - N8N_URL=http://n8n:5678
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
      - TWILIO_PHONE_NUMBER=${TWILIO_PHONE_NUMBER}
    networks:
      - nyra-network
    depends_on:
      - nexus
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  nyra_orchestrator:
    build:
      context: ../../services/nyra-orchestrator
      dockerfile: Dockerfile
    container_name: nyra-orchestrator
    ports:
      - "8010:8010"
    environment:
      - NEXUS_URL=http://nexus:6000
      - QUOTE_ENGINE_URL=http://quote_engine:8001
      - CAMPAIGN_ENGINE_URL=http://campaign_engine:8002
      - LETTA_URL=http://letta:8283
      - MEM0_URL=http://mem0:4321
      - TWENTY_CRM_URL=http://twenty_crm:3000
    networks:
      - nyra-network
    depends_on:
      - nexus
      - quote_engine
      - campaign_engine
      - letta
      - mem0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # WORKFLOW AUTOMATION
  # ============================================================================

  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678/
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  dify_api:
    image: langgenius/dify-api:latest
    container_name: nyra-dify-api
    ports:
      - "5001:5001"
    environment:
      - MODE=api
      - LOG_LEVEL=INFO
      - SECRET_KEY=${DIFY_SECRET_KEY}
      - DB_USERNAME=dify
      - DB_PASSWORD=${DIFY_POSTGRES_PASSWORD}
      - DB_HOST=dify_postgres
      - DB_PORT=5432
      - DB_DATABASE=dify
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      - nyra-network
      - databases
    depends_on:
      dify_postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  dify:
    image: langgenius/dify-web:latest
    container_name: nyra-dify
    ports:
      - "3001:3000"
    environment:
      - CONSOLE_API_URL=http://dify_api:5001
      - APP_API_URL=http://dify_api:5001
    networks:
      - nyra-network
    depends_on:
      - dify_api
    restart: unless-stopped

  twenty_crm:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-crm
    ports:
      - "3000:3000"
    environment:
      - PG_DATABASE_URL=postgres://twenty:${TWENTY_POSTGRES_PASSWORD}@twenty_postgres:5432/twenty
      - SERVER_URL=http://localhost:3000
      - FRONT_BASE_URL=http://localhost:3000
    networks:
      - nyra-network
      - databases
    depends_on:
      twenty_postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # OBSERVABILITY STACK
  # ============================================================================

  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ../../configs/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'
      - '--web.enable-lifecycle'
    networks:
      - nyra-network
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=grafana-piechart-panel
      - GF_SERVER_ROOT_URL=http://localhost:3005
    volumes:
      - grafana_data:/var/lib/grafana
    networks:
      - observability
    depends_on:
      - prometheus
      - loki
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    ports:
      - "3100:3100"
    volumes:
      - ../../configs/observability/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - observability
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  alertmanager:
    image: prom/alertmanager:latest
    container_name: nyra-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ../../configs/observability/alertmanager.yml:/etc/alertmanager/config.yml:ro
    command:
      - '--config.file=/etc/alertmanager/config.yml'
      - '--storage.path=/alertmanager'
    networks:
      - observability
    depends_on:
      - n8n
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # FRONTEND APPLICATIONS
  # ============================================================================

  ratehunter:
    build:
      context: ../../apps/ratehunter
      dockerfile: Dockerfile
    container_name: nyra-ratehunter
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - QUOTE_ENGINE_URL=http://quote-engine:8001
      - CAMPAIGN_ENGINE_URL=http://campaign-engine:8002
    networks:
      - nyra-network
    depends_on:
      quote-engine:
        condition: service_healthy
      campaign-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nyra-admin:
    build:
      context: ../../apps/nyra-admin
      dockerfile: Dockerfile
    container_name: nyra-admin
    ports:
      - "3001:80"
    environment:
      - NODE_ENV=production
    networks:
      - nyra-network
    depends_on:
      orchestrator:
        condition: service_healthy
      quote-engine:
        condition: service_healthy
      campaign-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
