version: '3.8'

services:
  vllm:
    image: vllm/vllm-openai:latest
    container_name: nyra-vllm-3090ti
    ports:
      - '8080:8000'
    environment:
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - ./models:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    command: >
      --model meta-llama/Llama-3.1-13B-Instruct
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --dtype auto
    restart: unless-stopped

  lmcache:
    image: lmcache/lmcache:latest
    container_name: nyra-lmcache-3090ti
    ports:
      - '8081:8000'
    environment:
      - VLLM_HOST=http://vllm:8000
    depends_on:
      - vllm
    restart: unless-stopped

  worker-agent:
    image: node:20-alpine
    container_name: nyra-worker-3090ti
    ports:
      - '8000:8000'
    environment:
      - WORKER_NAME=worker-rtx3090ti
      - WORKER_TYPE=vllm
      - VLLM_HOST=http://vllm:8000
      - ORCHESTRATOR_IP=100.87.235.78
      - TAILSCALE_IP=${TAILSCALE_IP}
    volumes:
      - ./agent:/app
    working_dir: /app
    command: sh -c "npm install 2>/dev/null; npm start || node server.js"
    depends_on:
      - vllm
    restart: unless-stopped

  gpu-metrics:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: nyra-gpu-metrics-3090ti
    ports:
      - '9835:9835'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  models:
