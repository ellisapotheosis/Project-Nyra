# Docker Compose - Core Infrastructure Services
# PostgreSQL, Redis, MongoDB, RabbitMQ, Nexus Router, etc.

services:
  # Nexus Router - Central MCP Proxy Aggregator & LLM Routing Hub
  nexus-router:
    build:
      context: ../build/services/nexus-router
      dockerfile: Dockerfile
      args:
        NEXUS_VERSION: latest
    container_name: nyra-nexus-router
    restart: unless-stopped
    ports:
      - "6000:6000"   # HTTP API
      - "8000:8000"   # gRPC
    environment:
      # Authentication
      - NEXUS_JWT_SECRET=${NEXUS_JWT_SECRET}
      - NEXUS_ADMIN_TOKEN=${NEXUS_ADMIN_TOKEN}

      # LLM Provider API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}

      # Database & Cache
      - POSTGRES_USER=${POSTGRES_USER:-nyra}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/nyra
      - REDIS_PASSWORD=${REDIS_PASSWORD}

      # Logging & Debug
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DEBUG=${DEBUG:-false}

      # Infisical Integration
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
    volumes:
      - ../config/nexus-router.yaml:/app/config/nexus-router.yaml:ro
      - nexus-router-logs:/var/log/nexus
      - nexus-router-data:/app/data
    networks:
      - nyra-core
      - nyra-mcp
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G

  # PostgreSQL - Primary Database
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyra-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=nyra
      - POSTGRES_USER=nyra
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - nyra-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis - Cache and Message Broker
  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_default_pass}
    volumes:
      - redis-data:/data
    networks:
      - nyra-core
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_default_pass}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Qdrant - Vector Database
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # FalkorDB - Graph Database
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    ports:
      - "6380:6379"  # Changed to avoid conflict with Redis
    volumes:
      - falkordb-data:/data
    networks:
      - nyra-core
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Neo4j - Advanced Graph Database
  neo4j:
    image: neo4j:5
    container_name: nyra-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD}
      - NEO4J_PLUGINS=["graph-data-science", "apoc"]
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
    volumes:
      - neo4j-data:/data
    networks:
      - nyra-core
    healthcheck:
      test: ["CMD", "neo4j", "status"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nyra-core:
    name: nyra-core
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
  nyra-mcp:
    name: nyra-mcp
    external: true

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  qdrant-data:
    driver: local
  falkordb-data:
    driver: local
  neo4j-data:
    driver: local
  nexus-router-data:
    driver: local
  nexus-router-logs:
    driver: local
