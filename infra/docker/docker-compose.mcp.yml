# Docker Compose - MCP Servers Production Environment
# Project Nyra - Production MCP Server Stack
version: '3.8'

services:
  # MCP Gemini Assistant
  mcp-gemini:
    build:
      context: ../../bootstrap/mcp-gemini-assistant
      dockerfile: Dockerfile
    container_name: nyra-mcp-gemini
    environment:
      - GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
      - GEMINI_MODEL=gemini-2.0-flash-exp
      - SESSION_TIMEOUT=3600
      - MAX_FILE_SIZE=1048576
      - LOG_LEVEL=info
    volumes:
      # Persistent session data
      - mcp-gemini-sessions:/app/data/sessions
      # Production logs
      - /var/log/nyra/mcp-gemini:/app/logs
    networks:
      - mcp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "python", "-c", "import sys; sys.exit(0)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.project-nyra.service=mcp-gemini"
      - "com.project-nyra.environment=production"
      - "com.project-nyra.version=1.0.0"

  # Claude Flow MCP Server
  mcp-claude-flow:
    build:
      context: ../../bootstrap/mcp-servers/claude-flow
      dockerfile: Dockerfile
    container_name: nyra-mcp-claude-flow
    environment:
      - CLAUDE_FLOW_MEMORY=true
      - CLAUDE_FLOW_DISTRIBUTED=true
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      # Persistent memory and session data
      - mcp-claude-flow-data:/app/data
      # Production logs
      - /var/log/nyra/mcp-claude-flow:/app/logs
      # Claude Flow configuration (read-only)
      - ../../.claude-flow:/app/.claude-flow:ro
    networks:
      - mcp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "npx", "@rUv/claude-flow@alpha", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.project-nyra.service=mcp-claude-flow"
      - "com.project-nyra.environment=production"
      - "com.project-nyra.version=2.0.0"

  # RuV Swarm MCP Server
  mcp-ruv-swarm:
    build:
      context: ../../bootstrap/mcp-servers/ruv-swarm
      dockerfile: Dockerfile
    container_name: nyra-mcp-ruv-swarm
    environment:
      - RUV_SWARM_DISTRIBUTED=true
      - NODE_ENV=production
      - LOG_LEVEL=info
    volumes:
      # Persistent swarm data
      - mcp-ruv-swarm-data:/app/data
      # Production logs
      - /var/log/nyra/mcp-ruv-swarm:/app/logs
      # Swarm configuration (read-only)
      - ../../.swarm:/app/.swarm:ro
    networks:
      - mcp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "npx", "@rUv/ruv-swarm@latest", "health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.project-nyra.service=mcp-ruv-swarm"
      - "com.project-nyra.environment=production"
      - "com.project-nyra.version=1.0.0"

  # Archon OS MCP Server
  mcp-archon:
    build:
      context: ../../bootstrap/archon-os
      dockerfile: Dockerfile.mcp
    container_name: nyra-mcp-archon
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MCP_PORT=8051
      - LOG_LEVEL=info
    volumes:
      # Persistent knowledge base cache
      - mcp-archon-data:/app/data
      # Production logs
      - /var/log/nyra/mcp-archon:/app/logs
    ports:
      - "8051:8051"
    networks:
      - mcp-network
    restart: always
    depends_on:
      postgres-mcp:
        condition: service_healthy
      redis-mcp:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2G
        reservations:
          cpus: '1.0'
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "com.project-nyra.service=mcp-archon"
      - "com.project-nyra.environment=production"
      - "com.project-nyra.version=1.0.0"

  # PostgreSQL for MCP data (production)
  postgres-mcp:
    image: postgres:15-alpine
    container_name: nyra-postgres-mcp
    environment:
      - POSTGRES_DB=${MCP_DB_NAME:-mcp_production}
      - POSTGRES_USER=${MCP_DB_USER:-mcp_prod}
      - POSTGRES_PASSWORD=${MCP_DB_PASSWORD}
    volumes:
      - postgres-mcp-data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d:ro
      - /var/log/nyra/postgres-mcp:/var/log/postgresql
    networks:
      - mcp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${MCP_DB_USER:-mcp_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.project-nyra.service=postgres-mcp"
      - "com.project-nyra.environment=production"

  # Redis for MCP caching (production)
  redis-mcp:
    image: redis:7-alpine
    container_name: nyra-redis-mcp
    command: redis-server --appendonly yes --requirepass ${MCP_REDIS_PASSWORD}
    volumes:
      - redis-mcp-data:/data
      - ./redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - mcp-network
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    labels:
      - "com.project-nyra.service=redis-mcp"
      - "com.project-nyra.environment=production"

  # Nginx reverse proxy for MCP servers (optional)
  nginx-mcp:
    image: nginx:alpine
    container_name: nyra-nginx-mcp
    volumes:
      - ./nginx/mcp.conf:/etc/nginx/conf.d/default.conf:ro
      - /var/log/nyra/nginx-mcp:/var/log/nginx
    ports:
      - "8050:80"
    networks:
      - mcp-network
    restart: always
    depends_on:
      - mcp-archon
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.project-nyra.service=nginx-mcp"
      - "com.project-nyra.environment=production"

networks:
  mcp-network:
    name: nyra-mcp-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  mcp-gemini-sessions:
    name: nyra-mcp-gemini-sessions
    driver: local
  mcp-claude-flow-data:
    name: nyra-mcp-claude-flow-data
    driver: local
  mcp-ruv-swarm-data:
    name: nyra-mcp-ruv-swarm-data
    driver: local
  mcp-archon-data:
    name: nyra-mcp-archon-data
    driver: local
  postgres-mcp-data:
    name: nyra-postgres-mcp-data
    driver: local
  redis-mcp-data:
    name: nyra-redis-mcp-data
    driver: local
