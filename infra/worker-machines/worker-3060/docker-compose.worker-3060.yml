version: '3.9'

services:
  # ============================================================================
  # Ollama Service (GPU-enabled)
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: worker-3060-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=3
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - worker-network

  # ============================================================================
  # ONNX Runtime Service (GPU-accelerated embeddings)
  # ============================================================================
  onnx-runtime:
    image: mcr.microsoft.com/onnxruntime/server:latest-cuda12
    container_name: worker-3060-onnx
    restart: unless-stopped
    ports:
      - "8001:8001"
      - "8002:8002"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - ORT_CUDA_PROVIDER=1
      - ORT_LOGGING_LEVEL=WARNING
    volumes:
      - ./onnx-models:/models
      - onnx-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/v2/health/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Embedding Service (Xenova/transformers)
  # ============================================================================
  embedding-service:
    build:
      context: ./embedding-service
      dockerfile: Dockerfile
    container_name: worker-3060-embeddings
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - EMBEDDING_MODEL=Xenova/all-MiniLM-L6-v2
      - EMBEDDING_DEVICE=cuda
      - BATCH_SIZE=32
      - MAX_SEQUENCE_LENGTH=512
      - CACHE_DIR=/cache
    volumes:
      - embedding-cache:/cache
      - ./embedding-service:/app
    depends_on:
      - onnx-runtime
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Health Monitor Service
  # ============================================================================
  health-monitor:
    build:
      context: ./health-monitor
      dockerfile: Dockerfile
    container_name: worker-3060-health
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - WORKER_NAME=worker-3060
      - OLLAMA_URL=http://ollama:11434
      - ONNX_URL=http://onnx-runtime:8001
      - EMBEDDING_URL=http://embedding-service:8080
      - CHECK_INTERVAL=60
      - PROMETHEUS_ENABLED=true
    volumes:
      - ./health-monitor:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - ollama
      - onnx-runtime
      - embedding-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Redis Cache (for inference caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: worker-3060-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Prometheus Node Exporter (System metrics)
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-3060-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  # ============================================================================
  # NVIDIA GPU Exporter (GPU metrics for Prometheus)
  # ============================================================================
  gpu-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:latest
    container_name: worker-3060-gpu-exporter
    restart: unless-stopped
    ports:
      - "9445:9445"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

volumes:
  ollama-data:
    driver: local
  onnx-cache:
    driver: local
  embedding-cache:
    driver: local
  redis-data:
    driver: local

networks:
  worker-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
