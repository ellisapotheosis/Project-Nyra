version: '3.8'

services:
  # ==============================================================================
  # LOCAL SUPABASE STACK (Replaces Cloud Supabase)
  # ==============================================================================
  
  # PostgreSQL Database (Supabase backend)
  postgres:
    image: supabase/postgres:15.1.0.117
    container_name: archon-postgres
    ports:
      - "5433:5432"  # Non-conflicting port
    environment:
      POSTGRES_DB: archon_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      POSTGRES_HOST_AUTH_METHOD: "trust"
    volumes:
      - archon-postgres-data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    networks:
      - archon-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supabase Kong API Gateway
  kong:
    image: kong:3.1
    container_name: archon-kong
    ports:
      - "8001:8001"  # Admin API
      - "8444:8444"  # Admin API SSL
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /var/lib/kong/kong.yml
      KONG_PROXY_ACCESS_LOG: /dev/stdout
      KONG_ADMIN_ACCESS_LOG: /dev/stdout
      KONG_PROXY_ERROR_LOG: /dev/stderr
      KONG_ADMIN_ERROR_LOG: /dev/stderr
      KONG_ADMIN_LISTEN: 0.0.0.0:8001
    volumes:
      - ./kong.yml:/var/lib/kong/kong.yml:ro
    networks:
      - archon-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supabase Auth (GoTrue)
  auth:
    image: supabase/gotrue:v2.99.0
    container_name: archon-auth
    ports:
      - "9999:9999"
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      GOTRUE_SITE_URL: http://localhost:3737
      GOTRUE_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_EXTERNAL_EMAIL_ENABLED: true
      GOTRUE_MAILER_AUTOCONFIRM: true
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-smtp.example.com}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-admin@example.com}
    networks:
      - archon-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supabase Realtime
  realtime:
    image: supabase/realtime:v2.25.35
    container_name: archon-realtime
    ports:
      - "4000:4000"
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: postgres
      DB_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_password}
      DB_NAME: archon_db
      DB_SSL: "false"
      PORT: 4000
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      REPLICATION_MODE: RLS
      REPLICATION_POLL_INTERVAL: 300
      SECURE_CHANNELS: "true"
      SLOT_NAME: supabase_realtime_rls
      TEMPORARY_SLOT: "true"
    networks:
      - archon-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Supabase Storage
  storage:
    image: supabase/storage-api:v0.43.11
    container_name: archon-storage
    ports:
      - "5001:5000"
    environment:
      ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SERVICE_KEY: ${SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      POSTGREST_URL: http://rest:3000
      PGRST_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      FILE_SIZE_LIMIT: 52428800
      STORAGE_BACKEND: file
      FILE_STORAGE_BACKEND_PATH: /var/lib/storage
      TENANT_ID: stub
      REGION: stub
      GLOBAL_S3_BUCKET: stub
    volumes:
      - archon-storage-data:/var/lib/storage
    networks:
      - archon-network
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # Supabase REST API (PostgREST)
  rest:
    image: postgrest/postgrest:v11.2.2
    container_name: archon-rest
    ports:
      - "3001:3000"
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      PGRST_DB_SCHEMAS: public,storage
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      PGRST_DB_USE_LEGACY_GUCS: "false"
    networks:
      - archon-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ==============================================================================
  # ARCHON OS COMPONENTS
  # ==============================================================================

  # Archon Server (Main Backend)
  archon-server:
    image: archonos/archon-server:latest
    container_name: archon-server
    ports:
      - "8181:8181"
    environment:
      PORT: 8181
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      SUPABASE_URL: http://kong:8000
      SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      SUPABASE_SERVICE_KEY: ${SERVICE_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU}
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-token-with-at-least-32-characters}
      NODE_ENV: development
      LOG_LEVEL: debug
    networks:
      - archon-network
    depends_on:
      postgres:
        condition: service_healthy
      rest:
        condition: service_healthy
    volumes:
      - archon-server-data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8181/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Archon MCP Server
  archon-mcp:
    image: archonos/archon-mcp:latest
    container_name: archon-mcp
    ports:
      - "8051:8051"
    environment:
      PORT: 8051
      ARCHON_SERVER_URL: http://archon-server:8181
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      LOG_LEVEL: debug
    networks:
      - archon-network
    depends_on:
      archon-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8051/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Archon UI (Web Interface)
  archon-ui:
    image: archonos/archon-ui:latest
    container_name: archon-ui
    ports:
      - "3737:3737"
    environment:
      PORT: 3737
      NEXT_PUBLIC_ARCHON_SERVER_URL: http://localhost:8181
      NEXT_PUBLIC_SUPABASE_URL: http://localhost:8001
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${ANON_KEY:-eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0}
      NODE_ENV: development
    networks:
      - archon-network
    depends_on:
      archon-server:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3737"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # Archon Worker (Background Jobs)
  archon-worker:
    image: archonos/archon-worker:latest
    container_name: archon-worker
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD:-postgres_secure_password}@postgres:5432/archon_db
      ARCHON_SERVER_URL: http://archon-server:8181
      WORKER_CONCURRENCY: 5
      LOG_LEVEL: debug
    networks:
      - archon-network
    depends_on:
      archon-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  archon-postgres-data:
    driver: local
  archon-storage-data:
    driver: local
  archon-server-data:
    driver: local

networks:
  archon-network:
    driver: bridge
