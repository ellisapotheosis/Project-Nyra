version: '3.8'

services:
  db:
    image: supabase/postgres:15.1.1.78
    container_name: ${COMPOSE_PROJECT_NAME:-supabase}-db
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "54322:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
    networks:
      - nyra
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  kong:
    image: kong:2.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-supabase}-kong
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    volumes:
      - ./configs/supabase/kong.yml:/etc/kong/kong.yml:ro
    ports:
      - "8000:8000"
    networks:
      - nyra
    depends_on:
      - db

  rest:
    image: postgrest/postgrest:v10.1.1
    container_name: ${COMPOSE_PROJECT_NAME:-supabase}-rest
    environment:
      PGRST_DB_URI: postgres://postgres:${POSTGRES_PASSWORD:-postgres}@db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
    networks:
      - nyra
    depends_on:
      - db

networks:
  nyra:
    external: true

volumes:
  supabase_db_data:
