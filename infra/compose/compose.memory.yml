version: "3.9"
services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-nyra}
      POSTGRES_PASSWORD: ${PGPASSWORD:-nyra_pass}
      POSTGRES_DB: ${PGDATABASE:-nyra_db}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "redisdata:/data" ]
    ports: [ "6379:6379" ]
  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    ports: [ "6333:6333", "6334:6334" ]
    volumes: [ "qdrantdata:/qdrant/storage" ]
volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
