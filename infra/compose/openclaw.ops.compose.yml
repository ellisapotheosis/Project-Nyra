services:
  openclaw-ops:
    image: ${OPENCLAW_MVP_IMAGE:-nyra/openclaw-mvp:local}
    container_name: nyra-openclaw-ops
    profiles: ["openclaw-ops"]
    environment:
      OPENCLAW_CONFIG_FILE: /etc/openclaw/openclaw.json
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      NEXUS_MCP_URL: ${NEXUS_MCP_URL:-http://nexus-router:8080/mcp}
      OPENCLAW_WEBHOOK_INGRESS_PATH: ${OPENCLAW_WEBHOOK_INGRESS_PATH:-/webhooks/openclaw/inbound}
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN:-}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      N8N_API_KEY: ${N8N_API_KEY:-}
      ACTIVEPIECES_API_KEY: ${ACTIVEPIECES_API_KEY:-}
    volumes:
      - ./openclaw/openclaw.json:/etc/openclaw/openclaw.json:ro
      - ./data/openclaw/mvp:/home/node/.openclaw
      - ./data/openclaw/sessions:/home/node/.openclaw/sessions
    restart: unless-stopped
    networks: [nyra]
