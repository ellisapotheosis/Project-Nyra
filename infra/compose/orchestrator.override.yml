services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    profiles: ["orchestrator"]
    ports:
      - "127.0.0.1:${LITELLM_HOST_PORT:-4000}:4000"
  nexus-router:
    image: ghcr.io/project-nexus/router:latest
    profiles: ["orchestrator"]
    ports:
      - "127.0.0.1:${NEXUS_HOST_PORT:-3010}:3010"
