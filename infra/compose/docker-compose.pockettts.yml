services:
  pockettts:
    build:
      context: ../../services/pockettts
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-pockettts
    ports:
      - "8881:8000"  # OpenAI API mapped to 8881
    environment:
      - POCKET_TTS_MODEL_ID=b6369a24
      - DEVICE=cpu
      - TZ=UTC
      - PYTHONUNBUFFERED=1
    volumes:
      - ../../data/pockettts/pocket_tts_cache:/root/.cache/pocket_tts # Official cache path
      - ../../data/pockettts/hf_cache:/root/.cache/huggingface       # Official HF path
      - ../../data/pockettts/voices:/app/voices                     # Voice clones
    deploy:
      resources:
        limits:
          memory: 4G
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  default:
    name: nyra-network
    external: true
