name: nyra-archon

x-logging: &default_logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  nyra:
    name: nyra
    driver: bridge

volumes:
  archon_data: {}
  postgres_data: {}
  litellm_data: {}
  caddy_data: {}
  caddy_config: {}

services:
  # Unified Archon OS App (Server + UI)
  archon:
    build:
      context: ../../external/archon
      dockerfile: Dockerfile
    container_name: nyra-archon-os
    profiles: ['archon', 'all']
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
    env_file:
      - ../../external/archon/nyra-configs/env/archon.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
      CODEX_PATH: /usr/local/bin/llxprt
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      GH_TOKEN: ${GITHUB_TOKEN:-}
      NEXUS_ROUTER_URL: http://nexus-router:4000
      OPENAI_BASE_URL: http://nexus-router:4000/v1
      ARCHON_DATA: /.archon
      NODE_ENV: production
      ARCHON_DOCKER: "true"
    ports:
      - '${ARCHON_UI_PORT:-3737}:3000'
    volumes:
      - archon_data:/.archon
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/bin/llxprt:/usr/local/bin/llxprt:ro
      - ${HOME}/.config/llxprt:/home/appuser/.config/llxprt:ro
      - ${HOME}/.codex:/home/appuser/.codex:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    dns:
      - 8.8.8.8
      - 8.8.4.4
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1

  # Caddy reverse proxy with automatic HTTPS (optional: --profile cloud)
  caddy:
    image: caddy:2-alpine
    container_name: nyra-archon-caddy
    profiles: ["cloud"]
    restart: unless-stopped
    env_file:
      - ../../external/archon/nyra-configs/env/archon.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ../../external/archon/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [nyra]
    depends_on:
      archon:
        condition: service_healthy

  # Auth service — form-based login for Caddy (optional: --profile auth)
  auth-service:
    build:
      context: ../../external/archon/auth-service
    container_name: nyra-archon-auth
    profiles: ["auth"]
    restart: unless-stopped
    env_file:
      - ../../external/archon/nyra-configs/env/archon.env
    environment:
      AUTH_PORT: "${AUTH_SERVICE_PORT:-9000}"
    expose:
      - "${AUTH_SERVICE_PORT:-9000}"
    networks: [nyra]

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-archon-litellm
    profiles: ['archon', 'all']
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
    volumes:
      - ../configs/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  nexus-router:
    build:
      context: ../..
      dockerfile: infra/images/nexus-router/Dockerfile
    container_name: nyra-archon-nexus-router
    profiles: ['archon', 'all']
    env_file:
      - ../../external/archon/nyra-configs/env/archon.env
    ports:
      - '4000:4000'
      - '8081:8081'

    volumes:
      - ../configs/nexus/nexus.toml:/app/nexus.toml:ro
    environment:
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379/0
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - MEMPALACE_URL=${MEMPALACE_URL}
      - NEXUS_CONFIG_PATH=/app/nexus.toml
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4000/health']
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging
