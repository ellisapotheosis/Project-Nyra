services:
  openclaw-gateway:
    image: ${OPENCLAW_GATEWAY_IMAGE:-ghcr.io/openclaw/openclaw-gateway:latest}
    container_name: nyra-openclaw-gateway
    profiles: ['openclaw', 'apps', 'oracle', 'all']
    environment:
      OPENCLAW_GATEWAY_HOST: 0.0.0.0
      OPENCLAW_GATEWAY_PORT: ${OPENCLAW_GATEWAY_PORT:-3400}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:?set OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_MODEL_PROVIDER: openai-compatible
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENCLAW_MCP_ENDPOINT: http://nexus-router:8080/mcp
      OPENCLAW_MCP_FALLBACK_ENDPOINT: http://nyra-mcp:3333/mcp
      OPENCLAW_SANDBOX_ENABLED: ${OPENCLAW_SANDBOX_ENABLED:-true}
      OPENCLAW_CHANNEL: ${OPENCLAW_CHANNEL:-borrower-web}
      OPENCLAW_SYSTEM_SOUL: ${OPENCLAW_SYSTEM_SOUL:-/workspace/apps/landing/ratehunter-landing/SOUL.BORROWER.md}
      OPENCLAW_PLUGIN_MEM0: ${OPENCLAW_PLUGIN_MEM0:-@mem0/openclaw-mem0}
      MEM0_BASE_URL: ${MEM0_BASE_URL:-http://mem0:4321}
      MEM0_GRAPH_STORE: ${MEM0_GRAPH_STORE:-falkordb}
      FALKORDB_URL: ${FALKORDB_URL:-redis://falkordb:6379}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-http://openwebui:8080}
      OPENCLAW_OUTBOUND_HTTP_ALLOWLIST: ${OPENCLAW_OUTBOUND_HTTP_ALLOWLIST:-nexus-router:8080,nyra-mcp:3333,n8n:5678,activepieces:80,twentycrm:3000,litellm:4000}
      OPENCLAW_TOOL_POLICY: ${OPENCLAW_TOOL_POLICY:-deny-by-default}
      OPENCLAW_TOOLS_ALLOW: ${OPENCLAW_TOOLS_ALLOW:-mcp,http_fetch,task}
      OPENCLAW_TOOLS_DENY: ${OPENCLAW_TOOLS_DENY:-shell_exec,host_fs,docker_sock,raw_network_scan}
      OPENCLAW_SECRET_REF_MODE: ${OPENCLAW_SECRET_REF_MODE:-true}
      OPENCLAW_HOME: /home/node/.openclaw
    ports:
      - '${OPENCLAW_PORTS:-127.0.0.1:3400:3400}'
    volumes:
      - ${OPENCLAW_HOME_VOLUME:-./data/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_VOLUME:-./data/openclaw/workspace}:/workspace
    depends_on:
      litellm:
        condition: service_started
      nexus-router:
        condition: service_healthy
      nyra-mcp:
        condition: service_started
    healthcheck:
      test: ['CMD-SHELL', 'wget -q -O- http://localhost:3400/health >/dev/null 2>&1 || wget -q -O- http://localhost:3400/ >/dev/null 2>&1']
      interval: 15s
      timeout: 5s
      retries: 15
    restart: unless-stopped
    networks: [nyra]

  openclaw-cli:
    image: ${OPENCLAW_CLI_IMAGE:-ghcr.io/openclaw/openclaw-cli:latest}
    container_name: nyra-openclaw-cli
    profiles: ['openclaw', 'apps', 'oracle', 'all']
    entrypoint: ['sleep', 'infinity']
    environment:
      OPENCLAW_HOME: /home/node/.openclaw
      OPENCLAW_SECRET_REF_MODE: ${OPENCLAW_SECRET_REF_MODE:-true}
      OPENCLAW_SANDBOX_ENABLED: ${OPENCLAW_SANDBOX_ENABLED:-true}
      OPENCLAW_CHANNEL: ${OPENCLAW_CHANNEL:-broker-console}
      OPENCLAW_PLUGIN_MEM0: ${OPENCLAW_PLUGIN_MEM0:-@mem0/openclaw-mem0}
      OPENAI_BASE_URL: http://litellm:4000/v1
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENCLAW_MCP_ENDPOINT: http://nexus-router:8080/mcp
      MEM0_BASE_URL: ${MEM0_BASE_URL:-http://mem0:4321}
      MEM0_GRAPH_STORE: ${MEM0_GRAPH_STORE:-falkordb}
      FALKORDB_URL: ${FALKORDB_URL:-redis://falkordb:6379}
      OPENWEBUI_BASE_URL: ${OPENWEBUI_BASE_URL:-http://openwebui:8080}
    volumes:
      - ${OPENCLAW_HOME_VOLUME:-./data/openclaw/config}:/home/node/.openclaw
      - ${OPENCLAW_WORKSPACE_VOLUME:-./data/openclaw/workspace}:/workspace
    depends_on:
      openclaw-gateway:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
