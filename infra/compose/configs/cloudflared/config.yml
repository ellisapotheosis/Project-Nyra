# ============================================================================
# Cloudflare Tunnel Configuration
# Project Nyra Orchestrator
# ============================================================================
# This tunnel exposes the orchestrator services to the internet via Cloudflare
# ============================================================================

# Tunnel name (set via environment or Cloudflare dashboard)
tunnel: nyra-orchestrator
credentials-file: /root/.cloudflared/credentials.json

# Ingress rules - route external traffic to internal services
ingress:
  # ============================================================================
  # MCP & API Endpoints
  # ============================================================================
  
  # Nexus Router - Main MCP aggregator (primary entrypoint)
  - hostname: mcp.nyra.dev
    service: http://nexus-router:7000
    originRequest:
      connectTimeout: 30s
      noTLSVerify: false

  # Claude Flow MCP Server
  - hostname: archon-os.nyra.dev
    service: http://archon-os:8003
    originRequest:
      connectTimeout: 30s

  # LiteLLM Proxy (OpenAI-compatible API)
  - hostname: api.nyra.dev
    service: http://litellm:4000
    originRequest:
      connectTimeout: 120s
      
  # ============================================================================
  # Dashboards & UIs
  # ============================================================================
  
  # Claude Flow Dashboard
  - hostname: dashboard.nyra.dev
    service: http://archon-os-dashboard:3003
    originRequest:
      connectTimeout: 10s

  # Claude Flow Events (WebSocket)
  - hostname: events.nyra.dev
    service: http://archon-os-events:3004
    originRequest:
      connectTimeout: 30s
      
  # Grafana
  - hostname: grafana.nyra.dev
    service: http://grafana:3000
    originRequest:
      connectTimeout: 10s

  # ============================================================================
  # Development & CI/CD
  # ============================================================================
  
  # Gitea (if enabled)
  - hostname: git.nyra.dev
    service: http://gitea:3000
    originRequest:
      connectTimeout: 30s

  # ============================================================================
  # WebSocket Endpoints
  # ============================================================================
  
  # Claude Flow Event WebSocket
  - hostname: ws.nyra.dev
    service: ws://archon-os-events:3004
    originRequest:
      connectTimeout: 30s
      httpHostHeader: ws.nyra.dev

  # ============================================================================
  # Catch-all (404)
  # ============================================================================
  - service: http_status:404

# Logging
loglevel: info

# Metrics (optional - expose for Prometheus)
metrics: localhost:2000
