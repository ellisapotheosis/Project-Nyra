version: "3.9"
name: nyra-stack
services:
  postgres:
    image: postgres:16
    profiles: ["memory"]
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PGUSER:-nyra}
      POSTGRES_PASSWORD: ${PGPASSWORD:-nyra_pass}
      POSTGRES_DB: ${PGDATABASE:-nyra_db}
    volumes: [ "pgdata:/var/lib/postgresql/data" ]
    ports: [ "5432:5432" ]
  redis:
    image: redis:7
    profiles: ["memory"]
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [ "redisdata:/data" ]
    ports: [ "6379:6379" ]
  qdrant:
    image: qdrant/qdrant:latest
    profiles: ["memory"]
    restart: unless-stopped
    ports: [ "6333:6333", "6334:6334" ]
    volumes: [ "qdrantdata:/qdrant/storage" ]
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    volumes: [ "owui_data:/app/backend/data" ]
    ports: [ "3000:8080" ]
    depends_on: [ mcpo, pipelines ]
  pipelines:
    image: ghcr.io/open-webui/pipelines:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment: { PORT: 9099 }
    ports: [ "9099:9099" ]
  mcpo:
    image: ghcr.io/open-webui/mcpo:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      MCP_SERVER_COMMAND: "uvx mcp-proxy --transport streamablehttp http://metamcp:12008/metamcp/default/mcp"
      API_ACCESS_TOKEN: ${METAMCP_API_KEY:-changeme}
    ports: [ "3339:3339" ]
  lobechat:
    image: lobehub/lobe-chat:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    ports: [ "3210:3210" ]
  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    ports: [ "3333:3000" ]
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    profiles: ["orchestration"]
    restart: unless-stopped
    env_file: [ "../config/metamcp.env" ]
    ports: [ "12008:12008" ]
    volumes: [ "metamcp_data:/app/data" ]
  n8n:
    image: n8nio/n8n:latest
    profiles: ["orchestration"]
    restart: unless-stopped
    environment:
      N8N_HOST: localhost
      N8N_PORT: 5678
      N8N_PROTOCOL: http
      GENERIC_TIMEZONE: America/Los_Angeles
    volumes: [ "n8n_data:/home/node/.n8n" ]
    ports: [ "5678:5678" ]
  flowise:
    image: flowiseai/flowise:latest
    profiles: ["orchestration"]
    restart: unless-stopped
    environment:
      PORT: 3001
      FLOWISE_USERNAME: admin
      FLOWISE_PASSWORD: admin
      DATABASE_PATH: /root/.flowise
    volumes: [ "flowise_data:/root/.flowise" ]
    ports: [ "3001:3001" ]
  dify:
    image: langgenius/dify:latest
    profiles: ["orchestration"]
    restart: unless-stopped
    env_file: [ "../config/dify.env" ]
    ports: [ "8000:80" ]
volumes:
  pgdata: {}
  redisdata: {}
  qdrantdata: {}
  owui_data: {}
  metamcp_data: {}
  n8n_data: {}
  flowise_data: {}
