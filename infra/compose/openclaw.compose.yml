services:
  openclaw-mvp:
    build:
      context: ..
      dockerfile: infra/openclaw/Dockerfile
    image: ${OPENCLAW_MVP_IMAGE:-nyra/openclaw-mvp:local}
    container_name: nyra-openclaw-mvp
    profiles: ["openclaw"]
    environment:
      OPENCLAW_CONFIG_FILE: /etc/openclaw/openclaw.json
      OPENCLAW_PROVIDER: ${OPENCLAW_PROVIDER:-openai}
      OPENCLAW_OPENAI_BASE_URL: ${OPENCLAW_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
      OPENCLAW_SESSION_PATH: ${OPENCLAW_SESSION_PATH:-/home/node/.openclaw/sessions}
      OPENCLAW_PUBLIC_BASE_URL: ${OPENCLAW_PUBLIC_BASE_URL:-http://localhost:3401}
      NYRA_CHAT_INTERNAL_API_BASE_URL: ${NYRA_CHAT_INTERNAL_API_BASE_URL:-http://nexus-router:7000}
      NEXUS_MCP_URL: ${NEXUS_MCP_URL:-http://nexus-router:8080/mcp}
      OPENCLAW_WEBHOOK_INGRESS_PATH: ${OPENCLAW_WEBHOOK_INGRESS_PATH:-/webhooks/openclaw/inbound}
      OPENCLAW_SANDBOX_ENABLED: ${OPENCLAW_SANDBOX_ENABLED:-true}
      OPENCLAW_TOOL_POLICY: ${OPENCLAW_TOOL_POLICY:-deny-by-default}
      OPENCLAW_HTTP_ALLOWLIST: ${OPENCLAW_HTTP_ALLOWLIST:-nexus-router:8080,n8n:5678,activepieces:80,twentycrm:3000}
    ports:
      - "127.0.0.1:${OPENCLAW_PORT:-3401}:3400"
    volumes:
      - ${OPENCLAW_CONFIG_PATH:-./openclaw/openclaw.json}:/etc/openclaw/openclaw.json:ro
      - ${OPENCLAW_DATA_DIR:-./data/openclaw}:/home/node/.openclaw
    depends_on:
      nexus-router:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:3400/health >/dev/null 2>&1 || wget -q -O- http://localhost:3400/ >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped
    networks: [nyra]
