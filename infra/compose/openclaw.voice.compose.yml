services:
  kyutai-unmute-cloud:
    image: ${UNMUTE_IMAGE:-ghcr.io/kyutai-labs/unmute:latest}
    container_name: nyra-kyutai-unmute-cloud
    profiles: ["voice"]
    environment:
      UNMUTE_OPENAI_API_KEY: ${UNMUTE_OPENAI_API_KEY:?set UNMUTE_OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      UNMUTE_MODEL_PROVIDER: ${UNMUTE_MODEL_PROVIDER:-openai}
      UNMUTE_MODE: cloud
      UNMUTE_PUBLIC_BASE_URL: ${UNMUTE_PUBLIC_BASE_URL:-http://localhost:8098}
    ports:
      - "127.0.0.1:${UNMUTE_HOST_PORT:-8098}:8080"
    restart: unless-stopped
    networks: [nyra]
