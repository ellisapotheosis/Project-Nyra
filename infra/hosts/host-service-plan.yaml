      redis: { port: 6379, category: data, status: running }
      openclaw-gateway: { port: 8001, category: platform, status: unknown }
      # LLM infrastructure
      llxprt-bridge:
        port: 8091
        category: llm-bridge
        status: deployed
        notes: "subscription/* LLMs (claude, gemini, codex) via LLXPRT_BRIDGE_API_KEY"
      llxprt-jefe: { category: llm-client, status: deployed }
      llxprt-code: { category: llm-client, status: deployed }
      bitnet:
        {
          category: llm,
          status: unknown,
          notes: "bitnet.cpp CPU LLM for orchestrator-local inference",
