      # Observability
      prometheus: { port: 9090, category: observability, status: unknown }
      grafana: { port: 3003, category: observability, status: unknown }
      loki: { port: 3100, category: observability, status: unknown }
      # Tunnel
      cloudflared:
        category: tunnel
        status: deployed
        notes: "docker-compose.cloudflared.yml; token via Infisical /machines/orchestrator; tunnel ID ae0bd53a"
      # Persistent (docker-compose.persistent.yml)
      portainer-edge-agent:
        { category: management, status: running, notes: "persistent" }
      syncthing: { category: sync, status: running, notes: "persistent" }
      # PENDING
      power-management-api:
        port: 8765
        category: automation
        status: pending
        priority: HIGH
        notes: >
          FastAPI service for Letta WoL tools (nyra_wake_gpu_worker, nyra_sleep_gpu_worker,
          nyra_cluster_power_status). Implements /wake/{worker}, /sleep/{worker}, /status.
          Calls wakeonlan CLI + SSH sleep. Until deployed, all Letta power management tools timeout.

