# host-service-plan.yaml
# Operational service plan for Project Nyra cluster.
# Source of truth for: per-host service inventory, running status, cloudflared tunnel/subdomain plan.
# Layout spec: infra/hosts/host-layout.yaml
# Cloudflare IaC: infra/cloudflare/desired-state/exposure-matrix.yml
# Last updated: 2026-05-24
#
# Status values:
#   running   — confirmed healthy on latest audit
#   deployed  — compose/config exists; not verified live
#   pending   — not yet deployed; needs action
#   unknown   — host sleeping or not recently audited
#   disabled  — intentionally not running

# ─────────────────────────────────────────────────────────────────────────────
# CLOUDFLARED TUNNELS + SUBDOMAIN ROUTING
# ─────────────────────────────────────────────────────────────────────────────

cloudflared:
  domain: projectnyra.com
  management_mode: api_managed_tunnels_with_docker_connectors
  iac_source: infra/cloudflare/desired-state/exposure-matrix.yml

  tunnels:
    oracle:
      token_env: ORACLE_TUNNEL_TOKEN
      token_id_env: ORACLE_TUNNEL_ID
      infisical_path: /machines/oracle-vps
      known_tunnel_id: "" # set via Cloudflare Zero Trust dashboard; store in Infisical
      compose_service: cloudflared # service in infra/hosts/oracle-vps/docker-compose.yml
      config_source: infra/hosts/oracle-vps/cloudflared-config.yml
      status: deployed # container defined; verify ORACLE_TUNNEL_TOKEN in oracle .env

    orchestrator:
      token_env: ORCHESTRATOR_TUNNEL_TOKEN
      token_id_env: ORCHESTRATOR_TUNNEL_ID
      infisical_path: /machines/orchestrator
      known_tunnel_id: ae0bd53a-f22e-4414-8593-5b765dcd044b
      compose_file: infra/hosts/orchestrator/docker-compose.cloudflared.yml
      config_source: infra/hosts/orchestrator/cloudflared-config.yml
      status: deployed # compose ready; uses Infisical secrets-init + custom wrapper image

  # Each route maps a public hostname to a private service.
  # access policy: public_auth=Cloudflare Access email gate | owner_only=owner email only |
  #                public_service_token=machine-to-machine token | public=no gate
  routes:
    # ── Oracle tunnel ──────────────────────────────────────────────────────
    - hostname: app.projectnyra.com
      tunnel: oracle
      origin: http://webapp:3001
      access: public_auth
      status: pending

    - hostname: api.projectnyra.com
      tunnel: oracle
      origin: http://supabase-kong:8000
      access: public_supabase_gateway
      notes: Do not block Supabase Auth endpoints with interactive Access
      status: pending

    - hostname: hooks.projectnyra.com
      tunnel: oracle
      origin: http://n8n:5678
      access: public_service_token
      notes: Use provider allowlists and signed webhook paths
      status: running

    - hostname: twenty.projectnyra.com
      tunnel: oracle
      origin: http://twenty:3000
      access: public_auth
      status: running

    - hostname: crm.projectnyra.com
      tunnel: oracle
      origin: http://twenty:3000
      access: public_auth
      notes: Alias for twenty.projectnyra.com
      status: running

    - hostname: n8n.projectnyra.com
      tunnel: oracle
      origin: http://n8n:5678
      access: public_auth
      status: running

    - hostname: gitea.projectnyra.com
      tunnel: oracle
      origin: http://gitea:3000
      access: public_auth
      status: running # Gitea confirmed healthy; 3+ hours uptime

    - hostname: activepieces.projectnyra.com
      tunnel: oracle
      origin: http://activepieces:80
      access: public_auth
      status: running

    - hostname: grafana.projectnyra.com
      tunnel: oracle
      origin: http://grafana:3000
      access: public_auth
      status: running

    - hostname: prometheus.projectnyra.com
      tunnel: oracle
      origin: http://prometheus:9090
      access: owner_only_public_auth
      status: running

    - hostname: cadvisor.projectnyra.com
      tunnel: oracle
      origin: http://cadvisor:8080
      access: owner_only_public_auth
      status: running

    - hostname: openwebui.projectnyra.com
      tunnel: oracle
      origin: http://openwebui:8080
      access: public_auth
      status: running

    - hostname: nexus.projectnyra.com
      tunnel: oracle
      origin: http://nexus-ui:3016
      access: public_auth
      notes: Human UI for Nexus router
      status: running # Nexus confirmed healthy; 45+ hours uptime

    - hostname: nexus-router.projectnyra.com
      tunnel: oracle
      origin: http://nexus:3000
      access: public_service_token
      notes: Machine/API entrypoint. Prefer Tailscale internal URL for agent-to-agent traffic.
      status: running

    - hostname: litellm.projectnyra.com
      tunnel: oracle
      origin: http://litellm:4000
      access: owner_only_public_auth
      status: running

    - hostname: gastown.projectnyra.com
      tunnel: oracle
      origin: http://gastown:8080
      access: public_auth
      status: running

    - hostname: clawteam.projectnyra.com
      tunnel: oracle
      origin: http://clawteam:8080
      access: public_auth
      notes: Requires docker-compose.clawteam.yml overlay to be running
      status: unknown

    - hostname: letta.projectnyra.com
      tunnel: oracle
      origin: http://oracle.trex-fiordland.ts.net:8283
      access: public_auth
      status: running # Letta running on oracle port 8283

    - hostname: portainer-oracle.projectnyra.com
      tunnel: oracle
      origin: https://portainer:9443
      access: owner_only_public_auth
      origin_tls_verify: false
      status: running

    - hostname: git-ssh.projectnyra.com
      tunnel: oracle
      origin: ssh://gitea:2222
      access: owner_only_cloudflared_access_ssh
      notes: Optional SSH flow; requires cloudflared access ssh client
      status: configured

    # ── Orchestrator tunnel ────────────────────────────────────────────────
    - hostname: links.projectnyra.com
      tunnel: orchestrator
      origin: http://100.64.0.2:3007
      access: public_auth
      notes: Linkwarden/Starwarden. Origin timed out in smoke test — verify service running.
      status: unknown

    - hostname: linkwarden.projectnyra.com
      tunnel: orchestrator
      origin: http://100.64.0.2:3007
      access: public_auth
      notes: Legacy alias for links.projectnyra.com
      status: unknown

    - hostname: openclaw-gateway.projectnyra.com
      tunnel: orchestrator
      origin: http://nyra-openclaw-gateway:8001
      access: public_auth
      status: unknown

    - hostname: portainer.projectnyra.com
      tunnel: orchestrator
      origin: https://nyra-portainer:9443
      access: owner_only_public_auth
      origin_tls_verify: false
      status: unknown

  mcp_routes:
    policy: nexus_first
    preferred_external_entrypoint: https://nexus-router.projectnyra.com/mcp
    notes: Direct MCP hostnames require service-token auth. Route external agents through Nexus.
    direct_candidates:
      - hostname: openmemory-mcp.projectnyra.com
        origin: http://openmemory-mcp:8765
      - hostname: twenty-mcp.projectnyra.com
        origin: http://twenty-mcp:8400
      - hostname: infisical-mcp.projectnyra.com
        origin: http://infisical-mcp:8766
      - hostname: mempalace-mcp.projectnyra.com
        origin: http://mempalace-mcp:8000
      - hostname: gitea-mcp.projectnyra.com
        origin: http://gitea-mcp:3101
      - hostname: git-mcp.projectnyra.com
        origin: http://git-mcp:8773

  deployment_checklist:
    - "Obtain ORACLE_TUNNEL_TOKEN from Cloudflare Zero Trust → Tunnels → oracle tunnel"
    - "Obtain ORACLE_TUNNEL_ID from same dashboard"
    - "Store ORACLE_TUNNEL_TOKEN + ORACLE_TUNNEL_ID in Infisical at /machines/oracle-vps"
    - "Add ORACLE_TUNNEL_TOKEN to infra/hosts/oracle-vps/.env"
    - "Restart cloudflared on oracle: ssh oracle 'cd ~/repos/project-nyra && docker compose -f infra/hosts/oracle-vps/docker-compose.yml up -d cloudflared'"
    - "Verify ORCHESTRATOR_TUNNEL_TOKEN is in Infisical at /machines/orchestrator"
    - "Deploy cloudflared on orchestrator: docker compose -f infra/hosts/orchestrator/docker-compose.cloudflared.yml up -d"
    - "In Cloudflare Zero Trust UI: add Public Hostname for each route in exposure-matrix.yml"
    - "Set Cloudflare Access policies: email allowlist for owner-only routes; email OTP for public_auth"
    - "Test each active hostname in browser"
    - "Verify git-ssh.projectnyra.com via: cloudflared access ssh --hostname git-ssh.projectnyra.com"

# ─────────────────────────────────────────────────────────────────────────────
# PER-HOST SERVICE INVENTORY
# ─────────────────────────────────────────────────────────────────────────────

hosts:
  # ── ORACLE VPS ─────────────────────────────────────────────────────────────
  oracle-vps:
    tailscale_ip: 100.64.0.3
    hostname: oracle.trex-fiordland.ts.net
    runtime_status: "70+ containers running (audited 2026-05-24)"
    env_file: infra/hosts/oracle-vps/.env
    primary_compose: infra/hosts/oracle-vps/docker-compose.yml
    overlay_compose_files:
      - infra/hosts/oracle-vps/docker-compose.oracle.yml
      - infra/hosts/oracle-vps/docker-compose.memory.yml
      - infra/hosts/oracle-vps/docker-compose.apps.yml
      - infra/hosts/oracle-vps/docker-compose.gitea.yml
      - infra/hosts/oracle-vps/docker-compose.letta-mcp.yml
      - infra/hosts/oracle-vps/docker-compose.clawteam.yml
      - infra/hosts/oracle-vps/docker-compose.activepieces-mcp.yml
    optional_overlays:
      - infra/hosts/oracle-vps/docker-compose.memory-extra.yml
      - infra/hosts/oracle-vps/docker-compose.gastown.yml
      - infra/hosts/oracle-vps/docker-compose.restoration.yml
      - infra/hosts/oracle-vps/docker-compose.superset.yml
    persistent_compose: infra/hosts/oracle-vps/docker-compose.persistent.yml
    services:
      # Data
      postgres: { port: 5432, category: data, status: running }
      redis-cache: { port: 6379, category: data, status: running }
      falkordb:
        {
          category: data,
          status: running,
          notes: "graph DB for mem0; custom community plugin — do NOT swap backend",
        }
      qdrant:
        {
          category: data,
          status: running,
          notes: "vector store for Letta embeddings (768-dim nomic)",
        }
      # Memory plane (docker-compose.memory.yml)
      letta:
        port: 8283
        category: memory
        status: running
        notes: "nyra-stack-orchestrator agent deployed (agent-516e2d8a-742e-4970-8d1b-2870b56ba804); LLM=local/llama3.2-3b via litellm"
      mem0: { category: memory, status: running }
      # AI infrastructure
      litellm:
        port: 4000
        category: platform
        status: running
        notes: "Oracle LiteLLM proxy; routes local/* to worker LiteLLMs, subscription/* to llxprt-bridge :8091"
      # CRM
      twenty: { port: 3000, category: app-ui, status: running }
      twenty-postgres: { category: data, status: running }
      # Automation
      n8n: { port: 5678, category: platform, status: running }
      activepieces: { port: 8080, category: platform, status: running }
      # Dev
      gitea:
        port: 3000
        category: devops
        status: running
        notes: "nyra-gitea + nyra-gitea-db + nyra-gitea-runner; 3+ hours uptime confirmed"
      # UI
      openwebui: { port: 8088, category: app-ui, status: running }
      gastown:
        {
          port: 8080,
          category: app-ui,
          status: running,
          notes: "primary agent coordination surface",
        }
      nexus:
        {
          port: 6000,
          category: platform,
          status: running,
          notes: "Grafbase Nexus — MCP/LLM aggregator; 45+ hours uptime",
        }
      nexus-ui: { port: 3016, category: app-ui, status: running }
      # Observability
      grafana: { port: 3003, category: observability, status: running }
      prometheus: { port: 9090, category: observability, status: running }
      cadvisor: { port: 8081, category: observability, status: running }
      # Tunnel
      cloudflared:
        category: tunnel
        status: deployed
        notes: "token via ORACLE_TUNNEL_TOKEN in .env; config: infra/hosts/oracle-vps/cloudflared-config.yml"
      # Persistent (docker-compose.persistent.yml)
      portainer-ce:
        {
          port: "9000/9443",
          category: management,
          status: running,
          notes: "persistent — never stop",
        }
      portainer-agent:
        { category: management, status: running, notes: "persistent" }
      syncthing: { category: sync, status: running, notes: "persistent" }

  # ── ORCHESTRATOR ──────────────────────────────────────────────────────────
  orchestrator:
    tailscale_ip: 100.64.0.2
    hostname: orchestrator.trex-fiordland.ts.net
    env_file: infra/hosts/orchestrator/.env
    primary_compose: infra/hosts/orchestrator/docker-compose.yml
