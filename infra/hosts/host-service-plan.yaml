# ─────────────────────────────────────────────────────────────────────────────
# SECRETS REQUIREMENTS
# ─────────────────────────────────────────────────────────────────────────────

secrets:
  # Status: set=confirmed in env/Infisical | pending=needs to be created/stored
  - name: ORACLE_TUNNEL_TOKEN
    host: oracle-vps
    infisical_path: /machines/oracle-vps
    status: pending # obtain from Cloudflare Zero Trust dashboard
  - name: ORACLE_TUNNEL_ID
    host: oracle-vps
    infisical_path: /machines/oracle-vps
    status: pending
  - name: ORCHESTRATOR_TUNNEL_TOKEN
    host: orchestrator
    infisical_path: /machines/orchestrator
    status: set # compose reads via Infisical secrets-init (known tunnel ID: ae0bd53a)
  - name: ORCHESTRATOR_TUNNEL_ID
    host: orchestrator
    infisical_path: /machines/orchestrator
    status: set
  - name: LITELLM_MASTER_KEY
    host: oracle-vps
    infisical_path: /machines/oracle-vps
    status: set
  - name: LITELLM_DATABASE_URL
    host: oracle-vps
    infisical_path: /machines/oracle-vps
    status: set
    notes: "postgresql://nyra:...@postgres:5432/litellm"
  - name: LETTA_OPENAI_API_KEY
    host: oracle-vps
    status: set
    notes: "Set to LiteLLM master key; persisted in oracle .env"
  - name: LETTA_OPENAI_API_BASE
    host: oracle-vps
    status: set
    notes: "http://litellm:4000/v1; persisted in oracle .env"
  - name: LLXPRT_BRIDGE_API_KEY
    host: all
    infisical_path: /machines/*
    status: set

# ─────────────────────────────────────────────────────────────────────────────
# PENDING DEPLOYMENTS (ordered by priority)
# ─────────────────────────────────────────────────────────────────────────────

pending_deployments:
  - name: power-management-api
    host: orchestrator
    port: 8765
    priority: 1-high
    description: >
      FastAPI service implementing /wake/{worker}, /sleep/{worker}, /status for Nyra WoL.
      Calls `wakeonlan -i 192.168.1.255 <MAC>` (wake) and SSH `sudo systemctl suspend` (sleep).
      Letta agent tools (nyra_wake_gpu_worker, nyra_sleep_gpu_worker, nyra_cluster_power_status)
      call http://orchestrator.trex-fiordland.ts.net:8765 and timeout without this service.
    actions:
      - Write FastAPI app under infra/hosts/orchestrator/power-api/ or images/power-api/
      - Add service to orchestrator docker-compose.yml or new docker-compose.power-api.yml
      - Worker names must map to: worker-rtx5090, worker-rtx3090ti, worker-rtx3060, all
      - Wake uses wakeonlan CLI installed on orchestrator LAN
      - Sleep uses SSH into worker then sudo systemctl suspend or sudo shutdown -h now

  - name: cloudflared-oracle-tunnel
    host: oracle-vps
    priority: 2-medium
    description: Verify oracle cloudflared tunnel is active and routing all subdomains
    actions:
      - Obtain ORACLE_TUNNEL_TOKEN from Cloudflare Zero Trust → Tunnels
      - Store in infra/hosts/oracle-vps/.env as ORACLE_TUNNEL_TOKEN
