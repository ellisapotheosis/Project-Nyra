# LiteLLM Configuration for Worker RTX 3060
# Provides an OpenAI-compatible API over the local Ollama runtime.

model_list:
  - model_name: local/qwen3-4b-3060
    litellm_params:
      model: ollama/qwen3:4b
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: embedding
      supports_function_calling: false
      supports_vision: false

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  drop_params: true
  json_logs: true

litellm_settings:
  drop_params: true
  request_timeout: 300
