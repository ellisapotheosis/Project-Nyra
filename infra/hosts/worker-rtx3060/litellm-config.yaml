# LiteLLM Configuration for Worker RTX 3060
# Provides OpenAI-compatible aliases over the local Ollama runtime.

model_list:
  - model_name: worker-3060-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: embedding
      supports_function_calling: false
      supports_vision: false

  - model_name: worker-3060-memory-extraction
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-summarization
    litellm_params:
      model: ollama/mistral:7b-instruct-v0.3-q4_K_M
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-code
    litellm_params:
      model: ollama/codellama:7b-q4
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-general
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-picoclaw
    litellm_params:
      model: openai/picoclaw
      api_base: http://picoclaw:8001/v1
      api_key: "not-needed"
      timeout: 120
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-bitnet
    litellm_params:
      model: openai/bitnet
      api_base: http://bitnet:8080/v1
      api_key: "not-needed"
      timeout: 60
    model_info:
      mode: chat
      supports_function_calling: false
      supports_vision: false

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  drop_params: true
  json_logs: true

litellm_settings:
  drop_params: true
  request_timeout: 300
