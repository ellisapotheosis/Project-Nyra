services:
  unmute-standalone:
    image: ghcr.io/kyutai-labs/unmute:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-unmute
    restart: unless-stopped
    environment:
      - UNMUTE_MODE=standalone
      - UNMUTE_MODEL_PROVIDER=ollama
      - UNMUTE_OLLAMA_URL=http://ollama:11434
      - UNMUTE_OPENAI_API_KEY=${UNMUTE_OPENAI_API_KEY:?UNMUTE_OPENAI_API_KEY is required}
      - UNMUTE_HOST_PORT=8098
    ports:
      - "8098:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-3060
