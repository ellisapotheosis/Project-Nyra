# LiteLLM Configuration for Worker RTX 3060
# Provides an OpenAI-compatible API over the local Ollama runtime.

model_list:
  - model_name: worker-3060-embedding
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://ollama:11434
      timeout: 120
    model_info:
      mode: embedding
      supports_function_calling: false
      supports_vision: false

  - model_name: worker-3060-memory-extraction
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 4096
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-summarization
    litellm_params:
      model: ollama/mistral:7b-instruct-v0.3-q4_K_M
      api_base: http://ollama:11434
      timeout: 180
      max_tokens: 4096
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-code
    litellm_params:
      model: ollama/codellama:7b-q4
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

  - model_name: worker-3060-general
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://ollama:11434
      timeout: 120
      max_tokens: 8192
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false

general_settings:
  drop_params: true
  json_logs: true

litellm_settings:
  drop_params: true
  request_timeout: 300
