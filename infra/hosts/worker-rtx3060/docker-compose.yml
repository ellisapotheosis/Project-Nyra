# ============================================================================
# Worker RTX 3060 - Laptop (6GB VRAM)
# ============================================================================
# Ollama-based inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

services:
  # Portainer Agent and Syncthing are managed by docker-compose.persistent.yml
  # (make persistent-up-worker-3060) and must never appear here.

  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx3060}
      NYRA_SECRETS_DIR: /run/nyra-secrets
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Ollama Service ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=256
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-5m}
    volumes:
      - ollama_models:/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network
    labels:
      - "com.nyra.worker=rtx3060"
      - "com.nyra.vram=6gb"
      - "com.nyra.device=laptop"

  # ── Model Preloader ───────────────────────────────────────────────────────
  ollama-model-init:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-model-init
    restart: "no"
    environment:
      - OLLAMA_HOST=http://ollama:11434
      - OLLAMA_PRELOAD_MODELS=${OLLAMA_PRELOAD_MODELS:-nomic-embed-text llama3.2:3b mistral:7b-instruct-v0.3-q4_K_M}
    entrypoint: ["/bin/sh", "-lc"]
    command:
      - set -eu; for model in $${OLLAMA_PRELOAD_MODELS}; do echo "pulling $${model}"; ollama pull "$${model}"; done
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-network

  # ── LiteLLM Proxy ───────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-litellm
    hostname: worker-3060-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ./litellm:/app/litellm:ro
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-}
    command: --config /app/litellm/config.yaml --port 4000
    depends_on:
      ollama-model-init:
        condition: service_completed_successfully
    networks:
      - worker-network

  # ── Model Switcher ──────────────────────────────────────────────────────
  model-switcher:
    image: python:3.11-slim
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-switcher
    hostname: worker-3060-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - ollama_models:/models
    environment:
      - OLLAMA_URL=http://ollama:11434
      - AVAILABLE_MODELS=nomic-embed-text,llama3.2:3b,mistral:7b-instruct-v0.3-q4_K_M
      - DEFAULT_MODEL=llama3.2:3b
      - SPECIALIZATION=embeddings,extraction,summarization,mem0,letta
    command: python /app/switcher.py
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-network

  # ── Monitoring ──────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-promtail
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://100.64.0.3:3100}
      - WORKER_ID=worker-3060
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-gpu-exporter
    restart: unless-stopped
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - worker-network

  health-monitor:
    image: curlimages/curl:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-health
    restart: unless-stopped
    depends_on:
      - ollama
      - litellm
      - model-switcher
    environment:
      - OLLAMA_URL=http://ollama:11434
      - LITELLM_URL=http://litellm:4000
      - SWITCHER_URL=http://model-switcher:8090
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf "$${OLLAMA_URL}/api/version" || echo "Ollama Down"
          curl -sf "$${LITELLM_URL}/health" || echo "LiteLLM Down"
          curl -sf "$${SWITCHER_URL}/health" || echo "Model Switcher Down"
          sleep 60
        done
    networks:
      - worker-network

volumes:
  ollama_models:
  nyra_secrets:

networks:
  worker-network:
    name: nyra-worker-3060
    driver: bridge
