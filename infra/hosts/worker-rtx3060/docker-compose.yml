# ============================================================================
# Worker RTX 3060 - Laptop (6GB VRAM)
# ============================================================================
# Ollama-based inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

version: '3.8'

services:



  # ── Portainer Agent ─────────────────────────────────────────────────────
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-portainer-agent
    restart: unless-stopped
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,worker-rtx3060,standard}
    ports:
      - "${PORTAINER_AGENT_PORT:-9001}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-network

  # ── Ollama Service ──────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_MAX_LOADED_MODELS=1
      - OLLAMA_GPU_OVERHEAD=256
    volumes:
      - ollama_models:/root/.ollama/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network
    labels:
      - "com.nyra.worker=rtx3060"
      - "com.nyra.vram=6gb"
      - "com.nyra.device=laptop"

  # ── LiteLLM Proxy ───────────────────────────────────────────────────────
  litellm:
    build:
      context: ./litellm
    image: nyra/worker-3060-litellm:local
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-litellm
    hostname: worker-3060-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    command: --config /app/litellm/config.yaml --port 4000
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-network

  # ── Model Switcher ──────────────────────────────────────────────────────
  model-switcher:
    build:
      context: ./model-switcher
    image: nyra/worker-3060-model-switcher:local
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-switcher
    hostname: worker-3060-switcher
    restart: unless-stopped
    volumes:
      - ollama_models:/models
    environment:
      - OLLAMA_URL=http://worker-3060-ollama:11434
      - AVAILABLE_MODELS=llama3.2:3b,phi3:mini,nomic-embed-text
      - DEFAULT_MODEL=llama3.2:3b
    command: python /app/switcher.py
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-network

  # ── Monitoring ──────────────────────────────────────────────────────────
  promtail:
    build:
      context: ./promtail
    image: nyra/worker-3060-promtail:local
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-promtail
    restart: unless-stopped
    volumes:
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://oracle.trex-fiordland.ts.net:3100}
      - WORKER_ID=worker-3060
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true
    networks:
      - worker-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-node-exporter
    restart: unless-stopped
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-gpu-exporter
    restart: unless-stopped
    ports:
      - '9835:9835'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  # ── Assistant Cockpit (OpenClaw + Nerve + PicoClaw) ───────────────────────
  openclaw:
    image: ghcr.io/openclaw/openclaw:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-openclaw
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - LLM_URL=http://worker-3060-litellm:4000
    networks:
      - worker-network

  nerve:
    image: ghcr.io/openclaw/nerve-ui:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-nerve
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      - OPENCLAW_URL=http://worker-3060-openclaw:8001
    networks:
      - worker-network

  picoclaw:
    image: ghcr.io/openclaw/picoclaw:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3060-picoclaw
    restart: unless-stopped
    ports:
      - "8002:8001"
    environment:
      - LLM_URL=http://worker-3060-litellm:4000
    networks:
      - worker-network

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  ollama_models:
  syncthing_config:
  portainer_data:

networks:
  worker-network:
    name: nyra-worker-3060
    driver: bridge
