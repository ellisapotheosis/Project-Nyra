# Optional OpenClaw + NerveUI overlay for the RTX 3060 utility worker.

services:
  openclaw:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: worker-3060-openclaw
    restart: unless-stopped
    ports:
      - "8003:8001"
    environment:
      NODE_ENV: production
      OPENCLAW_ROLE: worker
      OPENCLAW_WORKER_NAME: rtx3060
      OPENCLAW_MODE: cron-automation
      NEXUS_API_URL: "http://orchestrator.trex-fiordland.ts.net:6000"
      OPENCLAW_GATEWAY_URL: "http://orchestrator.trex-fiordland.ts.net:8001"
      LITELLM_API_URL: "http://worker-rtx3060.trex-fiordland.ts.net:4000"
      ACTIVEPIECES_API_URL: "http://oracle.trex-fiordland.ts.net:5000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
      RATE_QUOTING_ENABLED: "true"
      CRON_JOB_EXECUTOR: enabled
    depends_on:
      - litellm
    networks:
      - worker-network

  nerve-ui:
    image: ghcr.io/dagger-hashimoto/nerve-ui:latest
    container_name: worker-3060-nerve-ui
    restart: unless-stopped
    ports:
      - "18791:18789"
    environment:
      OPENCLAW_URL: http://worker-3060-openclaw:8001
      NERVE_MODE: cron-interface
      NERVE_MORTGAGE_AUTOMATION: "true"
    depends_on:
      - openclaw
    networks:
      - worker-network
