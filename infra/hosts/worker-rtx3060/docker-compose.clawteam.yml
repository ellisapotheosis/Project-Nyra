# infra/hosts/worker-rtx3060/docker-compose.clawteam.yml
# 🦞 Project Nyra - ClawTeam Fallback Node for RTX 3060

services:
  clawteam:
    image: ghcr.io/claw-ai/clawteam:latest
    container_name: worker-3060-clawteam-fallback
    environment:
      - CLAWTEAM_ROLE=standby-replica
      - CLAWTEAM_HOST=worker-rtx3060
      - CLAWTEAM_MEMORY_LIMIT=8g
      - CLAWTEAM_PRIMARY=oracle-vps:9001
      - NERVE_UI_ENABLED=true
      - LITELLM_API_URL=http://orchestrator:4000
      - NEXUS_ROUTER_URL=http://orchestrator:7000
    ports:
      - "9002:9000"
      - "18790:18789"
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 8g
        reservations:
          memory: 5g
