# ============================================================================
# Worker RTX 3060 - Alienware M15R7 Laptop (12GB VRAM)
# ============================================================================
# Ollama-based inference for small/medium models and embeddings
# Connected via Tailscale mesh to orchestrator
# ============================================================================

version: "3.9"

services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: worker-3060-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: /hosts/oracle-vps
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Infisical agent (polls Infisical and refreshes secrets) ──────────────
  infisical-agent:
    build:
      context: ../../images/infisical-secrets-init
    container_name: worker-3060-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: /hosts/oracle-vps
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ============================================================================
  # Portainer Edge Agent
  # ============================================================================
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: worker-3060-portainer-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-network

  # ============================================================================
  # Ollama Service (GPU-enabled) - 12GB VRAM optimized
  # ============================================================================
  ollama:
    image: ollama/ollama:latest
    container_name: worker-3060-ollama
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2 # Limited due to 12GB VRAM
      - OLLAMA_GPU_OVERHEAD=512 # Reserve 512MB for system
      - OLLAMA_FLASH_ATTENTION=1
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-data:/root/.ollama
      - ./models:/models
      - ./ollama-modelfile:/modelfiles:ro
      - nyra_secrets:/run/nyra-secrets:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 14G # Leave headroom for system
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - worker-network
    labels:
      - "com.nyra.worker=rtx3060"
      - "com.nyra.vram=12gb"
      - "com.nyra.device=alienware-m15r7"

  # ============================================================================
  # Model Preloader - Downloads recommended models on startup
  # ============================================================================
  model-preloader:
    image: curlimages/curl:latest
    container_name: worker-3060-preloader
    depends_on:
      ollama:
        condition: service_healthy
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "=== Preloading models for RTX 3060 (12GB VRAM) ==="
        # Small models that fit well in 12GB
        curl -X POST http://ollama:11434/api/pull -d '{"name": "llama3.2:3b"}'      # 2GB
        curl -X POST http://ollama:11434/api/pull -d '{"name": "phi3:mini"}'        # 2.3GB
        curl -X POST http://ollama:11434/api/pull -d '{"name": "mistral:7b-v0.3"}' # 4.1GB
        curl -X POST http://ollama:11434/api/pull -d '{"name": "nomic-embed-text"}' # 274MB
        curl -X POST http://ollama:11434/api/pull -d '{"name": "all-minilm:l6-v2"}' # 45MB
        echo "=== Model preload complete ==="
    networks:
      - worker-network

  # ============================================================================
  # Health Monitor Service
  # ============================================================================
  health-monitor:
    build:
      context: ./health-monitor
      dockerfile: Dockerfile
    container_name: worker-3060-health
    restart: unless-stopped
    ports:
      - "9090:9090"
    environment:
      - WORKER_NAME=worker-3060
      - OLLAMA_URL=http://ollama:11434
      - CHECK_INTERVAL=60
      - PROMETHEUS_ENABLED=true
    volumes:
      - ./health-monitor:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      - ollama
      - secrets-init
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Redis Cache (for inference caching)
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: worker-3060-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worker-network

  # ============================================================================
  # Prometheus Node Exporter (System metrics)
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-3060-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  # ============================================================================
  # NVIDIA GPU Exporter (GPU metrics for Prometheus)
  # ============================================================================
  gpu-exporter:
    image: mindprince/nvidia_gpu_prometheus_exporter:latest
    container_name: worker-3060-gpu-exporter
    restart: unless-stopped
    ports:
      - "9445:9445"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  # ============================================================================
  # Promtail
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: worker-3060-promtail
    hostname: worker-3060-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/worker-3060:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://100.64.0.3:3100}
      - WORKER_ID=worker-3060
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - worker-network

volumes:
  ollama-data:
    driver: local
  redis-data:
    driver: local
  nyra_secrets:

networks:
  worker-network:
    name: nyra-worker-3060
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/24
