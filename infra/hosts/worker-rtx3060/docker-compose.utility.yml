# infra/hosts/worker-rtx3060/docker-compose.utility.yml
# 🚀 Project Nyra - RTX 3060 Utility Node
# Embeddings (nomic-embed-text)

version: "3.8"

services:
  # ── Vector & Embedding Server (Ollama) ──────────────────────
  # Dedicated to offloading embedding tasks from the primary reasoning nodes.
  embeddings:
    image: ollama/ollama:latest
    container_name: worker-3060-embeddings
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_storage:/root/.ollama
    environment:
      - CUDA_VISIBLE_DEVICES=0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

networks:
  worker-network:
    external: true

volumes:
  ollama_storage:
