# Persistent services for worker-rtx3060 — Portainer edge agent + Syncthing
name: nyra-persistent

services:
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-persistent-worker-3060-portainer-agent
    restart: always
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID:-}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: "1"
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: nyra,edge,worker-3060
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - default

  syncthing:
    image: syncthing/syncthing:latest
    container_name: nyra-persistent-worker-3060-syncthing
    restart: always
    network_mode: host
    environment:
      STGUIADDRESS: "0.0.0.0:8386"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -fkLsS -m 2 127.0.0.1:8386/rest/noauth/health | grep -o OK || exit 1",
        ]
      interval: 60s
      timeout: 10s
      retries: 3
    volumes:
      - /home/ellisapotheosis:/var/syncthing/data/home
      - worker_3060_syncthing_config:/var/syncthing

volumes:
  worker_3060_syncthing_config:
