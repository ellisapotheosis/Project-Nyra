# Ollama Local LLM Inference on worker-rtx3060
# Lightweight local LLM server for summarization, embeddings, and fallback inference
#
# Deployment:
#   docker --context worker-rtx3060 compose \
#     -f infra/hosts/worker-rtx3060/docker-compose.ollama.yml \
#     up -d
#
# GPU: RTX 3060 (12GB VRAM)
#   - Available for Ollama: ~5GB (remainder for system + Qdrant/FalkorDB if co-located)
#   - Models: Qwen 0.5B, Mistral 7B, LLaMA 2 7B (all fit in 5GB)
#   - Fallback to worker-rtx3090ti (24GB) for larger models
#
# Purpose:
#   - Letta: memory summarization (convert 100 messages → concise summary)
#   - mem0: relationship extraction from documents
#   - Embeddings: encode text for Qdrant semantic search
#   - Fallback inference: when cloud APIs are slow/unavailable

name: nyra-ollama-3060

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
    external: true

volumes:
  ollama_models:
    name: nyra_ollama_3060_models
    driver: local

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Ollama Local LLM Server — CPU + GPU Inference
  #
  # Purpose:
  #   - Runs lightweight models (0.5B-7B parameters)
  #   - Provides /api/generate and /api/embeddings endpoints
  #   - Uses GPU acceleration (CUDA on RTX 3060)
  #   - Supports model downloading and caching
  #
  # Capabilities:
  #   - Qwen 0.5B: Fast text generation (milliseconds), ~500MB
  #   - Mistral 7B: Balanced speed/quality (~2-3 tokens/sec), ~4.7GB
  #   - All-MiniLM-L6-v2: Embeddings (384D, fast), ~22MB
  #
  # API:
  #   - /api/generate - Text generation
  #   - /api/embeddings - Get embeddings for text
  #   - /api/tags - List downloaded models
  #   - /api/pull - Download models from ollama.com
  # ────────────────────────────────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-ollama-3060
    restart: unless-stopped
    networks: [nyra-network]

    environment:
      # GPU/CUDA Configuration
      OLLAMA_GPU: "1"  # Enable GPU acceleration
      OLLAMA_MAX_LOADED_SEQUENCES: "1"  # Single sequence at a time (memory saving)

    volumes:
      # Persistent model storage (downloaded models cached here)
      - ollama_models:/root/.ollama

    ports:
      # HTTP API (accessed by Letta, mem0, embedding services)
      - "127.0.0.1:11434:11434"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    # GPU resource constraints
    # RTX 3060 has 12GB VRAM; allocate 5GB for Ollama
    # Other 7GB: system, Docker overhead, Qdrant if co-located
    # cpus: "4.0"
    # mem_limit: "5g"

    # Docker GPU support (requires docker buildx and --gpus flag)
    # Uncomment if GPU support is enabled:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

# ════════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT & SETUP
# ════════════════════════════════════════════════════════════════════════════════
#
# 1. Deploy Ollama:
#    docker --context worker-rtx3060 compose \
#      -f infra/hosts/worker-rtx3060/docker-compose.ollama.yml \
#      up -d
#
# 2. Pull initial models (runs inside container):
#    docker --context worker-rtx3060 exec nyra-ollama-3060 ollama pull qwen:0.5b
#    docker --context worker-rtx3060 exec nyra-ollama-3060 ollama pull mistral:7b
#    docker --context worker-rtx3060 exec nyra-ollama-3060 ollama pull nomic-embed-text
#
# 3. Verify health and models:
#    docker --context worker-rtx3060 exec nyra-ollama-3060 \
#      curl http://localhost:11434/api/tags | jq .
#
# 4. Test inference:
#    docker --context worker-rtx3060 exec nyra-ollama-3060 \
#      curl -X POST http://localhost:11434/api/generate \
#        -H "Content-Type: application/json" \
#        -d '{"model": "qwen:0.5b", "prompt": "Hello, how are you?", "stream": false}'
#
# ════════════════════════════════════════════════════════════════════════════════
# LETTA INTEGRATION (Memory Summarization)
# ════════════════════════════════════════════════════════════════════════════════
#
# Letta uses Ollama for message summarization:
#
#   environment:
#     LETTA_SUMMARIZATION_ENABLED: "true"
#     LETTA_SUMMARIZATION_MODEL: "local"
#     LETTA_SUMMARIZATION_ENDPOINT: "http://ollama-3060:11434"
#     LETTA_SUMMARIZATION_MODEL_NAME: "qwen:0.5b"
#
# When Letta reaches context window limit, it:
#   1. Sends old messages to Ollama for summarization
#   2. Stores summary in Qdrant with reduced token cost
#   3. Retrieves summaries during semantic search
#
# ════════════════════════════════════════════════════════════════════════════════
# MEM0 INTEGRATION (Knowledge Extraction)
# ════════════════════════════════════════════════════════════════════════════════
#
# mem0 uses Ollama for entity/relationship extraction from documents:
#
#   environment:
#     MEM0_LLM_PROVIDER: "local"
#     MEM0_LLM_ENDPOINT: "http://ollama-3060:11434"
#     MEM0_LLM_MODEL: "mistral:7b"
#
# When mem0 processes new documents:
#   1. Sends doc to Ollama for entity extraction ("Who? What? Where?")
#   2. Creates nodes in FalkorDB (Borrower, Property, etc.)
#   3. Stores embeddings in Qdrant for semantic search
#
# ════════════════════════════════════════════════════════════════════════════════
# EMBEDDINGS (Semantic Search)
# ════════════════════════════════════════════════════════════════════════════════
#
# Ollama provides embeddings endpoint for Qdrant:
#
#   environment:
#     LETTA_EMBEDDING_ENDPOINT: "http://ollama-3060:11434/api/embeddings"
#     LETTA_EMBEDDING_MODEL: "nomic-embed-text"
#
# Model sizes:
#   - nomic-embed-text (32GB): ~274MB, 768D embeddings
#   - all-MiniLM-L6-v2: ~22MB, 384D embeddings (via Ollama)
#
# Embeddings are cached in Qdrant for rapid similarity search.
#
# ════════════════════════════════════════════════════════════════════════════════
# MODEL SELECTION (5GB VRAM Constraint)
# ════════════════════════════════════════════════════════════════════════════════
#
# **Recommended for RTX 3060 (5GB available):**
#
#   Primary:
#     - qwen:0.5b     (500MB, very fast, acceptable quality for summaries)
#     - mistral:7b    (4.7GB, slower but better quality, fits barely)
#
#   Fallback to RTX 3090Ti (24GB) if needed:
#     - llama2:13b    (7.4GB, better reasoning)
#     - mistral:large (13B, best quality)
#
# **Embeddings (all fit in 5GB):**
#     - nomic-embed-text (32GB): ~274MB
#     - all-MiniLM-L6-v2: ~22MB
#
# ════════════════════════════════════════════════════════════════════════════════
# FALLBACK STRATEGY (When 5GB VRAM is Insufficient)
# ════════════════════════════════════════════════════════════════════════════════
#
# If Ollama OOM (out of memory):
#   1. Reduce context size: OLLAMA_MAX_LOADED_SEQUENCES=1
#   2. Switch to smaller model: qwen:0.5b instead of mistral:7b
#   3. Route to RTX 3090Ti: OLLAMA_ENDPOINT="http://ollama-3090ti:11434"
#   4. Use cloud API: Set LETTA_LLM_PROVIDER=cloud fallback
#
# Automatic fallback (to implement in Letta config):
#   if ollama_endpoint_fails:
#       route_to_worker_3090ti  # Has 24GB VRAM
#       if still_fails:
#           use_cloud_api  # Claude Sonnet for critical tasks
#
# ════════════════════════════════════════════════════════════════════════════════
# MONITORING & DEBUGGING
# ════════════════════════════════════════════════════════════════════════════════
#
# Monitor GPU usage:
#   ssh worker-rtx3060
#   nvidia-smi -l 1  # Refresh every 1 second
#
# Check Ollama logs:
#   docker --context worker-rtx3060 logs -f nyra-ollama-3060
#
# Monitor memory usage:
#   docker --context worker-rtx3060 stats nyra-ollama-3060
#
# Reload model (after updating):
#   docker --context worker-rtx3060 exec nyra-ollama-3060 \
#     curl -X POST http://localhost:11434/api/pull \
#       -H "Content-Type: application/json" \
#       -d '{"name": "qwen:0.5b"}'
#
# ════════════════════════════════════════════════════════════════════════════════
# NETWORK CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
#
# Ollama joins nyra-network (shared with oracle-vps):
#   - Letta can reach it via: http://ollama-3060:11434
#   - mem0 can reach it via: http://ollama-3060:11434
#   - Other services can route requests to it
#
# Local-only binding (not exposed outside Docker network):
#   - 127.0.0.1:11434 is the only exposed port (for debugging)
#   - Production: remove localhost binding, use Docker hostname
#
