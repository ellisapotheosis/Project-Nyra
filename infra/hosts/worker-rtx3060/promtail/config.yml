# Promtail Configuration for Worker RTX 3060
# Ships logs to Oracle Loki for centralized logging

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push
    tenant_id: worker-3060

scrape_configs:
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=worker-rtx3060"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
            message: msg

      - labels:
          level:
          service:

      - timestamp:
          source: timestamp
          format: RFC3339

      - output:
          source: message

limits_config:
  readline_rate: 10000
  readline_burst: 20000
