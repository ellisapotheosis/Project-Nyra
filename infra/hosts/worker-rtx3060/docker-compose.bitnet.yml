name: nyra-worker-3060-bitnet

services:
  bitnet:
    build:
      context: ../orchestrator/bitnet
    container_name: ${BITNET_CONTAINER_NAME:-worker-3060-bitnet}
    restart: unless-stopped
    environment:
      BITNET_MODEL_DIR: /models/BitNet-b1.58-2B-4T
      BITNET_MODEL_FILE: /models/BitNet-b1.58-2B-4T/ggml-model-i2_s.gguf
      BITNET_QUANT_TYPE: i2_s
      BITNET_THREADS: ${BITNET_THREADS:-6}
      BITNET_CTX_SIZE: ${BITNET_CTX_SIZE:-2048}
      BITNET_PORT: 8080
    ports:
      - "${BITNET_HOST_PORT:-8087}:8080"
    volumes:
      - bitnet_models:/models
      - bitnet_build:/opt/bitnet/build
    cpus: "${BITNET_CPUS:-6}"
    mem_limit: ${BITNET_MEM_LIMIT:-8g}

volumes:
  bitnet_models:
  bitnet_build:
