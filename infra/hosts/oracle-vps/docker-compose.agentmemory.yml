name: nyra-oracle-agentmemory

services:
  agentmemory:
    build:
      context: ./agentmemory
      args:
        AGENTMEMORY_GIT_REF: ${AGENTMEMORY_GIT_REF:-v0.9.2}
    container_name: nyra-agentmemory
    restart: unless-stopped
    environment:
      III_REST_PORT: ${AGENTMEMORY_PORT:-3111}
      III_STREAMS_PORT: ${AGENTMEMORY_STREAMS_PORT:-3112}
      AGENTMEMORY_SECRET: ${AGENTMEMORY_SECRET:-}
      VIEWER_ALLOWED_ORIGINS: ${VIEWER_ALLOWED_ORIGINS:-http://oracle.trex-fiordland.ts.net:3111,http://oracle.trex-fiordland.ts.net:3113,http://localhost:3111,http://localhost:3113,http://127.0.0.1:3111,http://127.0.0.1:3113}
    ports:
      - "${AGENTMEMORY_BIND_IP:-100.64.0.3}:${AGENTMEMORY_PORT:-3111}:3111"
      - "${AGENTMEMORY_BIND_IP:-100.64.0.3}:${AGENTMEMORY_STREAMS_PORT:-3112}:3112"
      - "${AGENTMEMORY_BIND_IP:-100.64.0.3}:${AGENTMEMORY_VIEWER_PORT:-3113}:3113"
    volumes:
      - agentmemory_data:/opt/agentmemory-src/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3111/agentmemory/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - nyra_net

volumes:
  agentmemory_data:

networks:
  nyra_net:
    external: true
    name: nyra_net
