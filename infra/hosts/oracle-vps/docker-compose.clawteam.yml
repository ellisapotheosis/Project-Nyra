services:
  clawteam:
    image: ghcr.io/hkuds/claw:latest
    container_name: nyra-clawteam
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "8090:8080"
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://nyra-redis-cache:6379
    networks:
      - nyra_net

networks:
  nyra_net:
    external: true
    name: nyra_net
