# infra/hosts/oracle-vps/docker-compose.clawteam.yml
# 🦞 Project Nyra - ClawTeam Primary Node Override for Oracle-VPS

services:
  clawteam:
    build:
      context: ../../docker
      dockerfile: Dockerfile.clawteam
    container_name: nyra-clawteam-primary
    environment:
      - CLAWTEAM_ROLE=primary
      - CLAWTEAM_HOST=oracle-vps
      - CLAWTEAM_MEMORY_LIMIT=6g
      - CLAWTEAM_FALLBACK_REPLICA=worker-rtx3060:9002
      - WORKER_NODES=["worker-rtx5090", "worker-rtx3090ti", "worker-rtx3060"]
      - NERVE_UI_ENABLED=false
    ports:
      - "8080:8080"
    volumes:
      - clawteam_state:/root/.clawteam
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 4g

volumes:
  clawteam_state:
    name: nyra-clawteam-state
