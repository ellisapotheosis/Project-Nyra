# infra/hosts/oracle-vps/docker-compose.clawteam.yml
# 🦞 Project Nyra - Legacy Oracle ClawTeam definition
#
# The ClawTeam primary now belongs on orchestrator. Keep this file only as a
# compatibility definition for migration/rollback; it is profile-gated so a
# normal Oracle stack startup cannot create a second ClawTeam primary.

services:
  clawteam:
    profiles: ["legacy-oracle-primary"]
    build:
      context: ../../images/clawteam
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-clawteam-primary
    environment:
      - CLAWTEAM_ROLE=primary
      - CLAWTEAM_HOST=oracle-vps
      - CLAWTEAM_MEMORY_LIMIT=6g
      - NERVE_UI_ENABLED=false
    ports:
      - "8085:8080"
    volumes:
      - clawteam_state:/root/.clawteam
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 6g
        reservations:
          memory: 4g

volumes:
  clawteam_state:
    name: ${COMPOSE_PROJECT_NAME:-nyra}-clawteam-state
