name: nyra-oracle-apps

services:
  quote_engine:
    profiles: ["apps"]
    build:
      context: ../../stacks/nyra-mortgage/services/quote-engine
    container_name: nyra-quote-engine
    restart: unless-stopped
    ports:
      - "9010:9010"
    networks: [nyra_net]

  campaign_engine:
    profiles: ["apps"]
    build:
      context: ../../stacks/nyra-mortgage/services/campaign-engine
    container_name: nyra-campaign-engine
    restart: unless-stopped
    ports:
      - "9020:9020"
    volumes:
      - ../../stacks/nyra-mortgage/data/campaigns:/app/data/campaigns:ro
    networks: [nyra_net]

networks:
  nyra_net:
    external: true
    name: nyra-oracle_nyra_net
