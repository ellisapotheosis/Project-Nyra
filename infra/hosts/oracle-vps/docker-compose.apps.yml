services:
  webapp:
    profiles: ["apps"]
    build:
      context: ../../../
      dockerfile: infra/images/Dockerfile.nextjs
      args:
        APP_PATH: apps/projectnyra
        APP_NAME: projectnyra
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-webapp
    restart: unless-stopped
    command: ["node", "server.js"]
    environment:
      - PORT=3001
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CRM_API_URL=http://nyra-crm-api:4001
      - NEXUS_ROUTER_URL=http://nexus:3000
      - NEXT_PUBLIC_NEXUS_ROUTER_URL=${NEXT_PUBLIC_NEXUS_ROUTER_URL:-https://nexus-router.projectnyra.com}
      - GRAFBASE_URL=http://grafbase-gateway:5000
      - NEXT_PUBLIC_GRAFBASE_URL=${NEXT_PUBLIC_GRAFBASE_URL:-https://grafbase.projectnyra.com}
      - OPENMEMORY_MCP_URL=http://openmemory-mcp:8765
      - NEXT_PUBLIC_OPENMEMORY_URL=${NEXT_PUBLIC_OPENMEMORY_URL:-https://memory.projectnyra.com}
      - MEM0_API_URL=http://mem0:5000
      - MEMOS_API_URL=http://memos-api:8001
      - QDRANT_URL=http://qdrant:6333
    ports:
      - "${WEBAPP_HOST_PORT:-3002}:3001"
    networks:
      - nyra_net
      - memory_edge
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "require(''net'').createConnection(3001,process.env.HOSTNAME).on(''connect'',()=>process.exit(0)).on(''error'',()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  nexus-ui:
    profiles: ["nexus-ui"] # disabled from default apps profile — apps/nexusUI has no source yet
    build:
      context: ../../../
      dockerfile: infra/images/Dockerfile.nextjs
      args:
        APP_PATH: apps/nexusUI
        APP_NAME: "@nyra/nexus-ui"
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-nexus-ui
    restart: "no"
    command: ["node", "/app/node_modules/next/dist/bin/next", "start"]
    environment:
      - PORT=3016
      - NEXUS_UI_SETTINGS_PATH=/app/config/nexus-ui.settings.json
      - NEXUS_BASE_URL=http://nexus:3000
      - LITELLM_BASE_URL=http://litellm:4000
      - NEXUS_CONFIG_APPLY_ENABLED=false
      - NEXUS_DEPLOY_TARGET=oracle-vps
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:-https://app.projectnyra.com}
    ports:
      - "3016:3016"
    volumes:
      - nexus_ui_config:/app/config
    networks:
      - nyra_net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3016"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

volumes:
  nexus_ui_config:

networks:
  nyra_net:
    external: true
    name: nyra-network_nyra_net
  memory_edge:
    external: true
    name: nyra_memory_edge
