services:
  webapp:
    profiles: ["apps"]
    build:
      context: ../../../
      dockerfile: infra/images/Dockerfile.nextjs
      args:
        APP_PATH: apps/webapp/app
        APP_NAME: mortgage-assistant
    container_name: nyra-webapp
    restart: unless-stopped
    command: ["sh", "-c", "node $${NEXT_STANDALONE_SERVER}"]
    environment:
      - PORT=3001
      - NEXT_STANDALONE_SERVER=apps/webapp/app/server.js
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CRM_API_URL=http://nyra-crm-api:4001
    ports:
      - "${WEBAPP_HOST_PORT:-3002}:3001"
    networks:
      - nyra_net

  nexus-ui:
    profiles: ["apps"]
    build:
      context: ../../../
      dockerfile: infra/images/Dockerfile.nextjs
      args:
        APP_PATH: apps/nexusUI
        APP_NAME: "@nyra/nexus-ui"
    container_name: nyra-nexus-ui
    restart: unless-stopped
    command: ["sh", "-c", "node $${NEXT_STANDALONE_SERVER}"]
    environment:
      - PORT=3016
      - NEXT_STANDALONE_SERVER=apps/nexusUI/server.js
      - NEXUS_UI_SETTINGS_PATH=/app/config/nexus-ui.settings.json
      - NEXUS_BASE_URL=http://nexus:3000
      - LITELLM_BASE_URL=http://litellm:4000
      - NEXUS_CONFIG_APPLY_ENABLED=false
      - NEXUS_DEPLOY_TARGET=oracle-vps
      - NEXT_PUBLIC_WEBAPP_URL=${NEXT_PUBLIC_WEBAPP_URL:-https://app.ratehunter.net}
    ports:
      - "3016:3016"
    volumes:
      - nexus_ui_config:/app/config
    networks:
      - nyra_net

volumes:
  nexus_ui_config:
