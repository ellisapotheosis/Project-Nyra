name: nyra-oracle-apps

services:
  webapp:
    profiles: ["apps"]
    build:
      context: ../../../
      dockerfile: infra/images/Dockerfile.nextjs
      args:
        APP_PATH: apps/webapp/app
        APP_NAME: mortgage-assistant
    container_name: nyra-webapp
    restart: unless-stopped
    env_file: [.env]
    environment:
      - PORT=3001
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CRM_API_URL=http://nyra-crm-api:4001
    ports:
      - "3001:3001"
    networks:
      - nyra_net

networks:
  nyra_net:
    external: true
    name: nyra_net
