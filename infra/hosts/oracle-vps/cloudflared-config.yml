# Cloudflared backup config for the Project Nyra Oracle VPS tunnel.
# Replace ORACLE_VPS_TUNNEL_ID before using this as a locally managed tunnel.
# If the tunnel is dashboard-managed with a token, use this file as the source
# of truth for Public Hostname entries in the Cloudflare Zero Trust UI.

tunnel: ORACLE_VPS_TUNNEL_ID
credentials-file: /etc/cloudflared/ORACLE_VPS_TUNNEL_ID.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  # Public, unauthenticated web surface.
  - hostname: ratehunter.net
    service: http://nyra-landing:3003

  - hostname: www.ratehunter.net
    service: http://nyra-landing:3003

  # Private UIs - protect every hostname in this group with Cloudflare Access.
  - hostname: app.ratehunter.net
    service: http://nyra-webapp:3001

  - hostname: admin.ratehunter.net
    service: http://nyra-admin:3002

  - hostname: twenty.ratehunter.net
    service: http://nyra-twenty:3000

  - hostname: n8n.ratehunter.net
    service: http://nyra-n8n:5678

  - hostname: gitea.ratehunter.net
    service: http://nyra-gitea:3000

  - hostname: grafana.ratehunter.net
    service: http://nyra-grafana:3000

  - hostname: prometheus.ratehunter.net
    service: http://nyra-prometheus:9090

  - hostname: cadvisor.ratehunter.net
    service: http://nyra-cadvisor:8080

  - hostname: openwebui.ratehunter.net
    service: http://nyra-openwebui:8080

  - hostname: openclaw.ratehunter.net
    service: http://nyra-openclaw:18790

  - hostname: clawteam.ratehunter.net
    service: http://nyra-clawteam:8080

  - hostname: paperclip.ratehunter.net
    service: http://nyra-paperclip:3100

  - hostname: letta.ratehunter.net
    service: http://oracle.trex-fiordland.ts.net:8283

  - hostname: portainer-oracle.ratehunter.net
    service: https://nyra-portainer:9443
    originRequest:
      noTLSVerify: true

  # Optional non-HTTP route. Use only with cloudflared access/SSH clients.
  - hostname: git-ssh.ratehunter.net
    service: ssh://nyra-gitea:2222

  # Oracle catch-all. Required by cloudflared.
  - service: http_status:404
