# Cloudflared backup config for the Project Nyra Oracle VPS tunnel.
# Replace ORACLE_VPS_TUNNEL_ID before using this as a locally managed tunnel.
# If the tunnel is dashboard-managed with a token, use this file as the source
# of truth for Public Hostname entries in the Cloudflare Zero Trust UI.

tunnel: ORACLE_VPS_TUNNEL_ID
credentials-file: /etc/cloudflared/ORACLE_VPS_TUNNEL_ID.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  # Cloudflare Pages owns ratehunter.net and www.ratehunter.net.
  # Do not add apex/www routes to this tunnel.

  # Broker/customer webapp. Keep Access-gated until app auth is fully live.
  - hostname: nyra.ratehunter.net
    service: http://webapp:3001

  # Self-hosted Supabase gateway for browser auth/API calls. Do not put a
  # browser-blocking Access policy in front of Supabase Auth endpoints.
  - hostname: api.ratehunter.net
    service: http://supabase-kong:8000

  # Webhooks should use provider allowlists, signed paths, or service tokens.
  - hostname: hooks.ratehunter.net
    service: http://n8n:5678

  # Private UIs - protect every hostname in this group with Cloudflare Access.
  - hostname: twenty.ratehunter.net
    service: http://twenty:3000

  - hostname: crm.ratehunter.net
    service: http://twenty:3000

  - hostname: n8n.ratehunter.net
    service: http://n8n:5678

  - hostname: gitea.ratehunter.net
    service: http://gitea:3000

  - hostname: activepieces.ratehunter.net
    service: http://activepieces:80

  - hostname: grafana.ratehunter.net
    service: http://grafana:3000

  - hostname: prometheus.ratehunter.net
    service: http://prometheus:9090

  - hostname: cadvisor.ratehunter.net
    service: http://cadvisor:8080

  - hostname: openwebui.ratehunter.net
    service: http://openwebui:8080

  - hostname: nexus-ui.ratehunter.net
    service: http://nexus-ui:3016

  - hostname: litellm.ratehunter.net
    service: http://litellm:4000

  - hostname: nexus.ratehunter.net
    service: http://nexus:3000

  - hostname: clawteam.ratehunter.net
    service: http://clawteam:8080

  - hostname: paperclip.ratehunter.net
    service: http://paperclip:3100

  - hostname: letta.ratehunter.net
    service: http://oracle.trex-fiordland.ts.net:8283

  - hostname: portainer-oracle.ratehunter.net
    service: https://portainer:9443
    originRequest:
      noTLSVerify: true

  # Optional non-HTTP route. Use only with cloudflared access/SSH clients.
  - hostname: git-ssh.ratehunter.net
    service: ssh://gitea:2222

  # Oracle catch-all. Required by cloudflared.
  - service: http_status:404
