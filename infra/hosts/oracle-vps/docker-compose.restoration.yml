services:
  # ── LLxprt Subscription Bridge ──────────────────────────────────────────
  llxprt-bridge:
    build:
      context: ../../../services/llxprt-bridge
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-restoration-llxprt-bridge
    restart: unless-stopped
    environment:
      LLXPRT_BRIDGE_API_KEY: ${LLXPRT_BRIDGE_API_KEY:-}
    networks:
      nyra-network_nyra_net:
        aliases:
          - llxprt-bridge
          - nyra-llxprt-bridge

  # ── ActivePieces MCP ────────────────────────────────────────────────────
  activepieces-mcp:
    build:
      context: ../../../services/nyra-mcp
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-restoration-activepieces-mcp
    restart: unless-stopped
    environment:
      NYRA_MCP_PORT: 3333
      AP_INTERNAL_BASE_URL: http://activepieces:80
      ACTIVEPIECES_API_KEY: ${ACTIVEPIECES_API_KEY:-}
      NYRA_HTTP_ALLOWLIST: "http://activepieces,http://n8n,http://twenty"
    networks:
      nyra-network_nyra_net:
        aliases:
          - activepieces-mcp
          - nyra-activepieces-mcp

networks:
  nyra-network_nyra_net:
    external: true
