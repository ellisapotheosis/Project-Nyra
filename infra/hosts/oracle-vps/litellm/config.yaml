# LiteLLM Multi-Provider Gateway Configuration — Oracle VPS
#
# Provider Chain (Tier Order):
# 1. Claude API (native Anthropic subscription)
# 2. Codex CLI subscription (OpenAI-compatible via llxprt-bridge)
# 3. OmniRoute free models (oracle-vps local)
# 4. Local worker models (vLLM + Ollama)
# 5. OpenRouter fallback (free tier)
#
# Secrets injected at runtime via Infisical:
#   CLAUDE_API_KEY           — Anthropic API key (sk-ant-...)
#   CODEX_API_KEY            — Codex subscription key
#   OMNIROUTE_API_KEY        — OmniRoute endpoint key
#   OPENROUTER_API_KEY       — OpenRouter free tier key
#   LITELLM_MASTER_KEY       — LiteLLM admin key (sk-...)
#
# Network topology:
#   - Workers: Tailscale DNS (*.projectnyra.com)
#   - Oracle services: Tailscale IP (100.64.0.3) or localhost
#   - External APIs: HTTPS direct

# ============================================================================
# TIER 1: CLAUDE API (Anthropic Native)
# ============================================================================
model_list:
  - model_name: claude/3-5-sonnet
    litellm_params:
      model: anthropic/claude-3-5-sonnet-20241022
      api_key: os.environ/CLAUDE_API_KEY
      timeout: 300
      max_tokens: 8000
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: true
      input_cost_per_token: 0.000003
      output_cost_per_token: 0.000015
      max_tokens: 8000
      max_input_tokens: 200000

  - model_name: claude/3-5-haiku
    litellm_params:
      model: anthropic/claude-3-5-haiku-20241022
      api_key: os.environ/CLAUDE_API_KEY
      timeout: 180
      max_tokens: 4096
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: true
      input_cost_per_token: 0.0000008
      output_cost_per_token: 0.000004
      max_tokens: 4096

  - model_name: claude/3-opus
    litellm_params:
      model: anthropic/claude-3-opus-20250219
      api_key: os.environ/CLAUDE_API_KEY
      timeout: 600
      max_tokens: 16000
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: true
      input_cost_per_token: 0.000015
      output_cost_per_token: 0.000075
      max_tokens: 16000

  # ============================================================================
  # TIER 2: CODEX CLI SUBSCRIPTION (OpenAI-Compatible via Proxy)
  # ============================================================================
  - model_name: codex/api
    litellm_params:
      model: openai/claude-code
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/CODEX_API_KEY
      timeout: 300
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000002
      max_tokens: 8000

  - model_name: codex/subscription
    litellm_params:
      model: openai/claude-desktop
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/CODEX_API_KEY
      timeout: 240
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.000001
      output_cost_per_token: 0.000001
      max_tokens: 8000

  # ============================================================================
  # TIER 3: OMNIROUTE (Free Models on Oracle VPS)
  # ============================================================================
  - model_name: omniroute/auto
    litellm_params:
      model: openai/auto
      api_base: http://localhost:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 180
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 8000

  - model_name: omniroute/fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://localhost:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 90
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 4096

  - model_name: omniroute/coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://localhost:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 8000

  - model_name: omniroute/reasoning
    litellm_params:
      model: openai/auto/reasoning
      api_base: http://localhost:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 600
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 16000

  # ============================================================================
  # TIER 4: LOCAL GPU WORKERS (vLLM + Ollama)
  # ============================================================================
  # Worker 1: RTX 5090 (32GB)
  - model_name: local/deepseek-r1
    litellm_params:
      model: openai/deepseek-r1
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 300
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 16000

  - model_name: local/qwen-3.1-72b
    litellm_params:
      model: openai/Qwen/Qwen3.1-72B-Instruct
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 240
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  - model_name: local/llama-3.3-70b
    litellm_params:
      model: openai/meta-llama/Llama-3.3-70B-Instruct
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 240
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  # Worker 2: RTX 3090 Ti (24GB)
  - model_name: local/qwen-coder-32b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 180
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  - model_name: local/gemma-4-24b
    litellm_params:
      model: openai/google/gemma-4-24B-A4B-it
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 180
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  # Worker 3: RTX 3060 (12GB Ollama)
  - model_name: local/qwen-2.5-7b
    litellm_params:
      model: ollama/qwen2.5:7b
      timeout: 120
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  - model_name: local/llama3.2-8b
    litellm_params:
      model: ollama/llama3.2:8b
      timeout: 120
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 8000

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
    model_info:
      mode: "embeddings"
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # ============================================================================
  # TIER 5: OPENROUTER FALLBACK (Free Tier)
  # ============================================================================
  - model_name: openrouter/deepseek-r1-free
    litellm_params:
      model: openrouter/deepseek/deepseek-r1:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 8192

  - model_name: openrouter/qwen-free
    litellm_params:
      model: openrouter/qwen/qwen-3-coder:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 8192

  - model_name: openrouter/nemotron-free
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      max_tokens: 4096

  # ============================================================================
  # MODEL ALIASES FOR ROUTING
  # ============================================================================
  - model_name: default
    litellm_params:
      model: claude/3-5-sonnet

  - model_name: fast
    litellm_params:
      model: claude/3-5-haiku

  - model_name: reasoning
    litellm_params:
      model: claude/3-opus

  - model_name: coding
    litellm_params:
      model: codex/subscription

# ============================================================================
# PROVIDER CHAIN CONFIGURATION (Fallback Order)
# ============================================================================
router_settings:
  routing_strategy: cost-optimized

  # Primary fallback chains (ordered by tier)
  fallbacks:
    # Standard chat completions
    - {
        "claude/3-5-sonnet":
          [
            "codex/subscription",
            "omniroute/auto",
            "local/qwen-3.1-72b",
            "openrouter/deepseek-r1-free",
          ],
      }

    - {
        "claude/3-5-haiku":
          ["omniroute/fast", "local/qwen-2.5-7b", "openrouter/nemotron-free"],
      }

    - {
        "claude/3-opus":
          [
            "codex/subscription",
            "omniroute/reasoning",
            "local/deepseek-r1",
            "openrouter/deepseek-r1-free",
          ],
      }

    # Coding-specific chains
    - {
        "codex/subscription":
          ["local/qwen-coder-32b", "omniroute/coding", "openrouter/qwen-free"],
      }

    # OmniRoute chains
    - {
        "omniroute/auto":
          ["local/qwen-3.1-72b", "local/llama-3.3-70b", "openrouter/qwen-free"],
      }

    - {
        "omniroute/coding":
          [
            "local/qwen-coder-32b",
            "codex/subscription",
            "openrouter/qwen-free",
          ],
      }

    - {
        "omniroute/reasoning":
          ["local/deepseek-r1", "claude/3-opus", "openrouter/deepseek-r1-free"],
      }

  # Retry configuration
  num_retries: 3
  timeout: 300
  fallback_on_timeout: true

  # Load balancing across healthy providers
  load_balance_algorithm: least-busy

  # Health checks
  enable_health_checks: true
  health_check_interval: 60

  # Cost optimization
  prefer_local_workers: true
  cloud_fallback_threshold: 0.85 # Switch to cloud if local fails 15% of time
  max_cost_per_request: 0.50 # USD - hard cap per request

# ============================================================================
# LETTA AGENT INTEGRATION
# ============================================================================
# Letta agents use the "default" model alias
# Fallback chain ensures continuity even if primary provider is down

letta_settings:
  # Primary model for agent reasoning
  agent_model: "default" # Routes to claude/3-5-sonnet → codex → omniroute → local → openrouter

  # Fast summarization (for memory operations)
  summarization_model: "fast" # Routes to claude/3-5-haiku → omniroute/fast → local → openrouter

  # Reasoning-heavy tasks (analysis, decision-making)
  reasoning_model: "reasoning" # Routes to claude/3-opus → codex → omniroute/reasoning → local → openrouter

  # Code generation tasks
  coding_model: "coding" # Routes to codex/subscription → local/qwen-coder-32b → omniroute/coding → openrouter

  # Embeddings for vector search
  embedding_model: "local/embeddings"
  embedding_dimension: 768

# ============================================================================
# LITELLM CORE SETTINGS
# ============================================================================
litellm_settings:
  set_verbose: false
  drop_params: true

  # Redis caching
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379
    ttl: 3600

# ============================================================================
# GENERAL SETTINGS
# ============================================================================
general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

  # Database for cost tracking (optional)
  database_url: os.environ/LITELLM_DATABASE_URL

  # Request limits
  request_timeout: 600
  max_parallel_requests: 100
  stream_timeout: 300

  # Logging
  set_verbose: false
  json_logs: true
  log_level: INFO

  # CORS
  allowed_origins: ["*"]

  # Rate limiting per API key
  rate_limit:
    enabled: true
    requests_per_minute: 60
    requests_per_hour: 1000
    requests_per_day: 10000

# ============================================================================
# COST TRACKING & BUDGETS
# ============================================================================
budgets:
  # Global budget
  - budget_id: "global"
    max_budget: 500.0 # USD per month
    time_period: "monthly"
    alert_threshold: 0.80
    block_on_exceed: false

  # Letta agents budget
  - budget_id: "letta-agents"
    max_budget: 100.0
    time_period: "monthly"
    alert_threshold: 0.85
    block_on_exceed: false

  # Production services
  - budget_id: "production"
    max_budget: 50.0
    time_period: "monthly"
    alert_threshold: 0.90
    block_on_exceed: true

  # Development/testing
  - budget_id: "development"
    max_budget: 200.0
    time_period: "monthly"
    alert_threshold: 0.75
    block_on_exceed: false

# ============================================================================
# TENANT CONFIGURATION
# ============================================================================
tenants:
  - tenant_id: "letta-agents"
    api_key: os.environ/LETTA_AGENTS_API_KEY
    allowed_models:
      - default
      - fast
      - reasoning
      - coding
      - local/qwen-3.1-72b
      - omniroute/auto
    budget_id: "letta-agents"
    rate_limit:
      requests_per_minute: 100
      requests_per_hour: 2000

  - tenant_id: "openclaw"
    api_key: os.environ/OPENCLAW_API_KEY
    allowed_models:
      - claude/3-5-sonnet
      - claude/3-5-haiku
      - local/deepseek-r1
      - omniroute/auto
    budget_id: "development"
    rate_limit:
      requests_per_minute: 50
      requests_per_hour: 1000

  - tenant_id: "production"
    api_key: os.environ/PRODUCTION_API_KEY
    allowed_models:
      - claude/3-5-haiku
      - omniroute/fast
      - openrouter/nemotron-free
    budget_id: "production"
    rate_limit:
      requests_per_minute: 200
      requests_per_hour: 5000

# ============================================================================
# MONITORING & ALERTING
# ============================================================================
monitoring:
  prometheus:
    enabled: true
    port: 9090

  health_check_path: "/health"
  readiness_path: "/health/ready"
  liveness_path: "/health/live"

  alerts:
    - type: "cost"
      threshold: 0.80
      channels: ["email", "slack"]

    - type: "error_rate"
      threshold: 0.05
      window: 300
      channels: ["email", "slack"]

    - type: "latency"
      threshold: 5000
      percentile: 0.95
      channels: ["slack"]

    - type: "provider_health"
      threshold: 0.50
      channels: ["email", "slack", "pagerduty"]

# ============================================================================
# SECURITY
# ============================================================================
security:
  api_key_rotation_days: 90
  validate_requests: true
  max_request_size: 1048576
  sanitize_inputs: true
  audit_log_enabled: true
  audit_log_retention_days: 90
