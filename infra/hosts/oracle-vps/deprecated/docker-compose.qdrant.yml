# Qdrant Vector Database for Project Nyra Memory Stack
# Canonical location for vector embeddings (memory retrieval, semantic search)
#
# Deployment:
#   docker --context oracle-vps compose \
#     -f infra/hosts/oracle-vps/docker-compose.qdrant.yml \
#     up -d
#
# This stack provides:
#   - Qdrant: Vector database for semantic search (port 6333)
#   - Persistent storage: Named volume `qdrant_storage`
#   - Network: Joined to shared `nyra-network` for service discovery

name: nyra-qdrant

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
    external: true

volumes:
  qdrant_storage:
    name: nyra_qdrant_storage
    driver: local

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Qdrant Vector Database — Semantic Search Engine for Memory Stack
  #
  # Used by:
  #   - Letta (memory retrieval via embeddings)
  #   - mem0 (vector store backend)
  #   - Nexus Router (embedding-based routing)
  #   - Any service needing semantic similarity search
  #
  # API:
  #   - HTTP REST: http://localhost:6333
  #   - gRPC: localhost:6334
  #   - Web UI: http://localhost:6333/dashboard
  # ────────────────────────────────────────────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-qdrant
    restart: unless-stopped
    networks: [nyra-network]

    environment:
      # Qdrant configuration (via environment variables)
      # Read-only mode disabled (allows write operations)
      QDRANT_READ_ONLY_MODE: "false"

      # API key for authentication (optional but recommended)
      # Set to empty string to disable authentication
      # In production, use strong random key: openssl rand -base64 32
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # gRPC settings
      QDRANT_SERVICE_GRPC_PORT: "6334"

      # Storage settings
      QDRANT_STORAGE_SNAPSHOTS_PATH: "/qdrant/snapshots"

    volumes:
      # Persistent vector data storage
      - qdrant_storage:/qdrant/storage

      # Snapshots for backup/disaster recovery
      - qdrant_storage:/qdrant/snapshots

    ports:
      # HTTP REST API (accessed by memory services)
      - "127.0.0.1:6333:6333"

      # gRPC API (for high-performance client libraries)
      - "127.0.0.1:6334:6334"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

    # Resource constraints (adjust based on available memory)
    # Qdrant is memory-intensive; monitor with: docker stats
    # For 64GB system: set to ~8GB limit; for 32GB: ~4GB; for smaller: ~1-2GB
    # cpus: "4.0"
    # mem_limit: "8g"

# ════════════════════════════════════════════════════════════════════════════════
# NETWORK NOTE
# ════════════════════════════════════════════════════════════════════════════════
# nyra-network is created and managed by the main oracle-vps/docker-compose.yml
# If deploying Qdrant independently (without main compose), create the network:
#
#   docker network create nyra-network
#
# Verify network exists:
#
#   docker network ls | grep nyra-network
#
# ════════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT & VERIFICATION
# ════════════════════════════════════════════════════════════════════════════════
#
# 1. Deploy:
#    docker --context oracle-vps compose -f docker-compose.qdrant.yml up -d
#
# 2. Check health:
#    docker --context oracle-vps exec nyra-qdrant curl -f http://localhost:6333/health
#    Should return: {"status":"ok"}
#
# 3. Access Web UI (from machine with Tailscale access):
#    https://qdrant.trex-fiordland.ts.net
#    (Once Caddy reverse proxy is configured in Caddyfile)
#
# 4. Check collection count:
#    docker --context oracle-vps exec nyra-qdrant \
#      curl http://localhost:6333/collections | jq .
#
# 5. Monitor logs:
#    docker --context oracle-vps logs -f nyra-qdrant
#
# ════════════════════════════════════════════════════════════════════════════════
# INTEGRATION WITH MEMORY STACK
# ════════════════════════════════════════════════════════════════════════════════
#
# Letta Configuration (docker-compose.letta-mcp.yml):
#   - Set LETTA_MEMORY_BACKEND=qdrant
#   - Set QDRANT_URL=http://qdrant:6333
#
# mem0 Configuration:
#   - Set MEMORY_STORE_TYPE=qdrant
#   - Set QDRANT_HOST=qdrant (docker hostname)
#   - Set QDRANT_PORT=6333
#
# Nexus Router Configuration:
#   - Optional: Add Qdrant as embedding store for semantic routing
#
# ════════════════════════════════════════════════════════════════════════════════
# BACKUP & DISASTER RECOVERY
# ════════════════════════════════════════════════════════════════════════════════
#
# Snapshots (point-in-time backups):
#   Qdrant stores snapshots in /qdrant/snapshots (persisted in Docker volume)
#
# Manual snapshot:
#   docker --context oracle-vps exec nyra-qdrant \
#     curl -X POST http://localhost:6333/snapshots
#
# List snapshots:
#   docker --context oracle-vps exec nyra-qdrant \
#     curl http://localhost:6333/snapshots | jq .
#
# Restore from snapshot:
#   docker --context oracle-vps exec nyra-qdrant \
#     curl -X PUT http://localhost:6333/snapshots/restore/<snapshot-name>
#
# Full volume backup (use Docker volume backup mechanisms):
#   docker volume inspect nyra_qdrant_storage  # Shows mount path
#
