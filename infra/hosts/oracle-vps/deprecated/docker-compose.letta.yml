# Letta Memory Orchestrator + MCP Server
# Central memory management for Project Nyra agents
#
# Deployment:
#   docker --context oracle-vps compose \
#     -f infra/hosts/oracle-vps/docker-compose.yml \
#     -f infra/hosts/oracle-vps/docker-compose.letta.yml \
#     -f infra/hosts/oracle-vps/docker-compose.memory.yml \
#     up -d
#
# Note: Deploy after Qdrant and FalkorDB are ready
#
# Letta provides:
#   - Memory management for AI agents (conversation history, context)
#   - Connections to Qdrant (vector store) and FalkorDB (graph store)
#   - MCP server for Claude/other AI clients
#   - Long-term memory persistence across sessions
#   - Memory summarization and cleanup

name: nyra-letta

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
    external: true

volumes:
  letta_data:
    name: nyra_letta_data
    driver: local

services:
  # ────────────────────────────────────────────────────────────────────────────
  # Letta Server — Memory Management & Agent Orchestration
  #
  # Purpose:
  #   - Manages conversation context and long-term memory for agents
  #   - Stores agent state, message history, context windows
  #   - Integrates with Qdrant for semantic memory retrieval
  #   - Integrates with FalkorDB for relationship tracking
  #   - Exposes HTTP API (port 8283) for agent interaction
  #
  # Clients:
  #   - Nexus Router (queries memory before routing decisions)
  #   - Claude agents (memory context via MCP)
  #   - Workflow engines (n8n, Activepieces)
  # ────────────────────────────────────────────────────────────────────────────
  letta:
    image: letta-ai/letta:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-letta
    restart: unless-stopped
    networks: [nyra-network]

    depends_on:
      # Wait for memory backends to be healthy
      qdrant:
        condition: service_healthy
      falkordb:
        condition: service_healthy

    environment:
      # Core Letta Configuration
      LETTA_SERVER_NAME: "Nyra Memory Engine"
      LETTA_DEBUG: "false"
      LETTA_LOG_LEVEL: "INFO"

      # ───────────────────────────────────────────────────────────────────────
      # Memory Store Configuration (Vector Database)
      # ───────────────────────────────────────────────────────────────────────
      # Qdrant stores embeddings for semantic search
      LETTA_MEMORY_BACKEND: "qdrant"
      LETTA_QDRANT_URL: "http://qdrant:6333"
      LETTA_QDRANT_API_KEY: ${QDRANT_API_KEY:-}

      # Vector embedding model (what to use for embeddings)
      LETTA_EMBEDDING_MODEL: "sentence-transformers/all-MiniLM-L6-v2"

      # ───────────────────────────────────────────────────────────────────────
      # Graph Database Configuration (Entity Relationships)
      # ───────────────────────────────────────────────────────────────────────
      # FalkorDB stores semantic relationships
      LETTA_GRAPH_DATABASE: "falkordb"
      LETTA_GRAPH_HOST: "falkordb"
      LETTA_GRAPH_PORT: "6379"
      LETTA_GRAPH_DATABASE_NAME: "mem0"

      # ───────────────────────────────────────────────────────────────────────
      # Message History & Context
      # ───────────────────────────────────────────────────────────────────────
      # Maximum context window (number of recent messages to keep)
      LETTA_CONTEXT_WINDOW_SIZE: "10"

      # Summarization strategy (how to compress old messages)
      LETTA_SUMMARIZATION_ENABLED: "true"
      LETTA_SUMMARIZATION_MODEL: "local" # Use local LLM for summarization

      # ───────────────────────────────────────────────────────────────────────
      # Server & API Configuration
      # ───────────────────────────────────────────────────────────────────────
      # HTTP API binding
      LETTA_HOST: "0.0.0.0"
      LETTA_PORT: "8283"

      # API authentication
      LETTA_API_KEY: ${LETTA_API_KEY:-}

      # ───────────────────────────────────────────────────────────────────────
      # Database Configuration (Letta's internal state)
      # ───────────────────────────────────────────────────────────────────────
      # Letta stores agents, conversations, users in its own database
      LETTA_DATABASE_URL: "sqlite:////data/letta.db"

      # ───────────────────────────────────────────────────────────────────────
      # MCP (Model Context Protocol) Server Configuration
      # ───────────────────────────────────────────────────────────────────────
      # MCP allows Claude and other AI clients to query Letta memory
      LETTA_MCP_ENABLED: "true"
      LETTA_MCP_PORT: "8284"
      LETTA_MCP_SOCKET_TYPE: "stdio"

    volumes:
      # Persistent state and internal database
      - letta_data:/data

    ports:
      # HTTP API
      - "127.0.0.1:8283:8283"

      # MCP Server (for Claude integration)
      - "127.0.0.1:8284:8284"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/api/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "10"

# ════════════════════════════════════════════════════════════════════════════════
# DEPLOYMENT ORDER
# ════════════════════════════════════════════════════════════════════════════════
#
# 1. Deploy Qdrant (vector store):
#    docker --context oracle-vps compose -f docker-compose.qdrant.yml up -d
#
# 2. Deploy FalkorDB (graph store):
#    docker --context oracle-vps compose -f docker-compose.falkordb.yml up -d
#
# 3. Wait for both to be healthy:
#    docker --context oracle-vps exec nyra-qdrant curl -f http://localhost:6333/health
#    docker --context oracle-vps exec nyra-falkordb redis-cli ping
#
# 4. Deploy Letta (will automatically connect to both):
#    docker --context oracle-vps compose -f docker-compose.letta.yml up -d
#
# ════════════════════════════════════════════════════════════════════════════════
# VERIFICATION
# ════════════════════════════════════════════════════════════════════════════════
#
# 1. Check Letta health:
#    docker --context oracle-vps exec nyra-letta \
#      curl -f http://localhost:8283/api/health | jq .
#
# 2. Check MCP server is listening:
#    docker --context oracle-vps exec nyra-letta \
#      curl -f http://localhost:8284/health | jq .
#
# 3. List agents:
#    docker --context oracle-vps exec nyra-letta \
#      curl http://localhost:8283/api/agents | jq .
#
# 4. Verify Qdrant connection:
#    docker --context oracle-vps logs nyra-letta | grep -i "qdrant\|vector"
#
# 5. Verify FalkorDB connection:
#    docker --context oracle-vps logs nyra-letta | grep -i "falkordb\|graph"
#
# ════════════════════════════════════════════════════════════════════════════════
# AGENT MEMORY CONFIGURATION
# ════════════════════════════════════════════════════════════════════════════════
#
# When creating agents in Letta, specify memory parameters:
#
#   {
#     "name": "mortgage_specialist",
#     "memory_backend": "qdrant",
#     "context_window": 10,
#     "summarization_enabled": true,
#     "graph_database": "falkordb"
#   }
#
# Letta will automatically:
#   - Store conversation embeddings in Qdrant
#   - Update entity relationships in FalkorDB
#   - Retrieve relevant context for each message
#
# ════════════════════════════════════════════════════════════════════════════════
# INTEGRATION WITH MEM0
# ════════════════════════════════════════════════════════════════════════════════
#
# Letta and mem0 both use the same Qdrant + FalkorDB backends:
#
#   Letta: handles agent conversation memory, message history, context windows
#   mem0:  handles enterprise memory, summarization, knowledge graphs
#
# Together they provide:
#   - Short-term: conversation context (Letta)
#   - Long-term: enterprise knowledge (mem0)
#   - Semantic: vector search across both stores (Qdrant)
#   - Relational: entity graphs (FalkorDB)
#
# ════════════════════════════════════════════════════════════════════════════════
# MCP CLIENT INTEGRATION
# ════════════════════════════════════════════════════════════════════════════════
#
# Claude Code / Claude IDE can query Letta memory via MCP:
#
#   In .claude/mcp-servers.json or claude_desktop_config.json:
#     {
#       "letta-mcp": {
#         "command": "docker",
#         "args": ["exec", "nyra-letta-mcp", "letta", "mcp", "run"],
#         "stdio": true
#       }
#     }
#
# Available MCP tools:
#   - letta_retrieve_memory(query: str) -> List[str]
#   - letta_store_memory(key: str, value: str)
#   - letta_query_graph(cypher: str) -> List[Dict]
#   - letta_update_entity(entity_id: str, properties: Dict)
#
# ════════════════════════════════════════════════════════════════════════════════
# TROUBLESHOOTING
# ════════════════════════════════════════════════════════════════════════════════
#
# Connection refused (Qdrant/FalkorDB):
#   - Verify Qdrant and FalkorDB are running and healthy
#   - Check Docker network connectivity: docker network inspect nyra-network
#   - Verify hostnames resolve: docker exec nyra-letta ping qdrant
#
# Memory not persisting:
#   - Check volume mount: docker volume inspect nyra_letta_data
#   - Verify database file exists: docker exec nyra-letta ls -la /data/
#   - Check disk space: docker exec nyra-letta df -h /data
#
# MCP server not responding:
#   - Check MCP port: docker exec nyra-letta curl -f http://localhost:8284/health
#   - Verify MCP is enabled: docker exec nyra-letta env | grep LETTA_MCP
#
