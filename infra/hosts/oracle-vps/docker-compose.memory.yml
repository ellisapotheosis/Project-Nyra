# Oracle VPS memory backend — Consolidated stack.
# Mem0 manages runtime memory with FalkorDB as graph substrate.
# OpenWebUI serves as the chat interface for Archon OS and borrower interactions.

name: nyra-memory

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  security_opt:
    - no-new-privileges:true

services:
  mem0:
    <<: *common
    build:
      context: ../../..
      dockerfile: services/mem0/Dockerfile
    image: ${MEM0_IMAGE:-nyra/mem0-rest:local}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-mem0
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      FALKORDB_URL: redis://falkordb:6379
      MEM0_ENVIRONMENT: production
    depends_on:
      falkordb:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEM0_HOST_PORT:-5001}:5000
    networks:
      memory_private: {}
      memory_edge: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:5000/health >/dev/null 2>&1 || curl -fsS http://127.0.0.1:5000/health >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20

  falkordb:
    <<: *common
    image: falkordb/falkordb:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-falkordb
    environment:
      FALKORDB_ARGS: >-
        THREAD_COUNT ${FALKORDB_THREADS:-4}
        CACHE_SIZE ${FALKORDB_CACHE_SIZE_MB:-2048}
        TIMEOUT_MAX ${FALKORDB_TIMEOUT_MAX_MS:-60000}
        TIMEOUT_DEFAULT ${FALKORDB_TIMEOUT_DEFAULT_MS:-30000}
        QUERY_MEM_CAPACITY ${FALKORDB_QUERY_MEM_CAPACITY:-536870912}
    volumes:
      - falkordb_data:/data
    networks:
      memory_private:
        aliases:
          - graph-store
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "-p", "6379", "PING"]
      interval: 10s
      timeout: 3s
      retries: 20

networks:
  memory_edge:
    name: nyra_memory_edge
  memory_private:
    name: nyra_memory_private
    internal: true

volumes:
  falkordb_data:
