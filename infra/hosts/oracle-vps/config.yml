name: nyra-network
networks:
  nyra_net:
    external: true
    name: nyra_net
services:
  activepieces:
    container_name: nyra-activepieces
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      redis-cache:
        condition: service_healthy
        required: true
    environment:
      AP_DB_TYPE: ${AP_DB_TYPE:-POSTGRES}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-UNSANDBOXED}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-https://active.projectnyra.com}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:-activepieces}
      AP_POSTGRES_HOST: ${AP_POSTGRES_HOST:-nyra-postgres}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_POSTGRES_PORT: ${AP_POSTGRES_PORT:-5432}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:-nyra}
      AP_REDIS_HOST: ${AP_REDIS_HOST:-nyra-redis-cache}
      AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:-}
      AP_REDIS_PORT: ${AP_REDIS_PORT:-6379}
      AP_TELEMETRY_ENABLED: ${AP_TELEMETRY_ENABLED:-false}
    image: activepieces/activepieces:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8080"
        target: 80
    restart: unless-stopped
  admin:
    build:
      args:
        APP_NAME: nyra-admin
        APP_PATH: apps/admin/app
      context: /home/ellisapotheosis/repos/project-nyra
      dockerfile: infra/images/Dockerfile.nextjs
    container_name: nyra-admin
    environment:
      - PORT=3002
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CRM_API_URL=http://nyra-crm-api:4001
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3002"
        target: 3002
    profiles:
      - apps
    restart: unless-stopped
  cadvisor:
    container_name: nyra-cadvisor
    image: gcr.io/cadvisor/cadvisor:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8081"
        target: 8080
    privileged: true
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: /
        target: /rootfs
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /var/run
        target: /var/run
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /sys
        target: /sys
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /var/lib/docker
        target: /var/lib/docker
        type: bind
  campaign_engine:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/campaign-engine
      dockerfile: Dockerfile
    container_name: nyra-campaign-engine
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - N8N_BASE_URL=http://nyra-n8n:5678
      - N8N_WEBHOOK_URL=http://nyra-n8n:5678/webhook/nyra/dispatch
      - ACTIVEPIECES_BASE_URL=http://nyra-activepieces:8080
      - LOG_LEVEL=info
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8020"
        target: 8020
    profiles:
      - apps
    restart: unless-stopped
  cloudflared:
    command:
      - tunnel
      - run
      - --token
      - ${ORACLE_TUNNEL_TOKEN}
    container_name: nyra-cloudflared
    depends_on:
      secrets-init:
        condition: service_completed_successfully
        required: true
    environment:
      - ORACLE_TUNNEL_TOKEN=${ORACLE_TUNNEL_TOKEN}
    image: cloudflare/cloudflared:latest
    networks:
      nyra_net: null
    restart: unless-stopped
  crm-api:
    build:
      context: /home/ellisapotheosis/repos/project-nyra
      dockerfile: services/crm-api/Dockerfile
    container_name: nyra-crm-api
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      twenty:
        condition: service_started
        required: true
    environment:
      CRM_API_KEY: ${CRM_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      PORT: 4001
      QUOTE_ENGINE_URL: http://quote_engine:5000
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      TWENTY_CRM_URL: http://twenty:3000
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "4001"
        target: 4001
    restart: unless-stopped
  falkordb:
    container_name: nyra-falkordb
    healthcheck:
      interval: 10s
      retries: 5
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 5s
    image: falkordb/falkordb:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "6381"
        target: 6379
    restart: unless-stopped
    volumes:
      - source: falkordb_data
        target: /data
        type: volume
        volume: {}
  gitea:
    container_name: nyra-gitea
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      GITEA__actions__ENABLED: "true"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__database__USER: ${GITEA_DB_USER:-nyra}
      GITEA__mirror__DEFAULT_INTERVAL: 10m
      GITEA__mirror__ENABLED: "true"
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-git.oracle.trex-fiordland.ts.net}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.oracle.trex-fiordland.ts.net/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-oracle.trex-fiordland.ts.net}
      GITEA__server__SSH_LISTEN_PORT: 2222
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: github.com,api.github.com
      USER_GID: ${GITEA_GID:-1000}
      USER_UID: ${GITEA_UID:-1000}
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/api/healthz
      timeout: 10s
    hostname: gitea
    image: gitea/gitea:1.21-rootless
    networks:
      nyra_net: null
    ports:
      - ${GITEA_HTTP_PORT:-3001}:3000
      - ${GITEA_SSH_PORT:-2222}:2222
    restart: unless-stopped
    volumes:
      - source: gitea_data
        target: /var/lib/gitea
        type: volume
        volume: {}
      - source: gitea_config
        target: /etc/gitea
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: /etc/timezone
        target: /etc/timezone
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /etc/localtime
        target: /etc/localtime
        type: bind
      - read_only: true
        source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  gitea-mcp:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/gitea-mcp
      dockerfile: Dockerfile
    container_name: nyra-gitea-mcp
    depends_on:
      gitea:
        condition: service_healthy
        required: true
    environment:
      GITEA_URL: http://gitea:3000
      PORT: ${GITEA_MCP_PORT:-3100}
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3100/health
      timeout: 10s
    networks:
      nyra_net: null
    ports:
      - ${GITEA_MCP_PORT:-3100}:3100
    restart: unless-stopped
  gitea-runner:
    container_name: nyra-gitea-runner
    depends_on:
      gitea:
        condition: service_healthy
        required: true
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:20,self-hosted:host}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-nyra-runner-01}
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
    hostname: gitea-runner
    image: gitea/act_runner:latest
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - source: gitea_runner_data
        target: /data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ellisapotheosis/repos/project-nyra/infra/configs/gitea/runner-config.yaml
        target: /config.yaml
        type: bind
      - read_only: true
        source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  github-mirror-sync:
    command:
      - |
        while true; do
          /bin/sh /mirror-sync.sh || true
          sleep "$${MIRROR_INTERVAL_SECONDS}"
        done
    container_name: nyra-github-mirror
    depends_on:
      gitea:
        condition: service_healthy
        required: true
    entrypoint:
      - /bin/sh
      - -c
    environment:
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_URL: http://gitea:3000
      GITHUB_REPO: ${GITHUB_REPO:-ellisapotheosis/Project-Nyra}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MIRROR_INTERVAL_SECONDS: ${GITHUB_MIRROR_INTERVAL_SECONDS:-600}
    hostname: github-mirror
    image: alpine/git:latest
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - read_only: true
        source: gitea_data
        target: /var/lib/gitea
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ellisapotheosis/repos/project-nyra/infra/configs/gitea/mirror-sync.sh
        target: /mirror-sync.sh
        type: bind
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ubuntu/.ssh
        target: /root/.ssh
        type: bind
  grafana:
    container_name: nyra-grafana
    depends_on:
      loki:
        condition: service_started
        required: true
      prometheus:
        condition: service_started
        required: true
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    image: grafana/grafana:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3003"
        target: 3000
    restart: unless-stopped
    volumes:
      - source: grafana_data
        target: /var/lib/grafana
        type: volume
        volume: {}
  infisical-agent:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/infra/infisical-secrets-init
      dockerfile: Dockerfile
    container_name: nyra-infisical-agent
    depends_on:
      secrets-init:
        condition: service_completed_successfully
        required: true
    entrypoint:
      - /usr/local/bin/agent-sidecar.sh
    environment:
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  infisical-mcp:
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - npx -y @infisical/mcp
      - --port
      - "8766"
    container_name: nyra-infisical-mcp
    environment:
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENV:-prod}
      INFISICAL_FOLDER_PATH: ${INFISICAL_PATH:-/shared}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
    image: node:20-alpine
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8766"
        target: 8766
    restart: unless-stopped
  landing:
    build:
      args:
        APP_NAME: ratehunter-landing
        APP_PATH: apps/ratehunter/landing
      context: /home/ellisapotheosis/repos/project-nyra
      dockerfile: infra/images/Dockerfile.nextjs
    container_name: nyra-landing
    environment:
      - PORT=3003
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3003"
        target: 3003
    profiles:
      - apps
    restart: unless-stopped
  loki:
    command: -config.file=/etc/loki/local-config.yaml
    container_name: nyra-loki
    image: grafana/loki:3.4.3
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3100"
        target: 3100
    restart: unless-stopped
    volumes:
      - source: loki_data
        target: /loki
        type: volume
        volume: {}
  mem0-rest:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/mem0
      dockerfile: Dockerfile
    container_name: nyra-mem0-rest
    depends_on:
      falkordb:
        condition: service_healthy
        required: true
      qdrant:
        condition: service_started
        required: true
    environment:
      FALKORDB_URL: redis://nyra-falkordb:6379
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
      LITELLM_API_URL: ${LITELLM_API_BASE:-http://orchestrator.trex-fiordland.ts.net:4000/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: nyra-qdrant
      QDRANT_PORT: "6333"
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - curl
        - -f
        - http://localhost:5000/health
      timeout: 10s
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "5000"
        target: 5000
    restart: unless-stopped
  n8n:
    build:
      args:
        N8N_EXTRA_PACKAGES: ${N8N_EXTRA_PACKAGES:-}
        N8N_TWENTY_NODES_GIT: ${N8N_TWENTY_NODES_GIT:-}
      context: /home/ellisapotheosis/repos/project-nyra
      dockerfile: infra/images/n8n/Dockerfile
    container_name: nyra-n8n
    depends_on:
      postgres:
        condition: service_healthy
        required: true
      secrets-init:
        condition: service_completed_successfully
        required: true
    environment:
      CRM_API_KEY: ${CRM_API_KEY:-}
      CRM_API_URL: http://crm-api:4001
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-nyra-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_TYPE: postgresdb
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      N8N_SKIP_WEBHOOK_DNS_CHECK: ${N8N_SKIP_WEBHOOK_DNS_CHECK:-true}
      N8N_WORKFLOW_URL: ${WEBHOOK_URL:-https://n8n.projectnyra.com}
      OFFICE_PHONE: ${OFFICE_PHONE:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      WEBHOOK_URL: ${WEBHOOK_URL}
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "5678"
        target: 5678
    restart: unless-stopped
    volumes:
      - source: n8n_data
        target: /home/node/.n8n
        type: volume
        volume: {}
      - read_only: true
        source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ellisapotheosis/repos/project-nyra/infra/n8n-workflows
        target: /opt/nyra/n8n-workflows
        type: bind
  nexus:
    container_name: nyra-nexus
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
    healthcheck:
      interval: 15s
      retries: 5
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3000/health
      timeout: 5s
    image: ghcr.io/grafbase/nexus:stable
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "6000"
        target: 3000
    restart: unless-stopped
    volumes:
      - bind:
        create_host_path: true
        read_only: true
        source: /home/ubuntu/project-nyra/infra/hosts/oracle-vps/nexus.toml
        target: /etc/nexus.toml
        type: bind
      - read_only: true
        source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  openmemory-mcp:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/openmemory-mcp
      dockerfile: Dockerfile
    container_name: nyra-openmemory-mcp
    depends_on:
      qdrant:
        condition: service_started
        required: true
    environment:
      EMBEDDER_MODEL: text-embedding-3-small
      EMBEDDER_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      LLM_PROVIDER: openai
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: nyra-qdrant
      QDRANT_PORT: "6333"
      USER: nyra
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - curl
        - -f
        - http://localhost:8765/docs
      timeout: 10s
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8765"
        target: 8765
    restart: unless-stopped
  openwebui:
    container_name: nyra-openwebui
    environment:
      OPENAI_API_BASE_URL: ${LITELLM_BASE_URL:-http://orchestrator.trex-fiordland.ts.net:4000/v1}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
    image: ghcr.io/open-webui/open-webui:main
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "8088"
        target: 8080
    restart: unless-stopped
    volumes:
      - source: openwebui_data
        target: /app/backend/data
        type: volume
        volume: {}
  gastown:
    container_name: nyra-network-gastown
    image: nyra-gastown:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        protocol: tcp
        published: "8096"
        target: 8080
    restart: unless-stopped
    volumes:
      - source: gastown_agent_home
        target: /home/agent
        type: volume
        volume: {}
      - source: gastown_workspace
        target: /gt
        type: volume
        volume: {}
      - source: gastown_dolt_data
        target: /gt/.dolt-data
        type: volume
        volume: {}
  portainer:
    command:
      - --http-enabled
      - --admin-password=${PORTAINER_ADMIN_PASSWORD}
    container_name: nyra-portainer
    image: portainer/portainer-ce:2.27.9
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "9000"
        target: 9000
      - mode: ingress
        protocol: tcp
        published: "9443"
        target: 9443
    restart: unless-stopped
    volumes:
      - source: portainer_data
        target: /data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
  portainer-edge-agent:
    container_name: nyra-portainer-agent
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,oracle,edge}
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
    image: portainer/agent:2.27.9
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        source: /var/run/docker.sock
        target: /var/run/docker.sock
        type: bind
      - bind:
          create_host_path: true
        source: /var/lib/docker/volumes
        target: /var/lib/docker/volumes
        type: bind
  postgres:
    container_name: nyra-postgres
    depends_on:
      secrets-init:
        condition: service_completed_successfully
        required: true
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_PASSWORD_FILE: /run/nyra-secrets/postgres_password
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD-SHELL
        - pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}
      timeout: 5s
    image: postgres:15
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - source: postgres_data
        target: /var/lib/postgresql/data
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ubuntu/project-nyra/infra/hosts/oracle-vps/initdb
        target: /docker-entrypoint-initdb.d
        type: bind
      - read_only: true
        source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  prometheus:
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    container_name: nyra-prometheus
    image: prom/prometheus:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "9090"
        target: 9090
    restart: unless-stopped
    volumes:
      - source: prometheus_data
        target: /prometheus
        type: volume
        volume: {}
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ubuntu/project-nyra/infra/hosts/oracle-vps/configs/prometheus.yml
        target: /etc/prometheus/prometheus.yml
        type: bind
  qdrant:
    container_name: nyra-qdrant
    image: qdrant/qdrant:latest
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - source: qdrant_data
        target: /qdrant/storage
        type: volume
        volume: {}
  quote-api:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/quote-api
      dockerfile: Dockerfile
    container_name: nyra-quote-api
    environment:
      PORT: ${QUOTE_API_PORT:-7070}
      QUOTE_API_SECRET: ${QUOTE_API_SECRET}
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "7070"
        target: 7070
    restart: unless-stopped
  quote_engine:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-quote-engine
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "5000"
        target: 5000
    profiles:
      - apps
    restart: unless-stopped
  redis-cache:
    command:
      - redis-server
      - --appendonly
      - "yes"
    container_name: nyra-redis-cache
    healthcheck:
      interval: 10s
      retries: 10
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 3s
    image: redis:7-alpine
    networks:
      nyra_net: null
    restart: unless-stopped
    volumes:
      - source: redis_cache_data
        target: /data
        type: volume
        volume: {}
  secrets-init:
    build:
      context: /home/ellisapotheosis/repos/project-nyra/infra/infisical-secrets-init
      dockerfile: Dockerfile
    command:
      - /usr/local/bin/secrets-init.sh
    container_name: nyra-secrets-init
    environment:
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ORACLE_TUNNEL_TOKEN: ${ORACLE_TUNNEL_TOKEN:-}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    networks:
      nyra_net: null
    restart: "no"
    volumes:
      - source: nyra_secrets
        target: /run/nyra-secrets
        type: volume
        volume: {}
  twenty:
    container_name: nyra-twenty
    depends_on:
      postgres:
        condition: service_healthy
        required: true
    environment:
      APP_SECRET: ${TWENTY_APP_SECRET}
      FRONTEND_URL: ${TWENTY_FRONTEND_URL}
      NODE_PORT: 3000
      PG_DATABASE_URL: ${TWENTY_PG_DATABASE_URL}
      REDIS_URL: ${TWENTY_REDIS_URL:-redis://nyra-redis-cache:6379}
      SERVER_URL: ${TWENTY_SERVER_URL}
      STORAGE_TYPE: local
    image: twentycrm/twenty:latest
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3000"
        target: 3000
    restart: unless-stopped
    volumes:
      - source: twenty_local_storage
        target: /app/packages/twenty-server/.local-storage
        type: volume
        volume: {}
      - source: twenty_docker_data
        target: /app/docker-data
        type: volume
        volume: {}
  twentycrm-mcp:
    command:
      - sh
      - -c
      - npm install && npm start
    container_name: nyra-twentycrm-mcp
    depends_on:
      twenty:
        condition: service_started
        required: true
    environment:
      MCP_SERVER_PORT: 3022
      NODE_ENV: production
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      TWENTY_CRM_URL: http://twenty:3000
      TWENTY_CRM_WORKSPACE_ID: ${TWENTYCRM_WORKSPACE_ID:-default}
    healthcheck:
      interval: 30s
      retries: 3
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3022/health
      timeout: 10s
    image: node:20-alpine
    networks:
      nyra_net: null
    ports:
      - ${TWENTYCRM_MCP_PORT:-8182}:3022
    restart: unless-stopped
    volumes:
      - bind:
          create_host_path: true
        read_only: true
        source: /home/ellisapotheosis/repos/project-nyra/infra/services/twenty-crm-mcp-server
        target: /app
        type: bind
    working_dir: /app
  webapp:
    build:
      args:
        APP_NAME: mortgage-assistant
        APP_PATH: apps/projectnyra
      context: /home/ellisapotheosis/repos/project-nyra
      dockerfile: infra/images/Dockerfile.nextjs
    container_name: nyra-webapp
    environment:
      - PORT=3001
      - NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CRM_API_URL=http://nyra-crm-api:4001
    networks:
      nyra_net: null
    ports:
      - mode: ingress
        protocol: tcp
        published: "3001"
        target: 3001
    profiles:
      - apps
    restart: unless-stopped
volumes:
  falkordb_data:
    name: nyra-network_falkordb_data
  gitea_config:
    name: nyra-network_gitea_config
  gitea_data:
    name: nyra-network_gitea_data
  gitea_runner_data:
    name: nyra-network_gitea_runner_data
  grafana_data:
    name: nyra-network_grafana_data
  loki_data:
    name: nyra-network_loki_data
  n8n_data:
    name: nyra-network_n8n_data
  nyra_secrets:
    name: nyra-network_nyra_secrets
  openclaw_config:
    name: nyra-network_openclaw_config
  openclaw_workspace:
    name: nyra-network_openclaw_workspace
  openwebui_data:
    name: nyra-network_openwebui_data
  gastown_agent_home:
    name: nyra-network_gastown_agent_home
  gastown_workspace:
    name: nyra-network_gastown_workspace
  gastown_dolt_data:
    name: nyra-network_gastown_dolt_data
  portainer_data:
    name: nyra-network_portainer_data
  postgres_data:
    name: nyra-network_postgres_data
  prometheus_data:
    name: nyra-network_prometheus_data
  qdrant_data:
    name: nyra-network_qdrant_data
  redis_cache_data:
    name: nyra-network_redis_cache_data
  twenty_docker_data:
    name: nyra-network_twenty_docker_data
  twenty_local_storage:
    name: nyra-network_twenty_local_storage
