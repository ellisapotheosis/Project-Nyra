# Monitoring & Observability Stack
# Grafana, Prometheus, OpenLIT (LLM observability), Uptime-kuma
name: monitoring-stack

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"

services:
  prometheus:
    <<: *common
    image: prom/prometheus:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-prometheus
    environment:
      TZ: ${TZ:-UTC}
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
    ports:
      - "127.0.0.1:9090:9090"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

  grafana:
    <<: *common
    image: grafana/grafana:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
      GF_SERVER_ROOT_URL: https://grafana-oracle.projectnyra.com
      GF_SMTP_ENABLED: "true"
      GF_SMTP_HOST: ${GRAFANA_SMTP_HOST:-}
      GF_SMTP_PORT: ${GRAFANA_SMTP_PORT:-587}
      GF_SMTP_USER: ${GRAFANA_SMTP_USER:-}
      GF_SMTP_PASSWORD: ${GRAFANA_SMTP_PASSWORD:-}
      GF_SMTP_FROM_ADDRESS: ${GRAFANA_SMTP_FROM:-alerts@projectnyra.com}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    ports:
      - "127.0.0.1:3001:3000"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  openlit:
    <<: *common
    image: openlit/openlit:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-openlit
    environment:
      OTEL_EXPORTER_OTLP_ENDPOINT: http://prometheus:9090
      LOG_LEVEL: ${OPENLIT_LOG_LEVEL:-info}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/openlit
      OPENLIT_API_KEY: ${OPENLIT_API_KEY:?set OPENLIT_API_KEY}
      OPENLIT_ENVIRONMENT: production
    depends_on:
      - postgres
      - prometheus
    ports:
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:8088:8088"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8088/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  uptime-kuma:
    <<: *common
    image: louislam/uptime-kuma:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-uptime-kuma
    environment:
      WEBAUTHN_RP_ID: ${UPTIME_KUMA_RP_ID:-projectnyra.com}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
    volumes:
      - uptime_kuma_data:/app/data
    ports:
      - "127.0.0.1:3002:3001"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/"]
      interval: 60s
      timeout: 5s
      retries: 3

  cadvisor:
    <<: *common
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cadvisor
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3

  node-exporter:
    <<: *common
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-node-exporter
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    ports:
      - "127.0.0.1:9100:9100"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 5s
      retries: 3

  alertmanager:
    <<: *common
    image: prom/alertmanager:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-alertmanager
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"
    ports:
      - "127.0.0.1:9093:9093"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  nyra_net:
    external: true
    name: nyra_net

volumes:
  prometheus_data:
  grafana_data:
  uptime_kuma_data:
  alertmanager_data:
