# Oracle VPS async agent utilities.
# Public access should terminate at Cloudflare Access or an equivalent edge gate.

name: oracle-vps-oracle-agent-utils

x-common: &common
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "5"
  security_opt:
    - no-new-privileges:true

services:
  # Gastown replaced Gastown for Oracle agent workspace coordination.
  # Run it with docker-compose.gastown.yml so its source build and workspace
  # volumes stay isolated from the generic Oracle utility stack.

  searxng:
    <<: *common
    image: searxng/searxng:latest
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-searxng
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-https://search.projectnyra.com}
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET}
      SEARXNG_REDIS_URL: redis://searxng-redis:6379/0
      UWSGI_WORKERS: ${SEARXNG_UWSGI_WORKERS:-4}
      UWSGI_THREADS: ${SEARXNG_UWSGI_THREADS:-4}
    depends_on:
      searxng-redis:
        condition: service_healthy
    ports:
      - 127.0.0.1:${SEARXNG_HOST_PORT:-8082}:8080
    volumes:
      - searxng_cache:/var/cache/searxng
    networks:
      oracle_private: {}
      oracle_edge: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- http://127.0.0.1:8080/healthz >/dev/null 2>&1 || wget -q -O- http://127.0.0.1:8080/ >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20

  searxng-redis:
    <<: *common
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-searxng-redis
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      oracle_private: {}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10

  browserless:
    <<: *common
    image: ghcr.io/browserless/chromium:latest
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-browserless
    shm_size: 2gb
    environment:
      TOKEN: ${BROWSERLESS_TOKEN:?set BROWSERLESS_TOKEN}
      CONCURRENT: ${BROWSERLESS_CONCURRENT:-6}
      QUEUED: ${BROWSERLESS_QUEUED:-24}
      TIMEOUT: ${BROWSERLESS_TIMEOUT_MS:-90000}
      HEALTH: "true"
      ENABLE_CORS: "false"
      PREBOOT_CHROME: ${BROWSERLESS_PREBOOT_CHROME:-true}
      KEEP_ALIVE: ${BROWSERLESS_KEEP_ALIVE:-true}
      EXIT_ON_HEALTH_FAILURE: "true"
    ports:
      - 127.0.0.1:${BROWSERLESS_HOST_PORT:-3004}:3000
    tmpfs:
      - /tmp:size=2048m,noexec,nosuid,nodev
    networks:
      oracle_private: {}
      oracle_edge: {}
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q -O- 'http://127.0.0.1:3000/json/version?token=${BROWSERLESS_TOKEN}' >/dev/null 2>&1",
        ]
      interval: 15s
      timeout: 5s
      retries: 20

networks:
  oracle_edge:
    name: nyra_oracle_edge
  oracle_private:
    name: nyra_oracle_private
    internal: true

volumes:
  searxng_cache:
