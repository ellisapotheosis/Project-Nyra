name: nyra-network

services:

  # ── Infisical Sidecar (Secret Sync) ───────────────────────────────────────
  # Synchronizes secrets from Infisical to the local .env file.
  infisical-sidecar:
    image: infisical/cli:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-infisical-sidecar
    restart: unless-stopped
    env_file: [.env.oracle]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "while true; do infisical export --projectId=8374cea9-e5e8-4050-bda4-b91f25ab30ef --env=prod --path=/machines/oracle-vps --format=dotenv --silent > /repo/.env && sleep 60; done"
    volumes:
      - ./.env:/repo/.env
    networks: [nyra_net]

  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-portainer-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,oracle,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [nyra_net]

  postgres:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra_net]

  redis-cache:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nyra_net]

  twenty-db:
    image: postgres:15
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-twenty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_DB_USER:-twenty} -d ${TWENTY_DB_NAME:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nyra_net]

  twenty:
    image: twentycrm/twenty:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-twenty
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      SERVER_URL: https://twenty.ratehunter.net
      FRONTEND_URL: https://twenty.ratehunter.net
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/twenty
      REDIS_URL: redis://redis-cache:6379
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]
    ports:
      - "3000:3000"

  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty:
        condition: service_started
      twenty-db:
        condition: service_healthy
    environment:
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/twenty
      REDIS_URL: redis://redis-cache:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]

  twenty-mcp:
    image: ${TWENTY_MCP_IMAGE:-nyra-network-twenty-mcp:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-twenty-mcp
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      - TWENTY_BASE_URL=http://twenty:3000
      - TWENTY_API_URL=http://twenty:3000
      - TWENTY_GRAPHQL_URL=http://twenty:3000/graphql
      - TWENTY_API_KEY=${TWENTY_API_KEY:-${TWENTY_ACCESS_TOKEN:-}}
      - PORT=8400
    depends_on:
      twenty:
        condition: service_started
    networks: [nyra_net]

  activepieces:
    image: activepieces/activepieces:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-activepieces
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      AP_DB_TYPE: ${AP_DB_TYPE:-POSTGRES}
      AP_POSTGRES_HOST: ${AP_POSTGRES_HOST:-nyra-postgres}
      AP_POSTGRES_PORT: ${AP_POSTGRES_PORT:-5432}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:-activepieces}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:-nyra}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_REDIS_HOST: ${AP_REDIS_HOST:-nyra-redis-cache}
      AP_REDIS_PORT: ${AP_REDIS_PORT:-6379}
      AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:-}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-https://active.ratehunter.net}
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-UNSANDBOXED}
      AP_TELEMETRY_ENABLED: ${AP_TELEMETRY_ENABLED:-false}
    networks: [nyra_net]
    ports:
      - "8080:80"

  n8n:
    build:
      context: ../../../
      dockerfile: infra/images/n8n/Dockerfile
      args:
        N8N_TWENTY_NODES_GIT: ${N8N_TWENTY_NODES_GIT:-}
        N8N_EXTRA_PACKAGES: ${N8N_EXTRA_PACKAGES:-}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-nyra-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_SKIP_WEBHOOK_DNS_CHECK: ${N8N_SKIP_WEBHOOK_DNS_CHECK:-true}
      CRM_API_URL: http://crm-api:4001
      CRM_API_KEY: ${CRM_API_KEY:-}
      OFFICE_PHONE: ${OFFICE_PHONE:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      N8N_WORKFLOW_URL: ${WEBHOOK_URL:-https://n8n.ratehunter.net}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n-workflows:/opt/nyra/n8n-workflows:ro
    networks: [nyra_net]
    ports:
      - "5678:5678"

  quote-api:
    build:
      context: ../../../services/quote-api
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-quote-api
    restart: unless-stopped
    environment:
      PORT: ${QUOTE_API_PORT:-7070}
      QUOTE_API_SECRET: ${QUOTE_API_SECRET}
    networks: [nyra_net]
    ports:
      - "7070:7070"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-cloudflared
    restart: unless-stopped
    command: ["tunnel", "run", "--token", "${ORACLE_TUNNEL_TOKEN}"]
    environment:
      - ORACLE_TUNNEL_TOKEN=${ORACLE_TUNNEL_TOKEN}
    networks: [nyra_net]

  # ── Observability ─────────────────────────────────────────────────────────
  # Metrics, logs, and dashboards run on Oracle (always-on, latency-insensitive).
  # OpenWebUI points at Oracle-local LiteLLM.

  prometheus:
    image: prom/prometheus:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus_data:/prometheus
      - ${PWD}/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [nyra_net]

  loki:
    image: grafana/loki:3.4.3
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [nyra_net]

  grafana:
    image: grafana/grafana:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks: [nyra_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks: [nyra_net]

  # ── Chat UI ───────────────────────────────────────────────────────────────
  # OpenWebUI proxies all LLM requests to local Oracle LiteLLM.

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-openwebui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL:
        ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "8088:8080"
    networks: [nyra_net]

  # ── Memory System (Mem0 + FalkorDB) ───────────────────────────────────────
  # Primary memory layer for borrower profiles and cross-session knowledge.

  falkordb:
    image: falkordb/falkordb:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-falkordb
    restart: unless-stopped
    ports:
      - "6381:6379" # Mapped to 6381 to avoid conflict with nyra-redis-cache
    volumes:
      - falkordb_data:/data
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mem0-rest:
    build:
      context: ../../../services/mem0
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-mem0-rest
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      FALKORDB_URL: redis://falkordb:6379
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_API_BASE: ${LITELLM_API_BASE:-http://litellm:4000/v1}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "5000:5000"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Qdrant (vector backend for Mem0 and OpenMemory) ──────────────────────
  # Note: qdrant image is distroless (no curl/wget) — no healthcheck possible.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [nyra_net]

  # ── OpenMemory MCP (self-hosted mem0 MCP server) ─────────────────────────
  # Built from source: github.com/mem0ai/mem0/tree/main/openmemory/api.
  openmemory-mcp:
    build:
      context: ../../../services/openmemory-mcp
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-openmemory-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6333"
      USER: nyra
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      EMBEDDER_PROVIDER: openai
      EMBEDDER_MODEL: text-embedding-3-small
    ports:
      - "8765:8765"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Infisical MCP (stdio→SSE bridge via supergateway) ────────────────────
  # Converts @infisical/mcp stdio server to HTTP/SSE so Nexus can aggregate it.
  # Exposed on port 8766; Nexus connects at http://100.64.0.3:8766/sse
  infisical-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-infisical-mcp
    restart: unless-stopped
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENV:-prod}
      INFISICAL_FOLDER_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @infisical/mcp"
      - --port
      - "8766"
    ports:
      - "8766:8766"
    networks: [nyra_net]

  mempalace-mcp:
    build:
      context: ../../../services/mempalace-mcp
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-mempalace-mcp
    restart: unless-stopped
    command: ["python", "-m", "mempalace.mcp_server"]
    environment:
      PORT: 8000
      MEMPAL_DIR: /data/vault
    ports:
      - "8002:8000"
    volumes:
      - mempalace_data:/root/.mempalace
      - mempalace_vault:/data/vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]



  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-gitea
    hostname: gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${GITEA_UID:-1000}
      USER_GID: ${GITEA_GID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-nyra}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-git.oracle.trex-fiordland.ts.net}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.oracle.trex-fiordland.ts.net/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-oracle.trex-fiordland.ts.net}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 2222
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__mirror__ENABLED: "true"
      GITEA__mirror__DEFAULT_INTERVAL: 10m
      GITEA__webhook__ALLOWED_HOST_LIST: github.com,api.github.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-gitea-runner
    hostname: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../configs/gitea/runner-config.yaml:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-nyra-runner-01}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:20,self-hosted:host}
    networks: [nyra_net]

  github-mirror-sync:
    image: alpine/git:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-github-mirror
    hostname: github-mirror
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_data:/var/lib/gitea:ro
      - ../../configs/gitea/mirror-sync.sh:/mirror-sync.sh:ro
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-ellisapotheosis/Project-Nyra}
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      MIRROR_INTERVAL_SECONDS: ${GITHUB_MIRROR_INTERVAL_SECONDS:-600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /mirror-sync.sh || true
          sleep "$${MIRROR_INTERVAL_SECONDS}"
        done
    networks: [nyra_net]

  gitea-mcp:
    build:
      context: ../../../services/gitea-mcp
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-gitea-mcp
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      PORT: ${GITEA_MCP_PORT:-3101}
      GITEA_URL: http://gitea:3000
    ports:
      - "${GITEA_MCP_PORT:-3101}:3101"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  # ── Generic Git MCP (stdio→SSE bridge via supergateway) ──────────────────
  # Local Git repository operations for Gitea-backed repos. API-level Gitea
  # actions still go through gitea-mcp/Composio; raw git goes through this.
  git-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-git-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache git python3 py3-pip \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx mcp-server-git --repository /workspace" --port 8773
    ports:
      - "8773:8773"
    volumes:
      - ../../..:/workspace
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    networks: [nyra_net]

  quote_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/quote-engine
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-quote-engine
    restart: unless-stopped
    ports:
      - "8089:5000"
    networks: [nyra_net]

  crm-api:
    build:
      context: ../../../
      dockerfile: services/crm-api/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-crm-api
    restart: unless-stopped
    depends_on:
      twenty:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      TWENTY_CRM_URL: http://twenty:3000
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      QUOTE_ENGINE_URL: http://quote_engine:5000
      CRM_API_KEY: ${CRM_API_KEY:-}
    ports:
      - "4001:4001"
    networks: [nyra_net]

  campaign_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/campaign-engine
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-campaign-engine
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - N8N_BASE_URL=http://nyra-n8n:5678
      - N8N_WEBHOOK_URL=http://nyra-n8n:5678/webhook/nyra/dispatch
      - ACTIVEPIECES_BASE_URL=http://activepieces:80
      - LOG_LEVEL=info
    networks: [nyra_net]

  # ── Paperclip AI (Multi-Agent Orchestration) ─────────────────────────────
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-paperclip
    restart: unless-stopped
    environment:
      - PAPERCLIP_AUTH_DISABLE_SIGN_UP=true
      - PORT=3100
    volumes:
      - paperclip_data:/paperclip
    ports:
      - "3111:3100"
    networks: [nyra_net]

  # ── Paperclip MCP Server ─────────────────────────────────────────────────
  # Exposes Paperclip orchestration tools to the Nexus aggregator.
  paperclip-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-paperclip-mcp
    restart: unless-stopped
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      PAPERCLIP_API_URL: http://paperclip:3100
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-dummy}
    command:
      - npx
      - -y
      - supergateway
      - --sse
      - http://paperclip:3100/mcp
      - npx
      - -y
      - "@paperclipai/mcp-server"
      - --port
      - "8767"
    ports:
      - "8767:8767"
    networks: [nyra_net]

  # ── Magic UI MCP (stdio→SSE bridge via supergateway) ──────────────────────
  # Converts @magicuidesign/mcp stdio server to HTTP/SSE so Nexus can aggregate it.
  # Exposed on port 8768; Nexus connects at http://magicui-mcp:8768/sse.
  magicui-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-magicui-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - /bin/sh
      - -lc
      - |
        npm install -g shadxn \
          && npm install magicui-hooks magicui-utils \
          && npx -y supergateway --stdio "npx -y @magicuidesign/mcp@latest" --port 8768
    ports:
      - "8768:8768"
    volumes:
      - ../../apps/landing-page:/app
    networks: [nyra_net]

  # ── Nyra UI Factory ─────────────────────────────────────────────────────
  # Long-lived execution container for registry installs into /infra/apps/landing-page.
  nyra-ui-engine:
    image: node:20-alpine
    container_name: nyra-ui-engine
    restart: unless-stopped
    working_dir: /app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_COMPONENT_DIR: "@/components/magicui"
      NYRA_UI_HOOKS_DIR: "@/hooks"
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - tail
      - -f
      - /dev/null
    volumes:
      - ../../apps/landing-page:/app
    networks: [nyra_net]

  # ── shadcn Registry MCP (stdio→SSE bridge via supergateway) ──────────────
  # Registry browser/search sidecar bound to the same /app workspace.
  # Installs are executed through nyra-ui-engine with shadxn.
  shadcn-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-shadcn-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - /bin/sh
      - -lc
      - |
        npm install -g shadxn \
          && npx -y supergateway --stdio "npx -y shadcn@latest mcp" --port 8769
    ports:
      - "8769:8769"
    volumes:
      - ../../apps/landing-page:/app
    networks: [nyra_net]

  # ── Sequential Thinking MCP (stdio→SSE bridge via supergateway) ──────────
  sequential-thinking-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-sequential-thinking-mcp
    restart: unless-stopped
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @modelcontextprotocol/server-sequential-thinking"
      - --port
      - "8770"
    ports:
      - "8770:8770"
    networks: [nyra_net]

  # ── Playwright MCP (stdio→SSE bridge via supergateway) ───────────────────
  playwright-mcp:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-playwright-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command:
      - /bin/sh
      - -lc
      - |
        npx -y supergateway --stdio "npx -y @playwright/mcp@latest --browser chromium --headless --no-sandbox" --port 8771
    ports:
      - "8771:8771"
    volumes:
      - ../../..:/workspace:ro
    networks: [nyra_net]

  # ── Firecrawl MCP (stdio→SSE bridge via supergateway) ───────────────────
  firecrawl-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-firecrawl-mcp
    restart: unless-stopped
    environment:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y firecrawl-mcp"
      - --port
      - "8772"
    ports:
      - "8772:8772"
    networks: [nyra_net]

  # ── Next.js DevTools MCP (stdio→SSE bridge via supergateway) ─────────────
  # Discovers running Next.js dev servers and proxies their /_next/mcp tools.
  next-devtools-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-next-devtools-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NEXT_DEVTOOLS_WORKSPACE: /workspace
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y next-devtools-mcp@latest"
      - --port
      - "8774"
    ports:
      - "8774:8774"
    volumes:
      - ../../..:/workspace
    networks: [nyra_net]

  # ── Tavily MCP (stdio→SSE bridge via supergateway) ──────────────────────
  tavily-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-tavily-mcp
    restart: unless-stopped
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y tavily-mcp@latest"
      - --port
      - "8775"
    ports:
      - "8775:8775"
    networks: [nyra_net]

  # ── WCGW MCP (stdio→SSE bridge via supergateway) ────────────────────────
  # Shell/code execution workspace tools. Keep private behind Nexus only.
  wcgw-mcp:
    image: node:20-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-wcgw-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
      WCGW_WORKSPACE: /workspace
    command:
      - /bin/sh
      - -lc
      - |
        apt-get update \
          && apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates curl \
          && rm -rf /var/lib/apt/lists/* \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx --from wcgw@latest wcgw_mcp" --port 8776
    ports:
      - "8776:8776"
    volumes:
      - ../../..:/workspace
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    networks: [nyra_net]

  # ── Gitingest MCP (stdio→SSE bridge via supergateway) ───────────────────
  gitingest-mcp:
    image: node:20-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-gitingest-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache git python3 py3-pip \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx gitingestmcp@latest" --port 8777
    ports:
      - "8777:8777"
    volumes:
      - ../../..:/workspace:ro
    networks: [nyra_net]

  # ── Codebase Index MCP (stdio→SSE bridge via supergateway) ───────────────
  codebase-index-mcp:
    image: node:20-bookworm-slim
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-codebase-index-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      PROJECT_ROOT: /workspace
      NPM_CONFIG_CACHE: /tmp/.npm
      PIP_CACHE_DIR: /tmp/.pip-cache
    command:
      - /bin/sh
      - -lc
      - |
        apt-get update \
          && apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates \
          && rm -rf /var/lib/apt/lists/* \
          && pip install --break-system-packages "mcp-codebase-index[mcp]" \
          && npx -y supergateway --stdio "mcp-codebase-index" --port 8778
    ports:
      - "8778:8778"
    volumes:
      - ../../..:/workspace
    networks: [nyra_net]

  # ── Supabase Stack ────────────────────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "54322:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./initdb/supabase:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra_net]

  supabase-auth:
    image: supabase/gotrue:v2.132.3
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-supabase-auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}@supabase-db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-https://nyra.ratehunter.net}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      API_EXTERNAL_URL: ${SUPABASE_AUTH_EXTERNAL_URL:-https://api.ratehunter.net/auth/v1}
      GOTRUE_EXTERNAL_URL: ${SUPABASE_AUTH_EXTERNAL_URL:-https://api.ratehunter.net/auth/v1}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DB_MAX_POOL_SIZE: 20
    networks: [nyra_net]

  supabase-rest:
    image: postgrest/postgrest:v10.1.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}@supabase-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks: [nyra_net]

  supabase-kong:
    image: kong:2.8.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-supabase-kong
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
    volumes:
      - ./configs/supabase/kong.yml:/etc/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks: [nyra_net]

  # ── LiteLLM Proxy ─────────────────────────────────────────────────────────
  # Moved from orchestrator: co-located with Nexus to eliminate Tailscale hop.
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-litellm
    restart: unless-stopped
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/litellm
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    volumes:
      - ../../configs/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [nyra_net]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness', timeout=8)\""]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nexus Aggregator (Grafbase Nexus) ────────────────────────────────────
  # THE single entrypoint: MCP tool aggregation + LLM proxy
  ha-mcp:
    image: ${HA_MCP_IMAGE:-ghcr.io/homeassistant-ai/ha-mcp:7.4.0}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-ha-mcp
    restart: unless-stopped
    command: ["ha-mcp-web"]
    environment:
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL:-https://homeassistant.ratehunter.net}
      HOMEASSISTANT_TOKEN: ${HOMEASSISTANT_TOKEN:-${HOME_ASSISTANT_TOKEN:-${HOME_ASSISTANT_TOKEN_SECRET:-}}}
      BACKUP_HINT: ${HA_MCP_BACKUP_HINT:-normal}
      HAMCP_ENABLE_FILESYSTEM_TOOLS: ${HAMCP_ENABLE_FILESYSTEM_TOOLS:-false}
      ENABLE_YAML_CONFIG_EDITING: ${ENABLE_YAML_CONFIG_EDITING:-false}
      HAMCP_ENABLE_CUSTOM_COMPONENT_INTEGRATION: ${HAMCP_ENABLE_CUSTOM_COMPONENT_INTEGRATION:-false}
    networks: [nyra_net]

  nexus:
    image: ghcr.io/grafbase/nexus:stable
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-nexus
    restart: unless-stopped
    ports:
      - "6000:3000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MEMPALACE_URL: ${MEMPALACE_URL:-}
      LLXPRT_JEFE_BASE_URL: ${LLXPRT_JEFE_BASE_URL:-}
      LLXPRT_JEFE_API_KEY: ${LLXPRT_JEFE_API_KEY:-}
    volumes:
      - ./nexus.toml:/etc/nexus.toml:ro
    depends_on:
      ha-mcp:
        condition: service_started
      litellm:
        condition: service_healthy
      firecrawl-mcp:
        condition: service_started
      gitingest-mcp:
        condition: service_started
      git-mcp:
        condition: service_started
      magicui-mcp:
        condition: service_started
      next-devtools-mcp:
        condition: service_started
      playwright-mcp:
        condition: service_started
      codebase-index-mcp:
        condition: service_started
      sequential-thinking-mcp:
        condition: service_started
      tavily-mcp:
        condition: service_started
      wcgw-mcp:
        condition: service_started
      nyra-ui-engine:
        condition: service_started
      shadcn-mcp:
        condition: service_started
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /run/desktop/mnt/host/wsl/...:/var/syncthing/data/home
    restart: unless-stopped

networks:
  nyra_net:

volumes:
  postgres_data:
  litellm_data:
  twenty_db_data:
  redis_cache_data:
  twenty_local_storage:
  twenty_docker_data:
  n8n_data:
  openclaw_config:
  openclaw_workspace:
  prometheus_data:
  loki_data:
  grafana_data:
  openwebui_data:
  gitea_data:
  gitea_config:
  gitea_runner_data:
  falkordb_data:
  qdrant_data:
  mempalace_data:
  mempalace_vault:
  paperclip_data:
  syncthing_config:
  portainer_data:
  letta_db_data:
  letta_data:
  mem_os_data:
  supabase_db_data:
