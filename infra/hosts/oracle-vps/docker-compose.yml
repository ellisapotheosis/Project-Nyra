name: nyra-oracle

services:



  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-portainer-agent
    restart: unless-stopped
    env_file: [.env]
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,oracle,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [nyra_net]

  postgres:
    image: postgres:15
    container_name: nyra-postgres
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra_net]

  redis-cache:
    image: redis:7-alpine
    container_name: nyra-redis-cache
    restart: unless-stopped
    env_file: [.env]
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nyra_net]

  twenty-db:
    image: postgres:15
    container_name: nyra-twenty-db
    restart: unless-stopped
    env_file: [.env]
    environment:
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_DB_USER:-twenty} -d ${TWENTY_DB_NAME:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nyra_net]

  twenty:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      twenty-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      SERVER_URL: ${TWENTY_SERVER_URL}
      FRONTEND_URL: ${TWENTY_FRONTEND_URL}
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@nyra-twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      REDIS_URL: redis://nyra-redis-cache:6379
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]
    ports:
      - "3000:3000"

  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-worker
    restart: unless-stopped
    env_file: [.env]
    command: ["node", "packages/twenty-server/dist/src/main-worker.js"]
    depends_on:
      twenty:
        condition: service_started
      twenty-db:
        condition: service_healthy
    environment:
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@nyra-twenty-db:5432/${TWENTY_DB_NAME:-twenty}
      REDIS_URL: redis://nyra-redis-cache:6379
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      AP_DB_TYPE: ${AP_DB_TYPE:-POSTGRES}
      AP_POSTGRES_HOST: ${AP_POSTGRES_HOST:-nyra-postgres}
      AP_POSTGRES_PORT: ${AP_POSTGRES_PORT:-5432}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:-activepieces}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:-nyra}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_REDIS_HOST: ${AP_REDIS_HOST:-nyra-redis-cache}
      AP_REDIS_PORT: ${AP_REDIS_PORT:-6379}
      AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:-}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-https://active.ratehunter.net}
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-UNSANDBOXED}
      AP_TELEMETRY_ENABLED: ${AP_TELEMETRY_ENABLED:-false}
    networks: [nyra_net]
    ports:
      - "8080:80"

  n8n:
    build:
      context: ../../../
      dockerfile: infra/images/n8n/Dockerfile
      args:
        N8N_TWENTY_NODES_GIT: ${N8N_TWENTY_NODES_GIT:-}
        N8N_EXTRA_PACKAGES: ${N8N_EXTRA_PACKAGES:-}
    container_name: nyra-n8n
    restart: unless-stopped
    env_file: [.env]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-nyra-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_SKIP_WEBHOOK_DNS_CHECK: ${N8N_SKIP_WEBHOOK_DNS_CHECK:-true}
      CRM_API_URL: http://crm-api:4001
      CRM_API_KEY: ${CRM_API_KEY:-}
      OFFICE_PHONE: ${OFFICE_PHONE:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      N8N_WORKFLOW_URL: ${WEBHOOK_URL:-https://n8n.ratehunter.net}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n-workflows:/opt/nyra/n8n-workflows:ro
    networks: [nyra_net]
    ports:
      - "5678:5678"

  quote-api:
    build:
      context: ../../../services/quote-api
    container_name: nyra-quote-api
    restart: unless-stopped
    environment:
      PORT: ${QUOTE_API_PORT:-7070}
      QUOTE_API_SECRET: ${QUOTE_API_SECRET}
    networks: [nyra_net]
    ports:
      - "7070:7070"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    restart: unless-stopped
    env_file: [.env]
    command: ["tunnel", "run", "--token", "${ORACLE_TUNNEL_TOKEN}"]
    environment:
      - ORACLE_TUNNEL_TOKEN=${ORACLE_TUNNEL_TOKEN}
    networks: [nyra_net]

  # ── Observability ─────────────────────────────────────────────────────────
  # Metrics, logs, and dashboards run on Oracle (always-on, latency-insensitive).
  # OpenWebUI points back to orchestrator LiteLLM via Tailscale.

  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=15d'
    volumes:
      - prometheus_data:/prometheus
      - ${PWD}/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [nyra_net]

  loki:
    image: grafana/loki:3.4.3
    container_name: nyra-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [nyra_net]

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks: [nyra_net]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nyra-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks: [nyra_net]

  # ── Chat UI ───────────────────────────────────────────────────────────────
  # OpenWebUI proxies all LLM requests to LiteLLM on the orchestrator
  # via Tailscale (orchestrator.trex-fiordland.ts.net:4000).

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-openwebui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL:
        ${LITELLM_BASE_URL:-http://orchestrator.trex-fiordland.ts.net:4000/v1}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "8088:8080"
    networks: [nyra_net]

  # ── Memory System (Mem0 + FalkorDB) ───────────────────────────────────────
  # Primary memory layer for borrower profiles and cross-session knowledge.

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    ports:
      - "6381:6379" # Mapped to 6381 to avoid conflict with nyra-redis-cache
    volumes:
      - falkordb_data:/data
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mem0-rest:
    build:
      context: ../../../services/mem0
    container_name: nyra-mem0-rest
    restart: unless-stopped
    depends_on:
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_started
    environment:
      QDRANT_HOST: nyra-qdrant
      QDRANT_PORT: "6333"
      FALKORDB_URL: redis://nyra-falkordb:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      LITELLM_API_URL:
        ${LITELLM_API_BASE:-http://orchestrator.trex-fiordland.ts.net:4000/v1}
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "5000:5000"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Qdrant (vector store for OpenMemory MCP) ─────────────────────────────
  # Note: qdrant image is distroless (no curl/wget) — no healthcheck possible.
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    networks: [nyra_net]

  # ── OpenMemory MCP (self-hosted mem0 MCP server) ─────────────────────────
  # Built from source: github.com/mem0ai/mem0/tree/main/openmemory/api
  # No published Docker image exists; Dockerfile sparse-clones the repo at build time.
  openmemory-mcp:
    build:
      context: ../../../services/openmemory-mcp
    container_name: nyra-openmemory-mcp
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_started
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: nyra-qdrant
      QDRANT_PORT: "6333"
      USER: nyra
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      EMBEDDER_PROVIDER: openai
      EMBEDDER_MODEL: text-embedding-3-small
    ports:
      - "8765:8765"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Infisical MCP (stdio→SSE bridge via supergateway) ────────────────────
  # Converts @infisical/mcp stdio server to HTTP/SSE so Nexus can aggregate it.
  # Exposed on port 8766; Nexus connects at http://100.64.0.3:8766/sse
  infisical-mcp:
    image: node:20-alpine
    container_name: nyra-infisical-mcp
    restart: unless-stopped
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENV:-prod}
      INFISICAL_FOLDER_PATH: ${INFISICAL_PATH:-/shared}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @infisical/mcp"
      - --port
      - "8766"
    ports:
      - "8766:8766"
    networks: [nyra_net]

  mempalace-mcp:
    build:
      context: ../../../services/mempalace-mcp
      dockerfile: Dockerfile
    container_name: nyra-mempalace-mcp
    restart: unless-stopped
    command: ["python", "-m", "mempalace.mcp_server"]
    environment:
      PORT: 8000
      MEMPAL_DIR: /data/vault
    ports:
      - "8002:8000"
    volumes:
      - mempalace_data:/root/.mempalace
      - mempalace_vault:/data/vault
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  twentycrm-mcp:
    image: node:20-alpine
    container_name: nyra-twentycrm-mcp
    working_dir: /app
    restart: unless-stopped
    command: ["sh", "-c", "npm install && npm start"]
    depends_on:
      twenty:
        condition: service_started
    environment:
      MCP_SERVER_PORT: 3022
      TWENTY_CRM_URL: http://twenty:3000
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      TWENTY_CRM_WORKSPACE_ID: ${TWENTYCRM_WORKSPACE_ID:-default}
      NODE_ENV: production
      NPM_CONFIG_CACHE: /tmp/.npm
    ports:
      - "${TWENTYCRM_MCP_PORT:-8182}:3022"
    volumes:
      - ../../../services/twenty-crm-mcp-server:/app:rw
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3022/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: nyra-gitea
    hostname: gitea
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${GITEA_UID:-1000}
      USER_GID: ${GITEA_GID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-nyra}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-git.oracle.trex-fiordland.ts.net}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.oracle.trex-fiordland.ts.net/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-oracle.trex-fiordland.ts.net}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 2222
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__mirror__ENABLED: "true"
      GITEA__mirror__DEFAULT_INTERVAL: 10m
      GITEA__webhook__ALLOWED_HOST_LIST: github.com,api.github.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: nyra-gitea-runner
    hostname: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../configs/gitea/runner-config.yaml:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-nyra-runner-01}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:20,self-hosted:host}
    networks: [nyra_net]

  github-mirror-sync:
    image: alpine/git:latest
    container_name: nyra-github-mirror
    hostname: github-mirror
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_data:/var/lib/gitea:ro
      - ../../configs/gitea/mirror-sync.sh:/mirror-sync.sh:ro
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-ellisapotheosis/Project-Nyra}
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      MIRROR_INTERVAL_SECONDS: ${GITHUB_MIRROR_INTERVAL_SECONDS:-600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          /bin/sh /mirror-sync.sh || true
          sleep "$${MIRROR_INTERVAL_SECONDS}"
        done
    networks: [nyra_net]

  gitea-mcp:
    build:
      context: ../../../services/gitea-mcp
    container_name: nyra-gitea-mcp
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    environment:
      PORT: ${GITEA_MCP_PORT:-3101}
      GITEA_URL: http://gitea:3000
    ports:
      - "${GITEA_MCP_PORT:-3101}:3101"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  quote_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-quote-engine
    restart: unless-stopped
    ports:
      - "5000:5000"
    networks: [nyra_net]

  crm-api:
    build:
      context: ../../../
      dockerfile: services/crm-api/Dockerfile
    container_name: nyra-crm-api
    restart: unless-stopped
    depends_on:
      twenty:
        condition: service_started
      postgres:
        condition: service_healthy
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      TWENTY_CRM_URL: http://twenty:3000
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      QUOTE_ENGINE_URL: http://quote_engine:5000
      CRM_API_KEY: ${CRM_API_KEY:-}
    ports:
      - "4001:4001"
    networks: [nyra_net]

  campaign_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/campaign-engine
      dockerfile: Dockerfile
    container_name: nyra-campaign-engine
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - N8N_BASE_URL=http://nyra-n8n:5678
      - N8N_WEBHOOK_URL=http://nyra-n8n:5678/webhook/nyra/dispatch
      - ACTIVEPIECES_BASE_URL=http://nyra-activepieces:8080
      - LOG_LEVEL=info
    networks: [nyra_net]

  # ── Paperclip AI (Multi-Agent Orchestration) ─────────────────────────────
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: nyra-paperclip
    restart: unless-stopped
    environment:
      - PAPERCLIP_AUTH_DISABLE_SIGN_UP=true
      - PORT=3100
    volumes:
      - paperclip_data:/paperclip
    ports:
      - "3111:3100"
    networks: [nyra_net]

  # ── Paperclip MCP Server ─────────────────────────────────────────────────
  # Exposes Paperclip orchestration tools to the Nexus aggregator.
  paperclip-mcp:
    image: node:20-alpine
    container_name: nyra-paperclip-mcp
    restart: unless-stopped
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      PAPERCLIP_API_URL: http://nyra-paperclip:3100
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:-dummy}
    volumes:
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @paperclipai/mcp-server"
      - --port
      - "8767"
    ports:
      - "8767:8767"
    networks: [nyra_net]

  # ── Nexus Aggregator (Grafbase Nexus) ────────────────────────────────────
  # THE single entrypoint: MCP tool aggregation + LLM proxy
  nexus:
    image: ghcr.io/grafbase/nexus:stable
    container_name: nyra-nexus
    restart: unless-stopped
    ports:
      - "6000:3000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      MEMPALACE_URL: ${MEMPALACE_URL:-}
    volumes:
      - ../../configs/nexus/nexus.toml:/etc/nexus/nexus.toml:ro
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    image: syncthing/syncthing:latest
    container_name: nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /run/desktop/mnt/host/wsl/...:/var/syncthing/data/home
    restart: unless-stopped

networks:
  nyra_net:

volumes:
  postgres_data:
  twenty_db_data:
  redis_cache_data:
  twenty_local_storage:
  twenty_docker_data:
  n8n_data:
  openclaw_config:
  openclaw_workspace:
  prometheus_data:
  loki_data:
  grafana_data:
  openwebui_data:
  gitea_data:
  gitea_config:
  gitea_runner_data:
  falkordb_data:
  qdrant_data:
  mempalace_data:
  mempalace_vault:
  paperclip_data:
  syncthing_config:
  portainer_data:
