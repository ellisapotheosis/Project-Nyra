name: nyra-network

services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  # Mirrors the worker-host secret volume pattern so Oracle services can consume
  # file-backed secrets without committing them to source.
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: nyra-network-nyra-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: [nyra_net]

  # ── Infisical agent (polls Infisical and refreshes file-backed secrets) ───
  infisical-agent:
    build:
      context: ../../images/infisical-secrets-init
    container_name: nyra-network-nyra-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: [nyra_net]

  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-network-nyra-portainer-agent
    restart: unless-stopped
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,oracle,standard}
    ports:
      - "${ORACLE_TAILSCALE_IP:-100.64.0.3}:9001:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks: [nyra_net]

  postgres:
    image: postgres:15
    container_name: nyra-network-nyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra_net]
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  redis-cache:
    image: redis:7-alpine
    container_name: nyra-network-nyra-redis-cache
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_cache_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks: [nyra_net]
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  twenty-db:
    image: postgres:15
    container_name: nyra-network-nyra-twenty-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${TWENTY_DB_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD}
      POSTGRES_DB: ${TWENTY_DB_NAME:-twenty}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${TWENTY_DB_USER:-twenty} -d ${TWENTY_DB_NAME:-twenty}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [nyra_net]
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  twenty:
    image: twentycrm/twenty:latest
    container_name: nyra-network-nyra-twenty
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      NODE_PORT: 3000
      SERVER_URL: https://twenty.projectnyra.com
      FRONTEND_URL: https://twenty.projectnyra.com
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/twenty
      REDIS_URL: redis://redis-cache:6379
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 4g
        reservations:
          memory: 1g

  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: nyra-network-nyra-twenty-worker
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    depends_on:
      twenty:
        condition: service_healthy
      twenty-db:
        condition: service_healthy
    environment:
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgresql://${TWENTY_DB_USER:-twenty}:${TWENTY_DB_PASSWORD}@twenty-db:5432/twenty
      REDIS_URL: redis://redis-cache:6379
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
      STORAGE_TYPE: local
    volumes:
      - twenty_local_storage:/app/packages/twenty-server/.local-storage
      - twenty_docker_data:/app/docker-data
    networks: [nyra_net]

  twenty-mcp:
    image: ${TWENTY_MCP_IMAGE:-nyra-network-twenty-mcp:latest}
    container_name: nyra-network-nyra-twenty-mcp
    restart: unless-stopped
    ports:
      - "8400:8400"
    environment:
      - TWENTY_BASE_URL=http://twenty:3000
      - TWENTY_API_URL=http://twenty:3000
      - TWENTY_GRAPHQL_URL=http://twenty:3000/graphql
      - TWENTY_API_KEY=${TWENTY_API_KEY:-${TWENTY_ACCESS_TOKEN:-}}
      - PORT=8400
    depends_on:
      twenty:
        condition: service_started
    networks: [nyra_net]

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-network-nyra-activepieces
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    environment:
      AP_DB_TYPE: ${AP_DB_TYPE:-POSTGRES}
      AP_POSTGRES_HOST: ${AP_POSTGRES_HOST:-postgres}
      AP_POSTGRES_PORT: ${AP_POSTGRES_PORT:-5432}
      AP_POSTGRES_DATABASE: ${AP_POSTGRES_DATABASE:-activepieces}
      AP_POSTGRES_USERNAME: ${AP_POSTGRES_USERNAME:-nyra}
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_REDIS_HOST: ${AP_REDIS_HOST:-nyra-redis-cache}
      AP_REDIS_PORT: ${AP_REDIS_PORT:-6379}
      AP_REDIS_PASSWORD: ${AP_REDIS_PASSWORD:-}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_FRONTEND_URL: ${AP_FRONTEND_URL:-https://active.projectnyra.com}
      AP_EXECUTION_MODE: ${AP_EXECUTION_MODE:-UNSANDBOXED}
      AP_TELEMETRY_ENABLED: ${AP_TELEMETRY_ENABLED:-false}
    networks: [nyra_net]
    ports:
      - "8080:80"

  n8n:
    build:
      context: ../../../
      dockerfile: infra/images/n8n/Dockerfile
      args:
        N8N_TWENTY_NODES_GIT: ${N8N_TWENTY_NODES_GIT:-}
        N8N_EXTRA_PACKAGES: ${N8N_EXTRA_PACKAGES:-}
    container_name: nyra-network-nyra-n8n
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: ${POSTGRES_HOST:-postgres}
      DB_POSTGRESDB_PORT: ${POSTGRES_PORT:-5432}
      DB_POSTGRESDB_DATABASE: ${N8N_DB:-n8n}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_HOST: ${N8N_HOST}
      N8N_PORT: ${N8N_PORT:-5678}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-https}
      WEBHOOK_URL: ${WEBHOOK_URL}
      N8N_SKIP_WEBHOOK_DNS_CHECK: ${N8N_SKIP_WEBHOOK_DNS_CHECK:-true}
      CRM_API_URL: http://crm-api:4001
      CRM_API_KEY: ${CRM_API_KEY:-}
      OFFICE_PHONE: ${OFFICE_PHONE:-}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      N8N_WORKFLOW_URL: ${WEBHOOK_URL:-https://n8n.projectnyra.com}
    volumes:
      - n8n_data:/home/node/.n8n
      - ../../n8n-workflows:/opt/nyra/n8n-workflows:ro
    networks: [nyra_net]
    ports:
      - "5678:5678"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5

  quote-api:
    build:
      context: ../../../services/quote-api
    container_name: nyra-network-nyra-quote-api
    restart: unless-stopped
    environment:
      PORT: ${QUOTE_API_PORT:-7070}
      QUOTE_API_SECRET: ${QUOTE_API_SECRET}
    networks: [nyra_net]
    ports:
      - "7070:7070"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7070/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-network-nyra-cloudflared
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "--protocol", "http2", "run"]
    environment:
      TUNNEL_TOKEN: ${ORACLE_TUNNEL_TOKEN}
      ORACLE_TUNNEL_TOKEN: ${ORACLE_TUNNEL_TOKEN}
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 60s
      timeout: 10s
      retries: 3

  # ── Observability ─────────────────────────────────────────────────────────
  # Metrics, logs, and dashboards run on Oracle (always-on, latency-insensitive).
  # OpenWebUI points at Oracle-local LiteLLM.

  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-network-nyra-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    volumes:
      - prometheus_data:/prometheus
      - ${PWD}/configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:3.4.3
    container_name: nyra-network-nyra-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - loki_data:/loki
    ports:
      - "3100:3100"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-network-nyra-grafana
    restart: unless-stopped
    depends_on:
      - prometheus
      - loki
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3003}
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "3003:3000"
    networks: [nyra_net]
    healthcheck:
      test:
        ["CMD", "wget", "-q", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nyra-network-nyra-cadvisor
    restart: unless-stopped
    privileged: true
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    ports:
      - "8081:8080"
    networks: [nyra_net]

  # ── OpenLIT AI Observability ──────────────────────────────────────────────
  # Self-hosted OpenLIT stack on Oracle VPS. Public access, if enabled, must stay
  # behind Cloudflare Access; OTLP ports are bound to Tailscale by default.
  openlit-clickhouse:
    image: clickhouse/clickhouse-server:24.4.1
    container_name: nyra-network-nyra-openlit-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_USER: ${OPENLIT_DB_USER:-default}
      CLICKHOUSE_PASSWORD: ${OPENLIT_DB_PASSWORD:?OPENLIT_DB_PASSWORD is required}
      CLICKHOUSE_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      CLICKHOUSE_ALWAYS_RUN_INITDB_SCRIPTS: "true"
    volumes:
      - openlit_clickhouse_data:/var/lib/clickhouse
      - ./configs/openlit/clickhouse-config.xml:/etc/clickhouse-server/config.d/openlit-config.xml:ro
      - ./configs/openlit/clickhouse-init.sh:/docker-entrypoint-initdb.d/openlit-init.sh:ro
    ports:
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${OPENLIT_CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${OPENLIT_CLICKHOUSE_NATIVE_PORT:-9000}:9000"
    networks: [nyra_net]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "clickhouse-client --user=$${CLICKHOUSE_USER} --password=$${CLICKHOUSE_PASSWORD} --query='SELECT 1' || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 60s

  openlit:
    image: ghcr.io/openlit/openlit:latest
    container_name: nyra-network-nyra-openlit
    restart: unless-stopped
    depends_on:
      openlit-clickhouse:
        condition: service_healthy
    environment:
      TELEMETRY_ENABLED: ${OPENLIT_TELEMETRY_ENABLED:-false}
      INIT_DB_HOST: openlit-clickhouse
      INIT_DB_PORT: 8123
      INIT_DB_DATABASE: ${OPENLIT_DB_NAME:-openlit}
      INIT_DB_USERNAME: ${OPENLIT_DB_USER:-default}
      INIT_DB_PASSWORD: ${OPENLIT_DB_PASSWORD:?OPENLIT_DB_PASSWORD is required}
      SQLITE_DATABASE_URL: file:/app/client/data/data.db
      PORT: 3000
      DOCKER_PORT: 3000
      NEXTAUTH_URL: ${OPENLIT_NEXTAUTH_URL:-https://openlit.projectnyra.com}
      NEXTAUTH_SECRET: ${OPENLIT_NEXTAUTH_SECRET:?OPENLIT_NEXTAUTH_SECRET is required}
      OPENLIT_VAULT_ENCRYPTION_KEY: ${OPENLIT_VAULT_ENCRYPTION_KEY:?OPENLIT_VAULT_ENCRYPTION_KEY is required}
      OPENLIT_ALLOWED_CORS_ORIGINS: ${OPENLIT_ALLOWED_CORS_ORIGINS:-https://openlit.projectnyra.com}
      GOOGLE_CLIENT_ID: ${OPENLIT_GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${OPENLIT_GOOGLE_CLIENT_SECRET:-}
      GITHUB_CLIENT_ID: ${OPENLIT_GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${OPENLIT_GITHUB_CLIENT_SECRET:-}
      OPAMP_ENVIRONMENT: ${OPENLIT_OPAMP_ENVIRONMENT:-production}
      OPAMP_CERTS_DIR: /app/opamp/certs
      OPAMP_TLS_INSECURE_SKIP_VERIFY: ${OPENLIT_OPAMP_TLS_INSECURE_SKIP_VERIFY:-false}
      OPAMP_TLS_REQUIRE_CLIENT_CERT: ${OPENLIT_OPAMP_TLS_REQUIRE_CLIENT_CERT:-true}
      OPAMP_TLS_MIN_VERSION: ${OPENLIT_OPAMP_TLS_MIN_VERSION:-1.2}
      OPAMP_TLS_MAX_VERSION: ${OPENLIT_OPAMP_TLS_MAX_VERSION:-1.3}
      OPAMP_LOG_LEVEL: ${OPENLIT_OPAMP_LOG_LEVEL:-info}
    volumes:
      - openlit_data:/app/client/data
      - ./configs/openlit/otel-collector-config.yaml:/etc/otel/otel-collector-config.yaml:ro
      - nyra_secrets:/run/nyra-secrets:ro
    ports:
      - "${OPENLIT_HOST_PORT:-3004}:3000"
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${OPENLIT_OTLP_GRPC_PORT:-4317}:4317"
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${OPENLIT_OTLP_HTTP_PORT:-4318}:4318"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 60s

  # ── Chat UI ───────────────────────────────────────────────────────────────
  # OpenWebUI proxies all LLM requests to local Oracle LiteLLM.

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-network-nyra-openwebui
    restart: unless-stopped
    environment:
      OPENAI_API_BASE_URL: ${LITELLM_BASE_URL:-http://litellm:4000/v1}
      OPENAI_API_KEY: ${LITELLM_MASTER_KEY}
      WEBUI_SECRET_KEY: ${OPENWEBUI_SECRET_KEY}
    volumes:
      - openwebui_data:/app/backend/data
    ports:
      - "8088:8080"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Memory System (Mem0 + FalkorDB) ───────────────────────────────────────
  # NOTE: mem0-rest, falkordb, and qdrant are CANONICAL in
  # docker-compose.memory.yml. Do not redefine them here.

  # ── OpenMemory MCP (self-hosted mem0 MCP server) ─────────────────────────
  # Built from source: github.com/mem0ai/mem0/tree/main/openmemory/api.
  openmemory-mcp:
    build:
      context: ../../../services/openmemory-mcp
    container_name: nyra-network-nyra-openmemory-mcp
    restart: unless-stopped
    # NOTE: qdrant lives in docker-compose.memory.yml; reach it via Tailscale.
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      QDRANT_HOST: ${OPENMEMORY_QDRANT_HOST:-memory-qdrant}
      QDRANT_PORT: "6333"
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      MEM0_API_URL: ${OPENMEMORY_MEM0_API_URL:-http://memory-mem0:5000}
      USER: nyra
      LLM_PROVIDER: openai
      LLM_MODEL: gpt-4o-mini
      EMBEDDER_PROVIDER: openai
      EMBEDDER_MODEL: text-embedding-3-small
    ports:
      - "8765:8765"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8765/docs"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Infisical MCP (stdio→SSE bridge via supergateway) ────────────────────
  # Converts @infisical/mcp stdio server to HTTP/SSE so Nexus can aggregate it.
  # Exposed on port 8766; Nexus connects at http://100.64.0.3:8766/sse
  infisical-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-infisical-mcp
    restart: unless-stopped
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENVIRONMENT: ${INFISICAL_ENV:-prod}
      INFISICAL_FOLDER_PATH: ${INFISICAL_PATH:-/machines/oracle-vps}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @infisical/mcp"
      - --port
      - "8766"
    ports:
      - "8766:8766"
    networks: [nyra_net]

  mempalace-mcp:
    build:
      context: ../../../services/mempalace-mcp
      dockerfile: Dockerfile
    container_name: nyra-network-nyra-mempalace-mcp
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - |
        python -m mempalace.mcp_server
        echo "mempalace stdio server exited; keeping container idle until an MCP client attaches"
        tail -f /dev/null
    environment:
      PORT: 8000
      MEMPAL_DIR: /data/vault
    ports:
      - "8002:8000"
    volumes:
      - mempalace_data:/root/.mempalace
      - mempalace_vault:/data/vault
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import mempalace'"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks: [nyra_net]

  # NOTE: gitea, gitea-runner, github-mirror-sync, gitea-mcp are managed via the
  # docker-compose.gitea.yml overlay (use `make gitea-up`). They are NOT defined
  # here so the overlay's hardened secrets and dedicated DB stay canonical.

  # ── Generic Git MCP (stdio→SSE bridge via supergateway) ──────────────────
  # Local Git repository operations for Gitea-backed repos. API-level Gitea
  # actions still go through gitea-mcp/Composio; raw git goes through this.
  git-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-git-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
    command:
      - /bin/sh
      - -lc
      - |
        if [ ! -d /workspace/.git ]; then
          echo "/workspace is not a Git repository; keeping git-mcp idle until a repo checkout is mounted.";
          tail -f /dev/null;
        fi
        apk add --no-cache git python3 py3-pip \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx mcp-server-git --repository /workspace" --port 8773
    ports:
      - "8773:8773"
    volumes:
      - ../../..:/workspace
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    networks: [nyra_net]

  quote_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-network-nyra-quote-engine
    restart: unless-stopped
    ports:
      - "8089:5000"
    networks: [nyra_net]

  crm-api:
    build:
      context: ../../../
      dockerfile: services/crm-api/Dockerfile
    container_name: nyra-network-nyra-crm-api
    restart: unless-stopped
    depends_on:
      twenty:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      PORT: 4001
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      TWENTY_CRM_URL: http://twenty:3000
      TWENTY_CRM_API_KEY: ${TWENTYCRM_API_KEY:-}
      N8N_WEBHOOK_URL: ${WEBHOOK_URL}
      QUOTE_ENGINE_URL: http://quote_engine:5000
      CRM_API_KEY: ${CRM_API_KEY:-}
    ports:
      - "4001:4001"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/api/leads?limit=1"]
      interval: 30s
      timeout: 10s
      retries: 3

  campaign_engine:
    profiles: ["apps"]
    build:
      context: ../../../services/campaign-engine
      dockerfile: Dockerfile
    container_name: nyra-network-nyra-campaign-engine
    restart: unless-stopped
    ports:
      - "8020:8020"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/nyra/dispatch
      - ACTIVEPIECES_BASE_URL=http://activepieces:80
      - LOG_LEVEL=info
    networks: [nyra_net]

  # ── Paperclip AI (Multi-Agent Orchestration) ─────────────────────────────
  paperclip:
    image: ghcr.io/paperclipai/paperclip:latest
    container_name: nyra-network-nyra-paperclip
    restart: unless-stopped
    environment:
      - PAPERCLIP_AUTH_DISABLE_SIGN_UP=true
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - PAPERCLIP_AGENT_JWT_SECRET=${PAPERCLIP_AGENT_JWT_SECRET}
      - PORT=3100
    volumes:
      - paperclip_data:/paperclip
    ports:
      - "3111:3100"
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3100/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Paperclip MCP Server ─────────────────────────────────────────────────
  # Exposes Paperclip orchestration tools to the Nexus aggregator.
  paperclip-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-paperclip-mcp
    restart: unless-stopped
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      PAPERCLIP_API_URL: http://paperclip:3100
      PAPERCLIP_API_KEY: ${PAPERCLIP_API_KEY:?PAPERCLIP_API_KEY is required}
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @paperclipai/mcp-server"
      - --port
      - "8767"
    ports:
      - "8767:8767"
    networks: [nyra_net]

  # ── Magic UI MCP (stdio→SSE bridge via supergateway) ──────────────────────
  # Converts @magicuidesign/mcp stdio server to HTTP/SSE so Nexus can aggregate it.
  # Exposed on port 8768; Nexus connects at http://magicui-mcp:8768/sse.
  magicui-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-magicui-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - /bin/sh
      - -lc
      - |
        npm install -g shadxn \
          && npm install magicui-hooks magicui-utils \
          && npx -y supergateway --stdio "npx -y @magicuidesign/mcp@latest" --port 8768
    ports:
      - "8768:8768"
    volumes:
      - ../../../apps/projectnyra:/app
    networks: [nyra_net]

  # ── Nyra UI Factory ─────────────────────────────────────────────────────
  # Long-lived execution container for registry installs into the Project Nyra app.
  nyra-ui-engine:
    image: node:20-alpine
    container_name: nyra-network-nyra-ui-engine
    restart: unless-stopped
    working_dir: /app
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN}
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_COMPONENT_DIR: "@/components/magicui"
      NYRA_UI_HOOKS_DIR: "@/hooks"
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - tail
      - -f
      - /dev/null
    volumes:
      - ../../../apps/projectnyra:/app
    networks: [nyra_net]

  # ── shadcn Registry MCP (stdio→SSE bridge via supergateway) ──────────────
  # Registry browser/search sidecar bound to the same /app workspace.
  # Installs are executed through nyra-ui-engine with shadxn.
  shadcn-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-shadcn-mcp
    restart: unless-stopped
    working_dir: /app
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NYRA_UI_INSTALL_COMMAND: npx shadxn add
      SHADCN_ADD_COMMAND: npx shadxn add
      SHADCN_REGISTRY_CLI: shadxn
    command:
      - /bin/sh
      - -lc
      - |
        npm install -g shadxn \
          && npx -y supergateway --stdio "npx -y shadcn@latest mcp" --port 8769
    ports:
      - "8769:8769"
    volumes:
      - ../../../apps/projectnyra:/app
    networks: [nyra_net]

  # ── Sequential Thinking MCP (stdio→SSE bridge via supergateway) ──────────
  sequential-thinking-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-sequential-thinking-mcp
    restart: unless-stopped
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y @modelcontextprotocol/server-sequential-thinking"
      - --port
      - "8770"
    ports:
      - "8770:8770"
    networks: [nyra_net]

  # ── Playwright MCP (stdio→SSE bridge via supergateway) ───────────────────
  playwright-mcp:
    image: mcr.microsoft.com/playwright:v1.56.1-noble
    container_name: nyra-network-nyra-playwright-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
    command:
      - /bin/sh
      - -lc
      - |
        npx -y supergateway --stdio "npx -y @playwright/mcp@latest --browser chromium --headless --no-sandbox" --port 8771
    ports:
      - "8771:8771"
    volumes:
      - ../../..:/workspace:ro
    networks: [nyra_net]

  # ── Firecrawl MCP (stdio→SSE bridge via supergateway) ───────────────────
  firecrawl-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-firecrawl-mcp
    restart: unless-stopped
    environment:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
      FIRECRAWL_API_URL: ${FIRECRAWL_API_URL:-https://api.firecrawl.dev}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y firecrawl-mcp"
      - --port
      - "8772"
    ports:
      - "8772:8772"
    networks: [nyra_net]

  # ── Next.js DevTools MCP (stdio→SSE bridge via supergateway) ─────────────
  # Discovers running Next.js dev servers and proxies their /_next/mcp tools.
  next-devtools-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-next-devtools-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      NEXT_DEVTOOLS_WORKSPACE: /workspace
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y next-devtools-mcp@latest"
      - --port
      - "8774"
    ports:
      - "8774:8774"
    volumes:
      - ../../..:/workspace
    networks: [nyra_net]

  # ── Tavily MCP (stdio→SSE bridge via supergateway) ──────────────────────
  tavily-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-tavily-mcp
    restart: unless-stopped
    environment:
      TAVILY_API_KEY: ${TAVILY_API_KEY}
      NPM_CONFIG_CACHE: /tmp/.npm
    command:
      - npx
      - -y
      - supergateway
      - --stdio
      - "npx -y tavily-mcp@latest"
      - --port
      - "8775"
    ports:
      - "8775:8775"
    networks: [nyra_net]

  # ── WCGW MCP (stdio→SSE bridge via supergateway) ────────────────────────
  # Shell/code execution workspace tools. Keep private behind Nexus only.
  wcgw-mcp:
    image: node:20-bookworm-slim
    container_name: nyra-network-nyra-wcgw-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
      WCGW_WORKSPACE: /workspace
    command:
      - /bin/sh
      - -lc
      - |
        apt-get update \
          && apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates curl \
          && rm -rf /var/lib/apt/lists/* \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx --from wcgw@latest wcgw_mcp" --port 8776
    ports:
      - "8776:8776"
    volumes:
      - ../../..:/workspace
      - ${HOME:-/home/ellisapotheosis}/.ssh:/root/.ssh:ro
    networks: [nyra_net]

  # ── Gitingest MCP (stdio→SSE bridge via supergateway) ───────────────────
  gitingest-mcp:
    image: node:20-alpine
    container_name: nyra-network-nyra-gitingest-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      NPM_CONFIG_CACHE: /tmp/.npm
      UV_CACHE_DIR: /tmp/.uv-cache
    command:
      - /bin/sh
      - -lc
      - |
        apk add --no-cache git python3 py3-pip \
          && pip install --break-system-packages uv \
          && npx -y supergateway --stdio "uvx gitingestmcp@latest" --port 8777
    ports:
      - "8777:8777"
    volumes:
      - ../../..:/workspace:ro
    networks: [nyra_net]

  # ── Codebase Index MCP (stdio→SSE bridge via supergateway) ───────────────
  codebase-index-mcp:
    image: node:20-bookworm-slim
    container_name: nyra-network-nyra-codebase-index-mcp
    restart: unless-stopped
    working_dir: /workspace
    environment:
      PROJECT_ROOT: /workspace
      NPM_CONFIG_CACHE: /tmp/.npm
      PIP_CACHE_DIR: /tmp/.pip-cache
    command:
      - /bin/sh
      - -lc
      - |
        apt-get update \
          && apt-get install -y --no-install-recommends python3 python3-pip git ca-certificates \
          && rm -rf /var/lib/apt/lists/* \
          && pip install --break-system-packages "mcp-codebase-index[mcp]" \
          && npx -y supergateway --stdio "mcp-codebase-index" --port 8778
    ports:
      - "8778:8778"
    volumes:
      - ../../..:/workspace
    networks: [nyra_net]

  # ── Supabase Stack ────────────────────────────────────────────────────────
  supabase-db:
    image: supabase/postgres:15.1.1.78
    container_name: nyra-network-nyra-supabase-db
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}
      POSTGRES_DB: postgres
      POSTGRES_USER: postgres
    ports:
      - "54322:5432"
    volumes:
      - supabase_db_data:/var/lib/postgresql/data
      - ./initdb/supabase:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra_net]

  supabase-auth:
    image: supabase/gotrue:v2.132.3
    container_name: nyra-network-nyra-supabase-auth
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://postgres:${SUPABASE_DB_URL_PASSWORD:-${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}}@supabase-db:5432/postgres?sslmode=disable
      GOTRUE_SITE_URL: ${SUPABASE_SITE_URL:-https://app.projectnyra.com}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      API_EXTERNAL_URL: ${SUPABASE_AUTH_EXTERNAL_URL:-https://api.projectnyra.com/auth/v1}
      GOTRUE_EXTERNAL_URL: ${SUPABASE_AUTH_EXTERNAL_URL:-https://api.projectnyra.com/auth/v1}
      GOTRUE_MAILER_AUTOCONFIRM: "true"
      GOTRUE_DB_MAX_POOL_SIZE: 20
    networks: [nyra_net]

  supabase-rest:
    image: postgrest/postgrest:v10.1.1
    container_name: nyra-network-nyra-supabase-rest
    restart: unless-stopped
    depends_on:
      supabase-db:
        condition: service_healthy
    environment:
      PGRST_DB_URI: postgres://postgres:${SUPABASE_DB_URL_PASSWORD:-${SUPABASE_DB_PASSWORD:-${POSTGRES_PASSWORD}}}@supabase-db:5432/postgres
      PGRST_DB_SCHEMA: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
    networks: [nyra_net]

  supabase-kong:
    image: kong:2.8.1
    container_name: nyra-network-nyra-supabase-kong
    restart: unless-stopped
    depends_on:
      supabase-auth:
        condition: service_started
      supabase-rest:
        condition: service_started
    volumes:
      - ./configs/supabase/kong.yml:/etc/kong/kong.yml:ro
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /etc/kong/kong.yml
      KONG_PROXY_LISTEN: 0.0.0.0:8000
    ports:
      - "8000:8000"
    networks: [nyra_net]

  # ── LiteLLM Proxy ─────────────────────────────────────────────────────────
  # Moved from orchestrator: co-located with Nexus to eliminate Tailscale hop.
  llxprt-bridge-proxy:
    image: alpine/socat:1.8.0.3
    container_name: nyra-network-nyra-llxprt-bridge-proxy
    restart: unless-stopped
    network_mode: host
    command:
      - "-d"
      - "-d"
      - "TCP-LISTEN:8091,bind=172.20.0.1,fork,reuseaddr"
      - "TCP:127.0.0.1:8090"

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-network-nyra-litellm
    restart: unless-stopped
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      LLXPRT_BRIDGE_API_KEY: ${LLXPRT_BRIDGE_API_KEY:-}
      REDIS_HOST: redis-cache
      REDIS_PORT: "6379"
    extra_hosts:
      - "host.docker.internal:172.20.0.1"
    volumes:
      - /home/ubuntu/project-nyra/infra/configs/litellm/config.yaml:/app/config/config.yaml:ro
    depends_on:
      llxprt-bridge-proxy:
        condition: service_started
      postgres:
        condition: service_healthy
      redis-cache:
        condition: service_healthy
    networks: [nyra_net]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/readiness'', timeout=8)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Nexus Aggregator (Grafbase Nexus) ────────────────────────────────────
  # THE single entrypoint: MCP tool aggregation + LLM proxy
  ha-mcp:
    image: ${HA_MCP_IMAGE:-ghcr.io/homeassistant-ai/ha-mcp:7.4.0}
    container_name: nyra-network-nyra-ha-mcp
    restart: unless-stopped
    command: ["ha-mcp-web"]
    environment:
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL:-https://homeassistant.projectnyra.com}
      HOMEASSISTANT_TOKEN: ${HOMEASSISTANT_TOKEN:-${HOME_ASSISTANT_TOKEN:-${HOME_ASSISTANT_TOKEN_SECRET:-}}}
      BACKUP_HINT: ${HA_MCP_BACKUP_HINT:-normal}
      HAMCP_ENABLE_FILESYSTEM_TOOLS: ${HAMCP_ENABLE_FILESYSTEM_TOOLS:-false}
      ENABLE_YAML_CONFIG_EDITING: ${ENABLE_YAML_CONFIG_EDITING:-false}
      HAMCP_ENABLE_CUSTOM_COMPONENT_INTEGRATION: ${HAMCP_ENABLE_CUSTOM_COMPONENT_INTEGRATION:-false}
    networks: [nyra_net]

  nexus:
    image: ghcr.io/grafbase/nexus:stable
    container_name: nyra-network-nyra-nexus
    restart: unless-stopped
    ports:
      - "6000:3000"
    environment:
      NEXUS_LISTEN_ADDRESS: 0.0.0.0:3000
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MEMPALACE_URL: ${MEMPALACE_URL:-}
      LLXPRT_JEFE_BASE_URL: ${LLXPRT_JEFE_BASE_URL:-}
      LLXPRT_JEFE_API_KEY: ${LLXPRT_JEFE_API_KEY:-}
    volumes:
      - /home/ubuntu/project-nyra/infra/hosts/oracle-vps/nexus.toml:/etc/nexus.toml:ro
    depends_on:
      ha-mcp:
        condition: service_started
      litellm:
        condition: service_healthy
      firecrawl-mcp:
        condition: service_started
      gitingest-mcp:
        condition: service_started
      git-mcp:
        condition: service_started
      magicui-mcp:
        condition: service_started
      next-devtools-mcp:
        condition: service_started
      playwright-mcp:
        condition: service_started
      codebase-index-mcp:
        condition: service_started
      sequential-thinking-mcp:
        condition: service_started
      tavily-mcp:
        condition: service_started
      wcgw-mcp:
        condition: service_started
      nyra-ui-engine:
        condition: service_started
      shadcn-mcp:
        condition: service_started
    networks: [nyra_net]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: nyra-network-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /run/desktop/mnt/host/wsl/...:/var/syncthing/data/home
    restart: unless-stopped

networks:
  nyra_net:

volumes:
  postgres_data:
  litellm_data:
  twenty_db_data:
  redis_cache_data:
  twenty_local_storage:
  twenty_docker_data:
  n8n_data:
  openclaw_config:
  openclaw_workspace:
  prometheus_data:
  loki_data:
  grafana_data:
  openlit_clickhouse_data:
  openlit_data:
  nyra_secrets:
  openwebui_data:
  mempalace_data:
  mempalace_vault:
  paperclip_data:
  syncthing_config:
  portainer_data:
  letta_db_data:
  letta_data:
  mem_os_data:
  supabase_db_data:
