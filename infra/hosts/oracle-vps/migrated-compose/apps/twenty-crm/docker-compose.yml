version: "3.8"

services:
  # TwentyCRM Database
  twenty-db:
    image: twentycrm/twenty-postgres:latest
    container_name: nyra-twenty-db
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:-twenty_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - twenty_db_data:/var/lib/postgresql/data/pgdata
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - twenty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 30s
      timeout: 10s
      retries: 5

  # TwentyCRM Redis
  twenty-redis:
    image: redis:7-alpine
    container_name: nyra-twenty-redis
    command: redis-server --requirepass ${TWENTY_REDIS_PASSWORD:-redis_password}
    volumes:
      - twenty_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - twenty-network
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${TWENTY_REDIS_PASSWORD:-redis_password}",
          "ping",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

  # TwentyCRM Application
  twenty-crm:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-crm
    environment:
      # Database Configuration
      PG_DATABASE_URL: postgresql://twenty:${TWENTY_DB_PASSWORD:-twenty_password}@twenty-db:5432/twenty
      REDIS_URL: redis://:${TWENTY_REDIS_PASSWORD:-redis_password}@twenty-redis:6379

      # App Configuration
      SERVER_URL: http://localhost:3020
      FRONT_BASE_URL: http://localhost:3020
      PORT: 3000

      # Authentication & Security
      ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET:-your_access_token_secret_change_in_production}
      LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET:-your_login_token_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET:-your_refresh_token_secret_change_in_production}
      FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET:-your_file_token_secret_change_in_production}

      # External Integrations
      SUPPORT_CHAT_ENABLED: false
      TELEMETRY_ENABLED: false
      CAPTCHA_DRIVER: none

      # Email (Optional - for notifications)
      EMAIL_FROM_ADDRESS: noreply@nyra.com
      EMAIL_SYSTEM_ADDRESS: system@nyra.com
      EMAIL_DRIVER: logger

      # File Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage

      # API Configuration
      API_RATE_LIMITING_TTL: 100
      API_RATE_LIMITING_REQUEST_COUNT: 100

      # Development
      DEBUG_MODE: true
      SIGN_IN_PREFILLED: true
      IS_MULTIWORKSPACE_ENABLED: false

    ports:
      - "3020:3000"
    volumes:
      - twenty_storage:/app/storage
      - ./config/twenty.env:/app/.env:ro
    networks:
      - twenty-network
      - nexus-network
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # TwentyCRM Worker (for background jobs)
  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-worker
    command: ["npm", "run", "worker:start"]
    environment:
      PG_DATABASE_URL: postgresql://twenty:${TWENTY_DB_PASSWORD:-twenty_password}@twenty-db:5432/twenty
      REDIS_URL: redis://:${TWENTY_REDIS_PASSWORD:-redis_password}@twenty-redis:6379
      ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET:-your_access_token_secret_change_in_production}
      LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET:-your_login_token_secret_change_in_production}
      REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET:-your_refresh_token_secret_change_in_production}
      FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET:-your_file_token_secret_change_in_production}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage
    volumes:
      - twenty_storage:/app/storage:rw
    networks:
      - twenty-network
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  twenty_db_data:
    driver: local
  twenty_redis_data:
    driver: local
  twenty_storage:
    driver: local

networks:
  twenty-network:
    driver: bridge
  nexus-network:
    external: true
    name: nexus-network
