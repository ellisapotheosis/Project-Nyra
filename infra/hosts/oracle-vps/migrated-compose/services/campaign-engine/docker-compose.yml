version: "3.8"

services:
  campaign-engine:
    build: .
    container_name: nyra-campaign-engine
    ports:
      - "8020:8020"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://twenty:twenty@postgres:5432/twenty
      - N8N_BASE_URL=http://n8n:5678
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/nyra/dispatch
      - ACTIVEPIECES_BASE_URL=http://activepieces:8080
      - LOG_LEVEL=info
      - ENABLE_GUARDRAILS=true
      - DNC_CHECK_ENABLED=true
      - CONSENT_REQUIRED=true
    depends_on:
      - postgres
      - n8n
    volumes:
      - ./logs:/app/logs
    networks:
      - nyra
    restart: unless-stopped

  postgres:
    image: postgres:16
    container_name: nyra-campaign-postgres
    environment:
      - POSTGRES_USER=twenty
      - POSTGRES_PASSWORD=twenty
      - POSTGRES_DB=twenty
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - nyra

  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=America/Los_Angeles
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=nyra
      - N8N_BASIC_AUTH_PASSWORD=changeme
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/workflows:ro
    networks:
      - nyra
    restart: unless-stopped

networks:
  nyra:
    driver: bridge

volumes:
  postgres_data:
  n8n_data:
