version: "3.9"

# LiteLLM Proxy - Production Stack
# Full setup with load balancing, caching, monitoring, and database

services:
  # ========================================
  # NGINX Load Balancer
  # ========================================
  nginx:
    image: nginx:1.25-alpine
    container_name: litellm-nginx
    ports:
      - "4000:4000"
    volumes:
      - ./config/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./monitoring/logs/nginx:/var/log/nginx
    depends_on:
      - litellm-1
      - litellm-2
      - litellm-3
    networks:
      - litellm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ========================================
  # LiteLLM Proxy Instances (3x for HA)
  # ========================================
  litellm-1:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy-1
    env_file:
      - .env
    environment:
      - INSTANCE_ID=litellm-1
      - PORT=4001
    volumes:
      - ./config:/app/config:ro
      - ./monitoring/logs/litellm-1:/app/logs
    networks:
      - litellm-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  litellm-2:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy-2
    env_file:
      - .env
    environment:
      - INSTANCE_ID=litellm-2
      - PORT=4002
    volumes:
      - ./config:/app/config:ro
      - ./monitoring/logs/litellm-2:/app/logs
    networks:
      - litellm-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  litellm-3:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy-3
    env_file:
      - .env
    environment:
      - INSTANCE_ID=litellm-3
      - PORT=4003
    volumes:
      - ./config:/app/config:ro
      - ./monitoring/logs/litellm-3:/app/logs
    networks:
      - litellm-network
    depends_on:
      - postgres
      - redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ========================================
  # PostgreSQL - Configuration & Metrics Storage
  # ========================================
  postgres:
    image: postgres:16-alpine
    container_name: litellm-postgres
    environment:
      - POSTGRES_DB=litellm
      - POSTGRES_USER=litellm
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-litellm_secure_password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./config/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - litellm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Redis - Response Caching
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    command: redis-server --appendonly yes --maxmemory 2gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    networks:
      - litellm-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ========================================
  # Prometheus - Metrics Collection
  # ========================================
  prometheus:
    image: prom/prometheus:latest
    container_name: litellm-prometheus
    ports:
      - "9091:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/usr/share/prometheus/console_libraries"
      - "--web.console.templates=/usr/share/prometheus/consoles"
      - "--web.enable-lifecycle"
    networks:
      - litellm-network
    restart: unless-stopped

  # ========================================
  # Grafana - Dashboards
  # ========================================
  grafana:
    image: grafana/grafana:latest
    container_name: litellm-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - litellm-network
    restart: unless-stopped

  # ========================================
  # Loki - Log Aggregation
  # ========================================
  loki:
    image: grafana/loki:latest
    container_name: litellm-loki
    ports:
      - "3100:3100"
    volumes:
      - ./monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    networks:
      - litellm-network
    restart: unless-stopped

  # ========================================
  # Promtail - Log Shipper
  # ========================================
  promtail:
    image: grafana/promtail:latest
    container_name: litellm-promtail
    volumes:
      - ./monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - ./monitoring/logs:/var/log
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    networks:
      - litellm-network
    restart: unless-stopped

# ========================================
# VOLUMES
# ========================================
volumes:
  postgres-data:
    name: litellm-postgres-data
  redis-data:
    name: litellm-redis-data
  prometheus-data:
    name: litellm-prometheus-data
  grafana-data:
    name: litellm-grafana-data
  loki-data:
    name: litellm-loki-data

# ========================================
# NETWORKS
# ========================================
networks:
  litellm-network:
    name: litellm-network
    driver: bridge
