  #     - nyra_net
  #   restart: unless-stopped
  #   healthcheck:
  #     test: ["CMD", "curl", "-f", "http://localhost:9090/health"]
  #     interval: 10s
  #     timeout: 3s
  #     retries: 3
  #   labels:
  #     com.projectnyra.tier: audit
  #     com.projectnyra.component: mission-control
  #   read_only: true
  #   cap_drop:
  #     - ALL

  nexus-router:
    image: projectnyra/nexus-router:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nexus-router
    environment:
      PORT: 7000
      LITELLM_BASE_URL: http://${COMPOSE_PROJECT_NAME:-nyra}-litellm:4000/v1
      LITELLM_API_KEY: ${LITELLM_MASTER_KEY}
    ports:
      - "7000:7000"
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      com.projectnyra.tier: control-plane
      com.projectnyra.component: nexus-router

  mcp-gateway:
    image: projectnyra/mcp-gateway:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-mcp-gateway
    environment:
      PORT: 3000
      LITELLM_URL: http://${COMPOSE_PROJECT_NAME:-nyra}-litellm:4000/v1
      LOG_LEVEL: info
    ports:
      - "3002:3000"
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      com.projectnyra.tier: control-plane
      com.projectnyra.component: mcp-gateway

  # forgejo: Disabled - requires external registry access (skipped for now)

  portainer:
    image: portainer/portainer-ce:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-portainer
    ports:
      - "9000:9000"
      - "8000:8000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/api/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      com.projectnyra.tier: control-plane
      com.projectnyra.component: portainer

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3
    labels:
      com.projectnyra.tier: control-plane
      com.projectnyra.component: redis

networks:
  nyra_net:
    external: true

volumes:
  portainer_data:
  redis_data:
