# Control Plane Migration to Oracle-VPS
# Migrates: LiteLLM, Mission Control, Nexus, MCP Gateway, Forgejo, Portainer, Redis

services:
  litellm:
    image: ghcr.io/berriai/litellm:main
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-litellm
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY}
      LLXPRT_BRIDGE_API_KEY: ${LLXPRT_BRIDGE_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    networks:
      - nyra_net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    labels:
      com.projectnyra.tier: control-plane
      com.projectnyra.component: litellm

  # mission-control:
  #   build:
  #     context: ../orchestrator/mission-control
  #     dockerfile: Dockerfile
  #   container_name: ${COMPOSE_PROJECT_NAME:-nyra}-mission-control
  #   environment:
  #     MISSION_CONTROL_PORT: 9090
  #     AUDIT_DIR: /audit
  #     LOG_LEVEL: INFO
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - mission_control_audit:/audit
