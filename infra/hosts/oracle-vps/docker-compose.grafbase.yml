# Grafbase Gateway pilot for app/business API facade experiments.
# Nexus Router remains the canonical agent/MCP control plane.

name: nyra-grafbase-pilot

services:
  grafbase-gateway:
    image: ${GRAFBASE_GATEWAY_IMAGE:-ghcr.io/grafbase/gateway:latest}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-grafbase-gateway
    restart: unless-stopped
    command:
      - "--config"
      - "/etc/grafbase/grafbase.toml"
      - "--schema"
      - "/etc/grafbase/schema.graphql"
      - "--listen-address"
      - "0.0.0.0:5000"
      - "--log"
      - "${GRAFBASE_GATEWAY_LOG_LEVEL:-info}"
      - "--log-style"
      - "json"
    ports:
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${GRAFBASE_GATEWAY_HOST_PORT:-5050}:5000"
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${GRAFBASE_GATEWAY_HEALTH_HOST_PORT:-9668}:9668"
    volumes:
      - ./grafbase/grafbase.toml:/etc/grafbase/grafbase.toml:ro
      - ./grafbase/schema.graphql:/etc/grafbase/schema.graphql:ro
    networks:
      nyra_net:
        aliases:
          - grafbase
          - grafbase-gateway
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:9668/health | grep -q healthy || curl -fsS http://127.0.0.1:9668/health | grep -q healthy",
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    deploy:
      resources:
        limits:
          memory: 512m
        reservations:
          memory: 128m

networks:
  nyra_net:
    name: nyra-network_nyra_net
    external: true
