name: nyra-gitea

services:
  gitea-db:
    image: postgres:16-alpine
    container_name: ${GITEA_CONTAINER_PREFIX:-nyra}-gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [gitea_net]

  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: ${GITEA_CONTAINER_PREFIX:-nyra}-gitea
    hostname: gitea
    restart: unless-stopped
    depends_on:
      gitea-db:
        condition: service_healthy
    ports:
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${GITEA_HTTP_PORT:-3001}:3000"
      - "${ORACLE_TAILSCALE_IP:-127.0.0.1}:${GITEA_SSH_PORT:-2222}:2222"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      USER_UID: ${GITEA_UID:-1000}
      USER_GID: ${GITEA_GID:-1000}
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-git.oracle.trex-fiordland.ts.net}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-https://git.oracle.trex-fiordland.ts.net/}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-oracle.trex-fiordland.ts.net}
      GITEA__server__SSH_PORT: ${GITEA_SSH_PORT:-2222}
      GITEA__server__SSH_LISTEN_PORT: 2222
      GITEA__server__START_SSH_SERVER: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__security__SECRET_KEY: ${GITEA_SECRET_KEY}
      GITEA__security__INTERNAL_TOKEN: ${GITEA_INTERNAL_TOKEN}
      GITEA__oauth2__JWT_SECRET: ${GITEA_JWT_SECRET}
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "false"
      GITEA__actions__ENABLED: "true"
      GITEA__packages__ENABLED: "true"
      GITEA__mirror__ENABLED: "true"
      GITEA__mirror__DEFAULT_INTERVAL: ${GITEA_MIRROR_DEFAULT_INTERVAL:-10m}
      GITEA__webhook__ALLOWED_HOST_LIST: github.com,api.github.com,*.github.com
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      gitea_net: {}
      nyra_net:
        aliases:
          - gitea

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: ${GITEA_CONTAINER_PREFIX:-nyra}-gitea-runner
    hostname: gitea-runner
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - gitea_runner_data:/data
      - gitea_runner_cache:/cache
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../configs/gitea/runner-config.oracle.yaml:/config.yaml:ro
    environment:
      CONFIG_FILE: /config.yaml
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN:-}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-oracle-standard-01}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:20-bookworm,ubuntu-22.04:docker://ubuntu:22.04,node:docker://node:20-bookworm,python:docker://python:3.11-slim,docker:host,self-hosted:host,nyra:host}
    networks: [gitea_net]

  github-mirror-sync:
    image: alpine:3.20
    container_name: ${GITEA_CONTAINER_PREFIX:-nyra}-github-mirror
    hostname: github-mirror
    restart: unless-stopped
    depends_on:
      gitea:
        condition: service_healthy
    volumes:
      - ../../configs/gitea/mirror-sync.sh:/mirror-sync.sh:ro
      - gitea_mirror_cache:/work
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-ellisapotheosis/Project-Nyra}
      GITEA_URL: http://gitea:3000
      GITEA_TOKEN: ${GITEA_TOKEN:-}
      GITEA_REPO: ${GITEA_REPO:-nyra-admin/Project-Nyra}
      MIRROR_INTERVAL_SECONDS: ${GITHUB_MIRROR_INTERVAL_SECONDS:-600}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        apk add --no-cache ca-certificates curl git openssh-client
        while true; do
          /bin/sh /mirror-sync.sh || true
          sleep "$${MIRROR_INTERVAL_SECONDS}"
        done
    networks: [gitea_net]

networks:
  gitea_net:
    name: nyra-gitea
  nyra_net:
    external: true
    name: nyra-network_nyra_net

volumes:
  gitea_db_data:
  gitea_data:
  gitea_config:
  gitea_runner_data:
  gitea_runner_cache:
  gitea_mirror_cache:
