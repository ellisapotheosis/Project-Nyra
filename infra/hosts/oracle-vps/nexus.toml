##############################################################################
# Project Nyra - Grafbase Nexus on oracle-vps
#
# Canonical Nexus runtime config. Keep only downstreams that pass local smoke
# checks; broken MCP servers can leave Nexus serving /mcp with no usable tools.
##############################################################################

[server]
listen_address = "0.0.0.0:3000"

[server.health]
enabled = true
path = "/health"

[llm]
enabled = true

[llm.protocols.openai]
enabled = true
path = "/v1"

[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_MASTER_KEY }}"
base_url = "http://litellm:4000/v1"
forward_token = false

[llm.providers.litellm.models."*"]

[llm.providers.utility-3060]
type = "openai"
api_key = "not-needed"
base_url = "http://worker-rtx3060.trex-fiordland.ts.net:11434/v1"
forward_token = false

[llm.providers.utility-3060.models."nomic-embed-text"]
[llm.providers.utility-3060.models."all-minilm:l6-v2"]
[llm.providers.utility-3060.models."llama3.2:3b"]
[llm.providers.utility-3060.models."phi3:mini"]
[llm.providers.utility-3060.models."mistral:7b-v0.3"]

[mcp]
enabled = true
path = "/mcp"

# OpenMemory and memOS are deployed and smoke-tested directly, but they are not
# currently safe Nexus downstreams. On Nexus 0.6.0 their SSE endpoints can keep
# the router from serving /health after restart. Keep them direct until the
# transport adapter passes initialize/list-tools without blocking Nexus startup.

# Letta MCP remains deployed directly at oracle localhost:8284 -> letta-mcp:6507.
# Do not aggregate it here until the bridge emits spec-clean SSE/HTTP responses;
# the current Rust bridge sends a non-JSON SSE "connected" event and returns a
# body for initialized notifications, which prevents Nexus from finishing init.

# shadcn/tweakcn remains configured as a direct stdio MCP in the local agent
# settings. Do not aggregate it here until its stdio-to-SSE bridge supports
# Nexus without single-transport crashes.

# Add additional MCP downstreams here only after they pass an initialize smoke
# check from inside the nyra-network_nyra_net Docker network.

# ── Worker MCP Gateways (docker/mcp-gateway on each worker) ─────────────────
# Start with: make worker-mcp-gw-up
# Smoke-test health before enabling:
#   curl --max-time 5 http://worker-rtx3090ti.trex-fiordland.ts.net:8811/health
#   curl --max-time 5 http://worker-rtx5090.trex-fiordland.ts.net:8811/health
#
# Then test SSE initialize from inside the oracle container network:
#   docker --context oracle exec -it oracle-vps-nexus \
#     curl http://worker-rtx3090ti.trex-fiordland.ts.net:8811/sse
#
# Once confirmed, uncomment to add as Nexus MCP sources:
#
# [[mcp.sources]]
# name = "worker-3090ti-mcp"
# url = "http://worker-rtx3090ti.trex-fiordland.ts.net:8811/sse"
#
# [[mcp.sources]]
# name = "worker-5090-mcp"
# url = "http://worker-rtx5090.trex-fiordland.ts.net:8811/sse"
# # 5090 is mobile — only add if consistently online
