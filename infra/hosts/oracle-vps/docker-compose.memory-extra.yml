# memOS/MemoryTensor is kept as an explicit experimental layer over the core
# Letta + mem0 + Qdrant + FalkorDB memory stack.

services:
  memos-api:
    image: ${MEMOS_IMAGE:-nyra/memorytensor-memos:local}
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-memos-api
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - mkdir -p /data/files && exec python -m memos.api.server_api --port 8001 --workers 1
    environment: &memos-env
      MEM0_BASE_URL: http://mem0:5000
      FALKORDB_URL: redis://falkordb:6379
      QDRANT_URL: http://qdrant:6333
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      LETTA_BASE_URL: http://letta:8283
      # The deployed memOS package does not support FalkorDB as a native graph
      # backend. mem0 owns graph memory through FalkorDB; memOS remains an
      # experimental lane and must not be treated as the graph source of truth.
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      OPENAI_API_BASE: ${OPENAI_API_BASE:-${OPENAI_BASE_URL:-}}
      MOS_CHAT_MODEL: ${MOS_CHAT_MODEL:-gpt-4o-mini}
      MOS_TEXT_MEM_TYPE: ${MOS_TEXT_MEM_TYPE:-general_text}
      MOS_EMBEDDER_BACKEND: ${MOS_EMBEDDER_BACKEND:-universal_api}
      MOS_EMBEDDER_PROVIDER: ${MOS_EMBEDDER_PROVIDER:-openai}
      MOS_EMBEDDER_MODEL: ${MOS_EMBEDDER_MODEL:-text-embedding-3-small}
      MOS_EMBEDDER_API_KEY: ${MOS_EMBEDDER_API_KEY:-${OPENAI_API_KEY:-}}
      MOS_EMBEDDER_API_BASE: ${MOS_EMBEDDER_API_BASE:-${OPENAI_API_BASE:-${OPENAI_BASE_URL:-}}}
      MEMRADER_MODEL: ${MEMRADER_MODEL:-${MOS_CHAT_MODEL:-gpt-4o-mini}}
      MEMRADER_API_KEY: ${MEMRADER_API_KEY:-${OPENAI_API_KEY:-}}
      MEMRADER_API_BASE: ${MEMRADER_API_BASE:-${OPENAI_API_BASE:-${OPENAI_BASE_URL:-}}}
      FILE_LOCAL_PATH: /data/files
    depends_on:
      mem0:
        condition: service_healthy
      falkordb:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      letta:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMOS_API_HOST_PORT:-8001}:8001
    volumes:
      - memos_data:/data
    networks:
      memory_private: {}
      memory_edge: {}
      nyra_net:
        aliases:
          - memos-api
          - memory-memos-api
    healthcheck:
      test:
        ["CMD-SHELL", "curl -fsS http://127.0.0.1:8001/health >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3

  memos-mcp:
    image: ${MEMOS_IMAGE:-nyra/memorytensor-memos:local}
    container_name: ${COMPOSE_PROJECT_NAME:-oracle-vps}-memos-mcp
    restart: unless-stopped
    command:
      - /bin/sh
      - -lc
      - mkdir -p /data/files && exec python -m memos.api.mcp_serve --transport sse --host 0.0.0.0 --port 8085
    environment:
      <<: *memos-env
    depends_on:
      memos-api:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      letta:
        condition: service_healthy
    ports:
      - 127.0.0.1:${MEMOS_MCP_HOST_PORT:-8095}:8085
    volumes:
      - memos_data:/data
    networks:
      memory_private: {}
      memory_edge: {}
      nyra_net:
        aliases:
          - memos-mcp
          - memory-memos-mcp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c ''import socket; s=socket.create_connection(("127.0.0.1", 8085), 5); s.close()''',
        ]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  memory_private:
    external: true
    name: nyra_memory_private
  memory_edge:
    external: true
    name: nyra_memory_edge
  nyra_net:
    external: true
    name: nyra-network_nyra_net

volumes:
  memos_data:
