# docker-compose.persistent.yml — Oracle VPS
# =============================================================================
# NEVER include this in make down, make stack-down, or any teardown target.
# Oracle is the Portainer CE host — the central management UI for all environments.
# restart: always ensures Docker daemon re-launches these after reboot.
#
# Portainer Agent on the same host as CE: configured in Portainer CE as a
# "Local" Docker endpoint via /var/run/docker.sock.
#
# HOST_HOME_PATH: set in infra/hosts/oracle-vps/.env to the oracle user's home
# e.g., HOST_HOME_PATH=/home/ubuntu
#
# Deploy:   make persistent-up-oracle
# =============================================================================

services:
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: nyra-persistent-oracle-portainer-ce
    restart: always
    ports:
      - "8050:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock

  portainer-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-persistent-oracle-portainer-agent
    restart: always
    ports:
      - "9001:9001"
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,oracle}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

volumes:
  portainer_data:
    name: nyra-persistent-portainer-ce-data-oracle
