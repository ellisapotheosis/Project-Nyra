# ============================================================================
# Loki Configuration — Single-Node Oracle VPS
# ============================================================================
# Auth enabled: false (single-tenant, internal Tailnet only)
# Storage: local filesystem (sufficient for single-node VPS)
# Retention: 7 days (adjustable via table_manager)
# Documentation: https://grafana.com/docs/loki/latest/configure/

auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096
  log_level: info

common:
  path_prefix: /loki
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules
  replication_factor: 1
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: 2020-10-24
      store: boltdb-shipper
      object_store: filesystem
      schema: v11
      index:
        prefix: index_
        period: 24h

storage_config:
  boltdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/cache
    shared_store: filesystem
  filesystem:
    directory: /loki/store

compactor:
  working_directory: /loki/compactor
  shared_store: filesystem
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150

table_manager:
  retention_deletes_enabled: true
  retention_period: 168h

limits_config:
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  ingestion_rate_mb: 64
  ingestion_burst_size_mb: 128
  per_stream_rate_limit: 10mb
  per_stream_rate_limit_burst: 20mb
  max_entries_limit_per_query: 50000

chunk_store_config:
  max_look_back_period: 168h

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      enable_fifocache: true
      fifocache:
        max_size_bytes: 500MB
        validity: 24h

querier:
  max_concurrent: 10

frontend:
  max_outstanding_per_tenant: 2048
  compress_responses: true

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-temp
  alertmanager_url: http://localhost:9093
  ring:
    kvstore:
      store: inmemory
  enable_api: true

ingester:
  chunk_idle_period: 1h
  chunk_retain_period: 30s
  max_chunk_age: 1h
  lifecycler:
    ring:
      kvstore:
        store: inmemory
      replication_factor: 1
    final_sleep: 0s
    min_ready_duration: 0s

# ============================================================================
# Usage
# ============================================================================
# Push endpoint: http://100.64.0.3:3100/loki/api/v1/push
# Query endpoint: http://100.64.0.3:3100/loki/api/v1/query
# Ready check:  http://127.0.0.1:3100/ready
#
# Promtail on workers should target:
#   clients:
#     - url: http://100.64.0.3:3100/loki/api/v1/push
#       tenant_id: project-nyra
