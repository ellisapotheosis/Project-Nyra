# Infisical Agent Vault (Cloud-backed credential broker)
# Overlay onto the canonical oracle-vps compose.
# Usage: docker --context oracle compose -f docker-compose.yml -f docker-compose.agent-vault.yml up -d agent-vault
#
# Infisical is the read-only credential store for Agent Vault. The Universal
# Auth values are supplied at deployment time and must not be committed.

services:
  agent-vault:
    image: infisical/agent-vault:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-agent-vault
    restart: unless-stopped
    environment:
      AGENT_VAULT_ADDR: ${AGENT_VAULT_ADDR:-http://100.64.0.3:14321}
      INFISICAL_URL: ${INFISICAL_URL:-https://app.infisical.com}
      # Prefer the exact Universal Auth names used by Infisical; retain the
      # CLIENT_* aliases for Agent Vault/image versions that still expect them.
      INFISICAL_UNIVERSAL_AUTH_ID: ${INFISICAL_UNIVERSAL_AUTH_ID:-${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:?INFISICAL_UNIVERSAL_AUTH_ID required}}
      INFISICAL_UNIVERSAL_AUTH_SECRET: ${INFISICAL_UNIVERSAL_AUTH_SECRET:-${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:?INFISICAL_UNIVERSAL_AUTH_SECRET required}}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_ID:-${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:?INFISICAL_UNIVERSAL_AUTH_ID required}}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_SECRET:-${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:?INFISICAL_UNIVERSAL_AUTH_SECRET required}}
      AGENT_VAULT_MASTER_PASSWORD: ${AGENT_VAULT_MASTER_PASSWORD:?AGENT_VAULT_MASTER_PASSWORD required}
      AGENT_VAULT_LOG_LEVEL: ${AGENT_VAULT_LOG_LEVEL:-info}
      AGENT_VAULT_LOGS_MAX_AGE_HOURS: ${AGENT_VAULT_LOGS_MAX_AGE_HOURS:-168}
      AGENT_VAULT_LOGS_MAX_ROWS_PER_VAULT: ${AGENT_VAULT_LOGS_MAX_ROWS_PER_VAULT:-10000}
      AGENT_VAULT_SMTP_HOST: ${AGENT_VAULT_SMTP_HOST:-}
      AGENT_VAULT_SMTP_PORT: ${AGENT_VAULT_SMTP_PORT:-587}
      AGENT_VAULT_SMTP_USERNAME: ${AGENT_VAULT_SMTP_USERNAME:-}
      AGENT_VAULT_SMTP_PASSWORD: ${AGENT_VAULT_SMTP_PASSWORD:-}
      AGENT_VAULT_SMTP_FROM: ${AGENT_VAULT_SMTP_FROM:-}
      AGENT_VAULT_SMTP_FROM_NAME: ${AGENT_VAULT_SMTP_FROM_NAME:-Project Nyra Agent Vault}
      AGENT_VAULT_SMTP_TLS_MODE: ${AGENT_VAULT_SMTP_TLS_MODE:-required}
      AGENT_VAULT_SMTP_TLS_SKIP_VERIFY: ${AGENT_VAULT_SMTP_TLS_SKIP_VERIFY:-false}
    expose:
      - "14321"
      - "14322"
    # Port 14321: Agent Vault management/admin UI (private only)
    # Port 14322: Agent Vault credential proxy (private only, for vaulted agents)
    ports:
      - "${ORACLE_TAILSCALE_IP:-100.64.0.3}:14321:14321"
      - "${ORACLE_TAILSCALE_IP:-100.64.0.3}:14322:14322"
    volumes:
      - agent_vault_data:/data
    networks:
      nyra_net: {}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14321/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

networks:
  nyra_net:
    external: true
    name: ${ORACLE_MAIN_NETWORK:-nyra-network_nyra_net}

volumes:
  agent_vault_data:
    name: oracle-vps_agent_vault_data
