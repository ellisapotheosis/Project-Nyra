# Letta MCP bridge for the Oracle-hosted memory plane.

services:
  letta-mcp:
    image: ${LETTA_MCP_IMAGE:-ghcr.io/oculairmedia/letta-mcp-server-rust:rust-latest}
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-letta-mcp
    restart: unless-stopped
    environment:
      LETTA_BASE_URL: ${LETTA_BASE_URL:-http://letta:8283}
      LETTA_PASSWORD: ${LETTA_SERVER_PASSWORD:-}
    ports:
      - 127.0.0.1:${LETTA_MCP_HOST_PORT:-8284}:6507
    depends_on:
      letta:
        condition: service_healthy
    networks:
      memory_edge: {}
      nyra_net:
        aliases:
          - letta-mcp
          - memory-letta-mcp

networks:
  memory_edge:
    name: nyra_memory_edge
  nyra_net:
    external: true
    name: nyra-network_nyra_net
