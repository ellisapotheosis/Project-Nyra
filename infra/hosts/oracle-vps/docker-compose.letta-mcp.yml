# Letta MCP bridge for the Oracle-hosted memory plane.
#
# The package name is intentionally overridable because Letta MCP packaging has
# changed across releases. Set LETTA_MCP_PACKAGE if the default package name is
# not correct in your environment.

services:
  letta-mcp:
    image: node:20-alpine
    container_name: nyra-letta-mcp
    restart: unless-stopped
    environment:
      LETTA_BASE_URL: ${LETTA_BASE_URL:-http://letta:8283}
      LETTA_SERVER_PASSWORD: ${LETTA_SERVER_PASSWORD:-}
      LETTA_MCP_PACKAGE: ${LETTA_MCP_PACKAGE:-@letta-ai/letta-mcp-server}
      LETTA_MCP_PORT: ${LETTA_MCP_PORT:-8284}
    ports:
      - "127.0.0.1:${LETTA_MCP_HOST_PORT:-8284}:8284"
    command:
      - /bin/sh
      - -lc
      - |
        npm exec -y supergateway -- \
          --stdio "npx -y $$LETTA_MCP_PACKAGE" \
          --port "$$LETTA_MCP_PORT"
    depends_on:
      - letta
    networks:
      - memory_edge

networks:
  memory_edge:
    name: nyra_memory_edge
