# Persistent services for worker-rtx3090ti — Portainer edge agent + Syncthing
name: nyra-persistent

services:
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-persistent-worker-3090ti-portainer-agent
    restart: always
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID:-}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: "1"
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: nyra,edge,worker-3090ti
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - default

  syncthing:
    image: syncthing/syncthing:latest
    container_name: nyra-persistent-worker-3090ti-syncthing
    restart: always
    network_mode: host
    volumes:
      - /home/ellisapotheosis:/var/syncthing
