services:
  proxy:
    container_name: worker-3090-proxy
    image: python:3.11-slim
    restart: unless-stopped
    ports:
      - "80:80"
    environment:
      # base64 of proxy/proxy.py — regenerate with: base64 -w0 proxy/proxy.py
      PROXY_B64: ""
    entrypoint:
      - /bin/sh
      - -c
      - 'echo "$PROXY_B64" | base64 -d > /tmp/proxy.py && exec python3 /tmp/proxy.py'
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-3090
