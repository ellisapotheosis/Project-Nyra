version: '3.8'

services:
  llxprt-code:
    image: node:20-slim
    container_name: nyra-worker-3090ti-llxprt-code
    restart: unless-stopped
    environment:
      HOME: /tmp
    command:
      - /bin/sh
      - -c
      - "npx --yes @vybestack/llxprt-code server --port 8081 --host 0.0.0.0
    volumes:
      - ${HOME:-/home/ellisapotheosis}/.config:/tmp/.config:ro
    networks:
      - worker-network

networks:
  worker-network:
    external: true
