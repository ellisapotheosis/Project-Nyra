version: '3.8'

services:
  unmute-standalone:
    image: ghcr.io/kyutai-labs/unmute:latest
    container_name: worker-3090-unmute
    restart: unless-stopped
    environment:
      - UNMUTE_MODE=standalone
      - UNMUTE_MODEL_PROVIDER=vllm
      - UNMUTE_VLLM_URL=http://vllm:8000/v1
      - UNMUTE_OPENAI_API_KEY=${UNMUTE_OPENAI_API_KEY:-sk-dummy}
      - UNMUTE_HOST_PORT=8098
      # Openclaw/vLLM integration Ready
      - OPENCLAW_ENABLED=true
      - VLLM_API_BASE=http://vllm:8000/v1
    ports:
      - "8098:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-3090
