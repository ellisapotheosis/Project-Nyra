# ============================================================================
# Worker RTX 3090 Ti - Desktop PC (24GB VRAM)
# ============================================================================
# vLLM + LMCache for high-performance inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

version: '3.8'

services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  secrets-init:
    build:
      context: ../../infisical-secrets-init
    container_name: worker-3090-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx3090ti}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Infisical agent (polls Infisical and refreshes secrets) ──────────────
  infisical-agent:
    build:
      context: ../../infisical-secrets-init
    container_name: worker-3090-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx3090ti}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ============================================================================
  # vLLM Server with LMCache (24GB VRAM optimized)
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: worker-3090-vllm
    hostname: worker-3090-vllm
    restart: unless-stopped
    ports:
      - '${VLLM_PORT:-8000}:8000'
    volumes:
      - vllm-models:/root/.cache/huggingface
      - lmcache-data:/root/.cache/lmcache
      - ./logs/vllm:/var/log/vllm
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN_FILE=/run/nyra-secrets/hf_token
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      # LMCache Configuration
      - LMCACHE_ENABLED=true
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
      - LMCACHE_MAX_LOCAL_CACHE_SIZE=8G
    command: >
      --model meta-llama/Llama-3.1-8B-Instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --enable-prefix-caching
      --enable-chunked-prefill
      --quantization awq
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 32G
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 120s
    labels:
      - 'com.nyra.service=vllm'
      - 'com.nyra.worker=rtx3090ti'
      - 'com.nyra.gpu=rtx-3090-ti'
      - 'com.nyra.vram=24gb'
      - 'com.nyra.device=desktop-pc'
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
    networks:
      - worker-network

  # ============================================================================
  # LMCache Server (KV Cache sharing)
  # ============================================================================
  lmcache:
    image: lmcache/lmcache-server:latest
    container_name: worker-3090-lmcache
    hostname: worker-3090-lmcache
    restart: unless-stopped
    ports:
      - '${LMCACHE_PORT:-8100}:8100'
    volumes:
      - lmcache-data:/data
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - LMCACHE_CONFIG_FILE=/etc/lmcache/config.yaml
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8100/health']
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - 'com.nyra.service=lmcache'
      - 'com.nyra.worker=rtx3090ti'
    networks:
      - worker-network

  # ============================================================================
  # Promtail - Log Shipper to Loki
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: worker-3090-promtail
    hostname: worker-3090-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - ./logs:/var/log/worker-3090:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://loki:3100}
      - WORKER_ID=${WORKER_ID:-worker-3090}
      - HOSTNAME=worker-3090
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    labels:
      - 'com.project-nyra.service=promtail'
      - 'com.project-nyra.worker=worker-3090'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================================================
  # Node Exporter - System metrics for Prometheus
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-3090-node-exporter
    hostname: worker-3090-node-exporter
    restart: unless-stopped
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    networks:
      - worker-network
    labels:
      - 'com.project-nyra.service=node-exporter'
      - 'com.project-nyra.worker=worker-3090'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

  # ============================================================================
  # NVIDIA GPU Exporter - GPU metrics for Prometheus
  # ============================================================================
  nvidia-gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: worker-3090-nvidia-exporter
    hostname: worker-3090-nvidia-exporter
    restart: unless-stopped
    ports:
      - '9835:9835'
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network
    labels:
      - 'com.project-nyra.service=nvidia-exporter'
      - 'com.project-nyra.worker=worker-3090'
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

volumes:
  vllm-models:
    driver: local
  lmcache-data:
    driver: local
  nyra_secrets:
  ollama-models:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${OLLAMA_MODELS_PATH:-./data/ollama-models}

networks:
  worker-network:
    name: nyra-worker-3090
    driver: bridge
