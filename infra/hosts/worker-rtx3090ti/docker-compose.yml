# ============================================================================
# Worker RTX 3090 Ti - Desktop PC (24GB VRAM)
# ============================================================================
# vLLM + LMCache for high-performance inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

version: '3.8'

services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  secrets-init:
    build:
      context: ../../infisical-secrets-init
    container_name: worker-3090-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/workers/worker-rtx3090ti}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Infisical agent (polls Infisical and refreshes secrets) ──────────────
  infisical-agent:
    build:
      context: ../../infisical-secrets-init
    container_name: worker-3090-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/workers/worker-rtx3090ti}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Portainer Server (Standalone) ───────────────────────────────────────
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: worker-3090-portainer
    restart: unless-stopped
    command:
      - --http-enabled
      - --admin-password=${PORTAINER_ADMIN_PASSWORD}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - worker-network

  # ── Portainer Edge Agent ────────────────────────────────────────────────
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: worker-3090-portainer-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-network

  # ── Redis Cache (for LMCache and LiteLLM) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: worker-3090-redis
    hostname: worker-3090-redis
    restart: unless-stopped
    ports:
      - '${REDIS_PORT:-6379}:6379'
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worker-network

  # ── vLLM Server (24GB VRAM optimized) ───────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: worker-3090-vllm
    hostname: worker-3090-vllm
    restart: unless-stopped
    ports:
      - '${VLLM_PORT:-8000}:8000'
    volumes:
      - vllm_models:/root/.cache/huggingface
      - lmcache_data:/root/.cache/lmcache
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN_FILE=/run/nyra-secrets/hf_token
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - LMCACHE_ENABLED=true
      - LMCACHE_BACKEND=redis
      - LMCACHE_REDIS_HOST=worker-3090-redis
      - LMCACHE_REDIS_PORT=6379
    command: >
      --model ${VLLM_MODEL:-meta-llama/Llama-3.1-8B-Instruct}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.90
      --max-model-len 8192
      --enable-prefix-caching
      --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8000/health']
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - worker-network

  # ── LiteLLM Proxy (Local entrypoint) ────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: worker-3090-litellm
    hostname: worker-3090-litellm
    restart: unless-stopped
    ports:
      - '${LITELLM_PORT:-4000}:4000'
    environment:
      - MODEL_ID=worker-3090-vllm
      - VLLM_BASE_URL=http://worker-3090-vllm:8000/v1
    volumes:
      - ./litellm:/app/litellm:ro
      - nyra_secrets:/run/nyra-secrets:ro
    command: --config /app/litellm/config.yaml --port 4000
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ── Model Switcher ──────────────────────────────────────────────────────
  model-switcher:
    image: python:3.11-slim
    container_name: worker-3090-switcher
    hostname: worker-3090-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - vllm_models:/models
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - VLLM_URL=http://worker-3090-vllm:8000
      - AVAILABLE_MODELS=meta-llama/Llama-3.1-8B-Instruct,Qwen/Qwen2.5-32B-Instruct,mistralai/Mixtral-8x22B-Instruct-v0.1
      - DEFAULT_MODEL=meta-llama/Llama-3.1-8B-Instruct
    command: python /app/switcher.py
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ── Monitoring (Promtail, Node Exporter, GPU Exporter, Health) ──────────
  promtail:
    image: grafana/promtail:latest
    container_name: worker-3090-promtail
    restart: unless-stopped
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://oracle.trex-fiordland.ts.net:3100}
      - WORKER_ID=worker-3090
    command: -config.file=/etc/promtail/config.yml
    networks:
      - worker-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-3090-node-exporter
    restart: unless-stopped
    ports:
      - '9100:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
    networks:
      - worker-network

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: worker-3090-gpu-exporter
    restart: unless-stopped
    ports:
      - '9835:9835'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  health-monitor:
    image: curlimages/curl:latest
    container_name: worker-3090-health
    restart: unless-stopped
    depends_on:
      - vllm
      - litellm
    environment:
      - VLLM_URL=http://worker-3090-vllm:8000
      - LITELLM_URL=http://worker-3090-litellm:4000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf http://worker-3090-vllm:8000/health || echo "vLLM Down"
          sleep 60
        done
    networks:
      - worker-network

volumes:
  vllm_models:
  redis_data:
  lmcache_data:
  nyra_secrets:
  portainer_data:

networks:
  worker-network:
    name: nyra-worker-3090
    driver: bridge
