# ============================================================================
# Worker RTX 3090 Ti - Desktop PC (24GB VRAM)
# ============================================================================
# vLLM + LMCache for high-performance inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

services:
  # ── Portainer Edge Agent ────────────────────────────────────────────────
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-portainer-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-network

  # ── Redis Cache (for LMCache and LiteLLM) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-redis
    hostname: worker-3090-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory 4gb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worker-network

  # ── vLLM Server (24GB VRAM optimized) ───────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-vllm
    hostname: worker-3090-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
      - lmcache_data:/root/.cache/lmcache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN}
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      - LMCACHE_ENABLED=true
      - LMCACHE_BACKEND=redis
      - LMCACHE_REDIS_HOST=worker-3090-redis
      - LMCACHE_REDIS_PORT=6379
    entrypoint: []
    command:
      - /bin/sh
      - -c
      - |
        model=$$(cat /root/.cache/huggingface/current_model.txt 2>/dev/null || echo "$${VLLM_MODEL:-IlyaGusev/gemma-2-9b-it-abliterated}")
        echo "Starting vLLM with model: $$model"
        exec python3 -m vllm.entrypoints.openai.api_server \
          --model "$$model" \
          --host 0.0.0.0 \
          --port 8000 \
          --tensor-parallel-size 1 \
          --gpu-memory-utilization 0.90 \
          --max-model-len 2048 \
          --enable-prefix-caching \
          --enable-auto-tool-choice \
          --tool-call-parser qwen3_xml \
          --trust-remote-code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:8000/health'', timeout=8)"',
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 240s
    networks:
      - worker-network

  # ── LiteLLM Proxy (Local entrypoint) ────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-litellm
    hostname: worker-3090-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - MODEL_ID=worker-3090-vllm
      - VLLM_BASE_URL=http://worker-3090-vllm:8000/v1
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required}
    volumes:
      - ./litellm:/app/litellm:ro
    command: --config /app/litellm/config.yaml --port 4000
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/readiness'', timeout=8)"',
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 45s
    networks:
      - worker-network

  # ── Model Switcher ──────────────────────────────────────────────────────
  model-switcher:
    image: python:3.11-slim
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-switcher
    hostname: worker-3090-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - vllm_models:/models
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - VLLM_URL=http://worker-3090-vllm:8000
      - AVAILABLE_MODELS=IlyaGusev/gemma-2-9b-it-abliterated,cyankiwi/Qwen3.6-27B-AWQ-INT4,lhca521/Huihui-Qwen3.6-27B-abliterated-AWQ,cyankiwi/gemma-4-31B-it-AWQ-4bit,alonsoko/gemma-4-31b-it-abliterated-heretic-AWQ-W4A16,cyankiwi/gemma-4-26B-A4B-it-AWQ-4bit
      - DEFAULT_MODEL=IlyaGusev/gemma-2-9b-it-abliterated
    command: python /app/switcher.py
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ── Monitoring (Promtail, Node Exporter, GPU Exporter, Health) ──────────
  promtail:
    image: grafana/promtail:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-promtail
    restart: unless-stopped
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://oracle.trex-fiordland.ts.net:3100}
      - WORKER_ID=worker-3090
    command: -config.file=/etc/promtail/config.yml
    networks:
      - worker-network

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
    networks:
      - worker-network

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-gpu-exporter
    restart: unless-stopped
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  health-monitor:
    image: curlimages/curl:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-3090-health
    restart: unless-stopped
    depends_on:
      - vllm
      - litellm
    environment:
      - VLLM_URL=http://worker-3090-vllm:8000
      - LITELLM_URL=http://worker-3090-litellm:4000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf http://worker-3090-vllm:8000/health || echo "vLLM Down"
          sleep 60
        done
    networks:
      - worker-network

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    # Canonical Syncthing runs from docker-compose.persistent.yml as
    # nyra-persistent-worker-3090ti-syncthing. Leave this legacy surface opt-in
    # only to avoid starting a second host-networked instance on the same box.
    profiles: ["legacy-sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  vllm_models:
  redis_data:
  lmcache_data:
  syncthing_config:
  portainer_data:

networks:
  worker-network:
    name: nyra-worker-3090
    driver: bridge
