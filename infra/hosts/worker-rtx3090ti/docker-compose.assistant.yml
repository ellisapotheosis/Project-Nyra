# ============================================================================
# Assistant Stack - Worker RTX 3090 Ti
# ============================================================================
# OpenClaw + Nerve UI
# Optimized for local GPU inference
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # OpenClaw (Moltbot) - The Agent Brain
  # ============================================================================
  openclaw:
    image: moltbot/moltbot:latest
    container_name: assistant-openclaw
    hostname: assistant-openclaw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - OPENAI_API_BASE=http://vllm:8000/v1
      - OPENAI_API_KEY=${NEXUS_ADMIN_TOKEN:-dummy}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - TWENTY_API_KEY=${TWENTY_CRM_API_KEY}
      - TWENTY_URL=${TWENTY_CRM_URL}
      - NEXUS_URL=http://orchestrator:6000
    volumes:
      - ./openclaw:/home/node/.openclaw
      - assistant-memory:/home/node/.memory
    entrypoint: >
      sh -c "openclaw plugins install @memorytensor/openclaw-memos && exec openclaw gateway --port 18789"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network
      - assistant-mesh

networks:
  worker-network:
    external: true
    name: nyra-worker-3090
  assistant-mesh:
    name: assistant-mesh
    driver: bridge

volumes:
  assistant-memory:
    driver: local
