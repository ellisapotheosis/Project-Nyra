version: "3.8"

services:
  nyra-home-dashboard:
    image: ghcr.io/gethomepage/homepage:v0.10.9
    container_name: nyra-home-dashboard
    restart: unless-stopped
    ports:
      - "${HOMEPAGE_PORT:-3007}:3000"
    env_file:
      - .env.homeassistant
    environment:
      HOMEPAGE_ALLOWED_HOSTS: 
        ${HOMEASSISTANT_IP:-100.64.0.20}:3007,localhost:3007
      PORTAINER_URL: ${PORTAINER_URL}
      ARCHON_URL: ${ARCHON_URL}
      WEBAPP_URL: ${WEBAPP_URL}
      LANDING_URL: ${LANDING_URL}
      CRM_URL: ${CRM_URL}
      NEXUS_URL: ${NEXUS_URL}
      NEXUS_ADMIN_URL: ${NEXUS_ADMIN_URL}
      OPEN_WEBUI_URL: ${OPEN_WEBUI_URL}
      DIFY_URL: ${DIFY_URL}
      ACTIVEPIECES_URL: ${ACTIVEPIECES_URL}
      N8N_URL: ${N8N_URL}
      GRAFANA_URL: ${GRAFANA_URL}
      PROMETHEUS_URL: ${PROMETHEUS_URL}
      LOKI_URL: ${LOKI_URL}
      QDRANT_URL: ${QDRANT_URL}
      LETTA_URL: ${LETTA_URL}
      MEM0_URL: ${MEM0_URL}
      LINKWARDEN_URL: ${LINKWARDEN_URL}
      HOMEASSISTANT_URL: ${HOMEASSISTANT_URL}
    volumes:
      - ./homepage/config:/app/config
      - /var/run/docker.sock:/var/run/docker.sock:ro
  linkwarden-postgres:
    image: postgres:16-alpine
    container_name: linkwarden-postgres
    restart: unless-stopped
    env_file:
      - .env.homeassistant
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${HA_STACK_ROOT}/live-data/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - homeassistant-stack

  linkwarden-meilisearch:
    image: getmeili/meilisearch:v1.12.8
    container_name: linkwarden-meilisearch
    restart: unless-stopped
    env_file:
      - .env.homeassistant
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - ${HA_STACK_ROOT}/live-data/meili_data:/meili_data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7700/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    networks:
      - homeassistant-stack

  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.0
    container_name: linkwarden
    restart: unless-stopped
    env_file:
      - .env.homeassistant
    depends_on:
      linkwarden-postgres:
        condition: service_healthy
      linkwarden-meilisearch:
        condition: service_healthy
    ports:
      - "${LINKWARDEN_PORT:-3010}:3000"
    environment:
      DATABASE_URL: 
        postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@linkwarden-postgres:5432/${POSTGRES_DB:-postgres}
      NEXTAUTH_URL: ${NEXTAUTH_URL}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      MEILI_HOST: http://linkwarden-meilisearch:7700
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
      STORAGE_FOLDER: /data/data
    volumes:
      - ${HA_STACK_ROOT}/live-data/linkwarden_data:/data/data
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:3000/api/v1/public/health"]
      interval: 30s
      timeout: 8s
      retries: 10
    networks:
      - homeassistant-stack

  starwarden:
    image: rtuszik/starwarden:v1.4.0
    container_name: starwarden
    restart: unless-stopped
    env_file:
      - .env.homeassistant
    environment:
      LINKWARDEN_URL: ${LINKWARDEN_INTERNAL_URL:-http://linkwarden:3000}
      LINKWARDEN_TOKEN: ${LINKWARDEN_TOKEN}
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      COLLECTION_ID: ${COLLECTION_ID:-}
      CRON_SCHEDULE: ${CRON_SCHEDULE:-0 */6 * * *}
      APPRISE_URLS: ${APPRISE_URLS:-}
      OPT_TAG: ${OPT_TAG:-true}
      OPT_TAG_GITHUB: ${OPT_TAG_GITHUB:-true}
      OPT_TAG_GITHUBSTARS: ${OPT_TAG_GITHUBSTARS:-true}
      OPT_TAG_LANGUAGE: ${OPT_TAG_LANGUAGE:-false}
      OPT_TAG_USERNAME: ${OPT_TAG_USERNAME:-false}
      OPT_TAG_CUSTOM: ${OPT_TAG_CUSTOM:-}
    volumes:
      - ${HA_STACK_ROOT}/logs/starwarden.log:/app/starwarden.log
    depends_on:
      linkwarden:
        condition: service_healthy
    networks:
      - homeassistant-stack

  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: homeassistant-portainer
    restart: unless-stopped
    command:
      - --http-enabled
      - --admin-password=${PORTAINER_ADMIN_PASSWORD}
    ports:
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - homeassistant-stack

  secrets-init:
    build:
      context: ../../infisical-secrets-init
    container_name: homeassistant-secrets-init
    restart: no
    command:
      - /usr/local/bin/secrets-init.sh
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: 
        ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/homeassistant}
    volumes:
      - nyra_secrets:/run/nyra-secrets
  infisical-agent:
    build:
      context: ../../infisical-secrets-init
    container_name: homeassistant-infisical-agent
    restart: unless-stopped
    entrypoint:
      - /usr/local/bin/agent-sidecar.sh
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: 
        ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/homeassistant}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
networks:
  homeassistant-stack:
    name: homeassistant-stack
volumes:
  nyra_secrets:
  portainer_data:
