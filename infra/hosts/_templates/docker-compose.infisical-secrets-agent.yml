# Infisical Secrets Distribution Template
# For any host (orchestrator, workers) that needs access to cloud Infisical secrets.
#
# Usage:
#   On orchestrator (already included in main compose): no action needed
#   On worker: docker compose -f docker-compose.yml -f docker-compose.infisical-secrets-agent.yml up -d
#
# This overlay adds:
# - secrets-init: one-time bootstrap from cloud Infisical
# - infisical-agent: continuous polling/refresh sidecar
# - nyra_secrets volume: shared mount for all services
#
# Services must:
# 1. Depend on infisical-agent (condition: service_started)
# 2. Mount nyra_secrets:/run/nyra-secrets:ro
# 3. Read secrets from /run/nyra-secrets/current/SECRET_NAME (lowercase)
#    OR use: source <(infisical export --format=bash --env=$ENV --path=$PATH)

services:
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-${WORKER_NAME:-local}-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/orchestrator}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: []

  infisical-agent:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-${WORKER_NAME:-local}-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/orchestrator}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: []

volumes:
  nyra_secrets:
    driver: local
