# Shared Infisical runtime overlay.
#
# Use this with the host compose file from the repo root:
#   NYRA_INFISICAL_PATH=/hosts/orchestrator \
#   docker --context <ctx> compose -f infra/hosts/<host>/docker-compose.yml \
#     -f infra/hosts/_templates/docker-compose.infisical-runtime.yml up -d
#
# It consumes the active shell environment. It does not require per-host .env
# files in the compose directory.

services:
  infisical-agent:
    image: infisical/cli:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-infisical-agent
    restart: unless-stopped
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${NYRA_INFISICAL_PATH:-/}
      INFISICAL_EXPORT_INTERVAL_SECONDS: ${INFISICAL_EXPORT_INTERVAL_SECONDS:-300}
    volumes:
      - nyra_runtime_secrets:/run/nyra-secrets
    entrypoint: ["/bin/sh", "-lc"]
    command: |
      mkdir -p /run/nyra-secrets
      while true; do
        if [ -n "$$INFISICAL_TOKEN" ]; then
          infisical export \
            --env "$$INFISICAL_ENV" \
            --path "$$INFISICAL_PATH" \
            --format dotenv > /run/nyra-secrets/runtime.env.tmp &&
            mv /run/nyra-secrets/runtime.env.tmp /run/nyra-secrets/runtime.env
        else
          : > /run/nyra-secrets/runtime.env
          echo "INFISICAL_TOKEN is not set; wrote empty runtime env."
        fi
        sleep "$$INFISICAL_EXPORT_INTERVAL_SECONDS"
      done

  infisical-sidecar:
    image: alpine:3.20
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-infisical-sidecar
    restart: unless-stopped
    depends_on:
      - infisical-agent
    volumes:
      - nyra_runtime_secrets:/run/nyra-secrets:ro
    command:
      - /bin/sh
      - -lc
      - |
        while true; do
          test -f /run/nyra-secrets/runtime.env && wc -l /run/nyra-secrets/runtime.env || true
          sleep 300
        done

volumes:
  nyra_runtime_secrets:
