# ============================================================================
# Worker RTX 5090 - Primary Reasoning Appliance (32GB VRAM)
# ============================================================================
# vLLM + LMCache for bleeding-edge reasoning
# Connected via Tailscale mesh to orchestrator
# ============================================================================

services:
  # Portainer Agent and Syncthing are managed by docker-compose.persistent.yml
  # (make persistent-up-worker-5090) and must never appear here.

  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx5090}
      NYRA_SECRETS_DIR: /run/nyra-secrets
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Redis Cache (for LMCache and LiteLLM) ───────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-redis
    hostname: worker-5090-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    command: redis-server --maxmemory ${REDIS_MAX_MEMORY:-4gb} --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - worker-network

  # ── vLLM Server ─────────────────────────────────────────────────────────
  vllm:
    image: vllm/vllm-openai:latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-vllm
    hostname: worker-5090-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm_models:/root/.cache/huggingface
      - lmcache_data:/root/.cache/lmcache
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN}
      - LMCACHE_ENABLED=true
      - LMCACHE_BACKEND=redis
      - LMCACHE_REDIS_HOST=worker-5090-redis
      - LMCACHE_REDIS_PORT=${LMCACHE_REDIS_PORT:-6379}
    command: >
      --model ${VLLM_MODEL:-QuantTrio/Qwen3.6-27B-AWQ}
      --host 0.0.0.0
      --port 8000
      --gpu-memory-utilization 0.945
      --max-model-len 3072
      --trust-remote-code
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 180s
    networks:
      - worker-network

  # ── LiteLLM Proxy ───────────────────────────────────────────────────────
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-litellm
    hostname: worker-5090-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - VLLM_BASE_URL=http://worker-5090-vllm:8000/v1
    volumes:
      - ./litellm:/app/litellm:ro
    command: --config /app/litellm/config.yaml --port 4000
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  model-switcher:
    image: python:3.11-slim
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-switcher
    hostname: worker-5090-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - vllm_models:/models
    environment:
      - VLLM_URL=http://worker-5090-vllm:8000
      - AVAILABLE_MODELS=${AVAILABLE_MODELS:-QuantTrio/Qwen3.6-27B-AWQ,google/gemma-4-26B-A4B,meta-llama/Llama-3.1-8B-Instruct}
      - DEFAULT_MODEL=${VLLM_MODEL:-QuantTrio/Qwen3.6-27B-AWQ}
      - SPECIALIZATION=reasoning,planning,coding,large-context
    command: python /app/switcher.py
    depends_on:
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ── Monitoring ──────────────────────────────────────────────────────────
  promtail:
    image: grafana/promtail:latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-promtail
    restart: unless-stopped
    network_mode: host
    volumes:
      - ./promtail:/etc/promtail:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://100.64.0.3:3100}
      - WORKER_ID=worker-5090
    command: -config.file=/etc/promtail/config.yml -config.expand-env=true

  node-exporter:
    image: prom/node-exporter:latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-gpu-exporter
    restart: unless-stopped
    ports:
      - "9835:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-cadvisor
    restart: unless-stopped
    privileged: true
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro
    networks:
      - worker-network

  health-monitor:
    image: curlimages/curl:latest
    container_name: ${COMPOSE_PROJECT_NAME:-worker-rtx5090}-worker-5090-health
    restart: unless-stopped
    depends_on:
      - vllm
      - litellm
    environment:
      - VLLM_URL=http://worker-5090-vllm:8000
      - LITELLM_URL=http://worker-5090-litellm:4000
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          curl -sf http://worker-5090-vllm:8000/health || echo "vLLM Down"
          sleep 60
        done
    networks:
      - worker-network

volumes:
  vllm_models:
  lmcache_data:
  redis_data:
  nyra_secrets:

networks:
  worker-network:
    name: nyra-worker-5090
    driver: bridge
