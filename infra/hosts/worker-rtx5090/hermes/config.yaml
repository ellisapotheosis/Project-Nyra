# Seed config for the worker-local Hermes gateway.
# The runtime copy lives in ${HERMES_DATA_DIR}/config.yaml after hermes-init runs.
model:
  provider: custom
  default: deepseek-ai/DeepSeek-V3
  base_url: http://worker-5090-vllm:8000/v1
  api_key: ""
  context_length: 65536

mcp_servers:
  agentmemory:
    command: npx
    args: ["-y", "@agentmemory/mcp"]

