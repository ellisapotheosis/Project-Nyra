services:
  vllm-server:
    image: vllm/vllm-openai:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-rtx5090-vllm
    profiles: ["gpu"]
    environment:
      - MODEL_NAME=${VLLM_MODEL:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      - VLLM_HOST=${VLLM_HOST:-0.0.0.0}
      - VLLM_PORT=${VLLM_PORT:-8000}
      - VLLM_TENSOR_PARALLEL_SIZE=${VLLM_TENSOR_PARALLEL_SIZE:-1}
      - VLLM_MAX_MODEL_LEN=${VLLM_MAX_MODEL_LEN:-8192}
      - VLLM_GPU_MEMORY_UTILIZATION=${VLLM_GPU_MEMORY_UTILIZATION:-0.88}
      - NVIDIA_VISIBLE_DEVICES=all
      - LMCACHE_ENABLED=true
      - LMCACHE_BACKEND=redis
      - LMCACHE_REDIS_HOST=redis-cache
      - LMCACHE_REDIS_PORT=6379
    ports:
      - "0.0.0.0:8000:8000" # Expose on all interfaces for Tailscale
    volumes:
      - /root/.cache/huggingface:/root/.cache/huggingface
      - vllm_models:/models
      - lmcache_data:/root/.cache/lmcache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: >
      --model ${VLLM_MODEL:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL_SIZE:-1}
      --max-model-len ${VLLM_MAX_MODEL_LEN:-8192}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION:-0.88}
      --trust-remote-code
      --enable-lmcache
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  lmcache-server:
    image: lmcache/lmcache-server:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-rtx5090-lmcache
    profiles: ["gpu"]
    environment:
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
      - LMCACHE_MAX_LOCAL_CACHE_SIZE=8G
    ports:
      - "127.0.0.1:8100:8100"
    volumes:
      - lmcache_data:/data
    restart: unless-stopped

  redis-cache:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-rtx5090-redis
    profiles: ["gpu"]
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  vllm_models:
  redis_data:
  lmcache_data:

networks:
  default:
    name: nyra-worker-rtx5090
