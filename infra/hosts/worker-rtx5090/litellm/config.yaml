model_list:
  # ── Local GPU — RTX 5090 (llama.cpp, Qwen3.8-27B Q4_K_M) ──────────────────
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/qwen3.8-27b
      api_base: http://qwen38-llama:8000/v1
      api_key: "not-needed"
      timeout: 300

  # ── llxprt-bridge — Subscription Models (claude-code, codex, gemini) ───────
  - model_name: llxprt/claude
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://llxprt-bridge:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/codex
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://llxprt-bridge:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/gemini
    litellm_params:
      model: openai/llxprt-gemini
      api_base: http://llxprt-bridge:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  # ── OmniRoute (oracle-vps via Tailscale) ───────────────────────────────────
  - model_name: omniroute/auto
    litellm_params:
      model: openai/auto
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 180

  - model_name: omniroute/coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300

  - model_name: omniroute/fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 90

  # ── OpenRouter Free Tier ────────────────────────────────────────────────────
  - model_name: openrouter/gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  - model_name: openrouter/deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-chat:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90

  - model_name: openrouter/qwen3
    litellm_params:
      model: openrouter/qwen/qwen3-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/llama4
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

# ── Routing & Fallbacks ──────────────────────────────────────────────────────
router_settings:
  routing_strategy: usage-based-routing-v2
  fallbacks:
    - { "local/qwen3.8-27b": ["omniroute/auto", "openrouter/qwen3"] }
    - { "llxprt/claude": ["omniroute/auto", "openrouter/gemini-flash"] }
    - { "omniroute/auto": ["local/qwen3.8-27b", "openrouter/qwen3"] }
    - { "omniroute/coding": ["llxprt/codex", "openrouter/deepseek"] }

litellm_settings:
  set_verbose: false
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: worker-5090-redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
