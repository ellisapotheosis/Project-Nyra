# Promtail Configuration for Worker RTX 5090
# Ships logs to Loki for centralized logging

server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: ${LOKI_URL}/loki/api/v1/push
    tenant_id: worker-5090

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: label
            values: ["com.docker.compose.project=worker-5090"]

    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'

      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'

      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'

    pipeline_stages:
      - json:
          expressions:
            level: level
            timestamp: time
            message: msg

      - labels:
          level:
          service:

      - timestamp:
          source: timestamp
          format: RFC3339

      - output:
          source: message

  # Ollama logs
  - job_name: ollama
    static_configs:
      - targets:
          - localhost
        labels:
          job: ollama
          worker_id: worker-5090
          __path__: /var/log/ollama/*.log

    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+) (?P<level>\S+) (?P<message>.*)'

      - labels:
          level:

      - timestamp:
          source: timestamp
          format: RFC3339Nano

      - output:
          source: message

  # System logs (Windows Event Logs via Docker volume mount)
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          worker_id: worker-5090
          __path__: /var/log/*.log

    pipeline_stages:
      - match:
          selector: '{job="system"}'
          stages:
            - regex:
                expression: '^(?P<timestamp>\S+) (?P<level>\S+) (?P<message>.*)'

            - labels:
                level:

            - timestamp:
                source: timestamp
                format: RFC3339

# Limits
limits_config:
  readline_rate: 10000
  readline_burst: 20000
