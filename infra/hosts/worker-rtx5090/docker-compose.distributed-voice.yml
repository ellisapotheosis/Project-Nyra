services:
  unmute-llm:
    image: ghcr.io/kyutai-labs/unmute:latest
    container_name: worker-5090-unmute-llm
    restart: unless-stopped
    environment:
      - UNMUTE_MODE=distributed
      - UNMUTE_ROLE=llm
      - UNMUTE_STT_URL=http://worker-rtx3060:8081
      - UNMUTE_TTS_URL=http://worker-rtx3090ti:8081
      - UNMUTE_MODEL_PROVIDER=vllm
      - UNMUTE_VLLM_URL=http://vllm:8000/v1
      - UNMUTE_OPENAI_API_KEY=${UNMUTE_OPENAI_API_KEY:?UNMUTE_OPENAI_API_KEY is required}
    ports:
      - "8081:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-5090
