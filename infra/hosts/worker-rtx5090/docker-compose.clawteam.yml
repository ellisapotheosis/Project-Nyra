# infra/hosts/worker-rtx5090/docker-compose.clawteam.yml
# 🦞 Project Nyra - ClawTeam Node Override for RTX 5090

services:
  openclaw:
    container_name: worker-5090-clawteam
    environment:
      - CLAWTEAM_ROLE=node
      - WORKER_NAME=rtx5090
      - NERVE_UI_ENABLED=true
    ports:
      - "8001:8001"
      - "18789:18789"
    # Ensure it can communicate with the local vLLM
    depends_on:
      - litellm
