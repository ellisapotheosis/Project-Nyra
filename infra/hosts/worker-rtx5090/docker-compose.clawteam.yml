# infra/hosts/worker-rtx5090/docker-compose.clawteam.yml
# ClawTeam primary colocated with OpenClaw/Nerve on the 5090 worker.
# This is a separate service; it must not override or rename OpenClaw.

services:
  clawteam:
    build:
      context: ../../images/clawteam
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-5090-clawteam-primary
    hostname: worker-5090-clawteam
    environment:
      CLAWTEAM_ROLE: primary
      CLAWTEAM_HOST: worker-rtx5090
      WORKER_NODES: '["worker-rtx5090", "worker-rtx3090ti", "worker-rtx3060", "orchestrator"]'
      NERVE_UI_ENABLED: "false"
      LITELLM_API_URL: ${CLAWTEAM_LITELLM_API_URL:-http://100.64.0.3:4000}
      NEXUS_ROUTER_URL: ${CLAWTEAM_NEXUS_ROUTER_URL:-http://100.64.0.3:7000}
    ports:
      - "${CLAWTEAM_PORT:-9001}:8080"
    volumes:
      - clawteam_state:/root/.clawteam
    networks:
      - worker-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 10s
      timeout: 3s
      retries: 3
volumes:
  clawteam_state:
    name: ${COMPOSE_PROJECT_NAME:-nyra}-worker-5090-clawteam-state

networks:
  worker-network:
    external: true
    name: nyra-worker-5090
