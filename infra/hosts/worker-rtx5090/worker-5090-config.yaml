# Worker RTX 5090 Configuration
# Complete configuration for the primary reasoning worker

worker:
  id: worker-5090
  role: primary_reasoning
  hostname: ${MACHINE_HOSTNAME}

  gpu:
    type: rtx_5090
    vram_gb: 48
    compute_capability: "8.9"
    pci_bus_id: "0000:01:00.0"

  specialization:
    - complex_reasoning
    - mortgage_calculations
    - compliance_analysis
    - multi_step_logic
    - financial_modeling

  models:
    primary:
      - name: deepseek-r1:236b-instruct-q4_K_M
        display_name: DeepSeek-R1 236B
        size_gb: 130
        vram_usage_gb: 36
        quantization: q4_K_M
        use_cases:
          - mortgage_qualification
          - compliance_validation
          - complex_calculations
          - multi_agent_reasoning
        performance:
          tokens_per_second: 15
          context_length: 32768
          load_time_seconds: 45

      - name: qwen2.5:72b-instruct-q5_K_M
        display_name: Qwen 2.5 72B
        size_gb: 48
        vram_usage_gb: 42
        quantization: q5_K_M
        use_cases:
          - general_reasoning
          - document_analysis
          - loan_logic
          - code_generation
        performance:
          tokens_per_second: 25
          context_length: 32768
          load_time_seconds: 25

  networking:
    tailscale:
      hostname: worker-5090.tail-net.ts.net
      ip: ${MACHINE_IP_TAILSCALE}
      magic_dns: true

    local:
      ethernet_ip: ${MACHINE_IP_ETHERNET}
      wifi_ip: ${MACHINE_IP_WIFI}

    ports:
      ollama: 11434
      litellm: 4000
      model_manager: 8080
      perf_monitor: 9090
      health_check: 8081
      prometheus_metrics: 9091

    cloudflared:
      enabled: false
      hostnames:
        ollama: worker-5090.projectnyra.com
        litellm: litellm-5090.projectnyra.com
        models: models-5090.projectnyra.com
        metrics: metrics-5090.projectnyra.com
        health: health-5090.projectnyra.com

  monitoring:
    prometheus:
      enabled: true
      port: 9091
      scrape_interval: 15s
      metrics_path: /metrics

    health_check:
      enabled: true
      port: 8081
      interval_seconds: 30
      timeout_seconds: 15
      retries: 3

      checks:
        - name: gpu
          critical: true
        - name: ollama
          critical: true
        - name: docker_services
          critical: true
        - name: models_loaded
          critical: false

    alerts:
      gpu:
        temperature:
          warning: 80
          critical: 85
        vram_usage:
          warning: 85
          critical: 95
        utilization:
          warning: 95
          critical: 98

      system:
        cpu_usage:
          warning: 85
          critical: 95
        memory_usage:
          warning: 85
          critical: 95
        disk_usage:
          warning: 80
          critical: 90

      inference:
        latency_seconds:
          warning: 10
          critical: 30
        queue_depth:
          warning: 10
          critical: 20

    logging:
      level: info
      format: json
      outputs:
        - type: file
          path: /app/logs/worker-5090.log
          max_size_mb: 100
          max_backups: 10
        - type: loki
          url: ${LOKI_URL}
          labels:
            worker_id: worker-5090
            environment: ${ENV:-dev}
        - type: stdout
          enabled: true

  performance:
    ollama:
      num_parallel: 8
      max_loaded_models: 2
      keep_alive: 30m
      max_vram_gb: 46
      num_gpu: 1

    docker:
      cpu_limit: 16
      memory_limit_gb: 32
      restart_policy: unless-stopped

    model_loading:
      preload_models:
        - deepseek-r1:236b-instruct-q4_K_M
      lazy_load: false
      cache_models: true

  orchestrator:
    nexus_router:
      url: ${NEXUS_ROUTER_URL}
      admin_token: ${NEXUS_ADMIN_TOKEN}
      registration:
        enabled: true
        interval_seconds: 60

      heartbeat:
        enabled: true
        interval_seconds: 30
        timeout_seconds: 10

    priority: 1
    max_concurrent_requests: 4
    queue_depth: 10
    timeout_seconds: 300

  security:
    tls:
      enabled: false
      cert_path: /certs/worker-5090.crt
      key_path: /certs/worker-5090.key

    authentication:
      required: true
      methods:
        - bearer_token
        - api_key

    firewall:
      allow_ips:
        - 100.0.0.0/8 # Tailscale
        - 172.16.0.0/12 # Docker networks
        - 192.168.0.0/16 # Local LAN

      deny_public: true

  maintenance:
    auto_update:
      enabled: false
      schedule: "0 3 * * 0" # 3 AM on Sundays

    backup:
      enabled: true
      schedule: "0 2 * * *" # 2 AM daily
      retention_days: 7
      targets:
        - ollama_models
        - configurations
        - logs

    cleanup:
      enabled: true
      schedule: "0 4 * * *" # 4 AM daily
      actions:
        - old_logs
        - unused_models
        - docker_volumes
