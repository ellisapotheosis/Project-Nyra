# ============================================================================
# Worker RTX 5090 - Alienware Area-51 Laptop (32GB VRAM)
# ============================================================================
# vLLM + LMCache for high-performance large model inference
# Specialization: Complex reasoning, mortgage calculations, compliance analysis
# Primary models: Llama 3.1 70B, DeepSeek-R1 70B, Qwen 2.5 72B
# Connected via Tailscale mesh to orchestrator
# ============================================================================

version: '3.8'

services:
  # ============================================================================
  # vLLM Server with LMCache (32GB VRAM - Maximum Performance)
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: worker-5090-vllm
    hostname: worker-5090-vllm
    restart: unless-stopped
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
      - lmcache-data:/root/.cache/lmcache
      - ./logs/vllm:/var/log/vllm
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN=${HF_TOKEN:-}
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      # LMCache Configuration  
      - LMCACHE_ENABLED=true
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
      - LMCACHE_MAX_LOCAL_CACHE_SIZE=12G  # Larger cache for 32GB
    command: >
      --model Qwen/Qwen2.5-Coder-32B-Instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.92
      --max-model-len 32768
      --enable-prefix-caching
      --enable-chunked-prefill
      --trust-remote-code
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 48G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s  # Longer startup for 70B model
    labels:
      - "com.nyra.service=vllm"
      - "com.nyra.worker=rtx5090"
      - "com.nyra.gpu=rtx-5090"
      - "com.nyra.vram=32gb"
      - "com.nyra.device=alienware-area51"
      - "com.nyra.specialization=large-models"
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "5"
    networks:
      - worker-network

  # ============================================================================
  # LMCache Server (KV Cache sharing - optimized for large models)
  # ============================================================================
  lmcache:
    image: lmcache/lmcache-server:latest
    container_name: worker-5090-lmcache
    hostname: worker-5090-lmcache
    restart: unless-stopped
    ports:
      - "${LMCACHE_PORT:-8100}:8100"
    volumes:
      - lmcache-data:/data
    environment:
      - LMCACHE_CONFIG_FILE=/etc/lmcache/config.yaml
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
      - LMCACHE_MAX_SIZE=12G
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=lmcache"
      - "com.nyra.worker=rtx5090"
    networks:
      - worker-network

  # ============================================================================
  # Model Switcher - Hot-swap between large models
  # Available models optimized for 32GB VRAM:
  # - Llama 3.1 70B (AWQ quantized)
  # - DeepSeek-R1 70B (reasoning specialist)
  # - Qwen 2.5 72B (multilingual)
  # - Mixtral 8x22B (MoE for varied tasks)
  # ============================================================================
  model-switcher:
    image: python:3.11-slim
    container_name: worker-5090-switcher
    hostname: worker-5090-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - vllm-models:/models
    environment:
      - VLLM_URL=http://vllm:8000
      - AVAILABLE_MODELS=meta-llama/Llama-3.1-70B-Instruct-AWQ,deepseek-ai/DeepSeek-R1-Distill-Llama-70B,Qwen/Qwen2.5-72B-Instruct-AWQ,mistralai/Mixtral-8x22B-Instruct-v0.1-AWQ
      - DEFAULT_MODEL=meta-llama/Llama-3.1-70B-Instruct-AWQ
      - SPECIALIZATION=mortgage,compliance,reasoning
    command: python /app/switcher.py
    depends_on:
      - vllm
    labels:
      - "com.nyra.service=model-switcher"
      - "com.nyra.worker=rtx5090"
    networks:
      - worker-network

  # ============================================================================
  # LiteLLM Proxy - OpenAI-compatible API
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: worker-5090-litellm
    hostname: worker-5090-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-worker-5090}
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --port 4000
    depends_on:
      vllm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=litellm"
      - "com.nyra.worker=rtx5090"
    networks:
      - worker-network

  # ============================================================================
  # GPU Metrics Exporter
  # ============================================================================
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: worker-5090-gpu-exporter
    hostname: worker-5090-gpu-exporter
    restart: unless-stopped
    ports:
      - "${GPU_EXPORTER_PORT:-9835}:9835"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "com.nyra.service=gpu-exporter"
      - "com.nyra.worker=rtx5090"
    networks:
      - worker-network

  # ============================================================================
  # Health Monitor & Orchestrator Reporter
  # ============================================================================
  health-monitor:
    image: curlimages/curl:latest
    container_name: worker-5090-health
    hostname: worker-5090-health
    restart: unless-stopped
    depends_on:
      - vllm
      - litellm
    environment:
      - VLLM_URL=http://vllm:8000
      - LITELLM_URL=http://litellm:4000
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://100.64.0.1:7000}
      - WORKER_ID=worker-5090
      - CHECK_INTERVAL=60
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          echo "[$(date -Iseconds)] Health check..."
          VLLM_STATUS=$$(curl -sf "$$VLLM_URL/health" && echo "OK" || echo "FAIL")
          LITELLM_STATUS=$$(curl -sf "$$LITELLM_URL/health" && echo "OK" || echo "FAIL")
          echo "[$(date -Iseconds)] vLLM: $$VLLM_STATUS, LiteLLM: $$LITELLM_STATUS"
          sleep $$CHECK_INTERVAL
        done
    networks:
      - worker-network
    labels:
      - "com.nyra.service=health-monitor"
      - "com.nyra.worker=rtx5090"

  # ============================================================================
  # Promtail - Log Shipper to Orchestrator Loki
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: worker-5090-promtail
    hostname: worker-5090-promtail
    restart: unless-stopped
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./logs:/var/log/worker-5090:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://100.64.0.1:3100}
      - WORKER_ID=worker-5090
    command: -config.file=/etc/promtail/config.yaml
    labels:
      - "com.nyra.service=promtail"
      - "com.nyra.worker=rtx5090"
    networks:
      - worker-network

networks:
  worker-network:
    name: nyra-worker-5090
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

volumes:
  vllm-models:
    name: nyra-vllm-models-5090
    driver: local
  lmcache-data:
    name: nyra-lmcache-5090
    driver: local
