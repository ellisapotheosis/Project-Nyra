# ============================================================================
# Worker RTX 5090 - Alienware Area-51 Laptop (32GB VRAM)
# ============================================================================
# vLLM + LMCache for high-performance large model inference
# Connected via Tailscale mesh to orchestrator
# ============================================================================

services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: worker-5090-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx5090}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ── Infisical agent (polls Infisical and refreshes secrets) ──────────────
  infisical-agent:
    build:
      context: ../../images/infisical-secrets-init
    container_name: worker-5090-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID:-}
      INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/worker-rtx5090}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - worker-network

  # ============================================================================
  # Portainer Edge Agent
  # ============================================================================
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: worker-5090-portainer-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-network

  # ============================================================================
  # vLLM Server with LMCache (32GB VRAM - Maximum Performance)
  # ============================================================================
  vllm:
    image: vllm/vllm-openai:latest
    container_name: worker-5090-vllm
    hostname: worker-5090-vllm
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    ports:
      - "${VLLM_PORT:-8000}:8000"
    volumes:
      - vllm-models:/root/.cache/huggingface
      - lmcache-data:/root/.cache/lmcache
      - ./logs/vllm:/var/log/vllm
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - HF_TOKEN_FILE=/run/nyra-secrets/hf_token
      - VLLM_ATTENTION_BACKEND=FLASHINFER
      # LMCache Configuration
      - LMCACHE_ENABLED=true
      - LMCACHE_STORAGE_BACKEND=local
      - LMCACHE_LOCAL_DEVICE=cuda
      - LMCACHE_MAX_LOCAL_CACHE_SIZE=12G
    command: >
      --model Qwen/Qwen2.5-Coder-3B-Instruct
      --host 0.0.0.0
      --port 8000
      --tensor-parallel-size 1
      --gpu-memory-utilization 0.70
      --max-model-len 8192
      --enable-prefix-caching
      --enable-chunked-prefill
      --trust-remote-code
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          memory: 48G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s
    networks:
      - worker-network

  # ============================================================================
  # Model Switcher
  # ============================================================================
  model-switcher:
    image: python:3.11-slim
    container_name: worker-5090-switcher
    hostname: worker-5090-switcher
    restart: unless-stopped
    volumes:
      - ./model-switcher:/app
      - vllm-models:/models
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - VLLM_URL=http://vllm:8000
      - AVAILABLE_MODELS=meta-llama/Llama-3.1-70B-Instruct-AWQ,deepseek-ai/DeepSeek-R1-Distill-Llama-70B,Qwen/Qwen2.5-72B-Instruct-AWQ,mistralai/Mixtral-8x22B-Instruct-v0.1-AWQ
      - DEFAULT_MODEL=meta-llama/Llama-3.1-70B-Instruct-AWQ
      - SPECIALIZATION=mortgage,compliance,reasoning
    command: python /app/switcher.py
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ============================================================================
  # LiteLLM Proxy
  # ============================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: worker-5090-litellm
    hostname: worker-5090-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    environment:
      - LITELLM_LOG=INFO
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
      - nyra_secrets:/run/nyra-secrets:ro
    command: --config /app/config.yaml --port 4000
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      vllm:
        condition: service_healthy
    networks:
      - worker-network

  # ============================================================================
  # GPU Metrics Exporter
  # ============================================================================
  gpu-exporter:
    image: utkuozdemir/nvidia_gpu_exporter:1.4.1
    container_name: worker-5090-gpu-exporter
    hostname: worker-5090-gpu-exporter
    restart: unless-stopped
    ports:
      - "${GPU_EXPORTER_PORT:-9835}:9835"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  # ============================================================================
  # Node Exporter
  # ============================================================================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-5090-node-exporter
    hostname: worker-5090-node-exporter
    restart: unless-stopped
    ports:
      - "${NODE_EXPORTER_PORT:-9100}:9100"
    command:
      - "--path.procfs=/host/proc"
      - "--path.sysfs=/host/sys"
      - "--path.rootfs=/rootfs"
      - "--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      - worker-network

  # ============================================================================
  # Health Monitor
  # ============================================================================
  health-monitor:
    image: curlimages/curl:latest
    container_name: worker-5090-health
    hostname: worker-5090-health
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
      vllm:
        condition: service_started
      litellm:
        condition: service_started
    environment:
      - VLLM_URL=http://vllm:8000
      - LITELLM_URL=http://litellm:4000
      - ORCHESTRATOR_URL=${ORCHESTRATOR_URL:-http://100.64.0.10:7000}
      - WORKER_ID=worker-5090
      - CHECK_INTERVAL=60
    volumes:
      - nyra_secrets:/run/nyra-secrets:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          VLLM_STATUS=$$(curl -sf "$$VLLM_URL/health" && echo "OK" || echo "FAIL")
          LITELLM_STATUS=$$(curl -sf "$$LITELLM_URL/health" && echo "OK" || echo "FAIL")
          sleep $$CHECK_INTERVAL
        done
    networks:
      - worker-network

  # ============================================================================
  # Promtail
  # ============================================================================
  promtail:
    image: grafana/promtail:latest
    container_name: worker-5090-promtail
    hostname: worker-5090-promtail
    restart: unless-stopped
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    volumes:
      - ./promtail-config.yaml:/etc/promtail/config.yaml:ro
      - ./logs:/var/log/worker-5090:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - nyra_secrets:/run/nyra-secrets:ro
    environment:
      - LOKI_URL=${LOKI_URL:-http://oracle.trex-fiordland.ts.net:3100}
      - WORKER_ID=worker-5090
    command: -config.file=/etc/promtail/config.yaml
    networks:
      - worker-network

networks:
  worker-network:
    name: nyra-worker-5090
    external: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.26.0.0/24

volumes:
  vllm-models:
    name: nyra-vllm-models-5090
    driver: local
  lmcache-data:
    name: nyra-lmcache-5090
    driver: local
  nyra_secrets:
