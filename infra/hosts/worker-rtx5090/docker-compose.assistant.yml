# ============================================================================
# Assistant Stack - Worker RTX 5090
# ============================================================================
# OpenClaw + Nerve UI
# Optimized for RTX 5090 GPU inference
# ============================================================================

version: "3.8"

services:
  # ============================================================================
  # OpenClaw - The Agent Brain
  # ============================================================================
  openclaw:
    image: moltbot/moltbot:latest
    container_name: worker-5090-openclaw
    hostname: worker-5090-openclaw
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - OPENAI_API_BASE=http://worker-5090-vllm:8000/v1
      - OPENAI_API_KEY=${NEXUS_ADMIN_TOKEN:-dummy}
      - OPENCLAW_GATEWAY_AUTH=token
      - OPENCLAW_GATEWAY_TOKEN=${OPENCLAW_GATEWAY_TOKEN:-${NEXUS_ADMIN_TOKEN:-dummy}}
      - MEM0_API_KEY=${MEM0_API_KEY}
      - TWENTY_API_KEY=${TWENTY_CRM_API_KEY}
      - TWENTY_URL=${TWENTY_CRM_URL:-http://100.64.0.3:3000}
      - NEXUS_URL=http://orchestrator.trex-fiordland.ts.net:6000
    volumes:
      - ./openclaw:/home/node/.openclaw
      - assistant-memory:/home/node/.memory
      - nyra_secrets:/run/nyra-secrets:ro
    entrypoint: >
      sh -c "exec openclaw gateway --port 18789 --auth token"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    networks:
      - worker-network

  # ============================================================================
  # Nerve UI - Modern Interface for OpenClaw
  # ============================================================================
  nerve-ui:
    image: ghcr.io/oraios/nerve-ui:latest
    container_name: worker-5090-nerve-ui
    restart: unless-stopped
    ports:
      - "${NERVE_UI_PORT:-3081}:3000"
    environment:
      - BACKEND_URL=http://worker-5090-openclaw:18789
      - DEFAULT_MODEL=deepseek-ai/DeepSeek-V3
    depends_on:
      - openclaw
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-5090

volumes:
  assistant-memory:
    driver: local
  nyra_secrets:
    external: true
