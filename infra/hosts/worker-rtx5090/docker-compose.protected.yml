# ============================================================================
# Worker RTX 5090 — Protected Management Plane
# ============================================================================
# Compose project: worker-rtx5090-protected
#
# Protected services:
#   - portainer-agent : uplink to oracle-vps Portainer CE
#   - syncthing       : CANONICAL SOURCE (Send-Only) — DO NOT MODIFY folder mode
#
# WARNING: worker-rtx5090 Syncthing is the SEND-ONLY source for the cluster.
# Any change to its folder configuration must be intentional.
# ============================================================================

services:
  portainer-agent:
    image: portainer/agent:2.27.9
    container_name: worker-rtx5090-portainer-agent
    restart: always
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID:?PORTAINER_EDGE_ID required}
      EDGE_KEY: ${PORTAINER_EDGE_KEY:?PORTAINER_EDGE_KEY required}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_TAGS: worker-rtx5090,gpu,vllm
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - worker-rtx5090-protected-net
    labels:
      com.projectnyra.protected: "true"
      com.projectnyra.lifecycle: "permanent"
      com.projectnyra.do-not-stop: "true"
      com.projectnyra.service: "portainer-agent"
      com.projectnyra.host: "worker-rtx5090"

  syncthing:
    image: syncthing/syncthing:1.29.3
    container_name: worker-rtx5090-syncthing
    restart: always
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - syncthing_config:/var/syncthing
      - ${HOST_HOME_PATH:-/home/ellisapotheosis}:/var/syncthing/data/home
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8384"]
      interval: 60s
      timeout: 10s
      retries: 3
    labels:
      com.projectnyra.protected: "true"
      com.projectnyra.lifecycle: "permanent"
      com.projectnyra.do-not-stop: "true"
      com.projectnyra.service: "syncthing"
      com.projectnyra.host: "worker-rtx5090"
      com.projectnyra.syncthing-role: "send-only-canonical-source"
      com.projectnyra.syncthing-warning: "DO NOT change folder mode — this is the canonical source"

volumes:
  syncthing_config:
    driver: local

networks:
  worker-rtx5090-protected-net:
    driver: bridge
    name: worker-rtx5090-protected-net
