# LiteLLM Configuration for Worker RTX 5090
# The only local model permitted here is Qwen3.8 27B Q4 abliterated AWQ.

model_list:
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/hotdogs/Qwen3.8-27B-abliterated-AWQ-INT4
      api_base: http://vllm:8000/v1
      api_key: "local-no-auth"
      stream: true
      temperature: 0.7
      max_tokens: 4096
    model_info:
      mode: chat
      supports_function_calling: true
      supports_vision: false
      tags:
      tags:
        - qwen3.8
        - q4
        - abliterated

general_settings:
  master_key: ${LITELLM_MASTER_KEY}
  database_url: ${LITELLM_DATABASE_URL}

  # Worker identification
  worker_id: worker-5090
  worker_role: primary_reasoning

  # Logging
  json_logs: true
  log_raw_request_response: false

litellm_settings:
  # Drop unsupported parameters
  drop_params: true

  # Callbacks for monitoring
  success_callback: ["prometheus", "langfuse"]
  failure_callback: ["prometheus"]

  # Caching (optional)
  cache: false
  cache_params:
    type: redis
    host: redis
    port: 6379

  # Rate limiting
  rpm: 60
  tpm: 100000

  # Timeout settings
  request_timeout: 300

  # Retry settings
  num_retries: 2
  timeout: 600

router_settings:
  # Load balancing strategy
  routing_strategy: usage-based-routing

  # Model aliases
  model_group_alias:
    reasoning: local/qwen3.8-27b
    general: local/qwen3.8-27b

  # Fallback models
  fallback_models:
    local/qwen3.8-27b: []

  # Allowed failures before fallback
  allowed_fails: 1

  # Cooldown before retry
  cooldown_time: 30

# Prometheus metrics
environment_variables:
  PROMETHEUS_PORT: "9091"
  PROMETHEUS_ENDPOINT: "/metrics"
