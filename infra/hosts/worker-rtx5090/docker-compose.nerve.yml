services:
  openclaw:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: worker-5090-openclaw
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://oracle.trex-fiordland.ts.net:6000"
      LITELLM_API_URL: "http://worker-5090-litellm:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
    networks:
      - worker-network

  nerve-ui:
    image: ghcr.io/dagger-hashimoto/nerve-ui:latest
    container_name: worker-5090-nerve-ui
    restart: unless-stopped
    env_file: [.env]
    ports:
      - "18789:18789"
    environment:
      OPENCLAW_URL: http://worker-5090-openclaw:8001
    networks:
      - worker-network

networks:
  worker-network:
    external: true
    name: nyra-worker-5090
