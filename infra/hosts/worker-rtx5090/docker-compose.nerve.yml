services:
  openclaw:
    build:
      context: ../../../services/openclaw
      dockerfile: ../../infra/docker/build/services/openclaw/Dockerfile
    container_name: worker-5090-openclaw
    restart: unless-stopped
    ports:
      - "8001:18789"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://orchestrator.trex-fiordland.ts.net:6000"
      OPENCLAW_GATEWAY_URL: "http://orchestrator.trex-fiordland.ts.net:8001"
      OPENCLAW_GATEWAY_PORT: "18789"
      OPENCLAW_GATEWAY_AUTH: "token"
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-${NEXUS_ADMIN_TOKEN:-}}
      OPENCLAW_MEMORY_SLOT: "openclaw-mem0"
      OPENCLAW_AGENT_MODEL: ${OPENCLAW_AGENT_MODEL:-local/qwen3.8-27b}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-${LITELLM_MASTER_KEY:-}}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-http://worker-5090-litellm:4000/v1}
      LITELLM_API_URL: "http://worker-5090-litellm:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://100.64.0.3:5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://100.64.0.3:8089}
    depends_on:
      - litellm
    networks:
      - worker-network

  nerve-ui:
    image: ghcr.io/oraios/nerve-ui:latest
    container_name: worker-5090-nerve-ui
    restart: unless-stopped
    ports:
      - "18789:18789"
    environment:
      OPENCLAW_URL: http://worker-5090-openclaw:18789
    networks:
      - worker-network
