name: worker-rtx5090-tailscale-proxy

services:
  caddy:
    image: caddy:2-alpine
    container_name: worker-5090-tailscale-caddy
    restart: unless-stopped
    extra_hosts:
      - host.docker.internal:host-gateway
    ports:
      - "100.64.0.11:443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - worker_caddy_data:/data
      - worker_caddy_config:/config
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- --no-check-certificate https://127.0.0.1/health | grep -q OK",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE

volumes:
  worker_caddy_data:
  worker_caddy_config:
