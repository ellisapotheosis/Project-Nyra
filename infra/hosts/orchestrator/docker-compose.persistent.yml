# docker-compose.persistent.yml — Orchestrator
# =============================================================================
# NEVER include this in make down, make stack-down, or any teardown target.
# These services must survive all stack operations and PC reboots.
# restart: always ensures Docker daemon re-launches them after reboot automatically.
#
# Volume pinning: syncthing_config uses name: to point at the EXACT existing
# volume regardless of compose project name — settings can never be orphaned.
#
# Deploy:   make persistent-up-orchestrator
# =============================================================================

services:
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-persistent-orchestrator-portainer-agent
    restart: always
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge,orchestrator}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes

  syncthing:
    image: syncthing/syncthing:latest
    container_name: nyra-persistent-orchestrator-syncthing
    hostname: syncthing-orchestrator
    restart: always
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home

volumes:
  syncthing_config:
    name: orchestrator_syncthing_config
    external: true
