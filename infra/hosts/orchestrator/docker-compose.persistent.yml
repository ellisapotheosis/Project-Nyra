# Persistent services for orchestrator — Portainer edge agent + Syncthing
# Deployed with: docker compose -p persistent -f this-file --env-file .env up -d
name: persistent

services:
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: persistent-orchestrator-portainer-agent
    restart: always
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID:-}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: "1"
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: nyra,edge,orchestrator
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - default

  syncthing:
    # The active orchestrator Syncthing identity is the native OBN2HMP instance.
    # Keep this stale ZANXEPD Docker identity opt-in to avoid lock conflicts.
    profiles: ["stale-docker-sync"]
    image: syncthing/syncthing:latest
    container_name: persistent-orchestrator-syncthing
    restart: "no"
    network_mode: host
    environment:
      PUID: "1000"
      PGID: "1000"
    volumes:
      - /home/ellisapotheosis:/var/syncthing/data/home
      - orchestrator_syncthing_config:/var/syncthing

volumes:
  orchestrator_syncthing_config:
    external: true
