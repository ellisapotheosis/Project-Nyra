# Cloudflared backup config for the Project Nyra orchestrator tunnel.
# Replace ORCHESTRATOR_TUNNEL_ID before using this as a locally managed tunnel.
# If the tunnel is dashboard-managed with a token, use this file as the source
# of truth for Public Hostname entries in the Cloudflare Zero Trust UI.

tunnel: ORCHESTRATOR_TUNNEL_ID
credentials-file: /etc/cloudflared/ORCHESTRATOR_TUNNEL_ID.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  # Linkwarden (document management). Protect with Cloudflare Access.
  # Prefer links.projectnyra.com going forward.
  - hostname: links.projectnyra.com
    service: http://100.64.0.2:3007

  - hostname: linkwarden.projectnyra.com
    service: http://100.64.0.2:3007

  # Private UIs - protect every hostname in this group with Cloudflare Access.
  - hostname: openclaw-gateway.projectnyra.com
    service: http://nyra-openclaw-gateway:8001

  - hostname: portainer.projectnyra.com
    service: https://nyra-portainer:9443
    originRequest:
      noTLSVerify: true

  # Mission Control is private/Tailscale-only. It is intentionally absent from
  # this public Cloudflare tunnel configuration.

  # Phase 3 — AI Orchestration Services
  - hostname: aionui.projectnyra.com
    service: http://nyra-aionui:3000

  # clawteam.projectnyra.com and nerve-ui.projectnyra.com are private
  # Tailscale endpoints; they are intentionally not tunnel ingress entries.

  # Orchestrator catch-all. Required by cloudflared.
  - service: http_status:404
