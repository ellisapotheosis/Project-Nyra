# Cloudflared source config for the Project Nyra orchestrator tunnel.
# Replace ORCHESTRATOR_TUNNEL_ID before using this as a locally managed tunnel.
# If the tunnel is dashboard-managed with a token, use this file as the source
# of truth for Public Hostname entries in the Cloudflare Zero Trust UI.
#
# Layout:
#   - Orchestrator-local services: direct docker container names
#   - Oracle VPS services:         proxied via oracle.trex-fiordland.ts.net (Tailscale)
#   - Worker services:             proxied via worker-*.trex-fiordland.ts.net (Tailscale)

tunnel: ORCHESTRATOR_TUNNEL_ID
credentials-file: /etc/cloudflared/ORCHESTRATOR_TUNNEL_ID.json

originRequest:
  connectTimeout: 30s
  noHappyEyeballs: false

ingress:
  # ── HA Green / Linkwarden ─────────────────────────────────────────────────
  # Protect with Cloudflare Access.
  - hostname: links.projectnyra.com
    service: http://100.64.0.2:3007

  - hostname: linkwarden.projectnyra.com
    service: http://100.64.0.2:3007

  # ── Home Assistant ────────────────────────────────────────────────────────
  - hostname: ha.projectnyra.com
    service: http://homeassistant.trex-fiordland.ts.net:8123

  # ── Portainer (orchestrator) ──────────────────────────────────────────────
  - hostname: portainer.projectnyra.com
    service: https://nyra-portainer:9443
    originRequest:
      noTLSVerify: true

  # ── Oracle VPS services via Tailscale ─────────────────────────────────────
  # These entries proxy oracle-hosted services through the orchestrator tunnel.
  # Requires oracle.trex-fiordland.ts.net reachable via Tailscale.
  - hostname: litellm.projectnyra.com
    service: http://oracle.trex-fiordland.ts.net:4000

  - hostname: nexus.projectnyra.com
    service: http://oracle.trex-fiordland.ts.net:6000

  - hostname: nexus-router.projectnyra.com
    service: http://oracle.trex-fiordland.ts.net:6000

  - hostname: letta.projectnyra.com
    service: http://oracle.trex-fiordland.ts.net:8283

  - hostname: crm-ui.projectnyra.com
    service: http://oracle.trex-fiordland.ts.net:3000

  # ── OpenClaw gateway (orchestrator-local) ────────────────────────────────
  - hostname: openclaw-gateway.projectnyra.com
    service: http://nyra-openclaw-gateway:8001

  - hostname: router.openclaw.projectnyra.com
    service: http://nyra-openclaw-gateway:8001

  # ── App portals (orchestrator-local) ─────────────────────────────────────
  - hostname: admin.projectnyra.com
    service: http://nyra-admin:3001

  - hostname: chat.projectnyra.com
    service: http://nyra-chat-ui:3000

  - hostname: borrower-chat.projectnyra.com
    service: http://nyra-borrower-chat:3002

  - hostname: campaigns.projectnyra.com
    service: http://nyra-campaign-engine:3003

  - hostname: quotes.projectnyra.com
    service: http://nyra-quote-api:8000

  # ── Status / uptime (orchestrator-local) ─────────────────────────────────
  - hostname: status.projectnyra.com
    service: http://nyra-uptime-kuma:3001

  # ── GasTown / GasTeam ────────────────────────────────────────────────────
  - hostname: gastown.projectnyra.com
    service: http://nyra-gastown:7000

  - hostname: gasteam.projectnyra.com
    service: http://nyra-gasteam:7001

  # ── Worker RTX 5090 (mobile — may be offline) ────────────────────────────
  # worker-rtx5090 is the user's dev workstation; tunnel routes time out
  # gracefully when the machine is off.
  - hostname: nerve-5090.projectnyra.com
    service: http://worker-rtx5090.trex-fiordland.ts.net:7860

  - hostname: claw-5090.projectnyra.com
    service: http://worker-rtx5090.trex-fiordland.ts.net:3000

  # ── Worker RTX 3090 Ti ────────────────────────────────────────────────────
  - hostname: nerve-3090.projectnyra.com
    service: http://worker-rtx3090ti.trex-fiordland.ts.net:7860

  - hostname: claw-3090.projectnyra.com
    service: http://worker-rtx3090ti.trex-fiordland.ts.net:3000

  # ── Worker RTX 3060 (always-on) ───────────────────────────────────────────
  - hostname: nerve-3060.projectnyra.com
    service: http://worker-rtx3060.trex-fiordland.ts.net:7860

  - hostname: picoclaw-3060.projectnyra.com
    service: http://worker-rtx3060.trex-fiordland.ts.net:3000

  # Orchestrator catch-all. Required by cloudflared.
  - service: http_status:404
