services:
  # ── Infisical secrets init (runs once, writes files to /run/nyra-secrets/) ─
  secrets-init:
    build:
      context: ../../infisical-secrets-init

    container_name: nyra-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/orchestrator}
      # Fallback env vars
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - nyra-network

  # ── Infisical agent (polls Infisical and refreshes secrets) ──────────────
  infisical-agent:
    build:
      context: ../../infisical-secrets-init

    container_name: nyra-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/orchestrator}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - nyra-network

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    command: ["redis-server", "--save", "60", "1000", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-litellm-router
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    ports:
      - "4000:4000"
    environment:
      # Secrets are now handled via /run/nyra-secrets files
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
    volumes:
      - ../../configs/litellm/config.yaml:/app/config.yaml:ro
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      redis:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nyra-network
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os, urllib.request; req = urllib.request.Request('http://localhost:4000/v1/models', headers={'Authorization': 'Bearer ' + os.environ['LITELLM_MASTER_KEY']}); urllib.request.urlopen(req, timeout=12).read()\"",
        ]
      interval: 15s
      timeout: 15s
      retries: 5

  nexus:
    image: ghcr.io/grafbase/nexus:stable
    container_name: nyra-nexus
    ports:
      - "6000:3000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      MEMPALACE_URL: ${MEMPALACE_URL:-}
    volumes:
      - ../../configs/nexus/nexus.toml:/etc/nexus/nexus.toml:ro
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      litellm:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 15s
      timeout: 5s
      retries: 5

  openclaw:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: nyra-openclaw
    profiles: ["apps"]
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://nexus:3000"
      LITELLM_API_URL: "http://litellm:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
    volumes:
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      nexus:
        condition: service_healthy
      litellm:
        condition: service_healthy
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nyra-network

  docker-mcp-toolkit:
    image: docker/mcp-toolkit:latest
    container_name: nyra-docker-toolkit
    profiles: ["apps"]
    ports:
      - "8811:8811"
    environment:
      MCP_PORT: 8811
      DOCKER_HOST: unix:///var/run/docker.sock
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ../../../:/workspace
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    restart: unless-stopped
    networks:
      - nyra-network

  postgres-client:
    image: postgres:16-alpine
    container_name: nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    volumes:
      - nyra_secrets:/run/nyra-secrets:ro
    restart: unless-stopped
    networks:
      - nyra-network

volumes:
  redis_data:
  nyra_secrets:

networks:
  nyra-network:
    driver: bridge
