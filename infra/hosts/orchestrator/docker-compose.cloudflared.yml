name: nyra-cloudflared-orchestrator

# Standalone cloudflared tunnel for the Orchestrator PC.
# Run separately from the main orchestrator stack so it can be stopped/started
# without affecting LiteLLM, Nexus, or Redis.
#
# Token: ORCHESTRATOR_TUNNEL_TOKEN (from Infisical /machines/orchestrator)
# Config: ~/repos/cloudflared/orchestrator/config.yml (applied in CF dashboard)
#
# Start: docker compose -f infra/hosts/orchestrator/docker-compose.cloudflared.yml up -d
# Or:    make cf-orch-up

services:
  secrets-init:
    build:
      context: ../../infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cf-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/orchestrator}
      ORCHESTRATOR_TUNNEL_TOKEN: ${ORCHESTRATOR_TUNNEL_TOKEN:-}
    volumes:
      - cf_secrets:/run/nyra-secrets
    networks:
      - nyra-network

  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared-wrapper
    image: nyra/cloudflared-wrapper:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cloudflared-orchestrator
    restart: unless-stopped
    command:
      - |
        token="$${TUNNEL_TOKEN:-}"
        if [ -z "$$token" ] && [ -f /run/nyra-secrets/orchestrator_tunnel_token ]; then
          token="$$(cat /run/nyra-secrets/orchestrator_tunnel_token)"
        fi
        if [ -z "$$token" ]; then
          echo "ORCHESTRATOR_TUNNEL_TOKEN is required" >&2
          exit 1
        fi
        exec cloudflared tunnel --no-autoupdate run --token "$$token"
    environment:
      TUNNEL_TOKEN: ${ORCHESTRATOR_TUNNEL_TOKEN:-}
    volumes:
      - cf_secrets:/run/nyra-secrets:ro
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    networks:
      - nyra-network

volumes:
  cf_secrets:

networks:
  nyra-network:
    external: true
    name: orchestrator_nyra-network
