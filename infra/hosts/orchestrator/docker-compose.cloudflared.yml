name: nyra-cloudflared-orchestrator

# Standalone Cloudflare Tunnel for the orchestrator. Keep this stack separate
# from the application services so tunnel maintenance does not restart them.

services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cloudflared-orchestrator
    restart: unless-stopped
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --token
      - ${ORCHESTRATOR_TUNNEL_TOKEN:?ORCHESTRATOR_TUNNEL_TOKEN required}
    environment:
      TUNNEL_TOKEN: ${ORCHESTRATOR_TUNNEL_TOKEN:?ORCHESTRATOR_TUNNEL_TOKEN required}
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

networks:
  nyra-network:
    external: true
