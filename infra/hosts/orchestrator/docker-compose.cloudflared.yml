name: nyra-cloudflared-orchestrator

# Standalone cloudflared tunnel for the Orchestrator PC.
# Run separately from the main orchestrator stack so it can be stopped/started
# without affecting LiteLLM, Nexus, or Redis.
#
# Token: ORCHESTRATOR_TUNNEL_TOKEN (from Infisical /machines/orchestrator)
# Config: ~/repos/cloudflared/orchestrator/config.yml (applied in CF dashboard)
#
# Start: docker compose -f infra/hosts/orchestrator/docker-compose.cloudflared.yml up -d
# Or:    make cf-orch-up

services:
  cloudflared:
    build:
      context: .
      dockerfile: Dockerfile.cloudflared-wrapper
    image: nyra/cloudflared-wrapper:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cloudflared-orchestrator
    restart: unless-stopped
    command:
      - |
        token="$${TUNNEL_TOKEN:-}"
        if [ -z "$$token" ]; then
          echo "ORCHESTRATOR_TUNNEL_TOKEN is required" >&2
          exit 1
        fi
        exec cloudflared tunnel --no-autoupdate run --token "$$token"
    environment:
      TUNNEL_TOKEN: ${ORCHESTRATOR_TUNNEL_TOKEN:-${CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR:-}}
    networks:
      - nyra-network

networks:
  nyra-network:
    external: true
    name: orchestrator_nyra-network
