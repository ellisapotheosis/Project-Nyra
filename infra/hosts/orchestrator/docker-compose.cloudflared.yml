name: nyra-cloudflared-orchestrator

# Standalone cloudflared tunnel for the Orchestrator PC.
# Run separately from the main orchestrator stack so it can be stopped/started
# without affecting LiteLLM, Nexus, or Redis.
#
# Token: /etc/projectnyra/secrets/orchestrator-cloudflared.env
# Config: ~/repos/cloudflared/orchestrator/config.yml (applied in CF dashboard)
#
# Start: docker compose -f infra/hosts/orchestrator/docker-compose.cloudflared.yml up -d
# Or:    make cf-orch-up

services:
  cloudflared:
    image: cloudflare/cloudflared:2026.7.1
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-cloudflared-orchestrator
    restart: unless-stopped
    command: tunnel --no-autoupdate --protocol http2 run
    env_file:
      - /etc/projectnyra/secrets/orchestrator-cloudflared.env
    healthcheck:
      test: ["CMD", "cloudflared", "--version"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"
    security_opt:
      - no-new-privileges:true
    networks:
      - nyra-network

networks:
  nyra-network:
    external: true
    name: nyra-network_nyra-network
