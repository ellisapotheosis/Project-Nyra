version: "3.8"

services:
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: nyra-portainer-edge-agent
    restart: unless-stopped
    environment:
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,orchestrator,standard}
    ports:
      - "${PORTAINER_AGENT_PORT:-9001}:9001"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    labels:
      - "nyra.service=portainer-edge-agent"
      - "nyra.role=edge"
