services:
  wol-manager:
    build:
      context: ../../..
      dockerfile: services/wol-manager/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-wol-manager
    restart: unless-stopped
    ports:
      - "8095:8095"
    environment:
      # MAC addresses for WoL magic packets
      WORKER_3060_MAC: ${WORKER_3060_MAC:?set WORKER_3060_MAC}
      WORKER_3090TI_MAC: ${WORKER_3090TI_MAC:?set WORKER_3090TI_MAC}
      WORKER_5090_MAC: ${WORKER_5090_MAC:-}
      # SSH config for shutdown commands
      SSH_CLUSTER_KEY_PATH: ${SSH_CLUSTER_KEY_PATH:-/run/secrets/cluster_ssh_key}
      SSH_USER: ${SSH_USER:-ellisapotheosis}
      SSH_PORT: ${SSH_PORT:-22}
      # Policy engine
      LITELLM_URL: ${LITELLM_URL:-http://oracle-vps.trex-fiordland.ts.net:4000}
      QUEUE_DEPTH_THRESHOLD: ${QUEUE_DEPTH_THRESHOLD:-5}
      IDLE_TIMEOUT_MINUTES: ${IDLE_TIMEOUT_MINUTES:-30}
      WAKE_SCHEDULE: ${WAKE_SCHEDULE:-08:00-22:00}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-30}
      POLICY_INTERVAL_SECONDS: ${POLICY_INTERVAL_SECONDS:-60}
    volumes:
      - ${SSH_CLUSTER_KEY_PATH:-/home/ellisapotheosis/.ssh/cluster_key}:/run/secrets/cluster_ssh_key:ro
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8095/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      nyra.host: orchestrator
      nyra.category: ops
      nyra.ui: "false"
    deploy:
      resources:
        limits:
          memory: 256m
        reservations:
          memory: 64m

networks:
  nyra-network:
    external: true
