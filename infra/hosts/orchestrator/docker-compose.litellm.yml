# ============================================================================
# Canonical LiteLLM Gateway — Orchestrator
# ============================================================================
# This is the PRIMARY LiteLLM endpoint for all orchestrator agents.
# Workers route local inference; this instance aggregates + fallbacks.
#
# Compose project: orchestrator
# Exposed at:
#   - Internal:   http://litellm:4000  (docker network, same project)
#   - Tailscale:  http://orchestrator.trex-fiordland.ts.net:4010
#   - Private DNS: http://litellm.projectnyra.com (AdGuard split-horizon)
#
# Authentication:
#   LITELLM_MASTER_KEY — required (sk-<48+ random chars>)
#   All API calls:  Authorization: Bearer <LITELLM_MASTER_KEY>
#   Admin UI:       http://litellm.projectnyra.com/ui  (same key as password)
# ============================================================================

services:
  litellm:
    image: ghcr.io/berriai/litellm:v1.92.0
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-litellm
    restart: unless-stopped
    command: ["--config", "/app/config/config.yaml", "--port", "4000"]
    ports:
      # Bind to all interfaces — Tailscale firewall restricts access.
      # Access from other Tailscale peers: http://100.64.0.10:4010/v1
      - "${LITELLM_HOST:-0.0.0.0}:${LITELLM_PORT:-4010}:4000"
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?LITELLM_MASTER_KEY is required — set sk-<48+ chars>}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      LLXPRT_BRIDGE_API_KEY: ${LLXPRT_BRIDGE_API_KEY:-llxprt_bf13b82bb4071b6fe96fde8c31b568142060921d2c83b01abe91d00c625876f2}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./litellm/config.yaml:/app/config/config.yaml:ro
    depends_on:
      litellm-redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'python3 -c "import urllib.request; urllib.request.urlopen(''http://localhost:4000/health/readiness'', timeout=8)"',
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    networks:
      - nyra-network
    labels:
      com.projectnyra.service: "litellm-gateway"
      com.projectnyra.host: "orchestrator"
      com.projectnyra.tier: "platform"

  litellm-redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-litellm-redis
    restart: unless-stopped
    command: redis-server --maxmemory 1gb --maxmemory-policy allkeys-lru
    volumes:
      - litellm_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - nyra-network
    labels:
      com.projectnyra.service: "litellm-redis"
      com.projectnyra.host: "orchestrator"
      com.projectnyra.tier: "cache"

volumes:
  litellm_redis_data:
    driver: local

networks:
  # Same network as the main orchestrator compose so hermes-gateway can reach
  # litellm at http://litellm:4000/v1 without going through Tailscale.
  # When used as overlay (-f docker-compose.yml -f docker-compose.litellm.yml)
  # this merges cleanly with the main project's nyra-network definition.
  nyra-network:
    driver: bridge
