services:
  pocket-tts:
    image: bozakov/pocket_tts_api:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-orchestrator-pocket-tts
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    networks:
      - orchestrator-network

networks:
  orchestrator-network:
    external: true
    name: nyra-network
