services:
  pocket-tts:
    build:
      context: ../../../services/pockettts
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-orchestrator-pocket-tts
    restart: unless-stopped
    ports:
      - "8080:8000"
    environment:
      - PORT=8000
      - POCKET_TTS_MODEL_ID=${POCKET_TTS_MODEL_ID:-english}
    networks:
      - orchestrator-network

networks:
  orchestrator-network:
    external: true
    name: nyra-network_nyra-network
