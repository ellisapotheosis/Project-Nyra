# LiteLLM — Canonical Gateway Config (Orchestrator)
#
# PRIMARY LiteLLM instance. All agents (OpenClaw, ClawTeam, etc.) route here.
# Worker backends use Tailscale private DNS (*.projectnyra.com).
# Oracle services (omniroute, letta) reach via Tailscale IP (100.64.0.3).
#
# Env vars injected at runtime:
#   LITELLM_MASTER_KEY    — required; format: sk-<48+ random chars>
#   OMNIROUTE_API_KEY     — required for omniroute/* models (subscriptions)
#   OPENROUTER_API_KEY    — required for openrouter/* models (free tier)
#   LLXPRT_BRIDGE_API_KEY — required for llxprt/* subscription models (claude-code, codex, gemini)
#   OPENAI_API_KEY        — optional; for openai/* models
#   ANTHROPIC_API_KEY     — optional; for anthropic/* models

model_list:
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 300

  # ── Local GPU — RTX 5090 (32 GB vLLM) ─────────────────────────────────────
  - model_name: local/gemma-4
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  # ── Local GPU — RTX 3090Ti (24 GB vLLM) ────────────────────────────────────
  - model_name: local/qwen-coder-32b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  # ── Local GPU — RTX 3060 (12 GB Ollama) ────────────────────────────────────
  - model_name: local/qwen2.5-4b
    litellm_params:
      model: ollama/qwen2.5:4b
      api_base: http://worker-rtx3060.projectnyra.com:11434

  - model_name: local/llama3.2-3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://worker-rtx3060.projectnyra.com:11434

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://worker-rtx3060.projectnyra.com:11434

  # ── OpenClaw Gateway ────────────────────────────────────────────────────────
  - model_name: claw/openclaw-5090
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx5090.projectnyra.com:8001/v1
      api_key: "not-needed"
      timeout: 300

  - model_name: claw/openclaw-3090ti
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3090ti.projectnyra.com:8001/v1
      api_key: "not-needed"
      timeout: 180

  - model_name: claw/openclaw-3060
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3060.projectnyra.com:8003/v1
      api_key: "not-needed"
      timeout: 120

  # ── llxprt-bridge — Subscription Models (worker-rtx5090 via Tailscale) ─────
  - model_name: llxprt/claude
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/codex
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/gemini
    litellm_params:
      model: openai/llxprt-gemini
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  # ── OmniRoute (on oracle-vps via Tailscale) ─────────────────────────────────
  - model_name: omniroute/auto
    litellm_params:
      model: openai/auto
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 180

  - model_name: omniroute/coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300

  - model_name: omniroute/fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 90

  # ── OpenRouter Free Tier ────────────────────────────────────────────────────
  - model_name: openrouter/gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  - model_name: openrouter/deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-chat:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90

  - model_name: openrouter/qwen3
    litellm_params:
      model: openrouter/qwen/qwen3-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/llama4
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

# ── Routing & Fallbacks ──────────────────────────────────────────────────────
router_settings:
  routing_strategy: usage-based-routing-v2
  fallbacks:
    - { "local/qwen3.8-27b": ["omniroute/auto", "openrouter/qwen3"] }
    - { "local/gemma-4": ["omniroute/auto", "openrouter/qwen3"] }
    - { "local/qwen-coder-32b": ["omniroute/coding", "openrouter/deepseek"] }
    - { "local/llama3.2-3b": ["openrouter/llama4", "openrouter/qwen3"] }
    - {
        "omniroute/auto":
          ["local/qwen3.8-27b", "local/gemma-4", "openrouter/qwen3"],
      }
    - {
        "omniroute/coding":
          ["local/qwen-coder-32b", "llxprt/codex", "openrouter/deepseek"],
      }
    - { "llxprt/claude": ["omniroute/auto", "openrouter/gemini-flash"] }
    - { "claw/openclaw-5090": ["claw/openclaw-3090ti", "claw/openclaw-3060"] }
    - {
        "claw/openclaw-3090ti":
          ["claw/openclaw-5090", "claw/openclaw-3060", "local/qwen-coder-32b"],
      }

litellm_settings:
  set_verbose: false
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Uncomment to enable virtual keys / usage tracking:
  # database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: false
