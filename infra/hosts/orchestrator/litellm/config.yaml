# LiteLLM — Canonical Gateway Config (Orchestrator)
#
# This is the PRIMARY LiteLLM instance.  All agents on orchestrator
# (Hermes, OpenClaw, ClawTeam, etc.) route through this service.
#
# Worker backends use Tailscale private DNS — they resolve to the correct
# Tailscale IP regardless of which machine is calling.
# Oracle services (omniroute, llxprt-bridge) are reached via oracle's
# Tailscale IP (100.64.0.3).
#
# Env vars injected at runtime (via Infisical or ~/.zsh/secrets):
#   LITELLM_MASTER_KEY    — required; format: sk-<48+ random chars>
#   OMNIROUTE_API_KEY     — required for omniroute/* models
#   LLXPRT_BRIDGE_API_KEY — required for subscription/* and free/* models
#   OPENROUTER_API_KEY    — required for openrouter/* models
#   OPENAI_API_KEY        — optional; for openai/* models
#   ANTHROPIC_API_KEY     — optional; for anthropic/* models

model_list:
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 300

  # ── Local GPU — RTX 5090 (32 GB vLLM) ─────────────────────────────────────
  - model_name: local/gemma-4
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: local/vybestack-jefe
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  # ── Local GPU — RTX 3090Ti (24 GB vLLM) ────────────────────────────────────
  - model_name: local/qwen-coder-32b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  - model_name: local/vybestack-coder
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  # ── Local GPU — RTX 3060 (12 GB Ollama) ────────────────────────────────────
  - model_name: local/qwen2.5-4b
    litellm_params:
      model: ollama/qwen2.5:4b
      api_base: http://worker-rtx3060.projectnyra.com:11434

  - model_name: local/llama3.2-3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://worker-rtx3060.projectnyra.com:11434

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://worker-rtx3060.projectnyra.com:11434

  # ── OpenClaw Gateway ────────────────────────────────────────────────────────
  - model_name: claw/openclaw-3090ti
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3090ti.projectnyra.com:8001/v1
      api_key: "not-needed"
      timeout: 180

  - model_name: claw/openclaw-3060
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3060.projectnyra.com:8003/v1
      api_key: "not-needed"
      timeout: 120

  # ── OmniRoute (on oracle-vps via Tailscale) ─────────────────────────────────
  - model_name: omniroute/auto
    litellm_params:
      model: openai/auto
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 180

  - model_name: omniroute/coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300

  - model_name: omniroute/fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 90

  # ── llxprt bridge (subscription providers on oracle-vps via Tailscale) ──────
  # oracle-vps runs llxprt on host port 8091; reach via Tailscale IP
  - model_name: subscription/codex
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

  - model_name: subscription/gemini
    litellm_params:
      model: openai/llxprt-gemini
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

  - model_name: subscription/claude
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 900

  - model_name: free/kimi
    litellm_params:
      model: openai/llxprt-kimi
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 120

  - model_name: free/qwen-cli
    litellm_params:
      model: openai/llxprt-qwen-cli
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 120

  - model_name: free/cerebras
    litellm_params:
      model: openai/llxprt-cerebras
      api_base: http://100.64.0.3:8091/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 60

  # ── OpenRouter Free Tier ────────────────────────────────────────────────────
  - model_name: openrouter/gemini-flash
    litellm_params:
      model: openrouter/google/gemini-2.0-flash-exp:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  - model_name: openrouter/deepseek
    litellm_params:
      model: openrouter/deepseek/deepseek-chat:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90

  - model_name: openrouter/qwen3
    litellm_params:
      model: openrouter/qwen/qwen3-30b-a3b:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/llama4
    litellm_params:
      model: openrouter/meta-llama/llama-4-scout:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

# ── Routing & Fallbacks ──────────────────────────────────────────────────────
router_settings:
  routing_strategy: usage-based-routing-v2
  fallbacks:
    - {
        "local/gemma-4":
          ["free/kimi", "openrouter/qwen3", "subscription/claude"],
      }
    - {
        "local/qwen-coder-32b":
          ["free/qwen-cli", "openrouter/deepseek", "subscription/codex"],
      }
    - { "local/llama3.2-3b": ["free/cerebras", "openrouter/mistral"] }
    - { "subscription/claude": ["local/gemma-4", "openrouter/qwen3"] }
    - { "subscription/codex": ["local/qwen-coder-32b", "openrouter/deepseek"] }
    - { "claw/openclaw-3090ti": ["claw/openclaw-3060", "local/qwen-coder-32b"] }

litellm_settings:
  set_verbose: false
  drop_params: true
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  # Uncomment to enable virtual keys / usage tracking:
  # database_url: os.environ/LITELLM_DATABASE_URL
  store_model_in_db: false
