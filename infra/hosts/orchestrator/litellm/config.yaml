# LiteLLM — canonical composite gateway on the orchestrator.
#
# Subscription-backed Claude/Codex/Gemini traffic is transported through the
# existing llxprt bridge. CLI subscription sessions are not treated as API keys.

model_list:
  # Composite entrypoints used by agents. These preserve stable client-facing
  # names while the fallback graph selects subscription, local, or free routes.
  - model_name: composite/reasoning
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: composite/coding
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  # Local GPU — RTX 5090 (32 GB).
  - model_name: local/qwen3.8-27b
    litellm_params:
      model: openai/Qwen/Qwen3.8-27B
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 300

  - model_name: local/gemma-4
    litellm_params:
      model: openai/google/gemma-4-26B-A4B-it
      api_base: http://worker-rtx5090.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 120

  # Local GPU — RTX 3090 Ti (24 GB).
  - model_name: local/qwen-coder-32b
    litellm_params:
      model: openai/Qwen/Qwen2.5-Coder-32B-Instruct
      api_base: http://worker-rtx3090ti.projectnyra.com:8000/v1
      api_key: "not-needed"
      timeout: 180

  # Local GPU — RTX 3060 (12 GB Ollama utility tier).
  - model_name: local/qwen2.5-4b
    litellm_params:
      model: ollama/qwen2.5:4b
      api_base: http://worker-rtx3060.projectnyra.com:11434
      timeout: 120

  - model_name: local/llama3.2-3b
    litellm_params:
      model: ollama/llama3.2:3b
      api_base: http://worker-rtx3060.projectnyra.com:11434
      timeout: 120

  - model_name: local/embeddings
    litellm_params:
      model: ollama/nomic-embed-text
      api_base: http://worker-rtx3060.projectnyra.com:11434
      timeout: 120

  # OpenClaw worker gateways.
  - model_name: claw/openclaw-5090
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx5090.projectnyra.com:8001/v1
      api_key: "not-needed"
      timeout: 300

  - model_name: claw/openclaw-3090ti
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3090ti.projectnyra.com:8001/v1
      api_key: "not-needed"
      timeout: 180

  - model_name: claw/openclaw-3060
    litellm_params:
      model: openai/openclaw
      api_base: http://worker-rtx3060.projectnyra.com:8003/v1
      api_key: "not-needed"
      timeout: 120

  # llxprt subscription bridge aliases.
  - model_name: llxprt/claude
    litellm_params:
      model: openai/llxprt-claude
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/codex
    litellm_params:
      model: openai/llxprt-codex
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  - model_name: llxprt/gemini
    litellm_params:
      model: openai/llxprt-gemini
      api_base: http://worker-rtx5090.projectnyra.com:8090/v1
      api_key: os.environ/LLXPRT_BRIDGE_API_KEY
      timeout: 180

  # OmniRoute free/default routes on oracle-vps.
  - model_name: omniroute/auto
    litellm_params:
      model: openai/auto
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 180

  - model_name: omniroute/coding
    litellm_params:
      model: openai/auto/coding
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 300

  - model_name: omniroute/fast
    litellm_params:
      model: openai/auto/fast
      api_base: http://100.64.0.3:20128/v1
      api_key: os.environ/OMNIROUTE_API_KEY
      timeout: 90

  # OpenRouter free terminal fallbacks. Keep these terminal in the graph to
  # prevent fallback loops when local and bridge routes are unavailable.
  - model_name: openrouter/gemini-flash
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  - model_name: openrouter/deepseek
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 90

  - model_name: openrouter/qwen3
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 120

  - model_name: openrouter/llama4
    litellm_params:
      model: openrouter/nvidia/nemotron-3.5-lightning:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

  - model_name: openrouter/cohere-code
    litellm_params:
      model: openrouter/cohere/north-mini-code:free
      api_key: os.environ/OPENROUTER_API_KEY
      timeout: 60

router_settings:
  routing_strategy: usage-based-routing-v2
  enable_pre_call_checks: true
  num_retries: 2
  retry_after: 1
  allowed_fails: 2
  cooldown_time: 60
  fallbacks:
    - {
        "composite/reasoning":
          ["local/qwen3.8-27b", "omniroute/auto", "openrouter/qwen3"],
      }
    - {
        "composite/coding":
          ["local/qwen-coder-32b", "omniroute/coding", "openrouter/deepseek"],
      }
    - {
        "llxprt/claude":
          ["local/qwen3.8-27b", "omniroute/auto", "openrouter/qwen3"],
      }
    - {
        "llxprt/codex":
          ["local/qwen-coder-32b", "omniroute/coding", "openrouter/deepseek"],
      }
    - {
        "llxprt/gemini":
          ["local/qwen3.8-27b", "omniroute/fast", "openrouter/gemini-flash"],
      }
    - {
        "local/qwen3.8-27b":
          ["local/gemma-4", "omniroute/auto", "openrouter/qwen3"],
      }
    - { "local/gemma-4": ["omniroute/auto", "openrouter/qwen3"] }
    - {
        "local/qwen-coder-32b":
          ["omniroute/coding", "openrouter/deepseek"],
      }
    - {
        "local/qwen2.5-4b":
          ["local/llama3.2-3b", "omniroute/fast", "openrouter/llama4"],
      }
    - {
        "local/llama3.2-3b":
          ["omniroute/fast", "openrouter/llama4"],
      }
    - { "omniroute/auto": ["openrouter/qwen3"] }
    - { "omniroute/coding": ["openrouter/deepseek"] }
    - { "omniroute/fast": ["openrouter/gemini-flash"] }
    - {
        "claw/openclaw-5090":
          ["claw/openclaw-3090ti", "claw/openclaw-3060", "local/qwen3.8-27b"],
      }
    - {
        "claw/openclaw-3090ti":
          ["claw/openclaw-3060", "local/qwen-coder-32b"],
      }
    - { "claw/openclaw-3060": ["local/qwen2.5-4b"] }

litellm_settings:
  set_verbose: false
  drop_params: true
  request_timeout: 420
  cache: true
  cache_params:
    type: redis
    host: litellm-redis
    port: 6379

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: false
