services:
  adguard-home:
    image: adguard/adguardhome:v0.107.66
    container_name: nyra-adguard-secondary
    restart: unless-stopped
    cap_add:
      - NET_BIND_SERVICE
    environment:
      TZ: ${TZ:-America/Los_Angeles}
    ports:
      # Bind only the explicitly selected host addresses. This avoids taking
      # over WSL's loopback resolver while serving LAN and Tailscale clients.
      - "${ORCHESTRATOR_DNS_BIND_IP:-192.168.137.253}:53:53/tcp"
      - "${ORCHESTRATOR_DNS_BIND_IP:-192.168.137.253}:53:53/udp"
      - "${ORCHESTRATOR_TAILSCALE_IP:-100.64.0.10}:53:53/tcp"
      - "${ORCHESTRATOR_TAILSCALE_IP:-100.64.0.10}:53:53/udp"
      - "${ORCHESTRATOR_DNS_BIND_IP:-192.168.137.253}:3004:3000/tcp"
      - "${ORCHESTRATOR_TAILSCALE_IP:-100.64.0.10}:3004:3000/tcp"
      - "${ADGUARD_DASHBOARD_BIND_IP:-127.0.0.1}:8084:80/tcp"
    volumes:
      - adguard_work:/opt/adguardhome/work
      - adguard_conf:/opt/adguardhome/conf
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/ || wget -q -O /dev/null http://127.0.0.1:80/ || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  adguard_work:
    name: nyra_adguard_secondary_work
  adguard_conf:
    name: nyra_adguard_secondary_conf
