# infra/hosts/orchestrator/docker-compose.clawteam.yml
# 🦞 Project Nyra - Legacy ClawTeam Primary Definition for Orchestrator
#
# The active primary is now on worker-rtx5090. This definition remains only
# for rollback and is intentionally profile-gated to prevent two primaries.

services:
  clawteam:
    profiles: ["legacy-orchestrator-primary"]
    image: ghcr.io/claw-ai/clawteam:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-clawteam-primary
    environment:
      - CLAWTEAM_ROLE=primary
      - CLAWTEAM_HOST=orchestrator
      # The Docker engine on orchestrator reports ~7.75 GiB allocated (below
      # the host's measured 15.2 GB total RAM). Keep the coordinator bounded
      # until the engine's own memory allocation is raised.
      - CLAWTEAM_MEMORY_LIMIT=2g
      - WORKER_NODES=["worker-rtx5090", "worker-rtx3090ti"]
      # worker-rtx3060 retired 2026 — do not reintroduce as a fallback/node.
      # Nerve remains colocated with OpenClaw on worker-rtx5090.
      - NERVE_UI_ENABLED=false
      - LITELLM_API_URL=http://100.64.0.3:4000
      # Nexus runs on oracle-vps, not in the orchestrator Compose network.
      - NEXUS_ROUTER_URL=http://100.64.0.3:7000
    ports:
      - "9001:9000"
    # NOTE: LiteLLM and Nexus run on oracle-vps; reach them over Tailscale.
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 10s
      timeout: 3s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 1g
