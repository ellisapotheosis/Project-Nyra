services:
  py-proxy:
    image: python:3.11-slim
    container_name: orchestrator-proxy
    restart: unless-stopped
    ports:
      - "80:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -c
      - |
        echo '' | base64 -d > /tmp/proxy.py
        exec python3 /tmp/proxy.py
