services:
  pocket-tts:
    build:
      context: ../../../services/pockettts
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-orchestrator-pocket-tts
    restart: unless-stopped
    ports:
      - "${POCKETTTS_HOST_PORT:-8086}:8000"
    environment:
      PORT: 8000
      POCKET_TTS_MODEL_ID: ${POCKET_TTS_MODEL_ID:-b6369a24}
      DEVICE: ${POCKETTTS_DEVICE:-cpu}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - orchestrator-network

networks:
  orchestrator-network:
    external: true
    name: nyra-network_nyra-network
