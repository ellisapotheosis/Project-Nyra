services:
  openclaw-gateway:
    build:
      context: ../../../services/openclaw
      dockerfile: ../../infra/docker/build/services/openclaw/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-openclaw-gateway
    profiles: ["apps"]
    ports:
      - "8001:18789"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://oracle.trex-fiordland.ts.net:3000"
      LITELLM_API_URL: "http://oracle.trex-fiordland.ts.net:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN}
      OPENCLAW_GATEWAY_AUTH: token
    restart: unless-stopped
    networks:
      - nyra-network

  # docker-mcp-toolkit:
  #   image: docker/mcp-toolkit:latest
  #   container_name: ${COMPOSE_PROJECT_NAME:-nyra}-docker-toolkit
  #   profiles: ["apps"]
  #   ports:
  #     - "8811:8811"
  #   environment:
  #     MCP_PORT: 8811
  #     DOCKER_HOST: unix:///var/run/docker.sock
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ../../../:/workspace
