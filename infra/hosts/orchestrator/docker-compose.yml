services:
  # ── Infisical Secrets Distribution (Mirror of Oracle VPS pattern) ────────
  # Polls app.infisical.com and materializes secrets to /run/nyra-secrets/
  # Enables orchestrator services + agents to access secrets without env vars
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/orchestrator}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: [nyra-network]

  infisical-agent:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-infisical-agent
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/agent-sidecar.sh"]
    depends_on:
      secrets-init:
        condition: service_completed_successfully
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/hosts/orchestrator}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks: [nyra-network]

  openclaw-gateway:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-openclaw-gateway
    profiles: ["apps"]
    ports:
      - "8001:18789"
    depends_on:
      infisical-agent:
        condition: service_started
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://100.64.0.3:3000"
      LITELLM_API_URL: "http://100.64.0.3:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://100.64.0.3:5000}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://100.64.0.3:8089}
      # Secrets read from mounted volume (NOT raw env vars)
      # Service must load from /run/nyra-secrets/current/
      SECRETS_MOUNT: /run/nyra-secrets/current
    volumes:
      - nyra_secrets:/run/nyra-secrets:ro
    restart: unless-stopped
    networks:
      - nyra-network

  # docker-mcp-toolkit:
  #   image: docker/mcp-toolkit:latest
  #   container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-docker-toolkit
  #   profiles: ["apps"]
  #   ports:
  #     - "8811:8811"
  #   environment:
  #     MCP_PORT: 8811
  #     DOCKER_HOST: unix:///var/run/docker.sock
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ../../../:/workspace
  #     - nyra_secrets:/run/nyra-secrets:ro
  #   depends_on:
  #     secrets-init:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #   networks:
  #     - nyra-network

  postgres-client:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  # NOTE: cloudflared is managed via the standalone overlay
  # docker-compose.cloudflared.yml (use `make cf-orch-up`). It is intentionally
  # NOT defined in this main compose so it can be stopped/started without
  # affecting LiteLLM, Nexus, or Redis.

  # ── Portainer CE Server (Central Management) ────────────────────────────
  # The central UI/API for managing every Docker host through agents.
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nyra-network

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  n8n_data:
  cf_secrets:
  syncthing_config:
  portainer_data:

volumes:
  nyra_secrets:
    driver: local

networks:
  nyra-network:
    driver: bridge
