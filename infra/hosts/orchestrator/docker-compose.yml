services:
  openclaw-gateway:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-openclaw-gateway
    profiles: ["apps"]
    ports:
      - "8001:8001"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://oracle.trex-fiordland.ts.net:6000"
      LITELLM_API_URL: "http://oracle.trex-fiordland.ts.net:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL:
        ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
    restart: unless-stopped
    networks:
      - nyra-network

  # docker-mcp-toolkit:
  #   image: docker/mcp-toolkit:latest
  #   container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-docker-toolkit
  #   profiles: ["apps"]
  #   ports:
  #     - "8811:8811"
  #   environment:
  #     MCP_PORT: 8811
  #     DOCKER_HOST: unix:///var/run/docker.sock
  #   volumes:
  #     - /var/run/docker.sock:/var/run/docker.sock
  #     - ../../../:/workspace
  #     - nyra_secrets:/run/nyra-secrets:ro
  #   depends_on:
  #     secrets-init:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #   networks:
  #     - nyra-network


  postgres-client:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-cloudflared-orchestrator
    restart: unless-stopped
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${ORCHESTRATOR_TUNNEL_TOKEN:-}
    networks:
      - nyra-network

  # ── Portainer Edge Agent ────────────────────────────────────────────────
  # Oracle VPS now hosts Portainer CE. Keep exactly one lightweight agent here
  # so the Oracle Portainer control plane can manage orchestrator Docker.
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-portainer-edge-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,edge}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    labels:
      - "nyra.service=portainer-edge-agent"
      - "nyra.role=edge"

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  n8n_data:
  cf_secrets:
  syncthing_config:

networks:
  nyra-network:
    driver: bridge
