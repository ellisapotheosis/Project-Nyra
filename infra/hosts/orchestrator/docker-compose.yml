services:
  secrets-init:
    build:
      context: ../../images/infisical-secrets-init
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-secrets-init
    restart: "no"
    command: ["/usr/local/bin/secrets-init.sh"]
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:-}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PATH: ${INFISICAL_PATH:-/machines/orchestrator}
      NYRA_SECRETS_DIR: /run/nyra-secrets
    volumes:
      - nyra_secrets:/run/nyra-secrets
    networks:
      - nyra-network

  openclaw-gateway:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-openclaw-gateway
    profiles: ["apps"]
    ports:
      - "8001:18789"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://oracle.trex-fiordland.ts.net:6000"
      LITELLM_API_URL: "http://oracle.trex-fiordland.ts.net:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    restart: unless-stopped
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  docker-mcp-toolkit:
    image: docker:29-cli
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-docker-toolkit
    profiles: ["apps"]
    ports:
      - "${DOCKER_MCP_TOOLKIT_PORT:-8811}:8811"
    environment:
      DOCKER_MCP_IN_CONTAINER: "1"
      MCP_PORT: "8811"
      DOCKER_HOST: unix:///var/run/docker.sock
      NEXUS_ROUTER_URL: ${NEXUS_ROUTER_URL:-http://oracle.trex-fiordland.ts.net:6000}
    command:
      - docker
      - mcp
      - gateway
      - run
      - --transport
      - streaming
      - --port
      - "8811"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/local/lib/docker/cli-plugins/docker-mcp:/usr/local/lib/docker/cli-plugins/docker-mcp:ro
      - ../../../:/workspace
      - nyra_secrets:/run/nyra-secrets:ro
    depends_on:
      secrets-init:
        condition: service_started
    restart: unless-stopped
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  postgres-client:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  # NOTE: cloudflared is managed via the standalone overlay
  # docker-compose.cloudflared.yml (use `make cf-orch-up`). It is intentionally
  # NOT defined in this main compose so it can be stopped/started without
  # affecting LiteLLM, Nexus, or Redis.

  # Portainer CE and Syncthing are managed by docker-compose.persistent.yml
  # (make persistent-up-orchestrator) and must never appear here.

volumes:
  n8n_data:
  cf_secrets:
  nyra_secrets:

networks:
  nyra-network:
    driver: bridge
