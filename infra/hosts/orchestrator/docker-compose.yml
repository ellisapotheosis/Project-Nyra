services:
  openclaw-gateway:
    build:
      context: ../../../services/openclaw
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-openclaw-gateway
    profiles: ["apps"]
    ports:
      - "8001:18789"
    environment:
      NODE_ENV: production
      NEXUS_API_URL: "http://oracle.trex-fiordland.ts.net:6000"
      LITELLM_API_URL: "http://oracle.trex-fiordland.ts.net:4000"
      MEM0_API_URL: ${MEM0_API_URL:-http://oracle.trex-fiordland.ts.net:5000}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENCLAW_AGENT_MODEL: ${OPENCLAW_AGENT_MODEL:-litellm/local/qwen-coder-32b}
      OPENCLAW_MEM0_ENABLED: ${OPENCLAW_MEM0_ENABLED:-false}
      OPENCLAW_MEM0_LLM_MODEL: ${OPENCLAW_MEM0_LLM_MODEL:-local/gemma-4}
      OPENCLAW_MEM0_EMBEDDING_MODEL: ${OPENCLAW_MEM0_EMBEDDING_MODEL:-local/embeddings}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      DATABASE_URL: ${DATABASE_URL:-}
      QUOTE_ENGINE_URL: ${QUOTE_ENGINE_URL:-http://oracle.trex-fiordland.ts.net:8089}
      OPENCLAW_GATEWAY_TOKEN: ${OPENCLAW_GATEWAY_TOKEN:-}
    restart: unless-stopped
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 1g
        reservations:
          memory: 256m

  # docker-mcp-toolkit:
