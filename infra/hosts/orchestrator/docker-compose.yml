  #     - nyra-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1g
  #       reservations:
  #         memory: 256m

  postgres-client:
    # Debug-only psql client. This is not an orchestrator Postgres server:
    # it has no data volume, no host port, and sleeps until an operator execs in.
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  # NOTE: cloudflared is managed via the standalone overlay
  # docker-compose.cloudflared.yml (use `make cf-orch-up`). It is intentionally
  # NOT defined in this main compose so it can be stopped/started without
  # affecting LiteLLM, Nexus, or Redis.

  # ── Portainer CE Server (Central Management) ────────────────────────────
  # The central UI/API for managing every Docker host through agents.
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-nyra-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nyra-network
    healthcheck:
      # portainer-ce is distroless here; no sh/curl/wget is available in-image.
      # External status check: http://<host>:9000/api/status
      disable: true
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    # Canonical Syncthing runs from docker-compose.persistent.yml as
    # nyra-persistent-orchestrator-syncthing. Leave this legacy surface opt-in
    # only to avoid starting a second host-networked instance on the same box.
    profiles: ["legacy-sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-orchestrator}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  n8n_data:
  cf_secrets:
  syncthing_config:
  portainer_data:

networks:
  nyra-network:
    driver: bridge
