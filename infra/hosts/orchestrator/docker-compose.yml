  #   depends_on:
  #     secrets-init:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #   networks:
  #     - nyra-network

  postgres-client:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  # ── Portainer Edge Agent ────────────────────────────────────────────────
  # Orchestrator runs an edge agent connecting to central Portainer SE on
  # oracle-vps per OMNIBUS Section 8.3 core-mgmt-protected group. Central UI
  # (portainer-se) lives on oracle-vps; do NOT deploy portainer-ce here.
  portainer-edge-agent:
    image: portainer/agent:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-portainer-edge-agent
    restart: unless-stopped
    environment:
      EDGE: "1"
      EDGE_ID: ${PORTAINER_EDGE_ID}
      EDGE_KEY: ${PORTAINER_EDGE_KEY}
      EDGE_INSECURE_POLL: ${PORTAINER_EDGE_INSECURE_POLL:-1}
      AGENT_CLUSTER_ADDR: tasks.portainer-edge-agent
      AGENT_TAGS: ${PORTAINER_AGENT_TAGS:-nyra,orchestrator}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/volumes:/var/lib/docker/volumes
    networks:
      - nyra-network

  # ── Syncthing (Receive-Only from canonical worker-rtx5090) ─────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
      - SEND_ONLY=false
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  n8n_data:
  cf_secrets:
  syncthing_config:
  portainer_data:

networks:
  nyra-network:
    driver: bridge
