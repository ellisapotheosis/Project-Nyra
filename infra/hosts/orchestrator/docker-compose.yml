  #   depends_on:
  #     secrets-init:
  #       condition: service_completed_successfully
  #   restart: unless-stopped
  #   networks:
  #     - nyra-network
  #   deploy:
  #     resources:
  #       limits:
  #         memory: 1g
  #       reservations:
  #         memory: 256m

  postgres-client:
    image: postgres:16-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-postgres-client
    profiles: ["debug"]
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD:-}
    entrypoint: ["sleep", "infinity"]
    restart: unless-stopped
    networks:
      - nyra-network

  # NOTE: cloudflared is managed via the standalone overlay
  # docker-compose.cloudflared.yml (use `make cf-orch-up`). It is intentionally
  # NOT defined in this main compose so it can be stopped/started without
  # affecting LiteLLM, Nexus, or Redis.

  # ── Portainer CE Server (Central Management) ────────────────────────────
  # The central UI/API for managing every Docker host through agents.
  portainer:
    image: portainer/portainer-ce:2.27.9
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-portainer
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "9000:9000"
      - "9443:9443"
    volumes:
      - portainer_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nyra-network
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--quiet",
          "--tries=1",
          "--spider",
          "http://localhost:9000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          memory: 2g
        reservations:
          memory: 512m

  # ── Syncthing ───────────────────────────────────────────────────────────
  syncthing:
    profiles: ["sync"]
    image: syncthing/syncthing:latest
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-nyra-syncthing
    network_mode: host
    environment:
      - PUID=1000
      - PGID=1000
    volumes:
      - syncthing_config:/var/syncthing
      - /home/ellisapotheosis:/var/syncthing/data/home
    restart: unless-stopped

volumes:
  n8n_data:
  cf_secrets:
  syncthing_config:
  portainer_data:

networks:
  nyra-network:
    driver: bridge
