services:
  llxprt-jefe:
    build:
      context: ../../../external/llxprt-jefe
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-llxprt-jefe
    restart: unless-stopped
    environment:
      JEFE_PORT: 8080
      HOME: /tmp
    volumes:
      - ${HOME:-/home/ellisapotheosis}/.config:/tmp/.config:ro
      - ${HOME:-/home/ellisapotheosis}/.cache:/tmp/.cache
    networks:
      - nyra-network

  llxprt-code:
    image: node:20-slim
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-llxprt-code
    restart: unless-stopped
    environment:
      HOME: /tmp
    command:
      - /bin/sh
      - -c
      - "npx --yes @vybestack/llxprt-code --help >/tmp/llxprt-help.txt && tail -f /dev/null"
    volumes:
      - ${HOME:-/home/ellisapotheosis}/.config:/tmp/.config:ro
    networks:
      - nyra-network

  llxprt-bridge:
    build:
      context: ../../../services/llxprt-bridge
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-orchestrator-llxprt-bridge
    restart: unless-stopped
    environment:
      LLXPRT_BRIDGE_PORT: 8092
      LLXPRT_BRIDGE_API_KEY: ${LLXPRT_BRIDGE_API_KEY:-}
      LLXPRT_BRIDGE_WORKDIR: /workspace
      HOME: /tmp
    ports:
      - "${LLXPRT_BRIDGE_PORT:-8092}:8090"
    volumes:
      - ../../..:/workspace
      - ${HOME:-/home/ellisapotheosis}/.config:/tmp/.config:ro
      - ${HOME:-/home/ellisapotheosis}/.cache:/tmp/.cache
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8090/health'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    networks:
      - nyra-network

networks:
  nyra-network:
    external: true
    name: nyra-network_nyra-network
