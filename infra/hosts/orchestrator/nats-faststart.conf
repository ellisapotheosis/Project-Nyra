server_name: nyra-orchestrator
port: 4222
http: 8222

jetstream {
  store_dir: /data/jetstream
  max_mem_store: 1GB
  max_file_store: 30GB
}

authorization {
  users = [
    {
      user: $NATS_USER
      password: $NATS_PASSWORD
      permissions: {
        publish: ["nyra.>"]
        subscribe: ["nyra.>", "_INBOX.>"]
      }
    }
  ]
}

max_payload: 8MB
write_deadline: "10s"
