version: "3.8"

# Compose fragment for running a standalone Nexus Router instance that
# implements the one‑hop LLM gateway described in nexus-one-hop/README.md.
#
# This service binds the container’s port 8000 on the host at 6010 to avoid
# clashing with the primary Nexus Router running on port 6000.  It mounts
# the custom configuration from the `nexus-one-hop/config` folder and
# automatically loads environment variables from the `.env` file in
# `nexus-one-hop` (copy `.env.example` → `.env` and populate keys).
#
# The included Docker labels enable automatic discovery and registration
# through the existing Nyra service mesh.  To bring this up along with
# the rest of the stack, run:
#
#   docker compose -f docker-compose.base.yml \
#                  -f docker-compose.nexus-one-hop.yml up -d

services:
  nexus_onehop:
    image: ghcr.io/grafbase/nexus:stable
    container_name: nexus-one-hop
    restart: unless-stopped
    ports:
      # Map the LLM/MCP gateway to host port 6000 (internal 6000)
      - "6000:6000"
      # Expose Prometheus metrics on host port 6011
      - "6011:6011"
    env_file:
      - ./nexus-one-hop/.env
    environment:
      # Override the internal ports to align with nexus.toml
      NEXUS_PORT: "6000"
      NEXUS_PROMETHEUS_PORT: "6011"
    volumes:
      - ./nexus-one-hop/config/nexus.toml:/etc/nexus/nexus.toml:ro
    networks:
      - nyra-network
    labels:
      - "nyra.service.name=nexus-one-hop"
      - "nyra.service.type=llm-gateway"
      - "nyra.mcp.enabled=true"
      - "nyra.mcp.transport=http"
      - "nyra.mcp.port=8000"

networks:
  nyra-network:
    external: true