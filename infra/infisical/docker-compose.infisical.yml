# ============================================================================
# Infisical Agent Docker Compose - Project Nyra
# ============================================================================
# Runs Infisical Agent as a Docker sidecar container to automatically sync
# secrets from Infisical Cloud to local .env files for all services.
#
# The agent:
#   • Authenticates using Machine Identity (Universal Auth)
#   • Pulls secrets from multiple paths (/shared, /worker-*)
#   • Renders secrets to .env files at configurable intervals
#   • Auto-restarts on failure
#
# Usage:
#   docker-compose -f infra/infisical/docker-compose.infisical.yml up -d
#   docker-compose -f infra/infisical/docker-compose.infisical.yml logs -f
#   docker-compose -f infra/infisical/docker-compose.infisical.yml down
# ============================================================================

version: '3.8'

services:
  infisical-agent:
    image: infisical/cli:latest
    container_name: infisical-agent
    restart: unless-stopped

    # Run the agent with the config file
    command: agent --config /app/infisical-config.yaml

    # Environment variables
    environment:
      # Infisical Cloud URL (use cloud or self-hosted)
      INFISICAL_API_URL: https://app.infisical.com

      # Project configuration
      INFISICAL_PROJECT_ID: 8374cea9-e5e8-4050-bda4-b91f25ab30ef
      INFISICAL_ENVIRONMENT: dev

      # Logging
      LOG_LEVEL: info

    # Mount configuration and secrets
    volumes:
      # Agent configuration file
      - ./infisical-config.yaml:/app/infisical-config.yaml:ro

      # Machine Identity credentials (read-only)
      - ./secrets/infisical-client-id:/run/secrets/infisical-client-id:ro
      - ./secrets/infisical-client-secret:/run/secrets/infisical-client-secret:ro

      # Output directory for rendered .env files
      - ../docker/.env.rendered:/app/rendered/.env
      - ../docker/.env.shared.rendered:/app/rendered/.env.shared
      - ../docker/.env.orchestrator.rendered:/app/rendered/.env.orchestrator
      - ../docker/.env.worker-5090.rendered:/app/rendered/.env.worker-5090
      - ../docker/.env.worker-3090.rendered:/app/rendered/.env.worker-3090
      - ../docker/.env.worker-3060.rendered:/app/rendered/.env.worker-3060

    # Health check
    healthcheck:
      test: ["CMD", "ps", "aux", "|", "grep", "infisical-agent"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 128M

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Labels for organization
    labels:
      com.project.name: "Project Nyra"
      com.project.component: "infisical-agent"
      com.project.description: "Automatic secret synchronization from Infisical"

# ============================================================================
# Networks
# ============================================================================
# The Infisical Agent doesn't need network access to other services,
# it only needs internet access to reach Infisical Cloud API
networks:
  default:
    driver: bridge

# ============================================================================
# Usage Instructions
# ============================================================================
#
# 1. Start the agent:
#    docker-compose -f infra/infisical/docker-compose.infisical.yml up -d
#
# 2. View logs:
#    docker-compose -f infra/infisical/docker-compose.infisical.yml logs -f
#
# 3. Check status:
#    docker-compose -f infra/infisical/docker-compose.infisical.yml ps
#
# 4. Stop the agent:
#    docker-compose -f infra/infisical/docker-compose.infisical.yml down
#
# 5. Restart the agent:
#    docker-compose -f infra/infisical/docker-compose.infisical.yml restart
#
# ============================================================================
# Troubleshooting
# ============================================================================
#
# Agent not starting?
#   • Check credentials exist: ls -la infra/infisical/secrets/
#   • Verify config: cat infra/infisical/infisical-config.yaml
#   • Check logs: docker logs infisical-agent
#
# Secrets not syncing?
#   • Verify Machine Identity has read access to all paths
#   • Check Infisical Dashboard: https://app.infisical.com
#   • Ensure paths exist: /shared, /worker-5090, /worker-3090, /worker-3060
#
# .env files not created?
#   • Check volume mounts are correct
#   • Verify file permissions on host
#   • Ensure templates exist in infra/infisical/templates/
#
# ============================================================================
