# RateHunter Complete Stack - All Services

version: '3.8'

services:
  # === API & Web Services ===
  
  orchestrator:
    build: 
      context: .
      dockerfile: docker/Dockerfile.orchestrator
    container_name: ratehunter-orchestrator
    restart: unless-stopped
    ports:
      - "8080:8080"
      - "4000:4000"
    environment:
      - STAGE=production
      - INFISICAL_API_KEY=${INFISICAL_API_KEY}
      - DATABASE_URL=postgresql://ratehunter:${DB_PASSWORD}@postgres:5432/ratehunter
      - REDIS_URL=redis://redis:6379/0
      - CLAUDE_API_KEY=${CLAUDE_API_KEY}
    volumes:
      - ./config:/opt/ratehunter/config
      - ./logs:/opt/ratehunter/logs
      - orchestrator-data:/opt/ratehunter/data
    networks:
      - ratehunter-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  worker-agent:
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    container_name: ratehunter-worker
    restart: unless-stopped
    ports:
      - "9001:9001"
      - "11434:11434"
    environment: 
      - STAGE=production
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - OLLAMA_HOST=0.0.0.0:11434
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - ./config:/opt/worker/config
      - ./logs:/opt/worker/logs
      - ollama-models:/root/.ollama
    networks:
      - ratehunter-net
    depends_on:
      - orchestrator

  api-gateway:
    build: 
      context: .
      dockerfile: docker/Dockerfile.api-gateway
    container_name: ratehunter-api
    restart:  unless-stopped
    ports: 
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://ratehunter:${DB_PASSWORD}@postgres:5432/ratehunter
      - REDIS_URL=redis://redis:6379/0
      - ORCHESTRATOR_URL=http://orchestrator:8080
      - JWT_SECRET=${JWT_SECRET}
    volumes:
      - ./logs:/app/logs
    networks:
      - ratehunter-net
    depends_on:
      - orchestrator
      - postgres
      - redis

  web-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.web-ui
    container_name: ratehunter-ui
    restart: unless-stopped
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://api-gateway:3000
      - VITE_WS_URL=ws://api-gateway:3000
    volumes:
      - ./web-ui/src:/app/src
    networks:
      - ratehunter-net
    depends_on:
      - api-gateway

  # === Data Services ===

  postgres:
    image: postgres:15-alpine
    container_name: ratehunter-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=ratehunter
      - POSTGRES_USER=ratehunter
      - POSTGRES_PASSWORD=${DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes: 
      - postgres-data:/var/lib/postgresql/data
      - ./schemas/postgres:/docker-entrypoint-initdb.d
    networks:
      - ratehunter-net
    healthcheck:
      test:  ["CMD-SHELL", "pg_isready -U ratehunter -d ratehunter"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis: 
    image: redis:7-alpine
    container_name: ratehunter-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 512mb
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks: 
      - ratehunter-net
    healthcheck:
      test:  ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # === Monitoring Stack ===

  prometheus:
    image: prom/prometheus:latest
    container_name: ratehunter-prometheus
    restart:  unless-stopped
    ports: 
      - "9090:9090"
    volumes:
      - ./config/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    networks:
      - ratehunter-net
    command: 
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb. path=/prometheus'

  grafana:
    image: grafana/grafana:latest
    container_name: ratehunter-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment: 
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
    networks: 
      - ratehunter-net
    depends_on:
      - prometheus

  # === Open-WebUI ===

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ratehunter-webui
    restart: unless-stopped
    ports: 
      - "8000:8080"
    environment:
      - LITELLM_URL=http://orchestrator:4000
      - OLLAMA_BASE_URL=http://worker-agent:11434
    volumes:
      - webui-data:/app/backend/data
    networks:
      - ratehunter-net
    depends_on:
      - orchestrator


      - worker-agent

volumes:
  postgres-data: 
  redis-data:
  prometheus-data:
  grafana-data:
  orchestrator-data:
  ollama-models:
  webui-data:

networks:
  ratehunter-net: 
    driver: bridge