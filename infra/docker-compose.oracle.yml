version: "3.9"

services:
  # ============================================================================
  # SECRETS MANAGEMENT
  # ============================================================================

  infisical-agent:
    image: infisical/infisical-agent:latest
    container_name: oracle-infisical-agent
    environment:
      INFISICAL_TOKEN: ${ORACLE_INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL}
    volumes:
      - oracle_secrets:/secrets
    restart: unless-stopped
    networks:
      - oracle-net

  # ============================================================================
  # CORE DATABASES
  # ============================================================================

  postgres:
    image: ankane/pgvector:v0.7.0
    container_name: oracle-postgres
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgvector"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/00-init.sql:ro
    shm_size: 256mb
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: oracle-redis
    command: >
      redis-server
      --appendonly yes
      --appendfsync everysec
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # CORE APPLICATIONS
  # ============================================================================

  twenty-crm:
    image: twentycrm/twenty:latest
    container_name: oracle-twenty-crm
    environment:
      NODE_ENV: production
      SERVER_URL: https://crm.ratehunter.net
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      infisical-agent:
        condition: service_started
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  activepieces:
    image: activepieces/activepieces:latest
    container_name: oracle-activepieces
    environment:
      NODE_ENV: production
      AP_MODE: "standalone"
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/activepieces
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET}
      FRONTEND_URL: https://workflows.ratehunter.net
      API_URL: https://api-workflows.ratehunter.net
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
    ports:
      - "3001:80"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # MICROSERVICES
  # ============================================================================

  quote-engine:
    build:
      context: ../services/quote-engine
      dockerfile: Dockerfile
    container_name: oracle-quote-engine
    environment:
      NODE_ENV: production
      PORT: 8089
      LOG_LEVEL: info
    ports:
      - "8089:8089"
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  lead-ingestion:
    build:
      context: ../services/lead-ingestion
      dockerfile: Dockerfile
    container_name: oracle-lead-ingestion
    environment:
      NODE_ENV: production
      PORT: 8090
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/twenty
      TWENTY_CRM_URL: http://twenty-crm:3000
      TWENTY_API_TOKEN: ${TWENTY_API_TOKEN}
      IMAP_HOST: ${IMAP_HOST}
      IMAP_USER: ${IMAP_USER}
      IMAP_PASSWORD: ${IMAP_PASSWORD}
      LEADMAILBOX_API_KEY: ${LEADMAILBOX_API_KEY}
    ports:
      - "8090:8090"
    depends_on:
      postgres:
        condition: service_healthy
      twenty-crm:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # GRAPH DATABASE (FalkorDB — Redis-compatible, used by mem0 + openclaw)
  # ============================================================================

  falkordb:
    image: falkordb/falkordb:latest
    container_name: oracle-falkordb
    ports:
      - "6380:6379"   # Redis-protocol graph queries (avoids clash with redis:6379)
      - "3006:3000"   # FalkorDB Browser UI
    volumes:
      - falkordb_data:/data
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ============================================================================
  # MEMORY & KNOWLEDGE
  # ============================================================================

  mempalace:
    build:
      context: ../../services/mempalace-mcp
      dockerfile: Dockerfile
    container_name: nyra-mempalace
    environment:
      PORT: 8000
      MEMPAL_DIR: /data/vault
    ports:
      - "8002:8000"
    volumes:
      - mempalace_data:/root/.mempalace
      - mempalace_vault:/data/vault
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  mem0:
    build:
      context: ../services/mem0
      dockerfile: Dockerfile
    container_name: oracle-mem0
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@postgres:5432/mem0
      LITELLM_API_URL: http://100.x.x.0:4000  # Tailscale orchestrator LiteLLM
      LITELLM_API_KEY: ${LITELLM_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      FALKORDB_URL: redis://falkordb:6379
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  openclaw:
    build:
      context: ../services/openclaw
      dockerfile: Dockerfile
    container_name: oracle-openclaw
    environment:
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      OPENAI_BASE_URL: http://100.x.x.0:4000/v1  # Tailscale orchestrator LiteLLM
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: "6379"
    ports:
      - "18789:18789"
    depends_on:
      falkordb:
        condition: service_healthy
    volumes:
      - openclaw_data:/root/.openclaw
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:18789/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: oracle-open-webui
    environment:
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY}
      ENABLE_SIGNUP: "false"
      OPENAI_API_BASE_URL: http://100.x.x.0:4000/v1  # Tailscale orchestrator LiteLLM
      OPENAI_API_KEY: ${LITELLM_API_KEY}
      DEFAULT_MODELS: gpt-4o-mini
    ports:
      - "8888:8080"
    volumes:
      - open_webui_data:/app/backend/data
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # SOURCE CONTROL & CI/CD
  # ============================================================================

  gitea:
    image: gitea/gitea:latest
    container_name: oracle-gitea
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA_ADMIN_USERNAME: ${GITEA_ADMIN_USERNAME}
      GITEA_ADMIN_PASSWORD: ${GITEA_ADMIN_PASSWORD}
    ports:
      - "3002:3000"
      - "2222:22"
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
    restart: unless-stopped
    networks:
      - oracle-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - optional

  gitea-runner:
    image: gitea/act_runner:latest
    container_name: oracle-gitea-runner
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      CONFIG_FILE: /config.yaml
    volumes:
      - ./gitea/runner-config.yaml:/config.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - gitea
    restart: unless-stopped
    networks:
      - oracle-net
    profiles:
      - optional

  # ============================================================================
  # MONITORING & UTILITIES
  # ============================================================================

  adminer:
    image: adminer:latest
    container_name: oracle-adminer
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - oracle-net
    profiles:
      - debug

  # ============================================================================
  # VOLUMES & NETWORKS
  # ============================================================================

volumes:
  postgres_data:
  redis_data:
  oracle_secrets:
  gitea_data:
  gitea_config:
  mempalace_data:
  mempalace_vault:
  falkordb_data:
  openclaw_data:
  open_webui_data:

networks:
  oracle-net:
    driver: bridge
