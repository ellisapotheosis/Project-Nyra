title: Nyra Ops Portal
views:
  - title: Quick Launch
    path: quick-launch
    icon: mdi:rocket-launch
    cards:
      - type: markdown
        title: Core UIs
        content: |
          > NOTE: These links assume a non-TLS `.local` environment. Update hostnames and
          > protocols to match your deployment, especially when services are fronted by TLS
          > or a reverse proxy.

          ### Application UI
          - [Webapp](http://orchestrator.local:5173)
          - [Landing](http://orchestrator.local:3004)
          - [CRM / Twenty](http://oracle-vps.local:3000)
          - [Dify Chat UI](http://orchestrator.local:3001)

          ### Operator UI
          - [Archon UI](http://orchestrator.local:3737)
          - [Open WebUI](http://orchestrator.local:3002)
          - [OpenClaw UI](http://orchestrator.local:3003)
          - [Portainer](https://orchestrator.local:9443)

          ### Observability + Automation
          - [Grafana](http://orchestrator.local:3005)
          - [Prometheus](http://orchestrator.local:9090)
          - [n8n](http://orchestrator.local:5678)
          - [Gitea](http://orchestrator.local:3006)
      - type: entities
        title: Host Reachability Checklist
        entities:
          - entity: binary_sensor.orchestrator_host_up
          - entity: binary_sensor.oracle_vps_host_up
          - entity: binary_sensor.worker_rtx5090_host_up
          - entity: binary_sensor.worker_rtx3090ti_host_up
          - entity: binary_sensor.worker_rtx3060_host_up

  - title: Embedded Panels
    path: embedded-panels
    icon: mdi:view-carousel
    cards:
      - type: iframe
        url: http://orchestrator.local:9443
        title: Portainer
        aspect_ratio: 75%
      - type: iframe
        url: http://orchestrator.local:3005
        title: Grafana
        aspect_ratio: 75%
      - type: iframe
        url: http://orchestrator.local:3737
        title: Archon UI
        aspect_ratio: 75%

  - title: Incident Tools
    path: incident-tools
    icon: mdi:alert-circle
    cards:
      - type: markdown
        title: Recovery Runbooks
        content: |
          - `make node-up-orchestrator`
          - `make node-up-oracle`
          - `make node-up-worker-5090`
          - `make node-up-worker-3090ti`
          - `make node-up-worker-3060`
          - `make host-layout-validate`
          - `make host-plan`
      - type: entities
        title: Maintenance Controls
        entities:
          - input_boolean.nyra_maintenance_mode
