global:
  scrape_interval: 15s
  evaluation_interval: 15s

# No alertmanager on Oracle — alerts ship to orchestrator Grafana if needed
alerting:
  alertmanagers: []

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Container resource metrics (CPU, RAM, net, disk per container)
  - job_name: cadvisor
    static_configs:
      - targets: ['nyra-cadvisor:8080']
    scrape_interval: 30s

  # n8n (exposes /metrics when N8N_METRICS=true)
  - job_name: n8n
    static_configs:
      - targets: ['nyra-n8n:5678']
    metrics_path: /metrics
    scrape_interval: 30s

  # Activepieces does not expose Prometheus metrics natively — skip
  # TwentyCRM does not expose metrics — skip
