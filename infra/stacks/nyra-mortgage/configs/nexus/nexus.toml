# Nexus control plane: unified MCP + LLM routing endpoint
[server]
address = "0.0.0.0:4001"

[mcp]
enabled = true
path = "/mcp/sse"

# Unified downstream MCP servers (local + remote via Tailscale)
[mcp.servers.ruflo]
url = "{{ env.RUFLO_MCP_URL }}"

[mcp.servers.serena]
url = "{{ env.SERENA_MCP_URL }}"

[mcp.servers.gitea]
url = "{{ env.GITEA_MCP_URL }}"

[mcp.servers.mem0]
url = "{{ env.MEM0_MCP_URL }}"

[mcp.servers.openmemory]
url = "{{ env.OPENMEMORY_MCP_URL }}"

[llm]
enabled = true

[llm.protocols.openai]
enabled = true
path = "/llm/openai/v1"

[llm.protocols.anthropic]
enabled = true
path = "/llm/anthropic"

[llm.providers.anthropic]
api_key = "{{ env.ANTHROPIC_API_KEY }}"

[llm.providers.openai_via_litellm]
base_url = "http://litellm:4000/v1"
api_key = "dummy"
