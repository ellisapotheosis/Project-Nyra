# ===== LiteLLM Configuration =====
# Unified model router across cloud + edge
# Handles local GPU inference, cloud fallbacks, and cost control

model_list:
  # ===== LOCAL GPU MODELS (Orchestrator → Workers via Tailscale) =====
  
  # Area-51 RTX 5090: Heavy reasoning (70B equivalent via 7B + context)
  - model_name: "vllm-mistral-area51"
    litellm_params:
      model: "openai/mistral-7b"
      api_base: "http://100.x.x.1:8000/v1"
      api_key: "dummy-key"
      timeout: 300
      max_retries: 2
    model_info:
      provider: "vllm"
      region: "edge-area51"
      vram_gb: 24
      max_tokens: 4096
      cost_per_1k_input: 0
      cost_per_1k_output: 0
      description: "Heavy reasoning, complex mortgage scenarios"

  # RTX 3090Ti: Code generation + context windows
  - model_name: "vllm-mistral-3090ti"
    litellm_params:
      model: "openai/mistral-7b"
      api_base: "http://100.x.x.2:8000/v1"
      api_key: "dummy-key"
      timeout: 300
      max_retries: 2
    model_info:
      provider: "vllm"
      region: "edge-3090ti"
      vram_gb: 24
      max_tokens: 4096
      cost_per_1k_input: 0
      cost_per_1k_output: 0
      description: "Code generation, repo edits"

  # RTX 3060 (m15r7): Fast utility via Ollama
  - model_name: "ollama-mistral-3060"
    litellm_params:
      model: "ollama/mistral"
      api_base: "http://100.x.x.3:11434"
      api_key: "dummy-key"
      timeout: 60
    model_info:
      provider: "ollama"
      region: "edge-3060"
      vram_gb: 6
      max_tokens: 2048
      cost_per_1k_input: 0
      cost_per_1k_output: 0
      description: "Fast utility, drafting, embeddings"

  # ===== CLOUD MODELS (Oracle VPS via Tailscale) =====
  
  # Anthropic Claude (Primary for compliance)
  - model_name: "claude-3-sonnet"
    litellm_params:
      model: "claude-3-sonnet-20240229"
      api_key: "${ANTHROPIC_API_KEY}"
      timeout: 120
      max_retries: 3
      rpm: 90000
      tpm: 1000000
    model_info:
      provider: "anthropic"
      region: "cloud"
      max_tokens: 4096
      cost_per_1k_input: 0.003
      cost_per_1k_output: 0.015
      description: "Compliance decisions, audits, legal reasoning"

  # OpenRouter Fallback (if Anthropic rate-limited)
  - model_name: "claude-3-opus-openrouter"
    litellm_params:
      model: "openrouter/anthropic/claude-3-opus"
      api_key: "${OPENROUTER_API_KEY}"
      api_base: "https://openrouter.ai/api/v1"
      timeout: 120
      max_retries: 2
      rpm: 30000
    model_info:
      provider: "openrouter"
      region: "cloud"
      cost_per_1k_input: 0.015
      cost_per_1k_output: 0.075
      description: "Fallback reasoning model"

  # Grok (Low-cost reasoning via OpenRouter)
  - model_name: "grok-2-mini"
    litellm_params:
      model: "openrouter/xai/grok-2-mini"
      api_key: "${OPENROUTER_API_KEY}"
      api_base: "https://openrouter.ai/api/v1"
      timeout: 60
    model_info:
      provider: "openrouter"
      region: "cloud"
      cost_per_1k_input: 0.0005
      cost_per_1k_output: 0.0015
      description: "Ultra-low-cost utility model"

# ===== ROUTER SETTINGS =====
router:
  # Smart routing based on input characteristics
  routing_strategy: "cost-optimized"
  
  # Fallback chain (if primary unavailable)
  fallback_order:
    - "vllm-mistral-area51"      # Try local first
    - "claude-3-sonnet"           # Then premium cloud
    - "grok-2-mini"               # Finally ultra-low-cost

# ===== COST CONTROL & BUDGET =====
general_settings:
  key_management_system: "google_key_management_service"
  enable_logging: true
  log_level: "info"
  
# Budget alerts
  spend_logs_table_name: "litellm_spend_logs"
  daily_spend_limit_usd: 20
  alert_emails: ["${ALERT_EMAIL}"]

  # Token tracking for budget
  track_cost_per_token: true
  enable_spend_dashboard: true

# ===== RATE LIMITING =====
rate_limits:
  # Anthropic rate limits
  anthropic:
    tpm: 1000000
    rpm: 90000
    
  # Local (unlimited)
  vllm:
    tpm: null
    rpm: null
    
  # OpenRouter rate limits
  openrouter:
    tpm: 500000
    rpm: 30000

# ===== LLM ROUTER BEHAVIOR =====
router_settings:
  # Route to cheapest + available model
  routing_strategy: "cost-optimized-with-fallback"
  
  # Tag-based routing (can be called by Nexus)
  router_tags:
    heavy:
      models: ["vllm-mistral-area51"]
      min_tokens: 1000
      reason: "Heavy reasoning → RTX 5090"
    
    code:
      models: ["vllm-mistral-3090ti"]
      tools: ["code_generation", "file_write"]
      reason: "Code tasks → RTX 3090Ti"
    
    fast:
      models: ["ollama-mistral-3060"]
      max_tokens: 1000
      reason: "Quick utility → Ollama"
    
    compliance:
      models: ["claude-3-sonnet"]
      tools: ["regulatory", "audit", "legal"]
      reason: "Compliance → Anthropic (auditable)"

# ===== PROXY SETTINGS =====
proxy_settings:
  proxy_router_settings:
    # Enable caching of responses
    cache: true
    cache_ttl: 3600
    
    # Timeout settings
    timeout: 300
    
    # Request validation
    validate_prompts: true
    
    # Cost tracking
    track_cost: true

# ===== DATABASE (For logging + spend tracking) =====
database:
  type: "postgres"
  connection_string: "postgresql://postgres:${ORCHESTRATOR_DATABASE_PASSWORD}@localhost:5432/litellm"
  table_name: "litellm_logs"

# ===== ALERTING =====
alerts:
  - name: "daily_spend"
    type: "spend"
    threshold: 20
    window: "daily"
    alert_to: ["${ALERT_EMAIL}"]
  
  - name: "model_failure"
    type: "model_failure_rate"
    threshold: 10
    window: "hourly"
    alert_to: ["${ALERT_EMAIL}"]
  
  - name: "budget_exceeded"
    type: "budget_exceeded"
    alert_to: ["${ADMIN_EMAIL}"]

# ===== HEALTH CHECK =====
health_check:
  enabled: true
  interval_seconds: 300
  models:
    - "vllm-mistral-area51"
    - "claude-3-sonnet"
