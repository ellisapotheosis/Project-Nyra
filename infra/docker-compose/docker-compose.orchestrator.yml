# ============================================================================
# Project Nyra - Orchestration Services
# ============================================================================
# AI orchestration and coordination services
# Includes: Nyra Orchestrator (main business logic service)
#
# Dependencies: base, databases, ai
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.databases.yml -f docker-compose.ai.yml -f docker-compose.orchestrator.yml up -d
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Nyra Orchestrator - Main business logic and coordination service
  # ==========================================================================
  nyra_orchestrator:
    build:
      context: ../../services/nyra-orchestrator
      dockerfile: ../../infra/docker/build/services/nyra-orchestrator/Dockerfile
    container_name: nyra-orchestrator
    restart: unless-stopped
    ports:
      - "${NYRA_ORCHESTRATOR_PORT:-8010}:8010"
    environment:
      # Policy Configuration
      - NYRA_POLICY_MODE=${NYRA_POLICY_MODE:-strict}
      - NYRA_ALLOWED_CHANNELS=${NYRA_ALLOWED_CHANNELS:-sms,email,webchat}
      - NYRA_ESCALATION_EMAIL=${NYRA_ESCALATION_EMAIL:-ops@example.com}

      # Service URLs
      - TWENTY_BASE_URL=http://twentycrm:3000
      - NEXUS_BASE_URL=http://nexus:6000
      - FALKOR_URL=redis://falkordb:6379

      # Database
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${POSTGRES_DB:-nyra_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379

      # API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}

      # Logging
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nexus:
        condition: service_healthy
      falkordb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
