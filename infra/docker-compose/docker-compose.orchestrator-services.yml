version: '3.8'

networks:
  nyra-network:
    external: true
    name: nyra-network
  internal:
    driver: bridge

services:
  # ============================================================================
  # GITEA - Git Server
  # ============================================================================
  gitea-db:
    image: postgres:16-alpine
    container_name: orchestrator-gitea-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  gitea:
    image: gitea/gitea:latest
    container_name: orchestrator-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=gitea-db:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-100.64.0.1}
      - GITEA__server__SSH_DOMAIN=${GITEA_SSH_DOMAIN:-100.64.0.1}
      - GITEA__server__ROOT_URL=http://${GITEA_DOMAIN:-100.64.0.1}:3001/
      - GITEA__server__HTTP_PORT=3000
      - GITEA__server__SSH_PORT=22
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3001:3000" # HTTP
      - "2222:22" # SSH
    networks:
      - nyra-network
      - internal
    depends_on:
      gitea-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/api/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=gitea"
      - "com.nyra.category=git-server"
      - "com.nyra.expose=cloudflare"

  # ============================================================================
  # N8N - Workflow Automation
  # ============================================================================
  n8n-db:
    image: postgres:16-alpine
    container_name: orchestrator-n8n-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${N8N_DB_USER:-n8n}
      POSTGRES_PASSWORD: ${N8N_DB_PASSWORD}
      POSTGRES_DB: ${N8N_DB_NAME:-n8n}
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${N8N_DB_USER:-n8n}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  n8n:
    image: n8nio/n8n:latest
    container_name: orchestrator-n8n
    restart: unless-stopped
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=${N8N_DB_NAME:-n8n}
      - DB_POSTGRESDB_USER=${N8N_DB_USER:-n8n}
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_HOST=${N8N_HOST:-100.64.0.1}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://${N8N_HOST:-100.64.0.1}:5678/
      - GENERIC_TIMEZONE=America/Los_Angeles
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
    volumes:
      - n8n_data:/home/node/.n8n
    ports:
      - "5678:5678"
    networks:
      - nyra-network
      - internal
    depends_on:
      n8n-db:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=n8n"
      - "com.nyra.category=automation"
      - "com.nyra.expose=cloudflare"

  # ============================================================================
  # ACTIVEPIECES - No-Code Automation
  # ============================================================================
  activepieces-db:
    image: postgres:16-alpine
    container_name: orchestrator-activepieces-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ACTIVEPIECES_DB_USER:-activepieces}
      POSTGRES_PASSWORD: ${ACTIVEPIECES_DB_PASSWORD}
      POSTGRES_DB: ${ACTIVEPIECES_DB_NAME:-activepieces}
    volumes:
      - activepieces_db_data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${ACTIVEPIECES_DB_USER:-activepieces}" ]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces-redis:
    image: redis:7-alpine
    container_name: orchestrator-activepieces-redis
    restart: unless-stopped
    command: redis-server --requirepass ${ACTIVEPIECES_REDIS_PASSWORD}
    volumes:
      - activepieces_redis_data:/data
    networks:
      - nyra-network
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces:
    image: activepieces/activepieces:latest
    container_name: orchestrator-activepieces
    restart: unless-stopped
    environment:
      - AP_ENGINE_EXECUTABLE_PATH=dist/packages/engine/main.js
      - AP_API_KEY=${ACTIVEPIECES_API_KEY}
      - AP_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY}
      - AP_JWT_SECRET=${ACTIVEPIECES_JWT_SECRET}
      - AP_ENVIRONMENT=prod
      - AP_FRONTEND_URL=http://${ACTIVEPIECES_HOST:-100.64.0.1}:8080
      - AP_WEBHOOK_TIMEOUT_SECONDS=30
      - AP_TRIGGER_DEFAULT_POLL_INTERVAL=5
      - AP_POSTGRES_DATABASE=${ACTIVEPIECES_DB_NAME:-activepieces}
      - AP_POSTGRES_HOST=activepieces-db
      - AP_POSTGRES_PORT=5432
      - AP_POSTGRES_USERNAME=${ACTIVEPIECES_DB_USER:-activepieces}
      - AP_POSTGRES_PASSWORD=${ACTIVEPIECES_DB_PASSWORD}
      - AP_REDIS_HOST=activepieces-redis
      - AP_REDIS_PORT=6379
      - AP_REDIS_PASSWORD=${ACTIVEPIECES_REDIS_PASSWORD}
      - AP_SANDBOX_RUN_TIME_SECONDS=600
      - AP_TELEMETRY_ENABLED=false
    volumes:
      - activepieces_data:/root/.activepieces
    ports:
      - "8080:80"
    networks:
      - nyra-network
      - internal
    depends_on:
      activepieces-db:
        condition: service_healthy
      activepieces-redis:
        condition: service_healthy
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:80/api/v1/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=activepieces"
      - "com.nyra.category=automation"
      - "com.nyra.expose=cloudflare"

  # ============================================================================
  # CLOUDFLARE TUNNEL - Secure External Access
  # ============================================================================
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: orchestrator-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token eyJhIjoiMmZmNTk1MGRmOTA3ODQxN2ZkZTczZmJiMTg0ZGE4YTciLCJ0IjoiYzg2YjdhNGEtNjE1ZS00ZDNhLTk2MjEtYzVmYjk4NWQxZDY0IiwicyI6Ik56UXdPVEUxT0dVdFpESXdZUzAwTkRnNUxXSmpZak10TTJNd05tVmpaRGxtTVRCbSJ9
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "info" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "com.nyra.service=cloudflared"
      - "com.nyra.category=tunnel"
      - "com.nyra.ingress=orchestrator"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  gitea_db_data:
    driver: local
  gitea_data:
    driver: local
  n8n_db_data:
    driver: local
  n8n_data:
    driver: local
  activepieces_db_data:
    driver: local
  activepieces_redis_data:
    driver: local
  activepieces_data:
    driver: local
