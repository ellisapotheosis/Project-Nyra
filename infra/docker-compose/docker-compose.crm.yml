# ============================================================================
# Project Nyra - CRM Services
# ============================================================================
# Customer Relationship Management
# Includes: TwentyCRM
#
# Dependencies: base
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.crm.yml up -d
# ============================================================================

version: '3.8'

volumes:
  twenty_pg:
    name: nyra_twenty_pg
    driver: local

services:
  # ==========================================================================
  # TwentyCRM - Open source CRM
  # ==========================================================================
  twentycrm:
    image: twentycrm/twenty:latest
    container_name: nyra-twentycrm
    restart: unless-stopped
    ports:
      - "${TWENTY_PORT:-3000}:3000"
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${TWENTY_DB:-twenty}
      - PGHOST=postgres
      - PGPORT=5432
      - PGUSER=${POSTGRES_USER:-nyra_user}
      - PGPASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
      - PGDATABASE=${TWENTY_DB:-twenty}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379
      - SERVER_URL=${TWENTY_SERVER_URL:-http://localhost:3000}
      - ENCRYPTION_SECRET=${TWENTY_ENCRYPTION_SECRET:-change_me_encryption_secret}
      - JWT_SECRET=${TWENTY_JWT_SECRET:-change_me_jwt_secret}
      - PASSWORD_SALT=${TWENTY_PASSWORD_SALT:-change_me_password_salt}
      - ACCESS_TOKEN_SECRET=${TWENTY_ACCESS_TOKEN_SECRET:-change_me_access_token_secret}
      - LOGIN_TOKEN_SECRET=${TWENTY_LOGIN_TOKEN_SECRET:-change_me_login_token_secret}
      - REFRESH_TOKEN_SECRET=${TWENTY_REFRESH_TOKEN_SECRET:-change_me_refresh_token_secret}
      - FILE_TOKEN_SECRET=${TWENTY_FILE_TOKEN_SECRET:-change_me_file_token_secret}
      - FRONT_BASE_URL=${TWENTY_FRONT_BASE_URL:-http://localhost:3000}
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
