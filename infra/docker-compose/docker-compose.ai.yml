# ============================================================================
# Project Nyra - AI Services
# ============================================================================
# AI and LLM infrastructure services
# Includes: Nexus Router, LiteLLM, Letta, Mem0, Open-WebUI
#
# Dependencies: base, databases
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.databases.yml -f docker-compose.ai.yml up -d
# ============================================================================

version: '3.8'

volumes:
  litellm_data:
    name: nyra_litellm_data
    driver: local
  letta_data:
    name: nyra_letta_data
    driver: local
  mem0_data:
    name: nyra_mem0_data
    driver: local
  open_webui_data:
    name: nyra_open_webui_data
    driver: local

services:
  # ==========================================================================
  # Nexus Router - Unified LLM gateway
  # ==========================================================================
  nexus:
    image: ghcr.io/grafbase/nexus:latest
    container_name: nyra-nexus
    restart: unless-stopped
    ports:
      - "${NEXUS_PORT:-6000}:3000"
    volumes:
      - ../../configs/nexus/nexus.toml:/etc/nexus.toml:ro
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    networks:
      - nyra-network
    depends_on:
      - litellm
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 20s
      timeout: 5s
      retries: 10
    labels:
      - "com.nyra.service=nexus-router"
      - "com.nyra.category=ai-gateway"
      - "com.nyra.mcp.enabled=true"

  # ==========================================================================
  # LiteLLM - LLM proxy and load balancer
  # ==========================================================================
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-litellm
    restart: unless-stopped
    ports:
      - "${LITELLM_PORT:-4000}:4000"
    volumes:
      - ../../configs/litellm/config.yaml:/app/config.yaml:ro
      - litellm_data:/data
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-sk-litellm-master-key}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${LITELLM_DB:-litellm}
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ==========================================================================
  # Letta - Agent memory and state management
  # ==========================================================================
