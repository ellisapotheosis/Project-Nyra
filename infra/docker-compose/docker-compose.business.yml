# ============================================================================
# Project Nyra - Business Services
# ============================================================================
# Domain-specific business services
# Includes: Quote Engine, Campaign Engine, Quote API
#
# Dependencies: base
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.business.yml up -d
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Quote Engine - Mortgage quote generation service
  # ==========================================================================
  quote-engine:
    build:
      context: ../../services/quote-engine
      dockerfile: ../../infra/docker/build/services/quote-engine/Dockerfile
    container_name: nyra-quote-engine
    restart: unless-stopped
    ports:
      - "${QUOTE_ENGINE_PORT:-9010}:9010"
    environment:
      - QUOTE_ENGINE_PORT=9010
      - QUOTE_ENGINE_HOST=0.0.0.0
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${POSTGRES_DB:-nyra_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
      - NEXUS_URL=${NEXUS_URL:-http://nexus:6000}
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # Campaign Engine - Marketing campaign management
  # ==========================================================================
  campaign-engine:
    build:
      context: ../../services/campaign-engine
      dockerfile: ../../infra/docker/build/services/campaign-engine/Dockerfile
    container_name: nyra-campaign-engine
    restart: unless-stopped
    ports:
      - "${CAMPAIGN_ENGINE_PORT:-9020}:9020"
    environment:
      - CAMPAIGN_ENGINE_PORT=9020
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${POSTGRES_DB:-nyra_db}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-redis_secure_pass}@redis:6379/0
    volumes:
      - ../../data/campaigns:/app/data/campaigns:ro
    networks:
      - nyra-network
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9020/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ==========================================================================
  # Quote API - Quote service HTTP API
  # ==========================================================================
  quote-api:
    build:
      context: ../../services/quote-api
      dockerfile: ../../infra/docker/build/services/quote-api/Dockerfile
    container_name: nyra-quote-api
    restart: unless-stopped
    ports:
      - "${QUOTE_API_PORT:-8089}:8080"
    environment:
      - QUOTE_API_PORT=8080
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-nyra_user}:${POSTGRES_PASSWORD:-nyra_secure_password}@postgres:5432/${POSTGRES_DB:-nyra_db}
      - QUOTE_ENGINE_URL=http://quote-engine:9010
    networks:
      - nyra-network
    depends_on:
      - quote-engine
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
