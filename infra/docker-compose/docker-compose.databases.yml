# ============================================================================
# Project Nyra - Database Services
# ============================================================================
# Specialized database services
# Includes: FalkorDB (graph), Qdrant (vector)
#
# Usage:
#   docker compose -f docker-compose.base.yml -f docker-compose.databases.yml up -d
# ============================================================================

version: '3.8'

volumes:
  falkordb_data:
    name: nyra_falkordb_data
    driver: local
  qdrant_data:
    name: nyra_qdrant_data
    driver: local
  neo4j_data:
    name: nyra_neo4j_data
    driver: local
  neo4j_logs:
    name: nyra_neo4j_logs
    driver: local

services:
  # ==========================================================================
  # FalkorDB - Temporal knowledge graphs and graph database
  # ==========================================================================
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${FALKORDB_PASSWORD:-falkordb_secure_pass}
      --appendonly yes
      --appendfsync ${FALKORDB_AOF_SYNC:-everysec}
      --maxmemory ${FALKORDB_MAX_MEMORY:-4gb}
    environment:
      REDIS_PASSWORD: ${FALKORDB_PASSWORD:-falkordb_secure_pass}
    volumes:
      - falkordb_data:/data
    ports:
      - "${FALKORDB_PORT:-6381}:6379"
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${FALKORDB_PASSWORD:-falkordb_secure_pass}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ==========================================================================
  # Qdrant - Vector database for embeddings
  # ==========================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__API_KEY: ${QDRANT_API_KEY:-qdrant_secure_key}
      QDRANT__SERVICE__GRPC_PORT: 6334
      QDRANT__STORAGE__STORAGE_PATH: /qdrant/storage
      QDRANT__ALLOW_RECOVERY_MODE: "true"
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
      - "6334:6334"  # GRPC port
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 1 bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ==========================================================================
  # Neo4j - Graph database for knowledge graphs
  # ==========================================================================
  neo4j:
    image: neo4j:5-community
    container_name: nyra-neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_secure_pass}
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_memory_pagecache_size=2G
      - NEO4J_dbms_memory_heap_max__size=2G
    ports:
      - "${NEO4J_HTTP_PORT:-7474}:7474"
      - "${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
