version: '3.9'

services:
  nyra-crm-api:
    build:
      context: ./services/crm-api
      dockerfile: Dockerfile
    image: nyra-crm-api:latest
    container_name: nyra-crm-api
    env_file:
      - .env.crm-api
    ports:
      - '4001:4001'
    depends_on:
      - twenty-crm
    networks:
      - nyra

networks:
  nyra:
    external: true
