services:
  openclaw-mvp:
    build:
      context: ..
      dockerfile: infra/openclaw/Dockerfile
    image: ${OPENCLAW_MVP_IMAGE:-nyra/openclaw-mvp:local}
    container_name: nyra-openclaw-mvp
    profiles: ["openclaw", "voice"]
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      MEM0_API_KEY: ${MEM0_API_KEY:?set MEM0_API_KEY}
      OPENCLAW_CONFIG_FILE: /etc/openclaw/config.cloud.json
    ports:
      - "127.0.0.1:${OPENCLAW_MVP_PORT:-3401}:3400"
    volumes:
      - ./openclaw/config.cloud.json:/etc/openclaw/config.cloud.json:ro
      - ./data/openclaw/mvp:/home/node/.openclaw
    restart: unless-stopped
    networks: [nyra]

  kyutai-unmute-cloud:
    image: ${UNMUTE_IMAGE:-ghcr.io/kyutai-labs/unmute:latest}
    container_name: nyra-kyutai-unmute-cloud
    profiles: ["voice"]
    environment:
      UNMUTE_OPENAI_API_KEY: ${UNMUTE_OPENAI_API_KEY:?set UNMUTE_OPENAI_API_KEY}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      UNMUTE_MODEL_PROVIDER: ${UNMUTE_MODEL_PROVIDER:-openai}
      UNMUTE_MODE: cloud
    ports:
      - "127.0.0.1:${UNMUTE_HOST_PORT:-8098}:8080"
    restart: unless-stopped
    networks: [nyra]
