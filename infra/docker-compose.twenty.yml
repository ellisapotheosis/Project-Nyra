version: '3.8'

# TwentyCRM Integration Profile for Nexus Stack
# This compose file integrates TwentyCRM with the existing Nyra infrastructure

services:
  # TwentyCRM Database
  twenty-db:
    image: postgres:16-alpine
    container_name: nyra-twenty-db
    env_file:
      - ../apps/twenty-crm/.env.twenty
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: twenty
      POSTGRES_PASSWORD: ${TWENTY_DB_PASSWORD:-twenty_secure_password}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
      - ../apps/twenty-crm/scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5433:5432"
    networks:
      - nexus-network
      - twenty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty -d twenty"]
      interval: 30s
      timeout: 10s
      retries: 5
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=database"

  # TwentyCRM Redis
  twenty-redis:
    image: redis:7-alpine
    container_name: nyra-twenty-redis
    env_file:
      - ../apps/twenty-crm/.env.twenty
    command: redis-server --requirepass ${TWENTY_REDIS_PASSWORD:-redis_secure_password}
    volumes:
      - twenty_redis_data:/data
    ports:
      - "6380:6379"
    networks:
      - nexus-network
      - twenty-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${TWENTY_REDIS_PASSWORD:-redis_secure_password}", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=cache"

  # TwentyCRM Application
  twenty-crm:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-crm
    env_file:
      - ../apps/twenty-crm/.env.twenty
    environment:
      # Database Configuration
      PG_DATABASE_URL: postgresql://twenty:${TWENTY_DB_PASSWORD:-twenty_secure_password}@twenty-db:5432/twenty
      REDIS_URL: redis://:${TWENTY_REDIS_PASSWORD:-redis_secure_password}@twenty-redis:6379

      # App Configuration
      SERVER_URL: ${TWENTY_SERVER_URL:-http://localhost:3020}
      FRONT_BASE_URL: ${TWENTY_FRONT_BASE_URL:-http://localhost:3020}
      PORT: 3000

      # Authentication & Security
      ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET}
      LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET}
      FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET}

      # Nyra Integration
      NYRA_NEXUS_ROUTER_URL: http://nexus-router:6000
      NYRA_WEBHOOK_SECRET: ${TWENTY_WEBHOOK_SECRET}
      NYRA_INTEGRATION_ENABLED: true
      
      # External Integrations
      SUPPORT_CHAT_ENABLED: false
      TELEMETRY_ENABLED: false

      # Email Configuration
      EMAIL_FROM_ADDRESS: ${EMAIL_FROM_ADDRESS:-noreply@nyra.com}
      EMAIL_SYSTEM_ADDRESS: ${EMAIL_SYSTEM_ADDRESS:-system@nyra.com}
      EMAIL_DRIVER: ${EMAIL_DRIVER:-logger}

      # File Storage
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage

      # API Configuration
      API_RATE_LIMITING_TTL: ${API_RATE_LIMITING_TTL:-100}
      API_RATE_LIMITING_REQUEST_COUNT: ${API_RATE_LIMITING_REQUEST_COUNT:-100}

      # Production Settings
      DEBUG_MODE: ${DEBUG_MODE:-false}
      SIGN_IN_PREFILLED: ${SIGN_IN_PREFILLED:-false}
      IS_MULTIWORKSPACE_ENABLED: false

      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3008,http://localhost:3000}

    ports:
      - "3020:3000"
    volumes:
      - twenty_storage:/app/storage
      - ../apps/twenty-crm/config/twenty.env:/app/.env:ro
    networks:
      - nexus-network
      - twenty-network
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=application"
      - "traefik.enable=true"
      - "traefik.http.routers.twenty-crm.rule=Host(`crm.nyra.local`)"
      - "traefik.http.services.twenty-crm.loadbalancer.server.port=3000"

  # TwentyCRM Worker
  twenty-worker:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty-worker
    env_file:
      - ../apps/twenty-crm/.env.twenty
    command: ["npm", "run", "worker:start"]
    environment:
      PG_DATABASE_URL: postgresql://twenty:${TWENTY_DB_PASSWORD:-twenty_secure_password}@twenty-db:5432/twenty
      REDIS_URL: redis://:${TWENTY_REDIS_PASSWORD:-redis_secure_password}@twenty-redis:6379
      ACCESS_TOKEN_SECRET: ${TWENTY_ACCESS_TOKEN_SECRET}
      LOGIN_TOKEN_SECRET: ${TWENTY_LOGIN_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${TWENTY_REFRESH_TOKEN_SECRET}
      FILE_TOKEN_SECRET: ${TWENTY_FILE_TOKEN_SECRET}
      STORAGE_TYPE: local
      STORAGE_LOCAL_PATH: /app/storage

      # Nyra Integration
      NYRA_NEXUS_ROUTER_URL: http://nexus-router:6000
      NYRA_WEBHOOK_SECRET: ${TWENTY_WEBHOOK_SECRET}



    volumes:
      - twenty_storage:/app/storage:rw
    networks:
      - nexus-network
      - twenty-network
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    restart: unless-stopped
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=worker"

  # TwentyCRM MCP Server (Manual setup for now)
  twenty-mcp-server:
    image: node:20-alpine
    container_name: nyra-twenty-mcp-server
    working_dir: /app
    command: ["sh", "-c", "npm install && npm start"]
    environment:
      TWENTY_CRM_URL: http://twenty-crm:3000
      TWENTY_CRM_API_KEY: ${TWENTY_CRM_API_KEY}
      TWENTY_CRM_WORKSPACE_ID: ${TWENTY_CRM_WORKSPACE_ID:-default}
      MCP_SERVER_PORT: 3022
      NODE_ENV: ${NODE_ENV:-production}
    ports:
      - "3022:3022"
    volumes:
      - ../services/twenty-crm-mcp-server:/app:ro
      - twenty_mcp_data:/app/data
    networks:
      - nexus-network
      - twenty-network
    depends_on:
      twenty-crm:
        condition: service_healthy
    restart: unless-stopped
    profiles:
      - mcp-server
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=mcp-server"

volumes:
  twenty_db_data:
    driver: local
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=database"

  twenty_redis_data:
    driver: local
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=cache"

  twenty_storage:
    driver: local
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=storage"

  twenty_mcp_data:
    driver: local
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=mcp-server"

networks:
  twenty-network:
    driver: bridge
    labels:
      - "nyra.service=twenty-crm"
      - "nyra.component=network"

  nexus-network:
    external: true
    name: nexus-network
