name: default
steps:
  - type: load_files
    options:
      include: ['**/*.md','**/*.txt','**/*.pdf']
  - type: clean_text
  - type: chunk
    options:
      size: 1200
      overlap: 180
  - type: embed
    options:
      provider: openai
      model: text-embedding-3-small
      env_key: OPENAI_API_KEY
  - type: upsert
    options:
      storage_profile: qdrant
