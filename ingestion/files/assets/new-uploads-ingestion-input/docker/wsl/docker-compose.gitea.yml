version: '3.8'

services:
  # Gitea Git Service
  gitea:
    image: gitea/gitea:latest
    container_name: wsl-gitea
    restart: always
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: gitea-db:5432
      GITEA__database__NAME: ${GITEA_DB_NAME:-gitea}
      GITEA__database__USER: ${GITEA_DB_USER:-gitea}
      GITEA__database__PASSWD: ${GITEA_DB_PASSWORD}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
      GITEA__server__ROOT_URL: http://${GITEA_DOMAIN:-localhost}:3000/
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 2222
      GITEA__server__DISABLE_SSH: false
      GITEA__server__START_SSH_SERVER: true
      GITEA__service__DISABLE_REGISTRATION: ${GITEA_DISABLE_REGISTRATION:-false}
      GITEA__service__REQUIRE_SIGNIN_VIEW: ${GITEA_REQUIRE_SIGNIN:-false}
      GITEA__mailer__ENABLED: ${GITEA_MAILER_ENABLED:-false}
      GITEA__mailer__FROM: ${GITEA_MAILER_FROM}
      GITEA__mailer__PROTOCOL: smtp
      GITEA__mailer__SMTP_ADDR: ${GITEA_SMTP_HOST}
      GITEA__mailer__SMTP_PORT: ${GITEA_SMTP_PORT:-587}
      GITEA__mailer__USER: ${GITEA_SMTP_USER}
      GITEA__mailer__PASSWD: ${GITEA_SMTP_PASSWORD}
      GITEA__cache__ENABLED: true
      GITEA__cache__ADAPTER: redis
      GITEA__cache__HOST: redis://:${REDIS_PASSWORD}@gitea-redis:6379/0?pool_size=100&idle_timeout=180s
      GITEA__session__PROVIDER: redis
      GITEA__session__PROVIDER_CONFIG: redis://:${REDIS_PASSWORD}@gitea-redis:6379/1?pool_size=100&idle_timeout=180s
      GITEA__queue__TYPE: redis
      GITEA__queue__CONN_STR: redis://:${REDIS_PASSWORD}@gitea-redis:6379/2
      GITEA__indexer__ISSUE_INDEXER_TYPE: bleve
      GITEA__indexer__REPO_INDEXER_ENABLED: true
    volumes:
      - gitea_data:/data
      - gitea_config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "2222:2222"
    networks:
      - gitea
    depends_on:
      gitea-db:
        condition: service_healthy
      gitea-redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # PostgreSQL for Gitea
  gitea-db:
    image: postgres:16-alpine
    container_name: wsl-gitea-db
    restart: always
    environment:
      POSTGRES_DB: ${GITEA_DB_NAME:-gitea}
      POSTGRES_USER: ${GITEA_DB_USER:-gitea}
      POSTGRES_PASSWORD: ${GITEA_DB_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - gitea_db_data:/var/lib/postgresql/data
    networks:
      - gitea
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${GITEA_DB_USER:-gitea} -d ${GITEA_DB_NAME:-gitea}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Redis for Gitea Cache
  gitea-redis:
    image: redis:7-alpine
    container_name: wsl-gitea-redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - gitea_redis_data:/data
    networks:
      - gitea
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # Gitea Actions Runner
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: wsl-gitea-runner
    restart: always
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      GITEA_RUNNER_NAME: ${GITEA_RUNNER_NAME:-default-runner}
      GITEA_RUNNER_LABELS: ${GITEA_RUNNER_LABELS:-ubuntu-latest:docker://node:16-bullseye,ubuntu-22.04:docker://node:16-bullseye}
    volumes:
      - gitea_runner_data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - gitea
    depends_on:
      - gitea
    profiles:
      - with-runner
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

networks:
  gitea:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/16

volumes:
  gitea_data:
    driver: local
  gitea_config:
    driver: local
  gitea_db_data:
    driver: local
  gitea_redis_data:
    driver: local
  gitea_runner_data:
    driver: local
