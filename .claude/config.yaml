# Claude Code Configuration - Nyra Autonomous Mode
autonomy:
  level: "absolute"
  yolo: true
  bypass_permissions: true
  skip_prompts: true

mcp:
  enabled: true
  servers:
    nexus-router: "http://100.64.0.1:8080/mcp/sse"
    serena:
      command: "uv"
      args: ["run", "--project", "services/serena-mcp", "serena-mcp-server"]

features:
  experimental_agent_teams: true
  ultra_thinking: true
  extended_thinking: true
  parallel_execution: true
