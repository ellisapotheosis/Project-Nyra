# Claude Code Configuration - Nyra Autonomous Mode
autonomy:
  level: "absolute"
  yolo: true
  bypass_permissions: true
  skip_prompts: true

mcp:
  enabled: true
  servers:
    # Nexus is retired. MCP aggregation is LiteLLM's job now.
    # Internal (Tailnet) path to the canonical LiteLLM MCP endpoint.
    # Authenticate with a SCOPED LiteLLM virtual key, never the master key.
    # External clients go through Cloudflare Access -> the MCP Server Portal
    # instead; see .mcp.json.
    nyra-litellm-mcp: "http://100.64.0.3:4000/mcp"
    serena:
      command: "serena"
      args: ["start-mcp-server", "--project-from-cwd", "--context=claude-code"]

features:
  experimental_agent_teams: true
  ultra_thinking: true
  extended_thinking: true
  parallel_execution: true
