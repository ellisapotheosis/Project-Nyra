# ==============================================================================
# WSL Configuration for AI Development Orchestrator (Windows 11 + WSL 2)
# ==============================================================================
# Optimized for:
# - Docker Desktop (WSL 2 backend)
# - AI/LLM development (Claude Code, MCP servers)
# - Cloudflare tunneling
# - Tailscale networking (4-PC LAN orchestration)
# - Service hosting (Nexus Router, LiteLLM, etc.)
# - High-performance file I/O
#
# Installation: sudo cp this_file /etc/wsl.conf && wsl --shutdown
# ==============================================================================

[boot]
# Enable systemd for service management (CRITICAL for Docker, Tailscale, Cloudflared)
systemd=true

# Boot commands - runs as root on WSL startup
# Uncomment and customize as needed:
# command="service docker start"

[automount]
# Enable automatic mounting of Windows drives
enabled=true

# Mount Windows drives with Linux filesystem metadata
# This enables proper git, docker, and file permissions
root=/mnt/

# Optimal options for AI development:
# - metadata: Enables Linux file permissions on NTFS
# - umask=22: Default directory permissions (755 = rwxr-xr-x)
# - fmask=11: Default file permissions (644 = rw-r--r--)
# - case=off: Case-insensitive for Windows compatibility
options="metadata,umask=22,fmask=11,case=off"

# Mount /etc/fstab entries
mountFsTab=true

[network]
# Generate /etc/hosts automatically
generateHosts=true

# DNS resolution strategy:
# - true: Auto-generate /etc/resolv.conf (recommended for Tailscale/Cloudflare)
# - false: Use custom DNS config (if you have specific DNS needs)
# Change to true for automatic DNS, or keep false if you have custom DNS setup
generateResolvConf=true

# Set custom hostname for this orchestrator node
hostname=nyra-orchestrator

[interop]
# Enable Windows/Linux interoperability
enabled=true

# Add Windows PATH to Linux PATH (allows running Windows executables)
appendWindowsPath=true

[user]
# Default user on WSL startup
default=ellisapotheosis

[filesystem]
# Default file creation mask (022 = rw-r--r-- for files, rwxr-xr-x for directories)
umask=022

# ==============================================================================
# PERFORMANCE TUNING NOTES
# ==============================================================================
#
# 1. Memory Management (.wslconfig in C:\Users\YourUser\.wslconfig):
#    [wsl2]
#    memory=16GB              # Allocate sufficient RAM for LLMs
#    processors=8             # CPU cores for parallel processing
#    swap=8GB                 # Swap space for large models
#    localhostForwarding=true # Forward ports from WSL to Windows
#    nestedVirtualization=true # Enable if using VMs inside WSL
#
# 2. Docker Desktop Integration:
#    - Docker Desktop → Settings → Resources → WSL Integration
#    - Enable integration with Ubuntu distro
#    - Docker daemon will run via systemd
#
# 3. Tailscale Setup:
#    sudo tailscale up --accept-routes --advertise-routes=192.168.1.0/24
#
# 4. Cloudflared Tunnel:
#    sudo cloudflared service install <token>
#    systemctl enable --now cloudflared
#
# 5. MCP Server Ports:
#    Ensure no conflicts: 3000, 4000, 6000, 8000-8010, etc.
#    Check with: sudo netstat -tulpn | grep LISTEN
#
# 6. File I/O Performance:
#    - Store code in /home (WSL native filesystem) - FAST
#    - Access Windows files via /mnt/c - SLOWER but necessary
#    - Use WSL native fs for Docker volumes, node_modules, .git
#
# 7. GPU Access (if using CUDA for LLMs):
#    - Install NVIDIA drivers on Windows
#    - WSL 2 automatically passes through GPU
#    - Verify with: nvidia-smi
#
# ==============================================================================
