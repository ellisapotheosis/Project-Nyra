# --- Serena global config for all projects ---
record_tool_usage_stats: true            # collect usage stats (helpful)  
dashboard_port: ${DASHBOARD_PORT}        # e.g., 24282  
log_level: INFO                          # could be DEBUG for deeper tracing  
default_transport: "stdio"              # or "streamable-http" if preferred  
default_port: ${MCP_SERVER_PORT}        # e.g., 9121  

# allowed tools – by default all core tools enabled; you can disable some if you want  
# Be mindful: execute_shell_command is powerful and should only be enabled if you trust usage  
included_optional_tools:
  - execute_shell_command
  - write_memory
  - delete_memory

# read-only default for new projects, but you will override per-project  
default_read_only: true               

# Define contexts default behaviour  
contexts:
  ide-assistant:
    description: "Optimised for IDE integrations (VSCode, Cursor etc.)"
    allowed_tools: "all"              # you can restrict here if needed
  desktop-app:
    description: "For desktop apps like Claude Desktop or browser flows"
    allowed_tools: "all"

# Of you want to disable the dashboard, you can add:
# dashboard_enabled: false
