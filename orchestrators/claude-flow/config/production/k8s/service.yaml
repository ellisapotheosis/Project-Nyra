apiVersion: v1
kind: Service
metadata:
  name: claude-flow
  labels:
    app: claude-flow
    environment: production
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: http
    protocol: TCP
    name: http
  selector:
    app: claude-flow
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 10800
