# Oracle VPS Deployment Configuration for Nyra Webapp Backend
# API endpoints, authentication, and mortgage calculation services
---
apiVersion: v1
kind: Service
metadata:
  name: nyra-webapp-backend
  labels:
    app: nyra-backend
    tier: api
    environment: production
spec:
  # Service type
  type: web
  ports:
    - port: 8000
      protocol: http
      name: api

  # Deployment configuration
  deployment:
    # Build configuration
    build:
      # Build from source (recommended for free tier)
      type: git
      git:
        repository: "https://github.com/your-org/project-nyra"
        branch: "main"
        workDir: "services/webapp-backend"

      # Build settings
      builder: dockerfile
      dockerfile: ./Dockerfile
      buildArgs:
        - NODE_ENV=production

    # Runtime configuration
    runtime:
      command: ["npm", "start"]
      workingDir: /app

    # Resource allocation (Free tier compatible)
    resources:
      cpu: "0.5"          # 0.5 vCPU
      memory: "512Mi"     # 512 MB RAM
      disk: "2Gi"         # 2 GB disk

    # Scaling configuration
    scaling:
      min: 1              # Minimum instances
      max: 1              # Maximum instances (free tier)
      type: fixed

    # Health checks
    healthCheck:
      httpGet:
        path: /api/health
        port: 8000
      initialDelaySeconds: 30
      periodSeconds: 15
      timeoutSeconds: 5
      failureThreshold: 3
      successThreshold: 1

    # Readiness probe
    readinessProbe:
      httpGet:
        path: /api/ready
        port: 8000
      initialDelaySeconds: 10
      periodSeconds: 5

    # Environment variables (Infisical-managed)
    env:
      # Application Configuration
      - name: NODE_ENV
        value: "production"
      - name: PORT
        value: "8000"
      - name: API_VERSION
        value: "v1"
      - name: LOG_LEVEL
        value: "info"

      # CORS Configuration
      - name: CORS_ORIGIN
        value: "https://nyra.com,https://*.nyra.com"
      - name: CORS_CREDENTIALS
        value: "true"

      # Database Configuration (from Infisical)
      - name: DATABASE_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: DATABASE_URL
      - name: DATABASE_POOL_MIN
        value: "2"
      - name: DATABASE_POOL_MAX
        value: "10"

      # Redis Configuration (from Infisical)
      - name: REDIS_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: REDIS_URL
      - name: REDIS_PREFIX
        value: "nyra:"

      # Authentication (from Infisical)
      - name: JWT_SECRET
        valueFrom:
          secret:
            name: infisical-secrets
            key: JWT_SECRET
      - name: JWT_EXPIRY
        value: "24h"
      - name: REFRESH_TOKEN_EXPIRY
        value: "7d"

      # API Keys (from Infisical)
      - name: ANTHROPIC_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: ANTHROPIC_API_KEY
      - name: OPENAI_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: OPENAI_API_KEY

      # External Services (from Infisical)
      - name: SENDGRID_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: SENDGRID_API_KEY
      - name: TWILIO_ACCOUNT_SID
        valueFrom:
          secret:
            name: infisical-secrets
            key: TWILIO_ACCOUNT_SID
      - name: TWILIO_AUTH_TOKEN
        valueFrom:
          secret:
            name: infisical-secrets
            key: TWILIO_AUTH_TOKEN

      # n8n Webhook Integration
      - name: N8N_WEBHOOK_URL
        value: "https://n8n.nyra.oracle-vps.ratehunter.net/webhook"
      - name: N8N_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_API_KEY

      # Mortgage Calculation Configuration
      - name: RATE_API_URL
        valueFrom:
          secret:
            name: infisical-secrets
            key: MORTGAGE_RATE_API_URL
      - name: RATE_API_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: MORTGAGE_RATE_API_KEY
      - name: RATE_CACHE_TTL
        value: "3600"        # 1 hour cache

      # Monitoring and Observability
      - name: SENTRY_DSN
        valueFrom:
          secret:
            name: infisical-secrets
            key: SENTRY_DSN
      - name: SENTRY_ENVIRONMENT
        value: "production"
      - name: SENTRY_TRACES_SAMPLE_RATE
        value: "0.1"

      # Feature Flags
      - name: FEATURE_LEAD_CAPTURE
        value: "true"
      - name: FEATURE_RATE_ALERTS
        value: "true"
      - name: FEATURE_AI_CHAT
        value: "true"

    # Volume mounts
    volumes:
      - name: logs
        mountPath: /app/logs
        size: "1Gi"
      - name: uploads
        mountPath: /app/uploads
        size: "1Gi"

    # Deployment strategy
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 0

  # Networking
  networking:
    # Custom domains
    domains:
      - name: api.nyra.oracle-vps.ratehunter.net
        type: custom
      - name: backend.nyra.com
        type: custom
        primary: true

    # TLS/SSL
    tls:
      enabled: true
      provider: letsencrypt
      minVersion: "1.2"

    # Rate limiting (application-level)
    rateLimit:
      enabled: true
      requestsPerMinute: 100
      burst: 20

  # Regions
  regions:
    - was  # Washington, D.C.

  # Auto-sleep disabled for production API
  autoSleep:
    enabled: false

---
# API Endpoints Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: api-routes-config
data:
  routes.json: |
    {
      "public": [
        {"path": "/api/health", "method": "GET"},
        {"path": "/api/ready", "method": "GET"},
        {"path": "/api/v1/rates/current", "method": "GET"},
        {"path": "/api/v1/leads", "method": "POST"},
        {"path": "/api/v1/auth/login", "method": "POST"},
        {"path": "/api/v1/auth/register", "method": "POST"}
      ],
      "authenticated": [
        {"path": "/api/v1/quotes", "method": "POST"},
        {"path": "/api/v1/quotes/:id", "method": "GET"},
        {"path": "/api/v1/leads/:id", "method": "GET"},
        {"path": "/api/v1/leads/:id", "method": "PUT"},
        {"path": "/api/v1/appointments", "method": "POST"},
        {"path": "/api/v1/user/profile", "method": "GET"},
        {"path": "/api/v1/user/profile", "method": "PUT"}
      ],
      "webhooks": [
        {"path": "/api/v1/webhooks/n8n", "method": "POST"},
        {"path": "/api/v1/webhooks/rate-update", "method": "POST"},
        {"path": "/api/v1/webhooks/lead-scored", "method": "POST"}
      ]
    }

---
# Mortgage Lead Drip Campaign Integration
apiVersion: v1
kind: ConfigMap
metadata:
  name: campaign-integration-config
data:
  campaigns.json: |
    {
      "lead_lifecycle": {
        "stages": [
          {
            "name": "new_lead",
            "webhook": "/api/v1/webhooks/lead-captured",
            "n8n_workflow": "lead-capture-webhook",
            "actions": ["enrich", "score", "assign"]
          },
          {
            "name": "nurturing",
            "webhook": "/api/v1/webhooks/lead-nurturing",
            "n8n_workflow": "mortgage-nurture-drip",
            "schedule": "daily_9am",
            "actions": ["send_email", "update_score", "check_engagement"]
          },
          {
            "name": "qualified",
            "webhook": "/api/v1/webhooks/lead-qualified",
            "n8n_workflow": "appointment-scheduler",
            "actions": ["book_consultation", "assign_loan_officer"]
          },
          {
            "name": "rate_alert",
            "webhook": "/api/v1/webhooks/rate-alert",
            "n8n_workflow": "rate-change-notification",
            "trigger": "rate_drop",
            "actions": ["notify_lead", "create_opportunity"]
          }
        ]
      },
      "email_templates": {
        "welcome": "nyra-welcome-email",
        "rate_alert": "nyra-rate-alert",
        "consultation_booking": "nyra-consultation-confirm",
        "education_content": "nyra-mortgage-education"
      },
      "scoring_rules": {
        "website_visit": 10,
        "rate_calculator_use": 25,
        "email_open": 5,
        "email_click": 15,
        "consultation_booking": 100
      }
    }
