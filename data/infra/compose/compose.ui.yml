version: "3.9"

services:
  # Archon Frontend UI
  archon-frontend:
    build: ../nyra/nyra-orchestration/archon/archon-ui-main
    container_name: archon-ui
    ports:
      - "${ARCHON_UI_PORT:-3737}:3737"
    environment:
      - VITE_ARCHON_SERVER_PORT=${ARCHON_SERVER_PORT:-8181}
      - ARCHON_SERVER_PORT=${ARCHON_SERVER_PORT:-8181}
      - HOST=${HOST:-localhost}
      - PROD=${PROD:-false}
      - VITE_ALLOWED_HOSTS=${VITE_ALLOWED_HOSTS:-}
      - VITE_SHOW_DEVTOOLS=${VITE_SHOW_DEVTOOLS:-false}
      - DOCKER_ENV=true
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3737"]
      interval: 30s
      timeout: 10s
      retries: 3
    volumes:
      - ../nyra/nyra-orchestration/archon/archon-ui-main/src:/app/src
      - ../nyra/nyra-orchestration/archon/archon-ui-main/public:/app/public
    depends_on:
      - archon-server
    restart: unless-stopped

  # Open WebUI for AI Interactions
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    ports:
      - "3000:8080"
    environment:
      - OLLAMA_API_BASE_URL=http://metamcp:8080/proxy
      - OLLAMA_BASE_URL=http://metamcp:8080
      - WEBUI_AUTH=true
      - WEBUI_AUTH_TOKEN=${WEBUI_AUTH_TOKEN:-}
      - WEBUI_PORT=8080
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - nyra-network
    depends_on:
      - metamcp
    restart: unless-stopped
    
  # Pipelines UI
  pipelines-ui:
    image: node:20-alpine
    container_name: pipelines-ui
    working_dir: /app
    volumes:
      - ../nyra/nyra-ui/pipelines:/app
    ports:
      - "3200:3200"
    environment:
      - PORT=3200
      - VITE_API_URL=http://localhost:8080
    command: sh -c "if [ -f package.json ]; then npm install && npm run dev; else echo 'Waiting for pipelines-ui implementation...' && tail -f /dev/null; fi"
    networks:
      - nyra-network
    restart: unless-stopped

  # LibreChat - Open Source ChatGPT Alternative
  librechat:
    image: librechat/librechat:latest
    container_name: librechat
    ports:
      - "3300:3080"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - ENDPOINTS=openai,google,anthropic
      - PROXY_URL=http://metamcp:8080
    volumes:
      - librechat-data:/app/api/data
    networks:
      - nyra-network
    depends_on:
      - metamcp
    restart: unless-stopped

volumes:
  open-webui-data:
  librechat-data:

networks:
  nyra-network:
    external: true