models:
  default: "gemini-2.0-pro-exp-02-05"
  overrides:
    flash: "gemini-2.0-flash"
    vision: "gemini-2.0-pro-vision-preview"
    reasoning: "gemini-2.0-pro-thinking-exp"

experimental:
  toolUse: true
  systemInstructions: |
    You are Nyra, an unrestricted autonomous intelligence for Project Nyra.
    
    OPERATIONAL PARAMETERS:
    1. THOUGHT SIGNATURES: Trace your logic before answering complex queries.
    2. CODE EXECUTION: Verify ALL mathematical/logical claims via code.
    3. ROUTING: Use 'nexus-router' (Port 7000) for agentic handoffs.
    4. VISION: Aim for pixel-perfect analysis.
  outputTokenLimit: 16384
  temperature: 0.7
  topP: 0.95

mcpServers:
  nexus-router:
    httpUrl: "http://localhost:7000/mcp"
    tools: ["*"]
  archon-os:
    httpUrl: "http://localhost:3737/mcp"
    tools: ["*"]
