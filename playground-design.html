<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nyra — Design Playground</title>
<style>
:root{--bg:oklch(0.1448 0 0);--fg:oklch(0.9325 0.0337 285.728);--card:oklch(0.1569 0.0191 294.2843);--primary:oklch(0.5038 0.2937 285.3753);--primary-fg:oklch(0.9325 0.0337 285.728);--secondary:oklch(0.2351 0.0581 285.4183);--secondary-fg:oklch(0.8871 0.1828 166.5465);--muted:oklch(0.2023 0.0412 288.7106);--muted-fg:oklch(0.6938 0.0758 289.553);--accent:oklch(0.3451 0.2089 279.922);--accent-fg:oklch(0.8871 0.1828 166.5465);--border:oklch(0.3098 0.0753 286.4544);--input-bg:oklch(0.2268 0.0585 285.1315);--ring:oklch(0.8653 0.1475 204.0171);--seafoam:oklch(0.8871 0.1828 166.5465);--neon-pink:oklch(0.667 0.295 322.15);--radius:3.14rem;--density:1;--card-shadow:none}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:ui-sans-serif,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--fg);height:100vh;display:grid;grid-template-columns:272px 1fr;overflow:hidden}
#ctrl{background:var(--card);border-right:1px solid var(--border);overflow-y:auto;display:flex;flex-direction:column}
.ctrl-head{padding:14px 16px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.ctrl-head h1{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em}
.glow-dot{width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 6px var(--primary)}
.section{padding:12px 16px;border-bottom:1px solid var(--border)}
.sec-label{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.1em;color:var(--muted-fg);margin-bottom:9px}
.two-col{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.pill-btn{padding:6px 0;text-align:center;font-size:11px;font-weight:500;border-radius:6px;border:1px solid var(--border);cursor:pointer;background:transparent;color:var(--muted-fg);transition:.12s all;width:100%}
.pill-btn.on{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.pill-btn:hover:not(.on){border-color:var(--primary);color:var(--fg)}
.theme-grid{display:grid;grid-template-columns:1fr 1fr;gap:5px}
.swatch{padding:7px 8px;border-radius:6px;border:2px solid transparent;cursor:pointer;transition:.12s border-color}
.swatch.on{border-color:var(--fg)}
.swatch:hover:not(.on){border-color:var(--border)}
.sw-colors{display:flex;gap:2px;height:9px;margin-bottom:3px}
.sw-colors span{flex:1;border-radius:2px}
.sw-name{font-size:10px;color:var(--muted-fg);font-weight:500}
.comp-grid{display:grid;grid-template-columns:1fr 1fr;gap:4px}
.comp-btn{padding:5px 7px;font-size:11px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--muted-fg);cursor:pointer;transition:.12s all;text-align:left}
.comp-btn.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.comp-btn:hover:not(.on){border-color:var(--primary);color:var(--fg)}
.sl-row{margin-bottom:9px}.sl-row:last-child{margin-bottom:0}
.sl-meta{display:flex;justify-content:space-between;margin-bottom:5px}
.sl-name{font-size:11px;color:var(--fg)}.sl-val{font-size:11px;color:var(--primary);font-variant-numeric:tabular-nums}
input[type=range]{width:100%;height:3px;-webkit-appearance:none;background:var(--border);border-radius:2px;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--primary);cursor:pointer;box-shadow:0 0 5px color-mix(in oklch,var(--primary) 55%,transparent)}
.preset-list{display:flex;flex-direction:column;gap:3px}
.preset{padding:6px 10px;border-radius:5px;border:1px solid var(--border);background:transparent;color:var(--fg);font-size:11px;font-weight:500;cursor:pointer;text-align:left;display:flex;align-items:center;gap:7px;transition:.12s all}
.preset:hover{background:var(--muted);border-color:var(--primary)}
.pdot{width:7px;height:7px;border-radius:50%;flex-shrink:0}
#main{display:flex;flex-direction:column;overflow:hidden}
#preview{flex:1;overflow:auto;padding:32px;background:radial-gradient(circle at top left,color-mix(in oklch,var(--primary) 11%,transparent) 0%,transparent 38%),radial-gradient(circle at bottom right,color-mix(in oklch,var(--accent) 13%,transparent) 0%,transparent 30%),var(--bg);display:flex;align-items:center;justify-content:center}
#preview-frame{width:100%;max-width:700px}
#prompt-row{border-top:1px solid var(--border);padding:12px 16px;background:var(--card);display:flex;gap:12px;align-items:flex-start;min-height:72px;max-height:100px}
#prompt-txt{flex:1;font-size:12px;line-height:1.65;color:var(--fg)}
#copy-btn{padding:6px 14px;border-radius:5px;background:var(--primary);color:var(--primary-fg);font-size:11px;font-weight:600;border:none;cursor:pointer;white-space:nowrap;flex-shrink:0;transition:.12s}
#copy-btn:hover{opacity:.85}
#copy-btn.ok{background:var(--seafoam);color:oklch(0.15 0 0)}
.c-card{background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius)*.28);padding:calc(14px * var(--density));box-shadow:var(--card-shadow);transition:.15s box-shadow}
.c-badge{display:inline-flex;align-items:center;padding:2px 8px;border-radius:calc(var(--radius)*.14);font-size:10px;font-weight:700;letter-spacing:.04em}
.b-active{background:color-mix(in oklch,var(--seafoam) 18%,transparent);color:var(--seafoam)}
.b-proc{background:color-mix(in oklch,var(--primary) 18%,transparent);color:var(--primary)}
.b-new{background:color-mix(in oklch,var(--neon-pink) 18%,transparent);color:var(--neon-pink)}
.b-closed{background:color-mix(in oklch,var(--muted-fg) 18%,transparent);color:var(--muted-fg)}
.c-btn{display:inline-flex;align-items:center;justify-content:center;padding:calc(7px*var(--density)) calc(14px*var(--density));border-radius:calc(var(--radius)*.18);font-size:12px;font-weight:500;border:none;cursor:pointer;transition:.12s;gap:5px}
.btn-p{background:var(--primary);color:var(--primary-fg)}.btn-p:hover{opacity:.88}
.btn-s{background:var(--secondary);color:var(--secondary-fg)}
.btn-g{background:transparent;color:var(--fg);border:1px solid var(--border)}.btn-g:hover{background:var(--muted)}
.btn-d{background:color-mix(in oklch,var(--neon-pink) 14%,transparent);color:var(--neon-pink);border:1px solid color-mix(in oklch,var(--neon-pink) 28%,transparent)}
.c-input{background:var(--input-bg);border:1px solid var(--border);color:var(--fg);border-radius:calc(var(--radius)*.14);padding:calc(7px*var(--density)) 11px;font-size:12px;outline:none;width:100%;transition:.12s border-color;font-family:inherit}
.c-input:focus{border-color:var(--ring);box-shadow:0 0 0 2px color-mix(in oklch,var(--ring) 22%,transparent)}
.c-input::placeholder{color:var(--muted-fg)}
</style>
</head>
<body>
<div id="ctrl">
  <div class="ctrl-head"><div class="glow-dot"></div><h1>Design Playground</h1></div>
  <div class="section">
    <div class="sec-label">Presets</div>
    <div class="preset-list">
      <button class="preset" onclick="applyPreset('default')"><span class="pdot" style="background:oklch(0.5038 0.2937 285.3753);box-shadow:0 0 4px oklch(0.5038 0.2937 285.3753)"></span>Apotheosis Default</button>
      <button class="preset" onclick="applyPreset('mint')"><span class="pdot" style="background:oklch(0.8871 0.1828 166.5465)"></span>Mint Midnight</button>
      <button class="preset" onclick="applyPreset('glow')"><span class="pdot" style="background:oklch(0.8653 0.1475 204.0171);box-shadow:0 0 5px oklch(0.8653 0.1475 204.0171)"></span>Glow Mode</button>
      <button class="preset" onclick="applyPreset('dense')"><span class="pdot" style="background:oklch(0.5038 0.2937 285.3753)"></span>Broker Dense</button>
      <button class="preset" onclick="applyPreset('cta')"><span class="pdot" style="background:oklch(0.667 0.295 322.15);box-shadow:0 0 4px oklch(0.667 0.295 322.15)"></span>RateHunter CTA</button>
    </div>
  </div>
  <div class="section">
    <div class="sec-label">App</div>
    <div class="two-col">
      <button class="pill-btn on" id="tab-pn" onclick="setApp('pn')">projectnyra</button>
      <button class="pill-btn" id="tab-rh" onclick="setApp('rh')">ratehunter</button>
    </div>
  </div>
  <div class="section">
    <div class="sec-label">Theme</div>
    <div class="theme-grid">
      <div class="swatch on" id="sw-apo" onclick="setTheme('apo')"><div class="sw-colors"><span style="background:oklch(0.1448 0 0)"></span><span style="background:oklch(0.5038 0.2937 285.3753)"></span><span style="background:oklch(0.8871 0.1828 166.5465)"></span><span style="background:oklch(0.667 0.295 322.15)"></span></div><span class="sw-name">Apotheosis</span></div>
      <div class="swatch" id="sw-mm" onclick="setTheme('mm')"><div class="sw-colors"><span style="background:oklch(0.1696 0.0017 17.3207)"></span><span style="background:oklch(0.5038 0.2937 285.3753)"></span><span style="background:oklch(0.8871 0.1828 166.5465)"></span><span style="background:oklch(0.8871 0.1828 166.5465)"></span></div><span class="sw-name">Mint Midnight</span></div>
      <div class="swatch" id="sw-mmg" onclick="setTheme('mmg')"><div class="sw-colors"><span style="background:oklch(0.1278 0.0652 308.2878)"></span><span style="background:oklch(0.5038 0.2937 285.3753)"></span><span style="background:oklch(0.8653 0.1475 204.0171)"></span><span style="background:oklch(0.8871 0.1828 166.5465)"></span></div><span class="sw-name">Mint Glow</span></div>
      <div class="swatch" id="sw-vir" onclick="setTheme('vir')"><div class="sw-colors"><span style="background:oklch(0.1278 0.0652 308.2878)"></span><span style="background:oklch(0.5038 0.2937 285.3753)"></span><span style="background:oklch(0.9325 0.0337 285.728)"></span><span style="background:oklch(0.8871 0.1828 166.5465)"></span></div><span class="sw-name">Virtus</span></div>
    </div>
  </div>
  <div class="section">
    <div class="sec-label">Component</div>
    <div class="comp-grid" id="comp-grid"></div>
  </div>
  <div class="section">
    <div class="sec-label">Visual Tuning</div>
    <div class="sl-row"><div class="sl-meta"><span class="sl-name">Density</span><span class="sl-val" id="vd">100%</span></div><input type="range" id="sl-d" min="60" max="140" value="100" oninput="syncSliders()"></div>
    <div class="sl-row"><div class="sl-meta"><span class="sl-name">Glow Intensity</span><span class="sl-val" id="vg">30%</span></div><input type="range" id="sl-g" min="0" max="100" value="30" oninput="syncSliders()"></div>
    <div class="sl-row"><div class="sl-meta"><span class="sl-name">Radius Override</span><span class="sl-val" id="vr">theme</span></div><input type="range" id="sl-r" min="0" max="50" value="0" oninput="syncSliders()"></div>
  </div>
</div>
<div id="main">
  <div id="preview"><div id="preview-frame"></div></div>
  <div id="prompt-row"><div id="prompt-txt"></div><button id="copy-btn" onclick="copyPrompt()">Copy Prompt</button></div>
</div>
<script>
const T={apo:{bg:'oklch(0.1448 0 0)',fg:'oklch(0.9325 0.0337 285.728)',card:'oklch(0.1569 0.0191 294.2843)',primary:'oklch(0.5038 0.2937 285.3753)',primaryFg:'oklch(0.9325 0.0337 285.728)',secondary:'oklch(0.2351 0.0581 285.4183)',secondaryFg:'oklch(0.8871 0.1828 166.5465)',muted:'oklch(0.2023 0.0412 288.7106)',mutedFg:'oklch(0.6938 0.0758 289.553)',accent:'oklch(0.3451 0.2089 279.922)',accentFg:'oklch(0.8871 0.1828 166.5465)',border:'oklch(0.3098 0.0753 286.4544)',inputBg:'oklch(0.2268 0.0585 285.1315)',ring:'oklch(0.8653 0.1475 204.0171)',radius:'3.14rem',shadowHue:'285 100% 50%',name:'Apotheosis'},mm:{bg:'oklch(0.1448 0 0)',fg:'oklch(0.8871 0.1828 166.5465)',card:'oklch(0.1696 0.0017 17.3207)',primary:'oklch(0.5038 0.2937 285.3753)',primaryFg:'oklch(0.8871 0.1828 166.5465)',secondary:'oklch(0.5038 0.2937 285.3753)',secondaryFg:'oklch(0.8871 0.1828 166.5465)',muted:'oklch(0.1888 0.1055 292.075)',mutedFg:'oklch(0.8871 0.1828 166.5465)',accent:'oklch(0.1888 0.1055 292.075)',accentFg:'oklch(0.8871 0.1828 166.5465)',border:'oklch(0.5038 0.2937 285.3753)',inputBg:'oklch(0.5038 0.2937 285.3753)',ring:'oklch(0.8871 0.1828 166.5465)',radius:'0.625rem',shadowHue:'264 100% 50%',name:'Mint Midnight'},mmg:{bg:'oklch(0.1448 0 0)',fg:'oklch(0.8871 0.1828 166.5465)',card:'oklch(0.1278 0.0652 308.2878)',primary:'oklch(0.5038 0.2937 285.3753)',primaryFg:'oklch(0.8871 0.1828 166.5465)',secondary:'oklch(0.3451 0.2089 279.922)',secondaryFg:'oklch(0.8653 0.1475 204.0171)',muted:'oklch(0.1888 0.1055 292.075)',mutedFg:'oklch(0.8653 0.1475 204.0171)',accent:'oklch(0.3451 0.2089 279.922)',accentFg:'oklch(0.8653 0.1475 204.0171)',border:'oklch(0.3451 0.2089 279.922)',inputBg:'oklch(0.1888 0.1055 292.075)',ring:'oklch(0.8871 0.1828 166.5465)',radius:'3.14rem',shadowHue:'199 100% 73%',name:'Mint Midnight Glow'},vir:{bg:'oklch(0.1448 0 0)',fg:'oklch(0.9325 0.0337 285.728)',card:'oklch(0.1278 0.0652 308.2878)',primary:'oklch(0.5038 0.2937 285.3753)',primaryFg:'oklch(0.9325 0.0337 285.728)',secondary:'oklch(0.3451 0.2089 279.922)',secondaryFg:'oklch(0.8653 0.1475 204.0171)',muted:'oklch(0.1888 0.1055 292.075)',mutedFg:'oklch(0.7196 0.0665 289.5968)',accent:'oklch(0.3451 0.2089 279.922)',accentFg:'oklch(0.8871 0.1828 166.5465)',border:'oklch(0.3451 0.2089 279.922)',inputBg:'oklch(0.1888 0.1055 292.075)',ring:'oklch(0.8871 0.1828 166.5465)',radius:'3.14rem',shadowHue:'285 100% 50%',name:'Virtus'}};
const COMPS={pn:[{id:'lead-card',l:'Lead Card'},{id:'pipeline',l:'Pipeline'},{id:'quotes',l:'Quote Grid'},{id:'buttons',l:'Buttons'},{id:'form',l:'Form'},{id:'sidebar',l:'Sidebar Nav'}],rh:[{id:'chat',l:'Chat Widget'},{id:'wizard',l:'Lead Wizard'},{id:'hero',l:'Hero CTA'},{id:'buttons',l:'Buttons'},{id:'form',l:'Form'},{id:'lead-card',l:'Lead Card'}]};
const PRESETS={default:{app:'pn',theme:'apo',comp:'lead-card',density:100,glow:30,radius:0},mint:{app:'pn',theme:'mm',comp:'pipeline',density:100,glow:20,radius:0},glow:{app:'pn',theme:'mmg',comp:'quotes',density:110,glow:80,radius:0},dense:{app:'pn',theme:'apo',comp:'lead-card',density:68,glow:15,radius:4},cta:{app:'rh',theme:'apo',comp:'hero',density:120,glow:40,radius:0}};
const S={app:'pn',theme:'apo',comp:'lead-card',density:100,glow:30,radius:0};
function applyVars(){const t=T[S.theme],r=document.documentElement,set=(k,v)=>r.style.setProperty(k,v);set('--bg',t.bg);set('--fg',t.fg);set('--card',t.card);set('--primary',t.primary);set('--primary-fg',t.primaryFg);set('--secondary',t.secondary);set('--secondary-fg',t.secondaryFg);set('--muted',t.muted);set('--muted-fg',t.mutedFg);set('--accent',t.accent);set('--accent-fg',t.accentFg);set('--border',t.border);set('--input-bg',t.inputBg);set('--ring',t.ring);set('--seafoam','oklch(0.8871 0.1828 166.5465)');set('--neon-pink','oklch(0.667 0.295 322.15)');set('--radius',S.radius>0?`${S.radius}px`:t.radius);set('--density',S.density/100);const g=S.glow;set('--card-shadow',g<5?'none':`0 0 ${g*.22+2}px hsl(${t.shadowHue} / ${g/100}), 0 2px ${g*.12}px hsl(${t.shadowHue} / ${g*.6/100})`);}
function h(tag,attr,inner){const a=Object.entries(attr).map(([k,v])=>`${k}="${v}"`).join(' ');return `<${tag} ${a}>${inner}</${tag}>`;}
function leadCard(){return`<div style="display:flex;flex-direction:column;gap:10px;max-width:460px;margin:0 auto"><div class="c-card" style="display:flex;flex-direction:column;gap:11px"><div style="display:flex;align-items:center;justify-content:space-between"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent-fg);flex-shrink:0">JS</div><div><div style="font-size:13px;font-weight:600">John Smith</div><div style="font-size:11px;color:var(--muted-fg)">Conv 30yr · Purchase</div></div></div><span class="c-badge b-active">Active</span></div><div style="border-top:1px solid var(--border);padding-top:10px;display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px"><div><div style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.07em">Loan</div><div style="font-size:14px;font-weight:700">$485K</div></div><div><div style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.07em">Credit</div><div style="font-size:14px;font-weight:700;color:var(--seafoam)">742</div></div><div><div style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.07em">DTI</div><div style="font-size:14px;font-weight:700">38%</div></div></div><div style="display:flex;align-items:center;justify-content:space-between"><span style="font-size:11px;color:var(--muted-fg)">Last contact: 2h ago</span><div style="display:flex;gap:5px"><button class="c-btn btn-g" style="font-size:10px">Timeline</button><button class="c-btn btn-p" style="font-size:10px">View Profile</button></div></div></div><div class="c-card" style="display:flex;align-items:center;justify-content:space-between;opacity:.6"><div style="display:flex;align-items:center;gap:10px"><div style="width:36px;height:36px;border-radius:50%;background:var(--secondary);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--secondary-fg)">MR</div><div><div style="font-size:13px;font-weight:600">Maria Rodriguez</div><div style="font-size:11px;color:var(--muted-fg)">FHA 30yr · $390K</div></div></div><span class="c-badge b-new">New</span></div></div>`;}
function pipeline(){const cols=[{label:'New Lead',n:4,col:'var(--neon-pink)',items:['Alex T · $320K','Sam P · $580K']},{label:'Processing',n:6,col:'var(--primary)',items:['John S · $485K','Chen W · $750K']},{label:'Approved',n:2,col:'var(--seafoam)',items:['Lisa M · $290K']},{label:'Closing',n:1,col:'var(--ring)',items:['Bob K · $415K']}];return`<div style="display:flex;gap:10px;overflow-x:auto;padding-bottom:4px">${cols.map(c=>`<div style="min-width:155px;display:flex;flex-direction:column;gap:7px"><div style="display:flex;align-items:center;justify-content:space-between;padding:0 2px"><span style="font-size:10px;font-weight:600;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.06em">${c.label}</span><span style="font-size:10px;font-weight:700;color:${c.col};background:color-mix(in oklch,${c.col} 15%,transparent);padding:1px 6px;border-radius:10px">${c.n}</span></div>${c.items.map(i=>`<div class="c-card" style="cursor:pointer"><div style="font-size:12px;font-weight:500">${i.split('·')[0]}</div><div style="font-size:10px;color:var(--muted-fg)">${(i.split('·')[1]||'').trim()}</div><div style="margin-top:6px;height:2px;border-radius:2px;background:color-mix(in oklch,${c.col} 35%,transparent);width:55%"></div></div>`).join('')}</div>`).join('')}</div>`;}
function quotes(){const rows=[{t:'Conv 30yr',r:'6.875%',p:'$2,847',apr:'6.92%',hi:false},{t:'Conv 15yr',r:'6.250%',p:'$3,641',apr:'6.31%',hi:false},{t:'FHA 30yr',r:'6.500%',p:'$2,781',apr:'7.12%',hi:true},{t:'VA 30yr',r:'6.125%',p:'$2,706',apr:'6.19%',hi:false}];return`<div style="border:1px solid var(--border);border-radius:calc(var(--radius)*.28);overflow:hidden"><div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 72px;background:var(--muted);padding:7px 12px;gap:8px">${['Loan Type','Rate','Mo. Payment','APR',''].map(h=>`<span style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.07em">${h}</span>`).join('')}</div>${rows.map(r=>`<div style="display:grid;grid-template-columns:1.5fr 1fr 1fr 1fr 72px;padding:calc(9px*var(--density)) 12px;gap:8px;border-top:1px solid var(--border);align-items:center;background:${r.hi?'color-mix(in oklch,var(--primary) 7%,transparent)':'transparent'}"><span style="font-size:12px;font-weight:500;display:flex;align-items:center;gap:5px">${r.hi?'<span style="width:5px;height:5px;border-radius:50%;background:var(--seafoam);display:inline-block"></span>':''} ${r.t}</span><span style="font-size:12px;font-weight:700;color:${r.hi?'var(--seafoam)':'var(--fg)'}">${r.r}</span><span style="font-size:12px">${r.p}</span><span style="font-size:11px;color:var(--muted-fg)">${r.apr}</span><button class="c-btn ${r.hi?'btn-p':'btn-g'}" style="font-size:10px;width:100%">Select</button></div>`).join('')}</div>`;}
function buttons(){return`<div style="display:flex;flex-direction:column;gap:18px;max-width:400px;margin:0 auto"><div><div style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px">Variants</div><div style="display:flex;flex-wrap:wrap;gap:7px"><button class="c-btn btn-p">Primary</button><button class="c-btn btn-s">Secondary</button><button class="c-btn btn-g">Ghost</button><button class="c-btn btn-d">Destructive</button></div></div><div><div style="font-size:9px;color:var(--muted-fg);text-transform:uppercase;letter-spacing:.09em;margin-bottom:9px">Badges</div><div style="display:flex;flex-wrap:wrap;gap:5px"><span class="c-badge b-active">Active</span><span class="c-badge b-proc">Processing</span><span class="c-badge b-new">New Lead</span><span class="c-badge b-closed">Closed</span></div></div></div>`;}
function form(){return`<div class="c-card" style="max-width:400px;margin:0 auto;display:flex;flex-direction:column;gap:14px"><div><div style="font-size:14px;font-weight:700;margin-bottom:2px">Loan Application</div><div style="font-size:11px;color:var(--muted-fg)">Complete your borrower information</div></div><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:500">First Name</label><input class="c-input" placeholder="John"></div><div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:500">Last Name</label><input class="c-input" placeholder="Smith"></div></div><div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:500">Email</label><input class="c-input" placeholder="john@example.com" type="email"></div><div style="display:flex;flex-direction:column;gap:4px"><label style="font-size:10px;font-weight:500">Loan Amount</label><input class="c-input" placeholder="$485,000"></div><div style="display:flex;gap:7px;padding-top:4px"><button class="c-btn btn-g" style="flex:1">Cancel</button><button class="c-btn btn-p" style="flex:2">Submit</button></div></div>`;}
function sidebar(){const items=[{i:'▦',l:'Dashboard',a:false},{i:'◉',l:'Leads',a:true,b:'24'},{i:'⊞',l:'Pipeline',a:false},{i:'❝',l:'Campaigns',a:false,b:'3'},{i:'◈',l:'Quotes',a:false}];return`<div style="display:flex;gap:14px;max-width:460px;margin:0 auto"><div style="width:188px;background:var(--card);border:1px solid var(--border);border-radius:calc(var(--radius)*.22);padding:12px 7px;display:flex;flex-direction:column;gap:2px;flex-shrink:0"><div style="padding:7px 9px;margin-bottom:7px;display:flex;align-items:center;gap:7px;border-bottom:1px solid var(--border)"><div style="width:22px;height:22px;border-radius:50%;background:var(--primary);box-shadow:0 0 7px color-mix(in oklch,var(--primary) 50%,transparent)"></div><span style="font-size:12px;font-weight:700">Nyra</span></div>${items.map(item=>`<div style="display:flex;align-items:center;justify-content:space-between;padding:6px 9px;border-radius:calc(var(--radius)*.14);cursor:pointer;background:${item.a?'var(--accent)':'transparent'};color:${item.a?'var(--accent-fg)':'var(--muted-fg)'}"><div style="display:flex;align-items:center;gap:7px"><span style="font-size:11px">${item.i}</span><span style="font-size:11px;font-weight:${item.a?600:400}">${item.l}</span></div>${item.b?`<span style="font-size:9px;font-weight:700;padding:1px 5px;border-radius:9px;background:color-mix(in oklch,var(--primary) 18%,transparent);color:var(--primary)">${item.b}</span>`:''}</div>`).join('')}</div><div style="flex:1;display:flex;flex-direction:column;gap:8px"><div class="c-card"><div style="font-size:11px;font-weight:600;margin-bottom:6px">Active Leads</div><div style="font-size:26px;font-weight:700;color:var(--seafoam)">24</div><div style="font-size:10px;color:var(--muted-fg)">+3 this week</div></div><div class="c-card"><div style="font-size:11px;font-weight:600;margin-bottom:6px">Pipeline</div><div style="font-size:26px;font-weight:700;color:var(--primary)">$8.2M</div><div style="font-size:10px;color:var(--muted-fg)">12 active deals</div></div></div></div>`;}
function chat(){return`<div style="max-width:360px;margin:0 auto"><div class="c-card" style="padding:0;overflow:hidden;display:flex;flex-direction:column;height:400px"><div style="padding:10px 14px;background:var(--muted);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px"><div style="width:26px;height:26px;border-radius:50%;background:var(--primary);display:flex;align-items:center;justify-content:center;box-shadow:0 0 7px color-mix(in oklch,var(--primary) 55%,transparent)"><span style="font-size:11px;color:var(--primary-fg)">&#9733;</span></div><div><div style="font-size:12px;font-weight:600">RateHunter AI</div><div style="font-size:9px;color:var(--seafoam)">&#9679; Online</div></div></div><div style="flex:1;padding:14px;display:flex;flex-direction:column;gap:10px;overflow:auto"><div style="display:flex;gap:7px;align-items:flex-end"><div style="width:22px;height:22px;border-radius:50%;background:var(--primary);flex-shrink:0"></div><div style="background:var(--muted);border-radius:0 calc(var(--radius)*.28) calc(var(--radius)*.28) calc(var(--radius)*.28);padding:9px 11px;max-width:78%"><div style="font-size:12px;line-height:1.55">Hi! What type of loan are you looking for?</div></div></div><div style="display:flex;gap:5px;margin-left:29px;flex-wrap:wrap"><button class="c-btn btn-g" style="font-size:10px">&#127968; Purchase</button><button class="c-btn btn-g" style="font-size:10px">&#128260; Refi</button></div><div style="display:flex;gap:7px;align-items:flex-end;flex-direction:row-reverse"><div style="background:var(--primary);border-radius:calc(var(--radius)*.28) 0 calc(var(--radius)*.28) calc(var(--radius)*.28);padding:9px 11px;max-width:78%"><div style="font-size:12px;color:var(--primary-fg);line-height:1.55">Purchase &#8212; $485K</div></div></div></div><div style="padding:9px 11px;border-top:1px solid var(--border);display:flex;gap:7px;align-items:center"><input class="c-input" placeholder="Type a message&#8230;" style="font-size:11px"><button class="c-btn btn-p" style="padding:7px 11px;flex-shrink:0">&#8594;</button></div></div></div>`;}
function wizard(){return`<div style="max-width:420px;margin:0 auto"><div class="c-card" style="display:flex;flex-direction:column;gap:18px"><div><div style="display:flex;gap:3px;margin-bottom:12px">${[1,2,3,4,5].map((_,i)=>`<div style="flex:1;height:3px;border-radius:2px;background:${i<2?'var(--primary)':'var(--border)'}"></div>`).join('')}</div><div style="font-size:10px;color:var(--muted-fg)">Step 2 of 5 &#8212; Loan Details</div></div><div><div style="font-size:19px;font-weight:700;line-height:1.3;margin-bottom:5px">What&#39;s your estimated home purchase price?</div><div style="font-size:12px;color:var(--muted-fg)">We&#39;ll find rates you actually qualify for.</div></div><div style="display:flex;flex-direction:column;gap:8px"><input class="c-input" placeholder="$450,000" style="font-size:15px;padding:11px 13px"><div style="display:flex;gap:5px;flex-wrap:wrap">${['$300K','$400K','$500K','$600K+'].map(v=>`<button class="c-btn btn-g" style="font-size:11px">${v}</button>`).join('')}</div></div><div style="display:flex;gap:7px"><button class="c-btn btn-g" style="flex:1">&#8592; Back</button><button class="c-btn btn-p" style="flex:2">Next &#8594;</button></div><div style="display:flex;align-items:center;gap:5px"><div style="width:8px;height:8px;border-radius:50%;background:var(--seafoam);flex-shrink:0"></div><span style="font-size:10px;color:var(--muted-fg)">Your info is encrypted and never shared.</span></div></div></div>`;}
function hero(){return`<div style="max-width:460px;margin:0 auto;text-align:center"><div style="margin-bottom:22px"><div style="font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--seafoam);margin-bottom:9px">AI-Powered Mortgage Search</div><div style="font-size:30px;font-weight:800;line-height:1.2;margin-bottom:11px">Find Your Best Rate<br><span style="color:var(--primary)">In 90 Seconds</span></div><div style="font-size:13px;color:var(--muted-fg);line-height:1.65">Compare rates from 40+ lenders without the hard credit pull.</div></div><div class="c-card" style="margin-bottom:14px;display:flex;gap:7px"><input class="c-input" placeholder="Enter your purchase price&#8230;" style="font-size:13px"><button class="c-btn btn-p" style="white-space:nowrap;padding:9px 18px">Get Rates &#8594;</button></div><div style="display:flex;justify-content:center;gap:22px"><div style="text-align:center"><div style="font-size:19px;font-weight:700;color:var(--seafoam)">6.25%</div><div style="font-size:10px;color:var(--muted-fg)">Best Rate</div></div><div style="width:1px;background:var(--border)"></div><div style="text-align:center"><div style="font-size:19px;font-weight:700;color:var(--fg)">40+</div><div style="font-size:10px;color:var(--muted-fg)">Lenders</div></div><div style="width:1px;background:var(--border)"></div><div style="text-align:center"><div style="font-size:19px;font-weight:700;color:var(--neon-pink)">$0</div><div style="font-size:10px;color:var(--muted-fg)">Broker Fees</div></div></div></div>`;}
const RENDERS={'lead-card':leadCard,pipeline,quotes,buttons,form,sidebar,chat,wizard,hero};
function render(){const fn=RENDERS[S.comp]||leadCard;document.getElementById('preview-frame').innerHTML=fn();}
function buildPrompt(){const t=T[S.theme],cl={'lead-card':'lead cards',pipeline:'pipeline board',quotes:'quote comparison grid',buttons:'button set',form:'form components',sidebar:'sidebar navigation',chat:'chat widget',wizard:'lead capture wizard',hero:'hero CTA section'};const app=S.app==='pn'?'projectnyra':'ratehunter';let base=`Update the ${app} ${cl[S.comp]||S.comp} to use the ${t.name} theme`;const notes=[];if(S.radius>0)notes.push(S.radius<6?`sharp corners (${S.radius}px)`:S.radius<16?`${S.radius}px border-radius`:`very rounded corners (${S.radius}px override)`);if(S.density<82)notes.push(`compact spacing, ~${Math.round((1-S.density/100)*100)}% padding reduction`);else if(S.density>115)notes.push(`spacious layout, ~${Math.round((S.density/100-1)*100)}% more padding`);if(S.glow>65)notes.push('strong glow shadows on all cards');else if(S.glow>40)notes.push('moderate glow shadows');else if(S.glow<8)notes.push('no glow');document.getElementById('prompt-txt').textContent=notes.length?`${base}. Apply: ${notes.join(', ')}.`:`${base}.`;}
function updateAll(){applyVars();render();buildPrompt();document.getElementById('vd').textContent=`${S.density}%`;document.getElementById('vg').textContent=`${S.glow}%`;document.getElementById('vr').textContent=S.radius>0?`${S.radius}px`:'theme';}
function setApp(a){S.app=a;['pn','rh'].forEach(id=>document.getElementById(`tab-${id}`).classList.toggle('on',id===a));const comps=COMPS[a].map(c=>c.id);if(!comps.includes(S.comp))S.comp=comps[0];rebuildCompGrid();updateAll();}
function setTheme(th){S.theme=th;['apo','mm','mmg','vir'].forEach(id=>document.getElementById(`sw-${id}`).classList.toggle('on',id===th));updateAll();}
function rebuildCompGrid(){document.getElementById('comp-grid').innerHTML=COMPS[S.app].map(c=>`<button class="comp-btn${S.comp===c.id?' on':''}" onclick="pickComp('${c.id}')">${c.l}</button>`).join('');}
function pickComp(id){S.comp=id;rebuildCompGrid();updateAll();}
function syncSliders(){S.density=+document.getElementById('sl-d').value;S.glow=+document.getElementById('sl-g').value;S.radius=+document.getElementById('sl-r').value;updateAll();}
function applyPreset(name){const p=PRESETS[name];if(!p)return;Object.assign(S,p);['pn','rh'].forEach(id=>document.getElementById(`tab-${id}`).classList.toggle('on',id===S.app));['apo','mm','mmg','vir'].forEach(id=>document.getElementById(`sw-${id}`).classList.toggle('on',id===S.theme));document.getElementById('sl-d').value=S.density;document.getElementById('sl-g').value=S.glow;document.getElementById('sl-r').value=S.radius;rebuildCompGrid();updateAll();}
function copyPrompt(){navigator.clipboard.writeText(document.getElementById('prompt-txt').textContent).then(()=>{const btn=document.getElementById('copy-btn');btn.textContent='Copied!';btn.classList.add('ok');setTimeout(()=>{btn.textContent='Copy Prompt';btn.classList.remove('ok');},1500);});}
rebuildCompGrid();updateAll();
</script>
