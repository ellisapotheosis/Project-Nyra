# -----------------------------------------------------------------------------
# 🚀 PROJECT NYRA: MAXIMALIST WSL CONFIGURATION
# -----------------------------------------------------------------------------
[boot]
# ENABLE SYSTEMD
# Critical for Docker, Snap, and background daemons (like Claude-Flow).
systemd = true

# CLEANUP & MOUNTING
# Clears tmp and ensures mounts are shared for container visibility.
command = "mount --make-shared /"

[automount]
# HIGH PERFORMANCE FILE SYSTEM
# 'metadata' fixes permission issues between Windows/Linux.
# 'noatime' speeds up file access by not writing "read" timestamps.
enabled = true
root = /mnt/
options = "metadata,uid=1000,gid=1000,umask=022,fmask=11,case=off,noatime"
mountFsTab = true

[network]
# DNS LOCK (Critical for your specific Setup)
# Prevents WSL from overwriting your custom 1.1.1.1 DNS settings on reboot.
generateResolvConf = false

# HOSTNAME SYNC
# Keeps your Linux hostname consistent with Windows.
hostname = Project-Nyra-Node-01

[interop]
# WINDOWS INTEGRATION
# Allows launching Windows binaries (code.exe, explorer.exe) from Linux.
enabled = true

# PATH CLEANLINESS
# Set to 'false' to speed up WSL boot time (removes Windows PATHs),
# but keep 'true' if you use VS Code Remote.
appendWindowsPath = true

[user]
# DEFAULT USER
default = ellisapotheosis
