# Project Nyra - PC4 GPU Worker 3
# Services: Ruvector Follower 2, n8n, Activepieces, Business Services (Quote, Campaign, Orchestrator)

version: '3.9'

networks:
  nyra:
    driver: bridge
    ipam:
      config:
        - subnet: 172.31.0.0/16

volumes:
  ruvector_data:
  n8n_data:
  activepieces_postgres_data:
  activepieces_redis_data:

services:
  # ============================================================================
  # RUVECTOR - Distributed Vector Database (Follower Node 2)
  # ============================================================================
  ruvector:
    image: ruvnet/ruvector:latest
    container_name: nyra-ruvector-follower2-pc4
    hostname: ruvector-follower2
    restart: unless-stopped
    ports:
      - "6370:6370"
      - "6371:6371"
      - "6372:6372"
    volumes:
      - ruvector_data:/data
    environment:
      - RUVECTOR_NODE_ID=follower2
      - RUVECTOR_NODE_IP=10.0.0.4
      - RUVECTOR_CLUSTER_ID=nyra-cluster
      - RUVECTOR_RAFT_PORT=6370
      - RUVECTOR_PEERS=10.0.0.2:6370,10.0.0.3:6370
      - RUVECTOR_LEADER=false
    networks:
      nyra:
        ipv4_address: 172.31.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6370/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # N8N - Workflow Automation
  # ============================================================================
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n-pc4
    hostname: n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./configs/n8n/workflows:/workflows:ro
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://localhost:5678
      - GENERIC_TIMEZONE=America/Los_Angeles
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=admin
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD:-change_me_password}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY:-change-me-32-char-encryption-key}
    networks:
      nyra:
        ipv4_address: 172.31.0.30
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ACTIVEPIECES - Integration Platform
  # ============================================================================
  activepieces_postgres:
    image: postgres:15-alpine
    container_name: nyra-activepieces-postgres-pc4
    hostname: activepieces-postgres
    restart: unless-stopped
    volumes:
      - activepieces_postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=activepieces
      - POSTGRES_USER=activepieces
      - POSTGRES_PASSWORD=${ACTIVEPIECES_POSTGRES_PASSWORD:-activepieces_secure_password}
    networks:
      nyra:
        ipv4_address: 172.31.0.41
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U activepieces"]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces-pc4
    hostname: activepieces
    restart: unless-stopped
    ports:
      - "3400:3400"
    volumes:
      - ./configs/activepieces:/app/configs:ro
    environment:
      - AP_POSTGRES_DATABASE=postgresql://activepieces:${ACTIVEPIECES_POSTGRES_PASSWORD:-activepieces_password}@activepieces_postgres:5432/activepieces
      - AP_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY:-change-me-32-char-encryption-key}
      - AP_JWT_SECRET=${ACTIVEPIECES_JWT_SECRET:-change-me-jwt-secret}
    networks:
      nyra:
        ipv4_address: 172.31.0.42
    depends_on:
      - activepieces_postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3400/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # QUOTE ENGINE - Mortgage Quote Calculation Service
  # ============================================================================
  quote_engine:
    build:
      context: ../services/quote-engine
      dockerfile: Dockerfile
    container_name: nyra-quote-engine-pc4
    hostname: quote-engine
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - QUOTE_ENGINE_PORT=8001
      - POSTGRES_URL=postgresql://nyra:${POSTGRES_PASSWORD}@10.0.0.3:5432/nyra
      - RUVECTOR_URL=http://10.0.0.2:6370
    networks:
      nyra:
        ipv4_address: 172.31.0.50
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # CAMPAIGN ENGINE - Drip Campaign Management
  # ============================================================================
  campaign_engine:
    build:
      context: ../services/campaign-engine
      dockerfile: Dockerfile
    container_name: nyra-campaign-engine-pc4
    hostname: campaign-engine
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - CAMPAIGN_ENGINE_PORT=8002
      - POSTGRES_URL=postgresql://nyra:${POSTGRES_PASSWORD}@10.0.0.3:5432/nyra
      - RUVECTOR_URL=http://10.0.0.2:6370
      - N8N_API_URL=http://n8n:5678/api/v1
      - TWENTYCRM_API_URL=http://10.0.0.3:3000/graphql
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.31.0.22
    depends_on:
      - n8n
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NYRA ORCHESTRATOR - Compliance & Workflow Coordination
  # ============================================================================
  orchestrator:
    build:
      context: ../services/orchestrator
      dockerfile: Dockerfile
    container_name: nyra-orchestrator-pc4
    hostname: orchestrator
    restart: unless-stopped
    ports:
      - "8010:8010"
    volumes:
      - ./configs/orchestrator:/app/config:ro
    environment:
      - ORCHESTRATOR_PORT=8010
      - QUOTE_ENGINE_URL=http://quote_engine:8001
      - CAMPAIGN_ENGINE_URL=http://campaign_engine:8002
      - TWENTYCRM_URL=http://10.0.0.3:3000
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.31.0.40
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: nyra-node-exporter-pc4
    hostname: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      nyra:
        ipv4_address: 172.31.0.100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
