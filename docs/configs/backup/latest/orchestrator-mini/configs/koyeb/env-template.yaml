# Environment Variable Template for Koyeb Deployments
# Integrates with Infisical for secret management
# Documentation: https://www.koyeb.com/docs/deploy/environment-variables
---
apiVersion: v1
kind: Secret
metadata:
  name: infisical-secrets
  namespace: nyra-production
  annotations:
    infisical.com/sync-enabled: "true"
    infisical.com/project-id: "${INFISICAL_PROJECT_ID}"
    infisical.com/environment: "production"
    infisical.com/secret-path: "/koyeb"
type: Opaque

# Secret keys mapping (pulled from Infisical)
data:
  # Database Configuration
  DATABASE_URL: "${INFISICAL_DATABASE_URL}"
  DATABASE_POOL_MIN: "2"
  DATABASE_POOL_MAX: "10"

  # n8n Database
  N8N_DB_TYPE: "postgresdb"
  N8N_DB_HOST: "${INFISICAL_N8N_DB_HOST}"
  N8N_DB_PORT: "${INFISICAL_N8N_DB_PORT}"
  N8N_DB_DATABASE: "${INFISICAL_N8N_DB_DATABASE}"
  N8N_DB_USER: "${INFISICAL_N8N_DB_USER}"
  N8N_DB_PASSWORD: "${INFISICAL_N8N_DB_PASSWORD}"

  # n8n Security
  N8N_ENCRYPTION_KEY: "${INFISICAL_N8N_ENCRYPTION_KEY}"
  N8N_JWT_SECRET: "${INFISICAL_N8N_JWT_SECRET}"
  N8N_API_KEY: "${INFISICAL_N8N_API_KEY}"

  # Redis Cache
  REDIS_URL: "${INFISICAL_REDIS_URL}"
  REDIS_PASSWORD: "${INFISICAL_REDIS_PASSWORD}"

  # Authentication & Security
  JWT_SECRET: "${INFISICAL_JWT_SECRET}"
  JWT_EXPIRY: "24h"
  REFRESH_TOKEN_SECRET: "${INFISICAL_REFRESH_TOKEN_SECRET}"
  REFRESH_TOKEN_EXPIRY: "7d"
  SESSION_SECRET: "${INFISICAL_SESSION_SECRET}"

  # AI Service API Keys
  ANTHROPIC_API_KEY: "${INFISICAL_ANTHROPIC_API_KEY}"
  OPENAI_API_KEY: "${INFISICAL_OPENAI_API_KEY}"

  # Communication Services
  SENDGRID_API_KEY: "${INFISICAL_SENDGRID_API_KEY}"
  SENDGRID_FROM_EMAIL: "noreply@nyra.com"
  TWILIO_ACCOUNT_SID: "${INFISICAL_TWILIO_ACCOUNT_SID}"
  TWILIO_AUTH_TOKEN: "${INFISICAL_TWILIO_AUTH_TOKEN}"
  TWILIO_PHONE_NUMBER: "${INFISICAL_TWILIO_PHONE_NUMBER}"

  # Mortgage Rate API
  MORTGAGE_RATE_API_URL: "${INFISICAL_MORTGAGE_RATE_API_URL}"
  MORTGAGE_RATE_API_KEY: "${INFISICAL_MORTGAGE_RATE_API_KEY}"

  # CRM Integration
  HUBSPOT_API_KEY: "${INFISICAL_HUBSPOT_API_KEY}"
  HUBSPOT_PORTAL_ID: "${INFISICAL_HUBSPOT_PORTAL_ID}"

  # Monitoring & Observability
  SENTRY_DSN: "${INFISICAL_SENTRY_DSN}"
  SENTRY_AUTH_TOKEN: "${INFISICAL_SENTRY_AUTH_TOKEN}"
  DATADOG_API_KEY: "${INFISICAL_DATADOG_API_KEY}"

  # Cloud Storage
  AWS_ACCESS_KEY_ID: "${INFISICAL_AWS_ACCESS_KEY_ID}"
  AWS_SECRET_ACCESS_KEY: "${INFISICAL_AWS_SECRET_ACCESS_KEY}"
  AWS_S3_BUCKET: "${INFISICAL_AWS_S3_BUCKET}"
  AWS_REGION: "us-east-1"

---
# Infisical Agent Sidecar Configuration for Dynamic Secret Injection
apiVersion: v1
kind: ConfigMap
metadata:
  name: infisical-agent-config
  namespace: nyra-production
data:
  # Infisical Agent configuration
  agent-config.yaml: |
    # Infisical Agent Configuration
    infisical:
      # Authentication
      auth:
        type: machine-identity          # Recommended for production
        machine_identity:
          client_id: "${INFISICAL_CLIENT_ID}"
          client_secret: "${INFISICAL_CLIENT_SECRET}"

      # Project configuration
      project:
        id: "${INFISICAL_PROJECT_ID}"
        environment: "production"
        secret_path: "/koyeb"

      # Sync configuration
      sync:
        enabled: true
        interval: 60                    # Sync every 60 seconds
        on_startup: true

      # Secret management
      secrets:
        format: "env"                   # Environment variable format
        template_path: "/config/env-template.yaml"
        output_path: "/secrets/.env"

        # Secret rotation
        rotation:
          enabled: true
          check_interval: 3600          # Check every hour

      # Logging
      logging:
        level: "info"
        format: "json"

    # Agent sidecar deployment
    sidecar:
      image: "infisical/cli:latest"
      resources:
        cpu: "50m"                       # 0.05 vCPU
        memory: "50Mi"                   # 50 MB RAM

      # Mount paths
      volumes:
        - name: secrets
          mountPath: /secrets
        - name: config
          mountPath: /config

      # Lifecycle
      lifecycle:
        preStart:
          exec:
            command: ["/bin/sh", "-c", "infisical agent sync"]
        preStop:
          exec:
            command: ["/bin/sh", "-c", "infisical agent cleanup"]

---
# Environment-specific configurations
apiVersion: v1
kind: ConfigMap
metadata:
  name: environment-configs
data:
  # Production environment
  production.env: |
    NODE_ENV=production
    LOG_LEVEL=info
    CORS_ORIGIN=https://nyra.com,https://*.nyra.com
    RATE_LIMIT_ENABLED=true
    CACHE_ENABLED=true
    METRICS_ENABLED=true
    FEATURE_FLAGS_ENABLED=true

  # Staging environment
  staging.env: |
    NODE_ENV=staging
    LOG_LEVEL=debug
    CORS_ORIGIN=https://staging.nyra.com
    RATE_LIMIT_ENABLED=true
    CACHE_ENABLED=true
    METRICS_ENABLED=true
    FEATURE_FLAGS_ENABLED=true

  # Development environment
  development.env: |
    NODE_ENV=development
    LOG_LEVEL=debug
    CORS_ORIGIN=*
    RATE_LIMIT_ENABLED=false
    CACHE_ENABLED=false
    METRICS_ENABLED=false
    FEATURE_FLAGS_ENABLED=true

---
# Feature Flags Configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: feature-flags
data:
  flags.json: |
    {
      "lead_capture": {
        "enabled": true,
        "description": "Enable lead capture forms and webhooks"
      },
      "rate_alerts": {
        "enabled": true,
        "description": "Enable mortgage rate change alerts"
      },
      "ai_chat": {
        "enabled": true,
        "description": "Enable AI-powered chat support"
      },
      "appointment_booking": {
        "enabled": true,
        "description": "Enable online appointment booking"
      },
      "drip_campaigns": {
        "enabled": true,
        "description": "Enable automated email drip campaigns"
      },
      "sms_notifications": {
        "enabled": false,
        "description": "Enable SMS notifications (upgrade required)"
      },
      "advanced_analytics": {
        "enabled": false,
        "description": "Enable advanced analytics dashboard (pro tier)"
      }
    }

---
# Koyeb Secret References (for Koyeb CLI/API)
# These are injected during deployment via deploy-to-koyeb.sh script
#
# Usage with Koyeb CLI:
# koyeb secret create infisical-secrets \
#   --value "$(infisical secrets export --env production --format dotenv)"
#
# Or inject individual secrets:
# koyeb secret create DATABASE_URL --value "$DATABASE_URL"
# koyeb secret create JWT_SECRET --value "$JWT_SECRET"
# etc.
