# ===== GRAFBASE NEXUS ROUTER CONFIGURATION =====
# Single entry point for all MCP servers and LLM routing
# Handles fuzzy tool selection to minimize token usage

[server]
port = 6000
host = "0.0.0.0"
log_level = "info"
enable_cors = true

# ===== LLM ROUTING =====
[llm]
enabled = true

# Anthropic (Primary)
[[llm.providers]]
name = "anthropic"
type = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"
model = "claude-3-sonnet-20240229"
max_tokens = 4096

# LiteLLM (Fallback + Local Models)
[[llm.providers]]
name = "litellm"
type = "openai"
api_key = "sk-litellm-router"
base_url = "http://litellm:4000/v1"
models = [
  "vllm-mistral-area51",
  "vllm-mistral-3090ti",
  "ollama-mistral-3060",
  "ollama-embeddings-3060"
]

# OpenRouter (Fallback)
[[llm.providers]]
name = "openrouter"
type = "openai"
api_key = "${OPENROUTER_API_KEY}"
base_url = "https://openrouter.ai/api/v1"
models = [
  "openai/gpt-4-turbo",
  "anthropic/claude-3-sonnet"
]

# ===== MODEL ROUTING RULES =====
[model_routing]
# Tag-based routing to minimize inference cost + latency
default_provider = "litellm"

# Heavy reasoning → RTX 5090
[model_routing.heavy]
prompt_tokens_min = 1000
providers = ["litellm"]
model = "vllm-mistral-area51"
description = "Heavy reasoning, complex context (mortgage analysis, legal docs)"

# Code generation → RTX 3090Ti
[model_routing.code]
providers = ["litellm"]
model = "vllm-mistral-3090ti"
description = "Code generation, context window"

# Fast utility → RTX 3060 (Ollama)
[model_routing.fast]
providers = ["litellm"]
model = "ollama-mistral-3060"
description = "Fast inference, simple queries, drafting"

# Compliance decisions → Anthropic (highest reliability)
[model_routing.compliance]
providers = ["anthropic"]
model = "claude-3-sonnet-20240229"
description = "Loan compliance, regulatory decisions, audits"

# ===== MCP SERVER AGGREGATION =====
[mcp]
enable_mcp_aggregation = true
fuzzy_tool_selection = true
max_candidates = 10
similarity_threshold = 0.6
context_window_limit = 100000

# Docker Toolkit (Filesystem + GitHub access)
[[mcp.servers]]
name = "docker-toolkit"
type = "stdio"
command = "node"
args = ["/app/docker-mcp-toolkit.js"]
environment = { DOCKER_HOST = "unix:///var/run/docker.sock" }
description = "Host filesystem, Docker API, GitHub integration"
tools = [
  "file_read",
  "file_write",
  "directory_list",
  "github_push",
  "docker_build"
]
context = "development"  # Hidden from borrower-facing agents

# Claude-Flow (Self-referential agent orchestration)
[[mcp.servers]]
name = "claude-flow"
type = "http"
url = "http://claude-flow:8080/mcp"
description = "Development orchestrator, repo management"
context = "development"

# TwentyCRM Integration (System of Record)
[[mcp.servers]]
name = "twenty-crm"
type = "http"
url = "https://crm.ratehunter.net/mcp"
timeout = 30
auth = { type = "bearer", token = "${TWENTY_API_TOKEN}" }
description = "CRM operations: read/write leads, contacts, deals"
tools = [
  "lead_create",
  "lead_read",
  "lead_update",
  "contact_search",
  "deal_create"
]
context = "production"  # Available to all agents

# Activepieces (Workflow Execution)
[[mcp.servers]]
name = "activepieces"
type = "http"
url = "https://workflows.ratehunter.net/mcp"
timeout = 30
auth = { type = "bearer", token = "${ACTIVEPIECES_API_TOKEN}" }
description = "Workflow triggers, drip campaigns, SMS/email"
context = "production"

# Quote Engine (Mortgage Calculations)
[[mcp.servers]]
name = "quote-engine"
type = "http"
url = "https://quotes.ratehunter.net/api/v1"
timeout = 10
description = "Generate 3-option mortgage quotes, amortization"
tools = ["quote_generate", "quote_compare"]
context = "production"

# Mem0 (Borrower Memory)
[[mcp.servers]]
name = "mem0"
type = "http"
url = "http://oracle-mem0:9100/mcp"
timeout = 20
auth = { type = "bearer", token = "${MEM0_API_KEY}" }
description = "Borrower context memory (FICO, income, goals)"
context = "production"

# Gitea (Source Code)
[[mcp.servers]]
name = "gitea"
type = "http"
url = "http://gitea:3001/api/v1"
timeout = 30
auth = { type = "basic", username = "${GITEA_USER}", password = "${GITEA_TOKEN}" }
description = "Repository browsing, PR creation, CI/CD"
context = "development"

# Archon OS (Knowledge Base)
[[mcp.servers]]
name = "archon-os"
type = "http"
url = "http://archon-os:4001/mcp"
timeout = 30
description = "Knowledge base, task memory, planning"
context = "development"

# ===== TOOL FILTERING BY CONTEXT =====
[tool_filtering]
# Development agents (Claude-Flow) see everything
[tool_filtering.development]
allowed_servers = ["docker-toolkit", "claude-flow", "gitea", "archon-os", "twenty-crm"]
hide_tools = []

# Production agents (OpenClaw, Activepieces) see CRM + workflows only
[tool_filtering.production]
allowed_servers = ["twenty-crm", "activepieces", "quote-engine", "mem0"]
hide_tools = ["file_write", "docker_build", "github_push"]

# ===== RATE LIMITING & BUDGET CONTROL =====
[rate_limiting]
enable_budget_alerts = true
monthly_budget_usd = 100  # Combined API spend
warn_at_percent = 80

[[rate_limiting.rules]]
provider = "anthropic"
tokens_per_min = 90000
tokens_per_hour = 1000000

[[rate_limiting.rules]]
provider = "litellm"
tokens_per_min = "unlimited"  # Local inference, no cost

[[rate_limiting.rules]]
provider = "openrouter"
tokens_per_min = 30000
tokens_per_hour = 500000

# ===== LOGGING & TRACING =====
[logging]
level = "info"
format = "json"
output = "stdout"
enable_request_logging = true
enable_token_counting = true
log_file = "/data/nexus.log"

[tracing]
enable = true
sample_rate = 0.1  # Sample 10% of requests for performance
export_to = "http://localhost:4318/v1/traces"

# ===== HEALTH CHECK ENDPOINTS =====
[health]
enable_health_checks = true
check_interval_secs = 30

[[health.endpoints]]
url = "http://litellm:4000/health"
name = "litellm"
critical = true

[[health.endpoints]]
url = "http://claude-flow:8080/health"
name = "claude-flow"
critical = false

[[health.endpoints]]
url = "https://crm.ratehunter.net/health"
name = "twenty-crm"
critical = true

[[health.endpoints]]
url = "http://oracle-mem0:9100/health"
name = "mem0"
critical = false

# ===== SECURITY =====
[security]
enable_api_keys = true
require_authentication = true
allowed_origins = [
  "http://localhost:*",
  "https://ratehunter.net",
  "https://*.ratehunter.net"
]

[[security.api_keys]]
name = "claude-flow-key"
key = "${CLAUDE_FLOW_API_KEY}"
permissions = ["read", "write", "execute"]

[[security.api_keys]]
name = "openclaw-key"
key = "${OPENCLAW_API_KEY}"
permissions = ["read", "write"]

[[security.api_keys]]
name = "admin-key"
key = "${ADMIN_API_KEY}"
permissions = ["read", "write", "execute", "admin"]
