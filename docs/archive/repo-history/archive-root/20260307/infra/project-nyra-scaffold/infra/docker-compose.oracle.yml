version: '3.9'

# ===== ORACLE CLOUD PLANE =====
# Deploy on: Oracle Cloud ARM A1 (Always-Free tier)
# Role: System of Record + Public Webhooks
# Stays online 24/7 even if home internet drops

services:
  # ===== SECRETS INJECTION =====
  infisical-agent:
    image: infisical/infisical-agent:latest
    container_name: nyra-secrets-agent-oracle
    environment:
      INFISICAL_TOKEN: ${ORACLE_INFISICAL_TOKEN}
    volumes:
      - secrets_volume:/secrets
    restart: always
    networks:
      - oracle

  # ===== CORE DATABASES =====
  postgres:
    image: postgres:16-alpine
    container_name: postgres-nyra
    shm_size: "256mb"
    environment:
      POSTGRES_DB: twenty
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${ORACLE_DATABASE_PASSWORD}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pgvector"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/scripts/init-postgres.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - oracle

  redis:
    image: redis:7-alpine
    container_name: redis-nyra
    command: redis-server --save 60 1 --requirepass ${ORACLE_REDIS_PASSWORD}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - oracle

  # ===== SYSTEM OF RECORD: TwentyCRM =====
  twenty-crm:
    image: twentycrm/twenty:latest
    container_name: twenty-crm-oracle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      infisical-agent:
        condition: service_started
    environment:
      SERVER_URL: https://crm.ratehunter.net
      DATABASE_URL: postgres://postgres:${ORACLE_DATABASE_PASSWORD}@postgres:5432/twenty
      REDIS_URL: redis://:${ORACLE_REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${ORACLE_TwentyCRM_SECRET_KEY}
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle
    volumes:
      - twenty_data:/app/data

  # ===== WORKFLOW AUTOMATION: Activepieces =====
  activepieces:
    image: activepieces/activepieces:latest
    container_name: activepieces-oracle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      AP_WEBHOOK_URL: https://workflows.ratehunter.net
      AP_EXTERNAL_URL: https://workflows.ratehunter.net
      DATABASE_URL: postgres://postgres:${ORACLE_DATABASE_PASSWORD}@postgres:5432/activepieces
      REDIS_URL: redis://:${ORACLE_REDIS_PASSWORD}@redis:6379
      JWT_SECRET: ${ORACLE_ACTIVEPIECES_SECRET_KEY}
      AP_DISABLE_USER_SIGN_UP: "true"
    ports:
      - "3002:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle
    volumes:
      - activepieces_data:/app/data

  # ===== QUOTE ENGINE MICROSERVICE =====
  quote-engine:
    build:
      context: services/quote-engine
      dockerfile: Dockerfile
    container_name: quote-engine-oracle
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 8089
      DATABASE_URL: postgres://postgres:${ORACLE_DATABASE_PASSWORD}@postgres:5432/quotes
    ports:
      - "8089:8089"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8089/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle

  # ===== MEMORY PERSISTENCE: Mem0 (Borrower Context) =====
  mem0:
    image: mem0/mem0:latest
    container_name: mem0-oracle
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      MEM0_DATABASE_URL: postgres://postgres:${ORACLE_DATABASE_PASSWORD}@postgres:5432/mem0
      MEM0_REDIS_URL: redis://:${ORACLE_REDIS_PASSWORD}@redis:6379
      MEM0_LLM_API_BASE: http://orchestrator-litellm:4000/v1
    ports:
      - "9100:9100"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9100/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle

  # ===== SOURCE CODE HOSTING: Gitea =====
  gitea:
    image: gitea/gitea:1.22.0-rootless
    container_name: gitea-oracle
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA_ROOT: /var/lib/gitea
      GITEA_CUSTOM: /etc/gitea
    volumes:
      - gitea_data:/var/lib/gitea
      - gitea_config:/etc/gitea
    ports:
      - "3001:3000"
      - "2222:2222"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    networks:
      - oracle

  # ===== GITEA RUNNER (CI/CD Automation) =====
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: gitea-runner-oracle
    depends_on:
      - gitea
    environment:
      GITEA_INSTANCE_URL: http://gitea:3000
      GITEA_RUNNER_REGISTRATION_TOKEN: ${GITEA_RUNNER_TOKEN}
      CONFIG_FILE: /config.yaml
    volumes:
      - ./infra/config/gitea-runner-config.yaml:/config.yaml
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    networks:
      - oracle

  # ===== CLOUDFLARED INGRESS =====
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-oracle
    command: tunnel run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    restart: unless-stopped
    networks:
      - oracle
    depends_on:
      - twenty-crm
      - activepieces
      - gitea

# ===== VOLUMES =====
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  secrets_volume:
    driver: local
  twenty_data:
    driver: local
  activepieces_data:
    driver: local
  gitea_data:
    driver: local
  gitea_config:
    driver: local

# ===== NETWORKS =====
networks:
  oracle:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16
