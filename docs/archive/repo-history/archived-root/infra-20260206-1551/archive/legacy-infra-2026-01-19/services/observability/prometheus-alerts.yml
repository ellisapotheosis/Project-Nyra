groups:
  - name: service_health
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up == 0
        for: 2m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Service {{ $labels.job }} is down"
          description: "{{ $labels.job }} on {{ $labels.instance }} has been down for more than 2 minutes."

      - alert: HighErrorRate
        expr: rate(http_requests_total{status=~"5.."}[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "High error rate on {{ $labels.job }}"
          description: "{{ $labels.job }} is experiencing {{ $value | humanizePercentage }} error rate."

      - alert: HighLatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High latency on {{ $labels.job }}"
          description: "95th percentile latency is {{ $value }}s on {{ $labels.job }}."

  - name: campaign_engine
    interval: 30s
    rules:
      - alert: CampaignProcessingBacklog
        expr: campaign_queue_size > 100
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Campaign processing backlog detected"
          description: "Campaign queue size is {{ $value }}, exceeding threshold of 100."

      - alert: CampaignFailureRate
        expr: rate(campaign_failures_total[5m]) > 0.1
        for: 5m
        labels:
          severity: critical
          category: errors
        annotations:
          summary: "High campaign failure rate"
          description: "Campaign failure rate is {{ $value | humanizePercentage }}."

      - alert: CampaignProcessingStalled
        expr: rate(campaigns_processed_total[5m]) == 0
        for: 15m
        labels:
          severity: critical
          category: availability
        annotations:
          summary: "Campaign processing has stalled"
          description: "No campaigns processed in the last 15 minutes."

  - name: quote_engine
    interval: 30s
    rules:
      - alert: QuoteCalculationTimeout
        expr: rate(quote_calculation_timeouts_total[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Quote calculations timing out"
          description: "{{ $value | humanizePercentage }} of quote calculations are timing out."

      - alert: QuoteEngineHighMemory
        expr: process_resident_memory_bytes{job="quote-engine"} > 2e9
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "Quote engine high memory usage"
          description: "Quote engine is using {{ $value | humanize }}B of memory."

      - alert: QuoteAPIHighResponseTime
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket{job="quote-api"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "Quote API slow response times"
          description: "95th percentile response time is {{ $value }}s."

  - name: memory_system
    interval: 30s
    rules:
      - alert: MemoryStoreHighUsage
        expr: mem0_storage_bytes / mem0_storage_capacity_bytes > 0.85
        for: 10m
        labels:
          severity: warning
          category: capacity
        annotations:
          summary: "Memory store nearing capacity"
          description: "Mem0 storage is {{ $value | humanizePercentage }} full."

      - alert: MemoryRetrievalFailures
        expr: rate(mem0_retrieval_failures_total[5m]) > 0.05
        for: 5m
        labels:
          severity: warning
          category: errors
        annotations:
          summary: "Memory retrieval failures detected"
          description: "{{ $value | humanizePercentage }} of memory retrievals are failing."

      - alert: MemoryStorageLatency
        expr: histogram_quantile(0.95, rate(mem0_storage_duration_seconds_bucket[5m])) > 0.2
        for: 5m
        labels:
          severity: warning
          category: performance
        annotations:
          summary: "High memory storage latency"
          description: "95th percentile storage latency is {{ $value }}s."

  - name: resource_alerts
    interval: 30s
    rules:
      - alert: HighCPUUsage
        expr: rate(process_cpu_seconds_total[5m]) > 0.8
        for: 10m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High CPU usage on {{ $labels.job }}"
          description: "CPU usage is {{ $value | humanizePercentage }} on {{ $labels.job }}."

      - alert: HighMemoryUsage
        expr: process_resident_memory_bytes / node_memory_MemTotal_bytes > 0.85
        for: 5m
        labels:
          severity: warning
          category: resources
        annotations:
          summary: "High memory usage on {{ $labels.job }}"
          description: "Memory usage is {{ $value | humanizePercentage }}."

      - alert: DiskSpaceLow
        expr: node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"} < 0.15
        for: 5m
        labels:
          severity: critical
          category: resources
        annotations:
          summary: "Low disk space"
          description: "Only {{ $value | humanizePercentage }} disk space remaining."
