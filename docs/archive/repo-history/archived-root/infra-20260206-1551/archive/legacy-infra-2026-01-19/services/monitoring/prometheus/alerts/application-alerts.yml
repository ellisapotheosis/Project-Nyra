# Application-level Alert Rules
# API, Service, Performance alerts

groups:
  - name: application_alerts
    interval: 30s
    rules:
      # ==========================================
      # API PERFORMANCE
      # ==========================================

      - alert: HighAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 1
        for: 5m
        labels:
          severity: warning
          category: application
          component: api
        annotations:
          summary: "High API latency on {{ $labels.service }}"
          description: "95th percentile latency: {{ $value | humanizeDuration }}"
          dashboard: "http://grafana:3000/d/api-performance"

      - alert: CriticalAPILatency
        expr: histogram_quantile(0.95, rate(http_request_duration_seconds_bucket[5m])) > 3
        for: 2m
        labels:
          severity: critical
          category: application
          component: api
        annotations:
          summary: "CRITICAL: API latency on {{ $labels.service }}"
          description: "95th percentile latency: {{ $value | humanizeDuration }}"
          action: "Investigate immediately - user experience degraded"

      - alert: HighAPIErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.05
        for: 5m
        labels:
          severity: warning
          category: application
          component: api
        annotations:
          summary: "High API error rate on {{ $labels.service }}"
          description: "Error rate: {{ $value | humanizePercentage }} (threshold: 5%)"
          dashboard: "http://grafana:3000/d/api-errors"

      - alert: CriticalAPIErrorRate
        expr: sum(rate(http_requests_total{status=~"5.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.10
        for: 2m
        labels:
          severity: critical
          category: application
          component: api
        annotations:
          summary: "CRITICAL: API error rate on {{ $labels.service }}"
          description: "Error rate: {{ $value | humanizePercentage }} (threshold: 10%)"
          action: "Immediate investigation required"

      - alert: HighAPI4xxRate
        expr: sum(rate(http_requests_total{status=~"4.."}[5m])) by (service) / sum(rate(http_requests_total[5m])) by (service) > 0.20
        for: 10m
        labels:
          severity: warning
          category: application
          component: api
        annotations:
          summary: "High 4xx rate on {{ $labels.service }}"
          description: "Client error rate: {{ $value | humanizePercentage }}"

      # ==========================================
      # SERVICE HEALTH
      # ==========================================

      - alert: ServiceDown
        expr: up{job=~"api-gateway|backend-services|frontend"} == 0
        for: 1m
        labels:
          severity: critical
          category: application
          component: availability
        annotations:
          summary: "Service {{ $labels.service }} is down"
          description: "{{ $labels.job }} has been down for more than 1 minute"
          action: "Check service immediately - user impact"

      - alert: HealthCheckFailing
        expr: probe_success{job="blackbox-http"} == 0
        for: 2m
        labels:
          severity: critical
          category: application
          component: health
        annotations:
          summary: "Health check failing for {{ $labels.instance }}"
          description: "Health endpoint is not responding"
          action: "Investigate service health"

      - alert: ServiceRestarting
        expr: rate(process_start_time_seconds[5m]) > 0.01
        for: 5m
        labels:
          severity: warning
          category: application
          component: stability
        annotations:
          summary: "Service {{ $labels.service }} restarting frequently"
          description: "Service has restarted multiple times in last 5 minutes"

      # ==========================================
      # DATABASE PERFORMANCE
      # ==========================================

      - alert: DatabaseConnectionPoolExhausted
        expr: pg_stat_database_numbackends / pg_settings_max_connections > 0.8
        for: 5m
        labels:
          severity: warning
          category: application
          component: database
        annotations:
          summary: "Database connection pool near limit"
          description: "{{ $value | humanizePercentage }} of max connections in use"
          dashboard: "http://grafana:3000/d/database-overview"

      - alert: SlowDatabaseQueries
        expr: rate(pg_stat_statements_mean_time_seconds[5m]) > 1
        for: 5m
        labels:
          severity: warning
          category: application
          component: database
        annotations:
          summary: "Slow database queries detected"
          description: "Average query time: {{ $value | humanizeDuration }}"

      - alert: DatabaseDeadlocks
        expr: rate(pg_stat_database_deadlocks[5m]) > 0
        for: 1m
        labels:
          severity: warning
          category: application
          component: database
        annotations:
          summary: "Database deadlocks detected"
          description: "Deadlock rate: {{ $value }}/sec"

      # ==========================================
      # CACHE PERFORMANCE
      # ==========================================

      - alert: LowCacheHitRate
        expr: rate(redis_keyspace_hits_total[5m]) / (rate(redis_keyspace_hits_total[5m]) + rate(redis_keyspace_misses_total[5m])) < 0.8
        for: 10m
        labels:
          severity: warning
          category: application
          component: cache
        annotations:
          summary: "Low cache hit rate"
          description: "Cache hit rate: {{ $value | humanizePercentage }} (threshold: 80%)"
          dashboard: "http://grafana:3000/d/cache-performance"

      - alert: RedisMemoryHigh
        expr: redis_memory_used_bytes / redis_memory_max_bytes > 0.9
        for: 5m
        labels:
          severity: warning
          category: application
          component: cache
        annotations:
          summary: "Redis memory usage high"
          description: "Memory usage: {{ $value | humanizePercentage }}"

      - alert: RedisConnectionsHigh
        expr: redis_connected_clients > 1000
        for: 5m
        labels:
          severity: warning
          category: application
          component: cache
        annotations:
          summary: "High Redis connection count"
          description: "Connected clients: {{ $value }}"

      # ==========================================
      # MESSAGE QUEUE
      # ==========================================

      - alert: MessageQueueBacklog
        expr: rabbitmq_queue_messages_ready > 10000
        for: 10m
        labels:
          severity: warning
          category: application
          component: messaging
        annotations:
          summary: "Message queue backlog on {{ $labels.queue }}"
          description: "Ready messages: {{ $value }}"

      - alert: MessageQueueConsumersDown
        expr: rabbitmq_queue_consumers == 0
        for: 5m
        labels:
          severity: critical
          category: application
          component: messaging
        annotations:
          summary: "No consumers for queue {{ $labels.queue }}"
          description: "Queue has no active consumers"
          action: "Check consumer services"

      # ==========================================
      # APPLICATION ERRORS
      # ==========================================

      - alert: HighApplicationErrorRate
        expr: rate(application_errors_total[5m]) > 10
        for: 5m
        labels:
          severity: warning
          category: application
          component: errors
        annotations:
          summary: "High application error rate on {{ $labels.service }}"
          description: "Error rate: {{ $value }}/sec"

      - alert: CriticalApplicationErrors
        expr: rate(application_errors_total{severity="critical"}[5m]) > 1
        for: 2m
        labels:
          severity: critical
          category: application
          component: errors
        annotations:
          summary: "Critical errors on {{ $labels.service }}"
          description: "Critical error rate: {{ $value }}/sec"
          action: "Investigate immediately"

      # ==========================================
      # BUSINESS METRICS
      # ==========================================

      - alert: LowUserSignupRate
        expr: rate(user_signups_total[1h]) < 1
        for: 2h
        labels:
          severity: warning
          category: business
          component: users
        annotations:
          summary: "Low user signup rate"
          description: "Signup rate: {{ $value }}/hour (expected: >1/hour)"
          dashboard: "http://grafana:3000/d/business-metrics"

      - alert: HighCheckoutFailureRate
        expr: rate(checkout_failures_total[5m]) / rate(checkout_attempts_total[5m]) > 0.1
        for: 10m
        labels:
          severity: warning
          category: business
          component: payments
        annotations:
          summary: "High checkout failure rate"
          description: "Failure rate: {{ $value | humanizePercentage }}"

      - alert: APIRateLimitHit
        expr: rate(rate_limit_exceeded_total[5m]) > 100
        for: 5m
        labels:
          severity: warning
          category: application
          component: ratelimit
        annotations:
          summary: "High rate limit hits on {{ $labels.service }}"
          description: "Rate limit hits: {{ $value }}/sec"
