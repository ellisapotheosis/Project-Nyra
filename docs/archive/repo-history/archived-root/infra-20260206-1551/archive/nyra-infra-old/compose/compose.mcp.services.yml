version: '3.9'

networks:
  nyra:
    external: true

services:
  infisical-mcp:
    build:
      context: ../../nyra-mcp/security/infisical-mcp
    container_name: nyra-infisical-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    healthcheck:
      test: ['CMD','curl','-f','http://localhost:8080/health']
      interval: 30s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks: [nyra]

  bitwarden-mcp:
    build:
      context: ../../nyra-mcp/security/bitwarden-mcp
    container_name: nyra-bitwarden-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  auth-mcp:
    build:
      context: ../../nyra-mcp/security/auth-mcp
    container_name: nyra-auth-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  ssl-mcp:
    build:
      context: ../../nyra-mcp/security/ssl-mcp
    container_name: nyra-ssl-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  filesystem-mcp:
    build:
      context: ../../nyra-mcp/filesystem-mcp
    container_name: nyra-filesystem-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    volumes:
      - ${NYRA_MOUNT_ROOT:-${USERPROFILE}}:/mnt/host
    restart: unless-stopped
    networks: [nyra]

  github-mcp:
    build:
      context: ../../nyra-mcp/github-mcp
    container_name: nyra-github-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  activepieces-mcp:
    build:
      context: ../../nyra-mcp/activepieces-mcp
    container_name: nyra-activepieces-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  websearch-mcp:
    build:
      context: ../../nyra-mcp/websearch-mcp
    container_name: nyra-websearch-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  qdrant-mcp:
    build:
      context: ../../nyra-memory/qdrant-mcp
    container_name: nyra-qdrant-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  neo4j-mcp:
    build:
      context: ../../nyra-memory/neo4j-mcp
    container_name: nyra-neo4j-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  postgres-mcp:
    build:
      context: ../../nyra-memory/postgres-mcp
    container_name: nyra-postgres-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]

  elasticsearch-mcp:
    build:
      context: ../../nyra-mcp/elasticsearch-mcp
    container_name: nyra-elasticsearch-mcp
    expose: ['8080']
    environment:
      PORT: 8080
    restart: unless-stopped
    networks: [nyra]
