version: '3.9'
name: nyra-nyra-stack

networks:
  nyra:
    external: true

services:
  nyra-stack-manager:
    image: ghcr.io/lobehub/nyra-stack-mcp-openwebui-docker-orchestrator:latest
    container_name: nyra-stack-mcp-manager
    restart: unless-stopped
    environment:
      MANAGER_PORT: ${MANAGER_PORT:-3001}
      MCP_PROXY_MODE: ${MCP_PROXY_MODE:-unified}
      MCP_PROXY_TYPE: ${MCP_PROXY_TYPE:-mcpo}
      PORT_RANGE_START: ${PORT_RANGE_START:-4200}
      PORT_RANGE_END: ${PORT_RANGE_END:-4300}
      CLAUDE_CONFIG_PATH: /config/claude_desktop_config.json
    ports:
      - "${MANAGER_PORT:-3001}:3001"
    volumes:
      - ${CLAUDE_CONFIG_ABSOLUTE_PATH}:/config/claude_desktop_config.json:ro
      - ./logs/nyra-stack:/var/log/mcp-proxy-manager
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks: [nyra]
