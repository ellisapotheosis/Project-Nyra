
services:
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    profiles: ["ui"]
    restart: unless-stopped
    env_file:
      - ../.env
    env_file:
      - ../.env
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    volumes: [ "owui_data:/app/backend/data" ]
    ports: [ "3000:8080" ]
    depends_on: [ mcpo, pipelines ]
    networks:
      - nyra-net

  pipelines:
    image: ghcr.io/open-webui/pipelines:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment: { PORT: 9099 }
    ports: [ "9099:9099" ]
    networks:
      - nyra-net

  mcpo:
    image: ghcr.io/open-webui/mcpo:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      MCP_SERVER_COMMAND: "uvx mcp-proxy --transport streamablehttp http://metamcp:12008/metamcp/default/mcp"
      API_ACCESS_TOKEN: ${API_ACCESS_TOKEN:-changeme}
    ports: [ "3339:3339" ]
    networks:
      - nyra-net

  lobechat:
    image: lobehub/lobe-chat:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    ports: [ "3210:3210" ]
    networks:
      - nyra-net

  librechat:
    image: ghcr.io/danny-avila/librechat:latest
    profiles: ["ui"]
    restart: unless-stopped
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-replace_me}
    ports: [ "3333:3000" ]
    networks:
      - nyra-net

  env_file:`r`n
    -



