version: '3.9'

services:
  metamcp-gateway:
    container_name: nyra_metamcp
    build:
      context: ../metamcp-gateway
    env_file:
      - ../.env
    ports:
      - "9090:9090"
    volumes:
      - ../metamcp-gateway/metamcp.config.json:/app/metamcp.config.json:ro
      - ../metamcp-gateway/channels:/app/channels:ro
    restart: unless-stopped

  nyra-stack-orchestrator:
    container_name: nyra_nyra-stack
    image: ghcr.io/lobehub/nyra-stack-mcp-openwebui-docker-orchestrator:latest
    environment:
      MANAGER_PORT: ${MANAGER_PORT:-8899}
      MCP_PROXY_MODE: ${MCP_PROXY_MODE:-unified}
      MCP_PROXY_TYPE: ${MCP_PROXY_TYPE:-mcpo}
      PORT_RANGE_START: ${PORT_RANGE_START:-9100}
      PORT_RANGE_END: ${PORT_RANGE_END:-9199}
      CLAUDE_CONFIG_PATH: ${CLAUDE_CONFIG_PATH:-/root/.claude/config.json}
    ports:
      - "${MANAGER_PORT:-8899}:${MANAGER_PORT:-8899}"
    depends_on:
      - metamcp-gateway
    restart: unless-stopped

  open-webui:
    container_name: nyra_openwebui
    image: ghcr.io/open-webui/open-webui:main
    environment:
      WEBUI_NAME: "Nyra Open WebUI"
    volumes:
      - ${OPENWEBUI_DATA:-./data/openwebui}:/app/backend/data
    ports:
      - "3000:8080"
    depends_on:
      - metamcp-gateway
    restart: unless-stopped

networks:
  default:
    name: nyra_net
