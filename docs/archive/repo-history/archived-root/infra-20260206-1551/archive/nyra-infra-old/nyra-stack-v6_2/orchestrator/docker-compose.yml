version: "3.9"

x-health: &default-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    container_name: metamcp
    restart: unless-stopped
    env_file: ../env/.env
    environment:
      - APP_URL=http://metamcp:${METAMCP_PORT}
      - PORT=${METAMCP_PORT}
    ports: ["${METAMCP_PORT}:${METAMCP_PORT}"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${METAMCP_PORT}/api/openapi.json"]
      <<: *default-health
    profiles: ["orchestration"]

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    restart: unless-stopped
    env_file: ../env/.env
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    ports: ["${POSTGRES_PORT}:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} || exit 1"]
      <<: *default-health
    profiles: ["orchestration","memory"]

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: unless-stopped
    env_file: ../env/.env
    command: ["redis-server","--requirepass","${REDIS_PASSWORD}"]
    volumes: ["redis_data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      <<: *default-health
    profiles: ["orchestration","memory"]

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    environment:
      - WEBUI_AUTH=false
    ports: ["${OPENWEBUI_PORT}:8080"]
    volumes: ["openwebui_data:/app/backend/data"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      <<: *default-health
    depends_on:
      metamcp:
        condition: service_healthy
    profiles: ["ui"]

  caddy:
    image: caddy:2-alpine
    container_name: caddy-portal
    restart: unless-stopped
    ports: ["${CADDY_HTTP_PORT}:${CADDY_HTTP_PORT}"]
    volumes: ["./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"]
    depends_on:
      open-webui:
        condition: service_healthy
      metamcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${CADDY_HTTP_PORT}/"]
      <<: *default-health
    profiles: ["ui","orchestration"]

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared
    restart: unless-stopped
    environment: ["TUNNEL_TOKEN=${CLOUDFLARE_TOKEN}"]
    command: ["tunnel","run"]
    depends_on:
      caddy:
        condition: service_healthy
    profiles: ["edge"]

  litellm:
    image: ghcr.io/berriai/litellm:main
    container_name: litellm
    restart: unless-stopped
    env_file: ../env/.env
    environment:
      - PORT=${LITELLM_PORT}
      - LITELLM_LOG=INFO
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    ports: ["${LITELLM_PORT}:${LITELLM_PORT}"]
    command: ["--port", "${LITELLM_PORT}", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:${LITELLM_PORT}/health"]
      <<: *default-health
    profiles: ["orchestration"]

  infisical-mcp:
    image: node:20-alpine
    container_name: infisical-mcp
    restart: unless-stopped
    working_dir: /srv
    entrypoint: ["sh","-lc","npx -y @infisical/mcp"]
    environment:
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
      - INFISICAL_HOST_URL=${INFISICAL_HOST_URL}
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:80/ || exit 1"]
      <<: *default-health
    profiles: ["secrets"]

volumes:
  postgres_data:
  redis_data:
  openwebui_data:
