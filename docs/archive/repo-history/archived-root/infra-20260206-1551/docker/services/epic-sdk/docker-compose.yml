# Epic SDK - Multi-Tier Model Router (ADR-026)
# Coordinates routing across Agent Booster, Haiku, and Sonnet/Opus

services:
  epic-sdk:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyra-epic-sdk
    restart: unless-stopped
    ports:
      - "3011:3011"
    environment:
      - NODE_ENV=production
      - PORT=3011
      - LOG_LEVEL=info
      - AGENT_BOOSTER_URL=http://agent-booster:3010
      - NEXUS_ROUTER_URL=http://localhost:6000
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./logs:/app/logs
      - ./config:/app/config:ro
    networks:
      - nyra-core
      - nyra-orchestrator
    depends_on:
      - agent-booster
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3011/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 1G
        reservations:
          cpus: '1.0'
          memory: 512M
    labels:
      - "com.nyra.service=epic-sdk"
      - "com.nyra.routing=multi-tier"
      - "com.nyra.adr=026"

  agent-booster:
    build:
      context: ../agent-booster
      dockerfile: Dockerfile
    container_name: nyra-agent-booster
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - NODE_ENV=production
      - PORT=3010
      - LOG_LEVEL=info
    volumes:
      - ../agent-booster/logs:/app/logs
      - ../agent-booster/config:/app/config:ro
    networks:
      - nyra-core
      - nyra-orchestrator
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3010/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M
    labels:
      - "com.nyra.service=agent-booster"
      - "com.nyra.tier=1"

networks:
  nyra-core:
    external: true
  nyra-orchestrator:
    external: true
