# Docker Compose - Embedding Services (Orchestrator Only)
# ONNX Runtime (GPU) + Xenova/Transformers (WASM SIMD)
# These services run ONLY on the orchestrator PC for embeddings
# GPU workers handle full LLM inference via Ollama

services:
  # ONNX Runtime GPU Inference Service
  onnx-runtime:
    build:
      context: ./onnx-runtime
      dockerfile: Dockerfile
    image: nyra/onnx-runtime:latest
    container_name: nyra-onnx-runtime
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - BATCH_SIZE=${ONNX_BATCH_SIZE:-8}
      - QUANTIZATION=${ONNX_QUANTIZATION:-fp16}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Model cache (shared with claude-flow)
      - ../../.claude-flow/models:/app/models:rw
      - onnx-cache:/app/cache
    networks:
      - nyra-orchestrator
      - nyra-core
    deploy:
      resources:
        limits:
          cpus: '4.0'
          memory: 8G
        reservations:
          cpus: '2.0'
          memory: 4G
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Xenova/Transformers Embedding Service
  xenova-embeddings:
    build:
      context: ./xenova-transformers
      dockerfile: Dockerfile
    image: nyra/xenova-embeddings:latest
    container_name: nyra-xenova-embeddings
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      - PORT=8002
      - MODEL_NAME=${XENOVA_MODEL:-Xenova/all-MiniLM-L6-v2}
      - CACHE_DIR=/app/models
      - MAX_BATCH_SIZE=${XENOVA_BATCH_SIZE:-32}
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      # Model cache
      - xenova-models:/app/models:rw
      - xenova-cache:/app/cache
    networks:
      - nyra-orchestrator
      - nyra-core
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s

networks:
  nyra-orchestrator:
    external: true
  nyra-core:
    external: true

volumes:
  onnx-cache:
    driver: local
  xenova-models:
    driver: local
  xenova-cache:
    driver: local
