# ============================================================================
# Prometheus Configuration for Project Nyra
# ============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nyra-production'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            # - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  # - "alert_rules.yml"

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Claude Flow metrics
  - job_name: 'claude-flow'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['claude-flow:9090']
        labels:
          service: 'claude-flow'
          component: 'orchestration'

  # Archon OS metrics
  - job_name: 'archon'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['archon:9091']
        labels:
          service: 'archon'
          component: 'ai-framework'

  # PostgreSQL exporter
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres-exporter:9187']
        labels:
          service: 'postgres'
          component: 'database'

  # Redis exporter
  - job_name: 'redis'
    static_configs:
      - targets: ['redis-exporter:9121']
        labels:
          service: 'redis'
          component: 'cache'

  # Node exporter (host metrics)
  - job_name: 'node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          component: 'host'

  # Docker container metrics
  - job_name: 'docker'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          component: 'containers'

  # n8n metrics
  - job_name: 'n8n'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['n8n:5678']
        labels:
          service: 'n8n'
          component: 'workflows'

  # Gitea metrics
  - job_name: 'gitea'
    metrics_path: '/metrics'
    static_configs:
      - targets: ['gitea:3000']
        labels:
          service: 'gitea'
          component: 'git'
