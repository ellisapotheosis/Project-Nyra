# Docker Compose - MCP Servers
# Claude Flow, Infisical, Memory Services (Mem0, Letta), AgentDB, RuVector

services:
  # Nexus Router - LLM Gateway & MCP Aggregator
  nexus-router:
    build:
      context: ../build/services/nexus-router
      dockerfile: Dockerfile
      args:
        NEXUS_VERSION: latest
    image: nyra-nexus-router:latest
    container_name: nyra-nexus
    restart: unless-stopped
    ports:
      - "6000:6000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      - INFISICAL_ENV=${INFISICAL_ENV:-dev}
      - DEFAULT_PROVIDER=anthropic
      - FALLBACK_PROVIDERS=openrouter,google
      - RATE_LIMIT_ENABLED=true
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NEXUS_CONFIG=/etc/nexus.toml
      - WORKER_5090_URL=${WORKER_5090_URL:-http://worker-5090.tail-net.ts.net:11434}
      - WORKER_3090_URL=${WORKER_3090_URL:-http://worker-3090.tail-net.ts.net:11434}
      - WORKER_3060_URL=${WORKER_3060_URL:-http://worker-3060.tail-net.ts.net:11434}
    volumes:
      - nexus-data:/app/data
      - ../../configs/nexus/nexus.toml:/etc/nexus.toml:ro
    networks:
      - nyra-mcp
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # LiteLLM - Model Proxy
  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-litellm
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./configs/litellm/config.yaml:/app/config.yaml:ro
    networks:
      - nyra-mcp
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3





  # Claude Flow - Multi-Agent Orchestrator
  claude-flow:
    image: ghcr.io/ruv-inc/claude-flow:alpha
    container_name: nyra-claude-flow
    restart: unless-stopped
    ports:
      - "3010:3010"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_FLOW_MODE=orchestrator
      - AGENTDB_URL=http://agentdb:8080
      - REASONINGBANK_ENABLED=true
      - SWARM_MAX_AGENTS=31
      - SWARM_TOPOLOGY=hierarchical
      - LOG_LEVEL=${LOG_LEVEL:-info}
    volumes:
      - claude-flow-data:/app/data
    networks:
      - nyra-mcp
      - nyra-core
    depends_on:
      - nexus-router
      - agentdb
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # AgentDB - HNSW Vector Database
  agentdb:
    image: ghcr.io/ruv-inc/agentdb:latest
    container_name: nyra-agentdb
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AGENTDB_HNSW_M=16
      - AGENTDB_HNSW_EF_CONSTRUCTION=200
      - AGENTDB_QUANTIZATION=scalar
      - AGENTDB_CACHE_SIZE=256
    volumes:
      - agentdb-data:/app/data
    networks:
      - nyra-mcp
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # RuVector - Memory Optimization
  ruvector:
    image: ghcr.io/ruv-inc/ruvector:latest
    container_name: nyra-ruvector
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - RUVECTOR_SONA_ENABLED=true
      - RUVECTOR_MOE_ENABLED=true
      - RUVECTOR_FLASH_ATTENTION=true
      - RUVECTOR_EWC_ENABLED=true
    volumes:
      - ruvector-data:/app/data
    networks:
      - nyra-mcp
      - nyra-core
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8888/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Infisical - Secrets Management
  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - JWT_SECRET=${INFISICAL_JWT_SECRET}
      - MONGO_URL=mongodb://infisical-mongo:27017/infisical
    volumes:
      - infisical-data:/app/data
    networks:
      - nyra-mcp
    depends_on:
      - infisical-mongo
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infisical-mongo:
    image: mongo:7
    container_name: nyra-infisical-mongo
    restart: unless-stopped
    volumes:
      - infisical-mongo-data:/data/db
    networks:
      - nyra-mcp

networks:
  nyra-mcp:
    name: nyra-mcp
    driver: bridge
  nyra-core:
    external: true

volumes:
  nexus-data:
    driver: local

  claude-flow-data:
    driver: local
  agentdb-data:
    driver: local
  ruvector-data:
    driver: local
  infisical-data:
    driver: local
  infisical-mongo-data:
    driver: local
