version: '3.8'

services:
  git-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: mcp/git:latest
    container_name: git-mcp-server

    # Bind mount workspace for git operations
    volumes:
      - ${WORKSPACE_PATH:-../../}:/workspace:rw
      - git-cache:/app/.git-cache

    # Environment variables
    environment:
      - NODE_ENV=production
      - GIT_WORKSPACE=/workspace
      - GIT_AUTHOR_NAME=${GIT_AUTHOR_NAME:-MCP Git Server}
      - GIT_AUTHOR_EMAIL=${GIT_AUTHOR_EMAIL:-mcp@example.com}
      - GIT_COMMITTER_NAME=${GIT_COMMITTER_NAME:-MCP Git Server}
      - GIT_COMMITTER_EMAIL=${GIT_COMMITTER_EMAIL:-mcp@example.com}

    # Stdin for MCP protocol
    stdin_open: true
    tty: false

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

    # Restart policy
    restart: unless-stopped

    # Logging
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Network
    networks:
      - mcp-network

networks:
  mcp-network:
    driver: bridge

volumes:
  git-cache:
    driver: local
