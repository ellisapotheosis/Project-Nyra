version: '3.8'

# Project Nyra - Networking stack (Cloudflare Tunnel + Tailscale)
#
# Usage:
#   1. Copy .env.cloudflare.example -> .env.cloudflare and fill in real tokens
#   2. Add TAILSCALE_AUTHKEY to your .env (or export in shell)
#   3. Start networking services:
#        docker compose -f infra/networking/docker-compose.network.yml --env-file .env.cloudflare up -d
#
# NOTE: This file does NOT expose any services by itself; Cloudflare and Tailscale
#       will connect to services already bound to host ports (e.g. 6000, 3005, etc.).

services:
  # ---------------------------------------------------------------------------
  # Cloudflare Tunnel (Orchestrator / Core Stack)
  # ---------------------------------------------------------------------------
  cloudflared-orchestrator:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared-orchestrator
    restart: unless-stopped
    # Use the token for the orchestrator node from .env.cloudflare
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR}
    # Cloudflared will use its remote config in Cloudflare Zero Trust
    command: tunnel run
    # Host networking so it can reach services via localhost:PORT
    network_mode: host
    labels:
      nyra.service.name: 'cloudflared-orchestrator'
      nyra.service.type: 'network'
      nyra.service.category: 'edge-tunnel'

  # ---------------------------------------------------------------------------
  # Tailscale - secure mesh network for Nyra nodes
  # ---------------------------------------------------------------------------
  tailscale:
    image: tailscale/tailscale:stable
    container_name: nyra-tailscale
    hostname: nyra-router
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - tailscale_state:/var/lib/tailscale
      - /dev/net/tun:/dev/net/tun
    environment:
      # Create this auth key in your Tailscale admin console
      - TS_AUTHKEY=${TAILSCALE_AUTHKEY}
      - TS_STATE_DIR=/var/lib/tailscale
      # Optional extra args, e.g. enable SSH: --ssh
      - TS_EXTRA_ARGS=${TAILSCALE_EXTRA_ARGS:---ssh}
    labels:
      nyra.service.name: 'tailscale-router'
      nyra.service.type: 'network'
      nyra.service.category: 'mesh-vpn'

volumes:
  tailscale_state:
    driver: local
