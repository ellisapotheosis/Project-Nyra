name: nyra

networks:
  nyra:
    driver: bridge

volumes:
  nyra-postgres-data:
  nyra-redis-data:

  twenty-db-data:
  twenty-server-local-data:

  n8n-data:
  n8n-postgres-data:
  n8n-redis-data:

  ap-postgres-data:
  ap-redis-data:
  ap-cache:

  grafana-data:

services:
  nyra-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nyra
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${NYRA_POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${NYRA_POSTGRES_PORT:-5432}:5432"
    volumes:
      - nyra-postgres-data:/var/lib/postgresql/data
      - ../configs/postgres/init-nyra.sql:/docker-entrypoint-initdb.d/10-init-nyra.sql:ro
    networks: [nyra]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["core"]

  nyra-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    ports:
      - "127.0.0.1:${NYRA_REDIS_PORT:-6379}:6379"
    volumes:
      - nyra-redis-data:/data
    networks: [nyra]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["core"]

  litellm:
    image: docker.litellm.ai/berriai/litellm:main-stable
    restart: unless-stopped
    command: ["--config","/app/config.yaml","--port","4000"]
    environment:
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
    volumes:
      - ../configs/litellm/config.yaml:/app/config.yaml:ro
    ports:
      - "127.0.0.1:${LITELLM_PORT:-4000}:4000"
    networks: [nyra]
    profiles: ["ai"]

  nyra-mcp:
    build:
      context: ../mcp/nyra_mcp
    restart: unless-stopped
    environment:
      NYRA_HTTP_ALLOWLIST: ${NYRA_HTTP_ALLOWLIST}
      TWENTY_SERVER_URL: ${TWENTY_SERVER_URL}
      TWENTY_API_KEY: ${TWENTY_API_KEY:-}
      N8N_INTERNAL_BASE_URL: http://n8n-main:5678
      AP_INTERNAL_BASE_URL: http://activepieces:80
    ports:
      - "127.0.0.1:${NYRA_MCP_PORT:-3333}:3333"
    networks: [nyra]
    profiles: ["mcp"]

  nexus:
    image: ghcr.io/grafbase/nexus:stable
    restart: unless-stopped
    command: ["--config","/etc/nexus.toml"]
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
    volumes:
      - ../configs/nexus/nexus.toml:/etc/nexus.toml:ro
    depends_on:
      - nyra-mcp
    ports:
      - "127.0.0.1:${NEXUS_PORT:-8000}:8000"
    networks: [nyra]
    profiles: ["mcp"]

  # TwentyCRM (official compose logic, namespaced)
  twenty-db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: default
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD}
    volumes:
      - twenty-db-data:/var/lib/postgresql/data
    networks: [nyra]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -h localhost -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["apps"]

  twenty-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--maxmemory-policy","noeviction"]
    networks: [nyra]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["apps"]

  twenty-server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: unless-stopped
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - twenty-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      NODE_PORT: 3000
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      SERVER_URL: ${TWENTY_SERVER_URL}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${TWENTY_APP_SECRET}
    networks: [nyra]
    healthcheck:
      test: ["CMD-SHELL","curl --fail http://localhost:3000/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30
    profiles: ["apps"]

  twenty-worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: unless-stopped
    command: ["yarn","worker:prod"]
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-server:
        condition: service_healthy
    volumes:
      - twenty-server-local-data:/app/packages/twenty-server/.local-storage
    environment:
      PG_DATABASE_URL: postgres://postgres:${TWENTY_PG_PASSWORD}@twenty-db:5432/default
      SERVER_URL: ${TWENTY_SERVER_URL}
      REDIS_URL: redis://twenty-redis:6379
      STORAGE_TYPE: local
      APP_SECRET: ${TWENTY_APP_SECRET}
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    networks: [nyra]
    profiles: ["apps"]

  # n8n (queue mode)
  n8n-postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: n8n
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: ${N8N_POSTGRES_PASSWORD}
    volumes:
      - n8n-postgres-data:/var/lib/postgresql/data
    networks: [nyra]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U n8n -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["apps"]

  n8n-redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server","--appendonly","yes"]
    volumes:
      - n8n-redis-data:/data
    networks: [nyra]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["apps"]

  n8n-main:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.9.4}
    restart: unless-stopped
    depends_on:
      n8n-postgres:
        condition: service_healthy
      n8n-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}

      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD}

      WEBHOOK_URL: ${N8N_PUBLIC_BASE_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_BASE_URL:-http://localhost:5678}

      GENERIC_TIMEZONE: America/Los_Angeles
      TZ: America/Los_Angeles
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - n8n-data:/home/node/.n8n
      - ../data/n8n-files:/files
    networks: [nyra]
    profiles: ["apps"]

  n8n-worker:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-2.9.4}
    restart: unless-stopped
    command: ["worker"]
    depends_on:
      n8n-main:
        condition: service_started
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: ${N8N_POSTGRES_PASSWORD}

      EXECUTIONS_MODE: queue
      QUEUE_BULL_REDIS_HOST: n8n-redis
      QUEUE_BULL_REDIS_PORT: 6379

      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY}
      WEBHOOK_URL: ${N8N_PUBLIC_BASE_URL:-http://localhost:5678}
      N8N_EDITOR_BASE_URL: ${N8N_PUBLIC_BASE_URL:-http://localhost:5678}

      GENERIC_TIMEZONE: America/Los_Angeles
      TZ: America/Los_Angeles
    volumes:
      - n8n-data:/home/node/.n8n
      - ../data/n8n-files:/files
    networks: [nyra]
    profiles: ["apps"]

  # Activepieces
  ap-postgres:
    image: postgres:14.4
    restart: unless-stopped
    environment:
      POSTGRES_DB: activepieces
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
    volumes:
      - ap-postgres-data:/var/lib/postgresql/data
    networks: [nyra]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20
    profiles: ["apps"]

  ap-redis:
    image: redis:7.0.7
    restart: unless-stopped
    volumes:
      - ap-redis-data:/data
    networks: [nyra]
    healthcheck:
      test: ["CMD","redis-cli","ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    profiles: ["apps"]

  activepieces:
    image: ghcr.io/activepieces/activepieces:${AP_VERSION:-0.79.0}
    restart: unless-stopped
    depends_on:
      ap-postgres:
        condition: service_healthy
      ap-redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:8080:80"
    environment:
      AP_ENGINE_EXECUTABLE_PATH: dist/packages/engine/main.js
      AP_API_KEY: ${AP_API_KEY}
      AP_ENCRYPTION_KEY: ${AP_ENCRYPTION_KEY}
      AP_JWT_SECRET: ${AP_JWT_SECRET}
      AP_ENVIRONMENT: prod
      AP_FRONTEND_URL: ${AP_FRONTEND_URL}
      AP_POSTGRES_DATABASE: activepieces
      AP_POSTGRES_HOST: ap-postgres
      AP_POSTGRES_PORT: 5432
      AP_POSTGRES_USERNAME: postgres
      AP_POSTGRES_PASSWORD: ${AP_POSTGRES_PASSWORD}
      AP_EXECUTION_MODE: UNSANDBOXED
      AP_REDIS_HOST: ap-redis
      AP_REDIS_PORT: 6379
      AP_TELEMETRY_ENABLED: "false"
    volumes:
      - ap-cache:/usr/src/app/cache
    networks: [nyra]
    profiles: ["apps"]

  # Observability
  loki:
    image: grafana/loki:2.9.8
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ../configs/loki/loki-config.yaml:/etc/loki/config.yaml:ro
    networks: [nyra]
    profiles: ["obs"]

  prometheus:
    image: prom/prometheus:v2.52.0
    restart: unless-stopped
    command: ["--config.file=/etc/prometheus/prometheus.yml"]
    volumes:
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "127.0.0.1:9090:9090"
    networks: [nyra]
    profiles: ["obs"]

  grafana:
    image: grafana/grafana:10.4.2
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana-data:/var/lib/grafana
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3001}:3000"
    networks: [nyra]
    profiles: ["obs"]

  cloudflared:
    image: cloudflare/cloudflared:2025.2.1
    restart: unless-stopped
    command: ["tunnel","run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TOKEN}
    networks: [nyra]
    profiles: ["edge"]
