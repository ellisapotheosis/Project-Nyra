# ============================================================================
# Gitea - Self-Hosted Git Server with GitHub Mirror
# ============================================================================
# Project Nyra development infrastructure
# Mirrors to GitHub automatically via webhooks
# ============================================================================

services:
  # ==========================================
  # Gitea Server
  # ==========================================
  gitea:
    image: gitea/gitea:1.21-rootless
    container_name: nyra-gitea
    hostname: gitea
    restart: unless-stopped
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"      # Web UI
      - "${GITEA_SSH_PORT:-2222}:2222"       # SSH
    volumes:
      - gitea-data:/var/lib/gitea
      - gitea-config:/etc/gitea
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres:5432
      - GITEA__database__NAME=${GITEA_DB_NAME:-gitea}
      - GITEA__database__USER=${GITEA_DB_USER:-gitea}
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD:-gitea}
      - GITEA__server__DOMAIN=${GITEA_DOMAIN:-gitea.localhost}
      - GITEA__server__ROOT_URL=http://${GITEA_DOMAIN:-gitea.localhost}:${GITEA_HTTP_PORT:-3001}/
      - GITEA__server__SSH_PORT=${GITEA_SSH_PORT:-2222}
      - GITEA__server__SSH_LISTEN_PORT=2222
      - GITEA__server__START_SSH_SERVER=true
      - GITEA__service__DISABLE_REGISTRATION=true
      - GITEA__service__REQUIRE_SIGNIN_VIEW=false
      - GITEA__actions__ENABLED=true
      # GitHub Mirror Settings
      - GITEA__mirror__ENABLED=true
      - GITEA__mirror__DEFAULT_INTERVAL=10m
      # Webhook settings for GitHub push
      - GITEA__webhook__ALLOWED_HOST_LIST=github.com,api.github.com
    networks:
      - nyra-network
    depends_on:
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "com.nyra.service=gitea"
      - "com.nyra.category=infrastructure"
      - "traefik.enable=true"
      - "traefik.http.routers.gitea.rule=Host(`gitea.localhost`)"

  # ==========================================
  # Gitea Actions Runner (for CI/CD)
  # ==========================================
  gitea-runner:
    image: gitea/act_runner:latest
    container_name: nyra-gitea-runner
    hostname: gitea-runner
    restart: unless-stopped
    volumes:
      - gitea-runner-data:/data
      - /var/run/docker.sock:/var/run/docker.sock
      - ./runner-config.yaml:/config.yaml:ro
    environment:
      - CONFIG_FILE=/config.yaml
      - GITEA_INSTANCE_URL=http://gitea:3000
      - GITEA_RUNNER_REGISTRATION_TOKEN=${GITEA_RUNNER_TOKEN:-}
      - GITEA_RUNNER_NAME=nyra-runner-01
      - GITEA_RUNNER_LABELS=ubuntu-latest:docker://node:20,self-hosted:host
    networks:
      - nyra-network
    depends_on:
      - gitea
    labels:
      - "com.nyra.service=gitea-runner"
      - "com.nyra.category=ci-cd"

  # ==========================================
  # GitHub Mirror Sync Service
  # ==========================================
  github-mirror-sync:
    image: alpine/git:latest
    container_name: nyra-github-mirror
    hostname: github-mirror
    restart: "no"
    profiles: ["mirror"]
    volumes:
      - gitea-data:/var/lib/gitea:ro
      - ./mirror-sync.sh:/mirror-sync.sh:ro
      - ~/.ssh:/root/.ssh:ro
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN:-}
      - GITHUB_REPO=${GITHUB_REPO:-ellisapotheosis/Project-Nyra}
      - GITEA_URL=http://gitea:3000
      - GITEA_TOKEN=${GITEA_TOKEN:-}
    entrypoint: ["/bin/sh", "/mirror-sync.sh"]
    networks:
      - nyra-network

volumes:
  gitea-data:
    name: nyra_gitea_data
  gitea-config:
    name: nyra_gitea_config
  gitea-runner-data:
    name: nyra_gitea_runner_data

networks:
  nyra-network:
    external: true
