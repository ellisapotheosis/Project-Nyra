version: '3.8'

# ============================================================================
# NYRA COMPLETE STACK - BASE COMPOSE
#
# This file defines all services used by Project Nyra.  Each service is
# assigned one or more **profiles** so that machines can enable only the
# services they need.  See the overrides in `compose/overrides/` for
# node‑specific selections.
#
# Profiles:
#   core            - Essential control plane (nexus, archon, secrets, git)
#   databases       - Postgres, Redis, FalkorDB, RuVector
#   observability   - Prometheus, Grafana, Loki
#   workflows       - n8n, Activepieces
#   crm             - Twenty CRM (System of Record)
#   memory          - Letta (Memory Server)
#   apps            - Quote API, Campaign Engine, Admin UI
#   ui              - Dify Chat (borrower assistant)
#   mcp             - Optional MCP servers (Serena, Gemini, etc.)
#   vector          - RuVector Postgres & API (semantic search)
#
# NOTE: When adding new services, always assign a profile and update
# the port map and documentation accordingly.

services:
  # ---------------------------------------------------------------------------
  # CONTROL PLANE
  # ---------------------------------------------------------------------------
  nexus-router:
    image: grafbase/grafbase:latest
    container_name: nyra-nexus-router
    restart: unless-stopped
    profiles: [core]
    ports:
      - "6000:6000"
    environment:
      - PORT=6000
      - NEXUS_CONFIG_PATH=/config/nexus
      - NEXUS_JWT_SECRET=${NEXUS_JWT_SECRET}
    volumes:
      - nexus-config:/config/nexus:ro
      - nexus-logs:/var/log/nexus
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  archon:
    image: archon-mcp/archon:latest
    container_name: nyra-archon
    restart: unless-stopped
    profiles: [core]
    ports:
      - "4000:4000"   # API
      - "3737:3737"   # UI
      - "8051:8051"   # MCP
    environment:
      - ARCHON_API_PORT=4000
      - ARCHON_UI_PORT=3737
      - ARCHON_MCP_PORT=8051
      - ARCHON_DB_URL=postgresql://archon:${ARCHON_DB_PASSWORD}@postgres-archon:5432/archon
      - ARCHON_REDIS_URL=redis://redis:6380
    volumes:
      - archon-data:/data
      - archon-logs:/var/log/archon
    networks:
      - nyra-network
    depends_on:
      postgres-archon:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    restart: unless-stopped
    profiles: [core]
    ports:
      - "8080:3000"
    environment:
      - DATABASE_URL=postgresql://infisical:${INFISICAL_DB_PASSWORD}@postgres-infisical:5432/infisical
      - INFISICAL_ENCRYPTION_KEY=${INFISICAL_ENCRYPTION_KEY}
      - INFISICAL_AUTH_SECRET=${INFISICAL_AUTH_SECRET}
      - NODE_ENV=production
    volumes:
      - infisical-data:/data
    networks:
      - nyra-network
    depends_on:
      postgres-infisical:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gitea:
    image: gitea/gitea:latest
    container_name: nyra-gitea
    restart: unless-stopped
    profiles: [core]
    ports:
      - "3001:3000"  # Web UI
      - "2222:22"    # SSH
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=orchestrator.local
      - GITEA__server__ROOT_URL=http://orchestrator.local:3001/
      - GITEA__database__DB_TYPE=postgres
      - GITEA__database__HOST=postgres-gitea:5432
      - GITEA__database__NAME=gitea
      - GITEA__database__USER=gitea
      - GITEA__database__PASSWD=${GITEA_DB_PASSWORD}
    volumes:
      - gitea-data:/data
    networks:
      - nyra-network
    depends_on:
      postgres-gitea:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/v1/version"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # DATABASES & CACHES
  # ---------------------------------------------------------------------------
  postgres-archon:
    image: postgres:15-alpine
    container_name: postgres-archon
    restart: unless-stopped
    profiles: [databases]
    environment:
      - POSTGRES_DB=archon
      - POSTGRES_USER=archon
      - POSTGRES_PASSWORD=${ARCHON_DB_PASSWORD}
    volumes:
      - postgres-archon-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "archon"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-gitea:
    image: postgres:15-alpine
    container_name: postgres-gitea
    restart: unless-stopped
    profiles: [databases]
    environment:
      - POSTGRES_DB=gitea
      - POSTGRES_USER=gitea
      - POSTGRES_PASSWORD=${GITEA_DB_PASSWORD}
    volumes:
      - postgres-gitea-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "gitea"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-infisical:
    image: postgres:15-alpine
    container_name: postgres-infisical
    restart: unless-stopped
    profiles: [databases]
    environment:
      - POSTGRES_DB=infisical
      - POSTGRES_USER=infisical
      - POSTGRES_PASSWORD=${INFISICAL_DB_PASSWORD}
    volumes:
      - postgres-infisical-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "infisical"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-twenty:
    image: postgres:15-alpine
    container_name: postgres-twenty
    restart: unless-stopped
    profiles: [databases, crm]
    environment:
      - POSTGRES_DB=twenty
      - POSTGRES_USER=twenty
      - POSTGRES_PASSWORD=${TWENTY_DB_PASSWORD}
    volumes:
      - postgres-twenty-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "twenty"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-nyra_ai:
    image: ruvnet/ruvector-postgres:latest
    container_name: postgres-nyra-ai
    restart: unless-stopped
    profiles: [databases, vector]
    ports:
      - "5436:5432"
    environment:
      - POSTGRES_USER=nyra
      - POSTGRES_PASSWORD=${NYRA_AI_DB_PASSWORD}
      - POSTGRES_DB=nyra_ai
    volumes:
      - postgres-nyra-ai-data:/var/lib/postgresql/data
      - ./configs/ruvector/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "nyra"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    restart: unless-stopped
    profiles: [databases]
    ports:
      - "6380:6380"
    command: redis-server --port 6380 --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "6380", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    profiles: [databases]
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "PING"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # OBSERVABILITY
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "3005:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./configs/grafana/provisioning/:/etc/grafana/provisioning/:ro
    networks:
      - nyra-network
    depends_on:
      prometheus:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    restart: unless-stopped
    profiles: [observability]
    ports:
      - "3100:3100"
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - loki-data:/loki
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # WORKFLOWS
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    restart: unless-stopped
    profiles: [workflows]
    ports:
      - "5678:5678"
    environment:
      - N8N_PORT=5678
      - N8N_HOST=n8n
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-n8n
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_JWT_SECRET=${N8N_JWT_SECRET}
      - N8N_PAYLOAD_SIZE_MAX=16
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - nyra-network
    depends_on:
      postgres-n8n:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-n8n:
    image: postgres:15-alpine
    container_name: postgres-n8n
    restart: unless-stopped
    profiles: [workflows]
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_DB_PASSWORD}
    volumes:
      - postgres-n8n-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "n8n"]
      interval: 10s
      timeout: 5s
      retries: 5

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    restart: unless-stopped
    profiles: [workflows]
    ports:
      - "8082:8082"
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres-activepieces
      - DB_PORT=5432
      - DB_NAME=activepieces
      - DB_USER=activepieces
      - DB_PASSWORD=${ACTIVEPIECES_DB_PASSWORD}
      - ACTIVEPIECES_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY}
    networks:
      - nyra-network
    depends_on:
      postgres-activepieces:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-activepieces:
    image: postgres:15-alpine
    container_name: postgres-activepieces
    restart: unless-stopped
    profiles: [workflows]
    environment:
      - POSTGRES_DB=activepieces
      - POSTGRES_USER=activepieces
      - POSTGRES_PASSWORD=${ACTIVEPIECES_DB_PASSWORD}
    volumes:
      - postgres-activepieces-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "activepieces"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # CRM
  # ---------------------------------------------------------------------------
  twentycrm:
    image: twentycrm/twenty:latest
    container_name: nyra-twentycrm
    restart: unless-stopped
    profiles: [crm]
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://twenty:${TWENTY_DB_PASSWORD}@postgres-twenty:5432/twenty
      - JWT_SECRET=${TWENTY_JWT_SECRET}
    networks:
      - nyra-network
    depends_on:
      postgres-twenty:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ---------------------------------------------------------------------------
  # MEMORY & VECTOR SEARCH
  # ---------------------------------------------------------------------------
  letta:
    image: ghcr.io/letta-ai/letta:latest
    container_name: nyra-letta
    restart: unless-stopped
    profiles: [memory]
    ports:
      - "8283:8283"
    environment:
      - DATABASE_URL=postgresql://letta:${LETTA_DB_PASSWORD}@postgres-letta:5432/letta
      - OPENAI_BASE_URL=http://nexus-router:6000/llm/openai/v1
    networks:
      - nyra-network
    depends_on:
      postgres-letta:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-letta:
    image: postgres:15-alpine
    container_name: postgres-letta
    restart: unless-stopped
    profiles: [memory]
    environment:
      - POSTGRES_DB=letta
      - POSTGRES_USER=letta
      - POSTGRES_PASSWORD=${LETTA_DB_PASSWORD}
    volumes:
      - postgres-letta-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "letta"]
      interval: 10s
      timeout: 5s
      retries: 5

  # RuVector API could be added here if separate from Postgres; placeholder.

  # ---------------------------------------------------------------------------
  # APPS (Quote API, Campaign Engine, Admin UI)
  # ---------------------------------------------------------------------------
  quote-api:
    image: nyra/quote-api:latest
    container_name: nyra-quote-api
    restart: unless-stopped
    profiles: [apps]
    ports:
      - "8001:8001"
    environment:
      - DATABASE_URL=postgresql://nyra:${NYRA_AI_DB_PASSWORD}@postgres-nyra-ai:5432/nyra_ai
      - RATE_PROVIDER_API_KEY=${RATE_PROVIDER_API_KEY}
    networks:
      - nyra-network
    depends_on:
      postgres-nyra_ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  campaign-engine:
    image: nyra/campaign-engine:latest
    container_name: nyra-campaign-engine
    restart: unless-stopped
    profiles: [apps]
    ports:
      - "8002:8002"
    environment:
      - DATABASE_URL=postgresql://nyra:${NYRA_AI_DB_PASSWORD}@postgres-nyra-ai:5432/nyra_ai
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    networks:
      - nyra-network
    depends_on:
      postgres-nyra_ai:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  admin-ui:
    image: nyra/admin-ui:latest
    container_name: nyra-admin-ui
    restart: unless-stopped
    profiles: [apps, ui]
    ports:
      - "3101:3101"
    environment:
      - API_BASE_URL=http://nexus-router:6000
      - CRM_API_URL=http://twentycrm:3000
    networks:
      - nyra-network
    depends_on:
      nexus-router:
        condition: service_healthy
      twentycrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Dify Chat (Borrower assistant)
  dify:
    image: nyra/dify:latest
    container_name: nyra-dify
    restart: unless-stopped
    profiles: [ui]
    ports:
      - "3002:3002"
    environment:
      - DIFY_POSTGRES_URL=postgresql://dify:${DIFY_DB_PASSWORD}@postgres-dify:5432/dify
      - REDIS_URL=redis://redis:6380
      - OLLAMA_URL=http://worker-rtx3060:11434
    networks:
      - nyra-network
    depends_on:
      postgres-dify:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  postgres-dify:
    image: postgres:15-alpine
    container_name: postgres-dify
    restart: unless-stopped
    profiles: [ui]
    environment:
      - POSTGRES_DB=dify
      - POSTGRES_USER=dify
      - POSTGRES_PASSWORD=${DIFY_DB_PASSWORD}
    volumes:
      - postgres-dify-data:/var/lib/postgresql/data
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "dify"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # OPTIONAL MCP SERVERS
  # ---------------------------------------------------------------------------
  # Define additional MCP servers here under the 'mcp' profile.  These can be
  # started on demand via Composio or Docker Desktop MCP toolkit.
  serena:
    image: nyra/serena:latest
    container_name: nyra-serena
    restart: unless-stopped
    profiles: [mcp]
    ports:
      - "8086:8086"
    volumes:
      - ../../:/workspace:ro
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8086/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  gemini-assistant:
    image: nyra/gemini-assistant:latest
    container_name: nyra-gemini
    restart: unless-stopped
    profiles: [mcp]
    ports:
      - "8085:8085"
    environment:
      - GEMINI_API_KEY=${GOOGLE_GEMINI_API_KEY}
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8085/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  nyra-network:
    driver: bridge

volumes:
  nexus-config:
  nexus-logs:
  archon-data:
  archon-logs:
  infisical-data:
  gitea-data:
  postgres-archon-data:
  postgres-gitea-data:
  postgres-infisical-data:
  postgres-twenty-data:
  postgres-nyra-ai-data:
  redis-data:
  falkordb-data:
  prometheus-data:
  grafana-data:
  loki-data:
  n8n-data:
  postgres-n8n-data:
  activepieces-data:
  postgres-activepieces-data:
  postgres-letta-data:
  postgres-dify-data: