# Prometheus Configuration for Orchestrator

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'orchestrator'
    replica: 'primary'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
          # - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - "alerts.yml"
  # - "rules/*.yml"

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          service: 'prometheus'

  # PostgreSQL
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
    metrics_path: /metrics

  # Redis
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  # MinIO
  - job_name: 'minio'
    metrics_path: /minio/v2/metrics/cluster
    static_configs:
      - targets: ['minio:9000']
        labels:
          service: 'minio'

  # Open-WebUI
  - job_name: 'open-webui'
    static_configs:
      - targets: ['open-webui:8080']
        labels:
          service: 'open-webui'
    metrics_path: /metrics

  # LobeChat
  - job_name: 'lobechat'
    static_configs:
      - targets: ['lobechat:3210']
        labels:
          service: 'lobechat'
    metrics_path: /api/metrics

  # Nginx
  - job_name: 'nginx'
    static_configs:
      - targets: ['nginx:80']
        labels:
          service: 'nginx'
    metrics_path: /metrics

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          service: 'grafana'
    metrics_path: /metrics

  # Worker nodes (GPU)
  - job_name: 'worker-gpu'
    static_configs:
      - targets:
        - 'worker-1:9835'  # nvidia-exporter
        - 'worker-2:9835'
        - 'worker-3:9835'
        labels:
          service: 'gpu-worker'
    metrics_path: /metrics

  # Ollama workers
  - job_name: 'ollama'
    static_configs:
      - targets:
        - 'worker-1:11434'
        - 'worker-2:11434'
        - 'worker-3:11434'
        labels:
          service: 'ollama'
    metrics_path: /metrics

  # Node exporters on workers
  - job_name: 'node'
    static_configs:
      - targets:
        - 'worker-1:9100'
        - 'worker-2:9100'
        - 'worker-3:9100'
        labels:
          service: 'node-exporter'

  # Infisical
  - job_name: 'infisical'
    static_configs:
      - targets: ['infisical:8080']
        labels:
          service: 'infisical'
    metrics_path: /api/metrics

