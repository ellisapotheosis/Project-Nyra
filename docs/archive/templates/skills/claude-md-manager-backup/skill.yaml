name: claude-md-manager
version: 1.0.0
description: Manage CLAUDE.md templates - select, customize, and deploy for Project Nyra
author: Project Nyra Team
invocation: /claude-md
tags:
  - templates
  - configuration
  - documentation

arguments:
  - name: action
    type: choice
    choices: [create, update, backup, restore, validate, list, preview]
    required: true
    description: Action to perform on CLAUDE.md

  - name: template_type
    type: choice
    choices: [basic, api, service, app, infrastructure, custom]
    description: Type of template to use

  - name: target_path
    type: string
    description: Path where CLAUDE.md should be created/updated (e.g., services/my-service)

  - name: project_name
    type: string
    description: Project/service name for variable substitution

  - name: tech_stack
    type: string
    description: Technology stack (e.g., FastAPI,Python or NestJS,TypeScript)

  - name: port
    type: number
    description: Service port for API documentation

  - name: backup_location
    type: string
    description: Where to backup CLAUDE.md files (default: docs/templates/claude-md-backups/)

capabilities:
  - Template selection and preview
  - Variable substitution (project name, port, tech stack, description)
  - V3 standards validation
  - Backup/restore operations
  - Batch operations across repository
  - Template composition and merging
  - Git-aware operations

features:
  - 5 base templates (basic, api, service, app, infrastructure)
  - Variable interpolation system
  - YAML validation
  - Git integration for backups
  - Dry-run mode
  - Interactive template builder

constraints:
  - Never overwrite without backup
  - Validate against V3 requirements
  - Maintain mortgage compliance standards
  - Preserve locked architecture references
