openapi: 3.0.3
info:
  title: Nyra Quote Engine API
  description: |
    Mortgage quote generation and rate calculation service for Project Nyra.

    The Quote Engine provides real-time mortgage quotes based on borrower information,
    property details, and current market rates. It integrates with rate providers and
    applies lender-specific rules and overlays.

    **Base URL**: `http://localhost:8001` (development)

    **Production URL**: `https://api.ratehunter.net/quote`
  version: 1.0.0
  contact:
    name: Project Nyra API Support
    email: api@ratehunter.net
  license:
    name: Proprietary

servers:
  - url: http://localhost:8001
    description: Local development server
  - url: http://quote-engine:8001
    description: Docker internal network
  - url: https://api.ratehunter.net/quote
    description: Production API

tags:
  - name: quotes
    description: Mortgage quote generation and management
  - name: rates
    description: Interest rate calculations
  - name: health
    description: Service health and status

paths:
  /health:
    get:
      summary: Health check endpoint
      tags: [health]
      description: Returns service health status and version information
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  version:
                    type: string
                    example: "1.0.0"
                  timestamp:
                    type: string
                    format: date-time

  /quote:
    post:
      summary: Generate mortgage quote
      tags: [quotes]
      description: |
        Generates a personalized mortgage quote based on borrower and property information.

        **Processing time**: < 500ms

        **Rate Sources**:
        - Freddie Mac Primary Mortgage Market Survey
        - Lender rate sheets (updated daily)
        - Market adjustments (real-time)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            examples:
              conventional:
                summary: Conventional loan example
                value:
                  loan_amount: 450000
                  property_value: 550000
                  credit_score: 750
                  employment_status: "full-time"
                  loan_type: "conventional"
                  loan_term: 30
                  property_type: "single_family"
                  occupancy: "primary"
                  zip_code: "90210"
              fha:
                summary: FHA loan example
                value:
                  loan_amount: 320000
                  property_value: 350000
                  credit_score: 680
                  employment_status: "full-time"
                  loan_type: "fha"
                  loan_term: 30
                  property_type: "condo"
                  occupancy: "primary"
                  zip_code: "10001"
      responses:
        '200':
          description: Quote generated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid request parameters
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /quote/{quote_id}:
    get:
      summary: Retrieve existing quote
      tags: [quotes]
      parameters:
        - name: quote_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Unique quote identifier
      responses:
        '200':
          description: Quote retrieved successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '404':
          description: Quote not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'

  /rates:
    get:
      summary: Get current market rates
      tags: [rates]
      description: |
        Returns current mortgage rates for various loan types.

        **Update Frequency**: Every 4 hours

        **Rate Types**:
        - Conventional (30-year, 15-year)
        - FHA (30-year)
        - VA (30-year)
        - USDA (30-year)
      responses:
        '200':
          description: Current rates retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RatesResponse'

  /calculate:
    post:
      summary: Calculate loan payment details
      tags: [quotes]
      description: Calculate monthly payment, total interest, and amortization schedule
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [loan_amount, interest_rate, loan_term]
              properties:
                loan_amount:
                  type: number
                  example: 400000
                interest_rate:
                  type: number
                  format: float
                  example: 6.5
                loan_term:
                  type: integer
                  example: 30
                  description: Loan term in years
      responses:
        '200':
          description: Calculation completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CalculationResponse'

components:
  schemas:
    QuoteRequest:
      type: object
      required:
        - loan_amount
        - property_value
        - credit_score
        - employment_status
      properties:
        loan_amount:
          type: number
          minimum: 50000
          maximum: 10000000
          example: 450000
          description: Requested loan amount in USD
        property_value:
          type: number
          minimum: 50000
          maximum: 15000000
          example: 550000
          description: Property purchase price or appraised value
        credit_score:
          type: integer
          minimum: 300
          maximum: 850
          example: 750
          description: Borrower's FICO credit score
        employment_status:
          type: string
          enum: [full-time, part-time, self-employed, retired, unemployed]
          example: "full-time"
        loan_type:
          type: string
          enum: [conventional, fha, va, usda]
          default: conventional
          example: "conventional"
        loan_term:
          type: integer
          enum: [15, 20, 30]
          default: 30
          description: Loan term in years
        property_type:
          type: string
          enum: [single_family, condo, townhouse, multi_family]
          default: single_family
        occupancy:
          type: string
          enum: [primary, secondary, investment]
          default: primary
        zip_code:
          type: string
          pattern: '^\d{5}$'
          example: "90210"
        down_payment:
          type: number
          description: Down payment amount (calculated from LTV if not provided)
        annual_income:
          type: number
          example: 120000
        monthly_debts:
          type: number
          example: 1500
          description: Total monthly debt obligations

    QuoteResponse:
      type: object
      properties:
        quote_id:
          type: string
          format: uuid
          example: "123e4567-e89b-12d3-a456-426614174000"
        interest_rate:
          type: number
          format: float
          example: 6.375
          description: Annual interest rate (APR)
        monthly_payment:
          type: number
          example: 2808.64
          description: Principal + Interest monthly payment
        total_monthly_payment:
          type: number
          example: 3450.25
          description: PITI (Principal, Interest, Taxes, Insurance)
        loan_amount:
          type: number
          example: 450000
        down_payment:
          type: number
          example: 100000
        ltv_ratio:
          type: number
          format: float
          example: 81.82
          description: Loan-to-Value ratio percentage
        dti_ratio:
          type: number
          format: float
          example: 32.5
          description: Debt-to-Income ratio percentage
        estimated_closing_costs:
          type: number
          example: 12500
        total_interest:
          type: number
          example: 561110.40
          description: Total interest over loan term
        apr:
          type: number
          format: float
          example: 6.511
          description: Annual Percentage Rate (includes fees)
        rate_lock_period:
          type: integer
          example: 60
          description: Days rate is locked
        rate_lock_expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        valid_until:
          type: string
          format: date-time
        lender_info:
          type: object
          properties:
            name:
              type: string
              example: "ABC Mortgage Corp"
            nmls_id:
              type: string
              example: "123456"

    RatesResponse:
      type: object
      properties:
        timestamp:
          type: string
          format: date-time
        rates:
          type: object
          properties:
            conventional_30yr:
              type: number
              format: float
              example: 6.375
            conventional_15yr:
              type: number
              format: float
              example: 5.875
            fha_30yr:
              type: number
              format: float
              example: 6.250
            va_30yr:
              type: number
              format: float
              example: 6.125
            usda_30yr:
              type: number
              format: float
              example: 6.250

    CalculationResponse:
      type: object
      properties:
        monthly_payment:
          type: number
          example: 2528.27
        total_payments:
          type: number
          example: 910177.20
        total_interest:
          type: number
          example: 510177.20
        payoff_date:
          type: string
          format: date

    Error:
      type: object
      properties:
        error:
          type: string
          example: "Invalid credit score"
        code:
          type: string
          example: "VALIDATION_ERROR"
        details:
          type: object

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
