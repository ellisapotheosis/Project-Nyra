openapi: 3.0.3
info:
  title: Nyra Mem0 API
  description: |
    AI memory and context management service for Project Nyra.

    Mem0 provides persistent, semantic memory storage for AI interactions,
    lead context, conversation history, and personalization data across
    all customer touchpoints.

    **Base URL**: `http://localhost:8004` (development)

    **Production URL**: `https://api.projectnyra.com/memory`
  version: 1.0.0
  contact:
    name: Project Nyra API Support
    email: api@ratehunter.net
  license:
    name: Proprietary

servers:
  - url: http://localhost:8004
    description: Local development server
  - url: http://mem0:8004
    description: Docker internal network
  - url: https://api.projectnyra.com/memory
    description: Production API

tags:
  - name: memory
    description: Memory storage and retrieval
  - name: context
    description: Context management
  - name: search
    description: Semantic search
  - name: health
    description: Service health and status

paths:
  /health:
    get:
      summary: Health check endpoint
      tags: [health]
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  vector_db:
                    type: string
                    example: "connected"

  /memory:
    post:
      summary: Store memory
      tags: [memory]
      description: |
        Store a memory entry with vector embeddings for semantic retrieval.

        **Use Cases**:
        - Conversation history
        - User preferences
        - Loan application details
        - Document summaries
        - AI interaction context

        **Storage Duration**: Permanent (unless explicitly deleted)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MemoryRequest'
      responses:
        '201':
          description: Memory stored successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'

    get:
      summary: List memories
      tags: [memory]
      parameters:
        - name: lead_id
          in: query
          schema:
            type: string
          description: Filter by lead ID
        - name: memory_type
          in: query
          schema:
            type: string
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
      responses:
        '200':
          description: Memories retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MemoryResponse'

  /memory/{memory_id}:
    get:
      summary: Retrieve specific memory
      tags: [memory]
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Memory retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MemoryResponse'

    delete:
      summary: Delete memory
      tags: [memory]
      parameters:
        - name: memory_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '204':
          description: Memory deleted

  /search:
    post:
      summary: Semantic search across memories
      tags: [search]
      description: |
        Perform semantic search using natural language queries.

        **Search Algorithm**: Vector similarity using cosine distance

        **Performance**: < 100ms for 1M vectors
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [query]
              properties:
                query:
                  type: string
                  example: "What did the customer say about their budget?"
                lead_id:
                  type: string
                  description: Restrict search to specific lead
                memory_type:
                  type: string
                  description: Filter by memory type
                limit:
                  type: integer
                  default: 10
                  maximum: 100
                threshold:
                  type: number
                  format: float
                  default: 0.7
                  description: Minimum similarity score (0-1)
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                type: object
                properties:
                  results:
                    type: array
                    items:
                      allOf:
                        - $ref: '#/components/schemas/MemoryResponse'
                        - type: object
                          properties:
                            similarity_score:
                              type: number
                              format: float
                  query:
                    type: string
                  total_results:
                    type: integer

  /context/{lead_id}:
    get:
      summary: Get complete lead context
      tags: [context]
      description: |
        Retrieve all context and memory for a specific lead.

        **Includes**:
        - Conversation history
        - Preferences and requirements
        - Document summaries
        - AI interaction summaries
        - Timeline of events

        **Used By**: AI agents for personalized responses
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
        - name: include_vectors
          in: query
          schema:
            type: boolean
            default: false
      responses:
        '200':
          description: Complete context retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LeadContext'

    post:
      summary: Update lead context
      tags: [context]
      description: Add new information to lead's context
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                conversation:
                  type: string
                preferences:
                  type: object
                metadata:
                  type: object
      responses:
        '200':
          description: Context updated

  /summary/{lead_id}:
    get:
      summary: Get AI-generated summary
      tags: [context]
      description: |
        Generate an AI summary of all lead interactions and context.

        **Summary Includes**:
        - Key requirements and preferences
        - Loan application status
        - Outstanding tasks
        - Recommended next actions
        - Risk flags or concerns

      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Summary generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: string
                  key_points:
                    type: array
                    items:
                      type: string
                  next_actions:
                    type: array
                    items:
                      type: string
                  risk_flags:
                    type: array
                    items:
                      type: string
                  generated_at:
                    type: string
                    format: date-time

  /embeddings:
    post:
      summary: Generate embeddings
      tags: [memory]
      description: |
        Generate vector embeddings for text.

        **Model**: text-embedding-ada-002 (OpenAI) or equivalent

        **Dimensions**: 1536
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [text]
              properties:
                text:
                  type: string
                  example: "Customer prefers 30-year fixed rate with minimal closing costs"
      responses:
        '200':
          description: Embeddings generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  embedding:
                    type: array
                    items:
                      type: number
                      format: float
                  dimensions:
                    type: integer
                    example: 1536

components:
  schemas:
    MemoryRequest:
      type: object
      required: [content, lead_id]
      properties:
        content:
          type: string
          example: "Customer expressed interest in 15-year mortgage to save on interest"
        lead_id:
          type: string
        memory_type:
          type: string
          enum: [conversation, preference, document, interaction, note]
          default: conversation
        metadata:
          type: object
          properties:
            source:
              type: string
              example: "chat_bot"
            timestamp:
              type: string
              format: date-time
            importance:
              type: string
              enum: [low, medium, high, critical]
            tags:
              type: array
              items:
                type: string
        embedding:
          type: array
          items:
            type: number
          description: Optional pre-computed embedding (will be generated if not provided)

    MemoryResponse:
      type: object
      properties:
        memory_id:
          type: string
          example: "mem_1234567890"
        content:
          type: string
        lead_id:
          type: string
        memory_type:
          type: string
        metadata:
          type: object
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LeadContext:
      type: object
      properties:
        lead_id:
          type: string
        basic_info:
          type: object
          properties:
            name:
              type: string
            email:
              type: string
            phone:
              type: string
        conversation_history:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              content:
                type: string
              source:
                type: string
        preferences:
          type: object
          description: Extracted preferences and requirements
        timeline:
          type: array
          items:
            type: object
            properties:
              timestamp:
                type: string
                format: date-time
              event:
                type: string
              details:
                type: string
        memory_count:
          type: integer
        last_interaction:
          type: string
          format: date-time
        ai_summary:
          type: string
          description: AI-generated summary of lead's journey

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
