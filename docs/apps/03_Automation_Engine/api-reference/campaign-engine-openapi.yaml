openapi: 3.0.3
info:
  title: Nyra Campaign Engine API
  description: |
    Lead management and campaign automation service for Project Nyra.

    The Campaign Engine manages lead lifecycles, automates drip campaigns,
    tracks engagement metrics, and integrates with email/SMS providers for
    multi-channel outreach.

    **Base URL**: `http://localhost:8002` (development)

    **Production URL**: `https://api.projectnyra.com/campaign`
  version: 1.0.0
  contact:
    name: Project Nyra API Support
    email: api@ratehunter.com
  license:
    name: Proprietary

servers:
  - url: http://localhost:8002
    description: Local development server
  - url: http://campaign-engine:8002
    description: Docker internal network
  - url: https://api.projectnyra.com/campaign
    description: Production API

tags:
  - name: leads
    description: Lead management and tracking
  - name: campaigns
    description: Campaign creation and execution
  - name: engagement
    description: Engagement tracking and analytics
  - name: health
    description: Service health and status

paths:
  /health:
    get:
      summary: Health check endpoint
      tags: [health]
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: "healthy"
                  version:
                    type: string
                    example: "1.0.0"

  /leads:
    post:
      summary: Create or update lead
      tags: [leads]
      description: |
        Register a new lead or update existing lead information.

        **Auto-triggers**:
        - Welcome email sequence
        - Lead scoring calculation
        - Assignment to loan officer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LeadRequest"
      responses:
        "201":
          description: Lead created successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadResponse"
        "200":
          description: Lead updated successfully
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadResponse"

    get:
      summary: List all leads
      tags: [leads]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [new, contacted, quoted, in_progress, approved, closed, dead]
        - name: campaign_id
          in: query
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            maximum: 100
      responses:
        "200":
          description: Leads retrieved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  leads:
                    type: array
                    items:
                      $ref: "#/components/schemas/LeadResponse"
                  total:
                    type: integer
                  page:
                    type: integer
                  pages:
                    type: integer

  /leads/{lead_id}:
    get:
      summary: Get lead details
      tags: [leads]
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Lead details retrieved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LeadDetailResponse"

    patch:
      summary: Update lead status
      tags: [leads]
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum:
                    [
                      new,
                      contacted,
                      quoted,
                      in_progress,
                      approved,
                      closed,
                      dead,
                    ]
                notes:
                  type: string
      responses:
        "200":
          description: Lead updated successfully

  /campaigns:
    post:
      summary: Create new campaign
      tags: [campaigns]
      description: |
        Create a new email or SMS drip campaign.

        **Campaign Types**:
        - Welcome sequence (new leads)
        - Nurture sequence (engaged leads)
        - Re-engagement (cold leads)
        - Rate alerts (market updates)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CampaignRequest"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignResponse"

    get:
      summary: List all campaigns
      tags: [campaigns]
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [draft, active, paused, completed]
      responses:
        "200":
          description: Campaigns retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CampaignResponse"

  /campaigns/{campaign_id}:
    get:
      summary: Get campaign details
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Campaign details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CampaignDetailResponse"

    patch:
      summary: Update campaign
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                status:
                  type: string
                  enum: [active, paused, completed]
      responses:
        "200":
          description: Campaign updated

  /campaigns/{campaign_id}/enroll:
    post:
      summary: Enroll lead in campaign
      tags: [campaigns]
      parameters:
        - name: campaign_id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [lead_id]
              properties:
                lead_id:
                  type: string
      responses:
        "200":
          description: Lead enrolled successfully

  /engagement/track:
    post:
      summary: Track engagement event
      tags: [engagement]
      description: |
        Record engagement events (email opens, clicks, form submissions).

        **Event Types**:
        - email_open
        - email_click
        - link_click
        - form_submission
        - document_upload
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EngagementEvent"
      responses:
        "200":
          description: Event tracked

  /engagement/{lead_id}:
    get:
      summary: Get lead engagement history
      tags: [engagement]
      parameters:
        - name: lead_id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Engagement history retrieved
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EngagementEvent"

components:
  schemas:
    LeadRequest:
      type: object
      required: [email, firstName, lastName]
      properties:
        email:
          type: string
          format: email
          example: "john.smith@example.com"
        firstName:
          type: string
          example: "John"
        lastName:
          type: string
          example: "Smith"
        phone:
          type: string
          example: "+1-555-123-4567"
        loanAmount:
          type: number
          example: 450000
        creditScore:
          type: integer
          example: 750
        leadSource:
          type: string
          example: "website"
        utmSource:
          type: string
        utmMedium:
          type: string
        utmCampaign:
          type: string

    LeadResponse:
      type: object
      properties:
        lead_id:
          type: string
          example: "lead_1234567890"
        email:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [new, contacted, quoted, in_progress, approved, closed, dead]
        lead_score:
          type: integer
          minimum: 0
          maximum: 100
          example: 85
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    LeadDetailResponse:
      allOf:
        - $ref: "#/components/schemas/LeadResponse"
        - type: object
          properties:
            campaigns:
              type: array
              items:
                type: object
                properties:
                  campaign_id:
                    type: string
                  campaign_name:
                    type: string
                  enrolled_at:
                    type: string
                    format: date-time
            engagement_summary:
              type: object
              properties:
                total_emails_sent:
                  type: integer
                emails_opened:
                  type: integer
                links_clicked:
                  type: integer
                last_interaction:
                  type: string
                  format: date-time
            notes:
              type: array
              items:
                type: object
                properties:
                  note:
                    type: string
                  created_by:
                    type: string
                  created_at:
                    type: string
                    format: date-time

    CampaignRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          example: "First-Time Buyers Q1 2026"
        type:
          type: string
          enum: [welcome, nurture, reengagement, rate_alert]
        description:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              delay_days:
                type: integer
                description: Days after previous step
              channel:
                type: string
                enum: [email, sms, both]
              template_id:
                type: string
              subject:
                type: string
              content:
                type: string

    CampaignResponse:
      type: object
      properties:
        campaign_id:
          type: string
        name:
          type: string
        type:
          type: string
        status:
          type: string
          enum: [draft, active, paused, completed]
        total_leads:
          type: integer
        active_leads:
          type: integer
        created_at:
          type: string
          format: date-time

    CampaignDetailResponse:
      allOf:
        - $ref: "#/components/schemas/CampaignResponse"
        - type: object
          properties:
            steps:
              type: array
              items:
                type: object
            metrics:
              type: object
              properties:
                emails_sent:
                  type: integer
                emails_opened:
                  type: integer
                links_clicked:
                  type: integer
                conversions:
                  type: integer
                open_rate:
                  type: number
                  format: float
                click_rate:
                  type: number
                  format: float
                conversion_rate:
                  type: number
                  format: float

    EngagementEvent:
      type: object
      required: [lead_id, event_type]
      properties:
        lead_id:
          type: string
        event_type:
          type: string
          enum:
            [
              email_open,
              email_click,
              link_click,
              form_submission,
              document_upload,
            ]
        campaign_id:
          type: string
        metadata:
          type: object
        timestamp:
          type: string
          format: date-time

  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key

security:
  - ApiKeyAuth: []
