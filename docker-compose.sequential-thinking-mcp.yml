# Docker Compose for Sequential Thinking MCP Server
# Enables step-by-step reasoning and structured problem-solving
version: '3.8'

services:
  # Sequential Thinking MCP Server
  sequential-thinking-mcp:
    build:
      context: ./mcp-servers/sequential-thinking-mcp
      dockerfile: Dockerfile
    image: nyra/sequential-thinking-mcp:latest
    container_name: nyra-sequential-thinking-mcp
    ports:
      - "8093:8093"
    volumes:
      # Persistent storage for thought processes
      - sequential-thinking-data:/app/data
      # Optional: Mount custom configuration
      - ./config/sequential-thinking:/app/config:ro
    environment:
      # MCP Server Configuration
      - NODE_ENV=production
      - MCP_SERVER_NAME=sequential-thinking
      - MCP_SERVER_VERSION=1.0.0

      # Logging Configuration
      - LOG_LEVEL=${SEQ_THINKING_LOG_LEVEL:-info}
      - LOG_FORMAT=${SEQ_THINKING_LOG_FORMAT:-json}

      # Performance Tuning
      - NODE_OPTIONS=--max-old-space-size=2048

      # Feature Flags
      - ENABLE_REVISIONS=${SEQ_THINKING_ENABLE_REVISIONS:-true}
      - ENABLE_BRANCHING=${SEQ_THINKING_ENABLE_BRANCHING:-true}
      - ENABLE_DYNAMIC_ADJUSTMENT=${SEQ_THINKING_ENABLE_DYNAMIC_ADJUSTMENT:-true}

      # Limits
      - MAX_THOUGHTS=${SEQ_THINKING_MAX_THOUGHTS:-100}
      - MAX_BRANCHES=${SEQ_THINKING_MAX_BRANCHES:-10}
      - TIMEOUT_MS=${SEQ_THINKING_TIMEOUT_MS:-30000}
    networks:
      - nyra-mcp
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "pgrep", "-f", "sequential-thinking"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    labels:
      - "com.project-nyra.service=sequential-thinking-mcp"
      - "com.project-nyra.type=mcp-server"
      - "com.project-nyra.category=reasoning"

  # Optional: Monitoring with Prometheus
  prometheus-seq-thinking:
    image: prom/prometheus:latest
    container_name: nyra-prometheus-seq-thinking
    ports:
      - "9094:9090"
    volumes:
      - ./config/prometheus/sequential-thinking.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-seq-thinking-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.enable-lifecycle'
    networks:
      - nyra-mcp
    restart: unless-stopped
    profiles:
      - monitoring

  # Optional: Grafana Dashboard
  grafana-seq-thinking:
    image: grafana/grafana:latest
    container_name: nyra-grafana-seq-thinking
    ports:
      - "3002:3000"
    volumes:
      - grafana-seq-thinking-data:/var/lib/grafana
      - ./config/grafana/sequential-thinking:/etc/grafana/provisioning:ro
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3002
    depends_on:
      - prometheus-seq-thinking
    networks:
      - nyra-mcp
    restart: unless-stopped
    profiles:
      - monitoring

volumes:
  sequential-thinking-data:
    name: nyra-sequential-thinking-data
  prometheus-seq-thinking-data:
    name: nyra-prometheus-seq-thinking-data
  grafana-seq-thinking-data:
    name: nyra-grafana-seq-thinking-data

networks:
  nyra-mcp:
    name: nyra-mcp-network
    driver: bridge
    external: true
