# Docker Compose for Docker MCP Server
# Provides Docker operations through Model Context Protocol

version: '3.8'

services:
  # Docker MCP Server
  docker-mcp:
    build:
      context: ./mcp-servers/docker-mcp
      dockerfile: Dockerfile
    container_name: nyra-docker-mcp
    restart: unless-stopped

    # Mount Docker socket for Docker operations
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - docker-mcp-data:/app/data

    # Environment variables
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - DOCKER_HOST=unix:///var/run/docker.sock

    # Network configuration
    networks:
      - nyra-mcp

    # Security options
    security_opt:
      - no-new-privileges:true

    # Resource limits
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          cpus: '0.5'
          memory: 256M

    # Health check
    healthcheck:
      test: ["CMD", "node", "-e", "console.log('healthy')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Logging configuration
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  docker-mcp-data:
    name: nyra-docker-mcp-data
    driver: local

networks:
  nyra-mcp:
    name: nyra-mcp-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
