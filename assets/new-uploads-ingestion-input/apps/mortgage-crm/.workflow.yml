# Mortgage CRM - TDD London School + Enterprise Grade Workflow Configuration

metadata:
  name: "Mortgage CRM System"
  version: "1.0.0"
  methodology: "TDD London School + Enterprise Grade"
  complexity: "MEDIUM-HIGH"
  estimated_duration: "10-14 weeks"
  created_at: "2025-12-31"

project:
  description: "Enterprise mortgage CRM with compliance and workflow automation"
  goals:
    - "Compliant mortgage processing (RESPA, TILA, HMDA)"
    - "Secure financial data handling"
    - "Automated workflow management"
    - "Comprehensive audit trails"
    - "High availability (99.9%+ uptime)"

  tech_stack:
    backend:
      runtime: "Node.js 20 LTS"
      language: "TypeScript 5.3"
      framework: "NestJS 10"
      database:
        primary: "PostgreSQL 16"
        cache: "Redis 7"
        search: "Elasticsearch 8"
      orm: "Prisma 5"
      validation: "class-validator + class-transformer"

    frontend:
      framework: "Next.js 14 (React 18)"
      language: "TypeScript 5.3"
      styling: "Tailwind CSS + shadcn/ui"
      state: "Zustand + React Query"
      forms: "React Hook Form + Zod"
      tables: "TanStack Table"
      charts: "Recharts"

    testing:
      unit: "Jest"
      integration: "Supertest"
      e2e: "Playwright"
      contract: "Pact"

    infrastructure:
      hosting: "AWS / GCP / Azure"
      containers: "Docker + Kubernetes"
      ci_cd: "GitHub Actions"
      monitoring:
        apm: "New Relic / Datadog"
        errors: "Sentry"
        logs: "CloudWatch / Stackdriver"
      security:
        waf: "Cloudflare"
        secrets: "AWS Secrets Manager / Vault"
        scanning: "Snyk + SonarQube"

# TDD London School + Enterprise Grade Phases

phases:
  - id: "architecture"
    name: "Enterprise Architecture & Foundation"
    duration: "2 weeks"
    description: "ADRs, database design, security infrastructure, CI/CD"

    tasks:
      - name: "Architecture Decision Records"
        agent: "system-architect"
        priority: "critical"
        estimated_hours: 12
        deliverables:
          - "ADR-001: Hexagonal Architecture"
          - "ADR-002: Security Model (OAuth 2.0 + OIDC)"
          - "ADR-003: Compliance Framework"
          - "ADR-004: Database (PostgreSQL + Prisma)"
          - "ADR-005: API Design (REST + GraphQL)"
        success_metrics:
          - "All ADRs reviewed and approved"
          - "Architecture constraints documented"

      - name: "Database Schema Design"
        agent: "system-architect"
        priority: "critical"
        estimated_hours: 20
        deliverables:
          - "Complete ER diagram"
          - "Prisma schema with all entities"
          - "Database migrations"
          - "Seed data for development"
        success_metrics:
          - "All entities and relationships defined"
          - "Indexes for performance"
          - "Audit trail tables"

      - name: "Security Infrastructure"
        agent: "security-manager"
        priority: "critical"
        estimated_hours: 16
        deliverables:
          - "Auth0/Clerk integration"
          - "RBAC middleware"
          - "Field-level encryption (SSN, etc.)"
          - "Audit logging"
        success_metrics:
          - "Authentication working"
          - "Authorization tested"
          - "Sensitive data encrypted"
          - "All actions audited"

      - name: "CI/CD Pipeline Setup"
        agent: "cicd-engineer"
        priority: "high"
        estimated_hours: 12
        deliverables:
          - "GitHub Actions workflow"
          - "Automated testing"
          - "Database migrations in pipeline"
          - "Staging deployment"
          - "Production deployment (with approval)"
        success_metrics:
          - "Tests run on every PR"
          - "Deployments automated"

    quality_gates:
      - "All ADRs approved"
      - "Database schema reviewed"
      - "Security audit passed"
      - "CI/CD pipeline working"

  - id: "domain_tdd"
    name: "Core Domain - TDD London School Implementation"
    duration: "3 weeks"
    description: "Outside-in TDD for lead management, loan application, compliance"
    dependencies: ["architecture"]

    tdd_cycles:
      - id: "cycle-1-leads"
        name: "Lead Management Domain"
        duration: "1 week"
        description: "TDD cycle for lead entity and use cases"

        tasks:
          - name: "Write Acceptance Tests (Outside)"
            agent: "tester"
            priority: "critical"
            estimated_hours: 8
            test_first: true
            deliverables:
              - "CreateLeadUseCase tests (with mocks)"
              - "UpdateLeadStatusUseCase tests"
              - "AssignLeadUseCase tests"
            success_metrics:
              - "Tests written before implementation"
              - "All interfaces mocked"

          - name: "Implement Use Cases"
            agent: "coder"
            priority: "critical"
            estimated_hours: 16
            test_first: true
            deliverables:
              - "CreateLeadUseCase implementation"
              - "UpdateLeadStatusUseCase implementation"
              - "AssignLeadUseCase implementation"
            success_metrics:
              - "Acceptance tests passing"
              - "No implementation without tests"

          - name: "Write Domain Entity Tests (Inside)"
            agent: "tester"
            priority: "critical"
            estimated_hours: 12
            test_first: true
            deliverables:
              - "Lead entity creation tests"
              - "State transition tests"
              - "Business rule tests"
            success_metrics:
              - "All business rules tested"
              - "Invalid transitions rejected"

          - name: "Implement Lead Entity"
            agent: "coder"
            priority: "critical"
            estimated_hours: 16
            test_first: true
            deliverables:
              - "Lead aggregate root"
              - "State machine implementation"
              - "Business rules (scoring, qualification)"
              - "Domain events"
            success_metrics:
              - "Domain tests passing"
              - "Test coverage > 90%"

        quality_gates:
          - "All tests passing"
          - "Test coverage > 90%"
          - "No business logic without tests"

      - id: "cycle-2-applications"
        name: "Loan Application Domain"
        duration: "1 week"
        dependencies: ["cycle-1-leads"]

        tasks:
          - name: "Write Application Use Case Tests"
            agent: "tester"
            priority: "critical"
            estimated_hours: 12
            test_first: true
            deliverables:
              - "SubmitApplicationUseCase tests"
              - "ProcessApplicationUseCase tests"
              - "AUS integration tests (mocked)"

          - name: "Implement Application Use Cases"
            agent: "coder"
            priority: "critical"
            estimated_hours: 16
            test_first: true

          - name: "Write Application Entity Tests"
            agent: "tester"
            priority: "critical"
            estimated_hours: 12
            test_first: true
            deliverables:
              - "LoanApplication entity tests"
              - "Milestone tracking tests"
              - "Condition management tests"

          - name: "Implement LoanApplication Entity"
            agent: "coder"
            priority: "critical"
            estimated_hours: 16
            test_first: true

        quality_gates:
          - "All tests passing"
          - "Test coverage > 90%"

      - id: "cycle-3-compliance"
        name: "Compliance Engine"
        duration: "1 week"
        dependencies: ["cycle-2-applications"]

        tasks:
          - name: "Write Compliance Tests"
            agent: "tester"
            priority: "critical"
            estimated_hours: 12
            test_first: true
            deliverables:
              - "LE generation tests"
              - "CD generation tests"
              - "Timing rule tests"
              - "HMDA data collection tests"

          - name: "Implement Compliance Engine"
            agent: "coder"
            priority: "critical"
            estimated_hours: 24
            test_first: true
            deliverables:
              - "Loan Estimate generator"
              - "Closing Disclosure generator"
              - "3-day rule enforcement"
              - "HMDA LAR generation"
              - "Adverse action notices"

        quality_gates:
          - "All compliance tests passing"
          - "Test coverage > 95% (critical)"
          - "Timing rules validated"

    overall_quality_gates:
      - "Overall test coverage > 90%"
      - "All domain tests passing"
      - "No mock leakage to domain"
      - "Contract tests for repositories"

  - id: "api_layer"
    name: "API & Integration Layer"
    duration: "2 weeks"
    description: "TDD for REST API endpoints and external integrations"
    dependencies: ["domain_tdd"]

    tasks:
      - name: "REST API Endpoints (TDD)"
        agent: "backend-dev"
        priority: "critical"
        estimated_hours: 40
        test_first: true
        deliverables:
          - "Lead CRUD endpoints with tests"
          - "Application CRUD endpoints with tests"
          - "Pipeline management endpoints"
          - "Document upload/download endpoints"
        success_metrics:
          - "All endpoint tests passing"
          - "Test coverage > 90%"

      - name: "GraphQL API (Optional)"
        agent: "backend-dev"
        priority: "medium"
        estimated_hours: 20
        test_first: true
        deliverables:
          - "GraphQL schema"
          - "Query resolvers with tests"
          - "Mutation resolvers with tests"
          - "Subscription resolvers"

      - name: "External Service Integration (Mock-First)"
        agent: "backend-dev"
        priority: "high"
        estimated_hours: 40
        test_first: true
        deliverables:
          - "Credit bureau interface + mock"
          - "AUS integration + mock"
          - "E-signature service + mock"
          - "Document storage (S3/Azure Blob)"
        success_metrics:
          - "Mock implementations working"
          - "Contract tests for external services"
          - "Integration tests passing"

      - name: "API Documentation"
        agent: "api-docs"
        priority: "medium"
        estimated_hours: 12
        deliverables:
          - "OpenAPI/Swagger specification"
          - "Postman collection"
          - "API usage examples"

    quality_gates:
      - "All API tests passing"
      - "Integration tests passing"
      - "API documentation complete"

  - id: "frontend"
    name: "Frontend Application"
    duration: "3 weeks"
    description: "React-based admin dashboard, borrower portal, reporting"
    dependencies: ["api_layer"]

    tasks:
      - name: "Loan Officer Dashboard (TDD)"
        agent: "coder"
        priority: "critical"
        estimated_hours: 40
        test_first: true
        deliverables:
          - "Pipeline kanban board (drag-and-drop)"
          - "Lead list with filters/search"
          - "Task management"
          - "Real-time notifications (WebSockets)"
        success_metrics:
          - "Component tests passing"
          - "E2E tests for critical flows"
          - "Test coverage > 80%"

      - name: "Borrower Portal"
        agent: "coder"
        priority: "medium"
        estimated_hours: 32
        test_first: true
        deliverables:
          - "Application status tracking"
          - "Document upload interface"
          - "Communication with loan officer"
          - "E-signature workflow"
        success_metrics:
          - "All features working"
          - "Responsive design"

      - name: "Admin Panel"
        agent: "coder"
        priority: "high"
        estimated_hours: 32
        test_first: true
        deliverables:
          - "User management"
          - "Role/permission management"
          - "System configuration"
          - "Audit log viewer"

      - name: "Reporting & Analytics"
        agent: "analyst"
        priority: "medium"
        estimated_hours: 16
        deliverables:
          - "Pipeline metrics dashboard"
          - "Conversion funnel reports"
          - "Performance reports"
          - "Commission tracking"

    quality_gates:
      - "All component tests passing"
      - "E2E tests for critical flows passing"
      - "Test coverage > 80%"
      - "Responsive on mobile"

  - id: "enterprise_features"
    name: "Enterprise Features & Polish"
    duration: "2 weeks"
    description: "Workflow automation, advanced reporting, performance optimization"
    dependencies: ["frontend"]

    tasks:
      - name: "Workflow Automation"
        agent: "backend-dev"
        priority: "medium"
        estimated_hours: 32
        deliverables:
          - "Rule-based automation engine"
          - "Auto-assignment rules"
          - "Auto-email triggers"
          - "Task auto-generation"
        success_metrics:
          - "Automation tests passing"
          - "Rules customizable"

      - name: "Advanced Reporting"
        agent: "analyst"
        priority: "medium"
        estimated_hours: 24
        deliverables:
          - "Custom report builder"
          - "Scheduled reports"
          - "Report templates"
          - "Export functionality (CSV, PDF)"

      - name: "Performance Optimization"
        agent: "optimizer"
        priority: "critical"
        estimated_hours: 24
        deliverables:
          - "Database query optimization"
          - "Caching strategy (Redis)"
          - "Background job processing (Celery)"
          - "Load testing results"
        success_metrics:
          - "API response < 500ms (p95)"
          - "Database queries < 100ms (p95)"
          - "Load testing passed (100+ concurrent users)"

    quality_gates:
      - "Performance benchmarks met"
      - "Automation working"
      - "Reports functional"

  - id: "testing_audit"
    name: "Testing & Compliance Audit"
    duration: "2 weeks"
    description: "QA, security audit, compliance verification"
    dependencies: ["enterprise_features"]

    tasks:
      - name: "Comprehensive QA Testing"
        agent: "tester"
        priority: "critical"
        estimated_hours: 24
        deliverables:
          - "All functional tests executed"
          - "All integration tests passed"
          - "E2E test suite complete"
          - "Bug fixes completed"
        success_metrics:
          - "Zero critical bugs"
          - "Zero high-severity bugs"
          - "Test coverage > 85%"

      - name: "Security Audit"
        agent: "security-manager"
        priority: "critical"
        estimated_hours: 16
        deliverables:
          - "Penetration testing report"
          - "Vulnerability scan results"
          - "Security best practices checklist"
          - "SOC 2 Type II preparation"
        success_metrics:
          - "Zero critical vulnerabilities"
          - "Zero high vulnerabilities"
          - "Security audit passed"

      - name: "Compliance Verification"
        agent: "reviewer"
        priority: "critical"
        estimated_hours: 20
        deliverables:
          - "RESPA compliance verified"
          - "TILA compliance verified"
          - "HMDA reporting tested"
          - "Audit trail completeness verified"
          - "Legal review completed"
        success_metrics:
          - "100% compliance checklist complete"
          - "Legal approval obtained"

      - name: "Performance Testing"
        agent: "tester"
        priority: "high"
        estimated_hours: 12
        deliverables:
          - "Load testing (100+ concurrent users)"
          - "Stress testing"
          - "Endurance testing"
        success_metrics:
          - "99.9% uptime under load"
          - "No memory leaks"

    quality_gates:
      - "All tests passing"
      - "Zero critical issues"
      - "Security audit passed"
      - "Compliance verified"
      - "Performance benchmarks met"

