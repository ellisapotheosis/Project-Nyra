# TDD London School Configuration

tdd:
  methodology: "london_school"
  approach: "outside_in"

  principles:
    - "Always write tests before implementation"
    - "Use mocks for all external dependencies"
    - "Start with acceptance tests (outside)"
    - "Work inward to unit tests"
    - "Refactor only when tests are green"

  mock_strategy:
    - "Mock repositories in use cases"
    - "Mock use cases in API controllers"
    - "Mock external services always"
    - "Use contract tests for mock validation"

  test_pyramid:
    unit: 70  # percent
    integration: 20
    contract: 5
    e2e: 5

  red_green_refactor:
    - "RED: Write failing test"
    - "GREEN: Make test pass (simplest way)"
    - "REFACTOR: Improve code while keeping tests green"

# Enterprise Grade Configuration

enterprise:
  compliance:
    regulations:
      - "RESPA"
      - "TILA"
      - "HMDA"
      - "ECOA"
      - "GLB Safeguards"
      - "GDPR (if EU customers)"
      - "CCPA"

    requirements:
      - "Disclosure timing (3-day rule)"
      - "Data retention (5-7 years)"
      - "Audit trail (all changes logged)"
      - "Security (SOC 2 Type II)"
      - "Adverse action notices"

  security:
    authentication: "OAuth 2.0 + OIDC"
    authorization: "RBAC"
    encryption:
      at_rest: "AES-256"
      in_transit: "TLS 1.3"
      field_level: ["ssn", "account_numbers", "dob"]
    audit:
      all_actions: true
      retention: "7 years"

  documentation:
    required:
      - "Architecture Decision Records"
      - "API documentation (OpenAPI)"
      - "Database schema documentation"
      - "Security documentation"
      - "Compliance documentation"
      - "User manuals"
      - "Admin manuals"

# Parallel Execution

parallel_execution:
  architecture_phase:
    - ["Architecture Decision Records", "Database Schema Design"]

  domain_tdd_phase:
    cycle_1:
      - ["Write Acceptance Tests", "Write Domain Entity Tests"]
    cycle_2:
      - ["Write Application Use Case Tests", "Write Application Entity Tests"]

  api_layer_phase:
    - ["REST API Endpoints", "External Service Integration"]

  frontend_phase:
    - ["Loan Officer Dashboard", "Borrower Portal"]

  testing_audit_phase:
    - ["Comprehensive QA", "Security Audit"]

# Quality Metrics

quality_metrics:
  test_coverage:
    overall: 85
    domain_logic: 90
    compliance_engine: 95
    api_endpoints: 90

  performance:
    api_response_p95: 500  # ms
    database_query_p95: 100  # ms
    page_load: 3000  # ms
    time_to_interactive: 5000  # ms
    uptime: 99.9  # percent

  code_quality:
    eslint_errors: 0
    typescript_errors: 0
    sonarqube_rating: "A"
    code_duplication: 5  # max percent

  security:
    critical_vulnerabilities: 0
    high_vulnerabilities: 0
    medium_vulnerabilities: 5  # max

