# Risk Management

risks:
  - id: "risk-1"
    description: "Data breach / security incident"
    impact: "critical"
    probability: "medium"
    mitigation:
      - "SOC 2 Type II compliance"
      - "Regular security audits"
      - "Penetration testing"
      - "Field-level encryption"
      - "Comprehensive audit logging"

  - id: "risk-2"
    description: "Compliance violations"
    impact: "critical"
    probability: "medium"
    mitigation:
      - "Automated compliance checks"
      - "Regular compliance audits"
      - "Legal review of templates"
      - "Timing rules in code"
      - "Comprehensive audit trails"

  - id: "risk-3"
    description: "Data loss"
    impact: "critical"
    probability: "low"
    mitigation:
      - "Automated daily backups"
      - "Point-in-time recovery"
      - "Geographic redundancy"
      - "Backup testing"
      - "Document versioning"

  - id: "risk-4"
    description: "System downtime"
    impact: "high"
    probability: "medium"
    mitigation:
      - "High availability architecture"
      - "Load balancing"
      - "Auto-scaling"
      - "Health monitoring"
      - "Incident response procedures"

  - id: "risk-5"
    description: "Incorrect calculations"
    impact: "critical"
    probability: "low"
    mitigation:
      - "100% test coverage for calculations"
      - "Test against known scenarios"
      - "Third-party library validation"
      - "Manual verification in staging"

# Automation Hooks

hooks:
  pre_task:
    - "npx claude-flow@alpha hooks pre-task --description '{{task.name}}'"
    - "npx claude-flow@alpha hooks session-restore --session-id 'mortgage-crm-{{phase.id}}'"

  post_edit:
    - "npx claude-flow@alpha hooks post-edit --file '{{file.path}}' --memory-key 'mortgage-crm/{{agent.type}}/{{task.id}}'"
    - "npx prettier --write '{{file.path}}'"

  post_test:
    - "npx claude-flow@alpha hooks notify --message 'Tests completed: {{test.results}}'"

  post_task:
    - "npx claude-flow@alpha hooks post-task --task-id '{{task.id}}'"
    - "npx claude-flow@alpha memory store --key 'mortgage-crm/{{phase.id}}/{{task.id}}/complete' --value '{{timestamp}}'"

  session_end:
    - "npx claude-flow@alpha hooks session-end --export-metrics true"
