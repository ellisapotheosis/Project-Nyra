
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nyra Voicemod • Options</title>
    <link rel="icon" href="icons/favicon.ico">
    <style>
      body { font: 14px/1.4 Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto; padding: 20px; background:#0b0b12; color:#e8e6ff; }
      label { display:block; margin: 12px 0 6px; }
      input[type="text"] { width: 480px; max-width:100%; padding:8px; border-radius:8px; border:1px solid #2b2550; background:#131325; color:white; }
      .row{ display:flex; gap:12px; align-items:center; }
      button{ background:#7C3AED; color:white; border:none; border-radius:8px; padding:8px 12px; cursor:pointer; }
      button:hover{ background:#8F00FF; }
      small { color:#a899ff; }
    </style>
  </head>
  <body>
    <h1>Nyra Voicemod • Options</h1>
    <label>Voicemod API Key <small>(from Voicemod Dev portal)</small></label>
    <input id="apiKey" type="text" placeholder="VM-XXXXXXXXXXXXXXXXX" />
    <div class="row">
      <button id="save">Save</button>
      <span id="status"></span>
    </div>

    <label>Default Soundboard Name</label>
    <input id="boardName" type="text" value="Nyra" />

    <label>TTS voice (Chrome)</label>
    <input id="ttsVoiceName" type="text" placeholder="leave blank for default" />

    <script src="options.js"></script>
  </body>
</html>
