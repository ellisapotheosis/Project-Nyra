
<!doctype html>
<html>
  <head><meta charset="utf-8"><title>NYRA Automator v2.0</title><link rel="stylesheet" href="styles.css"></head>
  <body>
    <h1>🧬 NYRA Automator v2.0</h1>
    <p>Panel controls if it’s hidden.</p>
    <div style="display:flex;gap:8px;flex-wrap:wrap;">
      <button id="toggle">Show / Hide Panel</button>
      <button id="center">Center Panel</button>
    </div>
    <script>
      document.getElementById('toggle').onclick = async () => {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        if (tab?.id) chrome.tabs.sendMessage(tab.id, { type: 'nyra_toggle_panel' });
      };
      document.getElementById('center').onclick = async () => {
        const [tab] = await chrome.tabs.query({ active: true, currentWindow: true });
        if (tab?.id) chrome.tabs.sendMessage(tab.id, { type: 'centerPanel' });
      };
    </script>
  </body>
</html>
