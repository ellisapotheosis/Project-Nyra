name: GitHub Sync Monitor

on:
  schedule:
    - cron: '*/30 * * * *'  # Every 30 minutes
  workflow_dispatch:

jobs:
  check-sync:
    name: Check GitHub Sync Status
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Gitea repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Check GitHub mirror
        id: check-github
        run: |
          # Add GitHub as remote if not exists
          if ! git remote | grep -q github; then
            git remote add github https://github.com/${{ github.repository }}.git
          fi

          # Fetch from GitHub
          git fetch github main --depth=10

          # Compare commits
          LOCAL_COMMIT=$(git rev-parse HEAD)
          GITHUB_COMMIT=$(git rev-parse github/main)

          echo "Local commit: $LOCAL_COMMIT"
          echo "GitHub commit: $GITHUB_COMMIT"

          if [ "$LOCAL_COMMIT" != "$GITHUB_COMMIT" ]; then
            echo "sync_status=out-of-sync" >> $GITHUB_OUTPUT
            echo "Repositories are out of sync!"
          else
            echo "sync_status=synced" >> $GITHUB_OUTPUT
            echo "Repositories are in sync"
          fi

      - name: Check sync lag
        if: steps.check-github.outputs.sync_status == 'out-of-sync'
        run: |
          # Calculate commits behind
          COMMITS_BEHIND=$(git rev-list --count HEAD..github/main)
          COMMITS_AHEAD=$(git rev-list --count github/main..HEAD)

          echo "Commits behind GitHub: $COMMITS_BEHIND"
          echo "Commits ahead of GitHub: $COMMITS_AHEAD"

          if [ "$COMMITS_BEHIND" -gt 5 ] || [ "$COMMITS_AHEAD" -gt 5 ]; then
            echo "Significant sync lag detected!"
            exit 1
          fi

      - name: Test GitHub Actions
        run: |
          # Check if GitHub Actions workflows are accessible
          curl -s -f -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows" || {
              echo "Failed to access GitHub Actions"
              exit 1
            }

      - name: Verify workflow runs
        run: |
          # Check recent GitHub Actions runs
          response=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/actions/runs?per_page=5")

          # Check if there are recent runs
          total=$(echo "$response" | jq '.total_count')

          if [ "$total" -eq 0 ]; then
            echo "No recent GitHub Actions runs found"
            exit 1
          fi

          echo "Found $total recent workflow runs on GitHub"

  alert-on-failure:
    name: Alert on Sync Failure
    runs-on: ubuntu-latest
    needs: check-sync
    if: failure()

    steps:
      - name: Create alert issue
        uses: actions/github-script@v7
        with:
          script: |
            const title = 'GitHub Sync Alert - ' + new Date().toISOString();
            const body = `## GitHub Sync Issue Detected

            The GitHub mirror sync check has failed. This could indicate:

            - Sync is lagging behind Gitea
            - GitHub Actions are not running
            - Network connectivity issues
            - Authentication problems

            **Action Required**: Please check the sync configuration and GitHub Actions status.

            **Workflow Run**: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`;

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: title,
              body: body,
              labels: ['infrastructure', 'sync', 'urgent']
            });

      - name: Send notification
        run: |
          echo "GitHub sync check failed - notification would be sent here"
          # Add webhook notification, email, or Slack alert
