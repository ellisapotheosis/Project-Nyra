name: Gitea Local CI

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_ENV: test

jobs:
  quick-check:
    name: Quick CI Check
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Quick lint
        run: npm run lint -- --max-warnings 10

      - name: Type check
        run: npm run typecheck

      - name: Run unit tests
        run: npm run test:unit -- --maxWorkers=50%
        env:
          CI: true

      - name: Build check
        run: npm run build

  local-integration:
    name: Local Integration Tests
    runs-on: ubuntu-latest
    needs: quick-check
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Start local services
        run: |
          docker compose -f docker-compose.dev.yml up -d postgres redis

          # Wait for services
          timeout 60s bash -c 'until docker compose exec -T postgres pg_isready; do sleep 2; done'
          timeout 60s bash -c 'until docker compose exec -T redis redis-cli ping | grep -q PONG; do sleep 2; done'

      - name: Run migrations
        run: npm run db:migrate

      - name: Run integration tests
        run: npm run test:integration
        env:
          DATABASE_URL: postgresql://user:password@localhost:5432/testdb
          REDIS_URL: redis://localhost:6379

      - name: Cleanup
        if: always()
        run: docker compose -f docker-compose.dev.yml down -v

  status:
    name: CI Status
    runs-on: ubuntu-latest
    needs: [quick-check, local-integration]
    if: always()

    steps:
      - name: Check results
        run: |
          if [ "${{ needs.quick-check.result }}" != "success" ] || \
             [ "${{ needs.local-integration.result }}" != "success" ]; then
            echo "Local CI checks failed"
            exit 1
          fi
          echo "All local CI checks passed!"
