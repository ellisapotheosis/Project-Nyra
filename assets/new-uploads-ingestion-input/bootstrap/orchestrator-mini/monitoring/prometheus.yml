global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'project-nyra'
    environment: 'production'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - 'alertmanager:9093'

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/rules/*.yml'

# Scrape configurations
scrape_configs:
  # Prometheus itself
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
        labels:
          instance: 'orchestrator-mini'
          role: 'monitoring'

  # Orchestrator Mini - Node Exporter
  - job_name: 'orchestrator-node'
    static_configs:
      - targets: ['node-exporter:9100']
        labels:
          instance: 'orchestrator-mini'
          role: 'orchestrator'

  # Orchestrator Mini - cAdvisor
  - job_name: 'orchestrator-cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
        labels:
          instance: 'orchestrator-mini'
          role: 'orchestrator'

  # Traefik
  - job_name: 'traefik'
    static_configs:
      - targets: ['traefik:8080']
        labels:
          instance: 'orchestrator-mini'
          service: 'reverse-proxy'

  # Grafana
  - job_name: 'grafana'
    static_configs:
      - targets: ['grafana:3000']
        labels:
          instance: 'orchestrator-mini'
          service: 'visualization'

  # Gitea
  - job_name: 'gitea'
    static_configs:
      - targets: ['gitea:3000']
        labels:
          instance: 'orchestrator-mini'
          service: 'git'
    metrics_path: '/metrics'

  # Worker RTX3090Ti - Node Exporter
  - job_name: 'worker-3090ti-node'
    static_configs:
      - targets: ['192.168.1.11:9100']
        labels:
          instance: 'worker-rtx3090ti'
          role: 'worker'
          gpu: 'RTX3090Ti'

  # Worker RTX3090Ti - NVIDIA GPU
  - job_name: 'worker-3090ti-gpu'
    static_configs:
      - targets: ['192.168.1.11:9400']
        labels:
          instance: 'worker-rtx3090ti'
          role: 'worker'
          gpu: 'RTX3090Ti'

  # Worker RTX3090Ti - Ollama
  - job_name: 'worker-3090ti-ollama'
    static_configs:
      - targets: ['192.168.1.11:11434']
        labels:
          instance: 'worker-rtx3090ti'
          service: 'ollama'

  # Worker RTX3090Ti - n8n
  - job_name: 'worker-3090ti-n8n'
    static_configs:
      - targets: ['192.168.1.11:5678']
        labels:
          instance: 'worker-rtx3090ti'
          service: 'n8n'
    metrics_path: '/metrics'

  # Worker RTX3060 - Node Exporter
  - job_name: 'worker-3060-node'
    static_configs:
      - targets: ['192.168.1.12:9100']
        labels:
          instance: 'worker-rtx3060'
          role: 'worker'
          gpu: 'RTX3060'
          disconnectable: 'true'

  # Worker RTX3060 - NVIDIA GPU
  - job_name: 'worker-3060-gpu'
    static_configs:
      - targets: ['192.168.1.12:9400']
        labels:
          instance: 'worker-rtx3060'
          role: 'worker'
          gpu: 'RTX3060'
          disconnectable: 'true'

  # Worker RTX5090 - Node Exporter
  - job_name: 'worker-5090-node'
    static_configs:
      - targets: ['192.168.1.13:9100']
        labels:
          instance: 'worker-rtx5090'
          role: 'worker'
          gpu: 'RTX5090'
          disconnectable: 'true'

  # Worker RTX5090 - NVIDIA GPU
  - job_name: 'worker-5090-gpu'
    static_configs:
      - targets: ['192.168.1.13:9400']
        labels:
          instance: 'worker-rtx5090'
          role: 'worker'
          gpu: 'RTX5090'
          disconnectable: 'true'

  # Docker Service Discovery (optional)
  - job_name: 'docker-services'
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
    relabel_configs:
      - source_labels: [__meta_docker_container_name]
        target_label: container_name
      - source_labels: [__meta_docker_container_label_com_docker_compose_service]
        target_label: service
