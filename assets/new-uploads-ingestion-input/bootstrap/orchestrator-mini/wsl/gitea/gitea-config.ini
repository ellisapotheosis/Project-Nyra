[server]
APP_NAME = Gitea: Orchestrator-Mini Git Server
RUN_MODE = prod
RUN_USER = git
DOMAIN = gitea.orchestrator-mini.local
ROOT_URL = https://gitea.orchestrator-mini.local/
HTTP_PORT = 3000
DISABLE_SSH = false
SSH_PORT = 2222
START_SSH_SERVER = true
OFFLINE_MODE = false
LFS_START_SERVER = true
LFS_JWT_SECRET = ${LFS_JWT_SECRET}

[database]
DB_TYPE = postgres
HOST = postgres:5432
NAME = gitea
USER = gitea
PASSWD =
SSL_MODE = disable
CHARSET = utf8mb4
LOG_SQL = false

[security]
INSTALL_LOCK = true
SECRET_KEY =
INTERNAL_TOKEN =
PASSWORD_HASH_ALGO = pbkdf2
MIN_PASSWORD_LENGTH = 8
PASSWORD_COMPLEXITY = lower,upper,digit,spec
PASSWORD_CHECK_PWN = true
REVERSE_PROXY_AUTHENTICATION = false
REVERSE_PROXY_LIMIT = 1
REVERSE_PROXY_TRUSTED_PROXIES = 127.0.0.0/8,::1/128

[oauth2]
ENABLE = true
JWT_SECRET = ${OAUTH2_JWT_SECRET}

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
ALLOW_ONLY_EXTERNAL_REGISTRATION = false
ENABLE_CAPTCHA = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true
NO_REPLY_ADDRESS = noreply.gitea.orchestrator-mini.local

[repository]
ROOT = /data/git/repositories
SCRIPT_TYPE = bash
DEFAULT_BRANCH = main
DEFAULT_PRIVATE = private
MAX_CREATION_LIMIT = -1
PULL_REQUEST_QUEUE_LENGTH = 1000
MIRROR_QUEUE_LENGTH = 1000
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true
DISABLED_REPO_UNITS =
DEFAULT_REPO_UNITS = repo.code,repo.releases,repo.issues,repo.pulls,repo.wiki,repo.projects,repo.packages,repo.actions
PREFERRED_LICENSES = Apache License 2.0,MIT License,GNU General Public License v3.0
DISABLE_STARS = false

[repository.upload]
ENABLED = true
TEMP_PATH = /data/tmp/uploads
FILE_MAX_SIZE = 100
MAX_FILES = 10

[repository.pull-request]
DEFAULT_MERGE_STYLE = merge
DEFAULT_MERGE_MESSAGE_ALL_AUTHORS = true
DEFAULT_MERGE_MESSAGE_MAX_APPROVERS = 10
DEFAULT_MERGE_MESSAGE_OFFICIAL_APPROVERS_ONLY = false
POPULATE_SQUASH_COMMENT_WITH_COMMIT_MESSAGES = true

[repository.signing]
SIGNING_KEY = default
SIGNING_NAME = Gitea
SIGNING_EMAIL = gitea@orchestrator-mini.local
INITIAL_COMMIT = always
CRUD_ACTIONS = always
WIKI = always
MERGES = always

[session]
PROVIDER = redis
PROVIDER_CONFIG = redis:6379,db=0
COOKIE_NAME = i_like_gitea
COOKIE_SECURE = true
COOKIE_USERNAME = gitea_username
GC_INTERVAL_TIME = 86400
SESSION_LIFE_TIME = 86400

[cache]
ENABLED = true
ADAPTER = redis
HOST = redis:6379
ITEM_TTL = 16h

[queue]
TYPE = redis
CONN_STR = redis:6379/0
LENGTH = 1000

[actions]
ENABLED = true
DEFAULT_ACTIONS_URL = https://github.com
ARTIFACT_RETENTION_DAYS = 90

[webhook]
ALLOWED_HOST_LIST = *
SKIP_TLS_VERIFY = true
DELIVER_TIMEOUT = 15
PAGING_NUM = 10

[mailer]
ENABLED = false
FROM = noreply@orchestrator-mini.local
MAILER_TYPE = dummy

[log]
MODE = console, file
LEVEL = Info
ROOT_PATH = /data/gitea/log
ROUTER = file

[log.console]
LEVEL = Info
COLORIZE = true

[log.file]
LEVEL = Info
FILE_NAME = gitea.log
LOG_ROTATE = true
MAX_SIZE_SHIFT = 28
DAILY_ROTATE = true
MAX_DAYS = 7

[git]
DISABLE_DIFF_HIGHLIGHT = false
MAX_GIT_DIFF_LINES = 1000
MAX_GIT_DIFF_LINE_CHARACTERS = 5000
MAX_GIT_DIFF_FILES = 100
GC_ARGS =

[git.timeout]
DEFAULT = 360
MIGRATE = 600
MIRROR = 300
CLONE = 300
PULL = 300
GC = 60

[indexer]
ISSUE_INDEXER_TYPE = bleve
ISSUE_INDEXER_PATH = /data/indexers/issues.bleve
REPO_INDEXER_ENABLED = true
REPO_INDEXER_PATH = /data/indexers/repos.bleve
UPDATE_BUFFER_LEN = 20
MAX_FILE_SIZE = 1048576

[admin]
DISABLE_REGULAR_ORG_CREATION = false
DEFAULT_EMAIL_NOTIFICATIONS = enabled

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[cron]
ENABLED = true
RUN_AT_START = false

[cron.update_mirrors]
SCHEDULE = @every 10m
PULL_LIMIT = 50
PUSH_LIMIT = 50

[cron.repo_health_check]
SCHEDULE = @every 24h
TIMEOUT = 60s
ARGS =

[cron.check_repo_stats]
RUN_AT_START = true
SCHEDULE = @every 24h

[cron.archive_cleanup]
ENABLED = true
RUN_AT_START = true
SCHEDULE = @every 24h
OLDER_THAN = 24h

[cron.sync_external_users]
RUN_AT_START = false
SCHEDULE = @every 24h
UPDATE_EXISTING = true

[cron.deleted_branches_cleanup]
ENABLED = true
RUN_AT_START = true
SCHEDULE = @every 24h
OLDER_THAN = 24h

[cron.update_migration_poster_id]
SCHEDULE = @every 24h

[api]
ENABLE_SWAGGER = true
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 30
DEFAULT_GIT_TREES_PER_PAGE = 1000
DEFAULT_MAX_BLOB_SIZE = 10485760

[i18n]
LANGS = en-US,zh-CN,zh-HK,zh-TW,de-DE,fr-FR,nl-NL,lv-LV,ru-RU,uk-UA,ja-JP,es-ES,pt-BR,pt-PT,pl-PL,bg-BG,it-IT,fi-FI,tr-TR,cs-CZ,sr-SP,sv-SE,ko-KR
NAMES = English,简体中文,繁體中文（香港）,繁體中文（台灣）,Deutsch,français,Nederlands,latviešu,русский,Українська,日本語,español,português do Brasil,Português de Portugal,polski,български,italiano,suomi,Türkçe,čeština,српски,svenska,한국어

[metrics]
ENABLED = false
TOKEN =

[task]
QUEUE_TYPE = redis
QUEUE_CONN_STR = redis:6379/0

[packages]
ENABLED = true
CHUNKED_UPLOAD_PATH = /data/tmp/package-upload
