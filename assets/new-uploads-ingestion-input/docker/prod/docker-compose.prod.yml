version: '3.8'

services:
  # Production PostgreSQL with Replication
  postgres-primary:
    image: postgres:16-alpine
    container_name: prod-postgres-primary
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_REPLICATION_USER: ${POSTGRES_REPLICATION_USER}
      POSTGRES_REPLICATION_PASSWORD: ${POSTGRES_REPLICATION_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - prod_postgres_primary_data:/var/lib/postgresql/data
      - ../configs/postgres/postgresql-prod.conf:/etc/postgresql/postgresql.conf:ro
      - ../configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../configs/postgres/init-prod.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - "5432:5432"
    networks:
      - prod
    command: >
      postgres
      -c config_file=/etc/postgresql/postgresql.conf
      -c hba_file=/etc/postgresql/pg_hba.conf
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"
        compress: "true"

  # Production Redis Cluster
  redis-master:
    image: redis:7-alpine
    container_name: prod-redis-master
    restart: always
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --masterauth ${REDIS_PASSWORD}
      --maxmemory 4gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
      --save 900 1
      --save 300 10
      --save 60 10000
    volumes:
      - prod_redis_master_data:/data
    ports:
      - "6379:6379"
    networks:
      - prod
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Production MinIO Cluster
  minio:
    image: minio/minio:latest
    container_name: prod-minio
    restart: always
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      MINIO_PROMETHEUS_AUTH_TYPE: public
      MINIO_PROMETHEUS_URL: http://prometheus:9090
      MINIO_BROWSER_REDIRECT_URL: https://${DOMAIN}/minio
    volumes:
      - prod_minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    networks:
      - prod
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Production Application
  app:
    build:
      context: ../dockerfiles
      dockerfile: Dockerfile.prod
      target: production
      args:
        NODE_ENV: production
        BUILD_DATE: ${BUILD_DATE}
        VERSION: ${VERSION}
    image: ${REGISTRY:-localhost}/orchestrator-app:${VERSION:-latest}
    container_name: prod-app
    restart: always
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres-primary:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis-master:6379
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      API_KEY: ${API_KEY}
    ports:
      - "3000:3000"
    networks:
      - prod
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-master:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"

  # Production Nginx with SSL
  nginx:
    image: nginx:alpine
    container_name: prod-nginx
    restart: always
    volumes:
      - ../configs/nginx/nginx-prod.conf:/etc/nginx/nginx.conf:ro
      - ../configs/nginx/conf.d:/etc/nginx/conf.d:ro
      - ../configs/nginx/ssl:/etc/nginx/ssl:ro
      - prod_nginx_cache:/var/cache/nginx
      - prod_nginx_logs:/var/log/nginx
    ports:
      - "80:80"
      - "443:443"
    networks:
      - prod
    depends_on:
      - app
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"
        compress: "true"

  # Production Prometheus
  prometheus:
    image: prom/prometheus:latest
    container_name: prod-prometheus
    restart: always
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=90d'
      - '--web.enable-lifecycle'
      - '--web.enable-admin-api'
    volumes:
      - ../configs/prometheus/prometheus-prod.yml:/etc/prometheus/prometheus.yml:ro
      - ../configs/prometheus/alerts-prod.yml:/etc/prometheus/alerts.yml:ro
      - ../configs/prometheus/rules:/etc/prometheus/rules:ro
      - prod_prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - prod
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Production Grafana
  grafana:
    image: grafana/grafana:latest
    container_name: prod-grafana
    restart: always
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_ROOT_URL: https://${DOMAIN}/grafana
      GF_SERVER_SERVE_FROM_SUB_PATH: "true"
      GF_DATABASE_TYPE: postgres
      GF_DATABASE_HOST: postgres-primary:5432
      GF_DATABASE_NAME: grafana
      GF_DATABASE_USER: ${POSTGRES_USER}
      GF_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      GF_SESSION_PROVIDER: redis
      GF_SESSION_PROVIDER_CONFIG: addr=redis-master:6379,password=${REDIS_PASSWORD},db=0
      GF_INSTALL_PLUGINS: grafana-piechart-panel,grafana-clock-panel
    volumes:
      - prod_grafana_data:/var/lib/grafana
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../configs/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "3001:3000"
    networks:
      - prod
    depends_on:
      prometheus:
        condition: service_healthy
      postgres-primary:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

  # Backup Service
  backup:
    build:
      context: ../dockerfiles
      dockerfile: Dockerfile.backup
    container_name: prod-backup
    restart: always
    environment:
      POSTGRES_HOST: postgres-primary
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_RETENTION_DAYS: 30
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: backups
    volumes:
      - prod_backups:/backups
    networks:
      - prod
    depends_on:
      - postgres-primary
      - minio
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "10"

networks:
  prod:
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16
    driver_opts:
      com.docker.network.bridge.name: prod-bridge

volumes:
  prod_postgres_primary_data:
    driver: local
  prod_redis_master_data:
    driver: local
  prod_minio_data:
    driver: local
  prod_nginx_cache:
    driver: local
  prod_nginx_logs:
    driver: local
  prod_prometheus_data:
    driver: local
  prod_grafana_data:
    driver: local
  prod_backups:
    driver: local
