name: "5-Day Mortgage Nurture Campaign"
description: "Initial engagement sequence for new mortgage leads"
version: "1.0"
owner: "Nyra Platform"
created: "2026-01-12"

# Campaign configuration
config:
  timezone_aware: true
  respect_quiet_hours: true  # 9am-9pm local time
  opt_out_keywords: ["STOP", "UNSUBSCRIBE", "CANCEL", "END", "QUIT"]
  requires_consent: true
  consent_types: ["express_written", "verbal"]

# Placeholders available for all messages
placeholders:
  - first_name: "Lead's first name"
  - last_name: "Lead's last name"
  - loan_amount: "Requested loan amount (formatted)"
  - interest_rate: "Calculated interest rate"
  - monthly_payment: "Estimated monthly payment"
  - calendly_link: "Personalized Calendly scheduling link"
  - agent_name: "Assigned loan officer name"
  - agent_phone: "Loan officer direct phone"
  - property_address: "Property address"
  - credit_score_range: "Credit score range (e.g., 740-760)"

# Campaign steps (Day 1-5)
steps:
  - id: "day1_instant_sms"
    day: 0
    delay_hours: 0
    delay_minutes: 0
    channel: "sms"
    subject: null
    body: |
      Hi {{first_name}}! 👋 This is {{agent_name}} from Nyra. I just generated your personalized mortgage quote for ${{loan_amount}}.

      Your estimated rate: {{interest_rate}}%
      Monthly payment: ${{monthly_payment}}

      Book a 15-min call to discuss: {{calendly_link}}

      Reply STOP to opt out.
    compliance_notes: "Initial contact - requires express written consent"

  - id: "day1_10min_email"
    day: 0
    delay_hours: 0
    delay_minutes: 10
    channel: "email"
    subject: "Your Personalized Mortgage Quote - ${{loan_amount}}"
    body: |
      Hi {{first_name}},

      Thank you for requesting a mortgage quote with Nyra! I'm {{agent_name}}, and I'll be your dedicated loan officer throughout this process.

      📊 YOUR PERSONALIZED QUOTE:
      • Loan Amount: ${{loan_amount}}
      • Estimated Rate: {{interest_rate}}%
      • Monthly Payment: ${{monthly_payment}}
      • Credit Score Range: {{credit_score_range}}

      🏠 PROPERTY: {{property_address}}

      📅 NEXT STEPS:
      Let's schedule a quick 15-minute call to:
      - Review your quote in detail
      - Discuss loan options (Conventional, FHA, VA)
      - Answer any questions you have
      - Start your pre-approval

      Book your call here: {{calendly_link}}

      💬 HAVE QUESTIONS?
      Call/text me directly: {{agent_phone}}
      Email: Just reply to this message

      Looking forward to helping you secure your dream home!

      Best regards,
      {{agent_name}}
      Senior Loan Officer, Nyra
      NMLS #{{agent_nmls}}

      ---
      To unsubscribe, click here: {{unsubscribe_link}}
    compliance_notes: "Follow-up email with full disclosure"

  - id: "day1_50min_voicemail"
    day: 0
    delay_hours: 0
    delay_minutes: 50
    channel: "voicemail"
    subject: null
    body: |
      Hi {{first_name}}, this is {{agent_name}} from Nyra. I wanted to personally follow up on the mortgage quote we generated for you today for ${{loan_amount}}.

      Your estimated rate of {{interest_rate}}% is really competitive right now, and I'd love to walk you through the details.

      You can schedule a quick 15-minute call with me at {{calendly_link}}, or just give me a call back at {{agent_phone}}.

      I'm here to help make this as smooth as possible. Talk soon!
    compliance_notes: "Voicemail drop - requires consent for autodialed calls"

  - id: "day2_morning_sms"
    day: 1
    delay_hours: 10
    delay_minutes: 0
    channel: "sms"
    subject: null
    body: |
      Good morning {{first_name}}! 🌅 Just checking in - did you have a chance to review your quote? I'm here to answer any questions about your ${{monthly_payment}}/month estimate.

      Book a call: {{calendly_link}}
      Or reply here!

      - {{agent_name}}
    compliance_notes: "Day 2 follow-up - maintain engagement"

  - id: "day2_afternoon_email"
    day: 1
    delay_hours: 16
    delay_minutes: 0
    channel: "email"
    subject: "3 Reasons Your {{interest_rate}}% Rate is Excellent"
    body: |
      Hi {{first_name}},

      I wanted to reach out with some context about your {{interest_rate}}% rate quote:

      ✅ 1. COMPETITIVE ADVANTAGE
      Your rate is in the top 25% of offers we've seen this month for similar profiles. With your {{credit_score_range}} credit score, you're getting preferential pricing.

      ✅ 2. RATE LOCK AVAILABLE
      Rates have been fluctuating. Once we start your application, we can lock this rate for 45-60 days, protecting you from increases.

      ✅ 3. MULTIPLE LOAN OPTIONS
      This is just our initial conventional estimate. I can also explore:
      - FHA loans (lower down payment)
      - VA loans (if you're a veteran)
      - Jumbo loans (for higher amounts)

      📞 READY TO DISCUSS?
      Let's hop on a quick call: {{calendly_link}}

      Or have questions? Just reply to this email.

      Best,
      {{agent_name}}
      {{agent_phone}}

      ---
      Unsubscribe: {{unsubscribe_link}}
    compliance_notes: "Value proposition email"

  - id: "day3_midday_sms"
    day: 2
    delay_hours: 13
    delay_minutes: 0
    channel: "sms"
    subject: null
    body: |
      Hi {{first_name}}, {{agent_name}} here. Quick question: What's your biggest concern about the mortgage process?

      • Down payment?
      • Monthly payments?
      • Approval odds?
      • Timeline?

      Let me know - I'm here to help!

      Or schedule a call: {{calendly_link}}
    compliance_notes: "Engagement question - encourage response"

  - id: "day3_evening_email"
    day: 2
    delay_hours: 19
    delay_minutes: 30
    channel: "email"
    subject: "The Pre-Approval Process (It's Easier Than You Think)"
    body: |
      Hi {{first_name}},

      Many people think getting pre-approved is complicated. I want to break down exactly what we need:

      📋 PRE-APPROVAL CHECKLIST:
      1. ✓ Pay stubs (last 2 months)
      2. ✓ W-2s (last 2 years)
      3. ✓ Bank statements (last 2 months)
      4. ✓ Photo ID
      5. ✓ Credit authorization (I'll handle this)

      ⏱️ TIMELINE:
      - Application: 15 minutes
      - Initial review: Same day
      - Pre-approval letter: 24-48 hours

      💪 WHY GET PRE-APPROVED NOW:
      - Shows sellers you're serious
      - Speeds up closing (7-14 days faster)
      - Identifies any issues early
      - Locks in your rate

      🚀 LET'S GET STARTED:
      Schedule 15 minutes: {{calendly_link}}

      I'll walk you through everything step-by-step.

      {{agent_name}}
      Senior Loan Officer
      {{agent_phone}} | {{agent_email}}

      ---
      Unsubscribe: {{unsubscribe_link}}
    compliance_notes: "Educational content - build trust"

  - id: "day4_morning_sms"
    day: 3
    delay_hours: 9
    delay_minutes: 0
    channel: "sms"
    subject: null
    body: |
      {{first_name}}, this is {{agent_name}} 👋

      I noticed you haven't scheduled a call yet. No pressure! I just want to make sure you have everything you need.

      • Have questions? Reply here
      • Ready to chat? {{calendly_link}}
      • Need a different time? Call me: {{agent_phone}}

      Here to help when you're ready!
    compliance_notes: "Soft reminder - no pressure"

  - id: "day4_afternoon_email"
    day: 3
    delay_hours: 15
    delay_minutes: 0
    channel: "email"
    subject: "Common Mortgage Questions Answered"
    body: |
      Hi {{first_name}},

      I get these questions all the time. Here are quick answers:

      ❓ "What credit score do I need?"
      Your {{credit_score_range}} is great! We can work with scores as low as 620 for conventional loans, even lower for FHA.

      ❓ "How much do I need for a down payment?"
      Depends on loan type:
      • Conventional: 3-5% minimum
      • FHA: 3.5% minimum
      • VA: 0% down (if eligible)
      For your ${{loan_amount}} loan, that's roughly ${{down_payment_estimate}}.

      ❓ "How long does it take to close?"
      Typically 30-45 days once we start. Pre-approval takes 24-48 hours.

      ❓ "Can I afford ${{monthly_payment}}/month?"
      Rule of thumb: your total housing cost (mortgage + insurance + taxes + HOA) should be under 28% of gross monthly income. We can calculate your exact ratios.

      ❓ "What if rates go up?"
      Once we lock your rate, you're protected for 45-60 days.

      🗓️ MORE QUESTIONS?
      Let's talk: {{calendly_link}}

      Best,
      {{agent_name}}
      {{agent_phone}}

      ---
      Unsubscribe: {{unsubscribe_link}}
    compliance_notes: "FAQ content - address objections"

  - id: "day5_morning_sms"
    day: 4
    delay_hours: 10
    delay_minutes: 0
    channel: "sms"
    subject: null
    body: |
      Hi {{first_name}}, {{agent_name}} here for my final check-in.

      Your {{interest_rate}}% rate quote is still available, but I wanted to make sure I didn't miss anything on my end.

      • Were you able to find the info you needed?
      • Any questions I can answer?
      • Ready to move forward?

      Book a call: {{calendly_link}}
      Or just reply!

      Thanks for considering Nyra! 🏡
    compliance_notes: "Final touchpoint - respectful close"

  - id: "day5_afternoon_email"
    day: 4
    delay_hours: 16
    delay_minutes: 0
    channel: "email"
    subject: "Final Check-In: Your ${{loan_amount}} Mortgage Quote"
    body: |
      Hi {{first_name}},

      This is my last scheduled message in our 5-day follow-up sequence. I wanted to say thank you for allowing me to provide your mortgage quote.

      📊 YOUR QUOTE RECAP:
      • Loan Amount: ${{loan_amount}}
      • Rate: {{interest_rate}}%
      • Monthly Payment: ${{monthly_payment}}
      • Valid through: {{quote_expiry_date}}

      🔮 WHAT HAPPENS NEXT?

      If you'd like to move forward:
      → Schedule a call: {{calendly_link}}
      → Call me directly: {{agent_phone}}
      → Reply to this email

      If you're not ready yet:
      → No problem! Keep my contact info handy
      → Reach out when your timeline is clearer
      → I'm here when you need me

      If you've decided to go another direction:
      → I appreciate you giving us a shot
      → Best of luck with your home purchase!

      👋 A PERSONAL NOTE:
      I take a consultative approach - not high pressure. If I can ever be a resource, even just to answer questions, I'm happy to help.

      Here's to finding your perfect home! 🏡

      {{agent_name}}
      Senior Loan Officer, Nyra
      📞 {{agent_phone}}
      📧 {{agent_email}}
      🗓️ {{calendly_link}}

      ---
      Unsubscribe: {{unsubscribe_link}}

      P.S. - If you found a better rate elsewhere, I'd love to hear about it. We can often match or beat competitive offers.
    compliance_notes: "Respectful conclusion - leave door open"

# Campaign completion
completion:
  transfer_to_long_term: true
  long_term_campaign: "day6-36.yaml"
  pause_if_responded: true
  mark_cold_lead_if_no_response: true
