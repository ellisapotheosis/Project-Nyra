name: Research to PR
description: Search, write notes, commit, PR.
steps:
  - id: search
    tool: tavily-remote.search
    input: { query: "site:docs target topic" }
  - id: draft
    tool: kg-local.write
    input:
      path: "docs/research-notes.md"
      content: "{{ steps.search.result }}"
  - id: commit
    tool: git.commit
    input: { message: "docs: add research notes" }
  - id: pr
    tool: github.open_pull_request
    input:
      title: "docs: research notes"
      body: "Auto-generated by flow"