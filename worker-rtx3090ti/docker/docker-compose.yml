version: '3.8'

# Worker RTX 3090 Ti - AI/ML Workstation
# Role: AI/ML workloads, model training, inference, image generation
# Hardware: RTX 3090 Ti 24GB, 64GB RAM
# Services: Claude Flow Worker, MCP Servers, AI/ML Tools, Training

networks:
  nyra-network:
    external: true
    name: nyra-network

volumes:
  # Claude Flow & MCP
  claude-flow-worker-data:
    driver: local
  claude-flow-worker-cache:
    driver: local
  claude-flow-worker-logs:
    driver: local

  # LLM Inference
  ollama-models:
    driver: local

  # Image Generation
  swarmui-data:
    driver: local
  swarmui-models:
    driver: local
  comfyui-data:
    driver: local
  comfyui-models:
    driver: local

  # Development
  jupyter-data:
    driver: local
  open-webui-data:
    driver: local

  # Workflow Automation
  n8n-data:
    driver: local

services:
  # ===================================================================
  # CORE CLAUDE FLOW WORKER
  # ===================================================================

  claude-flow-worker:
    image: ghcr.io/ruv-inc/claude-flow:alpha
    container_name: worker-claude-flow-rtx3090ti
    hostname: worker-rtx3090ti
    restart: unless-stopped
    ports:
      - "3013:3010"    # Claude Flow API
      - "8006:8003"    # MCP Server
    environment:
      # Mode Configuration
      - CLAUDE_FLOW_MODE=worker
      - CLAUDE_FLOW_VERSION=3.0.0
      - ORCHESTRATOR_URL=http://172.20.0.10:3010

      # Swarm Configuration
      - SWARM_TOPOLOGY=hierarchical-mesh
      - SWARM_MAX_AGENTS=15
      - SWARM_STRATEGY=specialized
      - SWARM_CONSENSUS=raft
      - SWARM_ROLE=worker

      # Memory Configuration
      - MEMORY_BACKEND=hybrid
      - MEMORY_PATH=/app/data/memory
      - AGENTDB_URL=http://172.20.0.12:8080
      - RUVECTOR_URL=http://172.20.0.13:8888
      - REASONINGBANK_ENABLED=true

      # Hooks & Intelligence
      - HOOKS_ENABLED=true
      - HOOKS_PRE_TASK=true
      - HOOKS_POST_TASK=true
      - HOOKS_INTELLIGENCE=true
      - NEURAL_ENABLED=true
      - SONA_ENABLED=true
      - MOE_ENABLED=true
      - FLASH_ATTENTION=true

      # GPU Configuration (RTX 3090 Ti)
      - GPU_ENABLED=true
      - GPU_TYPE=rtx_3090_ti
      - GPU_MEMORY=24GB
      - GPU_COMPUTE_CAPABILITY=8.6
      - GPU_TENSOR_CORES=336
      - GPU_CUDA_CORES=10752
      - GPU_VRAM=24576
      - GPU_POWER_LIMIT=450
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Preferred Tasks (High-end GPU for AI/ML)
      - PREFERRED_TASKS=model-training,large-inference,image-generation,video-processing,batch-inference

      # LLM Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXUS_ROUTER_URL=http://172.20.0.11:6000

      # Local LLM
      - OLLAMA_URL=http://ollama-rtx3090ti:11434

      # Performance (High Config)
      - MAX_CONCURRENT_TASKS=8
      - TASK_TIMEOUT=600000
      - MEMORY_LIMIT=48GB
      - CPU_LIMIT=16
      - BATCH_SIZE=32

      # Development Mode
      - HOT_RELOAD=true
      - DEBUG_MODE=false
      - VERBOSE=false
      - PROFILE_PERFORMANCE=true

      # Logging
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/claude-flow.log

      # Metadata
      - PC_ID=worker-rtx3090ti
      - PC_NAME=RTX 3090 Ti AI Workstation
      - PC_ROLE=ai-ml-workload
      - NETWORK_IP=10.0.0.4
    volumes:
      - claude-flow-worker-data:/app/data
      - claude-flow-worker-cache:/app/cache
      - claude-flow-worker-logs:/app/logs
    networks:
      nyra-network:
        ipv4_address: 172.20.0.90
    depends_on:
      - ollama-rtx3090ti
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claude-flow-rtx3090ti.rule=Host(`worker-rtx3090ti.nyra.local`)"
      - "traefik.http.services.claude-flow-rtx3090ti.loadbalancer.server.port=3010"

  # ===================================================================
  # LLM INFERENCE
  # ===================================================================

  # Ollama - LLM Inference Engine
  ollama-rtx3090ti:
    image: ollama/ollama:latest
    container_name: worker-ollama-rtx3090ti
    restart: unless-stopped
    ports:
      - "11436:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-models:/root/.ollama
    networks:
      nyra-network:
        ipv4_address: 172.20.0.91
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-rtx3090ti.rule=Host(`ollama-rtx3090ti.nyra.local`)"
      - "traefik.http.services.ollama-rtx3090ti.loadbalancer.server.port=11434"

  # Open WebUI - Ollama Frontend
  open-webui-rtx3090ti:
    image: ghcr.io/open-webui/open-webui:main
    container_name: worker-openwebui-rtx3090ti
    restart: unless-stopped
    ports:
      - "3004:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rtx3090ti:11434
      - WEBUI_AUTH=true
      - WEBUI_NAME=Project Nyra AI - RTX 3090 Ti
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.92
    depends_on:
      - ollama-rtx3090ti
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui-rtx3090ti.rule=Host(`ai-rtx3090ti.nyra.local`)"
      - "traefik.http.services.openwebui-rtx3090ti.loadbalancer.server.port=8080"

  # ===================================================================
  # IMAGE GENERATION
  # ===================================================================

  # SwarmUI - Stable Diffusion Interface
  swarmui-rtx3090ti:
    image: mcmonkey/swarmui:latest
    container_name: worker-swarmui-rtx3090ti
    restart: unless-stopped
    ports:
      - "7802:7801"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - swarmui-data:/SwarmUI/Data
      - swarmui-models:/SwarmUI/Models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.93
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7801/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swarmui-rtx3090ti.rule=Host(`swarm-rtx3090ti.nyra.local`)"
      - "traefik.http.services.swarmui-rtx3090ti.loadbalancer.server.port=7801"

  # ComfyUI - Advanced Stable Diffusion Workflow
  comfyui-rtx3090ti:
    image: yanwk/comfyui-boot:latest
    container_name: worker-comfyui-rtx3090ti
    restart: unless-stopped
    ports:
      - "8189:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - comfyui-data:/home/runner
      - comfyui-models:/home/runner/models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.94
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui-rtx3090ti.rule=Host(`comfy-rtx3090ti.nyra.local`)"
      - "traefik.http.services.comfyui-rtx3090ti.loadbalancer.server.port=8188"

  # ===================================================================
  # WORKFLOW AUTOMATION
  # ===================================================================

  # n8n - Workflow Automation
  n8n-rtx3090ti:
    image: n8nio/n8n:latest
    container_name: worker-n8n-rtx3090ti
    restart: unless-stopped
    ports:
      - "5679:5678"
    environment:
      - N8N_HOST=n8n-rtx3090ti.nyra.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n-rtx3090ti.nyra.local
      - GENERIC_TIMEZONE=America/New_York
      - N8N_SECURE_COOKIE=false
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      nyra-network:
        ipv4_address: 172.20.0.95
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-rtx3090ti.rule=Host(`n8n-rtx3090ti.nyra.local`)"
      - "traefik.http.services.n8n-rtx3090ti.loadbalancer.server.port=5678"

  # ===================================================================
  # DEVELOPMENT & DATA SCIENCE
  # ===================================================================

  # Jupyter - Data Science Notebook with GPU support
  jupyter-rtx3090ti:
    image: jupyter/tensorflow-notebook:latest
    container_name: worker-jupyter-rtx3090ti
    restart: unless-stopped
    ports:
      - "8890:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - jupyter-data:/home/jovyan/work
    networks:
      nyra-network:
        ipv4_address: 172.20.0.96
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter-rtx3090ti.rule=Host(`jupyter-rtx3090ti.nyra.local`)"
      - "traefik.http.services.jupyter-rtx3090ti.loadbalancer.server.port=8888"

  # ===================================================================
  # MONITORING
  # ===================================================================

  # Node Exporter - System Metrics
  node-exporter-rtx3090ti:
    image: prom/node-exporter:latest
    container_name: worker-node-exporter-rtx3090ti
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    ports:
      - "9102:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      nyra-network:
        ipv4_address: 172.20.0.97

  # NVIDIA GPU Exporter
  nvidia-gpu-exporter-rtx3090ti:
    image: nvidia/dcgm-exporter:latest
    container_name: worker-nvidia-exporter-rtx3090ti
    restart: unless-stopped
    ports:
      - "9402:9400"
    networks:
      nyra-network:
        ipv4_address: 172.20.0.98
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
