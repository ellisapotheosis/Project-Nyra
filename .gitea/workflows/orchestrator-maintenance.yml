name: oracle-ci-maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'

jobs:
  maintain-oracle-ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Oracle Gitea CI stack online
        shell: bash
        run: |
          set -euo pipefail
          docker compose \
            -f infra/hosts/oracle-vps/docker-compose.gitea.yml \
            --env-file /home/ubuntu/project-nyra/.env.gitea \
            up -d

      - name: Verify runner-facing CI health
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
          ROOT_DIR="$PWD" COMPOSE_FILE=infra/hosts/oracle-vps/docker-compose.gitea.yml ENV_FILE=/home/ubuntu/project-nyra/.env.gitea \
            infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
