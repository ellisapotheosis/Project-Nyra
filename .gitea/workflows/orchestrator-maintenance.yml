name: oracle-ci-maintenance

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

jobs:
  maintain-oracle-ci:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Keep Oracle Gitea CI stack online
        shell: bash
        run: |
          set -euo pipefail
          make gitea-up

      - name: Verify runner-facing CI health
        shell: bash
        run: |
          set -euo pipefail
          chmod +x infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
          ROOT_DIR="$PWD" infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
