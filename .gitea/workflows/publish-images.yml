name: nyra-publish-images

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  publish:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify registry settings
        run: |
          test -n "${{ secrets.GITEA_REGISTRY }}"
          test -n "${{ secrets.GITEA_REGISTRY_USER }}"
          test -n "${{ secrets.GITEA_REGISTRY_TOKEN }}"

      - name: Login to internal registry
        run: |
          echo "${{ secrets.GITEA_REGISTRY_TOKEN }}" | docker login \
            "${{ secrets.GITEA_REGISTRY }}" \
            --username "${{ secrets.GITEA_REGISTRY_USER }}" \
            --password-stdin

      - name: Build and push service images
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME:-manual}"
          REG="${{ secrets.GITEA_REGISTRY }}"
          OWNER_LOWER="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"

          docker build -t "$REG/$OWNER_LOWER/nyra-nexus-router:$TAG" -f infra/images/nexus-router/Dockerfile .
          docker push "$REG/$OWNER_LOWER/nyra-nexus-router:$TAG"

          docker build -t "$REG/$OWNER_LOWER/nyra-crm-api:$TAG" -f services/crm-api/Dockerfile .
          docker push "$REG/$OWNER_LOWER/nyra-crm-api:$TAG"

          docker build -t "$REG/$OWNER_LOWER/nyra-quote-api:$TAG" services/quote-api
          docker push "$REG/$OWNER_LOWER/nyra-quote-api:$TAG"

          docker build -t "$REG/$OWNER_LOWER/nyra-campaign-engine:$TAG" services/campaign-engine
          docker push "$REG/$OWNER_LOWER/nyra-campaign-engine:$TAG"
