name: 🏗️ Build & Push Multi-Arch

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ published ]

env:
  REGISTRY: gitea.local:3100  # Your Gitea registry
  IMAGE_PREFIX: nyra

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - name: nexus-router
            context: .
            dockerfile: infra/docker/nexus-router/Dockerfile
          - name: archon-os
            context: ./services/archon-os
            dockerfile: Dockerfile
          - name: quote-engine
            context: ./services/quote-engine
            dockerfile: Dockerfile
          - name: campaign-engine
            context: ./services/campaign-engine
            dockerfile: Dockerfile
          - name: backup-agent
            context: ./infra/docker/backup-agent
            dockerfile: Dockerfile

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🏷️ Resolve registry
        run: |
          REGISTRY="${{ vars.GITEA_REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="${{ secrets.GITEA_REGISTRY }}"
          fi
          if [ -z "$REGISTRY" ]; then
            REGISTRY="${{ env.REGISTRY }}"
          fi
          if [ -z "$REGISTRY" ]; then
            REGISTRY="gitea.local:3100"
          fi
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: 🏷️ Generate tags
        id: meta
        run: |
          # Generate image tags based on git context
          TAGS=""
          IMAGE_NAME="${REGISTRY}/${IMAGE_PREFIX}/${{ matrix.service.name }}"

          if [[ "${{ github.event_name }}" == "release" ]]; then
            # Release: use tag version
            VERSION=${GITHUB_REF#refs/tags/}
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Main branch: use commit sha and latest
            SHORT_SHA=${GITHUB_SHA:0:7}
            TAGS="${IMAGE_NAME}:${SHORT_SHA},${IMAGE_NAME}:main"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            # Develop branch: use commit sha and rolling develop tag
            SHORT_SHA=${GITHUB_SHA:0:7}
            TAGS="${IMAGE_NAME}:${SHORT_SHA},${IMAGE_NAME}:develop"
          else
            # PR: use PR number
            SHORT_SHA=${GITHUB_SHA:0:7}
            TAGS="${IMAGE_NAME}:pr-${GITHUB_EVENT_NUMBER}-${SHORT_SHA}"
          fi

          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "image=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "📋 Generated tags: ${TAGS}"

      - name: 🔧 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Login to Gitea Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.GITEA_USERNAME }}
          password: ${{ secrets.GITEA_TOKEN }}

      - name: 🏗️ Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            org.opencontainers.image.title=${{ matrix.service.name }}
            org.opencontainers.image.description=Project Nyra ${{ matrix.service.name }} service
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.created=${{ steps.meta.outputs.date }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            BUILDTIME=${{ steps.meta.outputs.date }}
            VERSION=${{ steps.meta.outputs.version }}
            REVISION=${{ github.sha }}

      - name: 🔍 Test image
        if: github.event_name == 'pull_request'
        run: |
          IMAGE="${{ steps.meta.outputs.image }}:pr-${GITHUB_EVENT_NUMBER}-${GITHUB_SHA:0:7}"
          echo "🧪 Testing image: $IMAGE"
          docker run --rm --platform linux/amd64 $IMAGE --version 2>/dev/null || echo "✅ Image built successfully"

  security-scan:
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name != 'pull_request'

    steps:
      - name: 🏷️ Select security scan tag
        id: scan-meta
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/develop" ]]; then
            echo "tag=develop" >> "$GITHUB_OUTPUT"
          else
            echo "tag=main" >> "$GITHUB_OUTPUT"
          fi

      - name: 🔍 Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: '${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/nexus-router:${{ steps.scan-meta.outputs.tag }}'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: 📊 Upload security scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'
