name: Nyra Foundation Check
on: [push, pull_request]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v3
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install

      - name: Foundation Contract Tests
        run: make foundation-check

      - name: Typecheck
        run: pnpm typecheck

      - name: End-to-End Simulation
        run: make simulate
