# ============================================================================
# Project Nyra - Backup and Restore Workflow
# ============================================================================
# Automated backup of critical data and ability to restore from backups
# Includes database dumps, Gitea data, and configuration backups
# ============================================================================

name: Backup and Restore

on:
  schedule:
    # Daily backup at 2 AM UTC
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      backup_type:
        description: 'Type of backup to perform'
        required: true
        default: 'full'
        type: choice
        options:
        - full
        - incremental
        - gitea_only
        - db_only
      restore_backup:
        description: 'Backup ID to restore (leave empty for backup only)'
        required: false
        type: string

env:
  BACKUP_RETENTION_DAYS: 30
  BACKUP_LOCATION: /data/backups

jobs:
  # ==========================================
  # BACKUP OPERATIONS
  # ==========================================
  backup:
    name: 📦 Create Backup
    runs-on: self-hosted
    if: github.event.inputs.restore_backup == ''

    outputs:
      backup_id: ${{ steps.backup.outputs.backup_id }}
      backup_size: ${{ steps.backup.outputs.backup_size }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📊 Pre-backup Status
        run: |
          echo "## 📦 Backup Information" >> $GITHUB_STEP_SUMMARY
          echo "- Type: ${{ github.event.inputs.backup_type || 'full' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Scheduled: ${{ github.event_name == 'schedule' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Started: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY

      - name: 🔧 Prepare Backup Environment
        run: |
          # Create backup directory
          mkdir -p ${{ env.BACKUP_LOCATION }}

          # Generate backup ID
          BACKUP_ID="backup_$(date +%Y%m%d_%H%M%S)"
          BACKUP_DIR="${{ env.BACKUP_LOCATION }}/${BACKUP_ID}"
          mkdir -p "$BACKUP_DIR"

          echo "BACKUP_ID=$BACKUP_ID" >> $GITHUB_ENV
          echo "BACKUP_DIR=$BACKUP_DIR" >> $GITHUB_ENV

      - name: 🗄️ Backup Databases
        if: |
          github.event.inputs.backup_type != 'gitea_only' &&
          github.event.inputs.backup_type != 'incremental'
        run: |
          echo "🗄️ Backing up PostgreSQL databases..."

          # Backup Gitea database
          docker exec nyra-gitea-db pg_dump -U gitea gitea | gzip > "$BACKUP_DIR/gitea_db.sql.gz"

          # Backup other databases if they exist
          if docker ps --format 'table {{.Names}}' | grep -q postgres; then
            for container in $(docker ps --format '{{.Names}}' | grep postgres); do
              if [ "$container" != "nyra-gitea-db" ]; then
                echo "Backing up database from $container"
                docker exec "$container" pg_dumpall -U postgres | gzip > "$BACKUP_DIR/${container}_db.sql.gz"
              fi
            done
          fi

      - name: 📁 Backup Gitea Data
        if: github.event.inputs.backup_type != 'db_only'
        run: |
          echo "📁 Backing up Gitea data..."

          # Stop Gitea temporarily for consistent backup
          docker pause nyra-gitea || true

          # Backup Gitea data volume
          docker run --rm \
            -v nyra-gitea-data:/source:ro \
            -v "$BACKUP_DIR":/backup \
            alpine:latest \
            tar czf /backup/gitea_data.tar.gz -C /source .

          # Backup Gitea configuration
          docker run --rm \
            -v nyra_secrets:/source:ro \
            -v "$BACKUP_DIR":/backup \
            alpine:latest \
            tar czf /backup/gitea_secrets.tar.gz -C /source .

          # Resume Gitea
          docker unpause nyra-gitea || true

      - name: ⚙️ Backup Configuration
        if: |
          github.event.inputs.backup_type != 'gitea_only' &&
          github.event.inputs.backup_type != 'incremental'
        run: |
          echo "⚙️ Backing up configuration files..."

          # Backup Docker Compose files
          tar czf "$BACKUP_DIR/compose_configs.tar.gz" \
            docker-compose*.yml \
            infra/docker-compose*.yml \
            .env* \
            infra/configs/

          # Backup runner configurations
          if [ -d "infra/configs/gitea" ]; then
            tar czf "$BACKUP_DIR/runner_configs.tar.gz" infra/configs/gitea/
          fi

      - name: 📊 Backup Metadata
        id: backup
        run: |
          # Create metadata file
          cat > "$BACKUP_DIR/backup_metadata.json" << EOF
          {
            "backup_id": "$BACKUP_ID",
            "backup_type": "${{ github.event.inputs.backup_type || 'full' }}",
            "created_at": "$(date -Iseconds)",
            "git_commit": "${{ github.sha }}",
            "workflow_run": "${{ github.run_id }}",
            "trigger": "${{ github.event_name }}",
            "retention_until": "$(date -d '+${{ env.BACKUP_RETENTION_DAYS }} days' -Iseconds)"
          }
          EOF

          # Calculate backup size
          BACKUP_SIZE=$(du -sh "$BACKUP_DIR" | cut -f1)
          echo "backup_size=$BACKUP_SIZE" >> $GITHUB_OUTPUT
          echo "backup_id=$BACKUP_ID" >> $GITHUB_OUTPUT

          # Create backup completion marker
          touch "$BACKUP_DIR/.backup_complete"

      - name: 📊 Backup Summary
        run: |
          echo "## ✅ Backup Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Backup ID**: ${{ steps.backup.outputs.backup_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Size**: ${{ steps.backup.outputs.backup_size }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Location**: ${{ env.BACKUP_LOCATION }}/${{ steps.backup.outputs.backup_id }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed**: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # RESTORE OPERATIONS
  # ==========================================
  restore:
    name: 🔄 Restore Backup
    runs-on: self-hosted
    if: github.event.inputs.restore_backup != ''

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Validate Backup
        run: |
          RESTORE_BACKUP="${{ github.event.inputs.restore_backup }}"
          RESTORE_DIR="${{ env.BACKUP_LOCATION }}/${RESTORE_BACKUP}"

          if [ ! -d "$RESTORE_DIR" ]; then
            echo "❌ Backup not found: $RESTORE_BACKUP"
            exit 1
          fi

          if [ ! -f "$RESTORE_DIR/.backup_complete" ]; then
            echo "❌ Backup incomplete or corrupted: $RESTORE_BACKUP"
            exit 1
          fi

          echo "✅ Backup validated: $RESTORE_BACKUP"
          echo "RESTORE_DIR=$RESTORE_DIR" >> $GITHUB_ENV

      - name: ⚠️ Pre-restore Warning
        run: |
          echo "## ⚠️ RESTORE OPERATION" >> $GITHUB_STEP_SUMMARY
          echo "**WARNING: This will overwrite current data!**" >> $GITHUB_STEP_SUMMARY
          echo "- **Restore ID**: ${{ github.event.inputs.restore_backup }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Started**: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Services will be temporarily unavailable during restore." >> $GITHUB_STEP_SUMMARY

      - name: 🛑 Stop Services
        run: |
          echo "🛑 Stopping services for restore..."
          docker-compose -f docker-compose.gitea.prod.yml down

      - name: 🗄️ Restore Database
        if: ${{ contains(steps.validate.outputs.backup_contents, 'gitea_db.sql.gz') }}
        run: |
          echo "🗄️ Restoring Gitea database..."

          # Start only the database
          docker-compose -f docker-compose.gitea.prod.yml up -d gitea-db

          # Wait for database to be ready
          sleep 30

          # Restore database
          zcat "$RESTORE_DIR/gitea_db.sql.gz" | \
            docker exec -i nyra-gitea-db psql -U gitea -d gitea

      - name: 📁 Restore Gitea Data
        run: |
          echo "📁 Restoring Gitea data..."

          # Restore data volume
          if [ -f "$RESTORE_DIR/gitea_data.tar.gz" ]; then
            docker run --rm \
              -v nyra-gitea-data:/target \
              -v "$RESTORE_DIR":/backup:ro \
              alpine:latest \
              sh -c "rm -rf /target/* && tar xzf /backup/gitea_data.tar.gz -C /target"
          fi

          # Restore secrets
          if [ -f "$RESTORE_DIR/gitea_secrets.tar.gz" ]; then
            docker run --rm \
              -v nyra_secrets:/target \
              -v "$RESTORE_DIR":/backup:ro \
              alpine:latest \
              sh -c "rm -rf /target/* && tar xzf /backup/gitea_secrets.tar.gz -C /target"
          fi

      - name: ⚙️ Restore Configuration
        if: ${{ contains(steps.validate.outputs.backup_contents, 'compose_configs.tar.gz') }}
        run: |
          echo "⚙️ Restoring configuration files..."

          # Backup current configs
          mkdir -p /tmp/config_backup
          cp -r docker-compose*.yml infra/configs/ /tmp/config_backup/ 2>/dev/null || true

          # Restore configs
          tar xzf "$RESTORE_DIR/compose_configs.tar.gz"

          if [ -f "$RESTORE_DIR/runner_configs.tar.gz" ]; then
            tar xzf "$RESTORE_DIR/runner_configs.tar.gz"
          fi

      - name: 🚀 Start Services
        run: |
          echo "🚀 Starting restored services..."
          docker-compose -f docker-compose.gitea.prod.yml up -d

          # Wait for services to start
          sleep 60

      - name: 🧪 Verify Restore
        run: |
          echo "🧪 Verifying restore..."

          # Check Gitea health
          for i in {1..10}; do
            if curl -f http://localhost:3100/api/healthz; then
              echo "✅ Gitea is healthy"
              break
            fi
            echo "Waiting for Gitea to start... ($i/10)"
            sleep 10
          done

          # Check database connectivity
          docker exec nyra-gitea-db pg_isready -U gitea

          echo "✅ Restore verification completed"

      - name: 📊 Restore Summary
        run: |
          echo "## ✅ Restore Completed" >> $GITHUB_STEP_SUMMARY
          echo "- **Restored**: ${{ github.event.inputs.restore_backup }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Completed**: $(date -Iseconds)" >> $GITHUB_STEP_SUMMARY
          echo "- **Services**: All services restarted and healthy" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # CLEANUP OLD BACKUPS
  # ==========================================
  cleanup:
    name: 🧹 Cleanup Old Backups
    runs-on: self-hosted
    needs: backup
    if: always() && needs.backup.result == 'success'

    steps:
      - name: 🧹 Remove Old Backups
        run: |
          echo "🧹 Cleaning up backups older than ${{ env.BACKUP_RETENTION_DAYS }} days..."

          find ${{ env.BACKUP_LOCATION }} \
            -type d \
            -name "backup_*" \
            -mtime +${{ env.BACKUP_RETENTION_DAYS }} \
            -exec rm -rf {} + 2>/dev/null || true

          # List remaining backups
          echo "📦 Remaining backups:"
          ls -la ${{ env.BACKUP_LOCATION }}/backup_* 2>/dev/null || echo "No backups found"

      - name: 📊 Storage Summary
        run: |
          TOTAL_SIZE=$(du -sh ${{ env.BACKUP_LOCATION }} 2>/dev/null | cut -f1 || echo "N/A")
          BACKUP_COUNT=$(ls -1d ${{ env.BACKUP_LOCATION }}/backup_* 2>/dev/null | wc -l || echo "0")

          echo "## 🧹 Cleanup Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Total backup storage**: $TOTAL_SIZE" >> $GITHUB_STEP_SUMMARY
          echo "- **Active backups**: $BACKUP_COUNT" >> $GITHUB_STEP_SUMMARY
          echo "- **Retention period**: ${{ env.BACKUP_RETENTION_DAYS }} days" >> $GITHUB_STEP_SUMMARY