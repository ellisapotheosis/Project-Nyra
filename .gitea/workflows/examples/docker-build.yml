# ============================================================================
# Project Nyra - Docker Build and Push Workflow
# ============================================================================
# Builds and publishes Docker images for all services
# Supports multi-platform builds and automated tagging
# ============================================================================

name: Docker Build and Push

on:
  push:
    branches: [ main, develop ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: nyra

jobs:
  # ==========================================
  # DETECT CHANGED SERVICES
  # ==========================================
  detect-changes:
    name: 📊 Detect Changed Services
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changes.outputs.matrix }}
      has_changes: ${{ steps.changes.outputs.has_changes }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: 🔍 Detect Service Changes
        id: changes
        run: |
          # Define all services with their Dockerfile paths
          declare -A services=(
            ["gitea-act-runner"]="infra/docker/gitea-act-runner/Dockerfile"
            ["github-sync"]="infra/github-sync/Dockerfile"
            ["ai-reviewer"]="infra/ai-reviewer/Dockerfile"
            ["nexus-router"]="services/nexus-router/Dockerfile"
            ["gitea-mcp"]="services/gitea-mcp/Dockerfile"
            ["quote-engine"]="services/quote-engine/Dockerfile"
            ["campaign-engine"]="services/campaign-engine/Dockerfile"
          )

          changed_services=()

          for service in "${!services[@]}"; do
            dockerfile="${services[$service]}"
            service_dir=$(dirname "$dockerfile")

            # Check if service files changed
            if git diff --name-only HEAD~1 HEAD | grep -E "^${service_dir}/" > /dev/null; then
              changed_services+=("$service")
              echo "📦 Detected changes in: $service"
            fi
          done

          # For tag pushes or main branch, build all services
          if [[ "${{ github.ref_type }}" == "tag" ]] || [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            changed_services=($(printf "%s\n" "${!services[@]}" | sort))
            echo "🏷️ Building all services for tag/main push"
          fi

          # Create matrix
          if [ ${#changed_services[@]} -eq 0 ]; then
            echo "matrix=[]" >> $GITHUB_OUTPUT
            echo "has_changes=false" >> $GITHUB_OUTPUT
          else
            # Convert to JSON array
            services_json=$(printf '%s\n' "${changed_services[@]}" | jq -R . | jq -s .)
            echo "matrix={\"service\":$services_json}" >> $GITHUB_OUTPUT
            echo "has_changes=true" >> $GITHUB_OUTPUT
          fi

  # ==========================================
  # BUILD AND PUSH DOCKER IMAGES
  # ==========================================
  build-and-push:
    name: 🐋 Build ${{ matrix.service }}
    runs-on: docker
    needs: detect-changes
    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🏷️ Extract Metadata
        id: meta
        run: |
          # Generate image tags based on git ref
          SERVICE_NAME="${{ matrix.service }}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${SERVICE_NAME}"

          # Convert to lowercase (required by container registries)
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          TAGS=""
          LABELS=""

          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            # Tag push: use the tag version
            VERSION=${GITHUB_REF#refs/tags/v}
            TAGS="${IMAGE_NAME}:${VERSION},${IMAGE_NAME}:latest"
            LABELS="org.opencontainers.image.version=${VERSION}"
          elif [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            # Main branch: use latest and commit SHA
            TAGS="${IMAGE_NAME}:latest,${IMAGE_NAME}:${GITHUB_SHA:0:7}"
          elif [[ "${{ github.ref }}" == "refs/heads/develop" ]]; then
            # Develop branch: use develop tag
            TAGS="${IMAGE_NAME}:develop,${IMAGE_NAME}:${GITHUB_SHA:0:7}"
          else
            # PR or other branches: use branch name and SHA
            BRANCH_NAME=$(echo "${GITHUB_REF#refs/heads/}" | sed 's/[^a-zA-Z0-9.-]/-/g')
            TAGS="${IMAGE_NAME}:${BRANCH_NAME},${IMAGE_NAME}:${GITHUB_SHA:0:7}"
          fi

          echo "image_name=${IMAGE_NAME}" >> $GITHUB_OUTPUT
          echo "tags=${TAGS}" >> $GITHUB_OUTPUT
          echo "labels=${LABELS}" >> $GITHUB_OUTPUT

      - name: 🔑 Log in to Container Registry
        if: github.event_name != 'pull_request'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: 🏗️ Set up Docker Buildx
        run: |
          docker buildx create --use --name builder
          docker buildx inspect --bootstrap

      - name: 📦 Determine Build Context
        id: context
        run: |
          SERVICE_NAME="${{ matrix.service }}"

          case $SERVICE_NAME in
            "gitea-act-runner")
              echo "dockerfile=infra/docker/gitea-act-runner/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=." >> $GITHUB_OUTPUT
              ;;
            "github-sync")
              echo "dockerfile=infra/github-sync/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=infra/github-sync" >> $GITHUB_OUTPUT
              ;;
            "ai-reviewer")
              echo "dockerfile=infra/ai-reviewer/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=infra/ai-reviewer" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "dockerfile=services/${SERVICE_NAME}/Dockerfile" >> $GITHUB_OUTPUT
              echo "context=services/${SERVICE_NAME}" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: 🐋 Build and Push Image
        run: |
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file ${{ steps.context.outputs.dockerfile }} \
            --tag ${{ steps.meta.outputs.tags }} \
            --label "org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            --label "org.opencontainers.image.created=$(date -Iseconds)" \
            --label "${{ steps.meta.outputs.labels }}" \
            ${{ github.event_name != 'pull_request' && '--push' || '--load' }} \
            ${{ steps.context.outputs.context }}

      - name: 📊 Image Summary
        run: |
          echo "## 🐋 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "| Property | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Service | ${{ matrix.service }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Image | ${{ steps.meta.outputs.image_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Tags | ${{ steps.meta.outputs.tags }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Platforms | linux/amd64, linux/arm64 |" >> $GITHUB_STEP_SUMMARY
          echo "| Registry | ${{ env.REGISTRY }} |" >> $GITHUB_STEP_SUMMARY

  # ==========================================
  # VULNERABILITY SCANNING
  # ==========================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: [detect-changes, build-and-push]
    if: needs.detect-changes.outputs.has_changes == 'true'

    strategy:
      matrix: ${{ fromJson(needs.detect-changes.outputs.matrix) }}

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔍 Scan Image for Vulnerabilities
        run: |
          SERVICE_NAME="${{ matrix.service }}"
          IMAGE_NAME="${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_PREFIX }}-${SERVICE_NAME}"
          IMAGE_NAME=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')

          # Use Trivy for vulnerability scanning
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --exit-code 1 \
            --severity HIGH,CRITICAL \
            --format table \
            "${IMAGE_NAME}:${GITHUB_SHA:0:7}"

  # ==========================================
  # UPDATE DEPLOYMENT MANIFESTS
  # ==========================================
  update-manifests:
    name: 📝 Update Deployment Manifests
    runs-on: ubuntu-latest
    needs: [build-and-push, security-scan]
    if: |
      github.ref == 'refs/heads/main' &&
      github.event_name == 'push' &&
      needs.build-and-push.result == 'success'

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🔄 Update Docker Compose
        run: |
          # Update image tags in docker-compose files
          for service in ${{ join(fromJson(needs.detect-changes.outputs.matrix).service, ' ') }}; do
            echo "Updating $service to ${GITHUB_SHA:0:7}"

            # Update production compose file
            if grep -q "image: nyra/${service}:" docker-compose.gitea.prod.yml; then
              sed -i "s|image: nyra/${service}:.*|image: nyra/${service}:${GITHUB_SHA:0:7}|" docker-compose.gitea.prod.yml
            fi
          done

      - name: 💾 Commit Changes
        if: github.ref == 'refs/heads/main'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet; then
            echo "No changes to commit"
          else
            git add docker-compose*.yml
            git commit -m "chore: update image tags to ${GITHUB_SHA:0:7} [skip ci]"
            git push
          fi