name: nyra-ci-cd

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node and pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.27.0 --activate
          node --version
          pnpm --version

      - name: Configure npm auth (optional)
        if: ${{ secrets.NPM_TOKEN != '' }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${{ secrets.NPM_TOKEN }}" > "$HOME/.npmrc"

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

  oracle-ci-health:
    needs: ci
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify Oracle Gitea CI host
        run: |
          chmod +x infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
          ROOT_DIR="$PWD" COMPOSE_FILE=infra/hosts/oracle-vps/docker-compose.gitea.yml ENV_FILE=/home/ubuntu/project-nyra/.env.gitea \
            infra/hosts/oracle-vps/scripts/gitea-ci-health.sh
