name: infra-validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate-compose-gitea-infisical:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create dummy env files
        run: |
          cp .env.gitea.template .env.gitea
          cp .env.infisical.template .env.infisical
          sed -i 's/INFISICAL_POSTGRES_PASSWORD=REPLACE_ME/INFISICAL_POSTGRES_PASSWORD=dummy-pass/g' .env.infisical
          sed -i 's/INFISICAL_ENCRYPTION_KEY=REPLACE_ME_32_HEX/INFISICAL_ENCRYPTION_KEY=00000000000000000000000000000000/g' .env.infisical
          sed -i 's/INFISICAL_AUTH_SECRET=REPLACE_ME_BASE64_32/INFISICAL_AUTH_SECRET=dummy-auth-secret-for-ci-only/g' .env.infisical

      - name: Compose config
        run: |
          docker compose -f docker-compose.gitea.yml --env-file .env.gitea config >/dev/null
          docker compose -f docker-compose.infisical.yml --env-file .env.infisical config >/dev/null
