name: Infisical Cloud Audit

# Cloud-only Infisical audit for app.infisical.com.
#
# Required Gitea secrets:
#   INFISICAL_UNIVERSAL_AUTH_CLIENT_ID
#   INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET
#
# Optional secret:
#   INFISICAL_PROJECT_ID         - defaults to the Project Nyra cloud project

on:
  schedule:
    - cron: "0 */6 * * *" # every 6 hours
  workflow_dispatch:
    inputs:
      command:
        description: "Audit command"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - status

env:
  INFISICAL_PROJECT_ID: "8374cea9-e5e8-4050-bda4-b91f25ab30ef"

jobs:
  audit:
    name: Audit Infisical Secrets
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo bash
          sudo apt-get install -y infisical

      - name: Validate cloud token
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        run: |
          if [ -z "$INFISICAL_UNIVERSAL_AUTH_CLIENT_ID" ] || [ -z "$INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET" ]; then
            echo "❌ INFISICAL_UNIVERSAL_AUTH_CLIENT_ID/SECRET are not set in Gitea."
            echo "   Add it at: Settings → Secrets → Actions"
            exit 1
          fi
          echo "✅ Universal Auth validation passed"

      - name: Run audit
        env:
          INFISICAL_UNIVERSAL_AUTH_CLIENT_ID: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}
          INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET: ${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}
        run: |
          COMMAND="audit"
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            COMMAND="${{ github.event.inputs.command }}"
          fi
          echo "📊 Running Infisical cloud $COMMAND..."
          scripts/infisical/sync-cloud.sh "$COMMAND"
