name: 🚀 Deploy to Staging (AUTO)

on:
  workflow_run:
    workflows: ["🏗️ Build & Push Multi-Arch"]
    types: [completed]
  workflow_dispatch:
    inputs:
      deploy_sha:
        description: 'Built commit SHA to deploy from main'
        required: true
        type: string

env:
  ENVIRONMENT: staging
  DEPLOY_HOST: staging.nyra.internal  # Your staging server

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    if: (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')

    environment:
      name: staging
      url: http://staging.nyra.internal

    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.event.inputs.deploy_sha }}

      - name: 🏷️ Resolve registry
        run: |
          REGISTRY="${{ vars.GITEA_REGISTRY }}"
          if [ -z "$REGISTRY" ]; then
            REGISTRY="${{ secrets.GITEA_REGISTRY }}"
          fi
          if [ -z "$REGISTRY" ]; then
            REGISTRY="gitea.local:3100"
          fi
          echo "REGISTRY=$REGISTRY" >> "$GITHUB_ENV"

      - name: 🔧 Setup deployment
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          GITHUB_EVENT_INPUT_DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_sha || '' }}
        run: |
          source scripts/ci/common.sh
          resolve_deploy_sha "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA" "$GITHUB_EVENT_INPUT_DEPLOY_SHA"
          echo "🚀 Preparing staging deployment"
          echo "Git SHA: ${DEPLOY_SHA:0:7}"
          echo "Environment: ${{ env.ENVIRONMENT }}"

      - name: 🔐 Setup SSH
        env:
          PRIMARY_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          FALLBACK_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          SSH_KEY="${PRIMARY_SSH_KEY:-}"
          if [ -z "$SSH_KEY" ]; then
            SSH_KEY="${FALLBACK_SSH_KEY:-}"
          fi
          if [ -z "$SSH_KEY" ]; then
            echo "❌ Missing SSH deploy key secret (STAGING_SSH_KEY or DEPLOY_SSH_KEY)"
            exit 1
          fi

          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: 📋 Prepare deployment files
        env:
          GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || '' }}
          GITHUB_EVENT_INPUT_DEPLOY_SHA: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_sha || '' }}
        run: |
          source scripts/ci/common.sh
          resolve_deploy_sha "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_WORKFLOW_RUN_HEAD_SHA" "$GITHUB_EVENT_INPUT_DEPLOY_SHA"

          # Create deployment package
          mkdir -p deploy-staging
          cp -r infra/ deploy-staging/
          cp docker-compose.*.yml deploy-staging/
          cp .env.template deploy-staging/.env.template
          cp scripts/validate-env.sh deploy-staging/
          mkdir -p deploy-staging/scripts/ci
          cp scripts/ci/common.sh deploy-staging/scripts/ci/common.sh

          # Create staging-specific environment
          cat > deploy-staging/.env.staging << EOF
          # Auto-generated staging environment
          NYRA_NODE_TYPE=staging
          NYRA_ENVIRONMENT=staging
          COMPOSE_PROJECT_NAME=nyra-staging

          # Image versions (latest main builds)
          NEXUS_ROUTER_IMAGE=${REGISTRY}/nyra/nexus-router:${SHORT_SHA}
          CLAUDE_FLOW_IMAGE=${REGISTRY}/nyra/claude-flow:${SHORT_SHA}
          QUOTE_ENGINE_IMAGE=${REGISTRY}/nyra/quote-engine:${SHORT_SHA}
          CAMPAIGN_ENGINE_IMAGE=${REGISTRY}/nyra/campaign-engine:${SHORT_SHA}

          # Staging-specific settings
          GRAFANA_ADMIN_PASSWORD=${{ secrets.STAGING_GRAFANA_PASSWORD }}
          POSTGRES_PASSWORD=${{ secrets.STAGING_POSTGRES_PASSWORD }}
          REDIS_PASSWORD=${{ secrets.STAGING_REDIS_PASSWORD }}
          JWT_SECRET=${{ secrets.STAGING_JWT_SECRET }}
          N8N_ENCRYPTION_KEY=${{ secrets.STAGING_N8N_KEY }}

          # API Keys (shared with prod but rate-limited)
          ANTHROPIC_API_KEY=${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }}

          # Staging-specific overrides
          COMPOSE_PROFILES=core,monitoring,workflow,crm
          LOG_LEVEL=debug
          HOT_RELOAD_ENABLED=true
          DEBUG_MODE=true
          EOF

      - name: 📤 Deploy to staging
        run: |
          # Copy files to staging server
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no -r deploy-staging/. deploy@${{ env.DEPLOY_HOST }}:/opt/project-nyra/

          # Execute deployment on staging server
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no deploy@${{ env.DEPLOY_HOST }} 'bash -s' << 'EOF'
            set -euo pipefail
            cd /opt/project-nyra
            source ./scripts/ci/common.sh
            detect_compose

            echo "🔍 Validating environment..."
            ./validate-env.sh .env.staging

            echo "🐳 Stopping existing services..."
            compose_run -f infra/docker-compose.yml --env-file .env.staging down || true

            echo "📥 Pulling latest images..."
            compose_run -f infra/docker-compose.yml --env-file .env.staging pull

            echo "🚀 Starting services..."
            compose_run -f infra/docker-compose.yml --env-file .env.staging up -d

            echo "⏳ Waiting for services to be ready..."
            sleep 30

            echo "🔍 Health checks..."
            curl -f http://localhost:6000/health || echo "⚠️ Nexus Router not ready"
            curl -f http://localhost:4000/health || echo "⚠️ LiteLLM not ready"
            curl -f http://localhost:3010/health || echo "⚠️ Claude Flow not ready"

            echo "📊 Service status:"
            compose_run -f infra/docker-compose.yml --env-file .env.staging ps
          EOF

      - name: 🧪 Run staging tests
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no deploy@${{ env.DEPLOY_HOST }} 'bash -s' << 'EOF'
            cd /opt/project-nyra

            echo "🧪 Running staging smoke tests..."

            # Test API endpoints
            curl -f http://localhost:6000/health && echo "✅ Nexus Router OK"
            curl -f http://localhost:4000/health && echo "✅ LiteLLM OK"
            curl -f http://localhost:3005/api/health && echo "✅ Grafana OK"
            curl -f http://localhost:5678/healthz && echo "✅ n8n OK"

            # Test database connectivity
            docker exec nyra-postgres pg_isready -U nyra && echo "✅ PostgreSQL OK"
            docker exec nyra-redis redis-cli ping && echo "✅ Redis OK"

            echo "✅ Staging deployment successful!"
          EOF

      - name: 📢 Notify deployment success
        if: success()
        run: |
          echo "🎉 Staging deployment completed successfully!"
          echo "🔗 Access staging at: http://staging.nyra.internal"
          echo "📊 Monitoring: http://staging.nyra.internal:3005"
          echo "🔧 n8n: http://staging.nyra.internal:5678"

      - name: 🚨 Handle deployment failure
        if: failure()
        run: |
          echo "❌ Staging deployment failed!"

          # Get logs for debugging
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no deploy@${{ env.DEPLOY_HOST }} 'bash -s' << 'EOF'
            set -euo pipefail
            cd /opt/project-nyra
            source ./scripts/ci/common.sh
            detect_compose
            echo "📋 Service logs:"
            compose_run -f infra/docker-compose.yml --env-file .env.staging logs --tail=50
          EOF
