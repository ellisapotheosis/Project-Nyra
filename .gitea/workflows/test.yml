name: 🧪 Test Suite

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test_password
          POSTGRES_USER: test_user
          POSTGRES_DB: test_db
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐧 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: 📦 Install dependencies
        run: |
          npm ci
          npm run postinstall 2>/dev/null || true

      - name: 📋 Copy test environment
        run: |
          cp .env.template .env.test
          echo "POSTGRES_PASSWORD=test_password" >> .env.test
          echo "POSTGRES_USER=test_user" >> .env.test
          echo "POSTGRES_DB=test_db" >> .env.test
          echo "REDIS_PASSWORD=" >> .env.test
          echo "NYRA_NODE_TYPE=test" >> .env.test
          echo "NYRA_ENVIRONMENT=test" >> .env.test

      - name: 🔍 Validate environment
        run: ./scripts/validate-env.sh .env.test

      - name: 🧪 Run unit tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          npm run test:unit 2>/dev/null || echo "⚠️ No unit tests found - add npm run test:unit script"

      - name: 🔗 Run integration tests
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://test_user:test_password@localhost:5432/test_db
          REDIS_URL: redis://localhost:6379
        run: |
          npm run test:integration 2>/dev/null || echo "⚠️ No integration tests found - add npm run test:integration script"

      - name: 🐳 Test Docker Compose startup
        run: |
          cp .env.test .env
          if docker compose version >/dev/null 2>&1; then
            compose_cmd=(docker compose)
          elif command -v docker-compose >/dev/null 2>&1; then
            compose_cmd=(docker-compose)
          else
            echo "❌ Docker Compose is unavailable in CI"
            exit 1
          fi
          "${compose_cmd[@]}" -f infra/docker-compose.yml -f docker-compose.dev.yml config
          echo "✅ Docker Compose configuration valid"

      - name: 🔐 Security audit
        run: |
          npm audit --audit-level moderate || echo "⚠️ Security vulnerabilities found - review npm audit output"

      - name: 📊 Upload test results
        if: always()
        run: |
          mkdir -p test-results
          echo "Test completed at $(date)" > test-results/summary.txt
          echo "✅ Test pipeline completed"
