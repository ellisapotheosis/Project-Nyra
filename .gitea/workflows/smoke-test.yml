name: Smoke Tests

on:
  schedule:
    # Run every hour
    - cron: '0 * * * *'
  workflow_dispatch:

env:
  MAX_RETRIES: 3
  RETRY_DELAY: 5

jobs:
  smoke-test:
    name: Run Smoke Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Start services
        run: |
          cd bootstrap/infra
          docker-compose -f docker-compose.dev.yml up -d

          echo "Waiting for services to be ready..."
          sleep 60

      - name: Health check retries
        run: |
          for i in $(seq 1 $MAX_RETRIES); do
            echo "Health check attempt $i of $MAX_RETRIES"
            if ./bootstrap/ci/smoke-tests.sh; then
              echo "✅ Smoke tests passed"
              exit 0
            fi

            if [ $i -lt $MAX_RETRIES ]; then
              echo "⏳ Waiting $RETRY_DELAY seconds before retry..."
              sleep $RETRY_DELAY
            fi
          done

          echo "❌ Smoke tests failed after $MAX_RETRIES attempts"
          exit 1

      - name: Collect metrics on failure
        if: failure()
        run: |
          echo "Collecting Prometheus metrics..."
          curl -s http://localhost:9090/api/v1/query?query=up > /tmp/prometheus-up.json

          echo "Collecting service logs..."
          cd bootstrap/infra
          docker-compose -f docker-compose.dev.yml logs --tail=100 > /tmp/service-logs.txt

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: smoke-test-failure-${{ github.run_number }}
          path: |
            /tmp/prometheus-up.json
            /tmp/service-logs.txt

      - name: Stop services
        if: always()
        run: |
          cd bootstrap/infra
          docker-compose -f docker-compose.dev.yml down

      - name: Send notification
        if: failure()
        run: |
          echo "🚨 Smoke tests failed!"
          echo "Run number: ${{ github.run_number }}"
          echo "Triggered by: ${{ github.event_name }}"
          # Add notification logic here (webhook, Slack, email, etc.)
