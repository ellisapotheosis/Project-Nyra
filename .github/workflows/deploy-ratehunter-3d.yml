name: Deploy ratehunter-3d to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/ratehunter-3d/**"
      - ".github/workflows/deploy-ratehunter-3d.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ratehunter-3d/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-ratehunter-3d-${{ github.event_name }}
  cancel-in-progress: true

env:
  APP_DIR: "apps/ratehunter-3d"
  CLOUDFLARE_PROJECT_NAME: "ratehunter-3d"
  INFISICAL_PROJECT_ID: "8374cea9-e5e8-4050-bda4-b91f25ab30ef"

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

jobs:
  deploy:
    name: Deploy Static Site
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.13.0"

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1.0.16
        continue-on-error: true
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: ${{ env.INFISICAL_PROJECT_ID }}
          export-type: "env"
        env:
          INFISICAL_PROJECT_ID: ${{ env.INFISICAL_PROJECT_ID }}

      - name: Deploy to production
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        run: wrangler pages deploy "$APP_DIR" --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_DIR: ${{ env.APP_DIR }}
          CLOUDFLARE_PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}

      - name: Deploy to preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview')
        run: wrangler pages deploy "$APP_DIR" --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          APP_DIR: ${{ env.APP_DIR }}
          CLOUDFLARE_PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}
