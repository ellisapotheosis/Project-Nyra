name: Nexus Router CI/CD

on:
  push:
    branches: [main, develop, consolidation/**]
    paths:
      - 'services/nexus-router/**'
      - '.github/workflows/nexus-router-ci.yml'

env:
  SERVICE_NAME: nexus-router
  REGISTRY: ghcr.io

jobs:
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f "apps/twenty-crm/package.json" ]; then
            mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
          fi
          trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
          cd services/nexus-router
          pnpm install --no-frozen-lockfile

      - name: Run linter
        run: |
          cd services/nexus-router
          pnpm lint

      - name: Run type check
        run: |
          cd services/nexus-router
          pnpm type-check

  test:
    name: Run Tests
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f "apps/twenty-crm/package.json" ]; then
            mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
          fi
          trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
          cd services/nexus-router
          pnpm install --no-frozen-lockfile

      - name: Run tests
        env:
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
        run: |
          cd services/nexus-router
          pnpm test

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          files: ./services/nexus-router/coverage/coverage-final.json
          flags: nexus-router

  build:
    name: Build Service
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test]
    steps:
      - uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: 10.27.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - name: Install dependencies
        run: |
          if [ -f "apps/twenty-crm/package.json" ]; then
            mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
          fi
          trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
          cd services/nexus-router
          pnpm install --no-frozen-lockfile

      - name: Build
        run: |
          cd services/nexus-router
          pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nexus-router-dist
          path: services/nexus-router/dist/
          retention-days: 7

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [build]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.SERVICE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ./services/nexus-router
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  auto-checkpoint:
    name: Create Auto-Checkpoint
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/consolidation/')
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create checkpoint tag
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME=$(echo ${{ github.ref }} | sed 's/refs\/heads\///' | sed 's/\//-/g')
          TAG_NAME="checkpoint/${BRANCH_NAME}/${TIMESTAMP}"

          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git tag -a "${TAG_NAME}" -m "Auto-checkpoint: Nexus Router CI passed"
          git push origin "${TAG_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify-completion:
    name: Notify Completion
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck, test, build, docker-build, auto-checkpoint]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "## Nexus Router CI/CD Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Service**: nexus-router" >> $GITHUB_STEP_SUMMARY
          echo "**Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Jobs" >> $GITHUB_STEP_SUMMARY
          echo "- Lint & Type Check: ${{ needs.lint-and-typecheck.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Tests: ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Build: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Docker: ${{ needs.docker-build.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Checkpoint: ${{ needs.auto-checkpoint.result }}" >> $GITHUB_STEP_SUMMARY
