name: mirror-to-gitea

on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror-repository-to-gitea:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITEA_MIRROR_URL: ${{ secrets.GITEA_MIRROR_URL }}
      GITEA_MIRROR_SSH_KEY: ${{ secrets.GITEA_MIRROR_SSH_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate mirror secrets
        id: preflight
        run: |
          set -euo pipefail
          if [ -z "$GITEA_MIRROR_URL" ] || [ -z "$GITEA_MIRROR_SSH_KEY" ]; then
            echo "::warning::Skipping mirror-to-gitea because GITEA_MIRROR_URL or GITEA_MIRROR_SSH_KEY is not configured."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          elif ! echo "$GITEA_MIRROR_URL" | grep -Eq '^(ssh://|git@)'; then
            echo "::warning::Skipping mirror-to-gitea because GITEA_MIRROR_URL is not an SSH URL."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Setup SSH key
        if: ${{ steps.preflight.outputs.enabled == 'true' }}
        run: |
          if ! echo "$GITEA_MIRROR_URL" | grep -q '^git@'; then
            echo "Mirror URL does not use SCP-style SSH syntax. Skipping SSH key setup."
            exit 0
          fi
          mkdir -p ~/.ssh
          echo "$GITEA_MIRROR_SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$(echo "$GITEA_MIRROR_URL" | sed -E 's#.*@([^:/]+).*#\1#')" >> ~/.ssh/known_hosts || true

      - name: Push to Gitea mirror
        if: ${{ steps.preflight.outputs.enabled == 'true' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        continue-on-error: true
        run: |
          HOST=$(echo "$GITEA_MIRROR_URL" | sed -E 's#(https?://)?([^@/]+@)?([^/:]+).*#\3#')
          if ! getent hosts "$HOST" >/dev/null 2>&1; then
            echo "Mirror host '$HOST' is not resolvable from this runner. Skipping mirror push."
            exit 0
          fi
          git remote remove gitea 2>/dev/null || true
          git remote add gitea "$GITEA_MIRROR_URL"
          git push gitea --all
          git push gitea --tags
