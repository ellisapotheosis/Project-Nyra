name: mirror-to-gitea

on:
  push:
    branches: [main]
    tags: ["*"]

jobs:
  mirror-repository-to-gitea:
    if: ${{ secrets.GITEA_MIRROR_PUBLIC_URL != '' || (secrets.GITEA_MIRROR_URL != '' && !contains(secrets.GITEA_MIRROR_URL, 'orchestrator-win')) }}
    runs-on: ubuntu-latest
    env:
      MIRROR_URL: ${{ secrets.GITEA_MIRROR_PUBLIC_URL || secrets.GITEA_MIRROR_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.GITEA_MIRROR_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$(echo "$MIRROR_URL" | sed -E 's#.*@([^:/]+).*#\1#')" >> ~/.ssh/known_hosts || true

      - name: Push to Gitea mirror
        run: |
          git remote remove gitea 2>/dev/null || true
          git remote add gitea "$MIRROR_URL"
          git push gitea --all
          git push gitea --tags
