name: Workflow Lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

permissions:
  contents: read
  pull-requests: write

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run actionlint
        uses: devops-actions/actionlint@v0.1.11
        with:
          shellcheck_opts: '-e SC2001 -e SC2016 -e SC2034 -e SC2035 -e SC2086 -e SC2087 -e SC2129'
