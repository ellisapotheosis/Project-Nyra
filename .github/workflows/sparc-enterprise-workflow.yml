name: SPARC Enterprise Development Workflow

on:
  workflow_dispatch:
    inputs:
      apps_to_build:
        description: 'Comma-separated app names (e.g., ratehunter,mortgage-assistant)'
        required: true
        default: 'all'
      enable_auto_pr:
        description: 'Enable automatic PR creation'
        required: false
        default: 'true'
      enable_auto_merge:
        description: 'Enable automatic PR merge (requires tests pass)'
        required: false
        default: 'false'

env:
  INFISICAL_PROJECT_ID: "8374cea9-e5e8-4050-bda4-b91f25ab30ef"
  INFISICAL_ENV: "dev"
  INFISICAL_PATH: "/shared"

jobs:
  setup-matrix:
    name: Setup Development Matrix
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.matrix.outputs.apps }}
      agents: ${{ steps.matrix.outputs.agents }}
    steps:
      - uses: actions/checkout@v6

      - name: Generate development matrix
        id: matrix
        run: |
          # Define all apps
          if [ "${{ github.event.inputs.apps_to_build }}" = "all" ]; then
            APPS='["ratehunter-landing","mortgage-assistant","lead-capture-api","rate-comparison","doc-management"]'
          else
            APPS=$(echo '${{ github.event.inputs.apps_to_build }}' | jq -R -s -c 'split(",")')
          fi

          # Define 20+ specialized agents
          AGENTS='[
            "backend-dev-1","backend-dev-2","backend-dev-3",
            "frontend-dev-1","frontend-dev-2","frontend-dev-3",
            "database-architect-1","database-architect-2",
            "api-designer-1","api-designer-2",
            "security-specialist-1","security-specialist-2",
            "performance-optimizer-1","performance-optimizer-2",
            "test-engineer-1","test-engineer-2","test-engineer-3",
            "devops-engineer-1","devops-engineer-2",
            "documentation-writer-1","documentation-writer-2",
            "code-reviewer-1","code-reviewer-2","code-reviewer-3"
          ]'

          echo "apps=${APPS}" >> $GITHUB_OUTPUT
          echo "agents=${AGENTS}" >> $GITHUB_OUTPUT

  sparc-specification:
    name: SPARC Phase 1 - Specification
    runs-on: ubuntu-latest
    needs: [setup-matrix]
    strategy:
      matrix:
        app: ${{ fromJson(needs.setup-matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Claude Flow
        run: npm install -g claude-flow@alpha

      - name: Run SPARC Specification
        run: |
          npx claude-flow@alpha sparc run spec-pseudocode \
            "Create detailed specification for ${{ matrix.app }} application"

      - name: Upload specification
        uses: actions/upload-artifact@v7
        with:
          name: spec-${{ matrix.app }}
          path: docs/specs/${{ matrix.app }}.md

  sparc-architecture:
    name: SPARC Phase 2 - Architecture
    runs-on: ubuntu-latest
    needs: [setup-matrix, sparc-specification]
    strategy:
      matrix:
        app: ${{ fromJson(needs.setup-matrix.outputs.apps) }}
    steps:
      - uses: actions/checkout@v6

      - name: Download specification
        uses: actions/download-artifact@v8
        with:
          name: spec-${{ matrix.app }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run SPARC Architecture
        run: |
          npx claude-flow@alpha sparc run architect \
            "Design architecture for ${{ matrix.app }} based on specification"

      - name: Upload architecture
        uses: actions/upload-artifact@v7
        with:
          name: arch-${{ matrix.app }}
          path: docs/architecture/${{ matrix.app }}.md

  parallel-development:
    name: Parallel Development (20+ Agents)
    runs-on: ubuntu-latest
    needs: [setup-matrix, sparc-architecture]
    strategy:
      matrix:
        agent: ${{ fromJson(needs.setup-matrix.outputs.agents) }}
      max-parallel: 20
    steps:
      - uses: actions/checkout@v6

      - name: Setup Development Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: |
          npm install -g pnpm@8
          npm install -g claude-flow@alpha
          pnpm install

      - name: Agent Development Task
        id: dev-task
        run: |
          # Determine agent role and task
          AGENT_TYPE=$(echo "${{ matrix.agent }}" | sed 's/-[0-9]*$//')
          AGENT_NUM=$(echo "${{ matrix.agent }}" | grep -o '[0-9]*$')

          echo "Agent: ${{ matrix.agent }}"
          echo "Type: ${AGENT_TYPE}"
          echo "Number: ${AGENT_NUM}"

          # Execute agent-specific tasks
          case ${AGENT_TYPE} in
            backend-dev)
              echo "Building backend services..."
              npx claude-flow@alpha agent spawn --type coder \
                --task "Implement backend API endpoints for assigned service"
              ;;
            frontend-dev)
              echo "Building frontend components..."
              npx claude-flow@alpha agent spawn --type coder \
                --task "Implement frontend UI components for assigned app"
              ;;
            database-architect)
              echo "Designing database schemas..."
              npx claude-flow@alpha agent spawn --type system-architect \
                --task "Design and implement database schema"
              ;;
            api-designer)
              echo "Designing APIs..."
              npx claude-flow@alpha agent spawn --type api-docs \
                --task "Design and document RESTful APIs"
              ;;
            security-specialist)
              echo "Implementing security measures..."
              npx claude-flow@alpha agent spawn --type reviewer \
                --task "Implement authentication, authorization, and security hardening"
              ;;
            performance-optimizer)
              echo "Optimizing performance..."
              npx claude-flow@alpha agent spawn --type perf-analyzer \
                --task "Analyze and optimize application performance"
              ;;
            test-engineer)
              echo "Writing tests..."
              npx claude-flow@alpha agent spawn --type tester \
                --task "Create comprehensive test suites with 90% coverage"
              ;;
            devops-engineer)
              echo "Setting up CI/CD..."
              npx claude-flow@alpha agent spawn --type cicd-engineer \
                --task "Configure deployment pipelines and infrastructure"
              ;;
            documentation-writer)
              echo "Writing documentation..."
              npx claude-flow@alpha agent spawn --type researcher \
                --task "Create comprehensive documentation and guides"
              ;;
            code-reviewer)
              echo "Reviewing code..."
              npx claude-flow@alpha agent spawn --type reviewer \
                --task "Review code quality, security, and best practices"
              ;;
          esac

      - name: Commit Changes
        run: |
          git config --global user.name "SPARC Agent ${{ matrix.agent }}"
          git config --global user.email "sparc-agent@project-nyra.local"

          if [ -n "$(git status --porcelain)" ]; then
            git add .
            git commit -m "feat(${{ matrix.agent }}): automated development by SPARC agent"
          fi

      - name: Upload agent work
        uses: actions/upload-artifact@v7
        with:
          name: agent-work-${{ matrix.agent }}
          path: |
            apps/**
            services/**
            docs/**

  integration-and-testing:
    name: Integration & Testing
    runs-on: ubuntu-latest
    needs: [parallel-development]
    steps:
      - uses: actions/checkout@v6

      - name: Download all agent work
        uses: actions/download-artifact@v8
        with:
          path: agent-work/

      - name: Merge agent contributions
        run: |
          # Intelligent merge of all agent contributions
          for dir in agent-work/agent-work-*/; do
            echo "Merging $(basename $dir)..."
            rsync -av "$dir" ./ --exclude='.git'
          done

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install -g pnpm@8
          pnpm install

      - name: Run linting
        run: pnpm lint || true

      - name: Run type checking
        run: pnpm typecheck || true

      - name: Run tests
        run: pnpm test || true

      - name: Build all services
        run: pnpm build

      - name: Commit integrated work
        run: |
          git config --global user.name "SPARC Integration Bot"
          git config --global user.email "integration@project-nyra.local"

          git add .
          git commit -m "feat: integrated work from 20+ SPARC agents" || true

  create-pr:
    name: Create Pull Request
    runs-on: ubuntu-latest
    needs: [integration-and-testing]
    if: github.event.inputs.enable_auto_pr == 'true'
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Create feature branch
        run: |
          TIMESTAMP=$(date +%Y%m%d-%H%M%S)
          BRANCH_NAME="sparc-enterprise-${TIMESTAMP}"

          git config --global user.name "SPARC Bot"
          git config --global user.email "sparc@project-nyra.local"

          git checkout -b "${BRANCH_NAME}"
          git push origin "${BRANCH_NAME}"

          echo "BRANCH_NAME=${BRANCH_NAME}" >> $GITHUB_ENV

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          base: main
          title: "feat: SPARC Enterprise Development - ${{ github.event.inputs.apps_to_build }}"
          body: |
            ## SPARC Enterprise Development Summary

            **Generated**: $(date -u +"%Y-%m-%d %H:%M:%S UTC")
            **Apps Built**: ${{ github.event.inputs.apps_to_build }}
            **Agents Deployed**: 20+

            ### Changes

            This PR contains automated development work from 20+ specialized SPARC agents:

            - 3 Backend Developers
            - 3 Frontend Developers
            - 2 Database Architects
            - 2 API Designers
            - 2 Security Specialists
            - 2 Performance Optimizers
            - 3 Test Engineers
            - 2 DevOps Engineers
            - 2 Documentation Writers
            - 3 Code Reviewers

            ### Verification Checklist

            - [ ] All tests passing
            - [ ] No linting errors
            - [ ] Type checking passed
            - [ ] Documentation updated
            - [ ] Security review completed
            - [ ] Performance benchmarks met

            ### Auto-Merge

            Auto-merge: ${{ github.event.inputs.enable_auto_merge }}
          labels: |
            automated
            sparc
            enhancement

  auto-merge:
    name: Auto-Merge PR
    runs-on: ubuntu-latest
    needs: [create-pr]
    if: github.event.inputs.enable_auto_merge == 'true'
    steps:
      - name: Enable auto-merge
        run: |
          gh pr merge --auto --squash --delete-branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-services:
    name: Deploy Services to Infrastructure
    runs-on: ubuntu-latest
    needs: [integration-and-testing]
    steps:
      - uses: actions/checkout@v6

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Login to Infisical
        run: |
          TOKEN=$(infisical login --method=universal-auth \
            --client-id="${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_ID }}" \
            --client-secret="${{ secrets.INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET }}" \
            --plain --silent)
          echo "::add-mask::$TOKEN"
          echo "INFISICAL_TOKEN=$TOKEN" >> $GITHUB_ENV

      - name: Start all services with Docker Compose
        run: |
          cd infra/docker

          infisical run --projectId="${{ env.INFISICAL_PROJECT_ID }}" \
            --token="$INFISICAL_TOKEN" \
            --env="${{ env.INFISICAL_ENV }}" \
            --path="${{ env.INFISICAL_PATH }}" -- \
            docker compose -f docker-compose.orchestration.yml \
            -f docker-compose.mcp.yml \
            -f docker-compose.ui.yml \
            up -d

      - name: Health check all services
        run: |
          # Wait for services to be healthy
          sleep 30

          # Check Nexus Router
          curl -f http://localhost:8000/health || exit 1

          # Check Claude Flow
          curl -f http://localhost:9000/health || exit 1

          # Check Open-WebUI
          curl -f http://localhost:3333/health || exit 1

  notification:
    name: Send Completion Notification
    runs-on: ubuntu-latest
    needs: [sparc-specification, sparc-architecture, parallel-development, integration-and-testing, create-pr, deploy-services]
    if: always()
    steps:
      - name: Workflow Summary
        run: |
          echo "## SPARC Enterprise Workflow Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Apps Built**: ${{ github.event.inputs.apps_to_build }}" >> $GITHUB_STEP_SUMMARY
          echo "**Agents Deployed**: 20+" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Phase Status" >> $GITHUB_STEP_SUMMARY
          echo "- Specification: ${{ needs.sparc-specification.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Architecture: ${{ needs.sparc-architecture.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Development: ${{ needs.parallel-development.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Integration: ${{ needs.integration-and-testing.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- PR Creation: ${{ needs.create-pr.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Deployment: ${{ needs.deploy-services.result }}" >> $GITHUB_STEP_SUMMARY
