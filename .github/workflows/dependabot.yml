version: 2
updates:
  # Daily security-focused updates
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "daily"
    allow:
      - dependency-type: "direct"
    insecure-external-code-execution: "deny"
    commit-message:
      prefix: "[SECURITY]"
    labels:
      - "dependencies"
      - "security"
    ignore:
      - dependency-name: "tensorflow"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    commit-message:
      prefix: "[SECURITY]"
    labels:
      - "ci"
      - "security"

  # Regular dependency maintenance
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
    ignore:
      - dependency-name: "torch"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tensorflow"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 3

  - package-ecosystem: "npm"
    directory: "/archive/2025-10-13-original-structure/nyra-core/nyra-orchestration/archon/archon-ui-main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    rebase-strategy: "auto"
name: Validate Dependabot configuration

on:
  push:
    paths:
      - .github/dependabot.yml
  pull_request:
    paths:
      - .github/dependabot.yml

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate Dependabot config
        uses: dependabot/cli-action@v3
        with:
          command: validate
