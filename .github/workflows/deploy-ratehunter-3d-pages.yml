name: Deploy RateHunter 3D Landing to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/ratehunter-3d/**"
      - ".github/workflows/deploy-ratehunter-3d-pages.yml"
  workflow_dispatch:

concurrency:
  group: ratehunter-3d-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Deploy static 3D landing
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          projectName: ratehunter-3d
          directory: apps/ratehunter-3d
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: main
          wranglerVersion: "3"
