name: CI/CD - Enhanced Main Pipeline

on:
  push:
    branches: [main, develop, consolidation/**]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'
  PNPM_VERSION: '10.27.0'
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  TURBO_TEAM: ${{ secrets.TURBO_TEAM }}

jobs:
  # Change Detection - Determines which packages changed
  detect-changes:
    name: Detect Changed Packages
    runs-on: ubuntu-latest
    outputs:
      apps: ${{ steps.filter.outputs.apps }}
      services: ${{ steps.filter.outputs.services }}
      packages: ${{ steps.filter.outputs.packages }}
      mcp-servers: ${{ steps.filter.outputs.mcp-servers }}
      infra: ${{ steps.filter.outputs.infra }}
      changed-workspaces: ${{ steps.detect-workspaces.outputs.workspaces }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            apps:
              - 'apps/**'
            services:
              - 'services/**'
            packages:
              - 'packages/**'
            mcp-servers:
              - 'mcp-servers/**'
            infra:
              - 'infra/**'
              - 'docker-compose*.yml'

      - name: Detect changed workspaces
        id: detect-workspaces
        run: |
          # Use Turborepo to detect which workspaces changed
          CHANGED_WORKSPACES='[]'

          if [ "${{ github.event_name }}" == "pull_request" ]; then
            # For PRs, detect changes against base branch
            CHANGED_WORKSPACES=$(pnpm turbo run build --dry=json --filter="...[origin/${{ github.base_ref }}]" 2>/dev/null | jq -c '[.packages[]]' || echo '[]')
          else
            # For pushes, detect changes in last commit
            CHANGED_WORKSPACES=$(pnpm turbo run build --dry=json --filter="...[HEAD^]" 2>/dev/null | jq -c '[.packages[]]' || echo '[]')
          fi

          echo "workspaces=$CHANGED_WORKSPACES" >> $GITHUB_OUTPUT
          echo "Changed workspaces: $CHANGED_WORKSPACES"

  # Install Dependencies with Caching
  install:
    name: Install Dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Turbo
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

  # Lint - Run ESLint and Prettier only on changed packages
  lint:
    name: Lint Changed Packages
    runs-on: ubuntu-latest
    needs: [install, detect-changes]
    if: |
      needs.detect-changes.outputs.apps == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run ESLint on changed packages
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm turbo run lint --filter="...[origin/${{ github.base_ref }}]"
          else
            pnpm turbo run lint --filter="...[HEAD^]"
          fi

      - name: Check Prettier formatting
        run: |
          # Get list of changed files
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            git diff --name-only origin/${{ github.base_ref }}...HEAD | grep -E '\.(js|jsx|ts|tsx|json|md|yml|yaml)$' | xargs pnpm exec prettier --check || true
          else
            git diff --name-only HEAD^ HEAD | grep -E '\.(js|jsx|ts|tsx|json|md|yml|yaml)$' | xargs pnpm exec prettier --check || true
          fi

  # Type Check - TypeScript validation only on changed packages
  typecheck:
    name: TypeScript Check Changed Packages
    runs-on: ubuntu-latest
    needs: [install, detect-changes]
    if: |
      needs.detect-changes.outputs.apps == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run TypeScript check on changed packages
        run: |
          # Use turbo to check types only in changed packages
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            pnpm turbo run typecheck --filter="...[origin/${{ github.base_ref }}]" || echo "No typecheck script in changed packages"
          else
            pnpm turbo run typecheck --filter="...[HEAD^]" || echo "No typecheck script in changed packages"
          fi

  # Security Audit
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    needs: [install]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run security audit
        run: |
          # Run audit, but don't fail on warnings
          pnpm audit --audit-level=high || echo "Security audit completed with warnings"

  # Build - Parallel builds only for changed packages
  build:
    name: Build Changed Packages
    runs-on: ubuntu-latest
    needs: [install, lint, typecheck, detect-changes]
    if: |
      needs.detect-changes.outputs.apps == 'true' ||
      needs.detect-changes.outputs.services == 'true' ||
      needs.detect-changes.outputs.packages == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Build changed packages with Turbo
        run: |
          # Build only packages that changed (and their dependents)
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "Building packages changed compared to ${{ github.base_ref }}"
            pnpm turbo run build --filter="...[origin/${{ github.base_ref }}]" --concurrency=4
          else
            echo "Building packages changed in last commit"
            pnpm turbo run build --filter="...[HEAD^]" --concurrency=4
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/**/dist
            apps/**/.next
            apps/**/build
            packages/**/dist
            services/**/dist
            mcp-servers/**/dist
          retention-days: 1

  # Test - Only test changed packages
  test:
    name: Test Changed Packages
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.changed-workspaces != '[]'
    strategy:
      fail-fast: false
      matrix:
        workspace: ${{ fromJson(needs.detect-changes.outputs.changed-workspaces) }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Run tests with coverage
        run: |
          # Check if workspace has test script
          WORKSPACE_PATH=$(pnpm list --json --depth=-1 --filter "${{ matrix.workspace }}" 2>/dev/null | jq -r '.[0].path' || echo "")

          if [ -n "$WORKSPACE_PATH" ] && [ -f "$WORKSPACE_PATH/package.json" ]; then
            if grep -q '"test"' "$WORKSPACE_PATH/package.json"; then
              echo "Running tests for ${{ matrix.workspace }}"
              pnpm --filter "${{ matrix.workspace }}" test -- --coverage --maxWorkers=2 || echo "Tests completed with warnings"
            else
              echo "⚠️ No test script found for ${{ matrix.workspace }}"
            fi
          else
            echo "⚠️ Workspace ${{ matrix.workspace }} not found"
          fi
        continue-on-error: true

      - name: Upload coverage
        uses: codecov/codecov-action@v4
        if: always()
        with:
          files: '**/coverage/coverage-final.json'
          flags: ${{ matrix.workspace }}
          token: ${{ secrets.CODECOV_TOKEN }}
        continue-on-error: true

  # Integration Tests (if infrastructure changed)
  integration-test:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [build, detect-changes]
    if: needs.detect-changes.outputs.infra == 'true'
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nyra_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Setup PNPM
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Restore dependencies
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            **/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/pnpm-lock.yaml') }}

      - name: Run integration tests
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nyra_test
          REDIS_URL: redis://localhost:6379
        run: pnpm test:integration || echo "No integration tests configured yet"

  # Quality Gate - Ensure all checks pass
  quality-gate:
    name: Quality Gate
    runs-on: ubuntu-latest
    needs: [lint, typecheck, security, build, test]
    if: always()
    steps:
      - name: Check all jobs status
        run: |
          echo "## Quality Gate Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| TypeCheck | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Security | ${{ needs.security.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          # Fail if any critical check failed
          if [[ "${{ needs.lint.result }}" == "failure" ]] || \
             [[ "${{ needs.typecheck.result }}" == "failure" ]] || \
             [[ "${{ needs.build.result }}" == "failure" ]]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "❌ Quality gate FAILED" >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Quality gate PASSED" >> $GITHUB_STEP_SUMMARY

      - name: Post status to commit
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const needs = ${{ toJson(needs) }};
            const failed = Object.values(needs).some(job => job.result === 'failure');
            const status = failed ? 'failure' : 'success';

            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state: status,
              context: 'Quality Gate',
              description: status === 'success' ? '✅ All checks passed' : '❌ Some checks failed'
            });
