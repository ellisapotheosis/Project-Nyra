name: Auto Merge PRs

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, labeled, unlabeled]
  pull_request_review:
    types: [submitted]
  check_suite:
    types: [completed]
  status: {}
  workflow_run:
    workflows: ["CI/CD - Main Pipeline"]
    types: [completed]

concurrency:
  group: auto-merge-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  checks: read
  issues: write

jobs:
  auto-merge:
    name: Auto Merge PR
    runs-on: ubuntu-latest
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success')
    steps:
      - uses: actions/checkout@v6

      - name: Get PR information
        id: pr-info
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" == "pull_request" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          elif [ "${{ github.event_name }}" == "pull_request_review" ]; then
            PR_NUMBER="${{ github.event.pull_request.number }}"
          else
            # Find PR associated with this workflow run
            PR_NUMBER=$(gh pr list --search "${{ github.sha }}" --json number --jq '.[0].number')
          fi

          if [ -z "$PR_NUMBER" ]; then
            echo "No PR found"
            exit 0
          fi

          echo "pr-number=$PR_NUMBER" >> $GITHUB_OUTPUT

          # Get PR details
          PR_DATA=$(gh pr view $PR_NUMBER --json labels,mergeable,reviewDecision,statusCheckRollup,headRefName)

          echo "labels=$(echo $PR_DATA | jq -c '.labels')" >> $GITHUB_OUTPUT
          echo "mergeable=$(echo $PR_DATA | jq -r '.mergeable')" >> $GITHUB_OUTPUT
          echo "review-decision=$(echo $PR_DATA | jq -r '.reviewDecision')" >> $GITHUB_OUTPUT
          echo "head-ref=$(echo $PR_DATA | jq -r '.headRefName')" >> $GITHUB_OUTPUT

      - name: Check if auto-merge is enabled
        id: check-auto-merge
        if: steps.pr-info.outputs.pr-number != ''
        run: |
          LABELS='${{ steps.pr-info.outputs.labels }}'
          HEAD_REF="${{ steps.pr-info.outputs.head-ref }}"

          # Check if PR has auto-merge label
          HAS_AUTO_MERGE=$(echo $LABELS | jq '[.[] | select(.name == "auto-merge" or .name == "auto-pr")] | length > 0')
          if [[ "$HEAD_REF" == codex/* ]]; then
            HAS_AUTO_MERGE="true"
          fi

          # Check if PR has do-not-merge label
          HAS_DO_NOT_MERGE=$(echo $LABELS | jq '[.[] | select(.name == "do-not-merge" or .name == "wip")] | length > 0')
          if [[ "$HEAD_REF" == codex/* ]]; then
            HAS_DO_NOT_MERGE=$(echo $LABELS | jq '[.[] | select(.name == "do-not-merge")] | length > 0')
          fi

          echo "has-auto-merge=$HAS_AUTO_MERGE" >> $GITHUB_OUTPUT
          echo "has-do-not-merge=$HAS_DO_NOT_MERGE" >> $GITHUB_OUTPUT

      - name: Wait for required CI checks
        id: wait-checks
        if: |
          steps.pr-info.outputs.pr-number != '' &&
          steps.check-auto-merge.outputs.has-auto-merge == 'true' &&
          steps.check-auto-merge.outputs.has-do-not-merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr-number }}"
          MAX_WAIT=300  # 5 minutes
          INTERVAL=30
          ELAPSED=0

          BASE_BRANCH=$(gh pr view "$PR_NUMBER" --json baseRefName --jq '.baseRefName')
          REQUIRED_CONTEXTS=$(gh api "/repos/${{ github.repository }}/branches/$BASE_BRANCH/protection/required_status_checks" --jq '.contexts // []' 2>/dev/null || echo '[]')
          echo "Required contexts: $REQUIRED_CONTEXTS"

          while [ $ELAPSED -lt $MAX_WAIT ]; do
            # Get status checks
            STATUS=$(gh pr view $PR_NUMBER --json statusCheckRollup --jq '.statusCheckRollup')

            if [ "$REQUIRED_CONTEXTS" != "[]" ]; then
              STATUS=$(echo "$STATUS" | jq --argjson required "$REQUIRED_CONTEXTS" '[.[] | select((.context // .name) as $n | $required | index($n))]')
            fi

            # Count pending, failing, and passing checks
            PENDING=$(echo $STATUS | jq '[.[] | select(.status == "PENDING" or .status == "IN_PROGRESS")] | length')
            FAILING=$(echo $STATUS | jq '[.[] | select(.status == "FAILURE" or .status == "ERROR")] | length')
            PASSING=$(echo $STATUS | jq '[.[] | select(.status == "SUCCESS")] | length')

            echo "Checks - Passing: $PASSING, Pending: $PENDING, Failing: $FAILING"

            if [ $FAILING -gt 0 ]; then
              echo "has-failing-checks=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            if [ $PENDING -eq 0 ]; then
              echo "all-checks-passed=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            sleep $INTERVAL
            ELAPSED=$((ELAPSED + INTERVAL))
          done

          echo "timeout=true" >> $GITHUB_OUTPUT

      - name: Check unresolved review threads
        id: review-threads
        if: |
          steps.pr-info.outputs.pr-number != '' &&
          steps.check-auto-merge.outputs.has-auto-merge == 'true' &&
          steps.check-auto-merge.outputs.has-do-not-merge == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr-number }}"
          OWNER="${{ github.repository_owner }}"
          REPO="${{ github.event.repository.name }}"

          GRAPHQL_RESPONSE=$(gh api graphql \
            -f query='
              query($owner: String!, $repo: String!, $number: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $number) {
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                      }
                    }
                  }
                }
              }
            ' \
            -f owner="$OWNER" \
            -f repo="$REPO" \
            -F number="$PR_NUMBER")

          UNRESOLVED_THREADS=$(echo "$GRAPHQL_RESPONSE" | jq '[.data.repository.pullRequest.reviewThreads.nodes[] | select(.isResolved == false)] | length')
          echo "unresolved-threads=$UNRESOLVED_THREADS" >> "$GITHUB_OUTPUT"

      - name: Check merge conditions
        id: merge-check
        if: |
          steps.pr-info.outputs.pr-number != '' &&
          steps.check-auto-merge.outputs.has-auto-merge == 'true' &&
          steps.check-auto-merge.outputs.has-do-not-merge == 'false'
        run: |
          MERGEABLE="${{ steps.pr-info.outputs.mergeable }}"
          REVIEW_DECISION="${{ steps.pr-info.outputs.review-decision }}"
          ALL_CHECKS_PASSED="${{ steps.wait-checks.outputs.all-checks-passed }}"
          HAS_FAILING="${{ steps.wait-checks.outputs.has-failing-checks }}"
          UNRESOLVED_THREADS="${{ steps.review-threads.outputs.unresolved-threads }}"

          CAN_MERGE="false"

          if [ "$HAS_FAILING" == "true" ]; then
            echo "❌ Cannot merge: Failing checks" >> $GITHUB_STEP_SUMMARY
          elif [ -n "$UNRESOLVED_THREADS" ] && [ "$UNRESOLVED_THREADS" -gt 0 ]; then
            echo "❌ Cannot merge: Unresolved review threads ($UNRESOLVED_THREADS)" >> $GITHUB_STEP_SUMMARY
          elif [ "$ALL_CHECKS_PASSED" != "true" ]; then
            echo "⏱️ Cannot merge: Checks still pending" >> $GITHUB_STEP_SUMMARY
          elif [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "❌ Cannot merge: PR not mergeable (conflicts?)" >> $GITHUB_STEP_SUMMARY
          elif [ "$REVIEW_DECISION" == "CHANGES_REQUESTED" ]; then
            echo "❌ Cannot merge: Changes requested" >> $GITHUB_STEP_SUMMARY
          elif [ "$REVIEW_DECISION" == "REVIEW_REQUIRED" ]; then
            echo "⏱️ Cannot merge: Review required" >> $GITHUB_STEP_SUMMARY
          else
            CAN_MERGE="true"
            echo "✅ All conditions met for merge" >> $GITHUB_STEP_SUMMARY
          fi

          echo "can-merge=$CAN_MERGE" >> $GITHUB_OUTPUT

      - name: Merge Pull Request
        if: steps.merge-check.outputs.can-merge == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr-number }}"

          # Merge with squash strategy
          gh pr merge $PR_NUMBER --squash --delete-branch --auto

          echo "## 🎉 PR Merged Successfully!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**PR #$PR_NUMBER** has been automatically merged and the branch deleted." >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR if cannot merge
        if: |
          steps.pr-info.outputs.pr-number != '' &&
          steps.check-auto-merge.outputs.has-auto-merge == 'true' &&
          steps.merge-check.outputs.can-merge != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ steps.pr-info.outputs.pr-number }}"

          cat > comment.md << 'EOF'
          ## 🤖 Auto-Merge Status

          This PR has the `auto-merge` label but cannot be merged yet.

          **Conditions:**
          - ✅ Auto-merge enabled: Yes
          - ${{ steps.pr-info.outputs.mergeable == 'MERGEABLE' && '✅' || '❌' }} Mergeable: ${{ steps.pr-info.outputs.mergeable }}
          - ${{ steps.review-threads.outputs.unresolved-threads == '0' && '✅' || '❌' }} Review Threads: ${{ steps.review-threads.outputs.unresolved-threads || '0' }} unresolved
          - ${{ steps.wait-checks.outputs.all-checks-passed == 'true' && '✅' || (steps.wait-checks.outputs.has-failing-checks == 'true' && '❌' || '⏱️') }} CI Checks: ${{ steps.wait-checks.outputs.has-failing-checks == 'true' && 'Failing' || (steps.wait-checks.outputs.all-checks-passed == 'true' && 'Passing' || 'Pending') }}
          - ${{ steps.pr-info.outputs.review-decision == 'APPROVED' && '✅' || '⏱️' }} Reviews: ${{ steps.pr-info.outputs.review-decision || 'Pending' }}

          The PR will be automatically merged when all conditions are met.
          EOF

          gh pr comment $PR_NUMBER --body-file comment.md

  # Cleanup old auto-merge comments
  cleanup-comments:
    name: Cleanup Old Comments
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || github.event_name == 'pull_request_review'
    steps:
      - name: Remove old auto-merge comments
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          PR_NUMBER="${{ github.event.pull_request.number }}"

          # Get comments from bot
          COMMENTS=$(gh api "/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
            --jq '[.[] | select(.user.type == "Bot" and (.body | contains("Auto-Merge Status")))] | .[].id' \
            2>/dev/null || true)
          COMMENTS=$(printf '%s\n' "$COMMENTS" | grep -E '^[0-9]+$' || true)

          if [ -z "$COMMENTS" ]; then
            echo "No old auto-merge comments to remove or GitHub CLI auth unavailable."
            exit 0
          fi

          # Delete old comments
          for COMMENT_ID in $COMMENTS; do
            gh api -X DELETE "/repos/${{ github.repository }}/issues/comments/$COMMENT_ID" || true
          done
