name: Mortgage CRM CI/CD

on:
  pull_request:
    paths:
      - "apps/mortgage-crm/**"
  push:
    branches: [main, develop]
    paths:
      - "apps/mortgage-crm/**"

jobs:
  lint-and-typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install
      - run: pnpm --filter @nyra/mortgage-crm lint
      - run: pnpm --filter @nyra/mortgage-crm typecheck

  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v4
        with:
          version: 10.27.0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "pnpm"
      - run: pnpm install
      - name: Prisma Generate
        run: pnpm --filter @nyra/mortgage-crm prisma:generate
      - name: Run Tests
        run: pnpm --filter @nyra/mortgage-crm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/mortgage_crm_test

  deploy-staging:
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Staging
        run: |
          echo "Deploying @nyra/mortgage-crm to staging..."
          # Add actual deployment steps here (e.g., Vercel, AWS, etc.)

  deploy-production:
    needs: [lint-and-typecheck, test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://app.mortgage-crm.com
    steps:
      - uses: actions/checkout@v4
      - name: Deploy to Production
        run: |
          echo "Deploying @nyra/mortgage-crm to production..."
          # Add actual deployment steps here
