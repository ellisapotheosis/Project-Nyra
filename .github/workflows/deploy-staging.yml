name: Deploy to Staging

on:
  push:
    branches:
      - develop
  workflow_dispatch:
    inputs:
      services:
        description: 'Comma-separated list of services to deploy (or "all")'
        required: false
        default: 'all'

env:
  ENVIRONMENT: staging
  DEPLOY_TIMEOUT: 600

permissions:
  contents: read
  packages: read
  deployments: write

jobs:
  prepare-deployment:
    name: Prepare Staging Deployment
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.matrix }}
      deployment-id: ${{ steps.deployment.outputs.deployment_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Determine services to deploy
        id: services
        run: |
          if [ "${{ github.event.inputs.services }}" == "all" ] || [ -z "${{ github.event.inputs.services }}" ]; then
            # Deploy all services with Dockerfiles
            SERVICES='["nyra-admin","ratehunter","crm","webapp","campaign-engine","claude-flow","ruv-swarm"]'
          else
            # Parse comma-separated list
            SERVICES=$(echo '${{ github.event.inputs.services }}' | jq -R -c 'split(",") | map(gsub(" "; ""))')
          fi

          echo "matrix=$SERVICES" >> $GITHUB_OUTPUT
          echo "Deploying services: $SERVICES"

      - name: Create deployment
        id: deployment
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = await github.rest.repos.createDeployment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              ref: context.sha,
              environment: 'staging',
              required_contexts: [],
              auto_merge: false,
              description: 'Staging deployment'
            });
            return deployment.data.id;

  # Setup Infisical secrets
  setup-secrets:
    name: Setup Infisical Secrets
    runs-on: ubuntu-latest
    needs: [prepare-deployment]
    steps:
      - uses: actions/checkout@v4

      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical

      - name: Fetch secrets from Infisical
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN_STAGING }}
        run: |
          if [ -n "$INFISICAL_TOKEN" ]; then
            infisical export --env=staging --format=dotenv > .env.staging

            # Mask sensitive values in logs
            while IFS='=' read -r key value; do
              echo "::add-mask::$value"
            done < .env.staging
          else
            echo "Warning: INFISICAL_TOKEN_STAGING not configured"
            touch .env.staging
          fi

      - name: Upload secrets artifact
        uses: actions/upload-artifact@v4
        with:
          name: staging-secrets
          path: .env.staging
          retention-days: 1

  # Deploy services in parallel
  deploy-service:
    name: Deploy ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [prepare-deployment, setup-secrets]
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        service: ${{ fromJson(needs.prepare-deployment.outputs.services) }}
    environment:
      name: staging
      url: https://${{ matrix.service }}.staging.your-domain.com
    steps:
      - uses: actions/checkout@v4

      - name: Download secrets
        uses: actions/download-artifact@v4
        with:
          name: staging-secrets

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull latest image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}:develop"
          docker pull $IMAGE

      - name: Configure deployment
        id: config
        run: |
          # Determine service port and health check endpoint
          case "${{ matrix.service }}" in
            nyra-admin)
              echo "port=3001" >> $GITHUB_OUTPUT
              echo "health-path=/api/health" >> $GITHUB_OUTPUT
              ;;
            ratehunter)
              echo "port=3002" >> $GITHUB_OUTPUT
              echo "health-path=/api/health" >> $GITHUB_OUTPUT
              ;;
            crm)
              echo "port=3003" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
            webapp)
              echo "port=3000" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
            campaign-engine)
              echo "port=4000" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
            claude-flow)
              echo "port=5000" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
            ruv-swarm)
              echo "port=5001" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
            *)
              echo "port=3000" >> $GITHUB_OUTPUT
              echo "health-path=/health" >> $GITHUB_OUTPUT
              ;;
          esac

      - name: Deploy to staging server
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          # Configure SSH
          mkdir -p ~/.ssh
          echo "$STAGING_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H $STAGING_HOST >> ~/.ssh/known_hosts

          SERVICE="${{ matrix.service }}"
          PORT="${{ steps.config.outputs.port }}"
          IMAGE="ghcr.io/${{ github.repository_owner }}/$SERVICE:develop"

          # Deploy via SSH
          ssh -i ~/.ssh/deploy_key $STAGING_USER@$STAGING_HOST << EOF
            # Stop existing container
            docker stop $SERVICE-staging || true
            docker rm $SERVICE-staging || true

            # Pull latest image
            docker pull $IMAGE

            # Start new container
            docker run -d \
              --name $SERVICE-staging \
              --restart unless-stopped \
              -p $PORT:$PORT \
              --env-file /opt/staging/.env \
              --label com.project-nyra.service=$SERVICE \
              --label com.project-nyra.environment=staging \
              --network staging-network \
              $IMAGE

            # Wait for container to start
            sleep 5

            # Check if container is running
            docker ps | grep $SERVICE-staging
          EOF

      - name: Health check
        id: health-check
        run: |
          SERVICE="${{ matrix.service }}"
          HEALTH_PATH="${{ steps.config.outputs.health-path }}"
          PORT="${{ steps.config.outputs.port }}"
          HOST="${{ secrets.STAGING_HOST }}"

          MAX_ATTEMPTS=30
          ATTEMPT=0

          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            if curl -f -s -o /dev/null "http://$HOST:$PORT$HEALTH_PATH"; then
              echo "✅ Service $SERVICE is healthy"
              echo "healthy=true" >> $GITHUB_OUTPUT
              exit 0
            fi

            echo "Attempt $((ATTEMPT + 1))/$MAX_ATTEMPTS - Service not ready yet..."
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "❌ Service $SERVICE failed health check"
          echo "healthy=false" >> $GITHUB_OUTPUT
          exit 1

      - name: Rollback on failure
        if: failure() && steps.health-check.outputs.healthy == 'false'
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
          STAGING_USER: ${{ secrets.STAGING_USER }}
          STAGING_SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
        run: |
          SERVICE="${{ matrix.service }}"

          ssh -i ~/.ssh/deploy_key $STAGING_USER@$STAGING_HOST << EOF
            # Stop failed container
            docker stop $SERVICE-staging || true
            docker rm $SERVICE-staging || true

            # Restore previous version
            PREVIOUS_IMAGE=\$(docker images "ghcr.io/${{ github.repository_owner }}/$SERVICE" --format "{{.Repository}}:{{.Tag}}" | grep -v develop | head -1)
            if [ -n "\$PREVIOUS_IMAGE" ]; then
              echo "Rolling back to \$PREVIOUS_IMAGE"
              docker run -d \
                --name $SERVICE-staging \
                --restart unless-stopped \
                -p ${{ steps.config.outputs.port }}:${{ steps.config.outputs.port }} \
                --env-file /opt/staging/.env \
                --network staging-network \
                \$PREVIOUS_IMAGE
            fi
          EOF

  # Update deployment status
  deployment-status:
    name: Update Deployment Status
    runs-on: ubuntu-latest
    needs: [prepare-deployment, deploy-service]
    if: always()
    steps:
      - name: Update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const deploymentId = ${{ needs.prepare-deployment.outputs.deployment-id }};
            const success = '${{ needs.deploy-service.result }}' === 'success';

            await github.rest.repos.createDeploymentStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              deployment_id: deploymentId,
              state: success ? 'success' : 'failure',
              environment_url: 'https://staging.your-domain.com',
              description: success ? 'Deployment succeeded' : 'Deployment failed'
            });

      - name: Deployment summary
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status:** ${{ needs.deploy-service.result }}" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** staging" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # Run smoke tests
  smoke-tests:
    name: Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-service]
    if: needs.deploy-service.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Run basic smoke tests
        env:
          STAGING_HOST: ${{ secrets.STAGING_HOST }}
        run: |
          echo "Running smoke tests against staging environment..."

          # Test each service endpoint
          for service in nyra-admin ratehunter crm webapp; do
            URL="https://$service.staging.your-domain.com/health"
            if curl -f -s "$URL" > /dev/null; then
              echo "✅ $service is responding"
            else
              echo "❌ $service is not responding"
              exit 1
            fi
          done

          echo "All smoke tests passed!"
