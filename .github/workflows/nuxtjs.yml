# Sample workflow for building and deploying a Nuxt site to GitHub Pages
#
# To get started with Nuxt see: https://nuxtjs.org/docs/get-started/installation
#
name: Deploy Nuxt site to Pages

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      can_deploy: ${{ steps.pages-capability.outputs.can_deploy }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect package manager
        id: detect-package-manager
        run: |
          if [ -f "${{ github.workspace }}/pnpm-lock.yaml" ] || [ -f "${{ github.workspace }}/pnpm-workspace.yaml" ]; then
            echo "manager=pnpm" >> $GITHUB_OUTPUT
            echo "command=install --no-frozen-lockfile" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/yarn.lock" ]; then
            echo "manager=yarn" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          elif [ -f "${{ github.workspace }}/package.json" ]; then
            echo "manager=npm" >> $GITHUB_OUTPUT
            echo "command=install" >> $GITHUB_OUTPUT
            exit 0
          else
            echo "Unable to determine package manager"
            exit 1
          fi
      - name: Setup pnpm
        if: steps.detect-package-manager.outputs.manager == 'pnpm'
        uses: pnpm/action-setup@078e9d416474b29c0c387560859308974f7e9c53 # v4
        with:
          version: 10.27.0
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: ${{ steps.detect-package-manager.outputs.manager }}
      - name: Check Pages integration capability
        id: pages-capability
        uses: actions/github-script@v9
        with:
          script: |
            try {
              await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.setOutput("can_deploy", "true");
            } catch (error) {
              if (error.status === 404 || error.status === 403) {
                core.warning(`Skipping Pages deploy: ${error.message}`);
                core.setOutput("can_deploy", "false");
                return;
              }
              throw error;
            }
      - name: Setup Pages
        if: steps.pages-capability.outputs.can_deploy == 'true'
        uses: actions/configure-pages@v6
        with:
          enablement: true
          # Automatically inject router.base in your Nuxt configuration file and set
          # target to static (https://nuxtjs.org/docs/configuration-glossary/configuration-target/).
          #
          # You may remove this line if you want to manage the configuration yourself.
          static_site_generator: nuxt
      - name: Restore cache
        if: steps.pages-capability.outputs.can_deploy == 'true'
        uses: actions/cache@v5
        with:
          path: |
            dist
            .nuxt
          key: ${{ runner.os }}-nuxt-build-${{ hashFiles('**/pnpm-lock.yaml', '**/package-lock.json', '**/yarn.lock', '**/nuxt.config.*', '**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-nuxt-build-
      - name: Install dependencies
        if: steps.pages-capability.outputs.can_deploy == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} ${{ steps.detect-package-manager.outputs.command }}
      - name: Static HTML export with Nuxt
        if: steps.pages-capability.outputs.can_deploy == 'true'
        run: ${{ steps.detect-package-manager.outputs.manager }} run generate
      - name: Upload artifact
        if: steps.pages-capability.outputs.can_deploy == 'true'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist
      - name: Pages deploy skipped summary
        if: steps.pages-capability.outputs.can_deploy != 'true'
        run: |
          echo "GitHub Pages deploy skipped: repository Pages access is unavailable." >> "$GITHUB_STEP_SUMMARY"

  # Deployment job
  deploy:
    if: needs.build.outputs.can_deploy == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
