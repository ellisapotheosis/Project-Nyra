name: Auto Versioning & Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  packages: write

jobs:
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    outputs:
      new-release-published: ${{ steps.semantic.outputs.new-release-published }}
      new-release-version: ${{ steps.semantic.outputs.new-release-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: https://registry.npmjs.org
          scope: '@twenty-crm'

      - name: Setup PNPM
        uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4
        with:
          version: '10.27.0'

      - name: Install dependencies
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: pnpm install --no-frozen-lockfile

      - name: Verify Release Configuration
        run: |
          if [ ! -f ".releaserc.json" ]; then
            echo "Error: .releaserc.json not found"
            exit 1
          fi
          cat .releaserc.json

      - name: Semantic Release
        id: semantic
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 22
          extra_plugins: |
            @semantic-release/changelog@6
            @semantic-release/git@10
            @semantic-release/github@9
            @semantic-release/exec@6
            conventional-changelog-conventionalcommits@7
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Summary
        if: steps.semantic.outputs.new-release-published == 'true'
        run: |
          echo "## 🚀 New Release Published!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Version:** ${{ steps.semantic.outputs.new-release-version }}" >> $GITHUB_STEP_SUMMARY
          echo "**Release Notes:** ${{ steps.semantic.outputs.new-release-notes }}" >> $GITHUB_STEP_SUMMARY

  # Tag Docker images with version
  tag-docker-images:
    name: Tag Docker Images
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    strategy:
      matrix:
        service:
          - nyra-admin
          - ratehunter
          - crm
          - webapp
          - campaign-engine
          - claude-flow
          - ruv-swarm
    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull and tag image
        run: |
          IMAGE="ghcr.io/${{ github.repository_owner }}/${{ matrix.service }}"
          VERSION="${{ needs.release.outputs.new-release-version }}"

          # Pull latest
          docker pull $IMAGE:main || docker pull $IMAGE:latest

          # Tag with version
          docker tag $IMAGE:main $IMAGE:$VERSION || docker tag $IMAGE:latest $IMAGE:$VERSION
          docker tag $IMAGE:main $IMAGE:v$VERSION || docker tag $IMAGE:latest $IMAGE:v$VERSION

          # Push versioned tags
          docker push $IMAGE:$VERSION
          docker push $IMAGE:v$VERSION

  # Create GitHub Release
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [release, tag-docker-images]
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate changelog
        id: changelog
        run: |
          VERSION="${{ needs.release.outputs.new-release-version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")

          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log $PREV_TAG..HEAD --pretty=format:"- %s (%an)" --no-merges)
          else
            CHANGELOG=$(git log --pretty=format:"- %s (%an)" --no-merges)
          fi

          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "$CHANGELOG" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ needs.release.outputs.new-release-version }}
          release_name: Release v${{ needs.release.outputs.new-release-version }}
          body: |
            ## 🎉 Release v${{ needs.release.outputs.new-release-version }}

            ### Changes
            ${{ steps.changelog.outputs.changelog }}

            ### Docker Images
            All services are available with tag `v${{ needs.release.outputs.new-release-version }}`

            ```bash
            docker pull ghcr.io/${{ github.repository_owner }}/nyra-admin:v${{ needs.release.outputs.new-release-version }}
            docker pull ghcr.io/${{ github.repository_owner }}/ratehunter:v${{ needs.release.outputs.new-release-version }}
            ```
          draft: false
          prerelease: false

  # Notify on Slack/Discord (optional)
  notify:
    name: Notify Release
    runs-on: ubuntu-latest
    needs: [release]
    if: needs.release.outputs.new-release-published == 'true'
    steps:
      - name: Send notification
        run: |
          echo "Release v${{ needs.release.outputs.new-release-version }} published!"
          # Add Slack/Discord webhook notification here if needed
