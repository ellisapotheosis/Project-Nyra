name: Deploy Project Nyra Landing to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - "apps/projectnyra-landing/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/deploy-projectnyra-pages.yml"
  workflow_dispatch:

concurrency:
  group: projectnyra-landing-pages
  cancel-in-progress: true

permissions:
  contents: read
  deployments: write

env:
  NODE_VERSION: "24"
  PNPM_VERSION: "10.27.0"
  PROJECT_NAME: projectnyra-landing

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Build OpenNext Pages artifact
        working-directory: apps/projectnyra-landing
        run: pnpm run build:cf

      - name: Deploy Pages artifact with Wrangler
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy apps/projectnyra-landing/.open-next --project-name "$PROJECT_NAME" --branch main
