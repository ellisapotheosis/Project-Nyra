name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  actions: read
  security-events: write

jobs:
  infisical-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Scan the checked-out tree, not every historical commit. Historical
          # findings are reviewed separately and must not block unrelated PRs.
          fetch-depth: 1

      - name: Install Infisical CLI
        run: npm install -g @infisical/cli

      - name: Run Infisical scan
        run: |
          mkdir -p .reports/security
          infisical scan \
            --source . \
            --no-git \
            --redact \
            --no-color \
            --report-format sarif \
            --report-path .reports/security/infisical.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: .reports/security/infisical.sarif
          category: infisical-secrets
