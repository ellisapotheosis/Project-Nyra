name: Secret scan

on:
  pull_request:
  push:
    branches:
      - main
      - master

permissions:
  contents: read
  security-events: write

jobs:
  infisical-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Infisical CLI
        run: npm install -g @infisical/cli

      - name: Stage bounded scan inputs
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .reports/security/source
          mkdir -p .reports/security/source
          git ls-files -z -- \
            .github apps services packages mcp-servers infra/hosts ops scripts \
            package.json pnpm-lock.yaml pnpm-workspace.yaml \
            ':(exclude)docs/archive/**' \
            ':(exclude)apps/guidance/references/**' \
            ':(exclude)data/**' \
            ':(exclude)**/.omc/**' \
            ':(exclude)**/.agent/**' \
            ':(exclude)**/node_modules/**' \
            ':(exclude)**/.next/**' \
            ':(exclude)**/dist/**' \
            ':(exclude)**/build/**' \
            | while IFS= read -r -d '' file; do
              mkdir -p ".reports/security/source/$(dirname "$file")"
              cp -- "$file" ".reports/security/source/$file"
            done

      - name: Run Infisical scan
        run: |
          set -euo pipefail
          mkdir -p .reports/security
          timeout --signal=TERM --kill-after=30s 8m infisical scan \
            --source .reports/security/source \
            --redact \
            --report-format sarif \
            --report-path .reports/security/infisical.sarif

      - name: Upload SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: .reports/security/infisical.sarif
          category: infisical-secrets
