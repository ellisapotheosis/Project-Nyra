name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/ratehunter/landing/**"
      - ".github/workflows/deploy-cloudflare-pages.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/ratehunter/landing/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview
      force_deploy:
        description: "Force deploy even if no changes"
        required: false
        default: "false"
        type: boolean
      skip_tests:
        description: "Skip tests for faster deployment"
        required: false
        default: "false"
        type: boolean
      purge_cache:
        description: "Purge Cloudflare cache after deployment"
        required: false
        default: "true"
        type: boolean

# Prevent concurrent deployments to the same environment
concurrency:
  group: cloudflare-deploy-${{ github.event.inputs.environment || (github.event_name == 'pull_request' && 'preview' || 'production') }}
  cancel-in-progress: true

# Configure environment variables for the workflow
env:
  NODE_VERSION: "20"
  PNPM_VERSION: "10.27.0"
  APP_DIR: "apps/ratehunter/landing"
  CLOUDFLARE_PROJECT_NAME: "ratehunter-landing"
  PRODUCTION_DOMAIN: "https://ratehunter.net"
  EXPECTED_HOMEPAGE_TEXT: "Ellis Andersen"
  # Infisical configuration for secret injection
  INFISICAL_PROJECT_ID: "8374cea9-e5e8-4050-bda4-b91f25ab30ef"

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write # Required for OIDC token exchange with Infisical

jobs:
  # ==========================================================================
  # Pre-flight Checks - Validate configuration before deployment
  # ==========================================================================
  preflight:
    name: 🔍 Pre-flight Checks
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.determine-env.outputs.environment }}
      should_deploy: ${{ steps.check-changes.outputs.should_deploy }}
      app_dir_exists: ${{ steps.verify-app-dir.outputs.app_dir_exists }}
      has_infisical: ${{ steps.check-secrets.outputs.has_infisical }}
      has_direct_secrets: ${{ steps.check-secrets.outputs.has_direct_secrets }}
      deploy_method: ${{ steps.check-secrets.outputs.deploy_method }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2 # Need previous commit to detect changes

      - name: Determine deployment environment
        id: determine-env
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            ENV="${{ github.event.inputs.environment }}"
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            ENV="preview"
          else
            ENV="production"
          fi
          echo "environment=$ENV" >> $GITHUB_OUTPUT
          echo "📌 Deployment environment: $ENV"

      - name: Verify app directory exists
        id: verify-app-dir
        run: |
          if [ -d "${{ env.APP_DIR }}" ]; then
            echo "app_dir_exists=true" >> $GITHUB_OUTPUT
            echo "✅ Found app directory: ${{ env.APP_DIR }}"
          else
            echo "app_dir_exists=false" >> $GITHUB_OUTPUT
            echo "::warning::App directory '${{ env.APP_DIR }}' does not exist in this commit. Deployment will be skipped."
          fi

      - name: Check for relevant changes
        id: check-changes
        run: |
          if [ "${{ steps.verify-app-dir.outputs.app_dir_exists }}" != "true" ]; then
            echo "should_deploy=false" >> $GITHUB_OUTPUT
            echo "ℹ️ Skipping deployment because app directory is missing."
            exit 0
          fi

          if [ "${{ github.event.inputs.force_deploy }}" == "true" ]; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Force deploy enabled"
            exit 0
          fi

          # Check if any files in the app directory changed
          if git diff --name-only HEAD~1 HEAD | grep -q "^${{ env.APP_DIR }}/"; then
            echo "should_deploy=true" >> $GITHUB_OUTPUT
            echo "✅ Changes detected in ${{ env.APP_DIR }}"
          else
            # For workflow_dispatch, still deploy; for push, only deploy if workflow file changed
            if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "ℹ️ Workflow dispatch - deploying regardless of changes"
            else
              echo "should_deploy=true" >> $GITHUB_OUTPUT
              echo "ℹ️ Workflow file changed - deploying"
            fi
          fi

      - name: Check available secrets configuration
        id: check-secrets
        env:
          # Test if secrets are available (will be empty string if not set).
          # Infisical's GitHub sync writes normal GitHub secrets, so these
          # are still treated as a GitHub-synced source at runtime.
          HAS_CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
          HAS_CLOUDFLARE_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_INFISICAL_SYNC_TOKEN: ${{ secrets.INFISICAL_CLOUDFLARE_API_TOKEN != '' }}
          HAS_INFISICAL_SYNC_ACCOUNT: ${{ secrets.INFISICAL_CLOUDFLARE_ACCOUNT_ID != '' }}
          HAS_CF_ALIAS_TOKEN: ${{ secrets.CF_API_TOKEN != '' }}
          HAS_CF_ALIAS_ACCOUNT: ${{ secrets.CF_ACCOUNT_ID != '' }}
          HAS_PAGES_ALIAS_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN != '' }}
          HAS_PAGES_ALIAS_ACCOUNT: ${{ secrets.CLOUDFLARE_PAGES_ACCOUNT_ID != '' }}
          HAS_INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN != '' }}
          GITHUB_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INFISICAL_SYNC_CLOUDFLARE_API_TOKEN: ${{ secrets.INFISICAL_CLOUDFLARE_API_TOKEN }}
          INFISICAL_SYNC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.INFISICAL_CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GITHUB_CLOUDFLARE_PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_ACCOUNT_ID }}
        run: |
          echo "🔐 Checking secrets configuration..."

          is_placeholder() {
            local value="$1"
            case "$value" in
              ""|"\$"*|"your_"*|"YOUR_"*|"<"*">")
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_account_id() {
            printf '%s' "$1" | grep -Eq '^[A-Fa-f0-9]{32}$'
          }

          has_valid_pair() {
            local source="$1"
            local token="$2"
            local account_id="$3"

            if ! is_placeholder "$token" && is_account_id "$account_id"; then
              echo "✅ Valid GitHub secret pair found: $source"
              return 0
            fi

            if ! is_placeholder "$token" || ! is_placeholder "$account_id"; then
              echo "::warning::GitHub secret pair '$source' exists but account ID is missing, placeholder, or not a 32-character hex value."
            fi

            return 1
          }

          HAS_GITHUB_SYNCED_PAIR=false
          HAS_VALID_GITHUB_SYNCED_PAIR=false
          if [ "$HAS_CLOUDFLARE_TOKEN" == "true" ] && [ "$HAS_CLOUDFLARE_ACCOUNT" == "true" ]; then
            HAS_GITHUB_SYNCED_PAIR=true
            echo "✅ GitHub secret pair found: CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"
            if has_valid_pair "CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID" "$GITHUB_CLOUDFLARE_API_TOKEN" "$GITHUB_CLOUDFLARE_ACCOUNT_ID"; then
              HAS_VALID_GITHUB_SYNCED_PAIR=true
            fi
          fi
          if [ "$HAS_INFISICAL_SYNC_TOKEN" == "true" ] && [ "$HAS_INFISICAL_SYNC_ACCOUNT" == "true" ]; then
            HAS_GITHUB_SYNCED_PAIR=true
            echo "✅ GitHub secret pair found: INFISICAL_CLOUDFLARE_API_TOKEN / INFISICAL_CLOUDFLARE_ACCOUNT_ID"
            if has_valid_pair "INFISICAL_CLOUDFLARE_API_TOKEN / INFISICAL_CLOUDFLARE_ACCOUNT_ID" "$INFISICAL_SYNC_CLOUDFLARE_API_TOKEN" "$INFISICAL_SYNC_CLOUDFLARE_ACCOUNT_ID"; then
              HAS_VALID_GITHUB_SYNCED_PAIR=true
            fi
          fi
          if [ "$HAS_CF_ALIAS_TOKEN" == "true" ] && [ "$HAS_CF_ALIAS_ACCOUNT" == "true" ]; then
            HAS_GITHUB_SYNCED_PAIR=true
            echo "✅ GitHub secret pair found: CF_API_TOKEN / CF_ACCOUNT_ID"
            if has_valid_pair "CF_API_TOKEN / CF_ACCOUNT_ID" "$GITHUB_CF_API_TOKEN" "$GITHUB_CF_ACCOUNT_ID"; then
              HAS_VALID_GITHUB_SYNCED_PAIR=true
            fi
          fi
          if [ "$HAS_PAGES_ALIAS_TOKEN" == "true" ] && [ "$HAS_PAGES_ALIAS_ACCOUNT" == "true" ]; then
            HAS_GITHUB_SYNCED_PAIR=true
            echo "✅ GitHub secret pair found: CLOUDFLARE_PAGES_API_TOKEN / CLOUDFLARE_PAGES_ACCOUNT_ID"
            if has_valid_pair "CLOUDFLARE_PAGES_API_TOKEN / CLOUDFLARE_PAGES_ACCOUNT_ID" "$GITHUB_CLOUDFLARE_PAGES_API_TOKEN" "$GITHUB_CLOUDFLARE_PAGES_ACCOUNT_ID"; then
              HAS_VALID_GITHUB_SYNCED_PAIR=true
            fi
          fi

          # Check GitHub secrets, including values synced from Infisical.
          if [ "$HAS_VALID_GITHUB_SYNCED_PAIR" == "true" ]; then
            echo "has_direct_secrets=true" >> $GITHUB_OUTPUT
            echo "✅ Valid GitHub/Infisical-synced Cloudflare secrets found"
          elif [ "$HAS_GITHUB_SYNCED_PAIR" == "true" ]; then
            echo "has_direct_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ GitHub/Infisical-synced Cloudflare secrets exist but none contain a valid account ID"
          else
            echo "has_direct_secrets=false" >> $GITHUB_OUTPUT
            echo "⚠️ No GitHub-synced Cloudflare credential pair found"
          fi

          # Check Infisical CLI token. This is only needed when the workflow
          # fetches secrets directly from Infisical instead of using GitHub sync.
          if [ "$HAS_INFISICAL_TOKEN" == "true" ]; then
            echo "has_infisical=true" >> $GITHUB_OUTPUT
            echo "✅ Infisical CLI token detected"
          else
            echo "has_infisical=false" >> $GITHUB_OUTPUT
            echo "ℹ️ No Infisical CLI token configured"
          fi

          # Determine deployment method
          if [ "$HAS_VALID_GITHUB_SYNCED_PAIR" == "true" ]; then
            echo "deploy_method=github-synced" >> $GITHUB_OUTPUT
            echo "📝 Will resolve Cloudflare credentials from GitHub secrets, including Infisical-synced aliases"
          elif [ "$HAS_INFISICAL_TOKEN" == "true" ]; then
            echo "deploy_method=infisical-cli" >> $GITHUB_OUTPUT
            echo "📝 Will use Infisical CLI to fetch secrets"
          else
            echo "deploy_method=none" >> $GITHUB_OUTPUT
            echo "❌ No valid secret source available"
            exit 1
          fi

  # ==========================================================================
  # Fetch Secrets from Infisical (only if GitHub-synced secrets are not available)
  # ==========================================================================
  fetch-secrets:
    name: 🔑 Fetch Secrets from Infisical
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.deploy_method == 'infisical-cli'
    outputs:
      secrets_available: ${{ steps.fetch.outputs.secrets_available }}
    steps:
      - name: Install Infisical CLI
        run: |
          curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
          sudo apt-get update && sudo apt-get install -y infisical
          infisical --version

      - name: Fetch secrets for ${{ needs.preflight.outputs.environment }}
        id: fetch
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          TOKEN="$INFISICAL_TOKEN"

          if [ -n "$TOKEN" ]; then
            echo "::add-mask::$TOKEN"
            echo "INFISICAL_TOKEN=$TOKEN" >> $GITHUB_ENV
          fi

          if [ -z "$TOKEN" ]; then
            echo "❌ No Infisical token available for environment: ${{ needs.preflight.outputs.environment }}"
            echo "secrets_available=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          # Map workflow environment to Infisical environment
          case "${{ needs.preflight.outputs.environment }}" in
            production)
              INFISICAL_ENV="prod"
              ;;
            preview|staging)
              INFISICAL_ENV="stag"
              ;;
            *)
              INFISICAL_ENV="dev"
              ;;
          esac

          echo "🔐 Fetching secrets from Infisical environment: $INFISICAL_ENV"

          SECRETS_FETCHED=false
          FETCH_PATH=""
          FETCH_ENV=""

          # Prefer CI/CD-scoped path first
          if infisical export --env="$INFISICAL_ENV" --path=/CI-CD --format=dotenv --token="$TOKEN" > /tmp/cloudflare-secrets.env 2>/dev/null; then
            SECRETS_FETCHED=true
            FETCH_PATH="/CI-CD"
            FETCH_ENV="$INFISICAL_ENV"
          elif [ "$INFISICAL_ENV" = "stag" ] && infisical export --env=staging --path=/CI-CD --format=dotenv --token="$TOKEN" > /tmp/cloudflare-secrets.env 2>/dev/null; then
            # Backward-compatible fallback if legacy slug exists
            SECRETS_FETCHED=true
            FETCH_PATH="/CI-CD"
            FETCH_ENV="staging"
          # Backward-compatible fallback path
          elif infisical export --env="$INFISICAL_ENV" --path=/shared --format=dotenv --token="$TOKEN" > /tmp/cloudflare-secrets.env 2>/dev/null; then
            SECRETS_FETCHED=true
            FETCH_PATH="/shared"
            FETCH_ENV="$INFISICAL_ENV"
          elif [ "$INFISICAL_ENV" = "stag" ] && infisical export --env=staging --path=/shared --format=dotenv --token="$TOKEN" > /tmp/cloudflare-secrets.env 2>/dev/null; then
            SECRETS_FETCHED=true
            FETCH_PATH="/shared"
            FETCH_ENV="staging"
          fi

          # Export secrets to a file for the next job
          if [ "$SECRETS_FETCHED" = "true" ]; then
            echo "✅ Infisical export succeeded from path $FETCH_PATH (env: $FETCH_ENV)"
            # Check if CLOUDFLARE secrets are present
            if grep -q "CLOUDFLARE_API_TOKEN" /tmp/cloudflare-secrets.env && grep -q "CLOUDFLARE_ACCOUNT_ID" /tmp/cloudflare-secrets.env; then
              echo "✅ Cloudflare secrets fetched successfully from Infisical"
              echo "secrets_available=true" >> $GITHUB_OUTPUT

              # Mask the secrets in logs
              while IFS='=' read -r key value; do
                if [ -n "$value" ]; then
                  echo "::add-mask::$value"
                fi
              done < /tmp/cloudflare-secrets.env
            else
              echo "⚠️ Secrets fetched but CLOUDFLARE credentials not found"
              echo "Please ensure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set in Infisical"
              echo "secrets_available=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Failed to fetch secrets from Infisical"
            echo "secrets_available=false" >> $GITHUB_OUTPUT
          fi

      - name: Upload secrets as artifact
        if: steps.fetch.outputs.secrets_available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: cloudflare-secrets-${{ needs.preflight.outputs.environment }}
          path: /tmp/cloudflare-secrets.env
          retention-days: 1
          if-no-files-found: error

  # ==========================================================================
  # Build Application
  # ==========================================================================
  build:
    name: 🔨 Build Application
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.should_deploy == 'true' && needs.preflight.outputs.deploy_method != 'none'
    outputs:
      build_dir: ${{ steps.build.outputs.build_dir }}
      build_size: ${{ steps.build.outputs.build_size }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false

      - name: Setup PNPM
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_OUTPUT

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Cache Next.js build
        uses: actions/cache@v5
        with:
          path: |
            ${{ env.APP_DIR }}/.next/cache
            ${{ env.APP_DIR }}/.open-next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-${{ hashFiles('**.[jt]s', '**.[jt]sx') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/pnpm-lock.yaml') }}-

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies..."
          if [ -f "apps/twenty-crm/package.json" ]; then
            mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
          fi
          trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
          pnpm install --no-frozen-lockfile

      - name: Run linting
        if: github.event.inputs.skip_tests != 'true'
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          echo "🔍 Running ESLint..."
          pnpm lint || echo "::warning::Linting issues found, continuing with build"

      - name: Run type checking
        if: github.event.inputs.skip_tests != 'true'
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          echo "📝 Running TypeScript type check..."
          pnpm typecheck || echo "::warning::Type errors found, continuing with build"

      - name: Run tests
        if: github.event.inputs.skip_tests != 'true'
        working-directory: ${{ env.APP_DIR }}
        continue-on-error: true
        run: |
          echo "🧪 Running tests..."
          pnpm test:ci || echo "::warning::Test failures, continuing with build"

      - name: Build for Cloudflare Pages
        id: build
        working-directory: ${{ env.APP_DIR }}
        env:
          NEXT_PUBLIC_BUILD_TIME: ${{ github.event.head_commit.timestamp || github.event.pull_request.updated_at }}
          NEXT_PUBLIC_COMMIT_SHA: ${{ github.sha }}
          NEXT_PUBLIC_BRANCH: ${{ github.head_ref || github.ref_name }}
          NODE_ENV: production
        run: |
          echo "🔨 Building Next.js application for Cloudflare Pages..."

          # Try to use opennextjs-cloudflare build first (preferred for CF Pages)
          if pnpm run build:cf 2>/dev/null; then
            BUILD_DIR=".open-next"
            echo "✅ OpenNext build completed (using .open-next directory)"
          elif pnpm run build 2>/dev/null; then
            # Fallback to standard Next.js build
            if [ -d "out" ]; then
              BUILD_DIR="out"
              echo "✅ Static export build completed (using out directory)"
            elif [ -d ".next" ]; then
              BUILD_DIR=".next"
              echo "✅ Next.js build completed (using .next directory)"
            elif [ -d ".open-next" ]; then
              BUILD_DIR=".open-next"
              echo "✅ OpenNext output detected (using .open-next directory)"
            else
              BUILD_DIR="."
              echo "⚠️ No build output detected, using source directory"
            fi
          else
            echo "❌ Build failed"
            exit 1
          fi

          echo "build_dir=$BUILD_DIR" >> $GITHUB_OUTPUT

          # Calculate build size
          if [ -d "$BUILD_DIR" ]; then
            BUILD_SIZE=$(du -sh "$BUILD_DIR" | cut -f1)
            echo "build_size=$BUILD_SIZE" >> $GITHUB_OUTPUT
            echo "📊 Build size: $BUILD_SIZE"
          fi

      - name: Verify build artifacts
        run: |
          echo "📦 Preparing build artifact from ${{ env.APP_DIR }}/${{ steps.build.outputs.build_dir }}"
          test -d "${{ env.APP_DIR }}/${{ steps.build.outputs.build_dir }}"
          ls -la "${{ env.APP_DIR }}/${{ steps.build.outputs.build_dir }}" | sed -n '1,80p'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: build-output-${{ github.sha }}
          path: ${{ env.APP_DIR }}/${{ steps.build.outputs.build_dir }}
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: error

  # ==========================================================================
  # Deploy to Cloudflare Pages
  # ==========================================================================
  deploy:
    name: 🚀 Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    needs: [preflight, build, fetch-secrets]
    # Run if we have GitHub-synced secrets OR if fetch-secrets succeeded
    # Use 'always()' to evaluate even if fetch-secrets was skipped
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.preflight.outputs.deploy_method == 'github-synced' ||
       (needs.fetch-secrets.result == 'success' && needs.fetch-secrets.outputs.secrets_available == 'true'))
    environment:
      name: ${{ needs.preflight.outputs.environment }}
      url: ${{ steps.deploy.outputs.url }}
    outputs:
      url: ${{ steps.deploy.outputs.url }}
      deployment_id: ${{ steps.deploy.outputs.id }}
      environment: ${{ steps.deploy.outputs.environment }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: build-output-${{ github.sha }}
          path: ${{ env.APP_DIR }}/${{ needs.build.outputs.build_dir }}

      - name: Download secrets from Infisical (if applicable)
        if: needs.preflight.outputs.deploy_method == 'infisical-cli'
        uses: actions/download-artifact@v8
        with:
          name: cloudflare-secrets-${{ needs.preflight.outputs.environment }}
          path: /tmp

      - name: Load Infisical secrets
        if: needs.preflight.outputs.deploy_method == 'infisical-cli'
        id: load-infisical
        run: |
          if [ -f "/tmp/cloudflare-secrets.env" ]; then
            echo "🔐 Loading secrets from Infisical..."
            # First pass: mask all values before any output
            while IFS='=' read -r key value; do
              if [ -n "$key" ] && [ -n "$value" ] && [[ ! "$key" =~ ^# ]]; then
                # Mask sensitive values FIRST
                echo "::add-mask::$value"
              fi
            done < /tmp/cloudflare-secrets.env

            # Second pass: export to GITHUB_ENV (now safely masked)
            while IFS='=' read -r key value; do
              if [ -n "$key" ] && [ -n "$value" ] && [[ ! "$key" =~ ^# ]]; then
                echo "$key=$value" >> $GITHUB_ENV
              fi
            done < /tmp/cloudflare-secrets.env
            echo "✅ Secrets loaded from Infisical"
          else
            echo "❌ Secrets file not found"
            exit 1
          fi

      - name: Resolve Cloudflare credentials
        id: cloudflare-secrets
        env:
          GITHUB_CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GITHUB_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          INFISICAL_SYNC_CLOUDFLARE_API_TOKEN: ${{ secrets.INFISICAL_CLOUDFLARE_API_TOKEN }}
          INFISICAL_SYNC_CLOUDFLARE_ACCOUNT_ID: ${{ secrets.INFISICAL_CLOUDFLARE_ACCOUNT_ID }}
          GITHUB_CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GITHUB_CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          GITHUB_CLOUDFLARE_PAGES_API_TOKEN: ${{ secrets.CLOUDFLARE_PAGES_API_TOKEN }}
          GITHUB_CLOUDFLARE_PAGES_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_PAGES_ACCOUNT_ID }}
          ENV_CLOUDFLARE_API_TOKEN: ${{ env.CLOUDFLARE_API_TOKEN }}
          ENV_CLOUDFLARE_ACCOUNT_ID: ${{ env.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "🔐 Resolving Cloudflare credential source..."

          is_placeholder() {
            local value="$1"
            case "$value" in
              ""|"\$"*|"your_"*|"YOUR_"*|"<"*">")
                return 0
                ;;
              *)
                return 1
                ;;
            esac
          }

          is_account_id() {
            printf '%s' "$1" | grep -Eq '^[A-Fa-f0-9]{32}$'
          }

          read_secret_file_value() {
            local key="$1"
            if [ -f /tmp/cloudflare-secrets.env ]; then
              grep -E "^${key}=" /tmp/cloudflare-secrets.env | tail -n 1 | sed "s/^${key}=//" | sed -e 's/^"//' -e 's/"$//' -e "s/^'//" -e "s/'$//"
            fi
          }

          try_pair() {
            local source="$1"
            local token="$2"
            local account_id="$3"

            if is_placeholder "$token" && is_placeholder "$account_id"; then
              return 0
            fi

            if ! is_placeholder "$token" && is_account_id "$account_id"; then
              SELECTED_SOURCE="$source"
              SELECTED_TOKEN="$token"
              SELECTED_ACCOUNT_ID="$account_id"
              return 1
            fi

            if ! is_placeholder "$token" || ! is_placeholder "$account_id"; then
              echo "::warning::Ignoring Cloudflare credential candidate '$source' because token/account pair is incomplete or account ID is not a 32-character hex value."
            fi

            return 0
          }

          SELECTED_SOURCE=""
          SELECTED_TOKEN=""
          SELECTED_ACCOUNT_ID=""

          INFISICAL_FILE_TOKEN="$(read_secret_file_value CLOUDFLARE_API_TOKEN)"
          INFISICAL_FILE_ACCOUNT_ID="$(read_secret_file_value CLOUDFLARE_ACCOUNT_ID)"

          # Prefer runtime Infisical CLI output when it exists, then validate
          # GitHub secrets that may be synced by Infisical's GitHub integration.
          try_pair "infisical-cli:CLOUDFLARE_*" "$INFISICAL_FILE_TOKEN" "$INFISICAL_FILE_ACCOUNT_ID" || true
          if [ -z "$SELECTED_TOKEN" ]; then
            try_pair "github-secret:CLOUDFLARE_*" "$GITHUB_CLOUDFLARE_API_TOKEN" "$GITHUB_CLOUDFLARE_ACCOUNT_ID" || true
          fi
          if [ -z "$SELECTED_TOKEN" ]; then
            try_pair "github-secret:INFISICAL_CLOUDFLARE_*" "$INFISICAL_SYNC_CLOUDFLARE_API_TOKEN" "$INFISICAL_SYNC_CLOUDFLARE_ACCOUNT_ID" || true
          fi
          if [ -z "$SELECTED_TOKEN" ]; then
            try_pair "github-secret:CF_*" "$GITHUB_CF_API_TOKEN" "$GITHUB_CF_ACCOUNT_ID" || true
          fi
          if [ -z "$SELECTED_TOKEN" ]; then
            try_pair "github-secret:CLOUDFLARE_PAGES_*" "$GITHUB_CLOUDFLARE_PAGES_API_TOKEN" "$GITHUB_CLOUDFLARE_PAGES_ACCOUNT_ID" || true
          fi
          if [ -z "$SELECTED_TOKEN" ]; then
            try_pair "workflow-env:CLOUDFLARE_*" "$ENV_CLOUDFLARE_API_TOKEN" "$ENV_CLOUDFLARE_ACCOUNT_ID" || true
          fi

          if [ -z "$SELECTED_TOKEN" ] || [ -z "$SELECTED_ACCOUNT_ID" ]; then
            echo "::error::No valid Cloudflare credential pair found."
            echo "::error::Infisical GitHub sync should expose one valid pair using CLOUDFLARE_*, INFISICAL_CLOUDFLARE_*, CF_*, or CLOUDFLARE_PAGES_* secret names."
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hex Account ID for the Cloudflare account that owns '${{ env.CLOUDFLARE_PROJECT_NAME }}'."
            exit 1
          fi

          echo "::add-mask::$SELECTED_TOKEN"
          echo "::add-mask::$SELECTED_ACCOUNT_ID"
          echo "api_token=$SELECTED_TOKEN" >> "$GITHUB_OUTPUT"
          echo "account_id=$SELECTED_ACCOUNT_ID" >> "$GITHUB_OUTPUT"
          echo "source=$SELECTED_SOURCE" >> "$GITHUB_OUTPUT"
          echo "✅ Selected Cloudflare credential source: $SELECTED_SOURCE"

      - name: Validate Cloudflare Pages project
        env:
          CF_API_TOKEN: ${{ steps.cloudflare-secrets.outputs.api_token }}
          CF_ACCOUNT_ID: ${{ steps.cloudflare-secrets.outputs.account_id }}
          CF_SECRET_SOURCE: ${{ steps.cloudflare-secrets.outputs.source }}
          CF_PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}
        run: |
          echo "🔎 Validating Cloudflare Pages project configuration..."
          echo "🔐 Credential source: $CF_SECRET_SOURCE"

          if [ -z "$CF_API_TOKEN" ] || [ -z "$CF_ACCOUNT_ID" ]; then
            echo "::error::Missing Cloudflare credentials. Ensure CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID are set."
            exit 1
          fi

          case "$CF_ACCOUNT_ID" in
            "\$"*|"your_"*|"YOUR_"*|"<"*">")
              echo "::error::CLOUDFLARE_ACCOUNT_ID appears to be a placeholder value, not a real Cloudflare Account ID."
              echo "::error::Set CLOUDFLARE_ACCOUNT_ID to the 32-character Account ID from the Cloudflare dashboard account that owns '$CF_PROJECT_NAME'."
              exit 1
              ;;
          esac

          if ! printf '%s' "$CF_ACCOUNT_ID" | grep -Eq '^[A-Fa-f0-9]{32}$'; then
            echo "::error::CLOUDFLARE_ACCOUNT_ID must be the 32-character hexadecimal Account ID from the Cloudflare dashboard."
            echo "::error::Do not use the zone ID, project name, account email, or the literal string '\$CLOUDFLARE_ACCOUNT_ID'."
            exit 1
          fi

          echo "::add-mask::$CF_API_TOKEN"
          echo "::add-mask::$CF_ACCOUNT_ID"

          RESPONSE_FILE=$(mktemp)
          HTTP_CODE=$(curl -sS -o "$RESPONSE_FILE" -w "%{http_code}" \
            -H "Authorization: Bearer $CF_API_TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/accounts/$CF_ACCOUNT_ID/pages/projects/$CF_PROJECT_NAME")

          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Cloudflare Pages project lookup failed for account/project pair."
            echo "::error::Expected account to contain Pages project '$CF_PROJECT_NAME'."
            cat "$RESPONSE_FILE"
            exit 1
          fi

          PROJECT_NAME=$(jq -r '.result.name // empty' "$RESPONSE_FILE")
          SUBDOMAIN=$(jq -r '.result.subdomain // empty' "$RESPONSE_FILE")

          if [ "$PROJECT_NAME" != "$CF_PROJECT_NAME" ]; then
            echo "::error::Cloudflare returned an unexpected project name: '$PROJECT_NAME'."
            exit 1
          fi

          echo "✅ Cloudflare Pages project found: $PROJECT_NAME"
          if [ -n "$SUBDOMAIN" ]; then
            echo "🌐 Cloudflare subdomain: https://$SUBDOMAIN"
          fi

      - name: Deploy to Cloudflare Pages
        id: deploy
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ steps.cloudflare-secrets.outputs.api_token }}
          accountId: ${{ steps.cloudflare-secrets.outputs.account_id }}
          projectName: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          directory: ${{ env.APP_DIR }}/${{ needs.build.outputs.build_dir }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ github.head_ref || github.ref_name }}
          wranglerVersion: "3"

      - name: Verify deployment
        run: |
          echo "🔍 Verifying deployment..."
          DEPLOY_URL="${{ steps.deploy.outputs.url }}"
          EXPECTED_TEXT="${{ env.EXPECTED_HOMEPAGE_TEXT }}"

          if [ -n "$DEPLOY_URL" ]; then
            echo "✅ Deployment URL: $DEPLOY_URL"

            # Wait for deployment to be accessible (with retries)
            MAX_ATTEMPTS=10
            ATTEMPT=1
            while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
              echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking $DEPLOY_URL..."
              RESPONSE_FILE=$(mktemp)
              HTTP_CODE=$(curl -sS -L -o "$RESPONSE_FILE" -w "%{http_code}" "$DEPLOY_URL" || echo "000")

              if [ "$HTTP_CODE" = "200" ] || [ "$HTTP_CODE" = "301" ] || [ "$HTTP_CODE" = "302" ]; then
                if grep -q "$EXPECTED_TEXT" "$RESPONSE_FILE"; then
                  echo "✅ Deployment URL served expected landing page content (HTTP $HTTP_CODE)"
                  rm -f "$RESPONSE_FILE"
                  break
                fi

                if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                  echo "::error::Deployment URL was reachable but did not include expected homepage text '$EXPECTED_TEXT'."
                  echo "::error::This usually means the wrong build output or Cloudflare deploy adapter was used."
                  sed -n '1,80p' "$RESPONSE_FILE"
                  rm -f "$RESPONSE_FILE"
                  exit 1
                fi

                echo "⏳ Deployment URL reachable but expected content is not live yet, waiting..."
              elif [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
                echo "::error::Deployment URL not accessible after $MAX_ATTEMPTS attempts (HTTP $HTTP_CODE)."
                rm -f "$RESPONSE_FILE"
                exit 1
              else
                echo "⏳ Site not ready yet (HTTP $HTTP_CODE), waiting..."
              fi
              rm -f "$RESPONSE_FILE"
              sleep 10
              ATTEMPT=$((ATTEMPT + 1))
            done
          else
            echo "::error::No deployment URL returned by Cloudflare Pages action."
            exit 1
          fi

      - name: Verify production custom domain
        if: needs.preflight.outputs.environment == 'production'
        env:
          PRODUCTION_DOMAIN: ${{ env.PRODUCTION_DOMAIN }}
          EXPECTED_TEXT: ${{ env.EXPECTED_HOMEPAGE_TEXT }}
        run: |
          echo "🔍 Verifying production hostname: $PRODUCTION_DOMAIN"

          MAX_ATTEMPTS=12
          ATTEMPT=1
          while [ $ATTEMPT -le $MAX_ATTEMPTS ]; do
            echo "Attempt $ATTEMPT/$MAX_ATTEMPTS: Checking $PRODUCTION_DOMAIN..."
            RESPONSE_FILE=$(mktemp)
            HTTP_CODE=$(curl -sS -L -o "$RESPONSE_FILE" -w "%{http_code}" "$PRODUCTION_DOMAIN" || echo "000")

            if [ "$HTTP_CODE" = "200" ] && grep -q "$EXPECTED_TEXT" "$RESPONSE_FILE"; then
              echo "✅ Production hostname serves expected landing page content."
              rm -f "$RESPONSE_FILE"
              exit 0
            fi

            if [ $ATTEMPT -eq $MAX_ATTEMPTS ]; then
              echo "::error::Production hostname did not serve the expected RateHunter landing page."
              echo "::error::HTTP status: $HTTP_CODE"
              echo "::error::Expected page text: $EXPECTED_TEXT"
              echo "::error::Likely causes: ratehunter.net is not attached to the '$CLOUDFLARE_PROJECT_NAME' Pages project, DNS points to a Cloudflared/Worker fallback instead of Pages, or the deployed artifact is not the OpenNext app output."
              sed -n '1,120p' "$RESPONSE_FILE"
              rm -f "$RESPONSE_FILE"
              exit 1
            fi

            rm -f "$RESPONSE_FILE"
            sleep 10
            ATTEMPT=$((ATTEMPT + 1))
          done

      - name: Output deployment environment
        run: |
          echo "environment=${{ needs.preflight.outputs.environment }}" >> $GITHUB_OUTPUT

  # ==========================================================================
  # Post-Deployment Tasks
  # ==========================================================================
  post-deploy:
    name: 📋 Post-Deployment Tasks
    runs-on: ubuntu-latest
    needs: [preflight, build, deploy]
    if: always() && needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Purge Cloudflare cache
        if: |
          github.event.inputs.purge_cache == 'true' &&
          needs.preflight.outputs.environment == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          if [ -n "$CLOUDFLARE_ZONE_ID" ] && [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "🧹 Purging Cloudflare cache..."
            curl -X POST "https://api.cloudflare.com/client/v4/zones/$CLOUDFLARE_ZONE_ID/purge_cache" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json" \
              --data '{"purge_everything":true}' || echo "Cache purge skipped"
          else
            echo "ℹ️ Cache purge skipped (CLOUDFLARE_ZONE_ID not configured)"
          fi

      - name: Create deployment summary
        env:
          DEPLOY_ENVIRONMENT: ${{ needs.preflight.outputs.environment }}
          DEPLOY_URL: ${{ needs.deploy.outputs.url }}
          DEPLOYMENT_ID: ${{ needs.deploy.outputs.deployment_id }}
          DEPLOY_BRANCH: ${{ github.head_ref || github.ref_name }}
          DEPLOY_COMMIT: ${{ github.sha }}
          BUILD_SIZE: ${{ needs.build.outputs.build_size }}
          BUILD_DIR: ${{ needs.build.outputs.build_dir }}
          ACTOR: ${{ github.actor }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}
          PRODUCTION_DOMAIN: ${{ env.PRODUCTION_DOMAIN }}
        run: |
          {
            echo "# 🚀 Cloudflare Pages Deployment"
            echo ""
            echo "| Property | Value |"
            echo "|----------|-------|"
            echo "| **Status** | ✅ Deployed |"
            echo "| **Environment** | \`$DEPLOY_ENVIRONMENT\` |"
            echo "| **URL** | [$DEPLOY_URL]($DEPLOY_URL) |"
            echo "| **Production domain** | [$PRODUCTION_DOMAIN]($PRODUCTION_DOMAIN) |"
            echo "| **Deployment ID** | \`$DEPLOYMENT_ID\` |"
            echo "| **Branch** | \`$DEPLOY_BRANCH\` |"
            echo "| **Commit** | \`$DEPLOY_COMMIT\` |"
            echo "| **Build Size** | \`$BUILD_SIZE\` |"
            echo "| **Triggered By** | @$ACTOR |"
            echo "| **Workflow Run** | [#$RUN_NUMBER]($RUN_URL) |"
            echo ""
            echo "## 📊 Build Information"
            echo ""
            echo "- **Build Directory**: \`$BUILD_DIR\`"
            echo "- **Node Version**: \`${{ env.NODE_VERSION }}\`"
            echo "- **PNPM Version**: \`${{ env.PNPM_VERSION }}\`"
            echo ""
            echo "## 🔗 Quick Links"
            echo ""
            if [ "$DEPLOY_ENVIRONMENT" == "production" ]; then
              echo "- 🌐 [Production Site]($PRODUCTION_DOMAIN)"
              echo "- 🚀 [Deployment URL]($DEPLOY_URL)"
              echo "- 📊 [Cloudflare Analytics](https://dash.cloudflare.com/?to=/:account/pages/view/$PROJECT_NAME/analytics)"
              echo "- ⚙️ [Cloudflare Settings](https://dash.cloudflare.com/?to=/:account/pages/view/$PROJECT_NAME/settings)"
            else
              echo "- 🔍 [Preview Deployment]($DEPLOY_URL)"
              echo "- 📝 [Pull Request](${{ github.event.pull_request.html_url || 'N/A' }})"
            fi
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## 🚀 Cloudflare Pages Preview Deployment

            | Property | Value |
            |----------|-------|
            | **Preview URL** | [${{ needs.deploy.outputs.url }}](${{ needs.deploy.outputs.url }}) |
            | **Build Size** | \`${{ needs.build.outputs.build_size }}\` |
            | **Commit** | \`${{ github.sha }}\` |
            | **Deployment ID** | \`${{ needs.deploy.outputs.deployment_id }}\` |

            ### ✅ Next Steps
            - 🔍 Review the preview deployment
            - 🧪 Test all functionality
            - 💬 Leave feedback on this PR

            ---
            <sub>Deployed by GitHub Actions • [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
            `;

            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const botComment = comments.data.find(comment =>
              comment.user.type === 'Bot' &&
              comment.body.includes('Cloudflare Pages Preview Deployment')
            );

            if (botComment) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body: body
              });
            }

  # ==========================================================================
  # Performance Audit with Lighthouse
  # ==========================================================================
  performance-audit:
    name: 🔬 Lighthouse Performance Audit
    runs-on: ubuntu-latest
    needs: [deploy]
    if: github.event_name == 'pull_request' && needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            ${{ needs.deploy.outputs.url }}
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: ".github/lighthouse/lighthouserc.json"
        continue-on-error: true

      - name: Create Lighthouse summary
        if: always()
        run: |
          echo "## 🔬 Lighthouse Performance Audit" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Lighthouse audit was run against: ${{ needs.deploy.outputs.url }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "View detailed results in the workflow artifacts." >> $GITHUB_STEP_SUMMARY

  # ==========================================================================
  # Security Scan
  # ==========================================================================
  security-scan:
    name: 🛡️ Security Scan
    runs-on: ubuntu-latest
    needs: [deploy]
    if: needs.deploy.result == 'success'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run security headers check
        continue-on-error: true
        run: |
          echo "🛡️ Checking security headers..."
          URL="${{ needs.deploy.outputs.url }}"

          # Check for security headers
          HEADERS=$(curl -s -I "$URL" || echo "")

          echo "## 🛡️ Security Headers Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Header | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|--------|" >> $GITHUB_STEP_SUMMARY

          for header in "strict-transport-security" "x-content-type-options" "x-frame-options" "content-security-policy" "x-xss-protection"; do
            if echo "$HEADERS" | grep -qi "$header"; then
              echo "| \`$header\` | ✅ Present |" >> $GITHUB_STEP_SUMMARY
            else
              echo "| \`$header\` | ⚠️ Missing |" >> $GITHUB_STEP_SUMMARY
            fi
          done

  # ==========================================================================
  # Failure Handling
  # ==========================================================================
  handle-failure:
    name: ❌ Handle Deployment Failure
    runs-on: ubuntu-latest
    needs: [preflight, build, deploy]
    if: failure()
    steps:
      - name: Determine failure reason
        id: failure-reason
        run: |
          if [ "${{ needs.preflight.result }}" == "failure" ]; then
            echo "reason=Pre-flight checks failed" >> $GITHUB_OUTPUT
            echo "stage=preflight" >> $GITHUB_OUTPUT
          elif [ "${{ needs.build.result }}" == "failure" ]; then
            echo "reason=Build process failed" >> $GITHUB_OUTPUT
            echo "stage=build" >> $GITHUB_OUTPUT
          elif [ "${{ needs.deploy.result }}" == "failure" ]; then
            echo "reason=Deployment to Cloudflare Pages failed" >> $GITHUB_OUTPUT
            echo "stage=deploy" >> $GITHUB_OUTPUT
          else
            echo "reason=Unknown failure" >> $GITHUB_OUTPUT
            echo "stage=unknown" >> $GITHUB_OUTPUT
          fi

      - name: Create failure summary
        run: |
          {
            echo "# ❌ Deployment Failed"
            echo ""
            echo "**Reason**: ${{ steps.failure-reason.outputs.reason }}"
            echo "**Stage**: \`${{ steps.failure-reason.outputs.stage }}\`"
            echo "**Environment**: \`${{ needs.preflight.outputs.environment }}\`"
            echo ""
            echo "## 🔧 Troubleshooting"
            echo ""
            case "${{ steps.failure-reason.outputs.stage }}" in
              preflight)
                echo "- Check if required secrets are configured"
                echo "- Verify Infisical GitHub secret sync or Infisical CLI integration is working"
                echo "- Ensure \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are set"
                ;;
              build)
                echo "- Check for build errors in the logs"
                echo "- Verify all dependencies are installed"
                echo "- Run \`pnpm build\` locally to reproduce"
                ;;
              deploy)
                echo "- Verify Cloudflare API token has correct permissions"
                echo "- Check if the project exists in Cloudflare Pages"
                echo "- Check the selected credential source in the \`Resolve Cloudflare credentials\` step"
                echo "- Ensure build output directory is correct"
                ;;
              *)
                echo "- Review the workflow logs for more details"
                ;;
            esac
            echo ""
            echo "## 📋 Configuration Checklist"
            echo ""
            echo "1. **Infisical GitHub Sync Method**: Sync one valid Cloudflare credential pair into GitHub repository or environment secrets:"
            echo "   - \`CLOUDFLARE_API_TOKEN\` - Your Cloudflare API token with Pages permissions"
            echo "   - \`CLOUDFLARE_ACCOUNT_ID\` - Your Cloudflare account ID"
            echo "   - Supported aliases: \`INFISICAL_CLOUDFLARE_*\`, \`CF_*\`, or \`CLOUDFLARE_PAGES_*\`"
            echo "   - If stale GitHub secrets exist, enable Infisical override/delete or remove the stale GitHub value"
            echo ""
            echo "2. **Infisical CLI Method**: Configure direct Infisical fetch:"
            echo "   - \`INFISICAL_TOKEN\` or universal-auth client credentials"
            echo "   - Ensure \`CLOUDFLARE_API_TOKEN\` and \`CLOUDFLARE_ACCOUNT_ID\` are in Infisical"
            echo "   - Store them under \`/CI-CD\` or \`/shared\` for the correct Infisical environment"
          } >> $GITHUB_STEP_SUMMARY

      - name: Comment on PR about failure
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## ❌ Cloudflare Pages Deployment Failed

            **Reason**: ${{ steps.failure-reason.outputs.reason }}
            **Stage**: \`${{ steps.failure-reason.outputs.stage }}\`

            Please check the [workflow logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}) for more details.

            ### 🔧 Common Fixes

            - Ensure all required secrets are configured
            - Check build logs for errors
            - Verify Cloudflare API permissions

            ---
            <sub>❌ Deployment failed • [View Workflow Run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})</sub>
            `;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: body
            });
