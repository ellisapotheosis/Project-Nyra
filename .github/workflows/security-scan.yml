name: Dependency Security Scan

on:
  schedule:
    - cron: "0 0 * * 0" # weekly, every Sunday at midnight UTC
  workflow_dispatch:

jobs:
  detect-python-project:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - id: detect
        run: |
          if [ -f pyproject.toml ] || [ -f uv.lock ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping python security audit (no root pyproject.toml/uv.lock found)."
          fi

  scan:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install 3.11

      - name: Install pip-audit into an isolated tool environment
        run: uv tool install pip-audit

      - name: Sync project dependencies
        run: uv sync

      - name: Python Security Audit
        run: uv tool run pip-audit
