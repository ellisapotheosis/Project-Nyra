name: CI Preflight Checks

on:
  workflow_dispatch:
  schedule:
    - cron: "15 2 * * *"
  push:
    branches: ["main"]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
      - ".releaserc.json"

permissions:
  contents: read
  pages: read

jobs:
  preflight:
    name: Validate CI prerequisites
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate required project files
        id: files
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for file in pnpm-lock.yaml .releaserc.json; do
            if [ ! -f "$file" ]; then
              echo "::error file=$file::Missing required file: $file"
              missing=1
            fi
          done
          echo "missing=$missing" >> "$GITHUB_OUTPUT"

      - name: Validate Pages configuration
        id: pages
        uses: actions/github-script@v9
        with:
          script: |
            try {
              const pages = await github.rest.repos.getPages({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });
              core.info(`Pages source: ${pages.data.source?.branch || "n/a"}`);
              core.setOutput("enabled", "true");
            } catch (error) {
              if (error.status === 404) {
                core.warning("GitHub Pages is not configured. Next/Nuxt Pages workflows will skip deploy.");
                core.setOutput("enabled", "false");
                return;
              }
              throw error;
            }

      - name: Validate private package reachability
        id: private-packages
        shell: bash
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${NPM_TOKEN}" ]; then
            echo "::warning::NPM_TOKEN is not configured; private package checks are informational only."
            echo "ok=unknown" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "${HOME}/.npmrc"
          if npm view @twenty-crm/twenty version >/dev/null 2>&1; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            echo "Private package @twenty-crm/twenty is reachable."
          else
            echo "::warning::Unable to resolve @twenty-crm/twenty from npm registry with current token."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Preflight summary
        shell: bash
        run: |
          {
            echo "## CI Preflight Summary"
            echo ""
            if [ "${{ steps.files.outputs.missing }}" = "0" ]; then
              echo "- Required files: ✅ present"
            else
              echo "- Required files: ❌ missing"
            fi
            echo "- Repository mirror: disabled (GitHub is the canonical remote)"
            if [ "${{ steps.pages.outputs.enabled }}" = "true" ]; then
              echo "- GitHub Pages: ✅ configured"
            else
              echo "- GitHub Pages: ⚠️ not configured"
            fi
            if [ "${{ steps.private-packages.outputs.ok }}" = "true" ]; then
              echo "- Private package access: ✅ reachable"
            elif [ "${{ steps.private-packages.outputs.ok }}" = "false" ]; then
              echo "- Private package access: ⚠️ token present but package unreachable"
            else
              echo "- Private package access: ⚠️ not validated (no NPM_TOKEN)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail when required files are missing
        if: steps.files.outputs.missing != '0'
        shell: bash
        run: exit 1
