name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "external/pocket-tts/**/*.py"
      - "external/pocket-tts/pyproject.toml"
      - "external/pocket-tts/uv.lock"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "external/pocket-tts/**/*.py"
      - "external/pocket-tts/pyproject.toml"
      - "external/pocket-tts/uv.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  PYTHON_PROJECT_DIR: "external/pocket-tts"

jobs:
  detect-python-project:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
      - uses: actions/checkout@v6
      - id: detect
        run: |
          if [ -f "${{ env.PYTHON_PROJECT_DIR }}/pyproject.toml" ] && [ -f "${{ env.PYTHON_PROJECT_DIR }}/uv.lock" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Skipping python CI jobs (${PYTHON_PROJECT_DIR} is missing pyproject.toml or uv.lock)."
          fi

  lint:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'
    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv sync --group lint

      - name: Run ruff (lint)
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv run ruff check .

      - name: Run ruff (format check)
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv run ruff format --check .

      - name: Run mypy
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv run mypy pocket_tts --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv sync --group test

      - name: Run tests
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv run pytest tests/ -v --cov=pocket_tts --cov-report=xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v6
        with:
          file: ${{ env.PYTHON_PROJECT_DIR }}/coverage.xml
          flags: unittests
          name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: [detect-python-project, lint, test]
    if: needs.detect-python-project.outputs.enabled == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv sync

      - name: Build package
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: ${{ env.PYTHON_PROJECT_DIR }}/dist/

  security:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'

    steps:
      - uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: false

      - name: Set up Python
        run: uv python install ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: uv sync

      - name: Run safety check
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: |
          uv add --dev safety
          uv run safety check
        continue-on-error: true

      - name: Run bandit security linter
        working-directory: ${{ env.PYTHON_PROJECT_DIR }}
        run: |
          uv add --dev bandit
          uv run bandit -r pocket_tts -f json -o bandit-report.json || true

      - name: Upload security reports
        uses: actions/upload-artifact@v7
        with:
          name: security-reports
          path: |
            ${{ env.PYTHON_PROJECT_DIR }}/bandit-report.json
        if: always()
