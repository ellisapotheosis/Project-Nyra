name: CI

on:
  push:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - '**/*.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - 'pytest.ini'
      - '.github/workflows/ci.yml'

concurrency:
  group: python-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"

jobs:
  detect-python-project:
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.detect.outputs.enabled }}
    steps:
    - uses: actions/checkout@v6
    - id: detect
      run: |
        if find . -name pyproject.toml -o -name uv.lock | grep -q .; then
          echo "enabled=true" >> "$GITHUB_OUTPUT"
        else
          echo "enabled=false" >> "$GITHUB_OUTPUT"
          echo "::notice::Skipping python CI jobs (no pyproject.toml/uv.lock found)."
        fi

  lint:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'
    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync --group lint

    - name: Run ruff (lint)
      run: uv run ruff check .

    - name: Run ruff (format check)
      run: uv run ruff format --check .

    - name: Run mypy
      run: uv run mypy src/ --ignore-missing-imports

  test:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Set up Python ${{ matrix.python-version }}
      run: uv python install ${{ matrix.python-version }}

    - name: Install dependencies
      run: uv sync --group test

    - name: Run tests
      run: uv run pytest tests/ -v --cov=src --cov-report=xml

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v6
      with:
        file: ./coverage.xml
        flags: unittests
        name: codecov-umbrella

  build:
    runs-on: ubuntu-latest
    needs: [detect-python-project, lint, test]
    if: needs.detect-python-project.outputs.enabled == 'true'

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Build package
      run: uv build

    - name: Upload build artifacts
      uses: actions/upload-artifact@v7
      with:
        name: dist
        path: dist/

  security:
    runs-on: ubuntu-latest
    needs: detect-python-project
    if: needs.detect-python-project.outputs.enabled == 'true'

    steps:
    - uses: actions/checkout@v6

    - name: Install uv
      uses: astral-sh/setup-uv@v4
      with:
        enable-cache: false

    - name: Set up Python
      run: uv python install ${{ env.PYTHON_VERSION }}

    - name: Install dependencies
      run: uv sync

    - name: Run safety check
      run: |
        uv add --dev safety
        uv run safety check
      continue-on-error: true

    - name: Run bandit security linter
      run: |
        uv add --dev bandit
        uv run bandit -r src/ -f json -o bandit-report.json || true

    - name: Upload security reports
      uses: actions/upload-artifact@v7
      with:
        name: security-reports
        path: |
          bandit-report.json
      if: always()
