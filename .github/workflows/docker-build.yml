name: Docker Build & Push

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

concurrency:
  group: docker-build-single-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}

jobs:
  # Build matrix for all services with Dockerfiles
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v6

      - name: Find all Dockerfiles
        id: set-matrix
        run: |
          services=$(find infra apps -name "Dockerfile" -not -path "*/node_modules/*" -not -path "*/.next/*" | \
            jq -R -s -c 'split("\n")[:-1] | map({
              dockerfile: .,
              name: (. | split("/") | .[1:-1] | join("-")),
              context: (. | split("/")[:-1] | join("/") | if . == "" then "." else . end)
            })')
          echo "matrix=$services" >> $GITHUB_OUTPUT
          echo "Found services: $services"

  # Build and push Docker images in parallel
  build-and-push:
    name: Build ${{ matrix.service.name }}
    runs-on: ubuntu-latest
    needs: [prepare-matrix]
    if: needs.prepare-matrix.outputs.matrix != '[]'
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJson(needs.prepare-matrix.outputs.matrix) }}
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
        with:
          driver-opts: |
            image=moby/buildkit:master
            network=host

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Inject secrets via Infisical (if configured)
        env:
          INFISICAL_TOKEN: ${{ secrets.INFISICAL_TOKEN }}
        run: |
          if [ -n "$INFISICAL_TOKEN" ]; then
            curl -1sLf 'https://dl.cloudsmith.io/public/infisical/infisical-cli/setup.deb.sh' | sudo -E bash
            sudo apt-get update && sudo apt-get install -y infisical
            infisical export --format=dotenv > .env.docker
          fi

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service.context }}
          file: ${{ matrix.service.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha,scope=${{ matrix.service.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service.name }}
          build-args: |
            BUILDKIT_INLINE_CACHE=1
            NODE_VERSION=20
            PNPM_VERSION=11.9.0

      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          format: spdx-json
          output-file: sbom-${{ matrix.service.name }}.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ matrix.service.name }}
          path: sbom-${{ matrix.service.name }}.spdx.json

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}/${{ matrix.service.name }}:${{ steps.meta.outputs.version }}
          format: sarif
          output: trivy-results-${{ matrix.service.name }}.sarif

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-results-${{ matrix.service.name }}.sarif
          category: trivy-${{ matrix.service.name }}

  # Build Docker Compose services
  build-compose:
    name: Build Docker Compose Stack
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build docker-compose services
        run: |
          if [ -f "docker-compose.yml" ]; then
            docker-compose build --parallel
          fi
          if [ -f "infra/docker-compose.yml" ]; then
            docker-compose -f infra/docker-compose.yml build --parallel
          fi

  # Verify all images built successfully
  verify-builds:
    name: Verify Docker Builds
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: always()
    steps:
      - name: Check build status
        run: |
          if [[ "${{ needs.build-and-push.result }}" != "success" ]]; then
            echo "Some Docker builds failed"
            exit 1
          fi
          echo "All Docker images built successfully"
