# For most projects, this workflow file will not need changing; you simply need
# to commit it to your repository.
#
# customized for Project-Nyra by Gemini
#
name: "CodeQL Advanced"

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/archive/**"
  pull_request:
    branches: ["main"]
    paths-ignore:
      - "**/*.md"
      - "**/*.txt"
      - "docs/archive/**"
  schedule:
    - cron: "37 12 * * 1"
  workflow_dispatch: # Allows you to run this manually from the Actions tab

# Cancels previous runs if you push a new commit to the same branch (saves usage minutes)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-scanning-disabled:
    name: Code Scanning Not Enabled
    if: vars.ENABLE_CODE_SCANNING != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Explain skipped analysis
        run: |
          echo "::notice::Skipping CodeQL because ENABLE_CODE_SCANNING is not set to true."
          echo "Enable GitHub code scanning for this repository, then set repository variable ENABLE_CODE_SCANNING=true." >> "$GITHUB_STEP_SUMMARY"

  analyze:
    if: vars.ENABLE_CODE_SCANNING == 'true'
    name: Analyze (${{ matrix.language }})
    runs-on: ${{ (matrix.language == 'swift' && 'macos-latest') || 'ubuntu-latest' }}
    permissions:
      security-events: write
      packages: read
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - language: actions
            build-mode: none
          # I have enabled these common languages for you.
          # If your project does NOT contain one of these, you can delete the 2 lines for that language.
          - language: python
            build-mode: none
          - language: javascript-typescript
            build-mode: none
        # Add more here if needed (e.g., 'go', 'ruby', 'java-kotlin')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
          config-file: ./.github/codeql/codeql-config.yml
          # "security-and-quality" finds more issues than the default
          queries: security-and-quality

      # Only runs for manual build modes (not needed for Python/JS/Actions usually)
      - if: matrix.build-mode == 'manual'
        shell: bash
        run: |
          echo 'If you are using a "manual" build mode for one or more of the' \
            'languages you are analyzing, replace this with the commands to build' \
            'your code, for example:'
          echo '  make bootstrap'
          echo '  make release'

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        continue-on-error: true
        with:
          category: "/language:${{ matrix.language }}"
