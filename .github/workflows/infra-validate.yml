name: infra-validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate-infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Validate infra setup scripts and compose files
        env:
          # Compose only needs a non-secret value to validate interpolation;
          # runtime deployments obtain the real token from Infisical.
          OPENCLAW_GATEWAY_TOKEN: ci-validation-placeholder
        run: bash scripts/ci/validate-infra.sh
