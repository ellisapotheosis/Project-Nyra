name: Build NYRA v6.2 package
on:
  push:
    branches: [ "**" ]
  workflow_dispatch: {}
jobs:
  build-zip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Zip infra bundle
        run: |
          sudo apt-get update -y
          cd nyra-infra
          zip -r nyra-stack-v6_2.zip nyra-stack-v6_2
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: nyra-stack-v6_2
          path: nyra-infra/nyra-stack-v6_2.zip
