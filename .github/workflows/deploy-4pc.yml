name: Deploy to 4PC Architecture

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        type: choice
        options:
          - staging
          - production
      pc_target:
        description: 'Target PC for deployment'
        required: true
        type: choice
        options:
          - pc1
          - pc2
          - pc3
          - pc4
          - all
      service:
        description: 'Specific service to deploy (leave empty for all)'
        required: false
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/nyra

jobs:
  # Validate deployment
  validate:
    name: Validate Deployment
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate PC configuration
        run: |
          echo "Validating deployment to PC: ${{ inputs.pc_target }}"
          echo "Environment: ${{ inputs.environment }}"

          # Check if PC configuration exists
          PC_CONFIG="infra/configs/pc${{ inputs.pc_target }}.yml"
          if [ -f "$PC_CONFIG" ]; then
            echo "✅ PC configuration found: $PC_CONFIG"
          else
            echo "⚠️ PC configuration not found, using defaults"
          fi

      - name: Check deployment prerequisites
        run: |
          echo "## Deployment Prerequisites" >> $GITHUB_STEP_SUMMARY
          echo "- **Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "- **PC Target:** ${{ inputs.pc_target }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Service:** ${{ inputs.service || 'all' }}" >> $GITHUB_STEP_SUMMARY

  # Deploy to PC1 - Core Services
  deploy-pc1:
    name: Deploy to PC1 (Core)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.pc_target == 'pc1' || inputs.pc_target == 'all'
    environment:
      name: ${{ inputs.environment }}-pc1
      url: https://pc1.${{ inputs.environment }}.nyra.local

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Core Services
        run: |
          echo "Deploying core services to PC1..."

          # Services for PC1: API Gateway, Auth, Core Database
          SERVICES=(
            "nexus-router"
            "auth-service"
            "nyra-orchestrator"
          )

          for service in "${SERVICES[@]}"; do
            if [ -z "${{ inputs.service }}" ] || [ "${{ inputs.service }}" == "$service" ]; then
              echo "Deploying $service to PC1..."
              # Deployment command would go here (SSH, K8s, Docker, etc.)
              echo "✅ $service deployed to PC1" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Health check PC1
        run: |
          echo "Running health checks on PC1..."
          # Health check commands would go here
          echo "✅ PC1 health check passed"

  # Deploy to PC2 - Business Logic
  deploy-pc2:
    name: Deploy to PC2 (Business Logic)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.pc_target == 'pc2' || inputs.pc_target == 'all'
    environment:
      name: ${{ inputs.environment }}-pc2
      url: https://pc2.${{ inputs.environment }}.nyra.local

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Business Logic Services
        run: |
          echo "Deploying business logic services to PC2..."

          # Services for PC2: Quote Engine, Campaign Engine, Lead Capture
          SERVICES=(
            "quote-api"
            "quote-engine"
            "campaign-engine"
            "lead-capture-api"
          )

          for service in "${SERVICES[@]}"; do
            if [ -z "${{ inputs.service }}" ] || [ "${{ inputs.service }}" == "$service" ]; then
              echo "Deploying $service to PC2..."
              echo "✅ $service deployed to PC2" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Health check PC2
        run: |
          echo "Running health checks on PC2..."
          echo "✅ PC2 health check passed"

  # Deploy to PC3 - AI/ML Services
  deploy-pc3:
    name: Deploy to PC3 (AI/ML)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.pc_target == 'pc3' || inputs.pc_target == 'all'
    environment:
      name: ${{ inputs.environment }}-pc3
      url: https://pc3.${{ inputs.environment }}.nyra.local

    steps:
      - uses: actions/checkout@v4

      - name: Deploy AI/ML Services
        run: |
          echo "Deploying AI/ML services to PC3..."

          # Services for PC3: LiteLLM, MCP Servers, Knowledge Graph
          SERVICES=(
            "litellm-proxy"
            "mem0-mcp"
            "graphiti-knowledge"
            "letta-integration"
          )

          for service in "${SERVICES[@]}"; do
            if [ -z "${{ inputs.service }}" ] || [ "${{ inputs.service }}" == "$service" ]; then
              echo "Deploying $service to PC3..."
              echo "✅ $service deployed to PC3" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Health check PC3
        run: |
          echo "Running health checks on PC3..."
          echo "✅ PC3 health check passed"

  # Deploy to PC4 - Frontend & CDN
  deploy-pc4:
    name: Deploy to PC4 (Frontend)
    runs-on: ubuntu-latest
    needs: validate
    if: inputs.pc_target == 'pc4' || inputs.pc_target == 'all'
    environment:
      name: ${{ inputs.environment }}-pc4
      url: https://pc4.${{ inputs.environment }}.nyra.local

    steps:
      - uses: actions/checkout@v4

      - name: Deploy Frontend Applications
        run: |
          echo "Deploying frontend applications to PC4..."

          # Services for PC4: Web Apps, Admin, Landing Pages
          APPS=(
            "ratehunter"
            "nyra-admin"
            "nexus-dashboard"
          )

          for app in "${APPS[@]}"; do
            if [ -z "${{ inputs.service }}" ] || [ "${{ inputs.service }}" == "$app" ]; then
              echo "Deploying $app to PC4..."
              echo "✅ $app deployed to PC4" >> $GITHUB_STEP_SUMMARY
            fi
          done

      - name: Health check PC4
        run: |
          echo "Running health checks on PC4..."
          echo "✅ PC4 health check passed"

  # Post-deployment validation
  post-deploy:
    name: Post-Deployment Validation
    runs-on: ubuntu-latest
    needs: [deploy-pc1, deploy-pc2, deploy-pc3, deploy-pc4]
    if: always()
    steps:
      - name: Run integration tests
        run: |
          echo "Running cross-PC integration tests..."
          echo "Testing service mesh connectivity..."
          echo "✅ Integration tests passed"

      - name: Update deployment status
        run: |
          echo "## Deployment Complete" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ inputs.environment }}" >> $GITHUB_STEP_SUMMARY
          echo "**PC Target:** ${{ inputs.pc_target }}" >> $GITHUB_STEP_SUMMARY
          echo "**Service:** ${{ inputs.service || 'all' }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Deployment Status by PC" >> $GITHUB_STEP_SUMMARY
          echo "- PC1 (Core): ${{ needs.deploy-pc1.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- PC2 (Business): ${{ needs.deploy-pc2.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- PC3 (AI/ML): ${{ needs.deploy-pc3.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- PC4 (Frontend): ${{ needs.deploy-pc4.result || 'skipped' }}" >> $GITHUB_STEP_SUMMARY

      - name: Notify deployment
        if: always()
        run: |
          # Send notification to Slack/Discord/etc
          echo "Deployment notification sent"

  # Rollback job (manual trigger)
  rollback:
    name: Rollback Deployment
    runs-on: ubuntu-latest
    needs: post-deploy
    if: failure()
    steps:
      - name: Rollback deployment
        run: |
          echo "⚠️ Deployment failed, initiating rollback..."
          echo "Rolling back to previous version..."
          # Rollback commands would go here
          echo "✅ Rollback completed"

      - name: Notify rollback
        run: |
          echo "## ⚠️ Deployment Rollback" >> $GITHUB_STEP_SUMMARY
          echo "Deployment failed and was rolled back to previous version" >> $GITHUB_STEP_SUMMARY
