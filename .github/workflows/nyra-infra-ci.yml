name: Nyra Infra CI

on:
  pull_request:
    paths:
      - 'nyra-infra/**'
      - 'ingestion/**'

jobs:
  validate-yaml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate YAML
        uses: ibiqlik/action-yamllint@v3
        with:
          config_file: .yamllint.yml
      - name: Python Lint
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install pyyaml
      - run: python ingestion/scripts/ingest.py || true
