name: Deploy projectnyra-landing to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - "apps/projectnyra-landing/**"
      - ".github/workflows/deploy-projectnyra-landing.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/projectnyra-landing/**"
  workflow_dispatch:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        default: "production"
        type: choice
        options:
          - production
          - preview

concurrency:
  group: deploy-projectnyra-landing-${{ github.event_name }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "11.9.0"
  APP_DIR: "apps/projectnyra-landing"
  CLOUDFLARE_PROJECT_NAME: "projectnyra-landing"
  INFISICAL_PROJECT_ID: "8374cea9-e5e8-4050-bda4-b91f25ab30ef"

permissions:
  contents: read
  deployments: write
  pull-requests: write
  id-token: write

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fetch secrets from Infisical
        uses: Infisical/secrets-action@v1
        continue-on-error: true
        with:
          method: "oidc"
          env-slug: "prod"
          project-slug: ${{ env.INFISICAL_PROJECT_ID }}
          export-type: "env"
        env:
          INFISICAL_PROJECT_ID: ${{ env.INFISICAL_PROJECT_ID }}

      - name: Build static export
        working-directory: ${{ env.APP_DIR }}
        run: pnpm build:cf
        env:
          NODE_ENV: production

      - name: Deploy to production
        if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production')
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec wrangler pages deploy out --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}

      - name: Deploy to preview
        if: github.event_name == 'pull_request' || (github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'preview')
        working-directory: ${{ env.APP_DIR }}
        run: pnpm exec wrangler pages deploy out --project-name="$CLOUDFLARE_PROJECT_NAME" --branch=preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PROJECT_NAME: ${{ env.CLOUDFLARE_PROJECT_NAME }}
