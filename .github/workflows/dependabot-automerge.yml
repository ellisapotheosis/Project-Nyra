name: Dependabot Safe Auto Merge

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
  check_suite:
    types: [completed]
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  checks: read

jobs:
  merge-safe-dependency-updates:
    if: github.event_name != 'pull_request_target' || (github.event.pull_request.user.login == 'dependabot[bot]' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    steps:
      - name: Rebase and queue safe Dependabot updates
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ -n "$EVENT_PR" ]; then
            pr_numbers="$EVENT_PR"
          else
            pr_numbers=$(gh pr list --repo "$REPOSITORY" --state open --author app/dependabot --json number --jq '.[].number')
          fi

          if [ -z "$pr_numbers" ]; then
            echo "No open Dependabot pull requests found."
            exit 0
          fi

          for pr in $pr_numbers; do
            title=$(gh pr view "$pr" --repo "$REPOSITORY" --json title --jq '.title')
            read -r mergeable merge_state <<<"$(gh pr view "$pr" --repo "$REPOSITORY" --json mergeable,mergeStateStatus --jq '[.mergeable,.mergeStateStatus]|@tsv')"
            labels=$(gh pr view "$pr" --repo "$REPOSITORY" --json labels --jq '[.labels[].name]')

            if jq -e 'any(.[]; . == "semver-major")' <<<"$labels" >/dev/null; then
              echo "PR #$pr is explicitly marked semver-major; leaving it review-gated."
              continue
            fi

            if [[ "$title" =~ from[[:space:]]v?([0-9]+)(\.[^[:space:]]+)?[[:space:]]to[[:space:]]v?([0-9]+) ]] && (( BASH_REMATCH[3] > BASH_REMATCH[1] )); then
              echo "PR #$pr is a major version update; leaving it review-gated."
              continue
            fi

            if [ "$mergeable" != "MERGEABLE" ]; then
              echo "PR #$pr is not currently mergeable: $mergeable"
              continue
            fi

            if [ "$merge_state" = "BLOCKED" ]; then
              echo "PR #$pr is behind main; requesting a Dependabot branch update."
              gh pr update-branch "$pr" --repo "$REPOSITORY" --rebase || true
              continue
            fi

            checks=$(gh pr checks "$pr" --repo "$REPOSITORY" --json name,state,bucket)
            blocking=$(jq '[.[]
              | select(.name != null)
              | select((.name | test("^(Cloudflare Pages: |Auto Create Pull Request$|merge-safe-dependency-update$|Mergify Merge |Sourcery review$|CodeRabbit$|Greptile Review$|Kilo Code Review$)")) | not)
              | select(.bucket != "pass" and .bucket != "skipping")]' <<<"$checks")

            if [ "$(jq 'length' <<<"$blocking")" -gt 0 ]; then
              echo "PR #$pr has substantive checks that are pending or failing; leaving it open."
              jq -r '.[] | "- \(.name): \(.state) (\(.bucket))"' <<<"$blocking"
              continue
            fi

            echo "All substantive checks pass for PR #$pr; enabling native GitHub auto-merge."
            gh pr merge "$pr" --repo "$REPOSITORY" --squash --auto
          done
