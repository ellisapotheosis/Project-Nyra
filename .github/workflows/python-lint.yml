name: Python Lint

on:
  schedule:
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: python-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_LINT_PATHS: >-
    services
    infra/ai-reviewer
    infra/github-sync
    infra/hosts/worker-rtx3060/embedding-service
    tests/infra
  PYTHON_FORMAT_PATHS: >-
    services/nyra-mcp/server.py

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install linting tools
        run: |
          pip install flake8 black

      - name: Run flake8
        run: |
          flake8 $PYTHON_LINT_PATHS --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run black (check only)
        run: |
          black --check $PYTHON_FORMAT_PATHS
