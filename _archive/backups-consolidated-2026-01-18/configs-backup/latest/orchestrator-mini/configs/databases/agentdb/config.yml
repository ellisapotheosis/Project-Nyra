# ==============================================================================
# Qdrant (AgentDB) Configuration for Project Nyra
# ==============================================================================
# Vector database configuration for AI embeddings and semantic search
# Optimized for HNSW indexing with high performance
# ==============================================================================

service:
  # HTTP API configuration
  http_port: 6333
  grpc_port: 6334

  # Enable telemetry (set to false for privacy)
  enable_telemetry: false

  # Max request size (in bytes)
  max_request_size_mb: 32

storage:
  # Storage paths
  storage_path: /qdrant/storage
  snapshots_path: /qdrant/snapshots
  temp_path: /qdrant/temp

  # Performance settings
  performance:
    # Maximum number of concurrent updates
    max_search_threads: 4

    # Optimizer configuration
    optimizer_config:
      # Minimum number of vectors to trigger optimization
      indexing_threshold: 10000

      # Maximum number of vectors per segment
      max_segment_size: 200000

      # Flush interval (seconds)
      flush_interval_sec: 5

      # Memory mode
      # Options: ram, mmap, auto
      memmap_threshold: 50000

  # HNSW index configuration (default for all collections)
  hnsw_index:
    # Number of edges per node in the graph
    # Higher M = better search quality but more memory
    # Recommended: 16-48
    m: 16

    # Size of the dynamic candidate list during construction
    # Higher ef_construct = better index quality but slower construction
    # Recommended: 100-200
    ef_construct: 100

    # Size of the dynamic candidate list during search
    # Can be overridden per search request
    # Recommended: 100-500
    ef: 128

    # Minimum number of vectors to use HNSW
    # Below this threshold, brute force search is used
    full_scan_threshold: 10000

    # Maximum number of connections per element
    # Should be 2 * M
    max_indexing_threads: 4

  # Quantization (for memory optimization)
  # Options: none, scalar, product
  quantization:
    # Scalar quantization for 4x memory reduction
    scalar:
      enabled: false
      quantile: 0.99

    # Product quantization for even more memory reduction
    product:
      enabled: false
      compression_ratio: 8

# Cluster configuration (for multi-node setup)
cluster:
  enabled: false
  # p2p_port: 6335
  # consensus:
  #   tick_period_ms: 100

# TLS configuration (for production)
# tls:
#   enabled: false
#   cert: /path/to/cert.pem
#   key: /path/to/key.pem
#   ca_cert: /path/to/ca.pem

# ==============================================================================
# COLLECTION TEMPLATES
# ==============================================================================
# When creating collections, use these recommended configurations:
#
# Example for high-dimensional embeddings (OpenAI ada-002, 1536 dimensions):
# {
#   "vectors": {
#     "size": 1536,
#     "distance": "Cosine"
#   },
#   "hnsw_config": {
#     "m": 16,
#     "ef_construct": 100
#   },
#   "quantization_config": {
#     "scalar": {
#       "type": "int8",
#       "quantile": 0.99,
#       "always_ram": true
#     }
#   }
# }
#
# Example for Claude embeddings (768 dimensions):
# {
#   "vectors": {
#     "size": 768,
#     "distance": "Cosine"
#   },
#   "hnsw_config": {
#     "m": 24,
#     "ef_construct": 150
#   }
# }
# ==============================================================================

# ==============================================================================
# PERFORMANCE NOTES
# ==============================================================================
# 1. M parameter: Higher = better quality, more memory
#    - Small datasets (<100k): M=16
#    - Medium datasets (100k-1M): M=24
#    - Large datasets (>1M): M=32
#
# 2. ef_construct: Higher = better index quality, slower construction
#    - Quick prototyping: 100
#    - Production: 150-200
#    - High quality: 300+
#
# 3. Memory optimization:
#    - Enable scalar quantization for 4x memory reduction
#    - Enable product quantization for 8x+ memory reduction
#    - Use memmap for large datasets
#
# 4. Search performance:
#    - Adjust ef parameter at search time for quality/speed tradeoff
#    - Higher ef = better recall, slower search
#    - Typical range: 64-512
# ==============================================================================
