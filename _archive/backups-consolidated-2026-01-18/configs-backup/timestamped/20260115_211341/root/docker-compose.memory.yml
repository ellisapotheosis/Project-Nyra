# Docker Compose for Memory Stack
# Graphiti + FalkorDB, Mem0 (local bridge), Letta
version: '3.8'

services:
  # FalkorDB - Graph database for Graphiti
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    ports:
      - "6379:6379"
    volumes:
      - falkordb-data:/data
    environment:
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-changeme}
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Graphiti MCP Server
  graphiti:
    image: graphiti/mcp-server:latest
    container_name: nyra-graphiti
    ports:
      - "7459:7459"
    environment:
      - FALKORDB_HOST=falkordb
      - FALKORDB_PORT=6379
      - FALKORDB_PASSWORD=${FALKORDB_PASSWORD:-changeme}
      - GRAPHITI_API_KEY=${GRAPHITI_API_KEY}
      - LOG_LEVEL=info
    depends_on:
      falkordb:
        condition: service_healthy
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7459/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Qdrant - Vector database for embeddings
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis - for Mem0 local bridge
  redis:
    image: redis/redis-stack:latest
    container_name: nyra-redis
    ports:
      - "6379:6379"  # Redis port
      - "8001:8001"  # RedisInsight UI
    volumes:
      - redis-data:/data
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Letta - Stateful memory agent
  letta:
    image: letta/letta:latest
    container_name: nyra-letta
    ports:
      - "8283:8283"
    volumes:
      - letta-data:/letta/data
      - ./src/config/memory/letta-profiles.yaml:/letta/config/profiles.yaml
    environment:
      - LETTA_SERVER_PORT=8283
      - LETTA_API_KEY=${LETTA_API_KEY}
      - LETTA_BACKEND=postgres
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=letta
      - POSTGRES_USER=${POSTGRES_USER:-letta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8283/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # PostgreSQL - for Letta persistence
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres-letta
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=letta
      - POSTGRES_USER=${POSTGRES_USER:-letta}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-changeme}
    networks:
      - nyra-memory
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-letta}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mem0 Local Bridge (optional - for local mode)
  mem0-bridge:
    build:
      context: ./src/services/memory
      dockerfile: Dockerfile.mem0-bridge
    container_name: nyra-mem0-bridge
    ports:
      - "8284:8284"
    volumes:
      - mem0-data:/data
    environment:
      - MEM0_USE_LOCAL=true
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-changeme}
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    depends_on:
      - redis
      - qdrant
    networks:
      - nyra-memory
    restart: unless-stopped

  # Prometheus - for monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus-memory
    ports:
      - "9091:9090"
    volumes:
      - ./config/prometheus/memory.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    networks:
      - nyra-memory
    restart: unless-stopped

  # Grafana - for visualization
  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana-memory
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./config/grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./config/grafana/datasources:/etc/grafana/provisioning/datasources
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource,grafana-falkordb-datasource
    depends_on:
      - prometheus
    networks:
      - nyra-memory
    restart: unless-stopped

volumes:
  falkordb-data:
  qdrant-data:
  redis-data:
  letta-data:
  postgres-data:
  mem0-data:
  prometheus-data:
  grafana-data:

networks:
  nyra-memory:
    name: nyra-memory-network
    driver: bridge
