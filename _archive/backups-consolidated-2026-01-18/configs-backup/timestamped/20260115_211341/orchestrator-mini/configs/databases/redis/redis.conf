# ==============================================================================
# Redis Configuration for Project Nyra Orchestrator
# ==============================================================================
# Optimized for cache and pub/sub workloads
# Hardware assumptions: 512MB-1GB RAM dedicated to Redis
# ==============================================================================

# -----------------------------------------------------------------------------
# NETWORK
# -----------------------------------------------------------------------------
bind 0.0.0.0
protected-mode yes
port 6379
tcp-backlog 511
timeout 300
tcp-keepalive 300

# -----------------------------------------------------------------------------
# GENERAL
# -----------------------------------------------------------------------------
daemonize no
supervised no
pidfile /var/run/redis.pid
loglevel notice
logfile ""
databases 16

# -----------------------------------------------------------------------------
# SNAPSHOTTING (RDB)
# -----------------------------------------------------------------------------
# Save the DB on disk:
#   save <seconds> <changes>
save 900 1      # Save after 900 seconds (15 min) if at least 1 key changed
save 300 10     # Save after 300 seconds (5 min) if at least 10 keys changed
save 60 10000   # Save after 60 seconds if at least 10000 keys changed

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

# -----------------------------------------------------------------------------
# REPLICATION
# -----------------------------------------------------------------------------
replica-serve-stale-data yes
replica-read-only yes
repl-diskless-sync no
repl-diskless-sync-delay 5
repl-disable-tcp-nodelay no
replica-priority 100

# -----------------------------------------------------------------------------
# SECURITY
# -----------------------------------------------------------------------------
# requirepass is set via command line (see docker-compose.yml)
# For additional security in production, consider:
# - Renaming dangerous commands
# - Setting up user ACLs (Redis 6+)

# -----------------------------------------------------------------------------
# MEMORY MANAGEMENT
# -----------------------------------------------------------------------------
maxmemory 512mb
maxmemory-policy allkeys-lru

# LRU and minimal TTL policies
maxmemory-samples 5

# -----------------------------------------------------------------------------
# LAZY FREEING
# -----------------------------------------------------------------------------
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no

# -----------------------------------------------------------------------------
# APPEND ONLY FILE (AOF)
# -----------------------------------------------------------------------------
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb
aof-load-truncated yes
aof-use-rdb-preamble yes

# -----------------------------------------------------------------------------
# LUA SCRIPTING
# -----------------------------------------------------------------------------
lua-time-limit 5000

# -----------------------------------------------------------------------------
# SLOW LOG
# -----------------------------------------------------------------------------
slowlog-log-slower-than 10000  # Log queries slower than 10ms
slowlog-max-len 128

# -----------------------------------------------------------------------------
# EVENT NOTIFICATION
# -----------------------------------------------------------------------------
notify-keyspace-events ""

# -----------------------------------------------------------------------------
# ADVANCED CONFIG
# -----------------------------------------------------------------------------
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000
stream-node-max-bytes 4096
stream-node-max-entries 100
activerehashing yes
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60
hz 10
dynamic-hz yes
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes

# ==============================================================================
# PERFORMANCE NOTES
# ==============================================================================
# 1. This configuration prioritizes durability with AOF + RDB
# 2. Memory limit set to 512MB with LRU eviction
# 3. Slow log captures queries > 10ms
# 4. AOF fsync every second (good balance of performance and durability)
# 5. For higher performance, consider:
#    - appendfsync no (less durable but faster)
#    - Disable RDB snapshots
#    - Increase maxmemory-samples for better LRU accuracy
# ==============================================================================
