# ==============================================================================
# Cloudflared Tunnel Configuration - Worker RTX3090Ti
# ==============================================================================
# This config defines ingress rules for the RTX3090Ti worker PC
#
# Services exposed:
#   - Development UI: dynamic port (default 8092)
#   - GPU Monitoring: dynamic port (default 9837)
#   - Training workload UIs: various ports
#
# Note: When using TUNNEL_TOKEN environment variable, this config is optional.
#       Token-based tunnels get their config from Cloudflare Zero Trust dashboard.
# ==============================================================================

# Ingress rules - Define how external traffic routes to internal services
ingress:
  # Development UI Portal
  - hostname: rtx3090ti-dev.nyra.your-domain.com
    service: http://worker-rtx3090ti-dev-ui:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # GPU Monitoring Dashboard
  - hostname: rtx3090ti-gpu.nyra.your-domain.com
    service: http://worker-rtx3090ti-gpu-monitor:9835
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Jupyter Lab (example - adjust as needed)
  - hostname: rtx3090ti-jupyter.nyra.your-domain.com
    service: http://jupyter-rtx3090ti:8888
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Weights & Biases (example - adjust as needed)
  - hostname: rtx3090ti-wandb.nyra.your-domain.com
    service: http://wandb-rtx3090ti:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Catch-all rule (required)
  - service: http_status:404

# Logging
loglevel: info
transport-loglevel: warn

# Metrics
metrics: 0.0.0.0:9126

# Origin configuration
originRequest:
  # Connection settings
  connectTimeout: 30s
  tcpKeepAlive: 30s
  keepAliveTimeout: 90s
  keepAliveConnections: 100

  # TLS settings
  noTLSVerify: false
  disableChunkedEncoding: false

# Autoupdate (disabled, managed by Docker)
no-autoupdate: true

# Grace period for shutdown
grace-period: 30s
