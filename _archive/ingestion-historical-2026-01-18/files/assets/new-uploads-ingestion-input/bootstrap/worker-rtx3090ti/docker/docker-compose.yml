version: '3.8'

services:
  # Ollama - LLM Inference Engine
  ollama:
    image: ollama/ollama:latest
    container_name: worker-ollama-3090ti
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
    networks:
      - nyra-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-3090ti.rule=Host(`ollama-3090ti.nyra.local`)"
      - "traefik.http.services.ollama-3090ti.loadbalancer.server.port=11434"

  # n8n - Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: worker-n8n-3090ti
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.nyra.local
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://n8n.nyra.local
      - GENERIC_TIMEZONE=America/New_York
      - N8N_SECURE_COOKIE=false
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      - nyra-network
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n.rule=Host(`n8n.nyra.local`)"
      - "traefik.http.services.n8n.loadbalancer.server.port=5678"

  # SwarmUI - Stable Diffusion Interface
  swarmui:
    image: mcmonkey/swarmui:latest
    container_name: worker-swarmui-3090ti
    restart: unless-stopped
    ports:
      - "7801:7801"
    volumes:
      - swarmui-data:/SwarmUI/Data
      - swarmui-models:/SwarmUI/Models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - nyra-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swarmui.rule=Host(`swarmui.nyra.local`)"
      - "traefik.http.services.swarmui.loadbalancer.server.port=7801"

  # Open WebUI - Ollama Frontend
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: worker-openwebui-3090ti
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_AUTH=true
      - WEBUI_NAME=Project Nyra AI
    volumes:
      - open-webui-data:/app/backend/data
    networks:
      - nyra-network
    depends_on:
      - ollama
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui.rule=Host(`ai.nyra.local`)"
      - "traefik.http.services.openwebui.loadbalancer.server.port=8080"

  # ComfyUI - Advanced Stable Diffusion Workflow
  comfyui:
    image: yanwk/comfyui-boot:latest
    container_name: worker-comfyui-3090ti
    restart: unless-stopped
    ports:
      - "8188:8188"
    volumes:
      - comfyui-data:/home/runner
      - comfyui-models:/home/runner/models
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    networks:
      - nyra-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui.rule=Host(`comfyui.nyra.local`)"
      - "traefik.http.services.comfyui.loadbalancer.server.port=8188"

  # Jupyter - Data Science Notebook
  jupyter:
    image: jupyter/tensorflow-notebook:latest
    container_name: worker-jupyter-3090ti
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - jupyter-data:/home/jovyan/work
    networks:
      - nyra-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter.rule=Host(`jupyter.nyra.local`)"
      - "traefik.http.services.jupyter.loadbalancer.server.port=8888"

  # Node Exporter - System Metrics
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-node-exporter-3090ti
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      - nyra-network

  # NVIDIA GPU Exporter
  nvidia-gpu-exporter:
    image: nvidia/dcgm-exporter:latest
    container_name: worker-nvidia-exporter-3090ti
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:
      - nyra-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama-models:
    driver: local
  n8n-data:
    driver: local
  swarmui-data:
    driver: local
  swarmui-models:
    driver: local
  open-webui-data:
    driver: local
  comfyui-data:
    driver: local
  comfyui-models:
    driver: local
  jupyter-data:
    driver: local

networks:
  nyra-network:
    external: true
