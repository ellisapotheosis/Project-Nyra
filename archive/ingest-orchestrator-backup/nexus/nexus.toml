##############################################################################
# Project Nyra — Nexus Router (single entrypoint / proxy aggregator)
# Docker Desktop (Windows) + WSL2 containers
# Host port target: 6000 (ports.txt)
##############################################################################

[server]
listen_address = "0.0.0.0:6000"

[server.health]
enabled = true
path = "/health"

[server.cors]
enabled = true
allow_origins = ["*"]
allow_headers = ["authorization", "content-type", "x-api-key"]
allow_methods = ["GET", "POST", "OPTIONS"]

# -----------------------------------------------------------------------------
# LLM Proxying (use Nexus as the single LLM+MCP entrypoint)
# -----------------------------------------------------------------------------
[llm]
enabled = true

# OpenAI-compatible endpoint (used by many apps)
[llm.protocols.openai]
enabled = true
path = "/llm/openai/v1"

# Anthropic-compatible endpoint (for Claude Code / Anthropic SDK clients)
[llm.protocols.anthropic]
enabled = true
path = "/llm/anthropic"

# Primary local gateway: LiteLLM -> workers (vLLM + Ollama)
[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_MASTER_KEY }}"
base_url = "http://litellm:4000/v1"
forward_token = false

[llm.providers.litellm.models."nyra/reasoning-local"]
[llm.providers.litellm.models."nyra/fast-local"]
[llm.providers.litellm.models."openai/nyra-5090-deepseek-r1"]
[llm.providers.litellm.models."openai/nyra-3090-deepseek-r1"]
[llm.providers.litellm.models."ollama/qwen2.5:7b-instruct"]
[llm.providers.litellm.models."ollama/deepseek-r1:8b"]

# Optional direct cloud providers (kept as explicit fallbacks)
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
forward_token = true
[llm.providers.openai.models."gpt-4o-mini"]
[llm.providers.openai.models."gpt-4o"]

[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"
[llm.providers.anthropic.models."claude-3-5-sonnet-20241022"]
[llm.providers.anthropic.models."claude-3-5-haiku-20241022"]

# -----------------------------------------------------------------------------
# MCP Aggregation (everything funnels through Nexus /mcp)
# -----------------------------------------------------------------------------
[mcp]
enabled = true
path = "/mcp"

# Remote/self-hosted MCP servers (HTTP/SSE)
[mcp.servers.archon]
url = "http://archon-mcp:8051/sse"

[mcp.servers.claude_flow]
url = "http://claude-flow-brain:8080/sse"

[mcp.servers.graphiti]
url = "http://graphiti-mcp:8000/sse"

[mcp.servers.composio]
url = "http://composio-mcp:8067/mcp"

[mcp.servers.n8n]
url = "http://n8n-mcp:8071/mcp"

[mcp.servers.twenty_crm]
url = "http://twenty-mcp:8070/mcp"

[mcp.servers.openclaw]
url = "http://clawhub-mcp:8072/mcp"

# Docker-launched MCP servers (via docker socket) for local tool access
[mcp.servers.github]
type = "docker"
image = "ghcr.io/github/github-mcp-server:latest"
env = { GITHUB_PERSONAL_ACCESS_TOKEN = "{{ env.GITHUB_TOKEN }}" }

[mcp.servers.filesystem]
type = "docker"
image = "ghcr.io/modelcontextprotocol/servers/filesystem:latest"
args = ["/projects"]
volumes = ["/projects:/projects"]

[mcp.servers.git]
type = "docker"
image = "ghcr.io/modelcontextprotocol/servers/git:latest"
volumes = ["/projects:/projects"]

[mcp.servers.playwright]
type = "docker"
image = "mcr.microsoft.com/playwright:v1.52.0-noble"
# placeholder wrapper if you later swap to an MCP-specific image

# Fuzzy tool search / discovery (Nexus built-in)
[tool_search]
enabled = true
fuzzy_match = true
max_results = 50
ranking_strategy = "hybrid"

# Rate limits and cache (use Redis)
[rate_limits]
enabled = true

[rate_limits.backend]
type = "redis"
url = "{{ env.NEXUS_REDIS_URL }}"

[cache]
enabled = true
type = "redis"
url = "{{ env.NEXUS_REDIS_URL }}"
ttl = 900
prefix = "nexus:"
