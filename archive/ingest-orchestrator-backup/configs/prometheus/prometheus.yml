global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['prometheus:9090']

  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']

  - job_name: 'n8n'
    metrics_path: /metrics
    static_configs:
      - targets: ['n8n:5678']

  - job_name: 'activepieces'
    metrics_path: /metrics
    static_configs:
      - targets: ['activepieces:80']


  - job_name: 'orchestrator-node-exporter'
    static_configs:
      - targets: ['100.64.0.1:9100']

  - job_name: 'worker-5090-node-exporter'
    static_configs:
      - targets: ['100.64.0.10:9100']

  - job_name: 'worker-3060-node-exporter'
    static_configs:
      - targets: ['100.64.0.11:9100']

  - job_name: 'worker-3090ti-node-exporter'
    static_configs:
      - targets: ['100.64.0.12:9100']

  - job_name: 'nexus'
    metrics_path: /health
    static_configs:
      - targets: ['nexus:6000']

  - job_name: 'litellm'
    metrics_path: /health/readiness
    static_configs:
      - targets: ['litellm:4000']
