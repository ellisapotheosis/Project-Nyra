services:
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nyra-litellm
    restart: unless-stopped
    command: ["--config","/app/config.yaml","--port","4000","--host","0.0.0.0"]
    ports: ["${LITELLM_PORT:-4001}:4000"]
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      DATABASE_URL: ${LITELLM_DATABASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      WORKER_5090_VLLM_BASE: ${WORKER_5090_VLLM_BASE:-http://100.64.0.10:8000/v1}
      WORKER_3090TI_VLLM_BASE: ${WORKER_3090TI_VLLM_BASE:-http://100.64.0.12:8000/v1}
      WORKER_3060_OLLAMA_BASE: ${WORKER_3060_OLLAMA_BASE:-http://100.64.0.11:11434}
      WORKER_5090_MODEL: ${WORKER_5090_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-32B}
      WORKER_3090TI_MODEL: ${WORKER_3090TI_MODEL:-deepseek-ai/DeepSeek-R1-Distill-Qwen-14B}
    volumes:
      - ../litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      redis: { condition: service_healthy }
    networks: [nyra-network]

  nexus:
    build:
      context: ..
      dockerfile: nexus/Dockerfile
    image: nyra/nexus:local
    container_name: nyra-nexus
    restart: unless-stopped
    ports: ["${NEXUS_PORT:-6000}:6000"]
    environment:
      NEXUS_REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    volumes:
      - ../nexus/nexus.toml:/etc/nexus.toml:ro
      - ../nexus/intelligent-routing-config.json:/etc/nyra/intelligent-routing-config.json:ro
      - ../nexus/mcp-registry.yaml:/etc/nyra/mcp-registry.yaml:ro
      - /var/run/docker.sock:/var/run/docker.sock
      - ${NEXUS_PROJECTS_DIR:-../..}:/projects:rw
    depends_on:
      redis: { condition: service_healthy }
      litellm: { condition: service_started }
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:6000/health >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
    networks: [nyra-network]

  # Optional compatibility alias for any legacy MetaMCP clients (forwards to Nexus)
  metamcp-compat:
    image: nginx:alpine
    container_name: nyra-metamcp-compat
    restart: unless-stopped
    profiles: ["compat"]
    ports: ["${METAMCP_PORT:-12008}:80"]
    volumes:
      - ../configs/nginx/metamcp-compat.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      nexus: { condition: service_healthy }
    networks: [nyra-network]

  letta:
    image: letta/letta:latest
    container_name: nyra-letta
    restart: unless-stopped
    ports:
      - "${LETTA_PORT:-8283}:8283"
      - "${LETTA_ADMIN_PORT:-8284}:8284"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/4
      MONGO_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
    networks: [nyra-network]

  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    restart: unless-stopped
    profiles: ["admin"]
    ports: ["${INFISICAL_PORT:-8080}:8080"]
    environment:
      NODE_ENV: production
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8080}
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:-change_me_infisical}
      AUTH_SECRET: ${INFISICAL_AUTH_SECRET:-change_me_infisical_auth}
      DB_CONNECTION_URI: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/5
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nyra-network]
