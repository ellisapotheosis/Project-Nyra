name: nyra-base

x-logging: &default_logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

networks:
  nyra-network:
    name: nyra-network
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}

volumes:
  postgres_data: {}
  redis_data: {}
  mongo_data: {}
  qdrant_data: {}
  falkordb_data: {}
  letta_pgdata: {}
  ruvector_pg_data: {}
  twenty_postgres_data: {}
  infisical_pg_data: {}
  grafana_data: {}
  prometheus_data: {}
  loki_data: {}
  n8n_data: {}
  activepieces_data: {}
  pgadmin_data: {}
  archon_data: {}
  claude_flow_data: {}
  clawhub_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ["${POSTGRES_PORT:-5432}:5432"]
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ../configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command: ["postgres","-c","config_file=/etc/postgresql/postgresql.conf","-c","hba_file=/etc/postgresql/pg_hba.conf"]
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra-network]
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    restart: unless-stopped
    command: ["sh","-lc","redis-server --requirepass \"$${REDIS_PASSWORD}\" --appendonly yes"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    ports: ["${REDIS_PORT:-6380}:6379"]
    volumes: [redis_data:/data]
    healthcheck:
      test: ["CMD-SHELL","redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [nyra-network]
    logging: *default_logging

  mongo:
    image: mongo:7
    container_name: nyra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    ports: ["${MONGO_PORT:-27017}:27017"]
    volumes: [mongo_data:/data/db]
    healthcheck:
      test: ["CMD-SHELL","mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [nyra-network]
    logging: *default_logging

  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb
    restart: unless-stopped
    ports: ["${FALKORDB_PORT:-6379}:6379"]
    volumes: [falkordb_data:/var/lib/falkordb/data]
    networks: [nyra-network]
    logging: *default_logging

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_HTTP_PORT:-6333}:6333"
      - "${QDRANT_GRPC_PORT:-6334}:6334"
    volumes: [qdrant_data:/qdrant/storage]
    networks: [nyra-network]
    logging: *default_logging

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nyra-pgadmin
    restart: unless-stopped
    profiles: ["admin"]
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:?set PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports: ["${PGADMIN_PORT:-5050}:80"]
    volumes: [pgadmin_data:/var/lib/pgadmin]
    depends_on:
      postgres: { condition: service_healthy }
    networks: [nyra-network]
    logging: *default_logging
