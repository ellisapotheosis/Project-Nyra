services:
  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    restart: unless-stopped
    command: ["-config.file=/etc/loki/loki.yml"]
    ports: ["${LOKI_PORT:-3100}:3100"]
    volumes:
      - loki_data:/loki
      - ../configs/loki/loki.yml:/etc/loki/loki.yml:ro
    networks: [nyra-network]

  promtail:
    image: grafana/promtail:latest
    container_name: nyra-promtail
    restart: unless-stopped
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ../configs/promtail/config.yml:/etc/promtail/config.yml:ro
      - /var/log:/var/log:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    depends_on:
      loki: { condition: service_started }
    networks: [nyra-network]
