services:
  postgres:
    deploy:
      resources:
        limits: { cpus: "4.0", memory: 8G }
  redis:
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 4G }
  nexus:
    restart: always
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
  litellm:
    restart: always
    deploy:
      resources:
        limits: { cpus: "2.0", memory: 2G }
