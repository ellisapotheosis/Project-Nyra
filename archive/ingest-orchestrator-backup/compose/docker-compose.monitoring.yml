services:
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports: ["${PROMETHEUS_PORT:-9090}:9090"]
    volumes:
      - prometheus_data:/prometheus
      - ../configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [nyra-network]

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    restart: unless-stopped
    ports: ["${GRAFANA_PORT:-3000}:3000"]
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_INSTALL_PLUGINS: grafana-clock-panel
    volumes:
      - grafana_data:/var/lib/grafana
      - ../configs/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      prometheus: { condition: service_started }
    networks: [nyra-network]


  node-exporter:
    image: prom/node-exporter:latest
    container_name: nyra-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports: ["${NODE_EXPORTER_PORT:-9100}:9100"]
    networks: [nyra-network]

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: nyra-cadvisor
    restart: unless-stopped
    privileged: true
    devices: ["/dev/kmsg"]
    ports: ["${CADVISOR_PORT:-8089}:8080"]
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    networks: [nyra-network]
