# Oracle VPS Scaling Policies for Free Tier and Paid Tiers
# Documentation: https://www.oracle-vps.com/docs/scaling/autoscaling
---
apiVersion: v1
kind: ScalingPolicy
metadata:
  name: free-tier-scaling
  namespace: nyra-production
  annotations:
    tier: free
    monthly_cost: "$0"
spec:
  # Free Tier Limitations
  limits:
    # Compute
    cpu:
      max: "1"                          # 1 shared vCPU total
      allocation: "0.5"                 # 0.5 vCPU per instance
    memory:
      max: "512Mi"                      # 512 MB RAM
    storage:
      max: "2.5Gi"                      # 2.5 GB SSD

    # Instances
    instances:
      min: 1
      max: 1                            # Single instance only

    # Networking
    bandwidth:
      monthly: "100Gi"                  # 100 GB/month
      burstable: false

    # Builds
    builds:
      monthly: 100                      # 100 builds/month
      concurrent: 1

    # Execution
    execution:
      hours: 730                        # ~24/7 for 30 days

  # Auto-sleep configuration
  autoSleep:
    enabled: true                       # Enable for non-critical services
    idleTimeout: 300                    # 5 minutes
    excludeServices:
      - nyra-webapp-backend             # Keep API always running
      - nyra-n8n-orchestrator           # Keep n8n running for webhooks

  # Resource optimization
  optimization:
    # Aggressive for free tier
    resourceAllocation: "minimal"

    # Container optimization
    container:
      imageCompression: true
      layerCaching: true
      buildCache: true

    # Runtime optimization
    runtime:
      nodeOptions: "--max-old-space-size=384"  # Leave headroom
      gcStrategy: "aggressive"

---
apiVersion: v1
kind: ScalingPolicy
metadata:
  name: starter-tier-scaling
  namespace: nyra-production
  annotations:
    tier: starter
    monthly_cost: "$5"
spec:
  # Starter Tier ($5/month)
  limits:
    cpu:
      max: "2"                          # 2 shared vCPU
      allocation: "1"
    memory:
      max: "1Gi"                        # 1 GB RAM
    storage:
      max: "5Gi"                        # 5 GB SSD
    instances:
      min: 1
      max: 2                            # Up to 2 instances
    bandwidth:
      monthly: "500Gi"                  # 500 GB/month
    builds:
      monthly: 500
      concurrent: 2

  # Auto-scaling rules
  autoScaling:
    enabled: true
    rules:
      - metric: cpu
        threshold: 70                   # Scale at 70% CPU
        action: scale_up
        cooldown: 300                   # 5 minute cooldown
      - metric: memory
        threshold: 80                   # Scale at 80% memory
        action: scale_up
        cooldown: 300
      - metric: requests_per_minute
        threshold: 500
        action: scale_up
        cooldown: 180

  autoSleep:
    enabled: false                      # Disable for production

---
apiVersion: v1
kind: ScalingPolicy
metadata:
  name: production-tier-scaling
  namespace: nyra-production
  annotations:
    tier: production
    monthly_cost: "$20+"
spec:
  # Production Tier ($20+/month)
  limits:
    cpu:
      max: "4"                          # 4 vCPU
      allocation: "2"                   # 2 vCPU per instance
    memory:
      max: "4Gi"                        # 4 GB RAM
    storage:
      max: "20Gi"                       # 20 GB SSD
    instances:
      min: 2                            # High availability
      max: 10
    bandwidth:
      monthly: "unlimited"
    builds:
      monthly: "unlimited"
      concurrent: 5

  # Advanced auto-scaling
  autoScaling:
    enabled: true
    strategy: predictive               # AI-powered predictive scaling

    rules:
      # CPU-based scaling
      - metric: cpu
        threshold: 60
        action: scale_up
        cooldown: 180

      # Memory-based scaling
      - metric: memory
        threshold: 70
        action: scale_up
        cooldown: 180

      # Request rate scaling
      - metric: requests_per_minute
        threshold: 1000
        action: scale_up
        cooldown: 60

      # Response time scaling
      - metric: response_time_p95
        threshold: 500                  # 500ms p95
        action: scale_up
        cooldown: 120

      # Scale down rules
      - metric: cpu
        threshold: 20
        action: scale_down
        cooldown: 600                   # 10 minute cooldown
      - metric: requests_per_minute
        threshold: 100
        action: scale_down
        cooldown: 600

  # Load balancing
  loadBalancing:
    algorithm: least_connections
    healthCheck:
      enabled: true
      interval: 10
      timeout: 5
      unhealthyThreshold: 3
      healthyThreshold: 2

  autoSleep:
    enabled: false

---
# Cost Optimization Recommendations
apiVersion: v1
kind: ConfigMap
metadata:
  name: cost-optimization-guide
data:
  recommendations.md: |
    # Oracle VPS Cost Optimization for Project Nyra

    ## Free Tier Strategy (Current)

    **What's Included:**
    - 1 shared vCPU, 512 MB RAM, 2.5 GB storage
    - 100 GB bandwidth/month
    - 100 builds/month
    - Auto-sleep after 5 minutes idle
    - Single region deployment

    **Recommended Services for Free Tier:**
    1. **n8n Orchestrator** - Keep running 24/7 for webhooks
    2. **Webapp Backend** - API endpoints (can sleep during low traffic)
    3. Choose ONE service to keep active

    **Cost: $0/month**

    ## Upgrade Path 1: Starter Tier ($5/month)

    **When to Upgrade:**
    - > 100 GB bandwidth/month
    - Need 2 concurrent services
    - Require faster response times
    - > 100 builds/month

    **Benefits:**
    - 2 shared vCPU, 1 GB RAM
    - 500 GB bandwidth/month
    - 2 concurrent instances
    - No auto-sleep

    **Recommended for:**
    - Low-traffic production (< 1000 req/day)
    - Development/staging environments
    - MVP launches

    **Cost: $5/month**

    ## Upgrade Path 2: Production Tier ($20+/month)

    **When to Upgrade:**
    - > 10,000 requests/day
    - Need high availability (99.9% uptime)
    - Require auto-scaling
    - Multiple regions
    - > 500 GB bandwidth

    **Benefits:**
    - 4 vCPU, 4 GB RAM
    - Unlimited bandwidth
    - 2-10 instances (auto-scale)
    - Multi-region deployment
    - Advanced monitoring
    - Priority support

    **Recommended for:**
    - Production workloads
    - Customer-facing applications
    - Business-critical services

    **Cost: $20-100+/month depending on usage**

    ## Cost Optimization Tips

    ### 1. Optimize Build Frequency
    - Use GitHub Actions for CI/CD
    - Only trigger Oracle VPS deploys on release tags
    - Cache dependencies to speed up builds

    ### 2. Leverage Auto-Sleep
    - Enable auto-sleep for non-critical services
    - Use cron jobs to wake services before peak hours
    - Implement webhook warming strategies

    ### 3. Bandwidth Optimization
    - Enable gzip compression
    - Use CDN for static assets (Cloudflare free tier)
    - Optimize API responses (pagination, field selection)
    - Cache responses at edge

    ### 4. Resource Right-Sizing
    - Monitor actual resource usage
    - Start with minimal allocation
    - Scale up only when needed
    - Use Oracle VPS metrics dashboard

    ### 5. Multi-Tenancy Strategy
    - Run multiple lightweight services per instance
    - Use service mesh for routing
    - Share resources efficiently

    ## Hybrid Architecture for Cost Savings

    ### Recommended Approach:

    **Oracle VPS (Free Tier):**
    - n8n workflow orchestration
    - Webhook endpoints
    - Lightweight API gateway

    **Local/Self-Hosted:**
    - Development environment
    - Heavy batch processing
    - Database (PostgreSQL, Redis)
    - Claude Flow coordination

    **Benefits:**
    - $0/month for production endpoints
    - Full control over data and processing
    - Scale Oracle VPS only when needed

    ## Mortgage Lead Campaign Cost Analysis

    ### Free Tier Capacity:
    - **Leads/day:** ~500-1000
    - **Email campaigns:** Unlimited (via n8n + SendGrid)
    - **Webhooks:** Unlimited processing
    - **API calls:** ~50,000/day (within bandwidth limits)

    ### When Free Tier Becomes Insufficient:
    - > 1000 leads/day
    - > 100 GB bandwidth/month (~3 GB/day)
    - > 100 deployments/month
    - Need guaranteed uptime (no auto-sleep)

    ### Cost at Scale:
    - **5,000 leads/day:** Starter tier ($5/month) sufficient
    - **25,000 leads/day:** Production tier ($20-40/month)
    - **100,000+ leads/day:** Enterprise tier ($100+/month) or self-host

    ## Decision Matrix

    | Scenario | Recommended Tier | Cost | Notes |
    |----------|------------------|------|-------|
    | MVP/Testing | Free | $0 | Perfect for validation |
    | Small business | Starter | $5/mo | < 5000 leads/month |
    | Growing business | Production | $20/mo | Auto-scaling, HA |
    | Enterprise | Custom | $100+/mo | Dedicated resources |

    ## Action Items

    1. **Month 1-2:** Start with free tier, monitor metrics
    2. **Month 3:** Evaluate usage patterns, upgrade if needed
    3. **Ongoing:** Review monthly costs, optimize resources
    4. **At scale:** Consider hybrid or self-hosted for cost efficiency
