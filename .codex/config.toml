developer_instructions = "You have oh-my-codex installed. AGENTS.md is the orchestration brain and main control surface. Follow AGENTS.md for skill/keyword routing, $name workflow invocation, and role-specialized subagents. Use outcome-first, concise progress updates: state the target result, constraints, validation evidence, and stop condition before adding process detail. Native subagents live in .codex/agents and may handle independent parallel subtasks within one Codex session or team pane. Skills load from .codex/skills, not native-agent TOMLs. Treat installed prompts as narrower execution surfaces under AGENTS.md authority."
project_doc_fallback_filenames = [
    "AGENTS.md",
    "agents.md",
    "CLAUDE.md",
]
project_doc_max_bytes = 65536

[agents]
job_max_runtime_seconds = 3600
max_depth = 5
max_threads = 10

[agents.docs_researcher]
config_file = "agents/docs-researcher.toml"
description = "Documentation specialist for APIs and frameworks."

[agents.explorer]
config_file = "agents/explorer.toml"
description = "Read-only codebase explorer."

[agents.reviewer]
config_file = "agents/reviewer.toml"
description = "PR reviewer focused on security and correctness."

[features]
child_agents_md = true
goals = true
hooks = true
multi_agent = true
tool_search = true
tool_suggest = true

[mcp_servers.serena]
args = [
    "start-mcp-server",
    "--project-from-cwd",
    "--context=claude-code",
]
command = "serena"

[shell_environment_policy]
inherit = "core"

[shell_environment_policy.set]
CLAUDE_CODE_EXPERIMENTAL_AGENT_TEAMS = "1"
LLXPRT_SOURCEGIT = "/usr/bin/sourcegit"
SOURCEGIT_CMD = "/usr/bin/sourcegit"

