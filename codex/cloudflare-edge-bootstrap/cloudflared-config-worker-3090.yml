# Cloudflared Tunnel Configuration for Worker 3090
# Optimized for production edge deployment

---
# Logging Configuration
log_level: info
debug: false

# Origin Server Configuration
originIp: 10.230.228.20
originPort: 443

# TLS/HTTPS Configuration
noTls: false
# Use a wildcard cert if you have multiple domains
useHttp2Multiplex: true

# Origin Configuration
originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  noHappyEyeballs: false
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  httpHostHeader: ""
  originServerName: ""
  caPool: ""
  noTLSVerify: false
  disableChunkedEncoding: false
  bastionMode: false
  proxyAddress: ""
  proxyPort: 0
  proxyType: ""
  http2Origin: true

# Edge Configuration
edgeIpVersion: auto

# Update and Grace Period
autoupdateFreq: 24h
gracePeriod: 30s

# Metrics and Observability
metrics: ""
noMetrics: true

# Auth Configuration
auth:
  authToken: ""

# No Autoupdate (use your own updates)
noAutoupdate: true
