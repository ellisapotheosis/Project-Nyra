# ==============================================================================
# Worker RTX3060 - Docker Compose Configuration
# ==============================================================================
# Mid-range GPU worker for development and testing
#
# Hardware:
#   - GPU: NVIDIA RTX 3060
#   - Development and testing workloads
#
# Services:
#   - Cloudflared tunnel (secure external access)
#   - Development UIs (ports managed via environment variables)
#   - GPU-accelerated containers
#
# Quick Start:
#   docker-compose up -d                    # Start all services
#   docker-compose ps                       # Check status
#   docker-compose logs -f cloudflared      # View logs
#
# ==============================================================================

version: '3.9'

# ==============================================================================
# NETWORKS
# ==============================================================================

networks:
  worker-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET_RTX3060:-172.22.0.0/16}
    driver_opts:
      com.docker.network.bridge.name: worker-rtx3060-br0

# ==============================================================================
# SERVICES
# ==============================================================================

services:

  # ============================================================================
  # CLOUDFLARE TUNNEL (Worker RTX3060)
  # ============================================================================

  # Cloudflared - Secure External Access via Cloudflare Tunnel
  # Exposes: Development UIs on dynamic ports
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: worker-rtx3060-cloudflared
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      # Tunnel token from Cloudflare Zero Trust Dashboard
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_WORKER_RTX3060:?CLOUDFLARE_TUNNEL_TOKEN_WORKER_RTX3060 required}

      # Logging configuration
      TUNNEL_LOGLEVEL: ${CLOUDFLARE_TUNNEL_LOGLEVEL:-info}
      TUNNEL_LOGFILE: /var/log/cloudflared.log

      # Metrics
      TUNNEL_METRICS: ${CLOUDFLARE_TUNNEL_METRICS:-0.0.0.0:9126}

      # Worker identification
      WORKER_ID: rtx3060
      WORKER_GPU: NVIDIA_RTX_3060
    volumes:
      # Config file for advanced routing rules (optional)
      - ./configs/cloudflared/config.yml:/etc/cloudflared/config.yml:ro
      # Logs
      - cloudflared_logs:/var/log
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - worker-network
    labels:
      - "com.nyra.service=infrastructure"
      - "com.nyra.category=tunnel"
      - "com.nyra.ingress=worker"
      - "com.nyra.pc=worker-rtx3060"
      - "com.nyra.gpu=rtx3060"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================================================
  # DEVELOPMENT UIS (Dynamic Ports)
  # ============================================================================

  # Development UI Portal - Web interface for worker management
  dev-ui:
    image: nginx:alpine
    container_name: worker-rtx3060-dev-ui
    restart: unless-stopped
    environment:
      WORKER_NAME: RTX3060-Worker
      WORKER_GPU: NVIDIA RTX 3060
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./configs/nginx/dev-ui.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "${WORKER_RTX3060_DEV_UI_PORT:-8091}:80"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 5s
      retries: 3
    networks:
      - worker-network
    labels:
      - "com.nyra.service=dev-tools"
      - "com.nyra.category=ui"
      - "com.nyra.pc=worker-rtx3060"

  # GPU Monitoring Dashboard
  gpu-monitor:
    image: utkuozdemir/nvidia_gpu_exporter:latest
    container_name: worker-rtx3060-gpu-monitor
    restart: unless-stopped
    privileged: true
    environment:
      NVIDIA_VISIBLE_DEVICES: all
    ports:
      - "${WORKER_RTX3060_GPU_MONITOR_PORT:-9836}:9835"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    networks:
      - worker-network
    labels:
      - "com.nyra.service=monitoring"
      - "com.nyra.category=gpu"
      - "com.nyra.pc=worker-rtx3060"

# ==============================================================================
# VOLUMES
# ==============================================================================

volumes:
  cloudflared_logs:
    driver: local

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
