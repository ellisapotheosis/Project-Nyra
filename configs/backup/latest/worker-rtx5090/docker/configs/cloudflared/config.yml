# ==============================================================================
# Cloudflared Tunnel Configuration - Worker RTX5090
# ==============================================================================
# This config defines ingress rules for the RTX5090 worker PC
#
# Services exposed:
#   - Development UI: dynamic port (default 8090)
#   - GPU Monitoring: dynamic port (default 9835)
#   - AI workload UIs: various ports
#
# Note: When using TUNNEL_TOKEN environment variable, this config is optional.
#       Token-based tunnels get their config from Cloudflare Zero Trust dashboard.
# ==============================================================================

# Ingress rules - Define how external traffic routes to internal services
ingress:
  # Development UI Portal
  - hostname: rtx5090-dev.nyra.your-domain.com
    service: http://worker-rtx5090-dev-ui:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # GPU Monitoring Dashboard
  - hostname: rtx5090-gpu.nyra.your-domain.com
    service: http://worker-rtx5090-gpu-monitor:9835
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Jupyter Lab (example - adjust as needed)
  - hostname: rtx5090-jupyter.nyra.your-domain.com
    service: http://jupyter-rtx5090:8888
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # TensorBoard (example - adjust as needed)
  - hostname: rtx5090-tensorboard.nyra.your-domain.com
    service: http://tensorboard-rtx5090:6006
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Catch-all rule (required)
  - service: http_status:404

# Logging
loglevel: info
transport-loglevel: warn

# Metrics
metrics: 0.0.0.0:9126

# Origin configuration
originRequest:
  # Connection settings
  connectTimeout: 30s
  tcpKeepAlive: 30s
  keepAliveTimeout: 90s
  keepAliveConnections: 100

  # TLS settings
  noTLSVerify: false
  disableChunkedEncoding: false

# Autoupdate (disabled, managed by Docker)
no-autoupdate: true

# Grace period for shutdown
grace-period: 30s
