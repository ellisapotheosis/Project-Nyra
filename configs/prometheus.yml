# Prometheus Configuration for Nyra Distributed AI Infrastructure
# Monitoring and metrics collection across orchestrator and worker nodes

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'nyra-ai-cluster'
    environment: 'production'

rule_files:
  - "/etc/prometheus/rules/*.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets:
          - "alertmanager:9093"

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Orchestrator Node Monitoring
  - job_name: 'orchestrator'
    static_configs:
      - targets: ['localhost:8000']  # API Gateway
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'orchestrator-services'
    static_configs:
      - targets:
        - 'postgres:5432'
        - 'redis:6379'
        - 'grafana:3000'
    scrape_interval: 30s

  # Worker Node Monitoring
  - job_name: 'worker1-rtx3060'
    static_configs:
      - targets: ['worker1.nyra.local:9001']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 10s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'worker1-rtx3060'
      - target_label: worker_id
        replacement: 'worker1'
      - target_label: gpu_model
        replacement: 'rtx_3060'
      - target_label: specialization
        replacement: 'code'

  - job_name: 'worker2-rtx5090'
    static_configs:
      - targets: ['worker2.nyra.local:9002']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 15s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'worker2-rtx5090'
      - target_label: worker_id
        replacement: 'worker2'
      - target_label: gpu_model
        replacement: 'rtx_5090'
      - target_label: specialization
        replacement: 'reasoning'

  - job_name: 'worker3-rtx3090ti'
    static_configs:
      - targets: ['worker3.nyra.local:9003']
    metrics_path: '/metrics'
    scrape_interval: 15s
    scrape_timeout: 15s
    params:
      format: ['prometheus']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'worker3-rtx3090ti'
      - target_label: worker_id
        replacement: 'worker3'
      - target_label: gpu_model
        replacement: 'rtx_3090ti'
      - target_label: specialization
        replacement: 'research'

  # LiteLLM Proxy Monitoring
  - job_name: 'litellm-gateway'
    static_configs:
      - targets: ['localhost:4000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'litellm-worker1'
    static_configs:
      - targets: ['worker1.nyra.local:4001']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'litellm-worker2'
    static_configs:
      - targets: ['worker2.nyra.local:4002']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'litellm-worker3'
    static_configs:
      - targets: ['worker3.nyra.local:4003']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Model Serving Framework Monitoring
  - job_name: 'ollama-worker1'
    static_configs:
      - targets: ['worker1.nyra.local:11434']
    metrics_path: '/api/metrics'
    scrape_interval: 30s

  - job_name: 'vllm-worker2'
    static_configs:
      - targets: ['worker2.nyra.local:8000']
    metrics_path: '/metrics'
    scrape_interval: 30s

  - job_name: 'tgi-worker3'
    static_configs:
      - targets: ['worker3.nyra.local:8080']
    metrics_path: '/metrics'
    scrape_interval: 30s

  # Health Check Services
  - job_name: 'health-checks'
    static_configs:
      - targets:
        - 'worker1.nyra.local:8081'
        - 'worker2.nyra.local:8082'
        - 'worker3.nyra.local:8083'
    metrics_path: '/health/metrics'
    scrape_interval: 60s

  # GPU Monitoring (NVIDIA SMI)
  - job_name: 'nvidia-gpu-worker1'
    static_configs:
      - targets: ['worker1.nyra.local:9400']
    scrape_interval: 10s
    relabel_configs:
      - target_label: gpu_model
        replacement: 'rtx_3060'

  - job_name: 'nvidia-gpu-worker2'
    static_configs:
      - targets: ['worker2.nyra.local:9400']
    scrape_interval: 10s
    relabel_configs:
      - target_label: gpu_model
        replacement: 'rtx_5090'

  - job_name: 'nvidia-gpu-worker3'
    static_configs:
      - targets: ['worker3.nyra.local:9400']
    scrape_interval: 10s
    relabel_configs:
      - target_label: gpu_model
        replacement: 'rtx_3090ti'

  # Cloudflared Tunnel Monitoring
  - job_name: 'cloudflared-tunnels'
    static_configs:
      - targets:
        - 'localhost:8080'         # Orchestrator tunnel
        - 'worker1.nyra.local:8080'  # Worker1 tunnel
        - 'worker2.nyra.local:8080'  # Worker2 tunnel
        - 'worker3.nyra.local:8080'  # Worker3 tunnel
    metrics_path: '/metrics'
    scrape_interval: 60s

  # Redis Monitoring
  - job_name: 'redis-clusters'
    static_configs:
      - targets:
        - 'redis:6379'               # Main Redis
        - 'worker1.nyra.local:6380'  # Worker1 Redis
        - 'worker2.nyra.local:6381'  # Worker2 Redis
        - 'worker3.nyra.local:6382'  # Worker3 Redis
    scrape_interval: 30s

  # Document Processing Services (Worker 3)
  - job_name: 'document-services'
    static_configs:
      - targets:
        - 'worker3.nyra.local:8084'  # Document Processor
        - 'worker3.nyra.local:8085'  # Vision Service
        - 'worker3.nyra.local:8094'  # Citation Manager
    metrics_path: '/metrics'
    scrape_interval: 60s

# Recording Rules for Aggregated Metrics
recording_rules:
  # GPU Utilization Rules
  - name: gpu_utilization
    rules:
      - record: nyra:gpu_utilization_avg
        expr: avg by (worker_id, gpu_model) (nvidia_gpu_utilization_percentage)

      - record: nyra:gpu_memory_usage_percent
        expr: (nvidia_gpu_memory_used_bytes / nvidia_gpu_memory_total_bytes) * 100

      - record: nyra:gpu_temperature_avg
        expr: avg by (worker_id, gpu_model) (nvidia_gpu_temperature_celsius)

  # Model Performance Rules
  - name: model_performance
    rules:
      - record: nyra:requests_per_second
        expr: rate(litellm_requests_total[5m])

      - record: nyra:avg_response_time
        expr: avg by (worker_id, model) (litellm_request_duration_seconds)

      - record: nyra:error_rate
        expr: rate(litellm_errors_total[5m]) / rate(litellm_requests_total[5m])

  # Resource Utilization Rules
  - name: resource_utilization
    rules:
      - record: nyra:cpu_usage_percent
        expr: 100 - (avg by (instance) (irate(node_cpu_seconds_total{mode="idle"}[5m])) * 100)

      - record: nyra:memory_usage_percent
        expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100

      - record: nyra:disk_usage_percent
        expr: (1 - (node_filesystem_avail_bytes{mountpoint="/"} / node_filesystem_size_bytes{mountpoint="/"})) * 100

  # Queue and Load Rules
  - name: queue_metrics
    rules:
      - record: nyra:queue_length
        expr: sum by (worker_id) (vllm_queue_size + tgi_queue_size + ollama_queue_size)

      - record: nyra:concurrent_requests
        expr: sum by (worker_id) (litellm_active_requests)

# Storage Configuration
storage:
  tsdb:
    retention_time: "30d"
    retention_size: "50GB"
    wal_compression: true

# Remote Write Configuration (Optional - for long-term storage)
# remote_write:
#   - url: "https://prometheus-remote-storage.example.com/api/v1/write"
#     basic_auth:
#       username: "prometheus"
#       password: "${REMOTE_STORAGE_PASSWORD}"

# Performance Tuning
query:
  max_concurrency: 20
  max_samples: 50000000
  timeout: 2m

web:
  enable_lifecycle: true
  enable_admin_api: true
  console_templates: "/etc/prometheus/consoles"
  console_libraries: "/etc/prometheus/console_libraries"