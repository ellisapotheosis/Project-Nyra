# Shared tunnel configuration template
shared_settings:
  # Origin settings
  origin_request:
    no_tls_verify: true
    connect_timeout: "30s"
    tls_timeout: "10s"
    tcp_keep_alive: "30s"
    keep_alive_connections: 100
    keep_alive_timeout: "1m30s"

  # Metrics and health
  metrics_server:
    enable: true
    port: 8080

  # Protocol settings
  protocol: "auto"

  # Edge settings
  edge_ip_version: "auto"