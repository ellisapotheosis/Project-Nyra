# Nyra Cloudflared Tunnel Configurations
# Per-PC tunnel setup with Infisical secret management

# Orchestrator Tunnel Configuration
orchestrator:
  tunnel_name: "nyra-orchestrator"
  credentials_file: "/app/secrets/cloudflared-orchestrator.json"
  ingress:
    # Main orchestrator API
    - hostname: "nyra-orchestrator.ratehunter.net"
      service: "http://nyra-orchestrator:8000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s
        tlsTimeout: 10s

    # Web UI
    - hostname: "nyra.ratehunter.net"
      service: "http://nyra-webui:3000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # MetaMCP Gateway
    - hostname: "mcp.ratehunter.net"
      service: "http://metamcp-gateway-enhanced:8005"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Infisical MCP
    - hostname: "secrets.ratehunter.net"
      service: "http://infisical-mcp:8006"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Open WebUI - AI Chat Interface
    - hostname: "chat.ratehunter.net"
      service: "http://nyra-open-webui:3333"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s
        keepAliveTimeout: 90s
        httpHostHeader: chat.ratehunter.net

    # Catch-all
    - service: "http_status:404"

  # Tunnel settings
  tunnel_settings:
    loglevel: "info"
    transport_loglevel: "info"
    retries: 3
    grace_period: "30s"

# Worker 1 Tunnel Configuration (RTX 3060)
worker-1:
  tunnel_name: "nyra-worker-1"
  credentials_file: "/app/secrets/cloudflared-worker-1.json"
  ingress:
    # Worker API
    - hostname: "worker-1.ratehunter.net"
      service: "http://nyra-worker-1:8000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # GPU Metrics
    - hostname: "gpu-1.ratehunter.net"
      service: "http://nyra-worker-1:9000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Catch-all
    - service: "http_status:404"

  tunnel_settings:
    loglevel: "info"
    retries: 3
    grace_period: "30s"

