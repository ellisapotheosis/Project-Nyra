# Cloudflared Tunnel Configuration - Orchestrator Node
# Minisforum UH680 (Ryzen 7 6800H, 16GB DDR5, 1TB SSD)

tunnel: ${NYRA_ORCHESTRATOR_TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials/${NYRA_ORCHESTRATOR_TUNNEL_ID}.json

# Ingress rules for orchestrator services
ingress:
  # Main Nyra Interface
  - hostname: nyra.ratehunter.net
    service: http://localhost:3000
    originRequest:
      httpHostHeader: nyra.ratehunter.net
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveConnections: 10
      keepAliveTimeout: 90s

  # Orchestrator API
  - hostname: orchestrator.ratehunter.net
    service: http://localhost:8080
    originRequest:
      httpHostHeader: orchestrator.ratehunter.net
      connectTimeout: 30s

  # Health Monitoring Dashboard
  - hostname: health.ratehunter.net
    service: http://localhost:9090
    originRequest:
      httpHostHeader: health.ratehunter.net
      connectTimeout: 30s

  # API Gateway (Load Balanced)
  - hostname: api.ratehunter.net
    service: http://localhost:8081
    originRequest:
      httpHostHeader: api.ratehunter.net
      connectTimeout: 30s

  # Worker 1 Proxy (RTX 3060)
  - hostname: worker1.ratehunter.net
    service: http://192.168.1.101:8082
    originRequest:
      httpHostHeader: worker1.ratehunter.net
      connectTimeout: 30s
      noHappyEyeballs: true

  # Worker 2 Proxy (RTX 5090)
  - hostname: worker2.ratehunter.net
    service: http://192.168.1.102:8084
    originRequest:
      httpHostHeader: worker2.ratehunter.net
      connectTimeout: 30s
      noHappyEyeballs: true

  # Worker 3 Proxy (RTX 3090Ti)
  - hostname: worker3.ratehunter.net
    service: http://192.168.1.103:8086
    originRequest:
      httpHostHeader: worker3.ratehunter.net
      connectTimeout: 30s
      noHappyEyeballs: true

  # Catch-all rule
  - service: http_status:404

# Logging configuration
loglevel: info
transport-loglevel: warn
logfile: /var/log/cloudflared/orchestrator.log

# Auto-update configuration
autoupdate-freq: 24h

# Metrics configuration
metrics: 0.0.0.0:8888

# Protocol optimization
protocol: auto

# Edge location preference
region: auto

# Connection limits
max-upstream-conns: 100