# Infisical environment blueprint for NYRA LAN PCs
# Import this into Infisical as a template, then override per host.

project: "NYRA-Orchestrator"
environments:
  - name: prod
    slug: prod
    variables:
      # Core model access
      - key: CLAUDE_FLOW_API_KEY
        value: ""
      - key: ANTHROPIC_API_KEY
        value: ""
      - key: OPENAI_API_KEY
        value: ""
      - key: OPENROUTER_API_KEY
        value: ""

      # Memory backends
      - key: AGENTDB_ENABLED
        value: "true"
      - key: AGENTDB_PATH
        value: ".agentdb/claude-flow.db"
      - key: AGENTDB_QUANTIZATION
        value: "scalar"
      - key: AGENTDB_QUIC_SYNC
        value: "true"
      - key: AGENTDB_QUIC_PORT
        value: "4433"

      # Supabase hybrid federation (optional)
      - key: SUPABASE_URL
        value: ""
      - key: SUPABASE_ANON_KEY
        value: ""
      - key: FEDERATION_VECTOR_BACKEND
        value: "hybrid"

      # Archon MCP
      - key: ARCHON_INSTALL_ROOT
        value: "C:\Dev\ArchonMCP"
      - key: ARCHON_REPO_URL
        value: "https://github.com/archon-mcp/archon-mcp.git"

      # Claude Flow / Nexus / Cloudflared hints
      - key: CLAUDE_FLOW_ROUTER_URL
        value: "http://localhost:8700"
      - key: CLOUDflARED_TUNNEL_NAME
        value: "nyra-rtx3060"

      # Per-PC identity tags (override per host)
      - key: NYRA_PC_ROLE
        value: "orchestrator-1"
      - key: NYRA_PC_LABEL
        value: "Apotheosis-Node-1"