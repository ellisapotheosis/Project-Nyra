name: "sparc-project-apotheosis"
description: >
  End‑to‑end SPARC workflow to have Claude Flow specify, architect, implement,
  and validate the full NYRA / Project Apotheosis orchestrator stack, with
  Claude Flow as primary orchestrator and Archon MCP as secondary / MCP manager.

phases:
  - name: specification
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - specification
        - >
          "Design and implement the complete NYRA orchestrator: Claude Flow
          as primary brains, Archon MCP as secondary orchestrator for MCP
          lifecycle and server management, multi-memory backend (AgentDB + optional
          Letta/OpenMemory/Mem0/Qdrant/Graphiti), and multi-PC LAN bootstrap."

    artifacts:
      - path: docs/sparc/project-apotheosis-spec.md
        from: stdout

  - name: pseudocode
    depends_on: [specification]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - pseudocode
        - >
          "Produce detailed algorithms for: task routing between Claude Flow
          and Archon MCP; memory routing across AgentDB, Letta/OpenMemory/Mem0,
          Qdrant (local+cloud), and Graphiti/Neo4j; and LAN bootstrap flows
          for 4 orchestrator PCs."

    artifacts:
      - path: docs/sparc/project-apotheosis-pseudocode.md
        from: stdout

  - name: architecture
    depends_on: [pseudocode]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - architecture
        - >
          "Define a concrete architecture for: Claude Flow primary orchestrator,
          Archon MCP secondary orchestrator, AgentDB as primary memory backend
          (with QUIC sync), and optional adapters for Letta/OpenMemory/Mem0,
          Qdrant, Graphiti+Neo4j, and Supabase federation. Include diagrams and
          config layout for MCP servers, docker-compose, metamcp channels, and
          env configuration via Infisical."

    artifacts:
      - path: docs/sparc/project-apotheosis-architecture.yaml
        from: stdout

  - name: refinement
    depends_on: [architecture]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - tdd
        - >
          "Implement the orchestrator + memory stack per the architecture,
          with a strong focus on: (1) task delegation to Archon MCP for MCP
          server management; (2) pluggable memory backends; (3) Supabase/AgentDB
          hybrid; (4) GitHub Actions + devcontainer support."

    artifacts:
      - path: docs/sparc/project-apotheosis-refinement-report.md
        from: stdout

  - name: completion
    depends_on: [refinement]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - completion
        - >
          "Finalize the NYRA orchestrator: integration tests, load tests across
          4 LAN PCs, complete documentation, Infisical env catalog, and
          reproducible bootstrap scripts for Claude Flow + Archon MCP."

    artifacts:
      - path: docs/sparc/project-apotheosis-completion-checklist.md
        from: stdout

defaults:
  env:
    # Bind these to Infisical-managed secrets on each LAN PC
    INFISICAL_TOKEN: "${INFISICAL_TOKEN}"
    INFISICAL_PROJECT_ID: "${INFISICAL_PROJECT_ID}"
    INFISICAL_ENV: "prod"
    CLAUDE_FLOW_API_KEY: "${CLAUDE_FLOW_API_KEY}"
    ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY}"
    OPENAI_API_KEY: "${OPENAI_API_KEY}"
    OPENROUTER_API_KEY: "${OPENROUTER_API_KEY}"
    AGENTDB_ENABLED: "true"
    AGENTDB_PATH: ".agentdb/claude-flow.db"
    AGENTDB_QUANTIZATION: "scalar"
    AGENTDB_QUIC_SYNC: "true"
    AGENTDB_QUIC_PORT: "4433"
    SUPABASE_URL: "${SUPABASE_URL}"
    SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY}"
    FEDERATION_VECTOR_BACKEND: "hybrid"