name: "sparc-bootstrap-consolidation"
description: >
  SPARC workflow to merge and refine all bootstrap scripts and docs from
  project-nyra and NYRA-AIO-Bootstrap into: (1) a master LAN PC bootstrap GUI,
  (2) a focused Claude Flow + Archon MCP bootstrap, and (3) a general
  'everything else' bootstrap profile.

inputs:
  project_nyra_path:
    description: "Path to project-nyra repo"
    required: true
  nyra_aio_bootstrap_path:
    description: "Path to NYRA-AIO-Bootstrap repo"
    required: true

phases:
  - name: specification
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - specification
        - >
          "Analyze all bootstrapping files, scripts, and docs under
          ${project_nyra_path} and ${nyra_aio_bootstrap_path}. Define three
          target bootstraps: (A) master LAN PC GUI bootstrap for all 4 PCs,
          (B) focused Claude Flow + Archon MCP bootstrap, (C) everything-else
          stack (OpenWebUI, Ollama, Supabase, etc.). Include user flows for
          Infisical-based env injection."

    artifacts:
      - path: docs/sparc/bootstrap-spec.md
        from: stdout

  - name: architecture
    depends_on: [specification]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - architecture
        - >
          "Design a clean directory layout and GUI launcher for the three
          bootstraps, including per-PC profiles, Infisical integration,
          and Cloudflared/Nexus wiring. Specify PowerShell + Bash entrypoints."

    artifacts:
      - path: docs/sparc/bootstrap-architecture.yaml
        from: stdout

  - name: refinement
    depends_on: [architecture]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - refinement
        - >
          "Implement or refactor the bootstrap scripts into the new layout.
          Generate unified PowerShell/Bash launchers, per-PC config files,
          and documentation for plugging in Infisical secrets for each LAN host."

    artifacts:
      - path: docs/sparc/bootstrap-refinement-report.md
        from: stdout

  - name: completion
    depends_on: [refinement]
    cli:
      command: npx
      args:
        - claude-flow
        - sparc
        - run
        - completion
        - >
          "Smoke-test all three bootstraps on a test machine: (A) master GUI
          bootstrap, (B) Claude Flow + Archon MCP stack, (C) everything-else
          setup. Produce a final operator runbook."

    artifacts:
      - path: docs/sparc/bootstrap-completion-checklist.md
        from: stdout

defaults:
  env:
    INFISICAL_TOKEN: "${INFISICAL_TOKEN}"
    INFISICAL_PROJECT_ID: "${INFISICAL_PROJECT_ID}"
    INFISICAL_ENV: "prod"