version: '3.8'

# Worker RTX 3060 - Development & Testing Workstation
# Role: Medium GPU workloads, code generation, testing
# Hardware: RTX 3060 12GB, 32GB RAM
# Services: Claude Flow Worker, MCP Servers, Dev Tools, Medium LLM Inference

networks:
  nyra-network:
    external: true
    name: nyra-network

volumes:
  # Claude Flow & MCP
  claude-flow-worker-data:
    driver: local
  claude-flow-worker-cache:
    driver: local
  claude-flow-worker-logs:
    driver: local

  # Development Tools
  vscode-server-data:
    driver: local
  jupyter-data:
    driver: local

  # LLM Inference
  ollama-models:
    driver: local

  # Workflow Automation
  n8n-data:
    driver: local
  postgres-n8n-data:
    driver: local

  # CRM
  twentycrm-data:
    driver: local
  postgres-twentycrm-data:
    driver: local

  # Cache
  redis-worker-data:
    driver: local

services:
  # ===================================================================
  # CORE CLAUDE FLOW WORKER
  # ===================================================================

  claude-flow-worker:
    image: ghcr.io/ruv-inc/claude-flow:alpha
    container_name: worker-claude-flow-rtx3060
    hostname: worker-rtx3060
    restart: unless-stopped
    ports:
      - "3011:3010"    # Claude Flow API
      - "8004:8003"    # MCP Server
    environment:
      # Mode Configuration
      - CLAUDE_FLOW_MODE=worker
      - CLAUDE_FLOW_VERSION=3.0.0
      - ORCHESTRATOR_URL=http://172.20.0.10:3010

      # Swarm Configuration
      - SWARM_TOPOLOGY=hierarchical-mesh
      - SWARM_MAX_AGENTS=15
      - SWARM_STRATEGY=specialized
      - SWARM_CONSENSUS=raft
      - SWARM_ROLE=worker

      # Memory Configuration
      - MEMORY_BACKEND=hybrid
      - MEMORY_PATH=/app/data/memory
      - AGENTDB_URL=http://172.20.0.12:8080
      - RUVECTOR_URL=http://172.20.0.13:8888
      - REASONINGBANK_ENABLED=true

      # Hooks & Intelligence
      - HOOKS_ENABLED=true
      - HOOKS_PRE_TASK=true
      - HOOKS_POST_TASK=true
      - HOOKS_INTELLIGENCE=true
      - NEURAL_ENABLED=true
      - SONA_ENABLED=true
      - MOE_ENABLED=true
      - FLASH_ATTENTION=true

      # GPU Configuration
      - GPU_ENABLED=true
      - GPU_TYPE=rtx_3060
      - GPU_MEMORY=12GB
      - GPU_COMPUTE_CAPABILITY=8.6
      - GPU_TENSOR_CORES=112
      - GPU_CUDA_CORES=3584
      - GPU_VRAM=12288
      - GPU_POWER_LIMIT=170
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Preferred Tasks (Medium GPU)
      - PREFERRED_TASKS=medium-model-inference,development-testing,code-generation,data-processing

      # LLM Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXUS_ROUTER_URL=http://172.20.0.11:6000

      # Local LLM
      - OLLAMA_URL=http://ollama-rtx3060:11434

      # Performance (Medium Config)
      - MAX_CONCURRENT_TASKS=6
      - TASK_TIMEOUT=300000
      - MEMORY_LIMIT=24GB
      - CPU_LIMIT=12
      - BATCH_SIZE=16

      # Development Mode
      - HOT_RELOAD=true
      - DEBUG_MODE=false
      - VERBOSE=false
      - PROFILE_PERFORMANCE=true

      # Logging
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/claude-flow.log

      # Metadata
      - PC_ID=worker-rtx3060
      - PC_NAME=RTX 3060 Development Workstation
      - PC_ROLE=worker-development
      - NETWORK_IP=10.0.0.3
    volumes:
      - claude-flow-worker-data:/app/data
      - claude-flow-worker-cache:/app/cache
      - claude-flow-worker-logs:/app/logs
      - ../../config/claude-flow/worker-laptop-2:/app/config:ro
    networks:
      nyra-network:
        ipv4_address: 172.20.0.53
    depends_on:
      - redis-worker-rtx3060
      - ollama-rtx3060
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claude-flow-rtx3060.rule=Host(`worker-rtx3060.nyra.local`)"
      - "traefik.http.services.claude-flow-rtx3060.loadbalancer.server.port=3010"

  # ===================================================================
  # LOCAL LLM INFERENCE
  # ===================================================================

  # Ollama - Local LLM inference with GPU acceleration
  ollama-rtx3060:
    image: ollama/ollama:latest
    container_name: worker-ollama-rtx3060
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=2
      - OLLAMA_MAX_LOADED_MODELS=2
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-models:/root/.ollama
    networks:
      nyra-network:
        ipv4_address: 172.20.0.54
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-rtx3060.rule=Host(`ollama-rtx3060.nyra.local`)"
      - "traefik.http.services.ollama-rtx3060.loadbalancer.server.port=11434"

  # Open WebUI - Ollama web interface
  open-webui-rtx3060:
    image: ghcr.io/open-webui/open-webui:main
    container_name: worker-openwebui-rtx3060
    restart: unless-stopped
    ports:
      - "3002:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rtx3060:11434
      - WEBUI_AUTH=true
      - WEBUI_NAME=Project Nyra AI - RTX 3060
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    volumes:
      - vscode-server-data:/app/backend/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.55
    depends_on:
      - ollama-rtx3060
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui-rtx3060.rule=Host(`ai-rtx3060.nyra.local`)"
      - "traefik.http.services.openwebui-rtx3060.loadbalancer.server.port=8080"

  # ===================================================================
  # DEVELOPMENT TOOLS
  # ===================================================================

  # Code Server (VS Code in browser)
  code-server:
    image: codercom/code-server:latest
    container_name: worker-code-server-rtx3060
    restart: unless-stopped
    ports:
      - "8443:8080"
    environment:
      - PASSWORD=${CODESERVER_PASSWORD}
      - DOCKER_USER=$USER
    volumes:
      - vscode-server-data:/home/coder/project
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      nyra-network:
        ipv4_address: 172.20.0.56
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.code-server.rule=Host(`code.nyra.local`)"
      - "traefik.http.services.code-server.loadbalancer.server.port=8080"

  # Jupyter Lab - Data science notebooks with GPU support
  jupyter-rtx3060:
    image: jupyter/tensorflow-notebook:latest
    container_name: worker-jupyter-rtx3060
    restart: unless-stopped
    ports:
      - "8888:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - jupyter-data:/home/jovyan/work
    networks:
      nyra-network:
        ipv4_address: 172.20.0.57
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter-rtx3060.rule=Host(`jupyter-rtx3060.nyra.local`)"
      - "traefik.http.services.jupyter-rtx3060.loadbalancer.server.port=8888"

  # ===================================================================
  # WORKFLOW AUTOMATION
  # ===================================================================

  # n8n - Workflow automation
  n8n-rtx3060:
    image: n8nio/n8n:latest
    container_name: worker-n8n-rtx3060
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-n8n-rtx3060
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=${N8N_PG_PASSWORD}
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_PASSWORD}
      - WEBHOOK_URL=http://n8n-rtx3060.nyra.local
      - GENERIC_TIMEZONE=America/New_York
      - N8N_SECURE_COOKIE=false
      - N8N_METRICS=true
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n-data:/home/node/.n8n
    networks:
      nyra-network:
        ipv4_address: 172.20.0.58
    depends_on:
      - postgres-n8n-rtx3060
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.n8n-rtx3060.rule=Host(`n8n-rtx3060.nyra.local`)"
      - "traefik.http.services.n8n-rtx3060.loadbalancer.server.port=5678"

  postgres-n8n-rtx3060:
    image: postgres:16-alpine
    container_name: worker-postgres-n8n-rtx3060
    restart: unless-stopped
    environment:
      - POSTGRES_DB=n8n
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=${N8N_PG_PASSWORD}
    volumes:
      - postgres-n8n-data:/var/lib/postgresql/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.59
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===================================================================
  # CRM SYSTEM
  # ===================================================================

  # TwentyCRM - Modern CRM
  twentycrm-rtx3060:
    image: twentycrm/twenty:latest
    container_name: worker-twentycrm-rtx3060
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://twentycrm:${TWENTYCRM_PG_PASSWORD}@postgres-twentycrm-rtx3060:5432/twentycrm
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis-worker-rtx3060:6379
      - JWT_SECRET=${TWENTYCRM_JWT_SECRET}
      - APP_URL=http://crm-rtx3060.nyra.local
      - STORAGE_TYPE=local
      - STORAGE_LOCAL_PATH=/app/data
    volumes:
      - twentycrm-data:/app/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.60
    depends_on:
      - postgres-twentycrm-rtx3060
      - redis-worker-rtx3060
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.twentycrm-rtx3060.rule=Host(`crm-rtx3060.nyra.local`)"
      - "traefik.http.services.twentycrm-rtx3060.loadbalancer.server.port=3000"

  postgres-twentycrm-rtx3060:
    image: pgvector/pgvector:pg16
    container_name: worker-postgres-twentycrm-rtx3060
    restart: unless-stopped
    environment:
      - POSTGRES_DB=twentycrm
      - POSTGRES_USER=twentycrm
      - POSTGRES_PASSWORD=${TWENTYCRM_PG_PASSWORD}
    volumes:
      - postgres-twentycrm-data:/var/lib/postgresql/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.61
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twentycrm"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ===================================================================
  # INFRASTRUCTURE
  # ===================================================================

  # Redis - Caching and pub/sub
  redis-worker-rtx3060:
    image: redis:7-alpine
    container_name: worker-redis-rtx3060
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 8gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-worker-data:/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.62
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================================================
  # MONITORING
  # ===================================================================

  # Node Exporter - System metrics
  node-exporter-rtx3060:
    image: prom/node-exporter:latest
    container_name: worker-node-exporter-rtx3060
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    ports:
      - "9100:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      nyra-network:
        ipv4_address: 172.20.0.63

  # NVIDIA GPU Exporter
  nvidia-gpu-exporter-rtx3060:
    image: nvidia/dcgm-exporter:latest
    container_name: worker-nvidia-exporter-rtx3060
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:
      nyra-network:
        ipv4_address: 172.20.0.64
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
