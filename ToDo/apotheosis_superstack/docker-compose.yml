
version: "3.9"

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea_pass
    volumes:
      - ./orchestrator/config/postgres:/var/lib/postgresql/data
    networks: [stack]

  gitea:
    image: gitea/gitea:latest
    depends_on: [postgres]
    ports:
      - "3000:3000"
      - "222:22"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea_pass
    volumes:
      - ./orchestrator/config/gitea:/data
    networks: [stack]

  qdrant:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - ./orchestrator/qdrant:/qdrant/storage
    networks: [stack]

  qodo:
    image: qodoai/qodo-merge:latest
    ports:
      - "5600:5600"
    networks: [stack]

  flow-orchestrator:
    image: python:3.11-slim
    depends_on: [gitea, qdrant]
    volumes:
      - ./orchestrator/agents:/app/agents
      - ./orchestrator/flows:/app/flows
      - ./orchestrator/config:/app/config
    working_dir: /app
    command: ["python", "agents/main.py"]
    networks: [stack]

  reviewer:
    image: python:3.11-slim
    volumes:
      - ./orchestrator/agents:/app/agents
      - ./orchestrator/config:/app/config
    working_dir: /app
    command: ["python","agents/reviewer.py"]
    networks: [stack]

networks:
  stack:
    driver: bridge
