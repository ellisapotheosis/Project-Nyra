services:
  gitea:
    image: gitea/gitea:latest
    container_name: nyra-gitea
    restart: unless-stopped
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - GITEA__server__DOMAIN=orchestrator-mini
      - GITEA__server__ROOT_URL=http://orchestrator-mini:3001/
    ports:
      - "3001:3000"
      - "2222:22"
    volumes:
      - gitea-data:/data

volumes:
  gitea-data:
