version: '3.9'

# Top‑level compose file for Project Nyra infrastructure.
# Services are grouped into profiles so you can start only the components
# you need. Use the --profile flag with docker compose to select subsets.

services:
  # Memory services
  postgres:
    image: postgres:15
    profiles: ['memory']
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    profiles: ['memory']
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    profiles: ['memory']
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # UI service (placeholder)
  nyra_ui:
    image: nyra/ui:latest
    profiles: ['ui']
    ports:
      - "3000:3000"
    environment:
      - VITE_BACKEND_URL=http://localhost:8080

  # Core orchestration service (placeholder)
  archon_server:
    image: nyra/archon-server:latest
    profiles: ['orchestration']
    ports:
      - "8080:8080"

  # MetaMCP server (placeholder)
  metamcp:
    image: nyra/metamcp:latest
    profiles: ['mcp']
    ports:
      - "9010:9010"

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
