  - service: http_status:404

# ========================================
# TUNNEL CONFIGURATION
# ========================================

# Logging
loglevel: info
transport-loglevel: info

# Metrics endpoint (for monitoring tunnel health)
metrics: 0.0.0.0:9999

# Default origin settings for all routes
originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  noTLSVerify: true

# Tunnel reliability settings
retries: 3
grace-period: 30s
no-autoupdate: true
protocol: auto
