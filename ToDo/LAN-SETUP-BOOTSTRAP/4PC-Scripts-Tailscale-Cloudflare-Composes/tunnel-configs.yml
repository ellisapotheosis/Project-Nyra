# ==============================================================================
# Nyra Cloudflared Tunnel Configurations
# ==============================================================================
# Per-PC tunnel setup with Infisical secret management

# ------------------------------------------------------------------------------
# 1. Orchestrator Tunnel (Central Gateway & Web Services)
# ------------------------------------------------------------------------------
orchestrator:
  tunnel_name: "orchestrator"
  credentials_file: "/app/secrets/cloudflared-orchestrator.json"
  ingress:
    # --- Public Web Apps ---
    
    # 1. Landing Page
    - hostname: "ratehunter.net"
      service: "http://landing-page:80"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # 2. Mortgage Application Webapp
    - hostname: "app.ratehunter.net"
      service: "http://mortgage-webapp:3000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # 3. Dify Chat UI (Embedded)
    - hostname: "chat.ratehunter.net"
      service: "http://dify-chat:3333"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s
        keepAliveTimeout: 90s
        httpHostHeader: chat.ratehunter.net

    # 4. Twenty CRM
    - hostname: "crm.ratehunter.net"
      service: "http://twenty-crm:3000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Existing Web UI (Nyra)
    - hostname: "nyra.ratehunter.net"
      service: "http://nyra-webui:3000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # --- APIs & Backend ---

    # 5. Nexus API Gateway (Unified MCP + LLM)
    - hostname: "nexus.ratehunter.net"
      service: "http://nexus-router:6000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # 6. Orchestrator Core API
    - hostname: "orchestrator.ratehunter.net"
      service: "http://orchestrator:8000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Infisical MCP
    - hostname: "infisical.ratehunter.net"
      service: "http://infisical-mcp:8006"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # --- Infrastructure & Monitoring ---

    # 7. Grafana Monitoring
    - hostname: "grafana.ratehunter.net"
      service: "http://grafana:3000"
      originRequest:
        noTLSVerify: true
        connectTimeout: 30s

    # Catch-all
    - service: "http_status:404"

  # Tunnel settings
  tunnel_settings:
    loglevel: "info"
    transport_loglevel: "info"
    retries: 3
    grace_period: "30s"

