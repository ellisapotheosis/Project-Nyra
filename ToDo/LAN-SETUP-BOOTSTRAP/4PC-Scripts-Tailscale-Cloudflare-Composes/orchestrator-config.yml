tunnel: orchestrator
credentials-file: C:\Users\edane\.cloudflared\orchestrator.json

ingress:
  # Main orchestrator API
  - hostname: orchestrator.ratehunter.net
    service: http://localhost:8000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      tlsTimeout: 10s

  # Web UI
  - hostname: nyra.ratehunter.net
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Nexus Router Gateway (Unified MCP + LLM)
  - hostname: nexus.ratehunter.net
    service: http://localhost:6000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Infisical MCP
  - hostname: infisical.ratehunter.net
    service: http://localhost:8006
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Dify - AI Chat User Interface
  - hostname: chat.ratehunter.net
    service: http://localhost:3333
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s
      keepAliveTimeout: 90s
      httpHostHeader: chat.ratehunter.net

  # Catch-all
  - service: http_status:404

# Logging
loglevel: info
transport-loglevel: info

# Metrics
metrics: 0.0.0.0:8080

# Origin configuration
originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  noTLSVerify: true

# Tunnel settings
retries: 3
grace-period: 30s
no-autoupdate: true

# Protocol
protocol: auto
