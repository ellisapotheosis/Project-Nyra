; ==============================================================================
; Gitea Configuration Template
; ==============================================================================
; This file is a template - actual configuration is managed via environment
; variables in docker-compose.yml for easier orchestration
;
; Documentation: https://docs.gitea.io/en-us/config-cheat-sheet/
; ==============================================================================

APP_NAME = Project Nyra - Local Git Server
RUN_MODE = prod
RUN_USER = git

[repository]
ROOT = /data/git/repositories
DEFAULT_BRANCH = main
DEFAULT_PRIVATE = private
ENABLE_PUSH_CREATE_USER = true
ENABLE_PUSH_CREATE_ORG = true
PREFERED_LICENSES = MIT,Apache-2.0,GPL-3.0
DISABLE_HTTP_GIT = false

[repository.local]
LOCAL_COPY_PATH = /tmp/gitea/local-repo

[repository.upload]
ENABLED = true
TEMP_PATH = /data/gitea/uploads
FILE_MAX_SIZE = 100
MAX_FILES = 10

[repository.pull-request]
DEFAULT_MERGE_STYLE = merge
CLOSE_KEYWORDS = close,closes,closed,fix,fixes,fixed,resolve,resolves,resolved
REOPEN_KEYWORDS = reopen,reopens,reopened
DEFAULT_MERGE_MESSAGE_COMMITS_LIMIT = 50

[server]
PROTOCOL = http
DOMAIN = localhost
HTTP_PORT = 3000
ROOT_URL = http://localhost:3001/
DISABLE_SSH = false
SSH_DOMAIN = localhost
SSH_PORT = 2222
SSH_LISTEN_PORT = 22
START_SSH_SERVER = true
LFS_START_SERVER = true
LFS_CONTENT_PATH = /data/git/lfs
OFFLINE_MODE = false
APP_DATA_PATH = /data/gitea

[database]
DB_TYPE = postgres
HOST = gitea-db:5432
NAME = gitea
USER = gitea
SCHEMA = public
SSL_MODE = disable
LOG_SQL = false
CHARSET = utf8mb4

[security]
INSTALL_LOCK = true
SECRET_KEY =
INTERNAL_TOKEN =
MIN_PASSWORD_LENGTH = 8
PASSWORD_COMPLEXITY = lower,upper,digit
PASSWORD_HASH_ALGO = pbkdf2
PASSWORD_CHECK_PWN = true
SUCCESSFUL_TOKENS_CACHE_SIZE = 20

[service]
DISABLE_REGISTRATION = true
REQUIRE_SIGNIN_VIEW = false
REGISTER_EMAIL_CONFIRM = false
ENABLE_NOTIFY_MAIL = false
DEFAULT_KEEP_EMAIL_PRIVATE = true
DEFAULT_ALLOW_CREATE_ORGANIZATION = true
DEFAULT_ENABLE_TIMETRACKING = true
NO_REPLY_ADDRESS = noreply@localhost
ENABLE_USER_HEATMAP = true
ENABLE_TIMETRACKING = true
DEFAULT_ENABLE_DEPENDENCIES = true
ALLOW_CROSS_REPOSITORY_DEPENDENCIES = true

[webhook]
ALLOWED_HOST_LIST = *
SKIP_TLS_VERIFY = false
DELIVER_TIMEOUT = 15
ALLOWED_TYPES = gitea,gogs,slack,discord,dingtalk,telegram,msteams,feishu,wechatwork

[mailer]
ENABLED = false
; Uncomment and configure when email is needed
; SMTP_ADDR = smtp.example.com
; SMTP_PORT = 587
; FROM = gitea@localhost
; USER = gitea
; PASSWD =

[cache]
ENABLED = true
ADAPTER = memory
INTERVAL = 60
HOST =

[session]
PROVIDER = file
PROVIDER_CONFIG = /data/gitea/sessions
COOKIE_SECURE = false
COOKIE_NAME = i_like_gitea
GC_INTERVAL_TIME = 86400

[picture]
AVATAR_UPLOAD_PATH = /data/gitea/avatars
REPOSITORY_AVATAR_UPLOAD_PATH = /data/gitea/repo-avatars
DISABLE_GRAVATAR = false
ENABLE_FEDERATED_AVATAR = false

[attachment]
ENABLED = true
PATH = /data/gitea/attachments
ALLOWED_TYPES = .docx,.gif,.gz,.jpeg,.jpg,.log,.pdf,.png,.pptx,.txt,.xlsx,.zip
MAX_SIZE = 100
MAX_FILES = 10

[log]
MODE = console
LEVEL = Info
ROOT_PATH = /data/gitea/log
REDIRECT_MACARON_LOG = false
MACARON = file
ROUTER = console

[log.console]
LEVEL = Info
STDERR = false

[git]
PATH =
DISABLE_DIFF_HIGHLIGHT = false
MAX_GIT_DIFF_LINES = 10000
MAX_GIT_DIFF_LINE_CHARACTERS = 5000
MAX_GIT_DIFF_FILES = 100
GC_ARGS =
ENABLE_AUTO_GIT_WIRE_PROTOCOL = true
PULL_REQUEST_PUSH_MESSAGE = true
VERBOSE_PUSH = true
VERBOSE_PUSH_DELAY = 5s

[git.timeout]
DEFAULT = 360
MIGRATE = 600
MIRROR = 300
CLONE = 300
PULL = 300
GC = 60

[mirror]
DEFAULT_INTERVAL = 8h
MIN_INTERVAL = 10m

[api]
ENABLE_SWAGGER = true
MAX_RESPONSE_ITEMS = 50
DEFAULT_PAGING_NUM = 30
DEFAULT_GIT_TREES_PER_PAGE = 1000
DEFAULT_MAX_BLOB_SIZE = 10485760

[oauth2]
ENABLE = true
ACCESS_TOKEN_EXPIRATION_TIME = 3600
REFRESH_TOKEN_EXPIRATION_TIME = 730
INVALIDATE_REFRESH_TOKENS = false
JWT_SECRET =

[i18n]
LANGS = en-US,zh-CN,zh-HK,zh-TW,de-DE,fr-FR,nl-NL,lv-LV,ru-RU,uk-UA,ja-JP,es-ES,pt-BR,pt-PT,pl-PL,bg-BG,it-IT,fi-FI,tr-TR,cs-CZ,sr-SP,sv-SE,ko-KR
NAMES = English,简体中文,繁體中文(香港),繁體中文(台灣),Deutsch,français,Nederlands,latviešu,русский,Українська,日本語,español,português do Brasil,Português de Portugal,polski,български,italiano,suomi,Türkçe,čeština,српски,svenska,한국어

[markup.asciidoc]
ENABLED = false
FILE_EXTENSIONS = .adoc,.asciidoc
RENDER_COMMAND = asciidoc --out-file=- -
IS_INPUT_FILE = false

[markup.markdown]
ENABLED = true
FILE_EXTENSIONS = .md,.markdown
RENDER_COMMAND =
IS_INPUT_FILE = false

[time]
FORMAT = RFC1123
DEFAULT_UI_LOCATION =

[cron]
ENABLED = true
RUN_AT_START = false

[cron.update_mirrors]
SCHEDULE = @every 10m
RUN_AT_START = false

[cron.repo_health_check]
SCHEDULE = @every 24h
TIMEOUT = 60s
ARGS =

[cron.check_repo_stats]
RUN_AT_START = true
SCHEDULE = @every 24h

[cron.archive_cleanup]
ENABLED = true
RUN_AT_START = true
SCHEDULE = @every 24h
OLDER_THAN = 24h

[cron.sync_external_users]
RUN_AT_START = false
SCHEDULE = @every 24h
UPDATE_EXISTING = true

[cron.deleted_branches_cleanup]
ENABLED = true
RUN_AT_START = true
SCHEDULE = @every 24h
OLDER_THAN = 24h

[indexer]
ISSUE_INDEXER_TYPE = bleve
ISSUE_INDEXER_PATH = /data/gitea/indexers/issues.bleve
REPO_INDEXER_ENABLED = true
REPO_INDEXER_PATH = /data/gitea/indexers/repos.bleve
UPDATE_BUFFER_LEN = 20
MAX_FILE_SIZE = 1048576

[queue]
TYPE = level
DATADIR = /data/gitea/queues
LENGTH = 20
BATCH_LENGTH = 20
CONN_STR =
QUEUE_NAME = _queue

[admin]
DISABLE_REGULAR_ORG_CREATION = false

[openid]
ENABLE_OPENID_SIGNIN = false
ENABLE_OPENID_SIGNUP = false

[actions]
ENABLED = false
DEFAULT_ACTIONS_URL = https://gitea.com

[other]
SHOW_FOOTER_BRANDING = false
SHOW_FOOTER_VERSION = true
SHOW_FOOTER_TEMPLATE_LOAD_TIME = true
