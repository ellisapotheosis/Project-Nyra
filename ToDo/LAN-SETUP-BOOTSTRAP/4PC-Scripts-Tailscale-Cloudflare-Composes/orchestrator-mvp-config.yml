    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Grafana Monitoring
  - hostname: grafana.ratehunter.net
    service: http://localhost:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Archon OS Admin Panel (Phase 2)
  - hostname: admin.ratehunter.net
    service: http://localhost:4000
    originRequest:
      noTLSVerify: true
