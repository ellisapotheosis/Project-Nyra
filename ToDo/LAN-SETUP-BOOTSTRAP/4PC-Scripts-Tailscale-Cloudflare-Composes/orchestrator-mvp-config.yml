# Logging
loglevel: info
transport-loglevel: info

# Metrics
metrics: 0.0.0.0:8080

# Origin configuration
originRequest:
  connectTimeout: 30s
  tlsTimeout: 10s
  tcpKeepAlive: 30s
  keepAliveConnections: 100
  keepAliveTimeout: 90s
  noTLSVerify: true

# Tunnel settings
retries: 3
grace-period: 30s
no-autoupdate: true
protocol: auto
