# RTX 3060 (6GB VRAM) - Small models and embeddings
version: '3.8'

services:
  ollama:
    image: ollama/ollama:latest
    container_name: ollama-3060
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_ORIGINS=*
      # Limit memory to leave room for other tasks
      - OLLAMA_NUM_PARALLEL=2
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  ollama_data:

# After starting, pull recommended models:
# docker exec ollama-3060 ollama pull llama3.2:3b
# docker exec ollama-3060 ollama pull phi3:mini  
# docker exec ollama-3060 ollama pull nomic-embed-text
# docker exec ollama-3060 ollama pull qwen2.5:7b-q4_K_M
