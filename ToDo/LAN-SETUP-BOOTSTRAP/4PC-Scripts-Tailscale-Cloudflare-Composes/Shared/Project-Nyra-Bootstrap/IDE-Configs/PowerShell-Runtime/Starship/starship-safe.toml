# NYRA Safe Starship Configuration
# Minimal, guaranteed-working fallback with XulbuX colors
# Used when other configs fail to load or have template errors

format = "$all"
right_format = "$time"
add_newline = true

[time]
disabled = false
format = "[$time]($style)"
time_format = "%H:%M"
style = "fg:#7572F7"

[username]
show_always = true
style_user = "fg:#B38CFF"
format = "[$user]($style)"

[directory]
style = "fg:#668CFF"
truncation_length = 3
truncation_symbol = "…/"

[git_branch]
style = "fg:#96FFBE"
format = "[$symbol$branch]($style) "

[git_status]
style = "fg:#FF5DAE"
format = "[$all_status$ahead_behind]($style) "

[character]
success_symbol = "[❯](fg:#B38CFF)"
error_symbol = "[❯](fg:#FF5DAE)"
vicmd_symbol = "[❮](fg:#B38CFF)"

# Disable potentially problematic modules
[cmd_duration]
disabled = true

[python]
disabled = true

[nodejs]
disabled = true

[package]
disabled = true

[aws]
disabled = true

[azure]
disabled = true

[gcloud]
disabled = true

[kubernetes]
disabled = true

[docker_context]
disabled = true