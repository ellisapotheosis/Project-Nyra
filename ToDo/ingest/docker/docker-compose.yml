version: '3.9'

# Central Docker Compose file for Project Nyra.
# This file composes all services defined in the compose/ directory using
# profiles.  It is intentionally minimal and defers service definitions to
# compose/compose.all.yml so that you can run:
#
#   docker compose -f docker/docker-compose.yml --profile orchestration up
#
# When no profile is specified Docker will start a placeholder service.

services:
  # Compose is not able to include other YAML files natively, so we duplicate
  # the configuration here via extension fields.  To avoid maintenance
  # headaches, keep this file in sync with compose/compose.all.yml.

  # Memory services
  postgres:
    extends:
      file: ../compose/compose.all.yml
      service: postgres
    profiles: ['memory']

  redis:
    extends:
      file: ../compose/compose.all.yml
      service: redis
    profiles: ['memory']

  qdrant:
    extends:
      file: ../compose/compose.all.yml
      service: qdrant
    profiles: ['memory']

  # UI
  nyra_ui:
    extends:
      file: ../compose/compose.all.yml
      service: nyra_ui
    profiles: ['ui']

  # Orchestration
  archon_server:
    extends:
      file: ../compose/compose.all.yml
      service: archon_server
    profiles: ['orchestration']

  # MCP
  metamcp:
    extends:
      file: ../compose/compose.all.yml
      service: metamcp
    profiles: ['mcp']

  # Placeholder service ensures the compose file is valid even if no profiles
  # are selected.  This avoids a "no services defined" error from docker-compose.
  placeholder:
    image: busybox
    command: ["sh", "-c", "echo 'Select a profile to start Nyra services' && tail -f /dev/null"]
    profiles: ['none']

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
