# LiteLLM config: model groups + fallbacks.
# Goal: let different apps hit different *virtual models*:
# - nyra-fast: cheap + fast for routine tasks
# - nyra-think: strong reasoning for hard tasks
# - nyra-vision: vision-capable
#
# Use any OpenAI-compatible client by setting model=nyra-fast etc.

model_list:
  - model_name: nyra-fast
    litellm_params:
      # Prefer OpenRouter cheap models first, then fall back
      model: openrouter/deepseek/deepseek-r1
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: nyra-think
    litellm_params:
      # Swap for your preferred "big brain" model.
      # Example placeholders shown; pick the real OpenRouter IDs you use.
      model: openrouter/anthropic/claude-3.5-sonnet
      api_key: os.environ/OPENROUTER_API_KEY
  - model_name: nyra-vision
    litellm_params:
      model: openai/gpt-4o-mini
      api_key: os.environ/OPENAI_API_KEY

# Basic router: if primary fails, LiteLLM can retry.
# You can expand with more advanced routing/budgeting.
router_settings:
  num_retries: 2
  timeout: 120

# Optional: simple spend controls
# budget_settings:
#   max_budget: 50
#   budget_duration: 1d
