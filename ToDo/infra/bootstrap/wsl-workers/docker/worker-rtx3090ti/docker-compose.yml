name: nyra-worker-vllm
services:
  lmcache-redis:
    image: redis:7-alpine
    container_name: lmcache-redis
    restart: unless-stopped
    command: ["redis-server","--save","","--appendonly","no"]
    expose: ["6379"]

  vllm:
    build: ../worker-vllm
    container_name: vllm-openai
    restart: unless-stopped
    ports: ["8000:8000"]
    ipc: host
    environment:
      - HF_TOKEN=${HF_TOKEN}
      - LMCACHE_REMOTE_URL=${LMCACHE_REMOTE_URL}
      - LMCACHE_USE_LOCAL=0
    volumes:
      - ${HOME}/.cache/huggingface:/root/.cache/huggingface
      - vllm_cache:/root/.cache
    depends_on: [lmcache-redis]
    command: >
      --model ${VLLM_MODEL}
      --host 0.0.0.0
      --port 8000
      --dtype ${VLLM_DTYPE}
      --max-model-len ${VLLM_MAX_MODEL_LEN}
      --gpu-memory-utilization ${VLLM_GPU_MEMORY_UTILIZATION}
      --tensor-parallel-size ${VLLM_TENSOR_PARALLEL}
      --enable-prefix-caching
      --enforce-eager
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
volumes:
  vllm_cache:
