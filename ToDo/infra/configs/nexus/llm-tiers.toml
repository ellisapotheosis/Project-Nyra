# Additional LLM tier aliases for Nexus Router
#
# This configuration can be included alongside the primary nexus.toml file to
# provide simple, stable model aliases for cost–conscious routing.  Each alias
# resolves to a fully qualified upstream model name.  By using these names
# (e.g. `claude/economy` or `google/premium`) in your agent requests you can
# explicitly control cost versus capability without maintaining a separate
# proxy such as LiteLLM.  Unwanted tiers can be removed to hard‑disable
# expensive models.

[llm.providers.claude.models.economy]
# Map the economy tier to the fast/cheap Claude model defined in nexus.toml
rename = "claude-fast"

[llm.providers.claude.models.standard]
# Standard tier uses Claude Sonnet (primary workhorse)
rename = "claude-sonnet"

[llm.providers.claude.models.premium]
# Premium tier maps to Claude Opus for complex reasoning
rename = "claude-opus"

[llm.providers.google.models.economy]
# Economy tier uses the cheap flash model
rename = "gemini-cheap"

[llm.providers.google.models.premium]
# Premium tier uses Gemini Pro (1.5 pro)
rename = "gemini-pro"

# To use these tiers, reference them via `<provider>/<tier>` in the model
# parameter of your OpenAI‑compatible requests.  For example:
#   "model": "claude/economy"
# or
#   "model": "google/premium"
