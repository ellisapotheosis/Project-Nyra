version: '3.8'

# Oracle Application Services

services:
  twentycrm:
    image: twentycrm/twenty:latest
    environment:
      - DATABASE_URL=postgresql://twenty:${TWENTY_DB_PASSWORD}@postgres-twenty:5432/twenty
      - JWT_SECRET=${TWENTY_JWT_SECRET}
    depends_on:
      - postgres-twenty
    networks:
      - oracle-net

  n8n:
    image: n8nio/n8n:latest
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=postgres-activepieces
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=activepieces
      - DB_POSTGRESDB_PASSWORD=${ACTIVEPIECES_DB_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_JWT_SECRET=${N8N_JWT_SECRET}
      - N8N_PORT=5678
    depends_on:
      - postgres-activepieces
    networks:
      - oracle-net

  activepieces:
    image: activepieces/activepieces:latest
    environment:
      - DB_TYPE=postgresql
      - DB_HOST=postgres-activepieces
      - DB_PORT=5432
      - DB_NAME=activepieces
      - DB_USER=activepieces
      - DB_PASSWORD=${ACTIVEPIECES_DB_PASSWORD}
      - ACTIVEPIECES_ENCRYPTION_KEY=${ACTIVEPIECES_ENCRYPTION_KEY}
      - PORT=8082
    depends_on:
      - postgres-activepieces
    networks:
      - oracle-net

  quote-api:
    image: nyra/quote-api:latest
    environment:
      - DATABASE_URL=postgresql://nyra:${NYRA_AI_DB_PASSWORD}@postgres-nyra-ai:5432/nyra_ai
      - RATE_PROVIDER_API_KEY=${RATE_PROVIDER_API_KEY}
    depends_on:
      - postgres-nyra-ai
    networks:
      - oracle-net

  campaign-engine:
    image: nyra/campaign-engine:latest
    environment:
      - DATABASE_URL=postgresql://nyra:${NYRA_AI_DB_PASSWORD}@postgres-nyra-ai:5432/nyra_ai
      - TWILIO_ACCOUNT_SID=${TWILIO_ACCOUNT_SID}
      - TWILIO_AUTH_TOKEN=${TWILIO_AUTH_TOKEN}
    depends_on:
      - postgres-nyra-ai
    networks:
      - oracle-net

  admin-ui:
    image: nyra/admin-ui:latest
    environment:
      - API_BASE_URL=http://nexus-router:6000
      - CRM_API_URL=http://twentycrm:3000
    depends_on:
      - twentycrm
      - nexus-router
    networks:
      - oracle-net

networks:
  oracle-net:
    external: true