# Optional overlay: Graphiti MCP memory on top of FalkorDB
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.graphiti.yml up -d

services:
  graphiti_mcp:
    image: zepai/knowledge-graph-mcp:standalone
    restart: unless-stopped
    environment:
      - FALKORDB_URI=redis://falkordb:6379
      - FALKORDB_PASSWORD=
      - FALKORDB_DATABASE=default_db
      - GRAPHITI_GROUP_ID=${GRAPHITI_GROUP_ID:-nyra}
      # Graphiti needs at least one provider key.
      # Try routing via Nexus/LiteLLM by setting OPENAI_BASE_URL, but if it doesn't work, use a direct key.
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=http://nexus:6000/llm/openai/v1
      - SEMAPHORE_LIMIT=5
    ports:
      - "8000:8000"
    depends_on:
      - falkordb
      - nexus
