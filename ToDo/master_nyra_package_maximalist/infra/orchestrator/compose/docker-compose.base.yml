name: nyra

x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

networks:
  nyra:
    name: nyra
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}

volumes:
  postgres_data: {}
  redis_data: {}
  mongo_data: {}
  grafana_data: {}
  prometheus_data: {}
  loki_data: {}
  n8n_data: {}
  activepieces_data: {}
  ruvector_data: {}

services:
  # ---------------------------------------------------------------------------
  # Core data layer
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres
    profiles: ["core"]
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TIMEZONE:-America/New_York}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
      - ./configs/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
    command:
      - "postgres"
      - "-c"
      - "config_file=/etc/postgresql/postgresql.conf"
      - "-c"
      - "hba_file=/etc/postgresql/pg_hba.conf"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    profiles: ["core"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command:
      - "sh"
      - "-lc"
      - "redis-server --requirepass \"$${REDIS_PASSWORD}\" --maxmemory ${REDIS_MAX_MEMORY:-2gb} --maxmemory-policy allkeys-lru"
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  mongo:
    image: mongo:7
    container_name: nyra-mongo
    profiles: ["core"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.runCommand({ ping: 1 })' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  # ---------------------------------------------------------------------------
  # Secret management (Infisical)
  # ---------------------------------------------------------------------------
  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    profiles: ["secrets"]
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:${INFISICAL_PORT:-8080}}
      PORT: "8080"
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?set INFISICAL_ENCRYPTION_KEY}
      JWT_SECRET: ${INFISICAL_JWT_SECRET:?set INFISICAL_JWT_SECRET}
      NODE_ENV: ${INFISICAL_ENV:-development}
      DB_CONNECTION_URI: "mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/infisical?authSource=admin"
    ports:
      - "${INFISICAL_PORT:-8080}:8080"
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  # ---------------------------------------------------------------------------
  # Workflow / Automation
  # ---------------------------------------------------------------------------
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    profiles: ["workflow"]
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      N8N_PORT: "5678"
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      WEBHOOK_URL: ${WEBHOOK_URL:-http://localhost:${N8N_PORT:-5678}/}
      GENERIC_TIMEZONE: ${TIMEZONE:-America/New_York}

      # Use the core Postgres for n8n by default
      DB_TYPE: "postgresdb"
      DB_POSTGRESDB_HOST: "postgres"
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nyra}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      N8N_ENCRYPTION_KEY: ${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY}
    ports:
      - "${N8N_PORT:-5678}:5678"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n-workflows:/opt/nyra/n8n-workflows:ro
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  activepieces:
    image: activepieces/activepieces:latest
    container_name: nyra-activepieces
    profiles: ["workflow"]
    environment:
      AP_JWT_SECRET: ${ACTIVEPIECES_JWT_SECRET:?set ACTIVEPIECES_JWT_SECRET}
      AP_ENCRYPTION_KEY: ${ACTIVEPIECES_ENCRYPTION_KEY:?set ACTIVEPIECES_ENCRYPTION_KEY}
      AP_ENVIRONMENT: "prod"
    ports:
      - "${ACTIVEPIECES_PORT:-8082}:80"
    volumes:
      - activepieces_data:/root/.activepieces
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  # ---------------------------------------------------------------------------
  # Observability (Loki / Prometheus / Grafana / cAdvisor)
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus
    profiles: ["observability"]
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  loki:
    image: grafana/loki:latest
    container_name: nyra-loki
    profiles: ["observability"]
    command: ["-config.file=/etc/loki/loki.yml"]
    ports:
      - "${LOKI_PORT:-3100}:3100"
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana
    profiles: ["observability"]
    depends_on:
      - prometheus
      - loki
    ports:
      - "${GRAFANA_PORT:-3003}:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./configs/grafana/provisioning:/etc/grafana/provisioning:ro
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: nyra-cadvisor
    profiles: ["observability"]
    ports:
      - "${CADVISOR_PORT:-8081}:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  # ---------------------------------------------------------------------------
  # Edge / Remote access (Cloudflare Tunnel)
  # ---------------------------------------------------------------------------
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-cloudflared
    profiles: ["edge"]
    command: ["tunnel", "run"]
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR:?set CLOUDFLARE_TUNNEL_TOKEN_ORCHESTRATOR}
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  # ---------------------------------------------------------------------------
  # Vector DB (RuVector PostgreSQL) — optional, runs alongside main Postgres
  # ---------------------------------------------------------------------------
  ruvector-postgres:
    image: ruvnet/ruvector-postgres:latest
    container_name: ruvector-postgres
    profiles: ["vector"]
    environment:
      POSTGRES_USER: ${RUVECTOR_POSTGRES_USER:-claude}
      POSTGRES_PASSWORD: ${RUVECTOR_POSTGRES_PASSWORD:?set RUVECTOR_POSTGRES_PASSWORD}
      POSTGRES_DB: ${RUVECTOR_POSTGRES_DB:-claude_flow}
    ports:
      - "${RUVECTOR_POSTGRES_PORT:-5436}:5432"
    volumes:
      - ruvector_data:/var/lib/postgresql/data
      - ./ruvector/scripts/init-db.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${RUVECTOR_POSTGRES_USER:-claude} -d ${RUVECTOR_POSTGRES_DB:-claude_flow}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging

  ruvector-pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ruvector-pgadmin
    profiles: ["vector", "gui"]
    depends_on:
      ruvector-postgres:
        condition: service_healthy
    environment:
      PGADMIN_DEFAULT_EMAIL: ${RUVECTOR_PGADMIN_EMAIL:-admin@claude-flow.local}
      PGADMIN_DEFAULT_PASSWORD: ${RUVECTOR_PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "${RUVECTOR_PGADMIN_PORT:-5050}:80"
    networks: [nyra]
    restart: unless-stopped
    logging: *default_logging
