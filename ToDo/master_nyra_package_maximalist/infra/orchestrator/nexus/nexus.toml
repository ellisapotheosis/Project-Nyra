##############################################################################
# Project Nyra — Nexus Router (single entrypoint)
#
# - MCP aggregator: /mcp
# - LLM router (OpenAI-compatible): /llm/v1
#
# This config is designed to run inside Docker Desktop (WSL2 backend) on your
# orchestrator PC and reach workers over Tailscale.
##############################################################################

[server]
listen_address = "0.0.0.0:8000"

[server.health]
enabled = true
path = "/health"

# -----------------------------------------------------------------------------
# LLM routing
# -----------------------------------------------------------------------------
[llm]
enabled = true

# Expose an OpenAI-compatible API from Nexus.
[llm.protocols.openai]
enabled = true
path = "/llm/v1"

# Optional: expose an Anthropic-compatible endpoint for Claude Code/clients.
[llm.protocols.anthropic]
enabled = true
path = "/llm/anthropic"

# Local routing via LiteLLM (which load-balances between workers)
[llm.providers.litellm]
type = "openai"
api_key = "{{ env.LITELLM_API_KEY }}"
base_url = "{{ env.LITELLM_BASE_URL }}"
forward_token = false

[llm.providers.litellm.models."local/deepseek-r1-qwen32b"]
[llm.providers.litellm.models."local/deepseek-r1-qwen14b"]
[llm.providers.litellm.models."local/ollama-llama3"]
[llm.providers.litellm.models."local/embeddings"]

# Optional direct-to-cloud fallbacks
[llm.providers.openai]
type = "openai"
api_key = "{{ env.OPENAI_API_KEY }}"
forward_token = true

[llm.providers.openai.models."gpt-5"]
[llm.providers.openai.models."gpt-4o"]
[llm.providers.openai.models."gpt-4o-mini"]

[llm.providers.anthropic]
type = "anthropic"
api_key = "{{ env.ANTHROPIC_API_KEY }}"

[llm.providers.anthropic.models."claude-3-5-sonnet-20241022"]
[llm.providers.anthropic.models."claude-3-5-haiku-20241022"]

[llm.providers.google]
type = "google"
api_key = "{{ env.GOOGLE_API_KEY }}"

[llm.providers.google.models."gemini-1.5-pro"]
[llm.providers.google.models."gemini-1.5-flash"]

# -----------------------------------------------------------------------------
# MCP aggregation
# -----------------------------------------------------------------------------
[mcp]
enabled = true
path = "/mcp"

# -----------------------
# Remote HTTP/SSE servers
# -----------------------

[mcp.servers.graphiti]
url = "http://graphiti-mcp:8000/sse"

[mcp.servers.claude_flow]
url = "http://claude-flow-dev:3000/sse"

# -----------------------
# Docker-based STDIO servers
#
# These are launched by Nexus via the Docker socket.
# -----------------------

[mcp.servers.github]
type = "docker"
image = "ghcr.io/github/github-mcp-server:latest"
env = {
  GITHUB_PERSONAL_ACCESS_TOKEN = "{{ env.GITHUB_TOKEN }}",
  GITHUB_READ_ONLY = "true",
  GITHUB_DYNAMIC_TOOLSETS = "1",
}

[mcp.servers.n8n]
type = "docker"
image = "mcp/n8n:latest"
env = {
  N8N_API_URL = "http://n8n:5678",
  N8N_API_KEY = "{{ env.N8N_API_KEY }}",
}

[mcp.servers.twenty_crm]
type = "docker"
image = "nyra/twenty-crm-mcp:local"
env = {
  TWENTY_API_KEY = "{{ env.TWENTY_API_KEY }}",
  # If you self-host Twenty in this stack:
  TWENTY_BASE_URL = "http://twenty:3000",
}

# -----------------------------------------------------------------------------
# Tool search / fuzzy match (Nexus has this built-in; we just tune it)
# -----------------------------------------------------------------------------
[tool_search]
enabled = true
fuzzy_match = true
max_results = 40
ranking_strategy = "hybrid"

##############################################################################
# End
##############################################################################