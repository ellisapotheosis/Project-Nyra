
version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: gitea-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gitea
      POSTGRES_USER: gitea
      POSTGRES_PASSWORD: gitea_pass
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    networks: [gitea_net]

  gitea:
    image: gitea/gitea:latest
    container_name: gitea
    restart: unless-stopped
    depends_on: [postgres]
    ports:
      - "3000:3000"
      - "222:22"
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: gitea
      GITEA__database__USER: gitea
      GITEA__database__PASSWD: gitea_pass
      GITEA__service__DISABLE_REGISTRATION: "false"
      GITEA__webhook__ALLOWED_HOST_LIST: "*"
    volumes:
      - ./data/gitea:/data
      - ./ai-hooks:/ai-hooks
    networks: [gitea_net]

  # Claude-driven PR reviewer (custom webhook processor)
  claude-reviewer:
    image: python:3.11-slim
    container_name: claude-reviewer
    restart: unless-stopped
    depends_on: [gitea]
    volumes:
      - ./ai-reviewer:/app
    environment:
      ANTHROPIC_API_KEY: "REPLACE_WITH_YOUR_KEY"
      GITEA_URL: "http://gitea:3000"
      GITEA_TOKEN: "REPLACE_WITH_YOUR_GITEA_API_TOKEN"
    command: ["python", "/app/reviewer.py"]
    networks: [gitea_net]

networks:
  gitea_net:
    driver: bridge
