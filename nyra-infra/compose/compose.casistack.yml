version: '3.9'

name: nyra-casistack

networks:
  nyra:
    external: true

volumes:
  casistack_logs: {}

services:
  casistack-orchestrator:
    # Replace build with image when upstream publishes:
    # image: ghcr.io/casistack/mcp-openwebui-docker-orchestrator:latest
    build:
      context: ../casistack-orchestrator
      dockerfile: Dockerfile
    container_name: nyra-casistack
    restart: unless-stopped
    env_file:
      - ./env/merged.env
      - ../../.env.master.example
    environment:
      - MANAGER_PORT=${MANAGER_PORT:-3001}
      - MCP_PROXY_MODE=${MCP_PROXY_MODE:-unified}
      - MCP_PROXY_TYPE=${MCP_PROXY_TYPE:-mcpo}
      - PORT_RANGE_START=${PORT_RANGE_START:-4200}
      - PORT_RANGE_END=${PORT_RANGE_END:-4300}
      - CLAUDE_CONFIG_PATH=${CLAUDE_CONFIG_PATH:-/config/claude_desktop_config.json}
    ports:
      - '3001:3001'
      - '4200-4300:4200-4300'
    volumes:
      - casistack_logs:/var/log/mcp-proxy-manager
      - ../metamcp-gateway/claude_desktop_config.json:/config/claude_desktop_config.json:ro
    networks: [nyra]
