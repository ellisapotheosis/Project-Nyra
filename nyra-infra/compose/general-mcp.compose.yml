version: '3.8'

services:
  # GitHub MCP Server - GitHub operations and repository management
  github-mcp:
    image: mcp/github:latest
    container_name: nyra-github-mcp
    ports:
      - "3010:3010"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - MCP_PORT=3010
    networks:
      - nyra-network
    restart: unless-stopped

  # Docker MCP Server - Docker container and image management
  docker-mcp:
    image: mcp/docker:latest
    container_name: nyra-docker-mcp
    ports:
      - "3011:3011"
    environment:
      - MCP_PORT=3011
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - nyra-network
    restart: unless-stopped

  # Filesystem MCP Server - File system operations
  filesystem-mcp:
    image: mcp/filesystem:latest
    container_name: nyra-filesystem-mcp
    ports:
      - "3012:3012"
    environment:
      - MCP_PORT=3012
      - ALLOWED_DIRECTORIES=/workspace
    volumes:
      - ../../:/workspace:rw
    networks:
      - nyra-network
    restart: unless-stopped

  # Memory MCP Server - Persistent memory and knowledge graph
  memory-mcp:
    image: mcp/memory:latest
    container_name: nyra-memory-mcp
    ports:
      - "3013:3013"
    environment:
      - MCP_PORT=3013
      - DATABASE_URL=postgresql://nyra:${DB_PASSWORD}@postgres:5432/memory
    volumes:
      - memory-data:/app/data
    depends_on:
      - postgres
    networks:
      - nyra-network
    restart: unless-stopped

  # Notion MCP Server - Notion API integration
  notion-mcp:
    image: mcp/notion:latest
    container_name: nyra-notion-mcp
    ports:
      - "3014:3014"
    environment:
      - NOTION_API_KEY=${NOTION_API_KEY}
      - MCP_PORT=3014
    networks:
      - nyra-network
    restart: unless-stopped

volumes:
  memory-data:

networks:
  nyra-network:
    name: nyra-network
    external: true
