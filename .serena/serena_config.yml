# Serena global configuration for Project Nyra operator workflow
# Store at:
#   Linux/macOS/WSL: ~/.serena/serena_config.yml
#   Windows: %USERPROFILE%\.serena\serena_config.yml

language_backend: LSP
line_ending: native

gui_log_window: false
web_dashboard: true
web_dashboard_listen_address: 127.0.0.1
web_dashboard_open_on_launch: true
jetbrains_plugin_server_address: 127.0.0.1

log_level: 20
trace_lsp_communication: false

# Keep the global config conservative. Put Nyra-specific behavior in project.yml.
ls_specific_settings: {}

# Apply only broad ignores globally.
ignored_paths:
  - "**/.git/**"
  - "**/.DS_Store"
  - "**/Thumbs.db"

read_only_memory_patterns:
  - "global/.*"

tool_timeout: 300
excluded_tools: []
included_optional_tools: []
fixed_tools: []

# Keep global defaults simple.
base_modes:
default_modes:
  - interactive
  - editing

default_max_tool_answer_chars: 150000
token_count_estimator: CHAR_COUNT
symbol_info_budget: 15

# Keep Serena data inside each repo by default.
project_serena_folder_location: "$projectDir/.serena"

# Registered local project paths. Add more as needed.
projects:
  - /home/ellisapotheosis/repos/project-nyra

ignored_memory_patterns:
  - "_archive/.*"
