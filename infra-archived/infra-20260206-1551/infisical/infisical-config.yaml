# ============================================================================
# Infisical Agent Configuration - Project Nyra
# ============================================================================
# This is the enhanced configuration for the Infisical Agent that syncs
# secrets from Infisical Cloud to local .env files for Docker Compose.
#
# The agent pulls secrets from multiple paths:
#   • /shared          - Shared secrets (DB, Redis, API keys)
#   • /worker-5090     - RTX 5090 GPU worker configuration
#   • /worker-3090     - RTX 3090 Ti GPU worker configuration
#   • /worker-3060     - RTX 3060 GPU worker configuration
#
# Project Details:
#   Project ID:  8374cea9-e5e8-4050-bda4-b91f25ab30ef
#   Environment: dev
#   Auth Method: Universal Auth (Machine Identity)
# ============================================================================

# Infisical instance configuration
infisical:
  # Infisical Cloud URL (or self-hosted instance)
  address: https://app.infisical.com

  # Authentication using Machine Identity (Universal Auth)
  auth:
    type: universal-auth
    credentials:
      # Client ID and Secret are read from files for security
      # These files should be created by setup-infisical-orchestrator.ps1
      client-id-path: /run/secrets/infisical-client-id
      client-secret-path: /run/secrets/infisical-client-secret

# ============================================================================
# Sinks - Define where and how secrets are rendered
# ============================================================================
sinks:
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 1. Master Environment File (all secrets combined)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env
      template: |
        # ========================================================================
        # Project Nyra - Master Environment Variables
        # Auto-generated by Infisical Agent
        # ========================================================================

        # Shared Configuration (/shared)
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # ========================================================================
        # Worker Configurations
        # ========================================================================

        # RTX 5090 Worker (/worker-5090)
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-5090" }}
        {{- range . }}
        WORKER_5090_{{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # RTX 3090 Ti Worker (/worker-3090)
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-3090" }}
        {{- range . }}
        WORKER_3090_{{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # RTX 3060 Worker (/worker-3060)
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-3060" }}
        {{- range . }}
        WORKER_3060_{{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # ========================================================================
        # Generated: {{ now | date "2006-01-02 15:04:05" }}
        # ========================================================================
      interval: 60  # Re-render every 60 seconds

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 2. Shared Secrets Only (/shared)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env.shared
      template: |
        # ========================================================================
        # Project Nyra - Shared Configuration
        # Database, Redis, API Keys, Service URLs
        # ========================================================================
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}
      interval: 60

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 3. Orchestrator-Specific (PC1)
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env.orchestrator
      template: |
        # ========================================================================
        # Orchestrator PC Configuration
        # Shared + Orchestrator-specific services
        # ========================================================================

        # Shared secrets
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # Orchestrator role
        MACHINE_ROLE=orchestrator
        DEPLOYMENT_TYPE=orchestrator
      interval: 60

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 4. Worker 5090 (PC3) - High-performance inference
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env.worker-5090
      template: |
        # ========================================================================
        # Worker 5090 Configuration (RTX 5090, 48GB VRAM)
        # Specialization: Complex reasoning, large models
        # ========================================================================

        # Shared secrets
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # Worker-specific configuration
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-5090" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}
      interval: 60

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 5. Worker 3090 (PC4) - General purpose
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env.worker-3090
      template: |
        # ========================================================================
        # Worker 3090 Configuration (RTX 3090 Ti, 24GB VRAM)
        # Specialization: General purpose, quote generation
        # ========================================================================

        # Shared secrets
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # Worker-specific configuration
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-3090" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}
      interval: 60

  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  # 6. Worker 3060 (PC2) - Code generation, embeddings
  # ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
  - type: file
    config:
      path: /app/rendered/.env.worker-3060
      template: |
        # ========================================================================
        # Worker 3060 Configuration (RTX 3060, 12GB VRAM)
        # Specialization: Code generation, document processing
        # ========================================================================

        # Shared secrets
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/shared" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}

        # Worker-specific configuration
        {{- with secret "8374cea9-e5e8-4050-bda4-b91f25ab30ef" "dev" "/worker-3060" }}
        {{- range . }}
        {{ .Key }}={{ .Value }}
        {{- end }}
        {{- end }}
      interval: 60

# ============================================================================
# Exit Configuration
# ============================================================================
exit:
  # What to do when agent exits
  # "file" = write secrets one last time before exiting
  # "none" = don't write anything on exit
  mode: file

  # Optionally clear rendered files on exit (security feature)
  # Set to true for high-security environments where secrets
  # should not persist after agent stops
  clear-outputs: false

# ============================================================================
# Template Functions Available
# ============================================================================
#
# The following Go template functions are available:
#
#   {{- with secret "PROJECT_ID" "ENV" "PATH" }}
#     Fetch secrets from a specific path
#
#   {{- range . }}
#     Iterate over all secrets
#
#   {{ .Key }}
#     Secret key name
#
#   {{ .Value }}
#     Secret value
#
#   {{ now | date "2006-01-02 15:04:05" }}
#     Current timestamp
#
# ============================================================================
# Troubleshooting
# ============================================================================
#
# Agent not fetching secrets?
#   • Verify Machine Identity has read access to all paths
#   • Check client-id and client-secret files exist
#   • Ensure paths exist in Infisical: /shared, /worker-*
#
# .env files not updating?
#   • Check interval setting (default: 60 seconds)
#   • Verify volume mounts in docker-compose.infisical.yml
#   • Check agent logs: docker logs infisical-agent
#
# Permission denied errors?
#   • Ensure rendered output directory is writable
#   • Check Docker volume mount permissions
#
# ============================================================================
