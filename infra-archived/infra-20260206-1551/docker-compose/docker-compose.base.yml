# ============================================================================
# Project Nyra - Base Services
# ============================================================================
# Core shared services used across all environments
# Includes: PostgreSQL, Redis
#
# Usage:
#   docker compose -f docker-compose.base.yml up -d
# ============================================================================

version: '3.8'

networks:
  nyra-network:
    name: nyra-network
    external: true
  nyra-mcp:
    name: nyra-mcp
    external: true
  nyra-core:
    name: nyra-core
    external: true

volumes:
  postgres_data:
    name: nyra_postgres_data
    external: true
  redis_data:
    name: nyra_redis_data
    external: true

services:
  # ==========================================================================
  # PostgreSQL - Primary shared database
  # ==========================================================================
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nyra-postgres-v2
    restart: unless-stopped
    environment:
      # SECURITY: All passwords must be set via environment variables
      # DO NOT use default values in production
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-nyra_db}
      # Multiple databases for different services
      POSTGRES_MULTIPLE_DATABASES: ${LETTA_DB:-letta},${TWENTY_DB:-twenty},${DIFY_DB:-dify},${N8N_DB:-n8n},${LITELLM_DB:-litellm},${ACTIVEPIECES_DB:-activepieces}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../../scripts/postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - nyra-network
      - nyra-mcp
      - nyra-core
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G

  # ==========================================================================
  # Redis - Shared caching and session storage
  # ==========================================================================
  redis:
    image: redis:7-alpine
    container_name: nyra-redis-v2
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory ${REDIS_MAX_MEMORY:-2gb}
      --maxmemory-policy ${REDIS_EVICTION_POLICY:-allkeys-lru}
      --appendonly yes
      --appendfsync everysec
    environment:
      # SECURITY: REDIS_PASSWORD must be set in .env file
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6380}:6379"
    networks:
      - nyra-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G
