# ============================================================================
# Claude Flow Live Operations Dashboard
# ============================================================================
# Developer/Operations real-time monitoring dashboard
#
# Features:
#   - Agent status and lifecycle visualization
#   - Task execution flow (Kanban/Timeline)
#   - Message streams between agents
#   - Memory operations monitoring
#   - Live system topology with animated edges
#   - WebSocket-based event streaming
#
# Architecture:
#   - Frontend: React 18 + TypeScript + Zustand + Vite
#   - Build: Node.js with Vite bundler
#   - Deployment: Static Vite dev server
#   - Networking: Connects to event-server on port 3004
#
# Dependencies: claude-flow-event-server
# Usage:
#   docker compose -f docker-compose.event-server.yml -f docker-compose.claude-flow-dashboard.yml up -d
# ============================================================================

version: '3.8'

services:
  # ==========================================================================
  # Claude Flow Live Operations Dashboard - React UI
  # ==========================================================================
  claude-flow-dashboard:
    build:
      context: ../../apps/claude-flow-dashboard
      dockerfile: Dockerfile
    container_name: claude-flow-dashboard
    restart: unless-stopped
    ports:
      - "${CLAUDE_FLOW_DASHBOARD_PORT:-3003}:3003"
    environment:
      # Application Configuration
      - VITE_CLAUDE_FLOW_URL=${VITE_CLAUDE_FLOW_URL:-http://localhost:8080}
      - VITE_EVENT_SERVER_URL=${VITE_EVENT_SERVER_URL:-ws://claude-flow-event-server:3004}
      - VITE_EVENT_SERVER_HTTP_URL=${VITE_EVENT_SERVER_HTTP_URL:-http://claude-flow-event-server:3005}

      # Build Configuration
      - NODE_ENV=${NODE_ENV:-development}
      - VITE_API_BASE=${VITE_API_BASE:-/api}

      # Features
      - VITE_ENABLE_AGENT_MONITOR=${VITE_ENABLE_AGENT_MONITOR:-true}
      - VITE_ENABLE_TASK_TIMELINE=${VITE_ENABLE_TASK_TIMELINE:-true}
      - VITE_ENABLE_MEMORY_OPS=${VITE_ENABLE_MEMORY_OPS:-true}
      - VITE_ENABLE_TOPOLOGY=${VITE_ENABLE_TOPOLOGY:-true}
      - VITE_ENABLE_METRICS=${VITE_ENABLE_METRICS:-true}

      # Performance
      - VITE_WEBSOCKET_RECONNECT_INTERVAL=${VITE_WEBSOCKET_RECONNECT_INTERVAL:-3000}
      - VITE_MAX_BUFFER_SIZE=${VITE_MAX_BUFFER_SIZE:-10000}
    networks:
      - nyra-network
    depends_on:
      claude-flow-event-server:
        condition: service_healthy
    labels:
      - "nyra.service.name=claude-flow-dashboard"
      - "nyra.service.type=ui"
      - "nyra.service.tier=operations"
      - "nyra.ui.enabled=true"
      - "nyra.ui.port=3003"
      - "nyra.ui.audience=developers-operators"
      - "nyra.websocket.client=true"
      - "nyra.websocket.server=claude-flow-event-server:3004"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3003"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  # ==========================================================================
  # Development Server (for live reloading during dev)
  # ==========================================================================
  # Uncomment to enable Vite dev server with hot-reloading
  # claude-flow-dashboard-dev:
