version: '3.8'
services:
  metamcp:
    image: ruvnet/metamcp:latest
    ports:
      - "12008:12008"
    volumes:
      - ../nyra-mcp/channels:/config
      - ../nyra-mcp/metamcp-proxy.yml:/etc/metamcp/proxy.yml
    environment:
      - CHANNEL_CONFIG=/config/consolidated-channels.yml
      - PROXY_CONFIG=/etc/metamcp/proxy.yml
    networks:
      - nyra-network

networks:
  nyra-network:
    driver: bridge