# Optional overlay: internal Nyra services (quote-engine + campaign-engine)
# Start with:
#   docker compose -f docker-compose.yml -f docker-compose.services.yml up -d

services:
  quote_engine:
    build:
      context: ../services/quote-engine
    restart: unless-stopped
    ports:
      - "9010:9010"

  campaign_engine:
    build:
      context: ../services/campaign-engine
    restart: unless-stopped
    ports:
      - "9020:9020"
    volumes:
      - ../data/campaigns:/app/data/campaigns:ro

  quote_api:
    build:
      context: ../services/quote-api
    container_name: nyra_quote_api
    ports:
      - "8089:8080"
    restart: unless-stopped
