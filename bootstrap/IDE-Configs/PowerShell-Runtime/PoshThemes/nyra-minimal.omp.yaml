
final_space: true
version: 3
blocks:
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: path
        style: plain
        foreground: "#80FFEA"
        properties:
          style: unique
          folder_separator_icon: " "
          max_depth: 3
          max_width: 45
          mapped_locations:
            "C:/Users/edane/OneDrive/Documents/DevProjects": "📁Dev"
            "C:/Users/edane/Documents/DevProjects": "📁Dev"
            "C:/Dev/Repo": "💻Repo"
            "D:/Dev/Repo": "💾Repo"
            "C:/Users/edane/.config": "⚙️cfg"
        template: "{{ .Path }}"
  - type: rprompt
    segments:
      - type: git
        style: plain
        foreground: "#FF80BF"
        properties: 
          fetch_status: true
          fetch_upstream_icon: true
        template: "{{ .UpstreamIcon }}{{ .HEAD }}{{ if .BehindCount }} ↓{{ .BehindCount }}{{ end }}{{ if .AheadCount }} ↑{{ .AheadCount }}{{ end }}{{ if .Working.Changed }}  {{ .Working.String }}{{ end }}{{ if .Staging.Changed }}  {{ .Staging.String }}{{ end }}"
  - type: prompt
    alignment: left
    newline: true
    segments:
      - type: status
        style: plain
        foreground: "#FFCA80"
        properties: { always_enabled: true }
        template: "{{ if gt .Code 0 }}✖{{ else }}✓{{ end }}"
