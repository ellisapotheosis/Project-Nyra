# ═══════════════════════════════════════════════════════════════════════════
# Nyra Minimal Starship Configuration
# Fast, lightweight prompt for performance-critical environments
# ═══════════════════════════════════════════════════════════════════════════

"$schema" = 'https://starship.rs/config-schema.json'

add_newline = true
format = """
$directory\
$git_branch\
$git_status\
$python\
$line_break\
$character\
"""
right_format = "$cmd_duration"

[character]
success_symbol = "[>](bold green)"
error_symbol = "[>](bold red)"

[directory]
truncation_length = 3
style = "bold cyan"
format = "[$path]($style) "

[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "bold purple"

[python]
symbol = " "
format = "[${symbol}${version}]($style) "
style = "bold yellow"
detect_files = ["requirements.txt", "pyproject.toml", ".python-version", "uv.lock"]

[cmd_duration]
min_time = 1000
format = "[$duration]($style) "
style = "bold cyan"