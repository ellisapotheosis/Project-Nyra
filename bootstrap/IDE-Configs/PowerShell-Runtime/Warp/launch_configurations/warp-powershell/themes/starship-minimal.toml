# Starship Minimal Config for Warp Terminal
# Optimized for maximum speed - only essential modules enabled

# Disable command timeout to prevent slowdowns
command_timeout = 1000

# Minimal format string - only show what matters
format = """
$directory\
$git_branch\
$git_status\
$character"""

# Right format disabled for speed
right_format = ""

# Directory settings - fast and clean  
[directory]
truncation_length = 3
truncate_to_repo = true
format = "[$path]($style) "
style = "cyan bold"
disabled = false

# Git branch - only show branch name, no fancy icons
[git_branch]
format = "[$symbol$branch]($style) "
symbol = "git:"
style = "bright-purple bold"
disabled = false

# Git status - minimal indicators only
[git_status]
format = '([\[$all_status$ahead_behind\]]($style) )'
style = "red bold"
disabled = false
conflicted = "!"
ahead = "⇡"
behind = "⇣" 
diverged = "⇕"
up_to_date = ""
untracked = "?"
stashed = "$"
modified = "!"
staged = "+"
renamed = "»"
deleted = "✘"

# Character prompt - simple and fast
[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
disabled = false

