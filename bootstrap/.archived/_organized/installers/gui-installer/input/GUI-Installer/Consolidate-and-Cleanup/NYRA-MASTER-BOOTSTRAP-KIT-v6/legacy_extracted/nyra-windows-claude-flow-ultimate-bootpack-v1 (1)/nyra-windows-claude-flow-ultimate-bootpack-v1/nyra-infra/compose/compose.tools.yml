services:
  lobechat:
    image: lobehub/lobe-chat:latest
    container_name: nyra_lobechat
    ports: ["3210:3210"]
    networks: [nyra-network]

  dify:
    image: langgenius/dify:latest
    container_name: nyra_dify
    ports: ["8180:80"]
    networks: [nyra-network]

  casistack_orchestrator:
    image: ghcr.io/casistack/mcp-openwebui-orchestrator:latest
    container_name: nyra_casistack
    ports: ["3001:3001"]
    networks: [nyra-network]

networks:
  nyra-network:
    name: nyra-network
    external: true
