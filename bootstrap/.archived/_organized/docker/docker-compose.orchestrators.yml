services:
  langgraph-app:
    build: { context: ./services/orchestrators/langgraph-app }
    container_name: nyra-langgraph
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./services/orchestrators/langgraph-app:/app
    restart: unless-stopped

  ag2-runtime:
    build: { context: ./services/orchestrators/ag2-runtime }
    container_name: nyra-ag2
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    volumes:
      - ./services/orchestrators/ag2-runtime:/app
    restart: unless-stopped

  praisonai:
    image: ghcr.io/mervinpraison/praisonai:latest
    container_name: nyra-praisonai
    volumes:
      - ./services/orchestrators/praisonai:/app/config
    restart: unless-stopped
