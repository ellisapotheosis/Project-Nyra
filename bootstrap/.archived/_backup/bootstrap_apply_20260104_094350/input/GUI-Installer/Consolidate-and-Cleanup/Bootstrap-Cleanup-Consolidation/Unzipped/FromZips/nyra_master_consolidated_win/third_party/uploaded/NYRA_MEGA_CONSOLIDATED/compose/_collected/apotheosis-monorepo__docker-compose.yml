version: "3.9"
services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["./data/qdrant:/qdrant/storage"]

  neo4j:
    image: neo4j:5
    environment:
      NEO4J_AUTH: "neo4j/password"
      NEO4J_db_memory_heap_max__size: 2G
    ports: ["7474:7474", "7687:7687"]
    volumes:
      - ./data/neo4j:/data

  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6379:6379"]
    volumes: ["./data/falkordb:/data"]

  # Graphiti MCP server (run from repo or image if available)
  graphiti-mcp:
    image: ghcr.io/getzep/graphiti-mcp:latest
    # If the above image doesn't exist in your env, run from source: see services/mcp/graphiti/README.md
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      # Choose ONE backend:
      # Neo4j
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # FalkorDB (via Redis protocol) — enable when supported in your build
      # FALKORDB_URI: redis://falkordb:6379
      # Configure vector store if desired (Qdrant via HTTP)
      QDRANT_URL: http://qdrant:6333
    depends_on: [qdrant, neo4j]
    ports: ["8001:8001"]

  letta:
    image: ghcr.io/letta-ai/letta:latest
    environment:
      LETTA_PASSWORD: ${LETTA_PASSWORD:-change-me}
    ports: ["7777:7777"]

  qdrant-mcp:
    image: ghcr.io/qdrant/mcp-server-qdrant:latest
    environment:
      QDRANT_URL: http://qdrant:6333
      COLLECTION_NAME: global_mem
      EMBEDDING_MODEL: sentence-transformers/all-MiniLM-L6-v2
      FASTMCP_HOST: 0.0.0.0
      FASTMCP_PORT: 8000
    depends_on: [qdrant]
    ports: ["18000:8000"]

  mem0-openmemory:
    image: mem0ai/openmemory:latest
    # If image not found, run via run.sh under services/mcp/mem0-openmemory
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    ports: ["18765:3000", "18766:8765"]

  falkordb-mcp:
    image: node:20-alpine
    working_dir: /srv
    command: sh -c "npx -y github:falkordb/FalkorDB-MCPServer"
    environment:
      FALKORDB_HOST: falkordb
      FALKORDB_PORT: 6379
    depends_on: [falkordb]
    ports: ["18030:3000"]

  anemoi-a2a:
    image: ghcr.io/coral-protocol/anemoi-a2a:latest
    environment:
      A2A_PORT: 8080
    ports: ["18020:8080"]


orchestrator:
  build:
    context: ../apps/langgraph-orchestrator
  env_file: ["../.env"]
  ports: ["8088:8088"]
  depends_on: [graphiti-mcp, qdrant, mem0-openmemory, letta]

memory-broker:
  build:
    context: ../services/memory-broker
  env_file: ["../.env"]
  ports: ["8099:8099"]
  depends_on: [graphiti-mcp, qdrant, mem0-openmemory, letta]
