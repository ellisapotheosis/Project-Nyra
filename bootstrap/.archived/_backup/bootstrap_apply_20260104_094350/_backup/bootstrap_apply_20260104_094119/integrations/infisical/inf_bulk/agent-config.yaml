infisical:
  address: "https://app.infisical.com"
auth:
  type: "universal-auth"
  config:
    client-id: "./secrets/infisical-client-id"
    client-secret: "./secrets/infisical-client-secret"
    remove_client_secret_on_read: false

# Optional: stores an access token for debugging/troubleshooting
sinks:
  - type: "file"
    config:
      path: "./.infisical/agent-access-token"

templates:
  - source-path: "./templates/nyra.env.tmpl"
    destination-path: "./.env.infisical"
    config:
      polling-interval: 60s
      # Optional: run a command after re-render. Keep it simple on Windows.
      # execute:
      #   timeout: 30
      #   command: "powershell -NoProfile -ExecutionPolicy Bypass -File ./scripts/on-secrets-changed.ps1"
