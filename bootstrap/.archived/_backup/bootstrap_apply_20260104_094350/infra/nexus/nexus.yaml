# Nexus Router config (Nyra)
# NOTE: Treat this as a starting point; confirm against Nexus Router docs.

http:
  port: 7000

auth:
  jwt_secret: ${NEXUS_JWT_SECRET}
  admin_token: ${NEXUS_ADMIN_TOKEN}

llm:
  providers:
    - name: litellm
      type: openai_compatible
      base_url: http://litellm:4000
      api_key: ${LITELLM_MASTER_KEY}

mcp:
  servers:
    - name: activepieces
      url: http://activepieces:80/mcp
      auth:
        type: bearer
        token: ${ACTIVEPIECES_API_KEY}

    - name: graphiti
      url: http://graphiti_mcp:9100

    - name: mem0
      url: http://mem0_mcp:8081

    - name: filesystem
      url: http://mcp_filesystem:8080
    - name: github
      url: http://mcp_github:8080
    - name: dockerhub
      url: http://mcp_dockerhub:8080

policies:
  - name: borrower_minimal_tools
    allow_tools:
      - graphiti.*
      - mem0.*
      - activepieces.send_message
      - activepieces.create_task
    deny_tools:
      - filesystem.*
      - github.*
      - dockerhub.*
  - name: internal_ops_full_tools
    allow_tools:
      - "*"
