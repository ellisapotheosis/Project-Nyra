version: '3.8'

# =============================================================================
# WORKER-3090 - RTX 3090 Ti 24GB VRAM - Tier 2 General Purpose
# =============================================================================
# Llama 3.1 70B, Mistral Large 123B
# Role: Quote generation, document processing, general mortgage queries
# =============================================================================

services:
  # ========================
  # OLLAMA - LLM Inference Server
  # ========================
  ollama:
    image: ollama/ollama:latest
    container_name: worker-3090-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - OLLAMA_HOST=${OLLAMA_HOST:-0.0.0.0:11434}
      - OLLAMA_MODELS=${OLLAMA_MODELS:-/models}
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
      - CUDA_VISIBLE_DEVICES=${CUDA_VISIBLE_DEVICES:-0}
      - PYTORCH_CUDA_ALLOC_CONF=${PYTORCH_CUDA_ALLOC_CONF}
    volumes:
      - ollama-models:/root/.ollama
      - ollama-logs:/var/log/ollama
    networks:
      - worker-network
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ========================
  # MODEL MANAGER - Auto-load Models
  # ========================
  model-manager:
    image: curlimages/curl:latest
    container_name: worker-3090-model-manager
    restart: "no"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - worker-network
    command: >
      sh -c "
      echo 'Pulling Llama 3.1 70B (quantized)...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_PRIMARY_MODEL}\"}' &&
      echo 'Pulling Mistral Large 123B (quantized)...' &&
      curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"${OLLAMA_FALLBACK_MODEL}\"}' &&
      echo 'Models loaded successfully'
      "

  # ========================
  # PROMETHEUS NODE EXPORTER
  # ========================
  node-exporter:
    image: prom/node-exporter:latest
    container_name: worker-3090-node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    networks:
      - worker-network
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  # ========================
  # NVIDIA DCGM EXPORTER (GPU Metrics)
  # ========================
  dcgm-exporter:
    image: nvcr.io/nvidia/k8s/dcgm-exporter:latest
    container_name: worker-3090-dcgm-exporter
    restart: unless-stopped
    ports:
      - "9400:9400"
    networks:
      - worker-network
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    cap_add:
      - SYS_ADMIN

  # ========================
  # HEALTH REPORTER
  # ========================
  health-reporter:
    image: curlimages/curl:latest
    container_name: worker-3090-health-reporter
    restart: unless-stopped
    depends_on:
      - ollama
    networks:
      - worker-network
    command: >
      sh -c "
      while true; do
        echo 'Reporting health to orchestrator...'
        curl -X POST http://orchestrator-mini.tail-net.ts.net:6100/api/worker/health \
          -H 'Content-Type: application/json' \
          -H 'Authorization: Bearer ${ORCHESTRATOR_API_KEY}' \
          -d '{
            \"worker_id\": \"${WORKER_ID}\",
            \"status\": \"healthy\",
            \"tier\": ${WORKER_TIER},
            \"gpu_type\": \"${GPU_TYPE}\",
            \"vram_gb\": ${GPU_VRAM_GB},
            \"models\": [\"${OLLAMA_PRIMARY_MODEL}\", \"${OLLAMA_FALLBACK_MODEL}\"],
            \"max_concurrent\": ${MAX_CONCURRENT_REQUESTS},
            \"url\": \"http://${TAILSCALE_HOSTNAME}:11434\"
          }' || echo 'Health report failed'
        sleep ${HEALTH_CHECK_INTERVAL:-30}
      done
      "
    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M

networks:
  worker-network:
    name: worker-3090-network
    driver: bridge

volumes:
  ollama-models:
    name: worker-3090-ollama-models
  ollama-logs:
    name: worker-3090-ollama-logs
