# Nexus config: unified endpoint for MCP + LLM routing
[server]
address = "0.0.0.0:6000"

# Enable MCP gateway
[mcp]
enabled = true
path = "/mcp"

# Downstream MCP servers (HTTP)
[mcp.servers.openmemory]
url = "http://openmemory_mcp:8081/mcp"

# (Optional) Add more MCP servers here:
# - Twenty MCP server (if you decide to run one)
# - Serena MCP
# - Archon OS MCP
# - Calendars, email, telephony, etc.

# Enable LLM gateway
[llm]
enabled = true

# Expose OpenAI-compatible endpoint at /llm/openai/v1
[llm.protocols.openai]
enabled = true
path = "/llm/openai/v1"

# Expose Anthropic endpoint at /llm/anthropic (useful for Claude Code)
[llm.protocols.anthropic]
enabled = true
path = "/llm/anthropic"

# Providers
[llm.providers.anthropic]
api_key = "{{ env.ANTHROPIC_API_KEY }}"

# Route OpenRouter through LiteLLM (so you get a single OpenAI-compatible endpoint)
[llm.providers.openai_via_litellm]
base_url = "http://litellm:4000/v1"
api_key = "dummy"


# Graph memory (Graphiti MCP) — enable when docker-compose.graphiti.yml is up
[mcp.servers.graphiti]
url = "http://graphiti_mcp:8000/mcp/"
