server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Docker container logs
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
    relabel_configs:
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: 'container'
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: 'stream'
      - source_labels: ['__meta_docker_container_label_com_docker_compose_service']
        target_label: 'service'
    pipeline_stages:
      - docker: {}
      - json:
          expressions:
            level: level
            timestamp: timestamp
            message: message
      - labels:
          level:
          service:

  # Campaign Engine logs
  - job_name: campaign-engine
    static_configs:
      - targets:
          - localhost
        labels:
          job: campaign-engine
          __path__: /var/log/campaign-engine/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            campaign_id: campaign_id
            message: msg
      - labels:
          level:
          campaign_id:

  # Quote Engine logs
  - job_name: quote-engine
    static_configs:
      - targets:
          - localhost
        labels:
          job: quote-engine
          __path__: /var/log/quote-engine/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            quote_id: quote_id
            message: msg
      - labels:
          level:
          quote_id:

  # Nyra Orchestrator logs
  - job_name: nyra-orchestrator
    static_configs:
      - targets:
          - localhost
        labels:
          job: nyra-orchestrator
          __path__: /var/log/nyra-orchestrator/*.log
    pipeline_stages:
      - json:
          expressions:
            level: level
            workflow_id: workflow_id
            message: msg
      - labels:
          level:
          workflow_id:

  # System logs
  - job_name: system
    static_configs:
      - targets:
          - localhost
        labels:
          job: system
          __path__: /var/log/syslog
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\S+\s+\d+\s+\S+)\s+(?P<hostname>\S+)\s+(?P<service>\S+?)(\[(?P<pid>\d+)\])?:\s+(?P<message>.*)$'
      - labels:
          service:
          hostname:
