# ==============================================================================
# Cloudflared Tunnel Configuration - Orchestrator-Mini
# ==============================================================================
# This config defines ingress rules for the orchestrator-mini PC
#
# Services exposed:
#   - Grafana (monitoring dashboards): 3003
#   - Prometheus (metrics): 9090
#   - Infisical (secrets management): 8080
#   - Nexus (API gateway): 6000
#   - PostgreSQL (database): 5432 (via bastion/SSH pattern)
#
# Note: When using TUNNEL_TOKEN environment variable, this config is optional.
#       Token-based tunnels get their config from Cloudflare Zero Trust dashboard.
# ==============================================================================

# Tunnel credentials (when not using token)
# tunnel: <tunnel-id>
# credentials-file: /etc/cloudflared/credentials.json

# Ingress rules - Define how external traffic routes to internal services
ingress:
  # Grafana - Monitoring Dashboard
  - hostname: grafana.nyra.your-domain.com
    service: http://nyra-grafana:3000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Prometheus - Metrics Collection
  - hostname: prometheus.nyra.your-domain.com
    service: http://nyra-prometheus:9090
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Infisical - Secrets Management
  - hostname: infisical.nyra.your-domain.com
    service: http://nyra-infisical:8080
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Nexus - API Gateway
  - hostname: nexus.nyra.your-domain.com
    service: http://nyra-nexus:6000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # PostgreSQL - Database (via SSH/bastion pattern)
  # Requires SSH tunnel setup on client side
  - hostname: postgres-bastion.nyra.your-domain.com
    service: bastion
    originRequest:
      bastionMode: true

  # Catch-all rule (required)
  - service: http_status:404

# Logging
loglevel: info
transport-loglevel: warn

# Metrics
metrics: 0.0.0.0:9126

# Origin configuration
originRequest:
  # Connection settings
  connectTimeout: 30s
  tcpKeepAlive: 30s
  keepAliveTimeout: 90s
  keepAliveConnections: 100

  # TLS settings
  noTLSVerify: false
  disableChunkedEncoding: false

  # Bastion mode settings (for PostgreSQL access)
  bastionMode: false

# Autoupdate (disabled, managed by Docker)
no-autoupdate: true

# Grace period for shutdown
grace-period: 30s
