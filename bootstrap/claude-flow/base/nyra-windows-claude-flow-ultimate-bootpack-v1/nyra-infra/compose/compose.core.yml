services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    container_name: nyra_metamcp
    ports: ["12008:12008"]
    volumes:
      - ./mcp/metamcp.config.json:/app/config.json:ro
    environment:
      - PORT=12008
    networks: [nyra-network]

  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nyra_litellm
    ports: ["4000:4000"]
    volumes:
      - ./router/litellm.config.yaml:/config/config.yaml:ro
    environment:
      - LITELLM_CONFIG=/config/config.yaml
    networks: [nyra-network]

  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra_openwebui
    ports: ["3000:8080"]
    environment:
      - ENABLE_MCP=true
    networks: [nyra-network]

networks:
  nyra-network:
    name: nyra-network
    external: true
