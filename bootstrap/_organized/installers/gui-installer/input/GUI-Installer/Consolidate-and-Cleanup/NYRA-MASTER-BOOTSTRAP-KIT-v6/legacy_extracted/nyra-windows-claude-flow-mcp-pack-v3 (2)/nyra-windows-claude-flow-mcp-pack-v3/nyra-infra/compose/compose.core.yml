services:
  metamcp:
    image: ghcr.io/metatool-ai/metamcp:latest
    ports: ["12008:12008"]
    volumes:
      - ./mcp/metamcp.config.json:/app/config.json:ro
    networks: [nyra-network]
  openwebui:
    image: ghcr.io/open-webui/open-webui:main
    ports: ["3000:8080"]
    environment:
      - ENABLE_MCP=true
    networks: [nyra-network]
networks:
  nyra-network:
    name: nyra-network
    external: true
