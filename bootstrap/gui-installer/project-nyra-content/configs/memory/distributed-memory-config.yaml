# NYRA Distributed Memory Configuration
# Configuration for distributed knowledge graph, session management, learning systems, and storage

# =============================================================================
# DISTRIBUTED KNOWLEDGE GRAPH CONFIGURATION
# =============================================================================
knowledge_graph:
  # Node configuration
  node_id: "${NODE_ID:orchestrator}"
  node_type: "${NODE_TYPE:orchestrator}" # orchestrator, worker1, worker2, worker3, cloud

  # Embedding model configuration
  embedding:
    provider: "huggingface" # huggingface, openai, local
    model: "sentence-transformers/all-MiniLM-L6-v2"
    dimensions: 384
    batch_size: 32
    cache_size: 10000
    distributed:
      enabled: true
      load_balancing: "round_robin" # round_robin, weighted, least_connections
      workers:
        - id: "worker1"
          endpoint: "${WORKER1_ENDPOINT:http://worker1:8080}"
          weight: 1.0
          gpu: "RTX_3060"
        - id: "worker2"
          endpoint: "${WORKER2_ENDPOINT:http://worker2:8080}"
          weight: 3.0
          gpu: "RTX_5090"
        - id: "worker3"
          endpoint: "${WORKER3_ENDPOINT:http://worker3:8080}"
          weight: 2.0
          gpu: "RTX_3090Ti"

  # Vector database configuration
  vector_db:
    type: "postgresql_pgvector" # postgresql_pgvector, weaviate, pinecone, milvus
    connection:
      host: "${POSTGRES_HOST:localhost}"
      port: "${POSTGRES_PORT:5432}"
      database: "${POSTGRES_DB:nyra_memory}"
      username: "${POSTGRES_USER:nyra_app}"
      password: "${POSTGRES_PASSWORD}"
      ssl_mode: "require"
      pool_size: 20

    # Index configuration
    index:
      type: "ivfflat" # ivfflat, hnsw
      lists: 100
      probes: 10
      ef_construction: 200
      ef_search: 100
      distance_metric: "cosine" # cosine, l2, inner_product

    # Partitioning strategy
    partitioning:
      enabled: true
      strategy: "hash" # hash, range, semantic
      partitions: 4
      replication_factor: 2

  # Synchronization configuration
  synchronization:
    enabled: true
    protocol: "crdt" # crdt, raft, gossip
    consistency: "eventual" # strong, eventual, causal
    conflict_resolution: "vector_clock" # last_write_wins, vector_clock, semantic_merge
    sync_interval: 30 # seconds
    batch_size: 100

    # Peer discovery
    peers:
      discovery: "static" # static, dns, consul
      nodes:
        - id: "orchestrator"
          endpoint: "${ORCHESTRATOR_ENDPOINT:http://orchestrator:8080}"
        - id: "worker1"
          endpoint: "${WORKER1_ENDPOINT:http://worker1:8080}"
        - id: "worker2"
          endpoint: "${WORKER2_ENDPOINT:http://worker2:8080}"
        - id: "worker3"
          endpoint: "${WORKER3_ENDPOINT:http://worker3:8080}"

# =============================================================================
# SESSION MANAGEMENT CONFIGURATION
# =============================================================================
session_management:
  # Cross-device persistence
  persistence:
    storage_type: "postgresql" # postgresql, mongodb, redis_cluster
    connection:
      host: "${POSTGRES_HOST:localhost}"
      port: "${POSTGRES_PORT:5432}"
      database: "${POSTGRES_DB:nyra_memory}"
      username: "${POSTGRES_USER:nyra_app}"
      password: "${POSTGRES_PASSWORD}"

    # Session storage strategy
    strategy:
      primary_storage: "orchestrator"
      backup_storage: ["worker1", "worker2"]
      replication_factor: 2
      consistency: "eventual"
      ttl: 86400 # 24 hours

  # Context management
  context:
    max_conversation_length: 1000
    context_window: 100
    importance_threshold: 0.5
    smart_truncation: true
    semantic_chunking: true

    # Context sharing configuration
    sharing:
      enabled: true
      cross_device: true
      cross_session: false
      encryption: true
      compression: true

  # User preferences
  preferences:
    adaptive: true
    learning_rate: 0.1
    personalization_weight: 0.3
    privacy_levels:
      - "public"
      - "shared"
      - "private"
      - "encrypted"

# =============================================================================
# ADAPTIVE LEARNING CONFIGURATION
# =============================================================================
learning_systems:
  # Learning engine configuration
  engine:
    enabled: true
    learning_rate: 0.01
    adaptation_threshold: 0.7
    pattern_detection: true
    anomaly_detection: true

    # Model configurations
    models:
      performance_predictor:
        type: "neural_network"
        architecture: [64, 32, 16, 8]
        activation: "relu"
        optimizer: "adam"
        learning_rate: 0.001

      anomaly_detector:
        type: "isolation_forest"
        contamination: 0.1
        n_estimators: 100

      pattern_recognizer:
        type: "lstm"
        sequence_length: 50
        hidden_units: 128
        layers: 2

  # Feedback loops
  feedback:
    enabled: true
    collection_interval: 60 # seconds
    analysis_interval: 300 # seconds
    adaptation_interval: 900 # seconds

    # Feedback sources
    sources:
      - "user_interactions"
      - "system_performance"
      - "error_rates"
      - "response_times"
      - "cache_hit_rates"

  # Knowledge evolution
  evolution:
    enabled: true
    confidence_threshold: 0.8
    evidence_requirements: 3
    review_threshold: 0.5
    auto_apply: true

    # Evolution strategies
    strategies:
      - "incremental_refinement"
      - "concept_expansion"
      - "relationship_discovery"
      - "contradiction_resolution"

# =============================================================================
# DISTRIBUTED STORAGE CONFIGURATION
# =============================================================================
storage:
  # Node configuration
  nodes:
    orchestrator:
      type: "orchestrator"
      capabilities:
        storage: 1TB
        memory: 16GB
        cpu_cores: 16
        network_bandwidth: 1Gbps
      location:
        region: "local"
        zone: "primary"

    worker1:
      type: "worker"
      capabilities:
        storage: 2TB
        memory: 32GB
        cpu_cores: 12
        gpu: "RTX_3060"
        network_bandwidth: 1Gbps
      location:
        region: "local"
        zone: "worker"

    worker2:
      type: "worker"
      capabilities:
        storage: 4TB
        memory: 64GB
        cpu_cores: 24
        gpu: "RTX_5090"
        network_bandwidth: 1Gbps
      location:
        region: "local"
        zone: "worker"

    worker3:
      type: "worker"
      capabilities:
        storage: 2TB
        memory: 32GB
        cpu_cores: 16
        gpu: "RTX_3090Ti"
        network_bandwidth: 1Gbps
      location:
        region: "local"
        zone: "worker"

    cloud:
      type: "cloud"
      capabilities:
        storage: "unlimited"
        memory: "scalable"
        cpu_cores: "scalable"
        network_bandwidth: "scalable"
      location:
        region: "cloud"
        zone: "koyeb"

  # Partitioning strategy
  partitioning:
    strategy: "consistent_hashing" # consistent_hashing, range, semantic
    replication_factor: 2
    consistency_level: "eventual" # strong, eventual, bounded_staleness

    # Data types and placement
    placement_rules:
      knowledge_graph:
        primary: ["orchestrator", "worker2"]
        replicas: ["worker1", "worker3"]
        consistency: "eventual"

      session_data:
        primary: ["orchestrator"]
        replicas: ["worker1", "worker2"]
        consistency: "strong"

      learning_models:
        primary: ["worker2", "worker3"] # GPU nodes
        replicas: ["orchestrator"]
        consistency: "eventual"

      cache_data:
        primary: ["orchestrator", "worker1"]
        replicas: ["worker2"]
        consistency: "weak"

  # Caching configuration
  caching:
    enabled: true
    strategies:
      hot_data:
        algorithm: "adaptive_lru"
        max_size: 1GB
        ttl: 3600 # 1 hour
        prefetch: true

      session_cache:
        algorithm: "lru"
        max_size: 512MB
        ttl: 1800 # 30 minutes
        prefetch: false

      model_cache:
        algorithm: "lfu"
        max_size: 2GB
        ttl: 7200 # 2 hours
        prefetch: true

    # Prefetching configuration
    prefetching:
      enabled: true
      strategies:
        - "sequential"
        - "associative"
        - "ml_prediction"
      confidence_threshold: 0.7
      max_bandwidth: 50MB # per second

  # Backup and recovery
  backup:
    enabled: true
    strategy: "incremental" # full, incremental, differential
    frequency: 3600 # 1 hour
    retention:
      daily: 7
      weekly: 4
      monthly: 12
    destinations:
      - type: "local"
        path: "/backup/nyra"
      - type: "cloud"
        provider: "koyeb"
        bucket: "${BACKUP_BUCKET:nyra-backups}"

# =============================================================================
# PERFORMANCE MONITORING CONFIGURATION
# =============================================================================
monitoring:
  # Metrics collection
  metrics:
    enabled: true
    collection_interval: 10 # seconds
    retention_days: 30

    # Metric categories
    categories:
      - "system_resources"
      - "application_performance"
      - "storage_metrics"
      - "network_metrics"
      - "cache_metrics"
      - "learning_metrics"

  # Alerting configuration
  alerting:
    enabled: true
    check_interval: 15 # seconds

    # Alert thresholds
    thresholds:
      cpu_utilization:
        warning: 70
        critical: 90
        duration: 300 # 5 minutes

      memory_utilization:
        warning: 80
        critical: 95
        duration: 180 # 3 minutes

      disk_utilization:
        warning: 80
        critical: 90
        duration: 600 # 10 minutes

      response_time:
        warning: 2000 # 2 seconds
        critical: 5000 # 5 seconds
        duration: 120 # 2 minutes

      error_rate:
        warning: 2 # 2%
        critical: 5 # 5%
        duration: 300 # 5 minutes

    # Notification channels
    notifications:
      - type: "webhook"
        url: "${ALERT_WEBHOOK_URL}"
        severity: ["critical", "warning"]

      - type: "email"
        recipients: "${ALERT_EMAIL_RECIPIENTS}"
        severity: ["critical"]

  # Health checks
  health_checks:
    enabled: true
    interval: 30 # seconds
    timeout: 10 # seconds

    # Health check endpoints
    endpoints:
      - name: "knowledge_graph"
        url: "/health/knowledge-graph"
        critical: true

      - name: "session_manager"
        url: "/health/session-manager"
        critical: true

      - name: "learning_engine"
        url: "/health/learning-engine"
        critical: false

      - name: "storage_system"
        url: "/health/storage"
        critical: true

# =============================================================================
# SECURITY CONFIGURATION
# =============================================================================
security:
  # Encryption configuration
  encryption:
    at_rest:
      enabled: true
      algorithm: "AES-256-GCM"
      key_rotation: 30 # days

    in_transit:
      enabled: true
      tls_version: "1.3"
      cipher_suites: ["TLS_AES_256_GCM_SHA384"]

    # Key management
    key_management:
      provider: "infisical" # infisical, vault, aws_kms
      endpoint: "${KEY_MANAGEMENT_ENDPOINT}"
      auto_rotation: true

  # Access control
  access_control:
    rbac:
      enabled: true
      default_role: "user"
      roles:
        - name: "admin"
          permissions: ["read", "write", "delete", "admin"]
        - name: "operator"
          permissions: ["read", "write"]
        - name: "user"
          permissions: ["read"]
        - name: "agent"
          permissions: ["read", "write"]

  # Audit logging
  audit:
    enabled: true
    log_level: "INFO"
    retention_days: 90
    include_payloads: false
    destinations:
      - type: "database"
        table: "audit_log"
      - type: "file"
        path: "/logs/audit.log"

# =============================================================================
# NETWORK CONFIGURATION
# =============================================================================
network:
  # Communication protocols
  protocols:
    primary: "http" # http, grpc, websocket
    fallback: "grpc"

  # Load balancing
  load_balancing:
    algorithm: "weighted_round_robin" # round_robin, weighted_round_robin, least_connections
    health_check: true
    session_affinity: false

  # Cloudflared tunnel configuration
  cloudflared:
    enabled: true
    tunnels:
      orchestrator:
        name: "nyra-orchestrator"
        url: "${ORCHESTRATOR_TUNNEL_URL}"

      worker1:
        name: "nyra-worker1"
        url: "${WORKER1_TUNNEL_URL}"

      worker2:
        name: "nyra-worker2"
        url: "${WORKER2_TUNNEL_URL}"

      worker3:
        name: "nyra-worker3"
        url: "${WORKER3_TUNNEL_URL}"

  # Wake-on-LAN configuration
  wake_on_lan:
    enabled: true
    magic_packet_port: 9
    nodes:
      worker1:
        mac_address: "${WORKER1_MAC}"
        ip_address: "${WORKER1_IP}"

      worker2:
        mac_address: "${WORKER2_MAC}"
        ip_address: "${WORKER2_IP}"

      worker3:
        mac_address: "${WORKER3_MAC}"
        ip_address: "${WORKER3_IP}"

  # Connection pooling
  connection_pooling:
    enabled: true
    max_connections_per_node: 100
    connection_timeout: 30 # seconds
    idle_timeout: 300 # seconds
    keepalive: true

# =============================================================================
# RAG SYSTEM CONFIGURATION
# =============================================================================
rag:
  # Document processing
  document_processing:
    chunking:
      strategy: "semantic" # sentence, paragraph, semantic, hybrid
      max_chunk_size: 512 # tokens
      overlap: 50 # tokens

    # Embedding generation
    embedding:
      model: "sentence-transformers/all-MiniLM-L6-v2"
      batch_size: 32
      normalize: true

  # Retrieval configuration
  retrieval:
    default_strategy: "hybrid" # dense, sparse, hybrid, multi_hop
    top_k: 10
    similarity_threshold: 0.7
    reranking: true
    diversity_weight: 0.3

    # Dense retrieval
    dense:
      index_type: "ivfflat"
      nprobe: 10

    # Sparse retrieval
    sparse:
      algorithm: "bm25"
      k1: 1.2
      b: 0.75

  # Generation configuration
  generation:
    model: "gpt-3.5-turbo" # gpt-3.5-turbo, gpt-4, claude-3, local
    max_tokens: 1000
    temperature: 0.7
    top_p: 0.9
    citations: true
    fact_checking: true

  # Evaluation
  evaluation:
    enabled: true
    metrics:
      - "relevance"
      - "faithfulness"
      - "answer_relevancy"
      - "context_precision"
      - "context_recall"
    automatic_evaluation: true
    human_feedback: true

# =============================================================================
# DEVELOPMENT AND DEBUGGING
# =============================================================================
development:
  # Logging configuration
  logging:
    level: "${LOG_LEVEL:INFO}" # DEBUG, INFO, WARN, ERROR
    format: "json" # json, text
    destinations:
      - type: "console"
        enabled: true
      - type: "file"
        enabled: true
        path: "/logs/nyra.log"
        rotation: "daily"
      - type: "elasticsearch"
        enabled: false
        endpoint: "${ELASTICSEARCH_ENDPOINT}"

  # Debug features
  debug:
    enabled: "${DEBUG_ENABLED:false}"
    metrics_endpoint: "/debug/metrics"
    pprof_endpoint: "/debug/pprof"
    memory_profiling: true

  # Testing configuration
  testing:
    test_data_path: "/data/test"
    synthetic_data: true
    load_testing: false

# =============================================================================
# ENVIRONMENT-SPECIFIC OVERRIDES
# =============================================================================
environments:
  development:
    logging:
      level: "DEBUG"
    debug:
      enabled: true
    monitoring:
      metrics:
        collection_interval: 5

  staging:
    storage:
      backup:
        frequency: 7200 # 2 hours
    monitoring:
      alerting:
        enabled: true

  production:
    security:
      audit:
        include_payloads: false
    storage:
      backup:
        frequency: 1800 # 30 minutes
    monitoring:
      alerting:
        enabled: true
        notifications:
          - type: "pagerduty"
            api_key: "${PAGERDUTY_API_KEY}"