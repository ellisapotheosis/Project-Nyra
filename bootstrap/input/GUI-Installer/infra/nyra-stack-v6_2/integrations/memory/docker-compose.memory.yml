version: "3.9"

x-health: &default-health
  interval: 5s
  timeout: 3s
  retries: 20
  start_period: 10s

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__GRPC_PORT: ${QDRANT_GRPC_PORT}
      QDRANT__SERVICE__HTTP_PORT: ${QDRANT_PORT}
    ports:
      - "${QDRANT_PORT}:6333"
      - "${QDRANT_GRPC_PORT}:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:6333/healthz"]
      <<: *default-health
    profiles: ["memory"]

  neo4j:
    image: neo4j:5-community
    container_name: neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=${NEO4J_AUTH_USER}/${NEO4J_AUTH_PASSWORD}
      - NEO4J_dbms_memory_heap_initial__size=512m
      - NEO4J_dbms_memory_heap_max__size=2048m
      - NEO4J_server_default_listen_address=0.0.0.0
    ports:
      - "${NEO4J_HTTP_PORT}:7474"
      - "${NEO4J_BOLT_PORT}:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:7474 || exit 1"]
      <<: *default-health
    profiles: ["memory"]

  adminer:
    image: adminer:latest
    container_name: adminer
    restart: unless-stopped
    ports:
      - "${ADMINER_PORT}:8080"
    healthcheck:
      test: ["CMD-SHELL","wget -qO- http://localhost:8080 || exit 1"]
      <<: *default-health
    profiles: ["memory"]

volumes:
  qdrant_data:
  neo4j_data:
  neo4j_logs:
