services:
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  neo4j:
    image: neo4j:5
    ports: ["7474:7474","7687:7687"]
    environment:
      - NEO4J_AUTH=neo4j/please-change-me
    volumes:
      - neo4j_data:/data
    restart: unless-stopped

  # Optional: FalkorDB (RedisGraph successor)
  falkordb:
    image: falkordb/falkordb:latest
    ports: ["6378:6379"]
    restart: unless-stopped

volumes:
  qdrant_data:
  neo4j_data:
