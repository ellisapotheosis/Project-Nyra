version: '3.8'

# Worker RTX 5090 - High-Performance Development Laptop
# Role: Large model inference, neural training, heavy compute tasks
# Hardware: RTX 5090 24GB, 64GB RAM, High-end mobile workstation
# Services: Claude Flow Worker, MCP Servers, Large LLM Inference, Training

networks:
  nyra-network:
    external: true
    name: nyra-network

volumes:
  # Claude Flow & MCP
  claude-flow-worker-data:
    driver: local
  claude-flow-worker-cache:
    driver: local
  claude-flow-worker-logs:
    driver: local

  # LLM Inference & Training
  ollama-models:
    driver: local
  vllm-models:
    driver: local
  llama-cpp-models:
    driver: local

  # Image Generation
  automatic1111-data:
    driver: local
  automatic1111-models:
    driver: local
  comfyui-data:
    driver: local
  comfyui-models:
    driver: local
  swarmui-data:
    driver: local
  swarmui-models:
    driver: local

  # Development
  jupyter-data:
    driver: local

  # Cache
  redis-worker-data:
    driver: local

services:
  # ===================================================================
  # CORE CLAUDE FLOW WORKER
  # ===================================================================

  claude-flow-worker:
    image: ghcr.io/ruv-inc/claude-flow:alpha
    container_name: worker-claude-flow-rtx5090
    hostname: worker-rtx5090
    restart: unless-stopped
    ports:
      - "3012:3010"    # Claude Flow API
      - "8005:8003"    # MCP Server
    environment:
      # Mode Configuration
      - CLAUDE_FLOW_MODE=worker
      - CLAUDE_FLOW_VERSION=3.0.0
      - ORCHESTRATOR_URL=http://172.20.0.10:3010

      # Swarm Configuration
      - SWARM_TOPOLOGY=hierarchical-mesh
      - SWARM_MAX_AGENTS=15
      - SWARM_STRATEGY=specialized
      - SWARM_CONSENSUS=raft
      - SWARM_ROLE=worker

      # Memory Configuration
      - MEMORY_BACKEND=hybrid
      - MEMORY_PATH=/app/data/memory
      - AGENTDB_URL=http://172.20.0.12:8080
      - RUVECTOR_URL=http://172.20.0.13:8888
      - REASONINGBANK_ENABLED=true

      # Hooks & Intelligence
      - HOOKS_ENABLED=true
      - HOOKS_PRE_TASK=true
      - HOOKS_POST_TASK=true
      - HOOKS_INTELLIGENCE=true
      - NEURAL_ENABLED=true
      - SONA_ENABLED=true
      - MOE_ENABLED=true
      - FLASH_ATTENTION=true

      # GPU Configuration (RTX 5090 - High-end)
      - GPU_ENABLED=true
      - GPU_TYPE=rtx_5090
      - GPU_MEMORY=24GB
      - GPU_COMPUTE_CAPABILITY=9.0
      - GPU_TENSOR_CORES=512
      - GPU_CUDA_CORES=21760
      - GPU_VRAM=24576
      - GPU_POWER_LIMIT=450
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility

      # Preferred Tasks (High-end GPU)
      - PREFERRED_TASKS=large-model-inference,neural-training,video-processing,image-generation,batch-processing

      # LLM Providers
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - NEXUS_ROUTER_URL=http://172.20.0.11:6000

      # Local LLM Endpoints
      - OLLAMA_URL=http://ollama-rtx5090:11434
      - VLLM_URL=http://vllm-rtx5090:8000
      - LLAMA_CPP_URL=http://llama-cpp-rtx5090:8080

      # Performance (High-end Config)
      - MAX_CONCURRENT_TASKS=8
      - TASK_TIMEOUT=600000
      - MEMORY_LIMIT=48GB
      - CPU_LIMIT=16
      - BATCH_SIZE=32

      # Development Mode
      - HOT_RELOAD=true
      - DEBUG_MODE=false
      - VERBOSE=false
      - PROFILE_PERFORMANCE=true

      # Logging
      - LOG_LEVEL=info
      - LOG_FILE=/app/logs/claude-flow.log

      # Metadata
      - PC_ID=worker-laptop-1
      - PC_NAME=RTX 5090 Development Laptop
      - PC_ROLE=interactive-development
      - NETWORK_IP=10.0.0.2
    volumes:
      - claude-flow-worker-data:/app/data
      - claude-flow-worker-cache:/app/cache
      - claude-flow-worker-logs:/app/logs
      - ../../config/claude-flow/worker-laptop-1:/app/config:ro
    networks:
      nyra-network:
        ipv4_address: 172.20.0.70
    depends_on:
      - redis-worker-rtx5090
      - ollama-rtx5090
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.claude-flow-rtx5090.rule=Host(`worker-rtx5090.nyra.local`)"
      - "traefik.http.services.claude-flow-rtx5090.loadbalancer.server.port=3010"

  # ===================================================================
  # LARGE LANGUAGE MODEL INFERENCE
  # ===================================================================

  # Ollama - Local LLM inference optimized for RTX 5090
  ollama-rtx5090:
    image: ollama/ollama:latest
    container_name: worker-ollama-rtx5090
    restart: unless-stopped
    ports:
      - "11435:11434"
    environment:
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_ORIGINS=*
      - OLLAMA_NUM_PARALLEL=4
      - OLLAMA_MAX_LOADED_MODELS=3
      - OLLAMA_MAX_QUEUE=512
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - ollama-models:/root/.ollama
    networks:
      nyra-network:
        ipv4_address: 172.20.0.71
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.ollama-rtx5090.rule=Host(`ollama-rtx5090.nyra.local`)"
      - "traefik.http.services.ollama-rtx5090.loadbalancer.server.port=11434"

  # vLLM - High-performance LLM inference server
  vllm-rtx5090:
    image: vllm/vllm-openai:latest
    container_name: worker-vllm-rtx5090
    restart: unless-stopped
    ports:
      - "8001:8000"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - --model
      - mistralai/Mistral-7B-Instruct-v0.2
      - --gpu-memory-utilization
      - "0.9"
      - --max-model-len
      - "8192"
      - --dtype
      - auto
    volumes:
      - vllm-models:/root/.cache/huggingface
    networks:
      nyra-network:
        ipv4_address: 172.20.0.72
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.vllm-rtx5090.rule=Host(`vllm-rtx5090.nyra.local`)"
      - "traefik.http.services.vllm-rtx5090.loadbalancer.server.port=8000"

  # llama.cpp - Efficient LLM inference
  llama-cpp-rtx5090:
    image: ghcr.io/ggerganov/llama.cpp:full
    container_name: worker-llama-cpp-rtx5090
    restart: unless-stopped
    ports:
      - "8002:8080"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    command:
      - --server
      - --host
      - 0.0.0.0
      - --port
      - "8080"
      - -ngl
      - "99"
    volumes:
      - llama-cpp-models:/models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.73
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.llama-cpp-rtx5090.rule=Host(`llama-rtx5090.nyra.local`)"
      - "traefik.http.services.llama-cpp-rtx5090.loadbalancer.server.port=8080"

  # Open WebUI - Universal LLM interface
  open-webui-rtx5090:
    image: ghcr.io/open-webui/open-webui:main
    container_name: worker-openwebui-rtx5090
    restart: unless-stopped
    ports:
      - "3003:8080"
    environment:
      - OLLAMA_BASE_URL=http://ollama-rtx5090:11434
      - OPENAI_API_BASE_URL=http://vllm-rtx5090:8000/v1
      - WEBUI_AUTH=true
      - WEBUI_NAME=Project Nyra AI - RTX 5090
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}
    networks:
      nyra-network:
        ipv4_address: 172.20.0.74
    depends_on:
      - ollama-rtx5090
      - vllm-rtx5090
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.openwebui-rtx5090.rule=Host(`ai-rtx5090.nyra.local`)"
      - "traefik.http.services.openwebui-rtx5090.loadbalancer.server.port=8080"

  # ===================================================================
  # IMAGE GENERATION & STABLE DIFFUSION
  # ===================================================================

  # Automatic1111 - Stable Diffusion WebUI
  automatic1111-rtx5090:
    image: universonic/automatic1111:latest
    container_name: worker-automatic1111-rtx5090
    restart: unless-stopped
    ports:
      - "7860:7860"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - COMMANDLINE_ARGS=--api --listen --port 7860 --xformers --enable-insecure-extension-access
    volumes:
      - automatic1111-data:/data
      - automatic1111-models:/stable-diffusion-webui/models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.75
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.automatic1111.rule=Host(`sd-rtx5090.nyra.local`)"
      - "traefik.http.services.automatic1111.loadbalancer.server.port=7860"

  # ComfyUI - Advanced SD workflow
  comfyui-rtx5090:
    image: yanwk/comfyui-boot:latest
    container_name: worker-comfyui-rtx5090
    restart: unless-stopped
    ports:
      - "8188:8188"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - comfyui-data:/home/runner
      - comfyui-models:/home/runner/models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.76
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.comfyui-rtx5090.rule=Host(`comfy-rtx5090.nyra.local`)"
      - "traefik.http.services.comfyui-rtx5090.loadbalancer.server.port=8188"

  # SwarmUI - Modern SD interface
  swarmui-rtx5090:
    image: mcmonkey/swarmui:latest
    container_name: worker-swarmui-rtx5090
    restart: unless-stopped
    ports:
      - "7801:7801"
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - swarmui-data:/SwarmUI/Data
      - swarmui-models:/SwarmUI/Models
    networks:
      nyra-network:
        ipv4_address: 172.20.0.77
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.swarmui-rtx5090.rule=Host(`swarm-rtx5090.nyra.local`)"
      - "traefik.http.services.swarmui-rtx5090.loadbalancer.server.port=7801"

  # ===================================================================
  # DEVELOPMENT & DATA SCIENCE
  # ===================================================================

  # Jupyter Lab - GPU-accelerated notebooks
  jupyter-rtx5090:
    image: jupyter/tensorflow-notebook:latest
    container_name: worker-jupyter-rtx5090
    restart: unless-stopped
    ports:
      - "8889:8888"
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - GRANT_SUDO=yes
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    volumes:
      - jupyter-data:/home/jovyan/work
    networks:
      nyra-network:
        ipv4_address: 172.20.0.78
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.jupyter-rtx5090.rule=Host(`jupyter-rtx5090.nyra.local`)"
      - "traefik.http.services.jupyter-rtx5090.loadbalancer.server.port=8888"

  # ===================================================================
  # INFRASTRUCTURE
  # ===================================================================

  # Redis - High-performance caching
  redis-worker-rtx5090:
    image: redis:7-alpine
    container_name: worker-redis-rtx5090
    restart: unless-stopped
    ports:
      - "6381:6379"
    command: redis-server --requirepass ${REDIS_PASSWORD} --maxmemory 16gb --maxmemory-policy allkeys-lru
    volumes:
      - redis-worker-data:/data
    networks:
      nyra-network:
        ipv4_address: 172.20.0.79
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ===================================================================
  # MONITORING
  # ===================================================================

  # Node Exporter - System metrics
  node-exporter-rtx5090:
    image: prom/node-exporter:latest
    container_name: worker-node-exporter-rtx5090
    restart: unless-stopped
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host'
    ports:
      - "9101:9100"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host:ro
    networks:
      nyra-network:
        ipv4_address: 172.20.0.80

  # NVIDIA GPU Exporter
  nvidia-gpu-exporter-rtx5090:
    image: nvidia/dcgm-exporter:latest
    container_name: worker-nvidia-exporter-rtx5090
    restart: unless-stopped
    ports:
      - "9401:9400"
    networks:
      nyra-network:
        ipv4_address: 172.20.0.81
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - DCGM_EXPORTER_LISTEN=:9400
      - DCGM_EXPORTER_KUBERNETES=false
