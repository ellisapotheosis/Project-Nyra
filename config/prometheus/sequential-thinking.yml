# Prometheus configuration for Sequential Thinking MCP Server
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: 'sequential-thinking-mcp'
    environment: 'production'

scrape_configs:
  - job_name: 'sequential-thinking'
    static_configs:
      - targets: ['sequential-thinking-mcp:8093']
        labels:
          service: 'sequential-thinking-mcp'
          type: 'mcp-server'

    metrics_path: '/metrics'
    scrape_interval: 10s
    scrape_timeout: 5s

    metric_relabel_configs:
      - source_labels: [__name__]
        regex: 'node_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'mcp_.*'
        action: keep
      - source_labels: [__name__]
        regex: 'sequential_thinking_.*'
        action: keep

  - job_name: 'sequential-thinking-health'
    static_configs:
      - targets: ['sequential-thinking-mcp:8093']
    metrics_path: '/health'
    scrape_interval: 30s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []
