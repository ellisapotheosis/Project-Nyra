# Docker Compose - Worker 3 (Desktop PC - RTX 3090Ti)
# Specialization: Research, multimodal tasks, and writing

version: '3.8'

services:
  # Text Generation Inference (TGI) Server
  tgi:
    image: ghcr.io/huggingface/text-generation-inference:latest
    container_name: nyra-worker3-tgi
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - CUDA_VISIBLE_DEVICES=0
      - MODEL_ID=/app/models/llama-3.1-33b-instruct
      - NUM_SHARD=1
      - MAX_CONCURRENT_REQUESTS=128
      - MAX_INPUT_LENGTH=16384
      - MAX_TOTAL_TOKENS=20480
      - QUANTIZE=bitsandbytes-nf4
      - CUDA_MEMORY_FRACTION=0.85
      - HUGGING_FACE_HUB_TOKEN=${HF_TOKEN}
    volumes:
      - "tgi-models:/app/models"
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "/tmp/hf_cache:/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    command: [
      "--hostname", "0.0.0.0",
      "--port", "80",
      "--model-id", "/app/models/llama-3.1-33b-instruct",
      "--num-shard", "1",
      "--max-concurrent-requests", "128",
      "--max-input-length", "16384",
      "--max-total-tokens", "20480",
      "--quantize", "bitsandbytes-nf4",
      "--cuda-memory-fraction", "0.85"
    ]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 180s

  # LiteLLM Proxy for Worker 3
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nyra-worker3-litellm
    restart: unless-stopped
    ports:
      - "4003:4000"
      - "8003:8003"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=sqlite:///app/data/litellm_worker3.db
      - LITELLM_LOG=INFO
      - TGI_API_BASE=http://tgi:80
    volumes:
      - "./config/litellm-worker3.yaml:/app/config.yaml"
      - "litellm-data:/app/data"
    depends_on:
      - tgi
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Research-Specialized Model Manager
  model-manager:
    image: nyra/research-model-manager:latest
    container_name: nyra-worker3-model-manager
    restart: unless-stopped
    ports:
      - "8083:8080"
    environment:
      - WORKER_ID=worker3
      - GPU_TYPE=rtx_3090ti
      - VRAM_GB=24
      - TGI_API_BASE=http://tgi:80
      - SPECIALIZATION=research
      - MULTIMODAL_SUPPORT=true
      - DOCUMENT_PROCESSING=true
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "tgi-models:/app/models"
      - "manager-data:/app/data"
      - "/tmp/hf_cache:/app/cache"
    depends_on:
      - tgi
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Document Processing Service
  document-processor:
    image: nyra/document-processor:latest
    container_name: nyra-worker3-docprocessor
    restart: unless-stopped
    ports:
      - "8084:8080"
    environment:
      - WORKER_ID=worker3
      - OCR_ENABLED=true
      - MAX_DOCUMENT_SIZE_MB=50
      - SUPPORTED_FORMATS=pdf,docx,txt,md
      - CACHE_PROCESSING_RESULTS=true
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "document-data:/app/documents"
      - "processing-cache:/app/cache"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Multimodal Vision Service
  vision-service:
    image: nyra/vision-service:latest
    container_name: nyra-worker3-vision
    restart: unless-stopped
    ports:
      - "8085:8080"
    environment:
      - WORKER_ID=worker3
      - MAX_IMAGE_SIZE_MB=20
      - SUPPORTED_FORMATS=jpg,jpeg,png,webp,gif
      - IMAGE_PREPROCESSING=true
      - VISION_MODEL_PATH=/app/models/vision
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "tgi-models:/app/models"
      - "vision-data:/app/vision"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Research Performance Monitor
  perf-monitor:
    image: nyra/research-perf-monitor:latest
    container_name: nyra-worker3-perf-monitor
    restart: unless-stopped
    ports:
      - "9003:9090"
    environment:
      - WORKER_ID=worker3
      - GPU_MONITORING=true
      - RESEARCH_METRICS=true
      - PROMETHEUS_PUSH_GATEWAY=http://orchestrator.nyra.local:9091
      - MULTIMODAL_TRACKING=true
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "monitor-data:/app/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflared Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-worker3-cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_WORKER3_TUNNEL_TOKEN}
    volumes:
      - "./config/cloudflared-worker3.yaml:/etc/cloudflared/config.yaml"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run", "nyra-worker3-tunnel"]
    depends_on:
      - litellm-proxy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "nyra-worker3-tunnel"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Research Health Check Service
  health-check:
    image: nyra/research-health-check:latest
    container_name: nyra-worker3-health
    restart: unless-stopped
    ports:
      - "8093:8080"
    environment:
      - WORKER_ID=worker3
      - CHECK_INTERVAL=30
      - ORCHESTRATOR_URL=http://orchestrator.nyra.local:8080
      - MULTIMODAL_TEST=true
      - DOCUMENT_PROCESSING_TEST=true
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
    depends_on:
      - tgi
      - litellm-proxy
      - document-processor
      - vision-service
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 3

  # Research Model Warmer
  model-warmer:
    image: nyra/research-model-warmer:latest
    container_name: nyra-worker3-model-warmer
    restart: unless-stopped
    environment:
      - WORKER_ID=worker3
      - TGI_API_BASE=http://tgi:80
      - WARM_SCHEDULE=0 6 * * *  # 6 AM daily
      - PRELOAD_CRITICAL=true
      - CACHE_EMBEDDINGS=true
      - MULTIMODAL_WARMING=true
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "tgi-models:/app/models"
      - "warmer-data:/app/data"
      - "/tmp/hf_cache:/app/cache"
    depends_on:
      - tgi

  # Redis Cache for Research
  redis:
    image: redis:7-alpine
    container_name: nyra-worker3-redis
    restart: unless-stopped
    ports:
      - "6382:6379"
    volumes:
      - "redis-data:/data"
      - "./config/redis-worker3.conf:/usr/local/etc/redis/redis.conf"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--maxmemory", "3gb", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Citation Management Service
  citation-manager:
    image: nyra/citation-manager:latest
    container_name: nyra-worker3-citations
    restart: unless-stopped
    ports:
      - "8094:8080"
    environment:
      - WORKER_ID=worker3
      - SUPPORTED_FORMATS=apa,mla,chicago,ieee
      - FACT_CHECKING=true
      - CONFIDENCE_THRESHOLD=0.8
    volumes:
      - "./config/worker3-rtx3090ti-config.yaml:/app/config.yaml"
      - "citation-data:/app/data"
    depends_on:
      - redis
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Research Log Aggregator
  log-aggregator:
    image: fluent/fluent-bit:latest
    container_name: nyra-worker3-logs
    restart: unless-stopped
    volumes:
      - "./config/fluent-bit-worker3.conf:/fluent-bit/etc/fluent-bit.conf"
      - "/var/log:/var/log:ro"
      - "log-data:/app/logs"
    depends_on:
      - redis

volumes:
  tgi-models:
    driver: local
    driver_opts:
      type: none
      device: /app/models/worker3
      o: bind
  litellm-data:
    driver: local
  manager-data:
    driver: local
  document-data:
    driver: local
  processing-cache:
    driver: local
  vision-data:
    driver: local
  monitor-data:
    driver: local
  warmer-data:
    driver: local
  citation-data:
    driver: local
  redis-data:
    driver: local
  log-data:
    driver: local

networks:
  default:
    name: nyra-worker3
    driver: bridge
    ipam:
      config:
        - subnet: 172.23.0.0/16

  # Connect to orchestrator network
  orchestrator:
    external: true
    name: nyra-orchestrator