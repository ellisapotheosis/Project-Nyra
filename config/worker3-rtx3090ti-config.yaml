# Worker 3 Configuration - Desktop PC (RTX 3090Ti, 24GB VRAM)
# Specialization: Research, multimodal tasks, and writing

worker:
  id: "worker3"
  hostname: "worker3.nyra.local"
  role: "research_specialist"
  gpu_info:
    model: "RTX 3090Ti"
    vram_gb: 24
    compute_capability: "8.6"
    max_batch_size: 24

network:
  api_port: 8003
  litellm_port: 4003
  metrics_port: 9003
  health_port: 8083

cloudflare:
  tunnel_name: "nyra-worker3-tunnel"
  config_file: "/etc/cloudflared/worker3.yaml"
  subdomain: "worker3.nyra.ratehunter.net"

models:
  primary:
    - name: "llama-3.1-33b-instruct"
      quantization: "8-bit"
      max_context: 16384
      estimated_vram_gb: 18
      serving_framework: "tgi"
      priority: 1

    - name: "qwen2.5-32b-instruct"
      quantization: "8-bit"
      max_context: 32768
      estimated_vram_gb: 17
      serving_framework: "tgi"
      priority: 2

    - name: "yi-34b-chat"
      quantization: "4-bit"
      max_context: 4096
      estimated_vram_gb: 16
      serving_framework: "tgi"
      priority: 3

  secondary:
    - name: "llava-v1.6-34b"
      quantization: "4-bit"
      max_context: 4096
      estimated_vram_gb: 15
      serving_framework: "tgi"
      priority: 4
      multimodal: true

    - name: "wizardlm-30b"
      quantization: "8-bit"
      max_context: 8192
      estimated_vram_gb: 16
      serving_framework: "tgi"
      priority: 5

text_generation_inference:
  hostname: "0.0.0.0"
  port: 8080
  num_shard: 1
  max_concurrent_requests: 128
  max_best_of: 4
  max_stop_sequences: 4
  max_top_n_tokens: 5
  max_input_length: 16384
  max_total_tokens: 20480
  waiting_served_ratio: 0.3
  max_batch_prefill_tokens: 4096
  max_batch_total_tokens: 16384
  max_waiting_tokens: 20
  cuda_memory_fraction: 0.85
  quantize: "bitsandbytes-nf4"

litellm:
  config:
    model_list:
      - model_name: "llama-3.1-33b"
        litellm_params:
          model: "huggingface/llama-3.1-33b-instruct"
          api_base: "http://localhost:8080"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0002
          output_cost_per_token: 0.0002

      - model_name: "qwen2.5-32b"
        litellm_params:
          model: "huggingface/qwen2.5-32b-instruct"
          api_base: "http://localhost:8080"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0002
          output_cost_per_token: 0.0002

      - model_name: "yi-34b"
        litellm_params:
          model: "huggingface/yi-34b-chat"
          api_base: "http://localhost:8080"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0002
          output_cost_per_token: 0.0002

    general_settings:
      master_key: "${LITELLM_MASTER_KEY}"
      database_url: "sqlite:///app/data/litellm_worker3.db"
      ui_port: 4003

specialization:
  tasks:
    - "research_synthesis"
    - "academic_writing"
    - "content_creation"
    - "summarization"
    - "multimodal_analysis"
    - "document_processing"
    - "translation"
    - "creative_content"

  routing_keywords:
    - "research"
    - "write"
    - "summarize"
    - "explain"
    - "translate"
    - "content"
    - "document"
    - "academic"
    - "creative"
    - "image"
    - "vision"
    - "multimodal"
    - "analysis"

performance:
  inference:
    max_concurrent_requests: 12
    request_timeout_seconds: 180
    batch_size: 6
    temperature_range: [0.1, 1.0]

  memory:
    model_cache_size: "18GB"
    kv_cache_size: "3GB"
    system_reserve_gb: 3

  optimization:
    use_flash_attention: true
    use_paged_attention: false  # TGI handles this
    quantization_backend: "bitsandbytes"
    rope_scaling: true

monitoring:
  metrics:
    - "gpu_utilization"
    - "vram_usage"
    - "inference_latency"
    - "requests_per_second"
    - "model_loading_time"
    - "queue_length"
    - "multimodal_processing_time"

  health_check:
    endpoint: "/health"
    model_validation: true
    gpu_check: true
    memory_check: true
    multimodal_test: true

  logging:
    level: "INFO"
    file_path: "/app/logs/worker3.log"
    max_size_mb: 150
    backup_count: 7

auto_scaling:
  enabled: true
  triggers:
    gpu_utilization_high: 85
    queue_length_high: 15
    response_time_high_ms: 4000

  actions:
    optimize_batch_size: true
    switch_quantization: true
    load_smaller_model: true
    request_external_fallback: true

multimodal:
  enabled: true
  supported_formats: ["jpg", "jpeg", "png", "webp", "gif"]
  max_image_size_mb: 20
  image_preprocessing:
    resize_max: 1024
    quality: 85
    format: "jpeg"

power_management:
  idle_timeout_minutes: 25
  sleep_when_idle: false
  reduce_power_on_idle: true
  wake_on_demand: true
  thermal_throttling: true

model_management:
  preloading:
    enabled: true
    schedule: "0 6 * * *"  # 6 AM daily
    warm_up_requests: 3

  rotation:
    enabled: true
    max_idle_time_minutes: 45
    priority_based: true

  caching:
    embeddings_cache: true
    tokenizer_cache: true
    model_weights_cache: true

docker:
  image: "nyra/worker-tgi:latest"
  container_name: "nyra-worker3"
  restart_policy: "unless-stopped"
  volumes:
    - "/app/models:/app/models"
    - "/app/data:/app/data"
    - "/app/logs:/app/logs"
    - "/app/config:/app/config"
    - "/app/cache:/app/cache"

  environment:
    - "NVIDIA_VISIBLE_DEVICES=0"
    - "MODEL_ID=/app/models/current"
    - "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}"
    - "CUDA_VISIBLE_DEVICES=0"
    - "HF_HUB_CACHE=/app/cache"

  gpu_reservation:
    device_ids: ["0"]
    memory_limit: "22GB"

research_features:
  document_processing:
    supported_formats: ["pdf", "docx", "txt", "md"]
    max_document_size_mb: 50
    ocr_enabled: true

  citation_management:
    enabled: true
    formats: ["apa", "mla", "chicago", "ieee"]

  fact_checking:
    enabled: true
    confidence_threshold: 0.8
    sources_required: 2