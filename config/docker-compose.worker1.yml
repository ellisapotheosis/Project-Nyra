# Docker Compose - Worker 1 (Alienware M15R7 - RTX 3060)
# Specialization: Code generation and development tasks

version: '3.8'

services:
  # Ollama Model Server
  ollama:
    image: ollama/ollama:latest
    container_name: nyra-worker1-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      - NVIDIA_VISIBLE_DEVICES=0
      - OLLAMA_HOST=0.0.0.0
      - OLLAMA_MODELS=/app/models
      - OLLAMA_KEEP_ALIVE=5m
      - OLLAMA_MAX_LOADED_MODELS=2
    volumes:
      - "ollama-models:/app/models"
      - "./config/worker1-rtx3060-config.yaml:/app/config.yaml"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 60s

  # LiteLLM Proxy for Worker 1
  litellm-proxy:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: nyra-worker1-litellm
    restart: unless-stopped
    ports:
      - "4001:4000"
      - "8001:8001"
    environment:
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - DATABASE_URL=sqlite:///app/data/litellm_worker1.db
      - LITELLM_LOG=INFO
      - OLLAMA_API_BASE=http://ollama:11434
    volumes:
      - "./config/litellm-worker1.yaml:/app/config.yaml"
      - "litellm-data:/app/data"
    depends_on:
      - ollama
    command: ["--config", "/app/config.yaml", "--port", "4000", "--host", "0.0.0.0"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Model Manager for Worker 1
  model-manager:
    image: nyra/model-manager:latest
    container_name: nyra-worker1-model-manager
    restart: unless-stopped
    ports:
      - "8081:8080"
    environment:
      - WORKER_ID=worker1
      - GPU_TYPE=rtx_3060
      - VRAM_GB=6
      - OLLAMA_API_BASE=http://ollama:11434
      - SPECIALIZATION=code
    volumes:
      - "./config/worker1-rtx3060-config.yaml:/app/config.yaml"
      - "ollama-models:/app/models"
      - "manager-data:/app/data"
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Performance Monitor
  perf-monitor:
    image: nyra/worker-perf-monitor:latest
    container_name: nyra-worker1-perf-monitor
    restart: unless-stopped
    ports:
      - "9001:9090"
    environment:
      - WORKER_ID=worker1
      - GPU_MONITORING=true
      - PROMETHEUS_PUSH_GATEWAY=http://orchestrator.nyra.local:9091
    volumes:
      - "./config/worker1-rtx3060-config.yaml:/app/config.yaml"
      - "monitor-data:/app/data"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Cloudflared Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: nyra-worker1-cloudflared
    restart: unless-stopped
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_WORKER1_TUNNEL_TOKEN}
    volumes:
      - "./config/cloudflared-worker1.yaml:/etc/cloudflared/config.yaml"
    command: ["tunnel", "--config", "/etc/cloudflared/config.yaml", "run", "nyra-worker1-tunnel"]
    depends_on:
      - litellm-proxy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "info", "nyra-worker1-tunnel"]
      interval: 60s
      timeout: 30s
      retries: 3

  # Health Check Service
  health-check:
    image: nyra/health-check:latest
    container_name: nyra-worker1-health
    restart: unless-stopped
    ports:
      - "8091:8080"
    environment:
      - WORKER_ID=worker1
      - CHECK_INTERVAL=30
      - ORCHESTRATOR_URL=http://orchestrator.nyra.local:8080
    volumes:
      - "./config/worker1-rtx3060-config.yaml:/app/config.yaml"
    depends_on:
      - ollama
      - litellm-proxy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 60s
      timeout: 15s
      retries: 3

  # Model Auto-downloader and Warmer
  model-warmer:
    image: nyra/model-warmer:latest
    container_name: nyra-worker1-model-warmer
    restart: unless-stopped
    environment:
      - WORKER_ID=worker1
      - OLLAMA_API_BASE=http://ollama:11434
      - WARM_SCHEDULE=0 8 * * *  # 8 AM daily
      - PRELOAD_CRITICAL=true
    volumes:
      - "./config/worker1-rtx3060-config.yaml:/app/config.yaml"
      - "ollama-models:/app/models"
      - "warmer-data:/app/data"
    depends_on:
      - ollama
    command: ["--config", "/app/config.yaml", "--daemon"]

  # Redis Cache (Local)
  redis:
    image: redis:7-alpine
    container_name: nyra-worker1-redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    volumes:
      - "redis-data:/data"
      - "./config/redis-worker.conf:/usr/local/etc/redis/redis.conf"
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  # Log Aggregator
  log-aggregator:
    image: fluent/fluent-bit:latest
    container_name: nyra-worker1-logs
    restart: unless-stopped
    volumes:
      - "./config/fluent-bit-worker1.conf:/fluent-bit/etc/fluent-bit.conf"
      - "/var/log:/var/log:ro"
      - "log-data:/app/logs"
    depends_on:
      - redis

volumes:
  ollama-models:
    driver: local
    driver_opts:
      type: none
      device: /app/models/worker1
      o: bind
  litellm-data:
    driver: local
  manager-data:
    driver: local
  monitor-data:
    driver: local
  warmer-data:
    driver: local
  redis-data:
    driver: local
  log-data:
    driver: local

networks:
  default:
    name: nyra-worker1
    driver: bridge
    ipam:
      config:
        - subnet: 172.21.0.0/16

  # Connect to orchestrator network
  orchestrator:
    external: true
    name: nyra-orchestrator