# Worker 2 Configuration - Alienware Area-51 (RTX 5090, 32GB VRAM)
# Specialization: Complex reasoning and large context tasks

worker:
  id: "worker2"
  hostname: "worker2.nyra.local"
  role: "reasoning_specialist"
  gpu_info:
    model: "RTX 5090"
    vram_gb: 32
    compute_capability: "8.9"
    max_batch_size: 32

network:
  api_port: 8002
  litellm_port: 4002
  metrics_port: 9002
  health_port: 8082

cloudflare:
  tunnel_name: "nyra-worker2-tunnel"
  config_file: "/etc/cloudflared/worker2.yaml"
  subdomain: "worker2.nyra.ratehunter.net"

models:
  primary:
    - name: "llama-3.1-70b-instruct"
      quantization: "4-bit"
      max_context: 32768
      estimated_vram_gb: 24
      serving_framework: "vllm"
      priority: 1

    - name: "mixtral-8x22b-instruct"
      quantization: "8-bit"
      max_context: 32768
      estimated_vram_gb: 28
      serving_framework: "vllm"
      priority: 2

    - name: "qwen2.5-72b-instruct"
      quantization: "4-bit"
      max_context: 32768
      estimated_vram_gb: 22
      serving_framework: "vllm"
      priority: 3

  secondary:
    - name: "deepseek-coder-33b-instruct"
      quantization: "4-bit"
      max_context: 16384
      estimated_vram_gb: 18
      serving_framework: "vllm"
      priority: 4

    - name: "wizardcoder-33b"
      quantization: "4-bit"
      max_context: 8192
      estimated_vram_gb: 16
      serving_framework: "vllm"
      priority: 5

vllm:
  host: "0.0.0.0"
  port: 8000
  gpu_memory_utilization: 0.9
  max_model_len: 32768
  max_num_seqs: 128
  max_num_batched_tokens: 8192
  tensor_parallel_size: 1
  pipeline_parallel_size: 1
  enable_chunked_prefill: true
  enforce_eager: false
  disable_custom_all_reduce: false

litellm:
  config:
    model_list:
      - model_name: "llama-3.1-70b"
        litellm_params:
          model: "openai/llama-3.1-70b-instruct"
          api_base: "http://localhost:8000/v1"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0003
          output_cost_per_token: 0.0003

      - model_name: "mixtral-8x22b"
        litellm_params:
          model: "openai/mixtral-8x22b-instruct"
          api_base: "http://localhost:8000/v1"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0004
          output_cost_per_token: 0.0004

      - model_name: "qwen2.5-72b"
        litellm_params:
          model: "openai/qwen2.5-72b-instruct"
          api_base: "http://localhost:8000/v1"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0003
          output_cost_per_token: 0.0003

    general_settings:
      master_key: "${LITELLM_MASTER_KEY}"
      database_url: "sqlite:///app/data/litellm_worker2.db"
      ui_port: 4002

specialization:
  tasks:
    - "complex_reasoning"
    - "multi_step_analysis"
    - "research_synthesis"
    - "strategic_planning"
    - "mathematical_modeling"
    - "logical_deduction"
    - "creative_writing"
    - "long_context_tasks"

  routing_keywords:
    - "analyze"
    - "reason"
    - "complex"
    - "multi-step"
    - "strategic"
    - "planning"
    - "synthesis"
    - "research"
    - "mathematical"
    - "logical"
    - "creative"
    - "detailed"
    - "comprehensive"

performance:
  inference:
    max_concurrent_requests: 16
    request_timeout_seconds: 300
    batch_size: 8
    temperature_range: [0.0, 1.2]

  memory:
    model_cache_size: "24GB"
    kv_cache_size: "4GB"
    system_reserve_gb: 4

  optimization:
    use_flash_attention: true
    use_paged_attention: true
    use_fp8: true
    quantization_backend: "bitsandbytes"
    cuda_graph: true

monitoring:
  metrics:
    - "gpu_utilization"
    - "vram_usage"
    - "inference_latency"
    - "requests_per_second"
    - "model_loading_time"
    - "queue_length"
    - "context_length_distribution"
    - "batch_efficiency"

  health_check:
    endpoint: "/health"
    model_validation: true
    gpu_check: true
    memory_check: true
    context_length_test: true

  logging:
    level: "INFO"
    file_path: "/app/logs/worker2.log"
    max_size_mb: 200
    backup_count: 10

auto_scaling:
  enabled: true
  triggers:
    gpu_utilization_high: 80
    queue_length_high: 20
    response_time_high_ms: 5000

  actions:
    optimize_batch_size: true
    adjust_max_model_len: true
    load_smaller_model: true
    request_external_fallback: true

power_management:
  idle_timeout_minutes: 20
  sleep_when_idle: false
  reduce_power_on_idle: true
  wake_on_demand: true
  dynamic_frequency_scaling: true

model_management:
  preloading:
    enabled: true
    schedule: "0 7 * * *"  # 7 AM daily
    warm_up_requests: 5

  rotation:
    enabled: true
    max_idle_time_minutes: 60
    priority_based: true

  quantization:
    dynamic: true
    fallback_precision: "fp16"
    calibration_samples: 128

docker:
  image: "nyra/worker-vllm:latest"
  container_name: "nyra-worker2"
  restart_policy: "unless-stopped"
  volumes:
    - "/app/models:/app/models"
    - "/app/data:/app/data"
    - "/app/logs:/app/logs"
    - "/app/config:/app/config"
    - "/dev/shm:/dev/shm"

  environment:
    - "NVIDIA_VISIBLE_DEVICES=0"
    - "VLLM_WORKER_MULTIPROC_METHOD=spawn"
    - "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}"
    - "CUDA_VISIBLE_DEVICES=0"

  gpu_reservation:
    device_ids: ["0"]
    memory_limit: "30GB"

  shm_size: "8gb"