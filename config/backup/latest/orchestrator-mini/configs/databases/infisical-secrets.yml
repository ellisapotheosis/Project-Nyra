# ==============================================================================
# Infisical Secrets Configuration Template
# ==============================================================================
# This file defines the structure of secrets stored in Infisical
# for Project Nyra database services
#
# Usage:
#   1. Set up Infisical project and environment (dev/staging/prod)
#   2. Create secrets in Infisical following this structure
#   3. Configure Infisical CLI or SDK in your services
#   4. Fetch secrets at runtime using service identities
#
# Structure: /nyra/orchestrator/databases/<service>/<secret>
# ==============================================================================

# ==============================================================================
# POSTGRESQL SECRETS
# ==============================================================================
postgres:
  path: /nyra/orchestrator/databases/postgres
  secrets:
    # Root credentials
    - key: POSTGRES_ROOT_USER
      description: PostgreSQL superuser username
      example: postgres
      required: true

    - key: POSTGRES_ROOT_PASSWORD
      description: PostgreSQL superuser password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Application user credentials
    - key: NYRA_APP_USER
      description: Application database user
      example: nyra_app_user
      required: true

    - key: NYRA_APP_PASSWORD
      description: Application database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Auth service user
    - key: NYRA_AUTH_USER
      description: Auth service database user
      example: nyra_auth_user
      required: true

    - key: NYRA_AUTH_PASSWORD
      description: Auth service database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Analytics service user
    - key: NYRA_ANALYTICS_USER
      description: Analytics service database user
      example: nyra_analytics_user
      required: true

    - key: NYRA_ANALYTICS_PASSWORD
      description: Analytics service database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Read-only user
    - key: NYRA_READONLY_USER
      description: Read-only database user
      example: nyra_readonly_user
      required: true

    - key: NYRA_READONLY_PASSWORD
      description: Read-only database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Infisical backend user
    - key: INFISICAL_DB_USER
      description: Infisical database user
      example: infisical_user
      required: true

    - key: INFISICAL_DB_PASSWORD
      description: Infisical database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

# ==============================================================================
# REDIS SECRETS
# ==============================================================================
redis:
  path: /nyra/orchestrator/databases/redis
  secrets:
    - key: REDIS_PASSWORD
      description: Redis authentication password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    - key: REDIS_MAXMEMORY
      description: Maximum memory limit
      example: 512mb
      required: false

# ==============================================================================
# MONGODB SECRETS
# ==============================================================================
mongodb:
  path: /nyra/orchestrator/databases/mongodb
  secrets:
    # Root credentials
    - key: MONGO_ROOT_USER
      description: MongoDB root username
      example: admin
      required: true

    - key: MONGO_ROOT_PASSWORD
      description: MongoDB root password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Application user
    - key: MONGO_APP_USER
      description: Application database user
      example: nyra_app_user
      required: true

    - key: MONGO_APP_PASSWORD
      description: Application database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Read-only user
    - key: MONGO_READONLY_USER
      description: Read-only database user
      example: nyra_readonly_user
      required: true

    - key: MONGO_READONLY_PASSWORD
      description: Read-only database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Backup user
    - key: MONGO_BACKUP_USER
      description: Backup user
      example: nyra_backup_user
      required: true

    - key: MONGO_BACKUP_PASSWORD
      description: Backup user password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    # Replica set configuration
    - key: MONGO_REPLICA_SET_NAME
      description: Replica set name
      example: rs0
      required: false

# ==============================================================================
# AGENTDB (QDRANT) SECRETS
# ==============================================================================
agentdb:
  path: /nyra/orchestrator/databases/agentdb
  secrets:
    - key: QDRANT_API_KEY
      description: Qdrant API authentication key (optional)
      example: GENERATE_API_KEY
      required: false
      sensitive: true

    - key: QDRANT_HNSW_M
      description: HNSW index parameter M
      example: "16"
      required: false

    - key: QDRANT_HNSW_EF_CONSTRUCT
      description: HNSW index parameter ef_construct
      example: "100"
      required: false

# ==============================================================================
# GITEA SECRETS (if using local git server)
# ==============================================================================
gitea:
  path: /nyra/orchestrator/databases/gitea
  secrets:
    - key: GITEA_DB_USER
      description: Gitea database user
      example: gitea
      required: true

    - key: GITEA_DB_PASSWORD
      description: Gitea database password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

    - key: GITEA_SECRET_KEY
      description: Gitea secret key (min 32 chars)
      example: GENERATE_SECRET_KEY_32_CHARS_MIN
      required: true
      sensitive: true

    - key: GITEA_INTERNAL_TOKEN
      description: Gitea internal token
      example: GENERATE_INTERNAL_TOKEN
      required: true
      sensitive: true

    - key: GITEA_ADMIN_USER
      description: Gitea admin username
      example: admin
      required: true

    - key: GITEA_ADMIN_PASSWORD
      description: Gitea admin password
      example: GENERATE_STRONG_PASSWORD
      required: true
      sensitive: true

# ==============================================================================
# CONNECTION STRINGS (COMPUTED)
# ==============================================================================
# These can be computed from the above secrets
# Store them in Infisical for convenience

connection_strings:
  path: /nyra/orchestrator/databases/connection-strings
  secrets:
    - key: POSTGRES_MAIN_URL
      description: PostgreSQL connection string for nyra_main
      example: postgresql://nyra_app_user:PASSWORD@localhost:5432/nyra_main
      computed: true

    - key: POSTGRES_AUTH_URL
      description: PostgreSQL connection string for nyra_auth
      example: postgresql://nyra_auth_user:PASSWORD@localhost:5432/nyra_auth
      computed: true

    - key: POSTGRES_ANALYTICS_URL
      description: PostgreSQL connection string for nyra_analytics
      example: postgresql://nyra_analytics_user:PASSWORD@localhost:5432/nyra_analytics
      computed: true

    - key: REDIS_URL
      description: Redis connection string
      example: redis://:PASSWORD@localhost:6379/0
      computed: true

    - key: MONGODB_URL
      description: MongoDB connection string
      example: mongodb://nyra_app_user:PASSWORD@localhost:27017/nyra?replicaSet=rs0
      computed: true

    - key: AGENTDB_URL
      description: AgentDB (Qdrant) connection string
      example: http://localhost:6333
      computed: true

# ==============================================================================
# SECURITY BEST PRACTICES
# ==============================================================================
# 1. Generate strong passwords (min 32 characters, alphanumeric + symbols)
# 2. Rotate secrets regularly (every 90 days recommended)
# 3. Use different passwords for each service and environment
# 4. Never commit actual secrets to version control
# 5. Use Infisical service identities for machine access
# 6. Enable audit logging in Infisical
# 7. Set up secret rotation policies
# 8. Use Infisical environments (dev/staging/prod) for isolation
# ==============================================================================
