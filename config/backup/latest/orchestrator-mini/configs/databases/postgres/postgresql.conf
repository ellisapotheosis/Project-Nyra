# ==============================================================================
# PostgreSQL Configuration for Project Nyra Orchestrator
# ==============================================================================
# Optimized for development/small production workloads
# Hardware assumptions: 4-8 GB RAM, SSD storage
#
# For production tuning, use PGTune: https://pgtune.leopard.in.ua/
# ==============================================================================

# -----------------------------------------------------------------------------
# CONNECTION SETTINGS
# -----------------------------------------------------------------------------
listen_addresses = '*'
max_connections = 200
superuser_reserved_connections = 3

# -----------------------------------------------------------------------------
# MEMORY SETTINGS
# -----------------------------------------------------------------------------
shared_buffers = 256MB                    # ~25% of RAM for small systems
effective_cache_size = 1GB                # ~50% of RAM
work_mem = 4MB                            # Memory per sort operation
maintenance_work_mem = 64MB               # Memory for VACUUM, CREATE INDEX

# -----------------------------------------------------------------------------
# CHECKPOINT SETTINGS
# -----------------------------------------------------------------------------
checkpoint_completion_target = 0.9
wal_buffers = 16MB
min_wal_size = 1GB
max_wal_size = 4GB

# -----------------------------------------------------------------------------
# QUERY TUNING
# -----------------------------------------------------------------------------
random_page_cost = 1.1                    # SSD optimized
effective_io_concurrency = 200            # SSD optimized
default_statistics_target = 100

# -----------------------------------------------------------------------------
# PARALLEL QUERY SETTINGS
# -----------------------------------------------------------------------------
max_worker_processes = 4
max_parallel_workers_per_gather = 2
max_parallel_workers = 4

# -----------------------------------------------------------------------------
# LOGGING
# -----------------------------------------------------------------------------
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_min_duration_statement = 1000         # Log queries > 1 second
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_statement = 'ddl'                     # Log all DDL statements

# -----------------------------------------------------------------------------
# AUTOVACUUM
# -----------------------------------------------------------------------------
autovacuum = on
autovacuum_max_workers = 3
autovacuum_naptime = 10s

# -----------------------------------------------------------------------------
# CLIENT CONNECTION DEFAULTS
# -----------------------------------------------------------------------------
timezone = 'UTC'
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'
default_text_search_config = 'pg_catalog.english'

# -----------------------------------------------------------------------------
# STATEMENT STATISTICS (pg_stat_statements)
# -----------------------------------------------------------------------------
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# ==============================================================================
# END OF CONFIGURATION
# ==============================================================================
