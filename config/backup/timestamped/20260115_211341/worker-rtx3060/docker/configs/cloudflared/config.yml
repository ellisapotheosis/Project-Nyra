# ==============================================================================
# Cloudflared Tunnel Configuration - Worker RTX3060
# ==============================================================================
# This config defines ingress rules for the RTX3060 worker PC
#
# Services exposed:
#   - Development UI: dynamic port (default 8091)
#   - GPU Monitoring: dynamic port (default 9836)
#   - Development workload UIs: various ports
#
# Note: When using TUNNEL_TOKEN environment variable, this config is optional.
#       Token-based tunnels get their config from Cloudflare Zero Trust dashboard.
# ==============================================================================

# Ingress rules - Define how external traffic routes to internal services
ingress:
  # Development UI Portal
  - hostname: rtx3060-dev.nyra.your-domain.com
    service: http://worker-rtx3060-dev-ui:80
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # GPU Monitoring Dashboard
  - hostname: rtx3060-gpu.nyra.your-domain.com
    service: http://worker-rtx3060-gpu-monitor:9835
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # VS Code Server (example - adjust as needed)
  - hostname: rtx3060-vscode.nyra.your-domain.com
    service: http://vscode-rtx3060:8443
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # MLflow UI (example - adjust as needed)
  - hostname: rtx3060-mlflow.nyra.your-domain.com
    service: http://mlflow-rtx3060:5000
    originRequest:
      noTLSVerify: true
      connectTimeout: 30s

  # Catch-all rule (required)
  - service: http_status:404

# Logging
loglevel: info
transport-loglevel: warn

# Metrics
metrics: 0.0.0.0:9126

# Origin configuration
originRequest:
  # Connection settings
  connectTimeout: 30s
  tcpKeepAlive: 30s
  keepAliveTimeout: 90s
  keepAliveConnections: 100

  # TLS settings
  noTLSVerify: false
  disableChunkedEncoding: false

# Autoupdate (disabled, managed by Docker)
no-autoupdate: true

# Grace period for shutdown
grace-period: 30s
