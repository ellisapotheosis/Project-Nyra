# Worker 1 Configuration - Alienware M15R7 (RTX 3060, 6GB VRAM)
# Specialization: Code generation and development tasks

worker:
  id: "worker1"
  hostname: "worker1.nyra.local"
  role: "code_specialist"
  gpu_info:
    model: "RTX 3060"
    vram_gb: 6
    compute_capability: "8.6"
    max_batch_size: 8

network:
  api_port: 8001
  litellm_port: 4001
  metrics_port: 9001
  health_port: 8081

cloudflare:
  tunnel_name: "nyra-worker1-tunnel"
  config_file: "/etc/cloudflared/worker1.yaml"
  subdomain: "worker1.nyra.ratehunter.net"

models:
  primary:
    - name: "llama-3.1-8b-instruct"
      quantization: "4-bit"
      max_context: 8192
      estimated_vram_gb: 4.2
      serving_framework: "ollama"
      priority: 1

    - name: "code-llama-7b-instruct"
      quantization: "4-bit"
      max_context: 4096
      estimated_vram_gb: 3.8
      serving_framework: "ollama"
      priority: 2

    - name: "mistral-7b-instruct-v0.3"
      quantization: "4-bit"
      max_context: 8192
      estimated_vram_gb: 3.9
      serving_framework: "ollama"
      priority: 3

  secondary:
    - name: "deepseek-coder-6.7b-instruct"
      quantization: "4-bit"
      max_context: 4096
      estimated_vram_gb: 3.5
      serving_framework: "ollama"
      priority: 4

    - name: "phi-3-medium-4k-instruct"
      quantization: "fp16"
      max_context: 4096
      estimated_vram_gb: 2.8
      serving_framework: "ollama"
      priority: 5

ollama:
  host: "0.0.0.0"
  port: 11434
  models_path: "/app/models"
  keep_alive: "5m"
  max_loaded_models: 2
  gpu_memory_fraction: 0.9

litellm:
  config:
    model_list:
      - model_name: "llama-3.1-8b"
        litellm_params:
          model: "ollama/llama-3.1-8b-instruct"
          api_base: "http://localhost:11434"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0001
          output_cost_per_token: 0.0001

      - model_name: "code-llama-7b"
        litellm_params:
          model: "ollama/code-llama-7b-instruct"
          api_base: "http://localhost:11434"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0001
          output_cost_per_token: 0.0001

      - model_name: "mistral-7b"
        litellm_params:
          model: "ollama/mistral-7b-instruct-v0.3"
          api_base: "http://localhost:11434"
          stream: true
        model_info:
          mode: "completion"
          input_cost_per_token: 0.0001
          output_cost_per_token: 0.0001

    general_settings:
      master_key: "${LITELLM_MASTER_KEY}"
      database_url: "sqlite:///app/data/litellm_worker1.db"
      ui_port: 4001

specialization:
  tasks:
    - "code_generation"
    - "debugging"
    - "code_review"
    - "refactoring"
    - "api_development"
    - "scripting"
    - "testing"

  routing_keywords:
    - "code"
    - "programming"
    - "debug"
    - "implement"
    - "function"
    - "class"
    - "api"
    - "script"
    - "test"
    - "bug"
    - "error"
    - "syntax"

performance:
  inference:
    max_concurrent_requests: 4
    request_timeout_seconds: 120
    batch_size: 2
    temperature_range: [0.1, 0.8]

  memory:
    model_cache_size: "4GB"
    kv_cache_size: "1GB"
    system_reserve_gb: 2

  optimization:
    use_flash_attention: true
    use_kv_cache: true
    quantization_backend: "bitsandbytes"
    offload_to_cpu: false

monitoring:
  metrics:
    - "gpu_utilization"
    - "vram_usage"
    - "inference_latency"
    - "requests_per_second"
    - "model_loading_time"
    - "queue_length"

  health_check:
    endpoint: "/health"
    model_validation: true
    gpu_check: true
    memory_check: true

  logging:
    level: "INFO"
    file_path: "/app/logs/worker1.log"
    max_size_mb: 100
    backup_count: 5

auto_scaling:
  enabled: true
  triggers:
    gpu_utilization_high: 85
    queue_length_high: 10
    response_time_high_ms: 3000

  actions:
    load_additional_model: true
    request_worker_spawn: false  # Limited by GPU memory
    optimize_batch_size: true

power_management:
  idle_timeout_minutes: 15
  sleep_when_idle: false  # Keep models warm
  reduce_power_on_idle: true
  wake_on_demand: true

docker:
  image: "nyra/worker-ollama:latest"
  container_name: "nyra-worker1"
  restart_policy: "unless-stopped"
  volumes:
    - "/app/models:/app/models"
    - "/app/data:/app/data"
    - "/app/logs:/app/logs"
    - "/app/config:/app/config"

  environment:
    - "NVIDIA_VISIBLE_DEVICES=0"
    - "OLLAMA_HOST=0.0.0.0"
    - "LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}"

  gpu_reservation:
    device_ids: ["0"]
    memory_limit: "5.5GB"