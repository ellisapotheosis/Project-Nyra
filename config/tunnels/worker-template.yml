# Cloudflared Tunnel Configuration Template - Worker Nodes
# This template is used for all worker nodes with variable substitution

tunnel: ${NYRA_WORKER_TUNNEL_ID}
credentials-file: /etc/cloudflared/credentials/${NYRA_WORKER_TUNNEL_ID}.json

# Ingress rules for worker services
ingress:
  # Worker GPU Compute API
  - hostname: ${WORKER_HOSTNAME}
    service: http://localhost:${GPU_API_PORT}
    originRequest:
      httpHostHeader: ${WORKER_HOSTNAME}
      connectTimeout: 30s
      tlsTimeout: 10s
      tcpKeepAlive: 30s
      keepAliveConnections: 5
      keepAliveTimeout: 90s

  # Worker Health Endpoint
  - hostname: ${WORKER_HOSTNAME}
    path: /health
    service: http://localhost:${HEALTH_PORT}
    originRequest:
      httpHostHeader: ${WORKER_HOSTNAME}
      connectTimeout: 10s

  # Catch-all rule
  - service: http_status:404

# Logging configuration
loglevel: info
transport-loglevel: warn
logfile: /var/log/cloudflared/${WORKER_NAME}.log

# Auto-update configuration
autoupdate-freq: 24h

# Metrics configuration
metrics: 0.0.0.0:${METRICS_PORT}

# Protocol optimization
protocol: auto

# Edge location preference
region: auto

# Connection limits
max-upstream-conns: 50

# Worker-specific environment variables:
# WORKER_NAME: worker1, worker2, worker3
# WORKER_HOSTNAME: worker1.ratehunter.net, worker2.ratehunter.net, worker3.ratehunter.net
# GPU_API_PORT: 8082, 8084, 8086
# HEALTH_PORT: 8083, 8085, 8087
# METRICS_PORT: 8889, 8890, 8891