# Project Nyra - PC3 GPU Worker 2
# Services: Ruvector Follower, TwentyCRM, Databases (PostgreSQL, Neo4j, FalkorDB, Qdrant)

version: '3.9'

networks:
  nyra:
    driver: bridge
    ipam:
      config:
        - subnet: 172.30.0.0/16

volumes:
  ruvector_data:
  postgres_data:
  twentycrm_data:
  neo4j_data:
  neo4j_logs:
  falkordb_data:
  qdrant_data:

services:
  # ============================================================================
  # RUVECTOR - Distributed Vector Database (Follower Node 1)
  # ============================================================================
  ruvector:
    image: ruvnet/ruvector:latest
    container_name: nyra-ruvector-follower1-pc3
    hostname: ruvector-follower1
    restart: unless-stopped
    ports:
      - "6370:6370"
      - "6371:6371"
      - "6372:6372"
    volumes:
      - ruvector_data:/data
    environment:
      - RUVECTOR_NODE_ID=follower1
      - RUVECTOR_NODE_IP=10.0.0.3
      - RUVECTOR_CLUSTER_ID=nyra-cluster
      - RUVECTOR_RAFT_PORT=6370
      - RUVECTOR_PEERS=10.0.0.2:6370,10.0.0.4:6370
      - RUVECTOR_LEADER=false
      - RUVECTOR_GNN_ENABLED=true
      - RUVECTOR_HNSW_ENABLED=true
      - RUVECTOR_LOG_LEVEL=info
    networks:
      nyra:
        ipv4_address: 172.30.0.20
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6370/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # POSTGRESQL - Main Database
  # ============================================================================
  postgres:
    image: ankane/pgvector:latest
    container_name: nyra-postgres-pc3
    hostname: postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./configs/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    environment:
      - POSTGRES_USER=nyra
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-nyra_secure_password}
      - POSTGRES_DB=nyra
    networks:
      nyra:
        ipv4_address: 172.30.0.30
    command: postgres -c shared_preload_libraries=vector -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyra"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TWENTY CRM - Database
  # ============================================================================
  twentycrm_postgres:
    image: postgres:15-alpine
    container_name: nyra-twentycrm-postgres-pc3
    hostname: twentycrm-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    volumes:
      - twentycrm_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_USER=twenty
      - POSTGRES_PASSWORD=${TWENTYCRM_POSTGRES_PASSWORD:-twenty_secure_password}
      - POSTGRES_DB=twenty
    networks:
      nyra:
        ipv4_address: 172.30.0.31
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twenty"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # TWENTY CRM - Application
  # ============================================================================
  twentycrm:
    image: twentycrm/twenty:latest
    container_name: nyra-twentycrm-pc3
    hostname: twentycrm
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PG_DATABASE_URL=postgresql://twenty:${TWENTYCRM_POSTGRES_PASSWORD:-twenty_secure_password}@twentycrm_postgres:5432/twenty
      - FRONT_BASE_URL=http://localhost:3000
      - SERVER_URL=http://localhost:3000
      - ACCESS_TOKEN_SECRET=${TWENTYCRM_ACCESS_TOKEN_SECRET:-change-me-secret-key}
      - LOGIN_TOKEN_SECRET=${TWENTYCRM_LOGIN_TOKEN_SECRET:-change-me-login-key}
      - REFRESH_TOKEN_SECRET=${TWENTYCRM_REFRESH_TOKEN_SECRET:-change-me-refresh-key}
      - FILE_TOKEN_SECRET=${TWENTYCRM_FILE_TOKEN_SECRET:-change-me-file-key}
    networks:
      nyra:
        ipv4_address: 172.30.0.32
    depends_on:
      twentycrm_postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NEO4J - Knowledge Graph Database
  # ============================================================================
  neo4j:
    image: neo4j:5-community
    container_name: nyra-neo4j-pc3
    hostname: neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    environment:
      - NEO4J_AUTH=neo4j/${NEO4J_PASSWORD:-neo4j_secure_password}
      - NEO4J_PLUGINS=["apoc", "graph-data-science"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*,gds.*
      - NEO4J_dbms_memory_heap_max__size=4G
      - NEO4J_dbms_memory_pagecache_size=2G
    networks:
      nyra:
        ipv4_address: 172.30.0.40
    healthcheck:
      test: ["CMD", "cypher-shell", "-u", "neo4j", "-p", "${NEO4J_PASSWORD:-neo4j_secure_password}", "RETURN 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  # ============================================================================
  # FALKORDB - Redis-Compatible Graph Database
  # ============================================================================
  falkordb:
    image: falkordb/falkordb:latest
    container_name: nyra-falkordb-pc3
    hostname: falkordb
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - falkordb_data:/data
    command: redis-server --appendonly yes --loadmodule /usr/lib/redis/modules/graphBLAS.so
    networks:
      nyra:
        ipv4_address: 172.30.0.50
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ============================================================================
  # QDRANT - Vector Similarity Search
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant-pc3
    hostname: qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"  # HTTP API
      - "6334:6334"  # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      nyra:
        ipv4_address: 172.30.0.60
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: nyra-node-exporter-pc3
    hostname: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      nyra:
        ipv4_address: 172.30.0.100
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
