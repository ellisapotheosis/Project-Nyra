version: '3.9'

# Project Nyra - Unified Bootstrap Docker Compose
# Comprehensive multi-service orchestration for development and production

services:
  # ============================================================================
  # Core Services
  # ============================================================================

  # PostgreSQL - Primary Database
  postgres:
    image: postgres:16-alpine
    container_name: nyra-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Redis - Caching and Queue Management
  redis:
    image: redis:7-alpine
    container_name: nyra-redis
    restart: unless-stopped
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
      --maxmemory ${REDIS_MAX_MEMORY:-512mb}
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

  # ============================================================================
  # Claude Flow & MCP Services
  # ============================================================================

  # Claude Flow - Multi-Agent Orchestration (MCP Mode)
  claude-flow:
    build:
      context: ../..
      dockerfile: bootstrap/docker/claude-flow.Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-20}
        VOLTA_VERSION: ${VOLTA_VERSION:-1.1.1}
    container_name: nyra-claude-flow
    restart: unless-stopped
    environment:
      # Core Configuration
      NODE_ENV: ${NODE_ENV:-production}
      CLAUDE_FLOW_MODE: mcp
      CLAUDE_FLOW_CONFIG: /app/claude-flow.config.json

      # API Keys (loaded from Infisical)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}

      # MCP Configuration
      CLAUDE_FLOW_MCP_PORT: ${CLAUDE_FLOW_MCP_PORT:-3000}
      CLAUDE_FLOW_MCP_HOST: ${CLAUDE_FLOW_MCP_HOST:-0.0.0.0}
      CLAUDE_FLOW_MCP_TRANSPORT: ${CLAUDE_FLOW_MCP_TRANSPORT:-stdio}

      # Memory & Intelligence
      CLAUDE_FLOW_MEMORY_BACKEND: ${CLAUDE_FLOW_MEMORY_BACKEND:-hybrid}
      CLAUDE_FLOW_MEMORY_PATH: /app/data/memory
      AGENTDB_PATH: /app/data/agentdb

      # Database Connections
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0

      # Logging
      CLAUDE_FLOW_LOG_LEVEL: ${CLAUDE_FLOW_LOG_LEVEL:-info}
      LOG_FORMAT: json
    volumes:
      - claude_flow_data:/app/data
      - claude_flow_logs:/app/logs
      - ../../submodules/claude-flow:/app/claude-flow:ro
      - type: bind
        source: ../../.claude-flow
        target: /app/.claude-flow
    ports:
      - "${CLAUDE_FLOW_MCP_PORT:-3000}:3000"
      - "${CLAUDE_FLOW_METRICS_PORT:-9090}:9090"
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================================
  # Archon OS - AI Operating System Framework
  # ============================================================================

  archon:
    build:
      context: ../..
      dockerfile: bootstrap/docker/archon.Dockerfile
      args:
        PYTHON_VERSION: ${PYTHON_VERSION:-3.11}
    container_name: nyra-archon
    restart: unless-stopped
    environment:
      # Core Configuration
      PYTHON_ENV: ${PYTHON_ENV:-production}
      ARCHON_CONFIG_PATH: /app/config

      # API Configuration
      API_HOST: ${ARCHON_API_HOST:-0.0.0.0}
      API_PORT: ${ARCHON_API_PORT:-8000}
      API_WORKERS: ${ARCHON_API_WORKERS:-4}

      # API Keys
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:?ANTHROPIC_API_KEY required}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # Database Connections
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/1

      # Logging
      LOG_LEVEL: ${ARCHON_LOG_LEVEL:-INFO}
      LOG_FORMAT: json
    volumes:
      - archon_data:/app/data
      - archon_logs:/app/logs
      - ../../tools/archon-os:/app/archon:ro
      - type: bind
        source: ../../.archon
        target: /app/.archon
    ports:
      - "${ARCHON_API_PORT:-8000}:8000"
      - "${ARCHON_METRICS_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health').read()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyra-network
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # ============================================================================
  # MCP Servers
  # ============================================================================

  # Graphiti MCP - Knowledge Graph Memory
  graphiti-mcp:
    image: ghcr.io/getzep/graphiti:latest
    container_name: nyra-graphiti-mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${GRAPHITI_LOG_LEVEL:-info}
    volumes:
      - graphiti_data:/data
    ports:
      - "${GRAPHITI_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyra-network

  # Mem0 MCP - Long-term Memory
  mem0-mcp:
    image: mem0ai/mem0:latest
    container_name: nyra-mem0-mcp
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/2
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LOG_LEVEL: ${MEM0_LOG_LEVEL:-info}
    volumes:
      - mem0_data:/data
    ports:
      - "${MEM0_PORT:-8002}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyra-network

  # Infisical - Secret Management
  infisical:
    image: infisical/infisical:latest
    container_name: nyra-infisical
    restart: unless-stopped
    environment:
      ENCRYPTION_KEY: ${INFISICAL_ENCRYPTION_KEY:?INFISICAL_ENCRYPTION_KEY required}
      JWT_SECRET: ${INFISICAL_JWT_SECRET:?INFISICAL_JWT_SECRET required}
      MONGO_URL: mongodb://mongo:27017/infisical
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/3
      SITE_URL: ${INFISICAL_SITE_URL:-http://localhost:8080}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS:-}
    volumes:
      - infisical_data:/data
    ports:
      - "${INFISICAL_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/status"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nyra-network

  # MongoDB for Infisical
  mongo:
    image: mongo:7
    container_name: nyra-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD required}
    volumes:
      - mongo_data:/data/db
    ports:
      - "${MONGO_PORT:-27017}:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - nyra-network

  # ============================================================================
  # Development & Automation Tools
  # ============================================================================

  # Gitea - Self-hosted Git Service
  gitea:
    image: gitea/gitea:latest
    container_name: nyra-gitea
    restart: unless-stopped
    environment:
      USER_UID: 1000
      USER_GID: 1000
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${POSTGRES_DB:-nyra}
      GITEA__database__USER: ${POSTGRES_USER:-nyra}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
      GITEA__server__ROOT_URL: ${GITEA_ROOT_URL:-http://localhost:3001}
      GITEA__server__SSH_DOMAIN: ${GITEA_SSH_DOMAIN:-localhost}
      GITEA__server__DOMAIN: ${GITEA_DOMAIN:-localhost}
      GITEA__server__HTTP_PORT: 3000
      GITEA__server__SSH_PORT: 22
    volumes:
      - gitea_data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "${GITEA_HTTP_PORT:-3001}:3000"
      - "${GITEA_SSH_PORT:-2222}:22"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyra-network

  # n8n - Workflow Automation
  n8n:
    image: n8nio/n8n:latest
    container_name: nyra-n8n
    restart: unless-stopped
    environment:
      N8N_PROTOCOL: ${N8N_PROTOCOL:-http}
      N8N_HOST: ${N8N_HOST:-localhost}
      N8N_PORT: 5678
      N8N_BASIC_AUTH_ACTIVE: ${N8N_BASIC_AUTH_ACTIVE:-true}
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:?N8N_BASIC_AUTH_PASSWORD required}
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: postgres
      DB_POSTGRESDB_PORT: 5432
      DB_POSTGRESDB_DATABASE: ${POSTGRES_DB:-nyra}
      DB_POSTGRESDB_USER: ${POSTGRES_USER:-nyra}
      DB_POSTGRESDB_PASSWORD: ${POSTGRES_PASSWORD}
      EXECUTIONS_DATA_SAVE_ON_ERROR: all
      EXECUTIONS_DATA_SAVE_ON_SUCCESS: all
      GENERIC_TIMEZONE: ${TIMEZONE:-UTC}
    volumes:
      - n8n_data:/home/node/.n8n
      - n8n_local_files:/files
    ports:
      - "${N8N_PORT:-5678}:5678"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5678/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - nyra-network

# ============================================================================
# Networks
# ============================================================================

networks:
  nyra-network:
    driver: bridge
    ipam:
      config:
        - subnet: ${DOCKER_SUBNET:-172.20.0.0/16}
    driver_opts:
      com.docker.network.bridge.name: nyra-br0

# ============================================================================
# Volumes
# ============================================================================

volumes:
  # Database Volumes
  postgres_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/postgres

  redis_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/redis

  mongo_data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_DIR:-./data}/mongo

  # Application Volumes
  claude_flow_data:
    driver: local

  claude_flow_logs:
    driver: local

  archon_data:
    driver: local

  archon_logs:
    driver: local

  # MCP Server Volumes
  graphiti_data:
    driver: local

  mem0_data:
    driver: local

  infisical_data:
    driver: local

  # Tool Volumes
  gitea_data:
    driver: local

  n8n_data:
    driver: local

  n8n_local_files:
    driver: local
