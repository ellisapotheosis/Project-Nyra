# NYRA Client - UI and GPU-Intensive Services
# Runs on RTX3060/RTX5090 PCs for UI and compute-intensive tasks

version: '3.8'

services:
  # Archon OS - UI Components
  archon-frontend:
    build:
      context: ../../submodules/archon/frontend
      dockerfile: Dockerfile
    container_name: nyra-archon-frontend
    ports:
      - "8051:3000"
    environment:
      - REACT_APP_ARCHON_API=http://archon-backend:8080
      - REACT_APP_CLAUDE_FLOW_API=http://host.docker.internal:7403
    depends_on:
      - archon-backend
    restart: unless-stopped
    networks:
      - nyra-client-net

  archon-backend:
    build:
      context: ../../submodules/archon/backend
      dockerfile: Dockerfile
    container_name: nyra-archon-backend
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgres://postgres:postgres@archon-db:5432/archon
      - CLAUDE_FLOW_ENDPOINT=http://host.docker.internal:7403
    depends_on:
      - archon-db
    restart: unless-stopped
    networks:
      - nyra-client-net

  archon-db:
    image: postgres:15-alpine
    container_name: nyra-archon-db
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_DB=archon
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - archon-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nyra-client-net

  archon-redis:
    image: redis:7-alpine
    container_name: nyra-archon-redis
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - nyra-client-net

  # Neural Processing Services (GPU-enabled)
  transformers-service:
    image: huggingface/transformers:latest-gpu
    container_name: nyra-transformers
    ports:
      - "8090:8080"
    environment:
      - CUDA_VISIBLE_DEVICES=0
      - TRANSFORMERS_CACHE=/cache
      - MODEL_NAME=microsoft/DialoGPT-medium
    volumes:
      - transformers-cache:/cache
      - /dev/nvidia0:/dev/nvidia0
    runtime: nvidia
    restart: unless-stopped
    networks:
      - nyra-client-net

  onnx-runtime:
    image: mcr.microsoft.com/onnxruntime/server:latest-cuda
    container_name: nyra-onnx-runtime
    ports:
      - "8091:8001"
    environment:
      - CUDA_VISIBLE_DEVICES=0
    volumes:
      - onnx-models:/models
    runtime: nvidia
    restart: unless-stopped
    networks:
      - nyra-client-net

  # Development Tools UI
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-open-webui
    ports:
      - "3000:8080"
    environment:
      - WEBUI_NAME=NYRA Development UI
      - WEBUI_URL=http://localhost:3000
    volumes:
      - open-webui-data:/app/backend/data
    restart: unless-stopped
    networks:
      - nyra-client-net

  # Missing MCP Servers (Client-side)
  serena-mcp:
    build:
      context: ../../submodules/serena-mcp
      dockerfile: Dockerfile
    container_name: nyra-serena-mcp
    ports:
      - "8092:8080"
    environment:
      - SERENA_MODE=assistant
    restart: unless-stopped
    networks:
      - nyra-client-net

  gemini-assistant-mcp:
    image: mgabr/gemini-mcp-server:latest
    container_name: nyra-gemini-assistant
    ports:
      - "8093:8080"
    environment:
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - VERTEX_AI_PROJECT=${VERTEX_AI_PROJECT}
    restart: unless-stopped
    networks:
      - nyra-client-net

networks:
  nyra-client-net:
    driver: bridge
    external: false

volumes:
  archon-db-data:
  transformers-cache:
  onnx-models:
  open-webui-data: