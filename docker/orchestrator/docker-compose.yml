# NYRA Orchestrator - MCP Server Infrastructure
# Runs on orchestrator PC, serves MCP endpoints to all client PCs

version: '3.8'

services:
  # Core Infrastructure
  metamcp-router:
    image: metatool-ai/metamcp:latest
    container_name: nyra-metamcp-router
    ports:
      - "12008:8080"
    environment:
      - METAMCP_CONFIG_PATH=/config/metamcp.config.json
    volumes:
      - ../config/metamcp:/config
      - ./data:/data
    restart: unless-stopped
    networks:
      - nyra-net

  # Claude-Flow Development Clone
  claude-flow-dev:
    build:
      context: ../../submodules/claude-flow
      dockerfile: Dockerfile.dev
    container_name: nyra-claude-flow-dev
    ports:
      - "7403:3000"
    environment:
      - NODE_ENV=development
      - CLAUDE_FLOW_MODE=development
      - DATABASE_URL=postgres://postgres:postgres@claude-flow-db:5432/claude_flow_dev
    volumes:
      - ../../submodules/claude-flow:/app
      - /app/node_modules
      - claude-flow-data:/data
    depends_on:
      - claude-flow-db
    restart: unless-stopped
    networks:
      - nyra-net

  claude-flow-db:
    image: postgres:15-alpine
    container_name: nyra-claude-flow-db
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=claude_flow_dev
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - claude-flow-db-data:/var/lib/postgresql/data
    restart: unless-stopped
    networks:
      - nyra-net

  # Memory Infrastructure
  ruvector-mcp:
    image: ruvnet/ruvector:latest
    container_name: nyra-ruvector-mcp
    ports:
      - "7406:8080"
    environment:
      - RUVECTOR_MODE=mcp_server
      - RUVECTOR_QUANTIZATION=true
      - RUVECTOR_HNSW_INDEX=true
    volumes:
      - ruvector-data:/data
    restart: unless-stopped
    networks:
      - nyra-net

  agentdb-mcp:
    image: ruvnet/agentdb:latest
    container_name: nyra-agentdb-mcp
    ports:
      - "7407:8080"
    environment:
      - AGENTDB_MODE=mcp_server
      - AGENTDB_VECTOR_ENABLED=true
      - AGENTDB_PERFORMANCE_MODE=fast
    volumes:
      - agentdb-data:/data
    restart: unless-stopped
    networks:
      - nyra-net

  graphiti-mcp:
    image: getzep/graphiti:latest
    container_name: nyra-graphiti-mcp
    ports:
      - "8797:8797"
    environment:
      - GRAPHITI_HOST=0.0.0.0
      - GRAPHITI_PORT=8797
      - GRAPHITI_TEMPORAL_ENABLED=true
    volumes:
      - graphiti-data:/data
    restart: unless-stopped
    networks:
      - nyra-net

  # Flow Nexus (Cloud Integration)
  flow-nexus:
    image: ruvnet/flow-nexus:latest
    container_name: nyra-flow-nexus
    ports:
      - "7401:3000"
    environment:
      - FLOW_NEXUS_MODE=complete
      - FLOW_NEXUS_TOOLS=94
    restart: unless-stopped
    networks:
      - nyra-net

  # Standard MCP Servers
  filesystem-mcp:
    image: modelcontextprotocol/server-filesystem:latest
    container_name: nyra-filesystem-mcp
    ports:
      - "7400:8080"
    environment:
      - MCP_ROOTS=/workspace
    volumes:
      - C:\Dev\Projects\Repos\Project-Nyra:/workspace:ro
    restart: unless-stopped
    networks:
      - nyra-net

  github-mcp:
    image: modelcontextprotocol/server-github:latest
    container_name: nyra-github-mcp
    ports:
      - "7402:8080"
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
    restart: unless-stopped
    networks:
      - nyra-net

  # Security & Secrets
  infisical-mcp:
    image: infisical/mcp-server:latest
    container_name: nyra-infisical-mcp
    ports:
      - "7404:8080"
    environment:
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_ID=${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}
      - INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET=${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}
    restart: unless-stopped
    networks:
      - nyra-net

  bitwarden-mcp:
    image: bitwarden/mcp-server:latest
    container_name: nyra-bitwarden-mcp
    ports:
      - "7405:8080"
    environment:
      - BW_SESSION=${BW_SESSION}
    restart: unless-stopped
    networks:
      - nyra-net

networks:
  nyra-net:
    driver: bridge
    external: false

volumes:
  claude-flow-data:
  claude-flow-db-data:
  ruvector-data:
  agentdb-data:
  graphiti-data: