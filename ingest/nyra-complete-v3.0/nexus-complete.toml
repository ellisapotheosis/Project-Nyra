  "letta.create_agent",
  "letta.send_message",
  "letta.get_agent_state",
  "letta.list_agents"
]

# Dify - LLM Application Platform
[[mcp.servers]]
name = "dify"
url = "http://dify:5001/mcp"
transport = "http"
auth = { type = "bearer", token = "${DIFY_API_KEY}" }
description = "Dify AI application workflows and chat interfaces"
keywords = ["dify", "workflow", "app", "chat", "AI", "application"]
enabled = true
priority = 2
tools = [
  "dify.run_workflow",
  "dify.chat",
  "dify.get_app_info"
]

# ==============================================================================
# 4. FUZZY SEARCH KEYWORD ALIASES
# ==============================================================================
# Improve tool discovery by recognizing synonyms

[fuzzy]
enabled = true
threshold = 0.7
algorithm = "levenshtein"

# Mortgage domain keywords
keyword_aliases = {
  # Borrower/Customer
  borrower = ["customer", "applicant", "client", "prospect", "buyer", "homebuyer", "individual", "person"],
  customer = ["borrower", "client", "applicant", "prospect", "lead"],
  lead = ["prospect", "borrower", "applicant", "customer", "inquiry"],
  
  # Loan/Mortgage
  loan = ["mortgage", "financing", "credit", "debt", "borrowing", "lending"],
  mortgage = ["loan", "home loan", "financing", "property loan"],
  rate = ["interest", "APR", "percentage", "pricing", "cost"],
  
  # CRM/Contact
  contact = ["borrower", "customer", "person", "individual", "lead"],
  deal = ["loan", "mortgage", "transaction", "opportunity"],
  
  # Documents
  document = ["file", "paper", "record", "upload", "attachment"],
  file = ["document", "paper", "record", "attachment"],
  
  # Communication
  message = ["email", "SMS", "text", "communication", "notification"],
  email = ["message", "mail", "correspondence"],
  SMS = ["text", "message", "mobile message"],
  
  # Operations
  workflow = ["automation", "process", "flow", "pipeline"],
  automation = ["workflow", "process", "automated"],
  trigger = ["start", "execute", "run", "initiate"],
  
  # Search/Find
  search = ["find", "lookup", "query", "retrieve", "locate"],
  find = ["search", "lookup", "locate", "discover"],
  
  # Code/Development
  code = ["programming", "source", "script", "function"],
  deploy = ["launch", "release", "push", "run"],
}

# ==============================================================================
# 5. RATE LIMITING
# ==============================================================================

[rate_limit]
enabled = true

# Global rate limit (all clients combined)
[rate_limit.global]
requests_per_minute = 1000
burst = 10

# Per-IP rate limit
[rate_limit.per_ip]
requests_per_minute = 100
burst = 5

# Per-server rate limit (MCP server)
[rate_limit.per_server]
requests_per_minute = 50
burst = 3

# Per-tool rate limit
[rate_limit.per_tool]
requests_per_minute = 20
burst = 2

# Per-user rate limit
[rate_limit.per_user]
requests_per_minute = 100
burst = 5

# ==============================================================================
# 6. SECURITY & AUTHENTICATION
# ==============================================================================

[security]
jwt_secret = "${NEXUS_JWT_SECRET}"
jwt_algorithm = "HS256"
jwt_expiry = 3600  # 1 hour
admin_token = "${NEXUS_ADMIN_TOKEN}"

# API key validation
validate_api_keys = true
api_key_header = "X-API-Key"

# CORS configuration
[security.cors]
enabled = true
allow_origins = [
  "http://localhost:*",
  "http://127.0.0.1:*",
  "https://*.ratehunter.net",
  "https://ratehunter.net"
]
allow_methods = ["GET", "POST", "PUT", "DELETE", "OPTIONS"]
allow_headers = ["Authorization", "Content-Type", "X-Request-ID", "X-API-Key"]
allow_credentials = true

# ==============================================================================
# 7. OBSERVABILITY & LOGGING
# ==============================================================================

[observability]
enabled = true

[observability.metrics]
enabled = true
endpoint = "http://prometheus:9090"
job_name = "nexus-router"
scrape_interval = 15

[observability.logging]
level = "info"
format = "json"
output = "stdout"
sentry_enabled = false

[observability.tracing]
enabled = true
jaeger_endpoint = "http://jaeger:6831"
service_name = "nexus-router"

# ==============================================================================
# 8. HEALTH CHECKS
# ==============================================================================

[health]
enabled = true
endpoint = "/health"
check_mcp_servers = true
check_llm_providers = true
check_redis = true
interval = 30  # seconds

# ==============================================================================
# END OF NEXUS ROUTER CONFIGURATION
# ==============================================================================
