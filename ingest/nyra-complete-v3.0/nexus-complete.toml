# ==============================================================================
# NEXUS ROUTER - COMPLETE CONFIGURATION v2.0
# ==============================================================================
# Central MCP aggregation hub + intelligent LLM routing
# Generated: 2026-02-28
# For: Project Nyra (4-PC Distributed Mortgage Platform)
# ==============================================================================

[server]
# Listen on all interfaces for Docker/external access
address = "0.0.0.0:6000"
admin_port = 6001
admin_token = "${NEXUS_ADMIN_TOKEN}"
jwt_secret = "${NEXUS_JWT_SECRET}"

# Logging
log_level = "info"
log_format = "json"

# Performance
max_body_size = 10485760  # 10MB
timeout = 120             # 2 minutes
max_connections = 1000

# ==============================================================================
# 1. UNIFIED LLM API
# ==============================================================================
# Provides OpenAI-compatible endpoint at /llm/v1
# Intelligently routes to local GPU workers (80%) or cloud providers (20%)

[llm]
enabled = true
path = "/llm/v1"
default_model = "gemini-flash"

# Routing strategy: cost-optimized | quality-optimized | latency-optimized
routing_strategy = "cost-optimized"
prefer_local = true        # Route to local GPUs when available
fallback_cloud = true      # Fallback to cloud if local unavailable
cost_threshold = 0.10      # USD per 1K tokens

# ===== CLOUD PROVIDERS (20% for fallback) =====

[[llm.providers]]
name = "anthropic"
type = "anthropic"
api_key = "${ANTHROPIC_API_KEY}"
base_url = "https://api.anthropic.com/v1"
priority = 2
models = [
  "claude-opus-4-5-20251101",
  "claude-sonnet-4-5-20250929",
  "claude-3-haiku-20240307"
]
cost_per_million_input = 3.00
cost_per_million_output = 15.00
use_cases = [
  "complex_reasoning",
  "code_generation",
  "architecture_planning",
  "compliance_checking"
]

[[llm.providers]]
name = "google"
type = "google"
api_key = "${GOOGLE_API_KEY}"
base_url = "https://generativelanguage.googleapis.com/v1beta"
priority = 1
models = [
  "gemini-2.0-flash-exp",
  "gemini-2.0-pro",
  "gemini-1.5-pro"
]
cost_per_million_input = 0.075
cost_per_million_output = 0.30
use_cases = [
  "document_classification",
  "lead_scoring",
  "data_extraction",
  "routine_queries"
]

[[llm.providers]]
name = "openrouter"
type = "openai_compatible"
api_key = "${OPENROUTER_API_KEY}"
base_url = "https://openrouter.ai/api/v1"
priority = 3
models = [
  "deepseek/deepseek-r1",
  "anthropic/claude-3.5-sonnet",
  "google/gemini-pro-1.5",
  "meta-llama/llama-3.1-405b"
]
use_cases = ["specialized_models", "fallback"]

# ===== LOCAL GPU WORKERS (80% primary) =====

[[llm.workers]]
name = "gpu-5090"
url = "${WORKER_5090_URL}"
priority = 1
vram_gb = 32
models = ["deepseek-r1:236b-q4_K_M", "qwen2.5:72b-instruct-q8_0"]
primary_use = "reasoning"
max_concurrent = 4
timeout = 300000  # 5 minutes for large models

[[llm.workers]]
name = "gpu-3090"
url = "${WORKER_3090_URL}"
priority = 2
vram_gb = 24
models = ["llama3.1:70b-instruct-q4_K_M", "mistral-large:123b-instruct-q4_K_M"]
primary_use = "analysis"
max_concurrent = 6
timeout = 180000

[[llm.workers]]
name = "gpu-3060"
url = "${WORKER_3060_URL}"
priority = 3
vram_gb = 12
models = ["codellama:34b-instruct-q4", "qwen2.5:32b-instruct-q4"]
primary_use = "coding"
max_concurrent = 8
timeout = 90000

# ===== INTELLIGENT ROUTING RULES =====

[[llm.routing_rules]]
name = "cheap_simple_tasks"
condition = { token_count = "<1000", complexity = "low" }
route_to = "gemini-flash"
weight = 0.1  # Cost optimization

[[llm.routing_rules]]
name = "complex_reasoning"
condition = { keywords = ["plan", "architect", "design", "strategize", "complex"], complexity = "high" }
route_to = "gpu-5090"
weight = 0.8  # Prefer local reasoning

[[llm.routing_rules]]
name = "code_generation"
condition = { keywords = ["code", "implement", "function", "class", "API"], tool_use = true }
route_to = "gpu-3060"  # Efficient for coding tasks
weight = 0.7

[[llm.routing_rules]]
name = "document_processing"
condition = { keywords = ["classify", "extract", "score", "summarize"], token_count = "<5000" }
route_to = "gemini-flash"
weight = 0.1  # Cost-effective for high-volume

[[llm.routing_rules]]
name = "borrower_interaction"
condition = { keywords = ["borrower", "customer", "client", "lead"], context = "conversational" }
route_to = "gpu-3060"  # Fast response
weight = 0.7

[[llm.routing_rules]]
name = "compliance_check"
condition = { keywords = ["compliance", "regulation", "TCPA", "TRID", "audit"], requires = "high_confidence" }
route_to = "claude-opus"  # Most reliable
weight = 0.95

# ==============================================================================
# 2. REDIS CACHING
# ==============================================================================

[cache]
enabled = true
type = "redis"
url = "${NEXUS_REDIS_URL}"
ttl = 3600            # 1 hour
prefix = "nexus:"
deduplicate = true    # Deduplicate identical requests

# Cache LLM responses (same prompt within TTL)
cache_llm_responses = true
cache_llm_ttl = 7200  # 2 hours

# Cache MCP tool results (deterministic operations)
cache_tool_results = true
cache_tool_ttl = 1800  # 30 minutes

# ==============================================================================
# 3. MCP SERVER AGGREGATION
# ==============================================================================
# Smart tool discovery + fuzzy matching enabled

[mcp]
enabled = true
path = "/mcp"
fuzzy_search = true
search_threshold = 0.6
fuzzy_algorithm = "levenshtein"

# ===== CORE MCP SERVERS =====

# Memory & Knowledge Systems
[[mcp.servers]]
name = "graphiti"
url = "http://graphiti-mcp:8000"
transport = "sse"
description = "Temporal knowledge graph with relationship tracking"
keywords = ["knowledge", "graph", "memory", "temporal", "relationship", "facts"]
enabled = true
priority = 1
tools = [
  "graphiti.create_entity",
  "graphiti.create_relation",
  "graphiti.search_graph",
  "graphiti.get_entity_timeline",
  "graphiti.query_relationships"
]

# Vector Search & Embeddings
[[mcp.servers]]
name = "qdrant"
url = "http://qdrant-mcp:6333"
transport = "http"
description = "Vector database for semantic search and embeddings"
keywords = ["vector", "search", "embedding", "semantic", "similarity", "retrieval"]
enabled = true
priority = 1
tools = [
  "qdrant.search",
  "qdrant.insert",
  "qdrant.create_collection",
  "qdrant.delete",
  "qdrant.batch_search"
]

# Infisical - Secrets Management
[[mcp.servers]]
name = "infisical"
url = "http://infisical-mcp:8006"
transport = "http"
auth = { type = "bearer", token = "${INFISICAL_MCP_TOKEN}" }
description = "Secrets management and injection via Infisical"
keywords = ["secrets", "credentials", "passwords", "tokens", "environment", "config"]
enabled = true
priority = 2
tools = [
  "infisical.get_secret",
  "infisical.set_secret",
  "infisical.list_secrets",
  "infisical.delete_secret",
  "infisical.rotate_secret"
]

# Docker Toolkit - Container & Filesystem Access
[[mcp.servers]]
name = "docker-toolkit"
url = "http://docker-mcp:8811"
transport = "http"
description = "Docker container management + filesystem access via Docker socket"
keywords = ["docker", "container", "image", "filesystem", "file", "build", "deploy"]
enabled = true
priority = 1
tools = [
  "docker.list_containers",
  "docker.list_images",
  "docker.inspect_container",
  "docker.execute_command",
  "docker.get_logs",
  "filesystem.read",
  "filesystem.write",
  "filesystem.list",
  "filesystem.delete",
  "filesystem.create_directory"
]

# Filesystem - File Operations
[[mcp.servers]]
name = "filesystem"
url = "http://filesystem-mcp:8080"
transport = "http"
description = "File system read/write operations"
keywords = ["file", "directory", "read", "write", "filesystem", "path", "upload", "download"]
enabled = true
priority = 2
tools = [
  "filesystem.read",
  "filesystem.write",
  "filesystem.list",
  "filesystem.delete",
  "filesystem.stat",
  "filesystem.search"
]

# GitHub - Repository Automation
[[mcp.servers]]
name = "github"
url = "http://github-mcp:8050"
transport = "http"
auth = { type = "bearer", token = "${GITHUB_TOKEN}" }
description = "GitHub API for issues, PRs, and repository automation"
keywords = ["github", "git", "repo", "issue", "PR", "pull request", "commit", "branch"]
enabled = true
priority = 2
tools = [
  "github.create_issue",
  "github.create_pr",
  "github.comment_issue",
  "github.list_issues",
  "github.get_repo",
  "github.search_repos"
]

# Composio - 80+ Integrations
[[mcp.servers]]
name = "composio"
url = "http://composio-mcp:8086"
transport = "http"
auth = { type = "api_key", key = "${COMPOSIO_API_KEY}" }
description = "80+ third-party service integrations (Slack, Gmail, Asana, etc)"
keywords = ["integration", "third-party", "service", "API", "connect", "automation", "slack", "email", "crm"]
enabled = true
priority = 3
tools = [
  "composio.execute_action",
  "composio.list_integrations",
  "composio.get_connection",
  "composio.create_connection",
  "composio.list_actions"
]

# TwentyCRM - CRM Operations
[[mcp.servers]]
name = "twentycrm"
url = "http://twentycrm-mcp:8082"
transport = "http"
auth = { type = "api_key", key = "${TWENTYCRM_API_KEY}" }
description = "TwentyCRM operations for leads, contacts, and deals"
keywords = ["CRM", "contact", "lead", "deal", "customer", "borrower", "company", "activity"]
enabled = true
priority = 1
tools = [
  "twentycrm.create_contact",
  "twentycrm.update_contact",
  "twentycrm.search_contacts",
  "twentycrm.create_task",
  "twentycrm.update_deal",
  "twentycrm.list_deals",
  "twentycrm.create_activity"
]

# n8n - Workflow Orchestration
[[mcp.servers]]
name = "n8n"
url = "http://n8n:5678/mcp"
transport = "http"
auth = { type = "api_key", key = "${N8N_API_KEY}" }
description = "n8n workflow execution and management"
