  "n8n.trigger_workflow",
  "n8n.list_workflows",
  "n8n.get_execution",
  "n8n.list_executions"
]

# Activepieces - Approval Workflows & Approvals
[[mcp.servers]]
name = "activepieces"
url = "http://activepieces:80/mcp"
transport = "http"
auth = { type = "bearer", token = "${ACTIVEPIECES_API_KEY}" }
description = "Workflow automation with human-in-loop approvals"
keywords = ["workflow", "automation", "approval", "activepieces", "message", "email", "SMS"]
enabled = true
priority = 2
tools = [
  "activepieces.send_message",
  "activepieces.create_approval",
  "activepieces.get_approval",
  "activepieces.trigger_flow"
]

# Mem0 - Conversational Memory
[[mcp.servers]]
name = "mem0"
url = "http://mem0:5000"
transport = "http"
auth = { type = "api_key", key = "${MEM0_API_KEY}" }
description = "Persistent conversational memory and user profiles"
keywords = ["memory", "conversation", "profile", "user", "preference", "recall"]
enabled = true
priority = 2
tools = [
  "mem0.create_memory",
  "mem0.search_memories",
  "mem0.update_memory",
  "mem0.delete_memory",
  "mem0.get_user_profile"
]

# Letta - AI Agent Framework
[[mcp.servers]]
name = "letta"
