# Project Nyra - Apotheosis AI Development Stack
# Advanced AI development tools and infrastructure
# Based on: apotheosis_superstack

version: '3.9'

services:
  # ============================================================
  # Development Infrastructure
  # ============================================================

  postgres-dev:
    image: postgres:16
    container_name: nyra-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DEV_POSTGRES_DB:-gitea}
      POSTGRES_USER: ${DEV_POSTGRES_USER:-gitea}
      POSTGRES_PASSWORD: ${DEV_POSTGRES_PASSWORD:-gitea_pass}
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - apotheosis-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${DEV_POSTGRES_USER} -d $${DEV_POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================
  # Git Service (Gitea)
  # ============================================================

  gitea:
    image: gitea/gitea:latest
    container_name: nyra-gitea
    restart: unless-stopped
    ports:
      - "3000:3000"
      - "2222:22"
    environment:
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres-dev:5432
      GITEA__database__USER: ${DEV_POSTGRES_USER:-gitea}
      GITEA__database__PASSWD: ${DEV_POSTGRES_PASSWORD:-gitea_pass}
      GITEA__database__NAME: ${DEV_POSTGRES_DB:-gitea}
      GITEA__server__ROOT_URL: http://${DOMAIN:-localhost}:3000
      GITEA__server__SSH_DOMAIN: ${DOMAIN:-localhost}
      GITEA__server__SSH_PORT: 2222
    volumes:
      - gitea_data:/data
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - apotheosis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # AI Vector Database (Qdrant)
  # ============================================================

  qdrant:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - apotheosis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # AI Code Reviewer (Qodo Merge)
  # ============================================================

  qodo-merge:
    image: qodoai/qodo-merge:latest
    container_name: nyra-qodo
    restart: unless-stopped
    ports:
      - "5600:5600"
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    volumes:
      - qodo_data:/app/data
    networks:
      - apotheosis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5600/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # Flow Orchestrator (AI Agent Coordination)
  # ============================================================

  flow-orchestrator:
    build:
      context: ../stacks/apotheosis/orchestrator
      dockerfile: Dockerfile
    container_name: nyra-flow-orchestrator
    restart: unless-stopped
    ports:
      - "8500:8500"
    environment:
      DATABASE_URL: postgresql://${DEV_POSTGRES_USER:-gitea}:${DEV_POSTGRES_PASSWORD:-gitea_pass}@postgres-dev:5432/${DEV_POSTGRES_DB:-gitea}
      QDRANT_URL: http://qdrant:6333
      GITEA_URL: http://gitea:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      LOG_LEVEL: INFO
    volumes:
      - ../stacks/apotheosis/orchestrator/agents:/app/agents
      - ../stacks/apotheosis/orchestrator/flows:/app/flows
      - ../stacks/apotheosis/orchestrator/config:/app/config
    depends_on:
      postgres-dev:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      gitea:
        condition: service_healthy
    networks:
      - apotheosis-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================
  # AI Development Tools
  # ============================================================

  # Vector Search Interface
  qdrant-dashboard:
    image: qdrant/qdrant:latest
    container_name: nyra-qdrant-dashboard
    restart: unless-stopped
    ports:
      - "6336:6333"
    command: ["qdrant", "--web-ui"]
    depends_on:
      - qdrant
    networks:
      - apotheosis-network

  # Code Quality Monitor
  sonarqube:
    image: sonarqube:lts-community
    container_name: nyra-sonarqube
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      SONAR_JDBC_URL: jdbc:postgresql://postgres-dev:5432/sonar
      SONAR_JDBC_USERNAME: ${DEV_POSTGRES_USER:-gitea}
      SONAR_JDBC_PASSWORD: ${DEV_POSTGRES_PASSWORD:-gitea_pass}
    volumes:
      - sonar_data:/opt/sonarqube/data
      - sonar_logs:/opt/sonarqube/logs
      - sonar_extensions:/opt/sonarqube/extensions
    depends_on:
      postgres-dev:
        condition: service_healthy
    networks:
      - apotheosis-network
    profiles: ["quality"]

  # ============================================================
  # AI Model Serving (Optional)
  # ============================================================

  ollama:
    image: ollama/ollama:latest
    container_name: nyra-ollama-apotheosis
    restart: unless-stopped
    ports:
      - "11434:11434"
    environment:
      OLLAMA_HOST: 0.0.0.0
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - apotheosis-network
    profiles: ["ai-models"]
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Open WebUI for Ollama
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: nyra-open-webui
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open_webui_data:/app/backend/data
    depends_on:
      - ollama
    networks:
      - apotheosis-network
    profiles: ["ai-models"]

# ============================================================
# Networks and Volumes
# ============================================================

networks:
  apotheosis-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.21.0.0/16

volumes:
  postgres_dev_data:
    driver: local
  gitea_data:
    driver: local
  qdrant_data:
    driver: local
  qodo_data:
    driver: local
  sonar_data:
    driver: local
  sonar_logs:
    driver: local
  sonar_extensions:
    driver: local
  ollama_data:
    driver: local
  open_webui_data:
    driver: local

# ============================================================
# DEPLOYMENT COMMANDS
# ============================================================

# Basic Development Stack:
# docker-compose -f infra/compose/docker-compose.apotheosis.yml up -d

# With Code Quality Tools:
# docker-compose -f infra/compose/docker-compose.apotheosis.yml --profile quality up -d

# Full AI Development Stack:
# docker-compose -f infra/compose/docker-compose.apotheosis.yml --profile quality --profile ai-models up -d

# ============================================================
# ACCESS POINTS
# ============================================================

# Gitea (Git Service):           http://localhost:3000
# Qdrant (Vector DB):            http://localhost:6333
# Qdrant Dashboard:              http://localhost:6336
# Qodo Merge (AI Review):        http://localhost:5600
# Flow Orchestrator:             http://localhost:8500
# SonarQube (Quality):           http://localhost:9000
# Ollama (Local LLM):            http://localhost:11434
# Open WebUI (Chat Interface):   http://localhost:8080