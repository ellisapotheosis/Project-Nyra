name: nyra-worker-rtx5090

services:
  redis-lmcache:
    image: redis:7-alpine
    container_name: nyra-worker-5090-redis-lmcache
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    volumes:
      - ./redis_data:/data
      - ../workers/common/redis-lmcache.conf:/usr/local/etc/redis/redis.conf:ro
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [worker-net]

  vllm-lmcache:
    build:
      context: ..
      dockerfile: worker-rtx5090/Dockerfile.blackwell-src
    image: nyra/vllm-lmcache:rtx5090-blackwell
    container_name: nyra-worker-5090-vllm
    restart: unless-stopped
    gpus: all
    ipc: host
    shm_size: "32gb"
    env_file:
      - ../configs/env/.env.worker-rtx5090.example
    environment:
      LMCACHE_CONFIG_FILE: /opt/nyra/lmcache_config.yaml
      VLLM_USE_V1: "1"
      NVIDIA_VISIBLE_DEVICES: ${NVIDIA_VISIBLE_DEVICES:-all}
      NVIDIA_DRIVER_CAPABILITIES: ${NVIDIA_DRIVER_CAPABILITIES:-compute,utility}
    volumes:
      - ./data/hf-cache:/root/.cache/huggingface
      - ./logs:/var/log/nyra
      - ../workers/common/lmcache_config.yaml:/opt/nyra/lmcache_config.yaml:ro
    ports:
      - "${VLLM_PORT:-8000}:8000"
    depends_on:
      redis-lmcache:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:${VLLM_PORT:-8000}/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 120s
    networks: [worker-net]

  node-exporter:
    image: prom/node-exporter:latest
    container_name: nyra-worker-5090-node-exporter
    restart: unless-stopped
    command: ["--path.rootfs=/host"]
    pid: host
    volumes:
      - /:/host:ro,rslave
    ports:
      - "${EXPORTER_PORT:-9100}:9100"
    networks: [worker-net]
    profiles: ["metrics"]

networks:
  worker-net:
    driver: bridge
