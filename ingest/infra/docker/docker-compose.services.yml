# Application microservices overlay (based on uploaded docker-compose.services.yml)
# Uses repo-relative build contexts (services/*)
services:
  quote-engine:
    build:
      context: ../..
      dockerfile: services/quote-engine/Dockerfile
    image: nyra/quote-engine:local
    env_file: [../configs/env/.env.orchestrator.example]
    environment:
      PORT: 3002
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/9
      NEXUS_BASE_URL: http://nexus:6000
    ports: ["3002:3002"]
    networks: [nyra-network]
    depends_on: [postgres, redis, nexus]

  campaign-engine:
    build:
      context: ../..
      dockerfile: services/campaign-engine/Dockerfile
    image: nyra/campaign-engine:local
    env_file: [../configs/env/.env.orchestrator.example]
    environment:
      PORT: 3003
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/10
      NEXUS_BASE_URL: http://nexus:6000
    ports: ["3003:3003"]
    networks: [nyra-network]
    depends_on: [postgres, redis, nexus]

  nyra-orchestrator-service:
    build:
      context: ../..
      dockerfile: services/nyra-orchestrator/Dockerfile
    image: nyra/orchestrator-service:local
    env_file: [../configs/env/.env.orchestrator.example]
    environment:
      PORT: 3004
      NEXUS_BASE_URL: http://nexus:6000
      ARCHON_API_URL: http://archon-api:4000
      CLAUDE_FLOW_URL: http://claude-flow-brain:8080
    ports: ["3004:3004"]
    networks: [nyra-network]
    depends_on: [nexus, archon-api, claude-flow-brain]

networks:
  nyra-network:
    external: true
    name: nyra-network
