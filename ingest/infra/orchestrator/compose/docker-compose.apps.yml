services:
  twenty:
    image: twentycrm/twenty:latest
    container_name: nyra-twenty
    restart: unless-stopped
    ports: ["${TWENTY_PORT:-3006}:3000"]
    environment:
      APP_SECRET: ${TWENTY_APP_SECRET:-change_me_twenty_app}
      SERVER_URL: http://${ORCHESTRATOR_HOSTNAME:-orchestrator.tail-net.ts.net}:${TWENTY_PORT:-3006}
      PG_DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/6
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [nyra-network]

  # ClawHub / MoltBot / OpenClaw stack (best-effort wrapper; pin upstream compose after first run)
  clawhub-web:
    build:
      context: ..
      dockerfile: openclaw/Dockerfile
    image: nyra/openclaw:local
    container_name: nyra-clawhub-web
    restart: unless-stopped
    environment:
      OPENCLAW_MODE: web
      PORT: 3010
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/7
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin
      NEXTAUTH_URL: http://${ORCHESTRATOR_HOSTNAME:-orchestrator.tail-net.ts.net}:${CLOWHUB_UI_PORT:-3010}
      NEXTAUTH_SECRET: ${CLOWHUB_NEXTAUTH_SECRET:-change_me_clawhub}
    ports: ["${CLOWHUB_UI_PORT:-3010}:3010"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      mongo: { condition: service_healthy }
    networks: [nyra-network]
    profiles: ["openclaw"]

  clawhub-api:
    image: nyra/openclaw:local
    container_name: nyra-clawhub-api
    restart: unless-stopped
    environment:
      OPENCLAW_MODE: api
      PORT: 3011
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/7
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin
    ports: ["${CLOWHUB_API_PORT:-3011}:3011"]
    depends_on:
      clawhub-web: { condition: service_started }
    networks: [nyra-network]
    profiles: ["openclaw"]

  clawhub-worker:
    image: nyra/openclaw:local
    container_name: nyra-clawhub-worker
    restart: unless-stopped
    environment:
      OPENCLAW_MODE: worker
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/7
      MONGO_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/admin
    depends_on:
      clawhub-api: { condition: service_started }
    networks: [nyra-network]
    profiles: ["openclaw"]
