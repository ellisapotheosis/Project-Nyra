services:
  gitea:
    image: gitea/gitea:latest
    container_name: nyra-gitea
    restart: unless-stopped
    ports:
      - "3001:3000"
      - "2222:22"
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: postgres
      GITEA__database__HOST: postgres:5432
      GITEA__database__NAME: ${POSTGRES_DB:-nyra}
      GITEA__database__USER: ${POSTGRES_USER:-nyra}
      GITEA__database__PASSWD: ${POSTGRES_PASSWORD}
    volumes:
      - ../data/gitea:/data
    depends_on:
      postgres: { condition: service_healthy }
    networks: [nyra-network]
    profiles: ["gitea"]
