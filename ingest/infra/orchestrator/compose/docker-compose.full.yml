# Requires recent Docker Compose with `include:` support.
# If your compose version lacks include support, use the Makefile targets instead.
include:
  - ./docker-compose.base.yml
  - ./docker-compose.orchestration.yml
  - ./docker-compose.workflows.yml
  - ./docker-compose.apps.yml
  - ./docker-compose.mcp.yml
  - ./docker-compose.archon.full.yml
  - ./docker-compose.claude-flow.full.yml
  - ./docker-compose.observability.yml
  - ./docker-compose.monitoring.yml
