#:schema node_modules/wrangler/config-schema.json
name = "ratehunter-landing"
compatibility_date = "2026-01-16"
compatibility_flags = ["nodejs_compat"]

# Pages build configuration
pages_build_output_dir = ".open-next"

# Worker configuration for Next.js
main = ".open-next/worker.js"

# Asset configuration
[assets]
directory = ".open-next/assets"
binding = "APP_ASSETS"

# Build configuration
[build]
command = "pnpm run build"

# Environment variables (production)
[env.production]
name = "ratehunter-landing-production"

# Environment variables (preview/staging)
[env.preview]
name = "ratehunter-landing-preview"

# Route configuration (configure after domain setup)
# [[routes]]
# pattern = "ratehunter.com"
# custom_domain = true

# Observability
[observability]
enabled = true
