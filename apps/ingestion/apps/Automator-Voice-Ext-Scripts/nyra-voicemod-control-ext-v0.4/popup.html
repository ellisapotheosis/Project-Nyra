
<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nyra Voicemod Control</title>
    <link rel="icon" href="icons/favicon.ico">
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <header>
      <img src="icons/icon128.png" alt="Nyra" class="logo">
      <h1>Nyra Voicemod</h1>
      <button id="centerBtn" title="Center panel">◎</button>
    </header>

    <section class="status">
      <div>WS: <span id="wsStatus">disconnected</span></div>
      <div>Port: <span id="wsPort">-</span></div>
      <div>Board: <input id="boardName" value="Nyra" /></div>
    </section>

    <section>
      <h2>Voices</h2>
      <div class="row">
        <select id="voices" size="6"></select>
        <div class="col">
          <button id="refreshVoices">↻ Refresh</button>
          <button id="setVoice">Set Voice</button>
          <button id="getVoiceIcon">Get Icon</button>
        </div>
      </div>
      <div id="voiceIcon"></div>
    </section>

    <section>
      <h2>Sounds (Soundboard)</h2>
      <div class="row">
        <select id="sounds" size="6"></select>
        <div class="col">
          <button id="refreshSounds">↻ Refresh</button>
          <button id="playSound">▶ Play</button>
          <button id="stopSounds">■ Stop All</button>
          <button id="getSoundIcon">Get Icon</button>
        </div>
      </div>
      <div id="soundIcon"></div>
    </section>

    <section>
      <h2>Quick Controls</h2>
      <div class="row">
        <button id="toggleVC">Toggle Voice Changer</button>
        <button id="toggleHear">Toggle Hear Myself</button>
        <button id="toggleMute">Mute/Unmute Mic</button>
      </div>
    </section>

    <footer>
      <a href="options.html" target="_blank">Options</a>
      <span id="msg"></span>
    </footer>

    <script type="module" src="popup.js"></script>
  </body>
</html>
