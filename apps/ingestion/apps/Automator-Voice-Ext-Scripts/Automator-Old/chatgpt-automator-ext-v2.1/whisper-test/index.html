<!doctype html>
<html>
<head><meta charset="utf-8"><title>Whisper Test</title>
<link rel="stylesheet" href="test.css"></head>
<body>
  <h2>Whisper WS Test</h2>
  <div class="row"><label>WS URL:</label><input id="wsurl" placeholder="wss://your-asr.host/stream"></div>
  <div class="row"><button id="connect">Connect</button><button id="record">Record</button><button id="stop">Stop</button></div>
  <div class="row"><label>Level:</label><meter id="level" min="0" max="1" low="0.1" high="0.3" optimum="0.8" value="0"></meter></div>
  <pre id="log"></pre>
  <script src="test.js"></script>
</body>
</html>
