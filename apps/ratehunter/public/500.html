<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Server Error - RateHunter</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, sans-serif;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
        color: white;
        text-align: center;
        padding: 1rem;
      }

      .container {
        max-width: 600px;
        padding: 2rem;
      }

      h1 {
        font-size: 8rem;
        font-weight: 700;
        margin: 0;
        line-height: 1;
        text-shadow: 0 2px 10px rgba(0, 0, 0, 0.2);
      }

      h2 {
        font-size: 2rem;
        font-weight: 600;
        margin: 1rem 0;
        opacity: 0.95;
      }

      p {
        font-size: 1.25rem;
        opacity: 0.9;
        line-height: 1.6;
        margin: 1rem 0;
      }

      a {
        display: inline-block;
        margin-top: 2rem;
        padding: 1rem 2rem;
        background: white;
        color: #f5576c;
        text-decoration: none;
        border-radius: 8px;
        font-weight: 600;
        font-size: 1.125rem;
        transition:
          transform 0.2s,
          box-shadow 0.2s;
        box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
      }

      a:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
      }

      .emoji {
        font-size: 4rem;
        margin-bottom: 1rem;
        display: block;
      }

      .status {
        display: inline-block;
        margin-top: 1rem;
        padding: 0.5rem 1rem;
        background: rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        font-size: 0.875rem;
        backdrop-filter: blur(10px);
      }

      @media (max-width: 640px) {
        h1 {
          font-size: 5rem;
        }

        h2 {
          font-size: 1.5rem;
        }

        p {
          font-size: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="container">
      <span class="emoji">⚠️</span>
      <h1>500</h1>
      <h2>Internal Server Error</h2>
      <p>Something went wrong on our end.</p>
      <p>We've been notified and are working on fixing it.</p>
      <div class="status">🔧 Our team has been automatically notified</div>
      <a href="/">← Back to Home</a>
    </div>

    <script>
      // Auto-refresh after 30 seconds
      setTimeout(function () {
        window.location.href = "/";
      }, 30000);
    </script>
  </body>
</html>
