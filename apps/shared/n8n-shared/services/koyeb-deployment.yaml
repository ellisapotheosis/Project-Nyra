# Koyeb Deployment Manifest for n8n Workflows
# This manifest deploys the n8n orchestrator on Koyeb's free tier.  See docs for details.
apiVersion: v1
kind: Service
metadata:
  name: nyra-n8n-orchestrator
  labels:
    app: n8n
    tier: automation
    environment: production
spec:
  type: web
  ports:
    - port: 5678
      protocol: http
  deployment:
    image: n8nio/n8n:latest
    resources:
      cpu: "0.5"
      memory: "512Mi"
      disk: "2Gi"
    scaling:
      min: 1
      max: 1
      type: fixed
    healthCheck:
      httpGet:
        path: /healthz
        port: 5678
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    env:
      - name: N8N_PROTOCOL
        value: "https"
      - name: N8N_HOST
        value: "n8n.nyra.koyeb.app"
      - name: N8N_PORT
        value: "5678"
      - name: WEBHOOK_URL
        value: "https://n8n.nyra.koyeb.app/"
      - name: DB_TYPE
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_TYPE
      - name: DB_POSTGRESDB_HOST
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_HOST
      - name: DB_POSTGRESDB_PORT
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_PORT
      - name: DB_POSTGRESDB_DATABASE
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_DATABASE
      - name: DB_POSTGRESDB_USER
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_USER
      - name: DB_POSTGRESDB_PASSWORD
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_DB_PASSWORD
      - name: N8N_ENCRYPTION_KEY
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_ENCRYPTION_KEY
      - name: N8N_USER_MANAGEMENT_JWT_SECRET
        valueFrom:
          secret:
            name: infisical-secrets
            key: N8N_JWT_SECRET
      - name: EXECUTIONS_MODE
        value: "regular"
      - name: EXECUTIONS_TIMEOUT
        value: "300"
      - name: EXECUTIONS_DATA_SAVE_ON_ERROR
        value: "all"
      - name: EXECUTIONS_DATA_SAVE_ON_SUCCESS
        value: "all"
      - name: GENERIC_TIMEZONE
        value: "America/New_York"
      - name: N8N_METRICS
        value: "true"
      - name: N8N_LOG_LEVEL
        value: "info"
      - name: N8N_LOG_OUTPUT
        value: "console"
    volumes:
      - name: n8n-data
        mountPath: /home/node/.n8n
        size: "2Gi"
    strategy:
      type: RollingUpdate
      rollingUpdate:
        maxSurge: 0
        maxUnavailable: 0
  networking:
    domains:
      - name: n8n.nyra.koyeb.app
        type: custom
    tls:
      enabled: true
      provider: letsencrypt
  regions:
    - was
  autoSleep:
    enabled: false
    idleTimeout: 300

# Mortgage Lead Drip Campaign Workflows Configuration
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: n8n-workflows-config
  namespace: automation
data:
  workflows.json: |
    {
      "campaigns": {
        "lead_capture": {
          "workflow_id": "lead-capture-webhook",
          "triggers": ["website_form", "api_endpoint"],
          "actions": ["enrich_lead", "qualify_score", "route_to_crm"]
        },
        "nurture_sequence": {
          "workflow_id": "mortgage-nurture-drip",
          "triggers": ["new_lead", "lead_score_change"],
          "schedule": "0 9 * * *",
          "actions": [
            "day_1_welcome_email",
            "day_3_education_content",
            "day_7_rate_alert",
            "day_14_consultation_offer"
          ]
        },
        "rate_alerts": {
          "workflow_id": "rate-change-notification",
          "triggers": ["rate_drop_detected", "lead_preference_match"],
          "schedule": "0 */4 * * *",
          "actions": ["check_rate_changes", "match_lead_criteria", "send_notification"]
        },
        "appointment_booking": {
          "workflow_id": "appointment-scheduler",
          "triggers": ["booking_request", "calendar_sync"],
          "actions": ["check_availability", "create_booking", "send_confirmations"]
        }
      },
      "integrations": {
        "infisical": {
          "enabled": true,
          "method": "agent_sidecar",
          "sync_interval": 60
        },
        "crm": {
          "provider": "hubspot",
          "webhook_enabled": true
        },
        "email": {
          "provider": "sendgrid",
          "templates_enabled": true
        },
        "sms": {
          "provider": "twilio",
          "opt_in_required": true
        }
      }
    }
