# Project Nyra - PC1 Orchestrator Node
# Services: Nexus Router, Claude Flow, Archon OS, Monitoring Stack

version: '3.9'

networks:
  nyra:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  nexus_data:
  claude_flow_data:
  archon_data:
  prometheus_data:
  grafana_data:
  loki_data:

services:
  # ============================================================================
  # NEXUS ROUTER - Unified MCP + LLM Gateway
  # ============================================================================
  nexus:
    image: grafbase/gateway:latest
    container_name: nyra-nexus-pc1
    hostname: nexus
    restart: unless-stopped
    ports:
      - "8000:8000"  # GraphQL API
      - "4001:4001"  # Admin UI
    volumes:
      - ./configs/nexus/nexus.toml:/app/nexus.toml:ro
      - nexus_data:/app/data
    environment:
      - NEXUS_CONFIG=/app/nexus.toml
      - RUST_LOG=info
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.28.0.10
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # CLAUDE FLOW - Primary Orchestrator
  # ============================================================================
  claude_flow:
    build:
      context: ../vendor/forks/claude-flow
      dockerfile: Dockerfile
    container_name: nyra-claude-flow-pc1
    hostname: claude-flow
    restart: unless-stopped
    ports:
      - "9000:9000"  # MCP Server
      - "9001:9001"  # Web UI
    volumes:
      - ../vendor/forks/claude-flow:/app
      - claude_flow_data:/app/data
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - NODE_ENV=production
      - DEBUG=claude-flow:*
      - NEXUS_URL=http://nexus:8000
      - ARCHON_OS_URL=http://archon_os:9002
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - CLAUDE_FLOW_PORT=9000
      - CLAUDE_FLOW_UI_PORT=9001
    networks:
      nyra:
        ipv4_address: 172.28.0.20
    depends_on:
      - nexus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ARCHON OS - Secondary Orchestrator
  # ============================================================================
  archon_os:
    build:
      context: ../vendor/forks/archon
      dockerfile: Dockerfile
    container_name: nyra-archon-os-pc1
    hostname: archon-os
    restart: unless-stopped
    ports:
      - "9002:9002"  # MCP Server
      - "9003:9003"  # Web UI
    volumes:
      - ../vendor/forks/archon:/app
      - archon_data:/app/data
    environment:
      - NODE_ENV=production
      - NEXUS_URL=http://nexus:8000
      - CLAUDE_FLOW_URL=http://claude_flow:9000
      - ARCHON_PORT=9002
      - ARCHON_UI_PORT=9003
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
    networks:
      nyra:
        ipv4_address: 172.28.0.21
    depends_on:
      - nexus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9002/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # PROMETHEUS - Metrics Collection
  # ============================================================================
  prometheus:
    image: prom/prometheus:latest
    container_name: nyra-prometheus-pc1
    hostname: prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./configs/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=30d'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    networks:
      nyra:
        ipv4_address: 172.28.0.30
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # GRAFANA - Visualization & Dashboards
  # ============================================================================
  grafana:
    image: grafana/grafana:latest
    container_name: nyra-grafana-pc1
    hostname: grafana
    restart: unless-stopped
    ports:
      - "3005:3000"
    volumes:
      - ./configs/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./configs/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
      - GF_SERVER_ROOT_URL=http://localhost:3005
    networks:
      nyra:
        ipv4_address: 172.28.0.31
    depends_on:
      - prometheus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # LOKI - Log Aggregation
  # ============================================================================
  loki:
    image: grafana/loki:latest
    container_name: nyra-loki-pc1
    hostname: loki
    restart: unless-stopped
    ports:
      - "3100:3100"
    volumes:
      - ./configs/loki/loki.yml:/etc/loki/loki.yml:ro
      - loki_data:/loki
    command: -config.file=/etc/loki/loki.yml
    networks:
      nyra:
        ipv4_address: 172.28.0.32
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # ALERTMANAGER - Alert Routing & Management
  # ============================================================================
  alertmanager:
    image: prom/alertmanager:latest
    container_name: nyra-alertmanager-pc1
    hostname: alertmanager
    restart: unless-stopped
    ports:
      - "9093:9093"
    volumes:
      - ./configs/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
      - '--storage.path=/alertmanager'
    networks:
      nyra:
        ipv4_address: 172.28.0.33
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9093/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ============================================================================
  # NODE EXPORTER - System Metrics
  # ============================================================================
  node_exporter:
    image: prom/node-exporter:latest
    container_name: nyra-node-exporter-pc1
    hostname: node-exporter
    restart: unless-stopped
    ports:
      - "9100:9100"
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    networks:
      nyra:
        ipv4_address: 172.28.0.34
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9100/metrics"]
      interval: 30s
      timeout: 10s
      retries: 3
