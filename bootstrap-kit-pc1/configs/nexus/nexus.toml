# Nexus Router Configuration - PC1 Orchestrator
# Unified MCP + LLM Gateway for Project Nyra

[server]
listen_address = "0.0.0.0:8000"
admin_address = "0.0.0.0:4001"
log_level = "info"
request_timeout = 300

[gateway]
enable_introspection = true
enable_playground = true
enable_tracing = true

# ============================================================================
# MCP SERVER ROUTES - Remote PC Workers
# ============================================================================

[[subgraphs]]
name = "claude-flow"
routing_url = "http://claude_flow:9000"
schema_path = "./schemas/claude-flow.graphql"

[[subgraphs]]
name = "archon-os"
routing_url = "http://archon_os:9002"
schema_path = "./schemas/archon-os.graphql"

# PC2 - GPU Worker 1 (Ollama, Ruvector Leader, Memory)
[[subgraphs]]
name = "ollama-pc2"
routing_url = "http://10.0.0.2:11434"
schema_path = "./schemas/ollama.graphql"

[[subgraphs]]
name = "ruvector-leader"
routing_url = "http://10.0.0.2:6370"
schema_path = "./schemas/ruvector.graphql"

[[subgraphs]]
name = "letta-pc2"
routing_url = "http://10.0.0.2:8283"
schema_path = "./schemas/letta.graphql"

[[subgraphs]]
name = "mem0-pc2"
routing_url = "http://10.0.0.2:4321"
schema_path = "./schemas/mem0.graphql"

[[subgraphs]]
name = "dify-pc2"
routing_url = "http://10.0.0.2:3001"
schema_path = "./schemas/dify.graphql"

# PC3 - GPU Worker 2 (Databases, CRM)
[[subgraphs]]
name = "ruvector-follower-1"
routing_url = "http://10.0.0.3:6370"
schema_path = "./schemas/ruvector.graphql"

[[subgraphs]]
name = "twentycrm-pc3"
routing_url = "http://10.0.0.3:3000"
schema_path = "./schemas/twentycrm.graphql"

[[subgraphs]]
name = "postgres-pc3"
routing_url = "http://10.0.0.3:5432"
schema_path = "./schemas/postgres.graphql"

[[subgraphs]]
name = "neo4j-pc3"
routing_url = "http://10.0.0.3:7474"
schema_path = "./schemas/neo4j.graphql"

[[subgraphs]]
name = "falkordb-pc3"
routing_url = "http://10.0.0.3:6379"
schema_path = "./schemas/falkordb.graphql"

# PC4 - GPU Worker 3 (Workflows, Business Services)
[[subgraphs]]
name = "ruvector-follower-2"
routing_url = "http://10.0.0.4:6370"
schema_path = "./schemas/ruvector.graphql"

[[subgraphs]]
name = "n8n-pc4"
routing_url = "http://10.0.0.4:5678"
schema_path = "./schemas/n8n.graphql"

[[subgraphs]]
name = "activepieces-pc4"
routing_url = "http://10.0.0.4:3400"
schema_path = "./schemas/activepieces.graphql"

[[subgraphs]]
name = "quote-engine-pc4"
routing_url = "http://10.0.0.4:8001"
schema_path = "./schemas/quote-engine.graphql"

[[subgraphs]]
name = "campaign-engine-pc4"
routing_url = "http://10.0.0.4:8002"
schema_path = "./schemas/campaign-engine.graphql"

[[subgraphs]]
name = "orchestrator-pc4"
routing_url = "http://10.0.0.4:8010"
schema_path = "./schemas/orchestrator.graphql"

# ============================================================================
# LLM PROVIDER CONFIGURATION
# ============================================================================

[[llm_providers]]
name = "anthropic"
type = "anthropic"
api_key_env = "ANTHROPIC_API_KEY"
base_url = "https://api.anthropic.com"
models = [
    "claude-3-5-sonnet-20241022",
    "claude-3-5-haiku-20241022",
    "claude-3-opus-20240229"
]
default_model = "claude-3-5-sonnet-20241022"
rate_limit = 50
timeout = 300

[[llm_providers]]
name = "openrouter"
type = "openai"
api_key_env = "OPENROUTER_API_KEY"
base_url = "https://openrouter.ai/api/v1"
models = [
    "anthropic/claude-3.5-sonnet",
    "google/gemini-2.0-flash-exp",
    "deepseek/deepseek-chat",
    "meta-llama/llama-3.3-70b-instruct"
]
default_model = "anthropic/claude-3.5-sonnet"
rate_limit = 100
timeout = 300

[[llm_providers]]
name = "gemini"
type = "google"
api_key_env = "GEMINI_API_KEY"
base_url = "https://generativelanguage.googleapis.com"
models = [
    "gemini-2.0-flash-exp",
    "gemini-1.5-pro",
    "gemini-1.5-flash"
]
default_model = "gemini-2.0-flash-exp"
rate_limit = 1500
timeout = 60

# Local Ollama on PC2
[[llm_providers]]
name = "ollama-local"
type = "ollama"
base_url = "http://10.0.0.2:11434"
models = [
    "llama3.1:70b",
    "mistral:7b",
    "codellama:34b"
]
default_model = "llama3.1:70b"
rate_limit = 10
timeout = 120

# ============================================================================
# ROUTING RULES
# ============================================================================

[[routing_rules]]
name = "complex-tasks"
pattern = "*.architect|*.planner|*.complex"
provider = "anthropic"
model = "claude-3-5-sonnet-20241022"
priority = 100

[[routing_rules]]
name = "fast-simple-tasks"
pattern = "*.simple|*.quick|*.status"
provider = "gemini"
model = "gemini-2.0-flash-exp"
priority = 80

[[routing_rules]]
name = "bulk-operations"
pattern = "*.bulk|*.batch|*.mass"
provider = "openrouter"
model = "deepseek/deepseek-chat"
priority = 70

[[routing_rules]]
name = "local-inference"
pattern = "*.local|*.offline"
provider = "ollama-local"
model = "llama3.1:70b"
priority = 50

[[routing_rules]]
name = "default"
pattern = "*"
provider = "anthropic"
model = "claude-3-5-sonnet-20241022"
priority = 10

# ============================================================================
# CACHING & PERFORMANCE
# ============================================================================

[cache]
enabled = true
ttl = 3600
max_size = "10GB"
backend = "redis"
redis_url = "redis://10.0.0.3:6379"

[rate_limiting]
enabled = true
requests_per_minute = 1000
burst = 200

[circuit_breaker]
enabled = true
failure_threshold = 5
timeout = 60
half_open_requests = 3

# ============================================================================
# OBSERVABILITY
# ============================================================================

[metrics]
enabled = true
port = 8001
path = "/metrics"

[tracing]
enabled = true
exporter = "jaeger"
jaeger_endpoint = "http://localhost:14268/api/traces"

[logging]
level = "info"
format = "json"
output = "stdout"

# ============================================================================
# SECURITY
# ============================================================================

[security]
enable_cors = true
cors_origins = ["http://localhost:*", "https://*.ratehunter.net"]
enable_api_keys = true
api_key_header = "X-API-Key"
enable_rate_limiting = true
