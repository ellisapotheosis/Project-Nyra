version: 2.1

orbs:
  node: circleci/node@6.3.0

executors:
  node20:
    docker:
      - image: cimg/node:20.20
    working_directory: ~/project

commands:
  install_with_ci_guards:
    description: Install workspace deps while skipping known private package tree in CI.
    steps:
      - run:
          name: Enable corepack + pnpm
          command: |
            set -euo pipefail
            corepack enable
            corepack prepare pnpm@10.27.0 --activate
      - restore_cache:
          keys:
            - v3-pnpm-store-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - v3-pnpm-store-{{ arch }}-
      - run:
          name: Install dependencies
          command: |
            set -euo pipefail
            if [ -f "apps/twenty-crm/package.json" ]; then
              mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
            fi
            trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
            pnpm install --no-frozen-lockfile
      - save_cache:
          key: v3-pnpm-store-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
            - ~/.cache/pnpm

jobs:
  lint:
    executor: node20
    steps:
      - checkout
      - install_with_ci_guards
      - run:
          name: Lint
          command: |
            set -euo pipefail
            pnpm -r --if-present lint

  typecheck:
    executor: node20
    steps:
      - checkout
      - install_with_ci_guards
      - run:
          name: TypeScript check
          command: |
            set -euo pipefail
            if [ -f tsconfig.json ]; then
              pnpm exec tsc --noEmit
            else
              echo "No root tsconfig.json present; skipping."
            fi

  test:
    executor: node20
    steps:
      - checkout
      - install_with_ci_guards
      - run:
          name: Unit tests
          command: |
            set -euo pipefail
            pnpm -r --if-present test

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test:
          requires:
            - lint
            - typecheck
