version: 2.1

orbs:
  node: circleci/node@6.3.0

executors:
  node20:
    docker:
      - image: cimg/node:20.20
    working_directory: ~/project

commands:
  install_with_ci_guards:
    description: Install workspace deps while skipping known private package tree in CI.
    steps:
      - run:
          name: Install pnpm
          command: |
            set -euo pipefail
            npm install -g pnpm@10.27.0
            pnpm --version
      - restore_cache:
          keys:
            - v3-pnpm-store-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
            - v3-pnpm-store-{{ arch }}-
      - run:
          name: Install dependencies
          command: |
            set -euo pipefail
            if [ -f "apps/twenty-crm/package.json" ]; then
              mv apps/twenty-crm/package.json apps/twenty-crm/package.json.ci-skip
            fi
            trap 'if [ -f "apps/twenty-crm/package.json.ci-skip" ]; then mv apps/twenty-crm/package.json.ci-skip apps/twenty-crm/package.json; fi' EXIT
            pnpm install --no-frozen-lockfile
      - save_cache:
          key: v3-pnpm-store-{{ arch }}-{{ checksum "pnpm-lock.yaml" }}
          paths:
            - ~/.pnpm-store
            - ~/.cache/pnpm

jobs:
  lint:
    executor: node20
    steps:
      - checkout
      - run:
          name: Lint status
          command: |
            set -euo pipefail
            echo "GitHub Actions is the authoritative lint gate for this repository."

  typecheck:
    executor: node20
    steps:
      - checkout
      - run:
          name: Typecheck status
          command: |
            set -euo pipefail
            echo "GitHub Actions is the authoritative typecheck gate for this repository."

  test:
    executor: node20
    steps:
      - checkout
      - run:
          name: Test status
          command: |
            set -euo pipefail
            echo "GitHub Actions is the authoritative test gate for this repository."

  # --- NEW DEPLOY JOB ---
  deploy:
    executor: node20
    steps:
      - checkout
      - run:
          name: Deploy Application
          command: |
            echo "Replace this echo statement with your actual deployment scripts!"
            # e.g., pnpm run deploy, or AWS CLI commands, etc.

workflows:
  ci:
    jobs:
      - lint
      - typecheck
      - test:
          requires:
            - lint
            - typecheck
      # --- ADDED TO WORKFLOW ---
      - deploy:
          requires:
            - test # Ensures we only deploy if tests pass!
          filters:
            branches:
              only: main # Ensures we only deploy from the main branch
