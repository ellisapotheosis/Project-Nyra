name: nyra-archon

x-logging: &default_logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  nyra:
    name: nyra
    driver: bridge

volumes:
  archon_data: {}
  postgres_data: {}
  litellm_data: {}

services:
  # Local Supabase-compatible DB (Postgres + pgvector)
  db:
    image: supabase/postgres:15.6.1.113
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-archon-db
    profiles: ['archon', 'all']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ['54322:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./submodules/archon/migrations:/docker-entrypoint-initdb.d/migrations:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-archon-redis
    profiles: ['archon', 'all']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ['sh', '-lc', 'redis-server --requirepass "$${REDIS_PASSWORD}"']
    ports: ['6379:6379']
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  # Unified Archon OS App (Server + UI)
  archon:
    build:
      context: ./external/archon
      dockerfile: Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-archon-os
    profiles: ['archon', 'all']
    depends_on:
      db:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env.archon.runtime
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      PORT: 3000
      OPENAI_API_KEY: ${OPENAI_API_KEY:?set OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      NEXUS_ROUTER_URL: http://nexus-router:7000
      OPENAI_BASE_URL: http://nexus-router:7000/v1
      ARCHON_DATA: /.archon
      NODE_ENV: production
    ports:
      - '${ARCHON_UI_PORT:-3737}:3000'
    volumes:
      - archon_data:/.archon
      - /var/run/docker.sock:/var/run/docker.sock
      - ./.env.archon.runtime:/app/.env:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-archon-litellm
    profiles: ['archon', 'all']
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-nyra}
    volumes:
      - ./infra/configs/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  nexus-router:
    build:
      context: .
      dockerfile: infra/docker/nexus-router/Dockerfile
    container_name: ${COMPOSE_PROJECT_NAME:-nyra}-archon-nexus-router
    profiles: ['archon', 'all']
    env_file:
      - .env.archon.runtime
    environment:
      NEXUS_ROUTER_PORT: 7000
      NEXUS_MCP_PORT: 8081
      NEXUS_METRICS_PORT: 9091
      NEXUS_URL: http://localhost:7000
      NEXUS_CONFIG_PATH: /app/nexus.toml
      LITELLM_BASE_URL: http://litellm:4000
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    ports:
      - '7000:7000'
      - '8081:8081'
    volumes:
      - ./infra/configs/nexus/nexus.toml:/app/nexus.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7000/health']
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging
