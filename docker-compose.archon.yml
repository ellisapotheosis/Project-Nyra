name: nyra-archon

x-logging: &default_logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

networks:
  nyra:
    name: nyra
    driver: bridge

volumes:
  archon_data: {}
  archon_server_data: {}

services:
  postgres:
    image: postgres:16-alpine
    container_name: nyra-archon-postgres
    profiles: ['archon', 'all']
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nyra}
      POSTGRES_USER: ${POSTGRES_USER:-nyra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    ports: ['${POSTGRES_PORT:-5432}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-nyra} -d ${POSTGRES_DB:-nyra}']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  redis:
    image: redis:7-alpine
    container_name: nyra-archon-redis
    profiles: ['archon', 'all']
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    command: ['sh', '-lc', 'redis-server --requirepass "$${REDIS_PASSWORD}"']
    ports: ['${REDIS_PORT:-6379}:6379']
    healthcheck:
      test: ['CMD-SHELL', "redis-cli -a '$${REDIS_PASSWORD}' ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: nyra-archon-litellm
    profiles: ['archon', 'all']
    command: ['--config', '/app/config.yaml', '--port', '4000']
    environment:
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
    volumes:
      - ./infra/configs/litellm/config.yaml:/app/config.yaml:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  nexus-router:
    build:
      context: .
      dockerfile: infra/docker/nexus-router/Dockerfile
    container_name: nyra-archon-nexus-router
    profiles: ['archon', 'all']
    environment:
      NEXUS_ROUTER_PORT: ${NEXUS_ROUTER_PORT:-7000}
      NEXUS_MCP_PORT: ${NEXUS_MCP_PORT:-8080}
      NEXUS_METRICS_PORT: ${NEXUS_METRICS_PORT:-9091}
      NEXUS_URL: ${NEXUS_URL:-http://localhost:7000}
      NEXUS_CONFIG_PATH: /app/nexus.toml
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      LITELLM_BASE_URL: http://litellm:4000
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
    ports:
      - '${NEXUS_ROUTER_PORT:-7000}:7000'
      - '${NEXUS_MCP_PORT:-8080}:8080'
      - '${NEXUS_METRICS_PORT:-9091}:9091'
    volumes:
      - ./infra/configs/nexus/nexus.toml:/app/nexus.toml:ro
    depends_on:
      redis:
        condition: service_healthy
      litellm:
        condition: service_started
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:7000/health']
      interval: 15s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  infisical-agent:
    image: infisical/cli:latest
    container_name: nyra-archon-infisical-agent
    profiles: ['archon', 'all']
    entrypoint: ['/bin/sh', '-lc']
    command: >-
      test -n "$INFISICAL_TOKEN" &&
      while true; do
        infisical export --projectId=${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef} --env=${INFISICAL_ENV:-prod} --path=/archon --format=dotenv > /secrets/archon.env &&
        infisical export --projectId=${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef} --env=${INFISICAL_ENV:-prod} --path=/claude-flow --format=dotenv > /secrets/claude-flow.env &&
        sleep ${INFISICAL_POLL_INTERVAL:-60};
      done
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?set INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com}
      INFISICAL_ENV: ${INFISICAL_ENV:-prod}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_POLL_INTERVAL: ${INFISICAL_POLL_INTERVAL:-60}
    volumes:
      - ./infra/shared/secrets:/secrets
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  infisical-cli:
    image: infisical/cli:latest
    container_name: nyra-archon-infisical-cli
    profiles: ['archon', 'all']
    entrypoint: ['/bin/sh', '-lc']
    command: >-
      test -n "$INFISICAL_TOKEN" &&
      infisical export --projectId=${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef} --env=${INFISICAL_ENV:-prod} --path=/shared --format=dotenv
      > /workspace/.env.archon.injected && tail -f /dev/null
    environment:
      INFISICAL_TOKEN: ${INFISICAL_TOKEN:?set INFISICAL_TOKEN}
      INFISICAL_API_URL: ${INFISICAL_API_URL:-https://app.infisical.com}
      INFISICAL_PROJECT_ID: ${INFISICAL_PROJECT_ID:-8374cea9-e5e8-4050-bda4-b91f25ab30ef}
      INFISICAL_DISABLE_UPDATE_CHECK: 'true'
    volumes:
      - ./:/workspace
    depends_on:
      - infisical-agent
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-os:
    build:
      context: ./services/archon-os
      dockerfile: docker/Dockerfile.archon-os
    container_name: nyra-archon-os
    profiles: ['archon', 'all']
    depends_on:
      nexus-router:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      ARCHON_ENV: ${ARCHON_ENV:-production}
      NEXUS_BASE_URL: http://nexus-router:7000
      NEXUS_MCP_URL: http://nexus-router:8080
      NEXUS_ROUTER_URL: http://nexus-router:7000
      POSTGRES_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
    ports: ['${ARCHON_OS_PORT:-9001}:9001']
    volumes:
      - archon_data:/opt/archon/data
      - ./infra/shared/secrets:/secrets:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-server:
    build:
      context: ./services/archon-os
      dockerfile: docker/Dockerfile.server
      args:
        ARCHON_SERVER_PORT: ${ARCHON_SERVER_PORT:-8181}
    container_name: nyra-archon-server
    profiles: ['archon', 'all']
    depends_on:
      postgres:
        condition: service_healthy
      nexus-router:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-nyra}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-nyra}
      SERVICE_DISCOVERY_MODE: docker_compose
      ARCHON_SERVER_PORT: ${ARCHON_SERVER_PORT:-8181}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      NEXUS_ROUTER_URL: http://nexus-router:7000
      OPENAI_BASE_URL: http://nexus-router:7000/v1
    ports:
      - '${ARCHON_SERVER_PORT:-8181}:8181'
    volumes:
      - archon_server_data:/app/data
      - ./infra/shared/secrets:/secrets:ro
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-mcp:
    build:
      context: ./services/archon-os
      dockerfile: docker/Dockerfile.mcp
      args:
        ARCHON_MCP_PORT: ${ARCHON_MCP_PORT:-8051}
    container_name: nyra-archon-mcp
    profiles: ['archon', 'all']
    depends_on:
      archon-server:
        condition: service_started
      nexus-router:
        condition: service_healthy
    environment:
      SERVICE_DISCOVERY_MODE: docker_compose
      ARCHON_MCP_PORT: ${ARCHON_MCP_PORT:-8051}
      API_SERVICE_URL: http://archon-server:8181
      NEXUS_ROUTER_URL: http://nexus-router:7000
      NEXUS_MCP_PROXY_URL: http://nexus-router:8080
    ports:
      - '${ARCHON_MCP_PORT:-8051}:8051'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-agents:
    build:
      context: ./services/archon-os
      dockerfile: docker/Dockerfile.agents
      args:
        ARCHON_AGENTS_PORT: ${ARCHON_AGENTS_PORT:-8052}
    container_name: nyra-archon-agents
    profiles: ['archon', 'all']
    depends_on:
      archon-server:
        condition: service_started
      nexus-router:
        condition: service_healthy
    environment:
      ARCHON_AGENTS_PORT: ${ARCHON_AGENTS_PORT:-8052}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_BASE_URL: http://nexus-router:7000/v1
      NEXUS_MCP_PROXY_URL: http://nexus-router:8080
      ARCHON_SERVER_URL: http://archon-server:8181
    ports:
      - '${ARCHON_AGENTS_PORT:-8052}:8052'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-agent-work-orders:
    build:
      context: ./services/archon-os
      dockerfile: docker/Dockerfile.server
    container_name: nyra-archon-agent-work-orders
    profiles: ['archon', 'all']
    depends_on:
      archon-server:
        condition: service_started
      archon-mcp:
        condition: service_started
    environment:
      AGENT_WORK_ORDERS_PORT: ${AGENT_WORK_ORDERS_PORT:-8053}
      SERVICE_DISCOVERY_MODE: docker_compose
      ARCHON_SERVER_URL: http://archon-server:8181
      ARCHON_MCP_URL: http://archon-mcp:8051
      OPENAI_BASE_URL: http://nexus-router:7000/v1
      NEXUS_MCP_PROXY_URL: http://nexus-router:8080
      GH_TOKEN: ${GH_TOKEN:-${GITHUB_TOKEN:-}}
    command:
      - sh
      - -lc
      - python -m uvicorn src.agent_work_orders.server:app --host 0.0.0.0 --port ${AGENT_WORK_ORDERS_PORT:-8053}
    ports:
      - '${AGENT_WORK_ORDERS_PORT:-8053}:8053'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging

  archon-ui:
    image: nginx:1.27-alpine
    container_name: nyra-archon-ui
    profiles: ['archon', 'all']
    depends_on:
      archon-server:
        condition: service_started
      archon-mcp:
        condition: service_started
    environment:
      VITE_API_URL: http://archon-server:8181
      VITE_MCP_URL: http://archon-mcp:8051
      VITE_NEXUS_ROUTER_URL: http://nexus-router:7000
      VITE_NEXUS_MCP_PROXY_URL: http://nexus-router:8080
    ports:
      - '${ARCHON_UI_PORT:-3737}:3737'
    volumes:
      - ./ingest/infra/orchestrator/archon/ui-placeholder/index.html:/usr/share/nginx/html/index.html:ro
    command:
      - /bin/sh
      - -lc
      - sed -i 's/listen       80;/listen       3737;/' /etc/nginx/conf.d/default.conf && exec nginx -g 'daemon off;'
    restart: unless-stopped
    networks: [nyra]
    logging: *default_logging
