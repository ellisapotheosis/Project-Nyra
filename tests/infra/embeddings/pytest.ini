[pytest]
# Pytest configuration for embedding services tests

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    --durations=10
    --maxfail=5

# Test markers
markers =
    integration: Integration tests requiring running services
    performance: Performance benchmark tests
    slow: Tests that take more than 5 seconds
    gpu: Tests that require GPU access

# Logging
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# Coverage (optional)
# Uncomment to enable coverage reporting
# addopts = --cov=infra/docker/services --cov-report=html --cov-report=term

# Test directories
testpaths = .

# Ignore patterns
norecursedirs = .git .venv venv env __pycache__ node_modules
