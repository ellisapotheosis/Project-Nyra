windows_wsl_setup_acknowledged = true
model = "gpt-5-codex"
model_reasoning_effort = "low"

[mcp_servers]

# Existing examples (kept from your sample)
[mcp_servers.MCP_DOCKER]
command = "docker.exe"
args = ["mcp", "gateway", "run"]

[mcp_servers.docker-toolkit]
command = "docker"
args = ["mcp", "gateway", "run"]

[mcp_servers.infisical]
command = "npx"
args = ["-y", "@infisical/mcp"]

[mcp_servers.infisical.env]
INFISICAL_UNIVERSAL_AUTH_CLIENT_ID = "${INFISICAL_UNIVERSAL_AUTH_CLIENT_ID}"
INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET = "${INFISICAL_UNIVERSAL_AUTH_CLIENT_SECRET}"

# From your claude-flow config (already present in your sample)
[mcp_servers.claude-flow]
command = "npx"
args = ["-y", "claude-flow@alpha"]

[mcp_servers.ruv-swarm]
command = "npx"
args = ["-y", "ruv-swarm@latest"]

[mcp_servers.flow-nexus]
command = "npx"
args = ["-y", "flow-nexus@latest"]

# New conversions from your JSON

# agentic-payments (keeps original subcommand shape)
[mcp_servers.agentic-payments]
command = "npx"
args = ["-y", "agentic-payments@latest", "mcp"]

# filesystem via @modelcontextprotocol/server-filesystem
[mcp_servers.filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "--root", "${WORKSPACE_ROOT:.}"]

# Notion over HTTP
[mcp_servers.notion]
transport = "http"
url = "https://mcp.notion.com/mcp"

[mcp_servers.notion.headers]
Authorization = "Bearer ${NOTION_TOKEN}"

# Archon (Python module entrypoint)
[mcp_servers.archon]
command = "python"
args = ["-m", "ARCHON_MCP_MODULE", "start"]

[mcp_servers.archon.env]
ARCHON_MCP_MODULE = "${ARCHON_MCP_MODULE}"

# mcp-use (package name set via env so you can swap implementations)
[mcp_servers.mcp-use]
command = "npx"
args = ["-y", "${MCP_USE_PACKAGE}", "start"]

[mcp_servers.mcp-use.env]
MCP_USE_PACKAGE = "${MCP_USE_PACKAGE}"

# tome (package name via env)
[mcp_servers.tome]
command = "npx"
args = ["-y", "${TOME_MCP_PACKAGE}", "start"]

[mcp_servers.tome.env]
TOME_MCP_PACKAGE = "${TOME_MCP_PACKAGE}"

# gofastmcp (package name via env)
[mcp_servers.gofastmcp]
command = "npx"
args = ["-y", "${GOFASTMCP_PACKAGE}", "start"]

[mcp_servers.gofastmcp.env]
GOFASTMCP_PACKAGE = "${GOFASTMCP_PACKAGE}"

# activepieces (package name via env)
[mcp_servers.activepieces]
command = "npx"
args = ["-y", "${ACTIVEPIECES_MCP_PACKAGE}", "start"]

[mcp_servers.activepieces.env]
ACTIVEPIECES_MCP_PACKAGE = "${ACTIVEPIECES_MCP_PACKAGE}"

# pulse-fs: filesystem-style server with root
[mcp_servers.pulse-fs]
command = "npx"
args = ["-y", "${PULSE_FILESYSTEM_PACKAGE}", "start", "--root", "${WORKSPACE_ROOT:.}"]

[mcp_servers.pulse-fs.env]
PULSE_FILESYSTEM_PACKAGE = "${PULSE_FILESYSTEM_PACKAGE}"

# Optional swarms from your sample (left intact)
[mcp_servers.hive-mind]
command = "npx"
args = ["-y", "hive-mind@latest"]

[mcp_servers.swarm]
command = "npx"
args = ["-y", "swarm@latest"]

# Trust your common Windows work dirs (adjust as you like)
[projects]
[projects.'C:\\Dev\\DevProjects\\Personal-Projects\\CodexCLI']
trust_level = "trusted"

[projects.'C:\\Users\\edane']
trust_level = "trusted"
