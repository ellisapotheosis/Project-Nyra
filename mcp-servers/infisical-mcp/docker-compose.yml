version: '3.8'

# Infisical MCP Server - Standalone Configuration
# For integration with main Nyra infrastructure, see docker-compose.infisical.yml in project root

services:
  infisical-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyra-infisical-mcp
    environment:
      # MCP Server Configuration
      - MCP_PORT=8006
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - NODE_ENV=${NODE_ENV:-production}

      # Infisical Configuration
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_ENVIRONMENT=${INFISICAL_ENVIRONMENT:-development}
      - INFISICAL_DISABLE_UPDATE_CHECK=true

      # Nyra Integration
      - NYRA_ENVIRONMENT=${NYRA_ENVIRONMENT:-development}
      - NYRA_PC_ID=${NYRA_PC_ID:-orchestrator}
    ports:
      - "8006:8006"
    volumes:
      # Persistent configuration and cache
      - infisical_config:/home/mcp/.infisical
      - infisical_cache:/app/cache
      - infisical_secrets:/app/secrets

      # Logs directory (bind mount for easy access)
      - ./logs:/app/logs

      # Optional: Custom configuration
      - ./config:/app/config:ro
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "src/health-check.js"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  infisical_config:
    name: nyra_infisical_mcp_config
  infisical_cache:
    name: nyra_infisical_mcp_cache
  infisical_secrets:
    name: nyra_infisical_mcp_secrets

networks:
  nyra-network:
    name: nyra-infisical-mcp-network
    driver: bridge
