metamcp:
  global_config:
    version: "1.0.0"
    default_network: nyra-network
    access_control: 
      mode: context-aware
      default_permission: deny

  channels:
    context_cost_matrix:
      high_complexity:
        max_tokens: 200000
        model: claude-3-opus
        max_concurrent: 2
        fallback: claude-3-sonnet
      
      medium_complexity:
        max_tokens: 50000
        model: claude-3-sonnet
        max_concurrent: 5
        fallback: claude-3-haiku
      
      low_complexity:
        max_tokens: 10000
        model: claude-3-haiku
        max_concurrent: 10
        fallback: gpt-3.5-turbo

    ui_integration:
      archon_ui:
        endpoint: "/archon"
        access_level: admin
        integration_type: reverse_proxy
        upstream: "http://archon-ui:8080"
        context_cost: medium_complexity

      open_webui:
        endpoint: "/owui"
        access_level: user
        integration_type: full_proxy
        upstream: "http://open-webui:3000"
        context_cost: low_complexity
        
        extensions:
          - claude_flow_ui
          - nexus_flow_ui
          - archon_pipelines

    ai_flows:
      claude_flow:
        endpoint: "/claude/flow"
        model: claude-3-opus
        context_cost: high_complexity
        toolsets:
          - sequential_thinking
          - file_analysis
          - code_generation
          - system_design

      nexus_flow:
        endpoint: "/nexus/flow"
        model: claude-3-sonnet
        context_cost: medium_complexity
        toolsets:
          - multi_agent_coordination
          - complex_task_decomposition
          - adaptive_problem_solving

      gemini_flow:
        endpoint: "/gemini/flow"
        model: gemini-pro
        context_cost: medium_complexity
        toolsets:
          - google_ecosystem_integration
          - multimodal_reasoning

    production_services:
      dify:
        endpoint: "/prod/dify"
        access_level: admin
        context_cost: medium_complexity

      flowise:
        endpoint: "/prod/flowise"
        access_level: admin
        context_cost: medium_complexity

    optional_ui:
      librechat:
        endpoint: "/chat/librechat"
        access_level: user
        context_cost: low_complexity

      lobechat:
        endpoint: "/chat/lobechat"
        access_level: user
        context_cost: low_complexity

  routing_rules:
    - source: "/claude/*"
      target_channel: ai_flows.claude_flow
      rate_limit: 100_req_per_minute

    - source: "/archon/*"
      target_channel: ui_integration.archon_ui
      authentication_required: true

    - source: "/prod/*"
      target_channel: production_services
      rate_limit: 50_req_per_minute
      admin_only: true

  security:
    authentication:
      provider: infisical
      mode: jwt_token
      token_expiry: 1h
    
    observability:
      logging: true
      log_level: info
      metrics_endpoint: "/metamcp/metrics"

  performance:
    max_concurrent_channels: 50
    default_timeout: 120s
    circuit_breaker:
      failure_threshold: 5
      recovery_timeout: 30s