version: '3.8'

# Nyra Docker Hub MCP Integration
# Docker Hub API integration with Infisical secret management

services:
  # Docker Hub MCP Server
  dockerhub-mcp:
    build:
      context: ./mcp-servers/dockerhub-mcp
      dockerfile: Dockerfile
    container_name: nyra-dockerhub-mcp
    environment:
      # MCP Configuration
      - MCP_PORT=8007
      - MCP_HOST=0.0.0.0
      - NYRA_ENVIRONMENT=${NYRA_ENVIRONMENT:-development}
      - NYRA_PC_ID=${NYRA_PC_ID:-orchestrator}

      # Docker Hub API Configuration (injected via Infisical)
      - DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}
      - DOCKERHUB_TOKEN=${DOCKERHUB_TOKEN}
      - DOCKERHUB_NAMESPACE=${DOCKERHUB_NAMESPACE:-projectnyra}

      # Infisical Configuration
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_DISABLE_UPDATE_CHECK=true

      # Service Configuration
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CACHE_TTL=${CACHE_TTL:-300}
      - RATE_LIMIT=${RATE_LIMIT:-100}
      - ENABLE_METRICS=true
    ports:
      - "8007:8007"
    volumes:
      # Configuration
      - ./config/dockerhub/${NYRA_PC_ID:-orchestrator}:/app/config:ro

      # Persistent storage
      - dockerhub_cache:/app/cache
      - ./logs/dockerhub:/app/logs

      # Shared secrets volume (from Infisical)
      - infisical_secrets:/app/secrets:ro

      # Docker socket (optional, for local operations)
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      - infisical-mcp
    networks:
      - nyra-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    labels:
      - "com.project-nyra.service=dockerhub-mcp"
      - "com.project-nyra.version=1.0.0"
      - "com.project-nyra.environment=${NYRA_ENVIRONMENT:-development}"

  # Infisical MCP Server (if not already running)
  infisical-mcp:
    profiles: ["infisical"]
    build:
      context: ./infra/docker/infisical
      dockerfile: Dockerfile.mcp
    container_name: nyra-infisical-mcp
    environment:
      - MCP_PORT=8006
      - NYRA_ENVIRONMENT=${NYRA_ENVIRONMENT:-development}
      - INFISICAL_PROJECT_ID=${INFISICAL_PROJECT_ID}
      - INFISICAL_TOKEN=${INFISICAL_TOKEN}
      - INFISICAL_DISABLE_UPDATE_CHECK=true
    ports:
      - "8006:8006"
    volumes:
      - infisical_config:/home/infisical/.infisical
      - ./config/infisical/${NYRA_PC_ID:-orchestrator}:/app/config:ro
      - infisical_secrets:/app/secrets
    networks:
      - nyra-network
    restart: unless-stopped

volumes:
  # Docker Hub MCP volumes
  dockerhub_cache:
    name: nyra_dockerhub_cache
    driver: local

  # Infisical volumes
  infisical_config:
    name: nyra_infisical_config
  infisical_secrets:
    name: nyra_infisical_secrets

networks:
  nyra-network:
    name: nyra-infisical-network
    external: true
