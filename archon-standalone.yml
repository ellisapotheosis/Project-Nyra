version: '3.8'

services:
  archon-server:
    image: archonos/archon-server:latest
    container_name: nyra-archon-server
    restart: unless-stopped
    ports:
      - '8181:8181'
    environment:
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_KEY=${SUPABASE_SERVICE_KEY}
      - DATABASE_URL=${DATABASE_URL}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - NEXUS_ROUTER_URL=${NEXUS_ROUTER_URL:-http://host.docker.internal:6000}
      - USE_NEXUS_ROUTER=${USE_NEXUS_ROUTER:-true}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ARCHON_SERVER_PORT=8181
      - ARCHON_MCP_PORT=8051
      - ARCHON_AGENTS_PORT=8052
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - archon-net
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8181/health']
      interval: 30s
      timeout: 10s
      retries: 3

  archon-mcp:
    image: archonos/archon-mcp:latest
    container_name: nyra-archon-mcp
    restart: unless-stopped
    ports:
      - '8051:8051'
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - API_SERVICE_URL=http://archon-server:8181
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
      - ARCHON_MCP_PORT=8051
      - NEXUS_ROUTER_URL=${NEXUS_ROUTER_URL:-http://host.docker.internal:6000}
      - MCP_PROXY_ENABLED=true
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    networks:
      - archon-net
    depends_on:
      - archon-server
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:8051/health']
      interval: 30s
      timeout: 10s
      retries: 3

  archon-ui:
    image: archonos/archon-ui:latest
    container_name: nyra-archon-ui
    restart: unless-stopped
    ports:
      - '3737:3737'
    environment:
      - NEXT_PUBLIC_ARCHON_SERVER_URL=http://localhost:8181
      - NEXT_PUBLIC_SUPABASE_URL=${SUPABASE_URL}
      - NEXT_PUBLIC_SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - ARCHON_SERVER_PORT=8181
    networks:
      - archon-net
    depends_on:
      - archon-server
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3737']
      interval: 30s
      timeout: 10s
      retries: 3

  archon-worker:
    image: archonos/archon-worker:latest
    container_name: nyra-archon-worker
    restart: unless-stopped
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - ARCHON_SERVER_URL=http://archon-server:8181
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    networks:
      - archon-net
    depends_on:
      - archon-server

networks:
  archon-net:
    driver: bridge
