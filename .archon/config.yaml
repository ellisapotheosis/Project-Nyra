assistants:
  claude:
    model: sonnet  
    settingSources:  
      - project      
      - user         
  codex:
    # Archon thinks this is Codex, but LLxprt will intercept and map it!
    model: gpt-5.3-codex 
    modelReasoningEffort: high
    webSearchMode: live
    additionalDirectories:
      - /absolute/path/to/other/repo
    # NOTE: Archon's current code does not read a codexBinaryPath key.
    # The container wiring uses CODEX_PATH=/usr/local/bin/llxprt instead.

docs:
  path: docs/
