openapi: 3.1.0
info:
  title: Nyra CRM API
  version: 0.1.0
  description: REST layer in front of TwentyCRM for campaign orchestration
servers:
  - url: http://localhost:4001
security:
  - ApiKeyAuth: []
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-crm-api-key
  schemas:
    LeadCreate:
      type: object
      properties:
        name:
          type: string
        email:
          type: string
        phone:
          type: string
        source:
          type: string
        consentEmail:
          type: boolean
        consentSms:
          type: boolean
        consentVoice:
          type: boolean
        creditScore:
          type: integer
        annualIncome:
          type: number
        employmentStatus:
          type: string
        loan:
          type: object
          properties:
            loanPurpose:
              type: string
            loanType:
              type: string
            loanAmount:
              type: number
            propertyValue:
              type: number
            interestRate:
              type: number
            termMonths:
              type: integer
    QuoteRequest:
      type: object
      properties:
        loanAmount:
          type: number
        interestRate:
          type: number
        loanTermYears:
          type: integer
        propertyValue:
          type: number
        downPayment:
          type: number
        metadata:
          type: object
    StatusUpdate:
      type: object
      properties:
        status:
          type: string
        notes:
          type: string
    CampaignEnrollRequest:
      type: object
      properties:
        campaignName:
          type: string
          default: New Lead Nurture
        channelPreferences:
          type: array
          items:
            type: string
            enum: [email, sms, voice]
    CampaignPauseRequest:
      type: object
      properties:
        reason:
          type: string
          default: manual_pause
        notes:
          type: string
    ReplyWebhook:
      type: object
      required: [leadId, body]
      properties:
        leadId:
          type: string
        channel:
          type: string
          enum: [email, sms, voice, webhook]
          default: webhook
        body:
          type: string
        providerMessageId:
          type: string
        receivedAt:
          type: string
          format: date-time
        metadata:
          type: object
paths:
  /api/leads:
    post:
      summary: Create a lead and bootstrap campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LeadCreate'
      responses:
        '201':
          description: Lead created
  /api/leads/{id}:
    get:
      summary: Get a Twenty mortgage lead plus local Nyra metadata
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Lead found
        '404':
          description: Lead not found
  /api/leads/{id}/conversation:
    get:
      summary: Unified conversation for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Timeline data
  /api/leads/{id}/quote:
    post:
      summary: Trigger quote generation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
      responses:
        '201':
          description: Quote created
  /api/leads/{id}/status:
    patch:
      summary: Update lead status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StatusUpdate'
      responses:
        '200':
          description: Loan updated
  /api/leads/{id}/campaigns/enroll:
    post:
      summary: Enroll a lead into a campaign after consent and dedupe checks
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignEnrollRequest'
      responses:
        '201':
          description: Campaign enrollment created
  /api/leads/{id}/campaigns/pause:
    post:
      summary: Pause active or pending campaign enrollments for a lead
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CampaignPauseRequest'
      responses:
        '200':
          description: Campaign enrollments paused
  /api/webhooks/reply:
    post:
      summary: Record an inbound reply, detect STOP intent, and pause campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReplyWebhook'
      responses:
        '200':
          description: Reply handled
  /api/dashboard/pipeline:
    get:
      summary: Pipeline summary
      responses:
        '200':
          description: Campaign statistics
  /webhooks/twenty/contact-created:
    post:
      summary: Contact.created webhook
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                leadId:
                  type: string
      responses:
        '200':
          description: Acknowledged
  /webhooks/twenty/loan-status:
    post:
      summary: Loan status change webhook
      responses:
        '200':
          description: Acknowledged
  /webhooks/twenty/contact-updated:
    post:
      summary: Contact.updated webhook
      responses:
        '200':
          description: Acknowledged
