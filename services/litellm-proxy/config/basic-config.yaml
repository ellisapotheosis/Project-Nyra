model_list:
  - model_name: "test-model"
    litellm_params:
      model: "openai/gpt-3.5-turbo"
      api_key: "${OPENAI_API_KEY}"
      mock_response: "This is a test response from LiteLLM proxy"
  - model_name: "echo-model"
    litellm_params:
      model: "openai/gpt-3.5-turbo"
      api_key: "${OPENAI_API_KEY}"
      mock_response: "Echo test successful"

general_settings:
  master_key: "${LITELLM_MASTER_KEY}"
  request_timeout: 60
  drop_params: false
  stream: true

litellm_settings:
  drop_params: false
  set_verbose: false
  json_logs: true
