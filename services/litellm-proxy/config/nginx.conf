# Nginx Load Balancer for LiteLLM Proxy
# Distributes traffic across 3 LiteLLM instances

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log /var/log/nginx/access.log main;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml application/atom+xml image/svg+xml
               text/x-component text/x-cross-domain-policy;

    # Rate limiting
    limit_req_zone $binary_remote_addr zone=api:10m rate=100r/s;
    limit_req_status 429;

    # Upstream LiteLLM instances
    upstream litellm_backend {
        least_conn;  # Use least connections algorithm

        server litellm-1:4001 max_fails=3 fail_timeout=30s;
        server litellm-2:4002 max_fails=3 fail_timeout=30s;
        server litellm-3:4003 max_fails=3 fail_timeout=30s;

        keepalive 32;
    }

    # Main server block
    server {
        listen 4000;
        server_name _;

        # Increase timeouts for long-running LLM requests
        proxy_connect_timeout 600s;
        proxy_send_timeout 600s;
        proxy_read_timeout 600s;
        send_timeout 600s;

        # Client body size
        client_max_body_size 10M;

        # Proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_http_version 1.1;

        # Health check endpoint (no rate limit)
        location = /health {
            access_log off;
            proxy_pass http://litellm_backend;
        }

        # Ready check endpoint
        location = /health/ready {
            access_log off;
            proxy_pass http://litellm_backend;
        }

        # Live check endpoint
        location = /health/live {
            access_log off;
            proxy_pass http://litellm_backend;
        }

        # Models endpoint
        location /v1/models {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://litellm_backend;
        }

        # Chat completions endpoint
        location /v1/chat/completions {
            limit_req zone=api burst=50 nodelay;

            # Enable streaming
            proxy_buffering off;
            chunked_transfer_encoding on;

            proxy_pass http://litellm_backend;
        }

        # Completions endpoint
        location /v1/completions {
            limit_req zone=api burst=50 nodelay;

            proxy_buffering off;
            chunked_transfer_encoding on;

            proxy_pass http://litellm_backend;
        }

        # Embeddings endpoint
        location /v1/embeddings {
            limit_req zone=api burst=100 nodelay;
            proxy_pass http://litellm_backend;
        }

        # All other v1 endpoints
        location /v1/ {
            limit_req zone=api burst=30 nodelay;
            proxy_pass http://litellm_backend;
        }

        # Root location
        location / {
            limit_req zone=api burst=20 nodelay;
            proxy_pass http://litellm_backend;
        }

        # Error pages
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            return 503 '{"error": {"message": "LiteLLM proxy is temporarily unavailable", "type": "service_unavailable", "code": 503}}';
            add_header Content-Type application/json;
        }

        error_page 429 /429.html;
        location = /429.html {
            return 429 '{"error": {"message": "Too many requests. Please slow down.", "type": "rate_limit_exceeded", "code": 429}}';
            add_header Content-Type application/json;
        }
    }

    # Status server for monitoring
    server {
        listen 8080;
        server_name _;

        location /nginx_status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.16.0.0/12;  # Docker network
            deny all;
        }
    }
}
