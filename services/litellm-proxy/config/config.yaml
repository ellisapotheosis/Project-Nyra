# LiteLLM Proxy Configuration for Project Nyra
# Optimized for cost savings with local GPU workers + OpenRouter fallback

# ========================================
# MODEL CONFIGURATION
# ========================================
model_list:
  # ========================================
  # GPU WORKER 1: RTX 5090 (48GB VRAM)
  # Primary Use: Large reasoning models
  # ========================================
  - model_name: "llama-3.1-405b"
    litellm_params:
      model: "openai/llama-3.1-405b"
      api_base: "${WORKER_5090_URL}"
      api_key: "${WORKER_5090_API_KEY}"
      timeout: 180
      max_tokens: 65536
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001  # Local - nearly free
      output_cost_per_token: 0.0000001
      max_tokens: 65536
      max_input_tokens: 32768

  - model_name: "qwen-2.5-72b"
    litellm_params:
      model: "openai/qwen-2.5-72b"
      api_base: "${WORKER_5090_URL}"
      api_key: "${WORKER_5090_API_KEY}"
      timeout: 180
      max_tokens: 32768
    model_info:
      mode: "chat"
      supports_function_calling: true
      supports_vision: false
      input_cost_per_token: 0.0000001
      output_cost_per_token: 0.0000001
      max_tokens: 32768

  - model_name: "deepseek-v3"
    litellm_params:
      model: "openai/deepseek-v3"
      api_base: "${WORKER_5090_URL}"
      api_key: "${WORKER_5090_API_KEY}"
