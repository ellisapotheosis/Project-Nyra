version: '3.9'

# LiteLLM Proxy - Development Stack
# Simplified setup for local development

services:
  # ========================================
  # LiteLLM Proxy (Single Instance)
  # ========================================
  litellm:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: litellm-proxy-dev
    ports:
      - "4000:4000"
    env_file:
      - .env
    environment:
      - LITELLM_LOG_LEVEL=DEBUG
      - LITELLM_SET_VERBOSE=true
      - PORT=4000
    volumes:
      - ./config:/app/config:ro
      - ./monitoring/logs:/app/logs
    depends_on:
      - redis
    networks:
      - litellm-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ========================================
  # Redis - Response Caching
  # ========================================
  redis:
    image: redis:7-alpine
    container_name: litellm-redis-dev
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-dev-data:/data
    networks:
      - litellm-dev-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  redis-dev-data:
    name: litellm-redis-dev-data

networks:
  litellm-dev-network:
    name: litellm-dev-network
    driver: bridge
