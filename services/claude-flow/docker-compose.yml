# ============================================================================
# Project Nyra - Claude Flow Services
# ============================================================================
# Claude Flow Brain (MCP Server) and CI/CD Worker
#
# Dependencies: base (Redis, PostgreSQL)
# Usage:
#   docker compose -f infra/docker-compose.yml -f services/claude-flow/docker-compose.yml up -d
#   # Or with dashboard:
#   docker compose -f infra/docker-compose.yml -f services/claude-flow/docker-compose.yml -f infra/docker-compose.dashboard.yml up -d
# ============================================================================

x-logging: &default_logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

volumes:
  claude_flow_data:
    name: nyra_claude_flow_data
    driver: local
  claude_flow_logs:
    name: nyra_claude_flow_logs
    driver: local

networks:
  nyra:
    external: true

services:
  # ==========================================
  # THE BRAIN: Persistent Memory & MCP Server
  # ==========================================
  claude-flow-brain:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyra-claude-flow-brain
    profiles: ["claude-flow", "orchestration"]
    restart: unless-stopped
    ports:
      - "${CLAUDE_FLOW_MCP_PORT:-8080}:8080"
      - "${CLAUDE_FLOW_METRICS_PORT:-3333}:3333"
    volumes:
      - claude_flow_data:/app/data
      - claude_flow_logs:/app/data/logs
      # Mount root .claude-flow config (if exists)
      - ../../.claude-flow:/app/.claude-flow-config:ro
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - CLAUDE_FLOW_MODE=server
      - CLAUDE_FLOW_PORT=8080
      - CLAUDE_FLOW_HOST=0.0.0.0
      - CLAUDE_FLOW_ENABLE_REASONING_BANK=${CLAUDE_FLOW_ENABLE_REASONING_BANK:-true}
      - CLAUDE_FLOW_ENABLE_AGENT_DB=${CLAUDE_FLOW_ENABLE_AGENT_DB:-true}
      - CLAUDE_FLOW_ENABLE_RUVECTOR=${CLAUDE_FLOW_ENABLE_RUVECTOR:-true}
      # Redis connection
      - REDIS_URL=redis://nyra-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      # RuVector connection
      - RUVECTOR_HOST=ruvector-postgres
      - RUVECTOR_PORT=5432
      - RUVECTOR_USER=${RUVECTOR_POSTGRES_USER:-claude}
      - RUVECTOR_PASSWORD=${RUVECTOR_POSTGRES_PASSWORD:?set RUVECTOR_POSTGRES_PASSWORD}
      - RUVECTOR_DATABASE=${RUVECTOR_POSTGRES_DB:-claude_flow}
      # API Keys
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - nyra
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging: *default_logging
    labels:
      - "com.nyra.service=claude-flow-brain"
      - "com.nyra.category=orchestrator"
      - "com.nyra.mcp.enabled=true"
      - "com.nyra.mcp.port=8080"

  # ==========================================
  # THE MUSCLE: CI/CD Runner Template
  # (Use this image for your CI pipelines)
  # ==========================================
  claude-flow-cicd:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nyra-claude-flow-cicd
    profiles: ["cicd"]
    restart: "no"
    environment:
      - CI=true
      - CLAUDE_FLOW_NON_INTERACTIVE=true
      - CLAUDE_FLOW_HEADLESS=true
      # Connects to the Brain for memory
      - MCP_SERVER_URL=http://claude-flow-brain:8080
      - REDIS_URL=redis://nyra-redis:6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
    networks:
      - nyra
    depends_on:
      - claude-flow-brain
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '1.0'
          memory: 2G
    logging: *default_logging
    labels:
      - "com.nyra.service=claude-flow-cicd"
      - "com.nyra.category=ci-worker"
