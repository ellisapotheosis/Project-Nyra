packages:
  - apps/*
  - apps/*/*
  - apps/*/*/*
  - services/*
  - services/*/*
  - packages/*
  - tools/*
  - mcp-servers/*
  - '!apps/ingestion/**'
  - '!docs/archive/**'
  - '!**/.next/**'
  - '!**/standalone/**'

allowBuilds:
  '@clerk/shared': true
  '@prisma/engines': true
  '@scarf/scarf': true
  aws-sdk: true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
  workerd: true

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - aws-sdk
  - bcrypt
  - better-sqlite3
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp
  - tesseract.js
  - unrs-resolver
