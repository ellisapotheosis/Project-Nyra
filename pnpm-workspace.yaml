packages:
  - apps/*
  - apps/*/*
  - apps/*/*/*
  - services/*
  - services/*/*
  - packages/*
  - tools/*
  - mcp-servers/*
  - "!apps/ingestion/**"
  - "!docs/archive/**"

allowBuilds:
  "@clerk/shared": false
  "@prisma/engines": false
  "@scarf/scarf": false
  aws-sdk: false
  bcrypt: false
  better-sqlite3: false
  esbuild: false
  msgpackr-extract: false
  msw: false
  prisma: false
  sharp: false
  tesseract.js: false
  unrs-resolver: false
  workerd: false

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - "@scarf/scarf"
  - aws-sdk
  - bcrypt
  - better-sqlite3
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp
  - tesseract.js
  - unrs-resolver
