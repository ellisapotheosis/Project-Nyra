packages:
  - apps/*
  - apps/*/*
  - apps/*/*/*
  - services/*
  - services/*/*
  - packages/*
  - tools/*
  - mcp-servers/*
  - '!apps/ingestion/**'
  - '!docs/archive/**'
  - '!**/.next/**'
  - '!**/standalone/**'

allowBuilds:
  '@clerk/shared': true
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': true
  aws-sdk: true
  bcrypt: true
  better-sqlite3: true
  esbuild: true
  msgpackr-extract: true
  msw: true
  prisma: true
  sharp: true
  tesseract.js: true
  unrs-resolver: true
  workerd: true

minimumReleaseAgeExclude:
  - '@radix-ui/primitive@1.1.6'
  - '@radix-ui/react-avatar@1.2.3'
  - '@radix-ui/react-presence@1.1.8'
  - '@radix-ui/react-scroll-area@1.2.15'

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - '@scarf/scarf'
  - aws-sdk
  - bcrypt
  - better-sqlite3
  - esbuild
  - msgpackr-extract
  - prisma
  - protobufjs
  - sharp
  - tesseract.js
  - unrs-resolver
