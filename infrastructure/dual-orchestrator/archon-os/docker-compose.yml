version: '3.9'

services:
  archon-os:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archon-os
    hostname: archon-os
    restart: unless-stopped
    networks:
      - orchestrator-network
    ports:
      - "${ARCHON_API_PORT:-8092}:8092"
      - "${ARCHON_METRICS_PORT:-8093}:8093"
    environment:
      # Core Configuration
      ARCHON_ENV: ${ARCHON_ENV:-production}
      ARCHON_DEBUG: ${ARCHON_DEBUG:-false}
      ARCHON_LOG_LEVEL: ${ARCHON_LOG_LEVEL:-info}

      # Database Configuration
      DATABASE_URL: postgresql://${POSTGRES_USER:-archon}:${POSTGRES_PASSWORD:-archon_secure_pass}@archon-postgres:5432/${POSTGRES_DB:-archon_os}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      DATABASE_MAX_OVERFLOW: ${DATABASE_MAX_OVERFLOW:-40}

      # Redis Configuration
      REDIS_URL: redis://archon-redis:6379/0
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_MAX_CONNECTIONS: ${REDIS_MAX_CONNECTIONS:-50}

      # Message Queue (RabbitMQ)
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-archon}:${RABBITMQ_PASSWORD:-archon_queue_pass}@archon-rabbitmq:5672/
      RABBITMQ_EXCHANGE: ${RABBITMQ_EXCHANGE:-archon-exchange}
      RABBITMQ_QUEUE: ${RABBITMQ_QUEUE:-archon-tasks}

      # LiteLLM Proxy
      LITELLM_PROXY_URL: ${LITELLM_PROXY_URL:-http://litellm-proxy:8000}
      LITELLM_API_KEY: ${LITELLM_API_KEY:-}

      # Claude API (fallback)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}

      # OpenAI API (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}

      # MCP Configuration
      MCP_ENABLED: ${MCP_ENABLED:-true}
      MCP_SERVER_URL: ${MCP_SERVER_URL:-http://archon-os:8092/mcp}
      MCP_TRANSPORT: ${MCP_TRANSPORT:-sse}

      # Claude Flow Integration
      CLAUDE_FLOW_ENABLED: ${CLAUDE_FLOW_ENABLED:-true}
      CLAUDE_FLOW_HOOKS: ${CLAUDE_FLOW_HOOKS:-true}
      CLAUDE_FLOW_MEMORY_ENABLED: ${CLAUDE_FLOW_MEMORY_ENABLED:-true}

      # Agent Configuration
      MAX_AGENTS: ${MAX_AGENTS:-50}
      AGENT_TIMEOUT: ${AGENT_TIMEOUT:-300}
      AGENT_MAX_RETRIES: ${AGENT_MAX_RETRIES:-3}
      AGENT_CHECKPOINT_INTERVAL: ${AGENT_CHECKPOINT_INTERVAL:-60}

      # Swarm Configuration
      SWARM_TOPOLOGY: ${SWARM_TOPOLOGY:-mesh}
      SWARM_MAX_CONCURRENT_TASKS: ${SWARM_MAX_CONCURRENT_TASKS:-10}
      SWARM_COORDINATION_MODE: ${SWARM_COORDINATION_MODE:-adaptive}

      # Security
      API_KEY: ${ARCHON_API_KEY:-}
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600}
      ENABLE_AUTH: ${ENABLE_AUTH:-true}

      # Monitoring
      PROMETHEUS_ENABLED: ${PROMETHEUS_ENABLED:-true}
      METRICS_PORT: 8093
      TRACING_ENABLED: ${TRACING_ENABLED:-false}

      # Performance
      WORKER_PROCESSES: ${WORKER_PROCESSES:-4}
      WORKER_CONNECTIONS: ${WORKER_CONNECTIONS:-1000}
      GRACEFUL_TIMEOUT: ${GRACEFUL_TIMEOUT:-30}

    volumes:
      - archon-data:/opt/archon/data
      - archon-logs:/opt/archon/data/logs
      - archon-agents:/opt/archon/data/agents
      - archon-sessions:/opt/archon/data/sessions
      - ./config:/opt/archon/config:ro
      - ./agent-templates:/opt/archon/agent-templates:ro
    depends_on:
      archon-postgres:
        condition: service_healthy
      archon-redis:
        condition: service_healthy
      archon-rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8092/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    labels:
      - "archon.service=orchestrator"
      - "archon.version=1.0.0"
      - "archon.type=core"
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G

  archon-postgres:
    image: postgres:16-alpine
    container_name: archon-postgres
    hostname: archon-postgres
    restart: unless-stopped
    networks:
      - orchestrator-network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-archon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-archon_secure_pass}
      POSTGRES_DB: ${POSTGRES_DB:-archon_os}
      POSTGRES_INITDB_ARGS: "-E UTF8 --locale=en_US.UTF-8"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - archon-postgres-data:/var/lib/postgresql/data
      - ./init-scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-archon} -d ${POSTGRES_DB:-archon_os}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '1'
          memory: 1G

  archon-redis:
    image: redis:7-alpine
    container_name: archon-redis
    hostname: archon-redis
    restart: unless-stopped
    networks:
      - orchestrator-network
    command: >
      redis-server
      --maxmemory 2gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    volumes:
      - archon-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 1G

  archon-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: archon-rabbitmq
    hostname: archon-rabbitmq
    restart: unless-stopped
    networks:
      - orchestrator-network
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-archon}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-archon_queue_pass}
      RABBITMQ_DEFAULT_VHOST: /
      RABBITMQ_VM_MEMORY_HIGH_WATERMARK: 1GB
    ports:
      - "${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    volumes:
      - archon-rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M

  archon-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: archon-worker
    hostname: archon-worker
    restart: unless-stopped
    networks:
      - orchestrator-network
    environment:
      # Inherit all environment variables from archon-os
      ARCHON_MODE: worker
    command: ["celery", "-A", "src.tasks.celery_app", "worker", "--loglevel=info", "--concurrency=4"]
    volumes:
      - archon-data:/opt/archon/data
      - archon-logs:/opt/archon/data/logs
      - ./config:/opt/archon/config:ro
    depends_on:
      - archon-os
      - archon-rabbitmq
      - archon-redis
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 4G
        reservations:
          cpus: '1'
          memory: 2G

networks:
  orchestrator-network:
    name: orchestrator-network
    external: true

volumes:
  archon-data:
    name: archon-data
  archon-logs:
    name: archon-logs
  archon-agents:
    name: archon-agents
  archon-sessions:
    name: archon-sessions
  archon-postgres-data:
    name: archon-postgres-data
  archon-redis-data:
    name: archon-redis-data
  archon-rabbitmq-data:
    name: archon-rabbitmq-data
