version: '3.8'

services:
  claude-flow:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: claude-flow-orchestrator
    hostname: claude-flow
    restart: unless-stopped

    environment:
      # Core Configuration
      - NODE_ENV=production
      - LOG_LEVEL=${LOG_LEVEL:-info}

      # LiteLLM Integration
      - LITELLM_BASE_URL=http://litellm:4000
      - LITELLM_API_KEY=${LITELLM_API_KEY}
      - LITELLM_MODEL=${LITELLM_MODEL:-gpt-4}

      # MetaMCP Integration
      - METAMCP_URL=http://metamcp:12008
      - METAMCP_API_KEY=${METAMCP_API_KEY}

      # RabbitMQ Configuration
      - RABBITMQ_HOST=rabbitmq
      - RABBITMQ_PORT=5672
      - RABBITMQ_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_PASSWORD=${RABBITMQ_PASSWORD}
      - RABBITMQ_VHOST=${RABBITMQ_VHOST:-/}
      - RABBITMQ_EXCHANGE=${RABBITMQ_EXCHANGE:-orchestrator-exchange}

      # Redis Configuration (for shared state)
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - REDIS_DB=1

      # Prometheus Metrics
      - METRICS_ENABLED=true
      - METRICS_PORT=8091
      - METRICS_PATH=/metrics

      # Claude-Flow Specific
      - CLAUDE_FLOW_PORT=8090
      - CLAUDE_FLOW_HOST=0.0.0.0
      - CLAUDE_FLOW_MAX_AGENTS=${MAX_AGENTS:-10}
      - CLAUDE_FLOW_TOPOLOGY=${TOPOLOGY:-mesh}
      - CLAUDE_FLOW_STRATEGY=${STRATEGY:-balanced}

      # Anthropic API (if direct access needed)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}

      # Session Management
      - SESSION_TTL=${SESSION_TTL:-3600}
      - SESSION_CLEANUP_INTERVAL=${SESSION_CLEANUP_INTERVAL:-300}

      # Memory Configuration
      - MEMORY_BACKEND=redis
      - MEMORY_TTL=${MEMORY_TTL:-86400}

      # Hooks Configuration
      - HOOKS_ENABLED=true
      - HOOKS_PRE_TASK=true
      - HOOKS_POST_TASK=true
      - HOOKS_POST_EDIT=true
      - HOOKS_SESSION_RESTORE=true

    ports:
      - "8090:8090"  # Claude-Flow API
      - "8091:8091"  # Prometheus metrics

    volumes:
      # Persistent data
      - claude-flow-data:/app/data
      - claude-flow-logs:/app/logs
      - claude-flow-sessions:/app/sessions
      - claude-flow-memory:/app/memory

      # Configuration
      - ./config:/app/config:ro

      # Shared workspace with Archon OS
      - shared-workspace:/workspace

    networks:
      - orchestrator-network

    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
      litellm:
        condition: service_healthy
      metamcp:
        condition: service_started

    labels:
      - "com.docker.compose.project=dual-orchestrator"
      - "orchestrator.type=claude-flow"
      - "orchestrator.role=ai-coordination"

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8090/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # RabbitMQ for inter-orchestrator messaging
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: rabbitmq-orchestrator
    hostname: rabbitmq
    restart: unless-stopped

    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER:-admin}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
      - RABBITMQ_DEFAULT_VHOST=${RABBITMQ_VHOST:-/}

    ports:
      - "5672:5672"   # AMQP
      - "15672:15672" # Management UI

    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
      - rabbitmq-logs:/var/log/rabbitmq

    networks:
      - orchestrator-network

    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

  # Redis for shared state and memory
  redis:
    image: redis:7-alpine
    container_name: redis-orchestrator
    hostname: redis
    restart: unless-stopped

    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --appendonly yes

    ports:
      - "6379:6379"

    volumes:
      - redis-data:/data

    networks:
      - orchestrator-network

    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  orchestrator-network:
    name: orchestrator-network
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  claude-flow-data:
    name: claude-flow-data
  claude-flow-logs:
    name: claude-flow-logs
  claude-flow-sessions:
    name: claude-flow-sessions
  claude-flow-memory:
    name: claude-flow-memory
  rabbitmq-data:
    name: rabbitmq-data
  rabbitmq-logs:
    name: rabbitmq-logs
  redis-data:
    name: redis-data
  shared-workspace:
    name: shared-workspace
    external: true
