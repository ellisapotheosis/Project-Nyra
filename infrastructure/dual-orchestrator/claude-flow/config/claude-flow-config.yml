# Claude-Flow Orchestrator Configuration
# Integrates with LiteLLM, MetaMCP, and Archon OS

version: "2.0.0"

# Server Configuration
server:
  host: "0.0.0.0"
  port: 8090
  cors:
    enabled: true
    origins:
      - "http://localhost:*"
      - "http://archon-os:*"
      - "http://metamcp:*"

  # Rate limiting
  rateLimit:
    enabled: true
    windowMs: 60000
    maxRequests: 100

# LiteLLM Integration
litellm:
  baseUrl: "http://litellm:4000"
  apiKey: "${LITELLM_API_KEY}"
  defaultModel: "${LITELLM_MODEL:-gpt-4}"

  # Model routing configuration
  models:
    - name: "gpt-4"
      provider: "litellm"
      endpoint: "/v1/chat/completions"
      maxTokens: 8192

    - name: "claude-3-opus"
      provider: "litellm"
      endpoint: "/v1/chat/completions"
      maxTokens: 4096

    - name: "claude-sonnet-4-5"
      provider: "litellm"
      endpoint: "/v1/chat/completions"
      maxTokens: 8192

  # Retry configuration
  retry:
    maxRetries: 3
    backoffMultiplier: 2
    initialDelay: 1000

  # Timeout configuration
  timeout:
    connection: 10000
    request: 300000

# MetaMCP Integration
metamcp:
  url: "http://metamcp:12008"
  apiKey: "${METAMCP_API_KEY}"

  # MCP server configurations
  servers:
    - name: "filesystem"
      enabled: true
      endpoint: "/mcp/filesystem"

    - name: "github"
      enabled: true
      endpoint: "/mcp/github"

    - name: "memory"
      enabled: true
      endpoint: "/mcp/memory"

    - name: "knowledge-graph"
      enabled: true
      endpoint: "/mcp/knowledge-graph"

  # Connection pooling
  pool:
    minConnections: 2
    maxConnections: 10
    idleTimeout: 30000

# Swarm Configuration
swarm:
  # Default topology
  defaultTopology: "mesh"
  availableTopologies:
    - "mesh"
    - "hierarchical"
    - "ring"
    - "star"

  # Agent management
  agents:
    maxAgents: 10
    defaultStrategy: "balanced"

    # Agent types
    types:
      - name: "researcher"
        maxInstances: 3
        capabilities:
          - "web-search"
          - "document-analysis"
          - "data-gathering"

      - name: "coder"
        maxInstances: 5
        capabilities:
          - "code-generation"
          - "code-review"
          - "refactoring"

      - name: "tester"
        maxInstances: 3
        capabilities:
          - "test-generation"
          - "test-execution"
          - "coverage-analysis"

      - name: "reviewer"
        maxInstances: 2
        capabilities:
          - "code-review"
          - "security-audit"
          - "quality-analysis"

  # Task orchestration
  orchestration:
    defaultPriority: "medium"
    defaultStrategy: "adaptive"
    maxConcurrentTasks: 20
    taskTimeout: 300000

# RabbitMQ Message Queue
rabbitmq:
  host: "rabbitmq"
  port: 5672
  username: "${RABBITMQ_USER}"
  password: "${RABBITMQ_PASSWORD}"
  vhost: "${RABBITMQ_VHOST}"

  # Exchange configuration
  exchange:
    name: "orchestrator-exchange"
    type: "topic"
    durable: true

  # Queue configuration
  queues:
    - name: "claude-flow-tasks"
      routingKey: "claudeflow.tasks.*"
      durable: true
      prefetch: 5

    - name: "claude-flow-events"
      routingKey: "claudeflow.events.*"
      durable: true
      prefetch: 10

    - name: "archon-bridge"
      routingKey: "archon.#"
      durable: true
      prefetch: 5

  # Connection settings
  connection:
    heartbeat: 60
    reconnectDelay: 5000
    maxReconnectAttempts: 10

# Redis Memory Backend
redis:
  host: "redis"
  port: 6379
  password: "${REDIS_PASSWORD}"
  db: 1

  # Key prefixes
  keyPrefix: "claudeflow:"

  # TTL settings
  ttl:
    sessions: 3600
    memory: 86400
    cache: 1800

  # Connection pool
  pool:
    min: 2
    max: 10

# Memory Management
memory:
  backend: "redis"

  # Memory types
  stores:
    - name: "session"
      ttl: 3600
      maxSize: 1048576  # 1MB

    - name: "swarm"
      ttl: 86400
      maxSize: 10485760  # 10MB

    - name: "agent"
      ttl: 43200
      maxSize: 5242880  # 5MB

  # Cleanup configuration
  cleanup:
    enabled: true
    interval: 300
    maxAge: 86400

# Hooks Configuration
hooks:
  enabled: true

  # Pre-task hooks
  preTask:
    enabled: true
    commands:
      - "npx claude-flow@alpha hooks pre-task --description '{{description}}'"
      - "npx claude-flow@alpha hooks session-restore --session-id '{{sessionId}}'"

  # Post-task hooks
  postTask:
    enabled: true
    commands:
      - "npx claude-flow@alpha hooks post-task --task-id '{{taskId}}'"
      - "npx claude-flow@alpha hooks session-end --export-metrics true"

  # Post-edit hooks
  postEdit:
    enabled: true
    commands:
      - "npx claude-flow@alpha hooks post-edit --file '{{file}}' --memory-key 'swarm/{{agent}}/{{step}}'"

  # Notification hooks
  notify:
    enabled: true
    channels:
      - "rabbitmq"
      - "redis"

# Metrics & Monitoring
metrics:
  enabled: true
  port: 8091
  path: "/metrics"

  # Prometheus configuration
  prometheus:
    enabled: true
    prefix: "claude_flow_"

    # Metrics to collect
    collect:
      - "http_requests_total"
      - "http_request_duration_seconds"
      - "agent_tasks_total"
      - "agent_task_duration_seconds"
      - "swarm_agents_active"
      - "memory_usage_bytes"
      - "queue_messages_total"

  # Health check
  health:
    enabled: true
    path: "/health"
    interval: 30

# Logging Configuration
logging:
  level: "${LOG_LEVEL:-info}"
  format: "json"

  # Log outputs
  outputs:
    - type: "console"
      enabled: true

    - type: "file"
      enabled: true
      path: "/app/logs/claude-flow.log"
      maxSize: "100m"
      maxFiles: 10

    - type: "rabbitmq"
      enabled: true
      routingKey: "claudeflow.logs"

  # Log categories
  categories:
    - name: "api"
      level: "info"

    - name: "swarm"
      level: "debug"

    - name: "hooks"
      level: "debug"

    - name: "memory"
      level: "info"

# Security Configuration
security:
  # API key authentication
  apiKey:
    enabled: true
    header: "X-API-Key"

  # CORS
  cors:
    enabled: true
    methods:
      - "GET"
      - "POST"
      - "PUT"
      - "DELETE"
    headers:
      - "Content-Type"
      - "Authorization"
      - "X-API-Key"

  # Rate limiting
  rateLimit:
    enabled: true
    points: 100
    duration: 60

# Integration with Archon OS
archonIntegration:
  enabled: true
  url: "http://archon-os:8080"

  # Shared workspace
  workspace:
    path: "/workspace"
    syncInterval: 60

  # Event forwarding
  events:
    forward: true
    topics:
      - "task.completed"
      - "agent.spawned"
      - "swarm.initialized"

# Feature Flags
features:
  neuralTraining: true
  autoSpawning: true
  selfHealing: true
  crossSessionMemory: true
  githubIntegration: true
  performanceAnalysis: true
