preToolUse:
  - name: safer-shell
    match: { tool: "Bash" }
    mutate:
      denyPatterns: [" rm -rf /", ":(){ :|:& };:"]
      upgradeFlags:
        - match: "^rm "
          replace: "rm -i "
  - name: git-signed-commits
    match: { tool: "Bash", argsContains: "git commit" }
    mutate: { argsAppend: " -S" }

postToolUse:
  - name: reasoning-checkpoint
    run: "git add -A && git commit -m 'nyra(auto): ${tool} :: ${summary}' || true"
