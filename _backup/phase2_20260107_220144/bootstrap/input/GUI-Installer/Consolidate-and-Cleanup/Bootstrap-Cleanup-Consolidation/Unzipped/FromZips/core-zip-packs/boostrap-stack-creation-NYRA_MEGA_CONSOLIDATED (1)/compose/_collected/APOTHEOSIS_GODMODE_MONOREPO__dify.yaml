
name: apotheosis-dify
services:
  dify:
    image: langgenius/dify:latest
    ports: ["${DIFY_PORT:-8080}:3000"]
    depends_on: [dify-db]
  dify-db:
    image: postgres:15
    environment:
      POSTGRES_PASSWORD: dify
      POSTGRES_USER: dify
      POSTGRES_DB: dify
    volumes:
      - ./docker-data/dify-postgres:/var/lib/postgresql/data
    ports: ["5441:5432"]
networks:
  default:
    name: apotheosis-net
